# vg-data package: the Phase-3 REACTION UNIVERSE (generated — do not hand-edit values;
# regenerate with `python -m viva_genesis.protometabolism.universe`).
name: reaction_universe
version: '1'
description: 'Phase-3 open chemical network: Wolos-2020-style reaction rules over linear C/H/O skeletons (C1-C3
  feedstock, products capped at C6), eQuilibrator component-contribution dG'' potentials at the Phase-1 posterior
  vent condition, catalyst-class requirements with a saturating site pool, degradation and washout. Generated by
  viva_genesis.protometabolism.universe.build_package on 2026-10-17.'
sources:
- wolos2020synthetic
- blokhuis2020universal
- beber2022equilibrator
- noor2013consistent
- breslow1959mechanism
- muchowska2017metals
- muchowska2019synthesis
- maslov2002specificity
parameters:
- id: max_carbons
  units: dimensionless
  provenance: hypothetical
  value: 4
  context:
    scope: C1-C3 feedstock; rule products capped at C4
  sources:
  - wolos2020synthetic
  how_to_use: 'Rule-set scope (expert decision open): C<=4 lets the formose (C4 retro-aldol) and reductive-carboxylation
    chemistry close while keeping the network ~400 reactions. N/P-bearing rules are NOT in this package.'
  consumed_by: ReactionUniverseProcess.max_carbons
- id: k_co2_reduction
  units: 1/molar/second
  provenance: extrapolated
  value: 2.0
  context:
    rule: co2_reduction
    catalyst: mineral
  sources:
  - preiner2020hydrogen
  how_to_use: CO2 + H2 -> formate on awaruite / magnetite (Preiner 2020 yields are the anchor), carried to the og-02
    tick scale.
  distribution:
    kind: loguniform
    low: 0.2
    high: 20.0
  consumed_by: ReactionUniverseProcess.k_co2_reduction
- id: k_reduce
  units: 1/molar/second
  provenance: hypothetical
  value: 10.0
  context:
    rule: reduce_carbonyl
    catalyst: mineral
  sources:
  - muchowska2017metals
  - muchowska2019synthesis
  how_to_use: Second-order H2 reduction of aldehydes/ketones on Fe/Ni mineral surfaces; order-of-magnitude on the
    og-02 tick scale.
  distribution:
    kind: loguniform
    low: 1.0
    high: 100.0
  consumed_by: ReactionUniverseProcess.k_reduce
- id: k_reduce_carboxyl
  units: 1/second
  provenance: hypothetical
  value: 0.01
  context:
    rule: reduce_carboxyl
    catalyst: mineral
    note: rate of the EXERGONIC direction (aldehyde + H2O -> acid + H2)
  sources: []
  how_to_use: 'Carboxyl <-> aldehyde is the hardest reductive step: the downhill aldehyde oxidation is slow (aldehydes
    are kinetically metastable) and the uphill acid reduction follows from detailed balance — formaldehyde is reachable
    only by feed, the known C1 bottleneck.'
  distribution:
    kind: loguniform
    low: 0.001
    high: 0.1
  consumed_by: ReactionUniverseProcess.k_reduce_carboxyl
- id: k_formose_init
  units: 1/molar/second
  provenance: extrapolated
  value: 0.01
  context:
    rule: formose_initiation
    catalyst: base
  sources:
  - breslow1959mechanism
  how_to_use: The slow umpolung initiation 2 CH2O -> glycolaldehyde that seeds the formose cycle (orders slower
    than the aldol propagation).
  distribution:
    kind: loguniform
    low: 0.001
    high: 0.1
  consumed_by: ReactionUniverseProcess.k_formose_init
- id: k_deoxygenate
  units: 1/molar/second
  provenance: hypothetical
  value: 0.5
  context:
    rule: deoxygenate
    catalyst: mineral
  sources:
  - muchowska2017metals
  how_to_use: Alcohol -> alkane with H2 (the slowest reductive step).
  distribution:
    kind: loguniform
    low: 0.05
    high: 5.0
  consumed_by: ReactionUniverseProcess.k_deoxygenate
- id: k_carboxylate
  units: 1/molar/second
  provenance: extrapolated
  value: 50.0
  context:
    rule: carboxylate_alpha
    catalyst: mineral
  sources:
  - muchowska2019synthesis
  how_to_use: Enol carboxylation (pyruvate + CO2 -> OAA); og-02 used k_carb = 50 for the same step — carried over.
  distribution:
    kind: loguniform
    low: 5.0
    high: 500.0
  consumed_by: ReactionUniverseProcess.k_carboxylate
- id: k_carboxylate_reductive
  units: 1/second
  provenance: hypothetical
  value: 0.02
  context:
    rule: carboxylate_reductive
    catalyst: mineral
    note: rate of the EXERGONIC direction (oxidative decarboxylation of the 2-oxo acid)
  sources:
  - muchowska2019synthesis
  how_to_use: Reductive carboxylation of a carboxylate with CO2 + H2 (ferredoxin-type chemistry) is uphill at vent
    concentrations; its rate follows from the downhill oxidative-decarboxylation rate by detailed balance.
  distribution:
    kind: loguniform
    low: 0.002
    high: 0.2
  consumed_by: ReactionUniverseProcess.k_carboxylate_reductive
- id: k_aldol
  units: 1/molar/second
  provenance: extrapolated
  value: 100.0
  context:
    rule: aldol
    catalyst: base
  sources:
  - breslow1959mechanism
  - wolos2020synthetic
  how_to_use: Base-catalysed aldol addition (formose chemistry); the 1959 Breslow mechanism, rates extrapolated
    to the tick scale.
  distribution:
    kind: loguniform
    low: 10.0
    high: 1000.0
  consumed_by: ReactionUniverseProcess.k_aldol
- id: k_isomerize
  units: 1/second
  provenance: extrapolated
  value: 0.05
  context:
    rule: isomerize
