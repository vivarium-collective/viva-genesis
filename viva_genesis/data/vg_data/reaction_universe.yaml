  distribution:
    kind: loguniform
    low: 0.001
    high: 0.1
  consumed_by: ReactionUniverseProcess.K_sat
- id: k_deg
  units: 1/second
  provenance: extrapolated
  value: 0.001
  context:
    note: lumped tar formation / hydrolysis
  sources:
  - wolos2020synthetic
  how_to_use: First-order degradation of every organic species to a tar sink (side-reaction loss not captured by
    the rules).
  distribution:
    kind: loguniform
    low: 0.0001
    high: 0.01
  consumed_by: ReactionUniverseProcess.k_deg
- id: aldehyde_degradation_factor
  units: dimensionless
  provenance: hypothetical
  value: 5.0
  context: {}
  sources:
  - breslow1959mechanism
  how_to_use: Aldehydes degrade faster (polymerisation / caramelisation).
  consumed_by: ReactionUniverseProcess.aldehyde_degradation_factor
- id: k_wash
  units: 1/second
  provenance: inferred
  value: 0.05
  context:
    model: CSTR dilution
  sources: []
  how_to_use: og-02's washout rate; the feed-vs-washout axis of the ignition map.
  distribution:
    kind: loguniform
    low: 0.002
    high: 1.0
  consumed_by: ReactionUniverseProcess.k_wash
- id: k_feed
