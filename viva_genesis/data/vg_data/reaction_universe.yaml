  provenance: extrapolated
  value: 0.02
  context:
    rule: decarboxylate_alpha / decarboxylate_beta
    catalyst: none
  sources:
  - muchowska2019synthesis
  how_to_use: Thermal alpha-/beta-keto-acid decarboxylation; first order.
  distribution:
    kind: loguniform
    low: 0.002
    high: 0.2
  consumed_by: ReactionUniverseProcess.k_decarboxylate
- id: k_cannizzaro
