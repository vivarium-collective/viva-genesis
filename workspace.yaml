schema_version: 2
name: viva-genesis
created: "2026-10-11"
plugin_version: 0.4.16
package_path: viva_genesis

# Directory layout. New workspaces group their research directories under a
# tidy `workspace/` subtree (the dirs below); the hidden `.pbg/` machine state
# stays at the root like `.git/`. Tooling (dashboard, lint, skills) resolves
# these via the shared WorkspacePaths resolver. Any key you remove falls back
# to its flat top-level default — so you can move things back if you prefer.
layout:
  studies: workspace/studies
  investigations: workspace/investigations
  composites: workspace/composites
  references: workspace/references
  datasets: workspace/datasets
  reports: workspace/reports

# The four arrays below start empty; the dashboard populates them as you
# work. Hand-editing is fine for small adds, but the dashboard's writers
# also keep cross-references (studies, runs, viz wiring) consistent.

# Observable specs: name + store_path + index_by. Populated by the Studies
# tab when you declare a behavior_test or readout. See .pbg/schemas/study.schema.json
# (readouts section) for shape.
observables: []

# Visualization wiring (address + config). Populated by the Visualizations
# tab and /viva-viz.
visualizations: []

# Reproducible simulation specs (composite + steps + params). Populated by
# the Composites tab "Run" button and by `/viva-study run-baseline`.
simulations: []

# Workspace-scoped datasets (file path + format + provenance). Populated by
# the Inputs tab "Attach dataset" action.
datasets: []

references_bib: workspace/references/papers.bib

# Imported genuine-simulator wrappers — the real engines this campaign reuses
# instead of wrapping internally. They surface as IMPORTED repos in the
# workbench Catalog.
imports:
  viva-equilibrator:
    source: https://github.com/vivarium-collective/viva-equilibrator.git
    ref: v0.1.0
    mode: reference
    package: viva_equilibrator
    description: >-
      eQuilibrator component-contribution ΔG' engine — the transformed-Gibbs
      feasibility gate (EquilibratorThermoStep) for og-01 carbon fixation.
  viva-tellurium:
    source: https://github.com/vivarium-collective/viva-tellurium.git
    ref: v0.1.2
    mode: reference
    package: viva_tellurium
    description: >-
      Tellurium / libRoadRunner SBML engine — drives the og-02 curated-rTCA
      reaction-network CSTR (RoadRunnerNetworkProcess) via the imported loader.
  viva-fenics:
    source: https://github.com/vivarium-collective/viva-fenics.git
    ref: v0.1.0
    mode: reference
    package: viva_fenics
    description: >-
      dolfinx FEM advection-diffusion-Soret solver + the two face-conforming
      spatial-transport classes (FenicsReactiveTransportProcess,
      FenicsThermophoreticTrapProcess) — the plan-4.5 high-fidelity cross-check.
  viva-openmm:
    source: https://github.com/vivarium-collective/viva-openmm.git
    ref: main
    mode: reference
    package: viva_openmm
    description: >-
      Martini 3 coarse-grained MD engine (OpenMM + martini_openmm) — the
      OpenMMMartiniProcess bilayer-assembly run for og-31 (membrane extra; the
      "makes a membrane" half of Gate C).

# Expert documents — source dossiers that ground the campaign. Rendered on the
# Resources page (workspace-inputs) and searchable via the expert-doc tools.
# Kept here (not in .gitignore) so future prompts can reference the originals.
expert_docs:
  - name: Origins-of-Life Simulation Campaign
    path: workspace/references/expert/origins-of-life-simulation-campaign.pdf
    sha256: 389efd987c42f76afceff64578b7bf500e5015cc611a8389c48e70bb4e4558d5
    contributor: agmon.eran@gmail.com
    description: >-
      Research dossier (11 Oct 2026): the deep-sea serpentinization-driven
      alkaline-vent hypothesis as a staged, falsifiable Vivarium campaign —
      scientific framing + hypothesis graph, mechanistic modules A–J, the
      quantitative parameter/provenance table, process-bigraph architecture,
      Campaigns 0–VIII, discriminating experiments and the 35-reference
      annotated library. Source for workspace/notes/ and references/papers.bib.
  - name: Origins-of-Life Computational Methods Atlas
    path: workspace/references/expert/origins-of-life-computational-methods-atlas.pdf
    sha256: 5a478b3380621132d75e68e085b5caf108b0d9efee47fd175fea800234ff5269
    contributor: agmon.eran@gmail.com
    description: >-
      Companion implementation dossier (11 Oct 2026): executable engines,
      numerical methods, chemical/biological databases, interoperability
      standards, the stage→engine map, model-hierarchy tiers, integration
      contracts and a 12-month roadmap. Source for
      workspace/references/computational-resources.md.
  - name: Full Modeling Plan
    path: workspace/references/expert/viva-genesis-full-modeling-plan.pdf
    sha256: b966481221f38bc6b6cd6413b2fe216a897f91c44c1ee6585bb50fc639c76140
    contributor: agmon.eran@gmail.com
    description: >-
      Process-bigraph architecture plan (13 Oct 2026): do not start with a cell —
      build a geological world in which biological organization emerges and the
      Process Bigraph itself restructures (localization, boundary formation,
      growth/division, extinction, conditional heredity, ecology). Stages 0–VIII
      with model classes per stage, cross-cutting C-N-P + proto-energetics, nine
      reusable composites, canonical biological schemas, model substitution as
      experiment, experimental-design rules and the section-18 implementation
      order. Source for workspace/references/full-modeling-plan-integration.md.

  - name: Model Upgrade and Implementation Plan
    path: workspace/references/expert/viva-genesis-model-upgrade-and-implementation-plan.pdf
    sha256: 455d8c84880f299b5621524a5e3dd3252c6e7b21ab3d3f75920f93a1c7c9b786
    contributor: agmon.eran@gmail.com
    description: >-
      Roadmap (14 Oct 2026) for replacing assumption-driven stages with calibrated
      mechanistic model families: the three-quantity standard (feasibility /
      robustness / discrimination) + evidence tiers, serious model upgrades per
      stage (priority upgrades A-H), cross-cutting UQ methods, the Process
      Bigraph principle (canonical interfaces; model class as a categorical
      factor; one persistent world with structural rewrites), the vg-data
      provenance layer, the nine-phase implementation roadmap and the vg-*
      deliverables. Source for workspace/references/model-upgrade-integration.md.

# Baseline run length used by the dashboard's "Run" flow (study_runs falls back
# to 5 ticks otherwise — too few for the Campaign-0 reactor to settle into the
# Lost City window). 120 ticks settles T/pH comfortably within the field window.
runtime:
  default_n_steps: 120

server:
  enabled: false
