/* ====================== FINDING-FIRST SYNTHESIS (upgrade) ====================== */
// All sections below render the deterministic cross-study synthesis assembled
// server-side in lib.investigation_report._build_synthesis (inv.synthesis). No
// invented prose — every line composes authored claims/findings/verdicts/edges.
function _gradeStyle(g){
  return ({supported:['supported','#065f46','#d1fae5'],met:['met','#065f46','#d1fae5'],
    qualified:['qualified','#92400e','#fef3c7'],conditional:['conditional','#92400e','#fef3c7'],
    refuted:['refuted','#991b1b','#fee2e2'],unsupported:['unsupported','#991b1b','#fee2e2'],
    contested:['contested','#991b1b','#fee2e2'],pending:['pending','#475569','#eef2f7'],
    inconclusive:['inconclusive','#475569','#eef2f7']})[g] || [String(g||'—'),'#475569','#eef2f7'];
}
function _gradeChip(g){ const m=_gradeStyle(g);
  return `<span style="display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:9999px;color:${m[1]};background:${m[2]}">${esc(m[0])}</span>`; }
function _studyLink(slug,title){ return `<a href="#s-${esc(slug)}" style="color:var(--accent);text-decoration:none" title="${esc(title||slug)}">${esc(title||slug)}</a>`; }

/* ---- Figure-first helpers: bring the real figures UP into the main report.
   A study's figures live on inv.studies[].figures_embedded[]
   ({name, data_uri (raster) | html (+interactive=Plotly) | skipped}). We resolve
   a renderable one and embed it beside the finding it supports — not just name it.
   An interactive (Plotly) figure also appears in the supplement study card, so we
   rewrite its plot id on the main copy to avoid a duplicate-id collision. */
const _FIG_USED=new Set();   // (slug|name) already shown — don't repeat hero in a stage
let   _FIG_BUDGET=7;         // stage figures beyond the hero; the rest stay in the supplement
let   _FIG_UID=0;
function _figResolve(inv, slug, name){
  const st=(inv.studies||[]).find(x=>x.slug===slug); if(!st) return null;
  const imgs=(st.figures_embedded||[]).filter(i=>(i.data_uri||i.html) && !i.skipped);
  let im = name ? imgs.find(i=>i.name===name) : null;
  if(!im) im = imgs.find(i=>i.data_uri && !_FIG_USED.has(slug+'|'+i.name))
            || imgs.find(i=>!_FIG_USED.has(slug+'|'+i.name)) || null;
  return im;
}
function _uniquePlotly(html){
  const m=String(html||'').match(/Plotly\.newPlot\(\s*["']([^"']+)["']/);
  if(!m) return html; const id=m[1]; if(!id) return html;
  return String(html).split(id).join(id+'-m'+(_FIG_UID++));   // ids are hashes/UUIDs → safe split
}
function _figMarkup(im, slug, caption, hero){
  if(!im) return ''; _FIG_USED.add(slug+'|'+im.name);
  let body='', cls='main-fig';
  if(im.data_uri)
    body=`<img src="${im.data_uri}" alt="${esc(im.name||'')}" loading="lazy" style="width:100%;display:block;border:1px solid var(--line);border-radius:8px">`;
  else if(im.html && im.interactive){ cls='main-fig embedded-viz embedded-plotly';
    body=`<div class="plotly-holder">${_uniquePlotly(im.html)}</div>`; }
  else if(im.html)
    body=`<iframe class="viz-frame" srcdoc="${esc(im.html)}" loading="lazy" style="width:100%;border:1px solid var(--line);border-radius:8px;min-height:${hero?'420px':'300px'}" onload="try{this.style.height=(this.contentWindow.document.documentElement.scrollHeight+8)+'px';}catch(e){}"></iframe>`;
  if(!body) return '';
  const nm=(im.name)?`<b>${esc(im.name)}.</b> `:'';
  const cap=(caption||im.name)?`<figcaption class="measure" style="font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:5px">${nm}${caption||''}</figcaption>`:'';
  const fb=(typeof fbBubble==='function')?fbBubble('fig:'+slug+':'+(im.name||''), 'Figure — '+(im.name||slug)):'';
  return `<figure class="${cls} fbsection" style="margin:${hero?'12px 0 4px':'8px 0 2px'}">${fb}${body}${cap}</figure>`;
}
// The hero figure for the opening — the top-ranked figure, embedded in full.
function heroFigure(inv){
  const fr=(inv.synthesis||{}).figures_ranked||[]; if(!fr.length) return '';
  for(const top of fr){ const im=_figResolve(inv, top.slug, top.name); if(im){
    const cap=`${top.caption?esc(String(top.caption).slice(0,220)):''} <span style="color:var(--ink-3)">— ${_studyLink(top.slug,top.study_title)}</span>`;
    return _figMarkup(im, top.slug, cap, true);
  } }
  return '';
}
// Best figure for one finding-cluster/stage, embedded beside its findings.
// Budgeted: the first few principal stages get a figure in the main report; the
// rest are a link away in the supplement, keeping the main presentation-sized.
function stageFigure(inv, st){
  if(_FIG_BUDGET<=0) return '';
  for(const m of (st.studies||[])){ const im=_figResolve(inv, m.slug); if(im){
    _FIG_BUDGET--; return _figMarkup(im, m.slug, `<span style="color:var(--ink-3)">— ${esc(m.title||m.slug)}</span>`, false);
  } }
  return '';
}
// Scientific limitation/caveat for a study — the authored `limitations` field
// (34/39 studies), falling back to conclusion_logic / key_assumptions. This is
// the SCIENCE caveat (what the model doesn't capture), DISTINCT from the audit /
// publication-readiness signals shown in the Validation section.
function _limitationFor(inv, slug){
  const st=(inv.studies||[]).find(x=>x.slug===slug); if(!st) return '';
  const pick=v=>Array.isArray(v)?String(v[0]||'').trim():(typeof v==='string'?v.trim():'');
  return pick(st.limitations) || pick(st.conclusion_logic) || pick(st.key_assumptions) || '';
}
// Framing for a finding block: the driving question + the model/simulator methods
// of its lead study (the spec's "compact evidence panel" header).
function _studyFraming(inv, slug){
  const s=(inv.studies||[]).find(x=>x.slug===slug); if(!s) return null;
  const q=String(s.question||'').replace(/\s+/g,' ').trim();
  const m=Array.isArray(s.methods)?s.methods.slice(0,3).map(x=>String(x).trim()).filter(Boolean).join(' · ')
         :(typeof s.methods==='string'?s.methods.trim():'');
  return {question:q, methods:m, fidelity:String(s.fidelity||'').trim()};
}
// The lead study's limitation for a finding-cluster/stage (first with one).
function stageLimitation(inv, st){
  for(const m of (st.studies||[])){ const l=_limitationFor(inv, m.slug); if(l)
    return `<div class="measure" style="font-size:12.5px;color:var(--ink-2);line-height:1.45;margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line-2)"><b style="color:var(--ink)">Limitation.</b> ${esc(l)} <span style="font-size:11px;color:var(--ink-3)">— ${_studyLink(m.slug,m.title)}</span></div>`;
  }
  return '';
}

// 1. EXECUTIVE SUMMARY — question, current verdict, the honest gate ladder, and
// the run-status / evidence / claim separation (a passed gate ≠ a proven mechanism).
// First n sentences of a block of prose (deterministic — no rewriting).
// OPENING SYNTHESIS (plan §1): question → saved conclusion → milestone outcomes →
// one hero figure. The synthesis prose is shown IN FULL as one coherent block.
// (An earlier version split it into a 3-sentence lead + a "Full synthesis"
// remainder, but slicing the text by the trimmed lead length drifted with
// abbreviations/decimals and could start the remainder mid-word — simpler and
// safe to keep it together.)
function execSummary(inv){
  const syn=inv.synthesis||{}, c=syn.counts||{}, ex=inv.executive||{};
  const q=(inv.question||'').replace(/\s+/g,' ').trim();
  const verdict=(ex.verdict||'').trim();
  const gl=(syn.headline||[]).map(h=>{ const g=(h.status==='met')?'supported':h.status;
    return `<span style="display:inline-flex;gap:5px;align-items:center;margin:0 12px 7px 0;font-size:12.5px">`+
      `<span class="mono" style="font-weight:800">${esc(h.id||'')}</span> ${esc(h.name||'')} ${_gradeChip(g)}</span>`; }).join('');
  return `<div class="narr fbsection" id="exec-summary">${fbBubble('summary','Executive summary')}
    <div class="sec-h"><h2>Executive summary</h2><span class="rule"></span></div>
    ${q?`<p class="prose" style="font-size:16px;margin:2px 0 8px"><b>Question.</b> ${esc(q)}</p>`:''}
    ${verdict?`<div class="prose" style="font-size:15.5px">${mdLite(verdict)}</div>`:''}
    ${(ex.verdict_detail||'').trim()?`<div class="prose measure" style="font-size:14px;color:var(--ink-2);margin:6px 0 0">${mdLite(ex.verdict_detail)}</div>`:''}
    ${gl?`<div style="margin-top:12px"><div class="kicker" style="margin-bottom:6px">Milestone outcomes</div><div>${gl}</div></div>`:''}
    <p class="measure" style="color:var(--ink-2);font-size:12.5px;margin:12px 0 0;line-height:1.5">
      Across <b>${c.total||0}</b> studies — <b>${c.supported||0}</b> supported · <b>${c.qualified||0}</b> qualified · <b>${c.refuted||0}</b> refuted · <b>${c.planned||0}</b> planned.
      <i>Supported</i> = a computational gate passed under the stated model assumptions (evidence of feasibility, not proof the transition occurred).</p>
  </div>`;
}

// 3. INTEGRATED FINDINGS — grouped by scientific stage (not one chapter per study),
// with each stage's key quantitative findings and an explicit model-dependence flag.
// STUDIES — every study as a collapsible card (renderStudy): its question,
// verdict, and "what we learn" at a glance; expand for the full record. This is
// the main-body home for studies (renamed from "Findings") and reuses the card
// that used to live only in the supplement — so each study appears exactly once.
function renderStudies(inv){
  const studies=inv.studies||[]; if(!studies.length) return '';
  return `<div class="narr" id="studies">
    <div class="sec-h"><h2>Studies</h2><span class="rule"></span>
      <div class="studies-toolbar"><button id="expandall">Expand all</button><button id="collapseall">Collapse all</button></div></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:2px 0 10px">Every study in the campaign as a collapsible card — the question it tests, its verdict, and what it found at a glance. Click a card to expand the full record: model, runs, figures, tests, findings, and the limitations that bound it.</p>
    ${studies.map((s,i)=>renderStudy(s,inv,i+1)).join('')}</div>`;
}
function integratedFindings(inv){
  const sts=(inv.synthesis||{}).stages||[]; if(!sts.length) return '';
  const edges=((inv.synthesis||{}).continuity||{}).edges||[];
  const blocks=sts.map((st,i)=>{
    const studyChips=(st.studies||[]).map(m=>`<span style="display:inline-flex;gap:5px;align-items:center;margin:0 10px 5px 0;font-size:12px">${_studyLink(m.slug,m.title)} ${_gradeChip(m.grade)}${m.variant?' <span style="font-size:10px;color:var(--ink-3)">alt</span>':''}</span>`).join('');
    const md=st.model_dependence?`<div class="evnote" style="margin:8px 0"><b>Model dependence.</b> This result holds in one model class but not another at matched conditions — reported as model dependence, not two independent outcomes.</div>`:'';
    const finds=(st.findings||[]).filter(f=>f.statement).slice(0,5).map(f=>{
      const obs=f.observed?` <span class="mono" style="color:var(--ink-2)">[${esc(f.observed)}${f.units?' '+esc(f.units):''}]</span>`:'';
      const sIcon=(String(f.status||'').toLowerCase()==='contradicts'||String(f.status||'').toLowerCase()==='refutes')?'✗ ':(String(f.status||'').toLowerCase()==='confirms'?'✓ ':'');
      return `<li style="margin-top:5px">${sIcon}${esc(f.statement)}${obs} <span style="color:var(--ink-3);font-size:11px">— ${_studyLink(f.study,f.title)}</span></li>`;
    }).join('');
    // Framing header: the finding's driving question + how it was computed (lead study).
    const lead=(st.studies||[])[0]; const fr=_studyFraming(inv, lead&&lead.slug);
    const frame=fr?`${fr.question?`<div class="measure" style="font-size:12.5px;color:var(--ink-2);margin:5px 0 0"><b style="color:var(--ink)">Question.</b> ${esc(fr.question)}</div>`:''}${fr.methods?`<div class="measure" style="font-size:12px;color:var(--ink-3);margin:2px 0 0"><b style="color:var(--ink-2)">Methods.</b> ${esc(fr.methods)}${fr.fidelity?` <span style="font-size:10px;text-transform:uppercase;letter-spacing:.03em">· ${esc(fr.fidelity)} simulators</span>`:''}</div>`:''}`:'';
    // Narrative transition — only when a real dependency edge connects this stage to
    // the next (never inferred from titles): keeps the findings reading as a chain.
    let trans=''; const next=sts[i+1];
    if(next){ const mine=new Set((st.studies||[]).map(m=>m.slug)), nx=new Set((next.studies||[]).map(m=>m.slug));
      if(edges.some(e=>mine.has(e.from)&&nx.has(e.to)))
        trans=`<div class="measure" style="font-size:12px;color:var(--ink-3);font-style:italic;margin:12px 0 0">↓ builds toward <a href="#stage-${esc(next.key)}" style="color:var(--accent);font-style:normal">${esc(next.label)}</a></div>`;
    }
    return `<div class="fbsection" style="margin:22px 0 0" id="stage-${esc(st.key)}">${fbBubble('stage:'+st.key, 'Finding — '+(st.label||st.key))}
      <h3 style="font-size:16px;margin:0 0 2px">${esc(st.label)}</h3>
      <div style="margin:4px 0 2px">${studyChips}</div>
      ${frame}${md}
      ${stageFigure(inv, st)}
      ${finds?`<ul style="list-style:none;padding:0;margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink)">${finds}</ul>`:''}
      ${stageLimitation(inv, st)}
      ${trans}</div>`;
  }).join('');
  return `<div class="narr fbsection" id="integrated-findings">${fbBubble('findings','Integrated findings')}
    <div class="sec-h"><h2>Integrated findings</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:14px;margin:2px 0 6px">The campaign's results as a chain of findings. Each is framed by the question it tests and how it was computed, led by its figure, then its result and the limitation that bounds it; dependency links carry the narrative from one finding to the next.</p>
    ${blocks}</div>`;
}

// CROSS-STUDY QUANTITATIVE — comparable measured values pulled from findings.
function quantitativeSynthesis(inv){
  const qs=(inv.synthesis||{}).quantitative||[]; if(!qs.length) return '';
  const rows=qs.map(g=>{
    const r=(g.rows||[]).map(x=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:5px 12px 5px 0;color:var(--ink);vertical-align:top;font-size:12px;overflow-wrap:anywhere">${_studyLink(x.study,_titleOf(inv,x.study))}</td><td style="padding:5px 12px 5px 0;color:var(--ink-2);vertical-align:top;line-height:1.45">${esc(x.statement)}</td><td class="mono" style="padding:5px 0;vertical-align:top;overflow-wrap:anywhere;word-break:break-word;font-size:11px">${esc(x.observed||'')}${x.units?' '+esc(x.units):''}</td></tr>`).join('');
    return `<div style="margin-top:14px"><div class="kicker" style="margin-bottom:4px">${esc(g.stage)}</div>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed">
        <colgroup><col style="width:22%"><col style="width:44%"><col style="width:34%"></colgroup>${r}</table></div>`;
  }).join('');
  return `<div class="narr fbsection" id="quantitative">${fbBubble('quantitative','Quantitative synthesis')}
    <div class="sec-h"><h2>Cross-study quantitative synthesis</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13px;margin:2px 0 2px">Measured values reported across studies, with units. Values from different feeds/model classes are not directly comparable — read each with its study's conditions.</p>
    ${rows}</div>`;
}

// 4. CONTRADICTIONS & UNCERTAINTY — model disagreement, negative results, finding
// conflicts, competing frameworks, and the causal-continuity note (external feeds).
function contradictionsSection(inv){
  const syn=inv.synthesis||{}; const cs=syn.contradictions||[]; const cont=syn.continuity||{};
  if(!cs.length && !(cont.external_inputs||[]).length) return '';
  const kindLabel={ 'model-dependence':'Model dependence','negative-result':'Negative result','finding-conflict':'Finding conflict','competing-framework':'Competing framework' };
  const items=cs.map(c=>{
    const studies=(c.studies||[]).map(s=>`${_studyLink(s.slug,s.title)} ${_gradeChip(s.grade)}`).join(' · ');
    const disc=c.discriminating?`<div style="font-size:12px;color:var(--ink-2);margin-top:3px"><b>Discriminating next study:</b> ${esc(typeof c.discriminating==='string'?c.discriminating:(c.discriminating.study||c.discriminating.title||''))}</div>`:'';
    return `<li style="margin-top:10px;padding-left:12px;border-left:3px solid var(--line)">
      <div style="font-weight:600;color:var(--ink)"><span style="font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3)">${esc(kindLabel[c.kind]||c.kind)}</span> — ${esc(c.topic||'')}</div>
      ${c.detail?`<div class="measure" style="font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:2px">${esc(c.detail)}</div>`:''}
      ${studies?`<div style="font-size:12px;margin-top:3px">${studies}</div>`:''}${disc}</li>`;
  }).join('');
  const ext=(cont.external_inputs||[]);
  const extBlock=ext.length?`<div style="margin-top:14px"><div class="kicker" style="margin-bottom:4px">Causal continuity</div>
    <p class="measure" style="font-size:12.5px;color:var(--ink-2);margin:0 0 4px">These studies take their inputs from outside the chain (a supplied feed or reset state) rather than from an upstream study's output — so their result does not yet rest on a modeled upstream mechanism:</p>
    <div style="font-size:12.5px">${ext.map(e=>_studyLink(e.slug,e.title)).join(' · ')}</div></div>`:'';
  return `<div class="narr fbsection" id="contradictions">${fbBubble('contradictions','Contradictions & uncertainty')}
    <div class="sec-h"><h2>Contradictions &amp; uncertainty</h2><span class="rule"></span></div>
    ${items?`<ul style="list-style:none;padding:0;margin:4px 0 0">${items}</ul>`:''}${extBlock}</div>`;
}

// VALIDATION & REPRODUCIBILITY — reuses the existing deterministic needs-attention
// scan (invariant/conservation regressions, verdict divergence, reproducibility,
// param drift, phantom observables, AC coverage). No new checker; code-computed.
function validationSection(inv){
  const v=(inv.synthesis||{}).validation||{}; const items=v.items||[];
  const total=(v.summary&&v.summary.total)||items.length;
  const KM={diagnostic_branch_needed:'Diagnostic study needed',verdict_divergence:'Verdict divergence (computed ≠ authored)',
    invariant_regression:'Invariant / conservation regression',phantom_observable:'Phantom observable (declared but absent in the built composite)',
    env_stale:'Stale run environment',nondeterministic:'Non-reproducible run (fingerprint changed)',param_drift:'Parameter drift (applied ≠ pinned)',
    stale_finding:'Stale finding',uncovered_ac:'Uncovered acceptance criterion',next_action_ready:'Next action ready'};
  const sev={high:'#991b1b',medium:'#92400e',low:'#475569'};
  const rows=items.map(it=>{ const sc=sev[it.severity]||'#475569';
    return `<li style="margin-top:7px;padding-left:10px;border-left:3px solid ${sc}"><b>${esc(KM[it.kind]||String(it.kind||'').replace(/_/g,' '))}</b>${it.ref?` <span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(it.ref)}</span>`:''}${it.title?`<div class="measure" style="font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:1px">${esc(it.title)}</div>`:''}</li>`; }).join('');
  const body=total?`<ul style="list-style:none;padding:0;margin:4px 0 0">${rows}</ul>`
    :`<p class="measure" style="color:#065f46;font-size:13.5px;margin:2px 0 0">✓ No open validation flags — the deterministic scan found nothing to act on.</p>`;
  // Report-readiness linter (reused report_views.build_report_lint): composite
  // resolution, readout emit-plans, question/approach completeness, viz gaps.
  // These run to hundreds of findings across an investigation, so AGGREGATE by
  // check (count + worst severity + a few example studies) rather than list raw.
  const lint=(v.report_lint||[]).filter(f=>String(f.severity||'').toLowerCase()!=='info');
  const lsev={error:'#991b1b',high:'#991b1b',warn:'#92400e',warning:'#92400e'};
  const sevRank={error:3,high:3,warning:2,warn:2,info:1};
  const byCheck={};
  lint.forEach(f=>{ const k=f.check||'check'; (byCheck[k]=byCheck[k]||{n:0,sev:'',studies:new Set()});
    byCheck[k].n++; const sl=String(f.severity||'').toLowerCase();
    if((sevRank[sl]||0)>(sevRank[byCheck[k].sev]||0)) byCheck[k].sev=sl;
    if(f.study&&f.study!=='<workspace>') byCheck[k].studies.add(f.study); });
  const grouped=Object.entries(byCheck).sort((a,b)=>(sevRank[b[1].sev]||0)-(sevRank[a[1].sev]||0)||b[1].n-a[1].n);
  const nErr=lint.filter(f=>['error','high'].includes(String(f.severity||'').toLowerCase())).length;
  const nWarn=lint.length-nErr;
  const lrows=grouped.map(([k,g])=>{ const sc=lsev[g.sev]||'#475569'; const egs=[...g.studies].slice(0,4);
    return `<li style="margin-top:6px;padding-left:10px;border-left:3px solid ${sc};display:flex;gap:8px;align-items:baseline"><span style="font-variant-numeric:tabular-nums;color:${sc};font-weight:650;min-width:2.2em;text-align:right">${g.n}</span><span><b>${esc(k.replace(/_/g,' '))}</b> <span style="font-size:11px;color:var(--ink-3)">${esc(g.sev)}</span>${egs.length?`<div class="mono" style="font-size:10.5px;color:var(--ink-3);line-height:1.4;margin-top:1px">${egs.map(esc).join(', ')}${g.studies.size>egs.length?` +${g.studies.size-egs.length}`:''}</div>`:''}</span></li>`; }).join('');
  const lintBlock=lint.length?`<details style="margin-top:12px"><summary style="cursor:pointer;font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase">Report readiness — ${lint.length} findings across ${grouped.length} checks (${nErr} error${nErr===1?'':'s'}, ${nWarn} warning${nWarn===1?'':'s'})</summary><ul style="list-style:none;padding:0;margin:6px 0 0">${lrows}</ul></details>`:'';
  return `<div class="narr fbsection" id="validation">${fbBubble('validation','Validation & reproducibility')}
    <div class="sec-h"><h2>Validation &amp; reproducibility</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13px;margin:2px 0 2px">Automated, code-computed consistency checks (no AI): conservation/invariant ledgers, computed-vs-authored verdicts, run reproducibility (environment + determinism), parameter drift and acceptance-criterion coverage. Each study's own ledger predicates (e.g. mass/charge balance) are its gating behavior tests, listed on the study's card (its Tests).</p>
    ${body}
    ${lintBlock}</div>`;
}

// 5. NEXT STUDIES & PRIORITIES — prioritized roadmap from planned studies, failed
// gates and authored follow-ups; plus the open expert decisions.
function roadmapSection(inv){
  const rm=(inv.synthesis||{}).roadmap||[]; const dn=((inv.executive||{}).decisions_needed)||[];
  if(!rm.length && !dn.length) return '';
  const pc={P0:['#991b1b','#fee2e2'],P1:['#92400e','#fef3c7'],P2:['#475569','#eef2f7']};
  const rows=rm.map(r=>{ const m=pc[r.priority]||pc.P2;
    return `<li style="margin-top:8px"><span style="display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;color:${m[0]};background:${m[1]};margin-right:6px">${esc(r.priority)}</span>`+
      `<b>${esc(r.item||'')}</b>${r.basis?`<div class="measure" style="font-size:12.5px;color:var(--ink-2);margin:2px 0 0 0;line-height:1.45">${esc(r.basis)}</div>`:''}${r.source?`<span style="font-size:11px;color:var(--ink-3)"> — ${_studyLink(r.source)}</span>`:''}</li>`;
  }).join('');
  const dec=dn.length?`<div style="margin-top:14px"><div class="kicker" style="margin-bottom:4px">Open expert decisions (${dn.length})</div>
    <ol style="padding-left:20px;margin:0;font-size:12.5px;color:var(--ink);line-height:1.5">${dn.map(d=>`<li style="margin-top:4px">${esc((typeof d==='string')?d:(d.question||d.title||''))}</li>`).join('')}</ol></div>`:'';
  return `<div class="narr fbsection" id="roadmap">${fbBubble('roadmap','Next studies & priorities')}
    <div class="sec-h"><h2>Next studies &amp; priorities</h2><span class="rule"></span></div>
    ${rows?`<ul style="list-style:none;padding:0;margin:4px 0 0">${rows}</ul>`:''}${dec}</div>`;
}

// SYNTHESIS & GAPS (plan §4) — one consolidated section: cross-study quantitative
// synthesis, contradictions/uncertainty, and the prioritized follow-ups, instead
// of three separate short sections to hop between.
function synthesisAndGaps(inv){
  const q=quantitativeSynthesis(inv), c=contradictionsSection(inv), r=roadmapSection(inv);
  if(!q && !c && !r) return '';
  return `<div class="narr fbsection" id="synthesis-gaps">${fbBubble('synthesis-gaps','Synthesis & gaps')}
    <div class="sec-h"><h2>Synthesis &amp; gaps</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13px;margin:2px 0 2px">Where results agree, conflict, or leave open claims — and the priority follow-ups that would resolve them.</p>
    <div class="syn-group">${q}${c}${r}</div></div>`;
}

// 6. CLAIM-EVIDENCE MAP — each study's scientific claim, its status, and a link.
function claimEvidenceMap(inv){
  const ce=(inv.synthesis||{}).claim_evidence||[]; if(!ce.length) return '';
  const rows=ce.map(c=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:5px 12px 5px 0;color:var(--ink);font-size:12.5px;line-height:1.4">${esc(c.claim)}</td><td style="padding:5px 10px 5px 0;white-space:nowrap">${_gradeChip(c.status)}</td><td style="padding:5px 0;font-size:12px">${_studyLink(c.study,c.study_title)}</td></tr>`).join('');
  return `<div class="narr fbsection" id="claim-evidence">${fbBubble('claim-evidence','Claim–evidence map')}
    <div class="sec-h"><h2>Claim–evidence map</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13px;margin:2px 0 6px">Each study's central scientific claim, its evidence status, and a link to the study.</p>
    <table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:2px solid var(--line)"><th style="text-align:left;padding:4px 0;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">Claim</th><th style="text-align:left;font-size:11px;color:var(--ink-3)">Status</th><th style="text-align:left;font-size:11px;color:var(--ink-3)">Study</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// KEY FIGURES — curated shortlist (ranked by scientific weight); full renders
// live in the Technical supplement gallery, linked from here.
function keyFigures(inv){
  const fr=(inv.synthesis||{}).figures_ranked||[]; if(!fr.length) return '';
  const rows=fr.map((f,i)=>`<li style="margin-top:6px"><b>Figure ${i+1}.</b> ${esc(f.name||'(figure)')} <span style="color:var(--ink-3);font-size:12px">— ${_studyLink(f.slug,f.study_title)}</span>${f.caption?`<div class="measure" style="font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:1px">${esc(String(f.caption).slice(0,240))}</div>`:''}</li>`).join('');
  return `<div class="narr fbsection" id="key-figures">${fbBubble('key-figures','Key figures')}<div class="sec-h"><h2>Key figures</h2><span class="rule"></span></div>
    <p class="measure" style="color:var(--ink-2);font-size:13px;margin:2px 0 4px">The most evidence-bearing figures, ranked by scientific weight — full renders are in the Technical supplement.</p>
    <ol style="list-style:none;padding:0;margin:4px 0 0;font-size:13px;color:var(--ink)">${rows}</ol></div>`;
}

// EVIDENCE REGISTER (plan §5) — a compact entry for EVERY study, in the MAIN
// body: scientific verdict × run status × one-line result, each cross-linked to
// its full record in the supplement. Ensures every study is represented without
// repeating full per-study tables in the narrative.
function evidenceRegister(inv){

/* ====================== FINDINGS (moved BELOW the narrative intro) ====================== */
// The verdict + the results-at-a-glance — present, but no longer the first
// thing a reader meets. Framed as "Findings", after the question/abstract/
// background/thesis front matter.
function renderFindings(inv){
  const studies=inv.studies;
  const MODE=reportMode(inv);
  const gates=studies.map(gateOf);
  const nPass=gates.filter(g=>g==='pass').length, nFail=gates.filter(g=>g==='fail').length;
  const nPlanned=gates.filter(g=>g==='planned').length;
  const exv=inv.executive||{};
  const verdictText=exv.verdict||inv.question;
  const status=nFail?'fail':((nPass&&nPlanned)?'warn':(nPass?'pass':'warn'));
  let stats='';
  if(MODE==='sourcing'){
    const dec={};studies.forEach(s=>{const d=s.sourcing&&s.sourcing.decision;if(d)dec[d]=(dec[d]||0)+1;});
    stats=[[studies.length,'studies'],[dec['reuse']||0,'reuse'],[dec['compose']||0,'compose'],[dec['build-new']||0,'build-new'],[nFail,'trap refused ✗','fail']];
  }else if(MODE==='agentic'){
    let aDone=0,pDone=0,pTot=0;
    studies.forEach(s=>{ if(s.agent_trajectory&&s.agent_trajectory.result&&s.agent_trajectory.result.state==='DONE')aDone++;
      if(s.policy_trajectory){pTot++; if(s.policy_trajectory.result&&s.policy_trajectory.result.state==='DONE')pDone++;} });
    stats=[[studies.length,'tasks'],[aDone+'/'+studies.length,'agent solved','pass'],[pDone+'/'+pTot,'policy solved'],[studies.length-pDone,'need an agent']];
  }else{
    let nTests=0; studies.forEach(s=>{ nTests+=(s.behavior_tests||[]).length; });
    stats=[[studies.length,'studies'],[nPass,'passed','pass']];
    if(nFail) stats.push([nFail,'failing','fail']);
    if(nPlanned) stats.push([nPlanned,'planned','planned']);
    stats.push([nTests,'acceptance test'+(nTests===1?'':'s')]);
  }
  const statHtml=stats.map(([n,l,c])=>`<div class="stat"><div class="num ${c||''}">${n}</div><div class="lbl">${l}</div></div>`).join('');
  return `<div id="findings"><div class="sec-h"><h2>Findings</h2><span class="rule"></span></div>
    <div class="verdict fbsection ${status==='fail'?'is-fail':status==='warn'?'is-progress':''}">
      ${fbBubble('overview','Investigation verdict')}
      <div class="vhead">${statusChip(status)}<span class="kicker">Verdict</span></div>
      <p class="vtext">${esc(verdictText)}</p>
      ${exv.verdict_detail?`<div class="what">${mdLite(exv.verdict_detail)}</div>`:''}
    </div>
    <div class="stats">${statHtml}</div>
    ${genesisLadder(inv)}</div>`;
}

/* ====================== RESULTS-AT-A-GLANCE (graph-less fallback) ======================
   For a campaign WITH a dependency ordering, the investigation graph below is the
   staged progression (same DAG, richer node cards), so genesisLadder() returns
   nothing — the old stage-progression ladder duplicated the graph and was removed.
   It still renders a compact flat glance table for investigations that have no
   dependency edges (where the graph shows only independent nodes), keeping it
   data-safe for any investigation. _dagDepthOrder stays — the graph layout uses it. */
function _dagDepthOrder(inv){
  const studies=inv.studies||[];
  const byName={}; studies.forEach(s=>byName[s.slug]=s);
  const children={}; studies.forEach(s=>children[s.slug]=[]);
  studies.forEach(s=>dagEdges(s).forEach(p=>{ if(children[p.study]) children[p.study].push(s.slug); }));
  const depth={}; const q=[];
  studies.forEach(s=>{ const inP=dagEdges(s).filter(p=>byName[p.study]); if(!inP.length){ depth[s.slug]=0; q.push(s.slug); } });
  let guard=studies.length*4;
  while(q.length&&guard-->0){ const n=q.shift(); (children[n]||[]).forEach(c=>{ if(depth[c]===undefined||depth[c]<depth[n]+1){ depth[c]=depth[n]+1; q.push(c); } }); }
  studies.forEach(s=>{ if(depth[s.slug]===undefined) depth[s.slug]=0; });
  const anyEdge=studies.some(s=>dagEdges(s).some(p=>byName[p.study]));
  return {depth, anyEdge};
}
function _experimentOf(s){
  // the "model experiment": the objective, else the hypothesis, else the baseline composite.
  const bl=(s.baseline||[])[0];
  return s.objective || s.hypothesis || (bl&&bl.composite?('composite '+bl.composite):'') || '';
}
function _observableOf(s){
  const ro=(s.readouts||[]).map(r=>r&&(r.name||r.observable)).filter(Boolean);
  if(ro.length) return ro.slice(0,5).join(', ')+(ro.length>5?'…':'');
  const nt=(s.behavior_tests||[]).length;
  return nt?`${nt} acceptance test${nt===1?'':'s'}`:'';
}
function _whatWeLearn(s){
  let t=s.claim||s.result||(s.findings&&s.findings[0]&&(s.findings[0].statement||s.findings[0].summary))||'';
  t=String(t).split('\n')[0].trim();
  return t;
}
function genesisLadder(inv){
  const studies=inv.studies||[];
  const {anyEdge}=_dagDepthOrder(inv);
  // When the campaign has a dependency ordering, the investigation graph below
  // already presents the staged progression (same DAG, with richer node cards),
  // so the stage-progression ladder duplicated it and is omitted. The compact
  // glance table is kept only for investigations with no dependency edges, where
  // the graph shows just independent nodes.
  if(anyEdge && studies.length>=2) return '';
  const MODE=reportMode(inv);
  const glance=studies.map((s,i)=>{
    const g=gateOf(s), role=roleLine(s,inv), ctrl=isControl(s);
    return `<tr><td class="idx">${i+1}</td>
      <td><a class="st" href="#s-${s.slug}">${esc(s.title)}</a>${ctrl?'<span class="flag">⚑ control</span>':''}</td>
      <td style="color:var(--ink-2)">${role}</td>
      <td style="text-align:right">${g==='fail'?'<span class="chip fail">✗ refuted</span>':g==='pass'?'<span class="chip pass">✓ pass</span>':g==='planned'?'<span class="chip planned">◦ planned</span>':'<span class="chip">open</span>'}</td></tr>`;
  }).join('');
  return `<div style="margin-top:14px"><div class="kicker" style="margin-bottom:8px">Results at a glance</div>
    <table class="glance"><thead><tr><th></th><th>Study</th><th>${MODE==='sourcing'?'Sourcing decision':MODE==='agentic'?'Agent vs policy':'Evidence'}</th><th style="text-align:right">Status</th></tr></thead><tbody>${glance}</tbody></table></div>`;
}

/* ====================== WORKBENCH-CONSISTENT INVESTIGATION GRAPH ======================
   The report's graph REUSES the workbench's investigation-DAG layout + node
   markup + edge routing (ported from walkthrough.js _renderInvestigationDag):
   the same depth-BFS columns, the same node card (status border-top, icon +
   badge, Asks/Finds), and the same Bezier edges with arrowheads. Static: no
   drag/zoom; LR (left→right = the stage progression). Positions are measured
   and laid out by setupWorkbenchDag() after the HTML is in the DOM — the same
   two-pass measure the workbench uses, so cards never clip. Data-safe: works
   for any investigation's parent_studies / pipeline_gate DAG. */
function workbenchDag(inv){
  const studies=inv.studies||[];
  if(!studies.length) return '';
  const anyEdge=studies.some(s=>dagEdges(s).length);
  const nodes=studies.map(s=>{
    const m=studyStatusMeta(s);
    const chip=studyChip(s.slug);
    const asks=String(s.question||'').replace(/\s+/g,' ').split(/[.?]/)[0].trim();
    const finds=String(s.claim||(s.findings&&s.findings[0]&&(s.findings[0].summary||s.findings[0].statement||s.findings[0].id))||'').replace(/\s+/g,' ').trim();
    const tier=(Array.isArray(s.findings)&&s.findings.length)?evidenceTier(s.findings[0],s):null;
    return `<div class="wdag-node" data-study="${esc(s.slug)}" style="border-top-color:${m.color};top:0;left:0">
      <div class="wn-meta"><span class="wn-icon" style="color:${m.color}">${m.icon}</span>
        <span class="wn-rt"><span class="wn-badge" style="color:${m.color}">${esc(m.label)}</span><span class="wn-exp" aria-hidden="true">▾</span></span></div>
      <a class="wn-title" href="#s-${esc(s.slug)}">${esc(s.title)}</a>
      ${asks?`<div class="wn-row" style="-webkit-line-clamp:2"><span class="wn-lbl">Asks:</span> ${esc(asks)}</div>`:''}
      ${finds?`<div class="wn-row" style="-webkit-line-clamp:4"><span class="wn-lbl">Finds:</span> ${esc(finds)}</div>`:`<div class="wn-row"><em style="color:var(--ink-3)">pending evidence</em></div>`}
      ${tier?`<div class="wn-etier">${etierBadge(tier)}</div>`:''}
      <!-- SEAM: the locked shared node-card spec (model/composite + modeling
           methods + sim/run count & status + behavior-test pass/fail) slots in
           here as a follow-up — kept to the four-part unit + verdict for now so
           the report node never diverges from the live workbench graph. -->
    </div>`;
  }).join('');
  const lg=Object.values(WSTATUS).map(m=>`<span class="lg"><span class="i" style="color:${m.color}">${m.icon}</span>${esc(m.label)}</span>`).join('');
  const note=anyEdge?'':'<p class="measure" style="color:var(--ink-3);font-size:12.5px;margin:4px 0 0">No declared dependencies — studies shown as independent nodes.</p>';
  return `<div class="wdag-shell"><div class="wdag-canvas" id="wdag-canvas">
      <svg class="wdag-edges" id="wdag-edges"></svg>${nodes}</div></div>
    <div class="wdag-legend"><span style="font-weight:600;color:var(--ink-2)">Status:</span>${lg}</div>${note}`;
}
// Two-pass measured layout (mirrors walkthrough.js). LR: depth → column.
function setupWorkbenchDag(){
  const canvas=document.getElementById('wdag-canvas'); if(!canvas) return;
  const svg=document.getElementById('wdag-edges'); if(!svg) return;
  const nodeEls=[...canvas.querySelectorAll('.wdag-node')];
  if(!nodeEls.length) return;
  const studies=INV.studies||[];
  const byName={}; studies.forEach(s=>byName[s.slug]=s);
  const children={}; studies.forEach(s=>children[s.slug]=[]);
  studies.forEach(s=>dagEdges(s).forEach(p=>{ if(children[p.study]) children[p.study].push(s.slug); }));
  const depth={}, q=[];
  studies.forEach(s=>{ const inP=dagEdges(s).filter(p=>byName[p.study]); if(!inP.length){ depth[s.slug]=0; q.push(s.slug); } });
  let guard=studies.length*4;
  while(q.length&&guard-->0){ const n=q.shift(); (children[n]||[]).forEach(c=>{ if(depth[c]===undefined||depth[c]<depth[n]+1){ depth[c]=depth[n]+1; q.push(c); } }); }
  studies.forEach(s=>{ if(depth[s.slug]===undefined) depth[s.slug]=0; });
  const byDepth={}; studies.forEach(s=>{ (byDepth[depth[s.slug]]=byDepth[depth[s.slug]]||[]).push(s.slug); });
  Object.keys(byDepth).forEach(d=>byDepth[d].sort((a,b)=>String(a).localeCompare(String(b))));
  const CARD_W=212, DEPTH_GAP=58, BREADTH_GAP=18, PAD_X=20, PAD_Y=16;
  const el={}; nodeEls.forEach(n=>el[n.dataset.study]=n);
  const pos={};
  const depths=Object.keys(byDepth).map(Number).sort((a,b)=>a-b);
  // Measure + position + draw edges, wrapped so it can RE-RUN once web fonts
  // settle (an early offsetHeight under-measures a card -> the column stacks too
  // tight and cards overlap) and whenever a card is expanded in place.
  const relayout=(vertical, compact)=>{
  // Compact (lowest semantic zoom, for the PDF): narrower title+status cards.
  const cw = compact ? 158 : CARD_W;
  nodeEls.forEach(n=>{ n.style.width=cw+'px'; });
  studies.forEach(s=>{ const n=el[s.slug]; if(!n) return; pos[s.slug]={node:n, h:n.offsetHeight||120}; });
  let canvasW, canvasH;
  if(vertical){
    // TOP-TO-BOTTOM (for print/PDF): depth → row; siblings laid left-to-right and
    // centered. Uses page height and keeps the graph narrow enough to fit width.
    const rowH={}; depths.forEach(d=>{ rowH[d]=Math.max(compact?64:120,...byDepth[d].map(sl=>pos[sl].h)); });
    const rowY={}; let yacc=PAD_Y; depths.forEach(d=>{ rowY[d]=yacc; yacc+=rowH[d]+DEPTH_GAP; });
    canvasH=Math.max(160,yacc-DEPTH_GAP+PAD_Y);
    const rowW={}; depths.forEach(d=>{ rowW[d]=byDepth[d].length*cw+Math.max(0,byDepth[d].length-1)*BREADTH_GAP; });
    canvasW=PAD_X*2+Math.max(cw,...depths.map(d=>rowW[d]));
    depths.forEach(d=>{ let xc=PAD_X+Math.max(0,(canvasW-PAD_X*2-rowW[d])/2);
      byDepth[d].forEach(sl=>{ const p=pos[sl]; p.x=xc; p.y=rowY[d]; p.node.style.left=xc+'px'; p.node.style.top=rowY[d]+'px'; xc+=cw+BREADTH_GAP; }); });
  } else {
    // LEFT-TO-RIGHT (screen default): depth → column; stack same-depth cards.
    studies.forEach(s=>{ const n=el[s.slug]; if(!n) return; const x=PAD_X+depth[s.slug]*(cw+DEPTH_GAP);
      n.style.left=x+'px'; pos[s.slug].x=x; });
    const colTot={}; depths.forEach(d=>{ let sum=0; byDepth[d].forEach(sl=>sum+=pos[sl].h); colTot[d]=sum+Math.max(0,byDepth[d].length-1)*BREADTH_GAP; });
    const maxCol=Math.max(0,...depths.map(d=>colTot[d]));
    canvasH=Math.max(PAD_Y*2+maxCol,160);
    depths.forEach(d=>{ let yc=PAD_Y+Math.max(0,(canvasH-PAD_Y*2-colTot[d])/2);
      byDepth[d].forEach(sl=>{ pos[sl].y=yc; pos[sl].node.style.top=yc+'px'; yc+=pos[sl].h+BREADTH_GAP; }); });
    canvasW=PAD_X*2+(depths.length?depths[depths.length-1]:0)*(cw+DEPTH_GAP)+cw;
  }
  const CARD_HALF=cw/2;
  canvas.style.transform=''; canvas.style.width=canvasW+'px'; canvas.style.height=canvasH+'px';
  svg.setAttribute('width',canvasW); svg.setAttribute('height',canvasH);
  svg.style.width=canvasW+'px'; svg.style.height=canvasH+'px';
  // Edges — Bezier routing + arrowhead; control points follow the flow axis.
  const NS='http://www.w3.org/2000/svg';
  let defs='<defs><marker id="wdag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>';
  svg.innerHTML=defs;
  studies.forEach(s=>{ dagEdges(s).forEach(p=>{ const a=pos[p.study], b=pos[s.slug]; if(!a||!b) return;
    let x1,y1,x2,y2,d;
    if(vertical){ x1=a.x+CARD_HALF; y1=a.y+a.h; x2=b.x+CARD_HALF; y2=b.y; const dy=Math.max(24,(y2-y1)/2);
      d=`M ${x1} ${y1} C ${x1} ${y1+dy}, ${x2} ${y2-dy}, ${x2} ${y2}`; }
    else { x1=a.x+cw; y1=a.y+a.h/2; x2=b.x; y2=b.y+b.h/2; const dx=Math.max(28,(x2-x1)/2);
      d=`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`; }
    const st=dagRelStyle(p.relation);
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke',st.color);
    path.setAttribute('stroke-width','1.5'); path.setAttribute('marker-end','url(#wdag-arrow)');
    if(st.dash) path.setAttribute('stroke-dasharray',st.dash);
    svg.appendChild(path);
    if(p.relation&&p.relation!=='leads-to'){ const t=document.createElementNS(NS,'text');
      t.setAttribute('x',(x1+x2)/2); t.setAttribute('y',(y1+y2)/2-6); t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','10'); t.setAttribute('fill',st.color); t.textContent=st.label; svg.appendChild(t); }
  }); });
  };
  // Expose so the PDF print-prep can re-lay-out vertically + fit to page width.
  window.__relayoutDag = relayout;
  // First pass, then correct once reflow / web-fonts settle (the usual cause of
  // columns stacking too tight and overlapping). Guard the callbacks so their
  // argument (a timestamp / FontFaceSet) is never read as the `vertical` flag.
  relayout(false);
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>{ if(!window.__dagPrint) relayout(false); });
  try{ if(document.fonts&&document.fonts.ready&&document.fonts.ready.then) document.fonts.ready.then(()=>{ if(!window.__dagPrint) relayout(false); }); }catch(e){}
  // Click-to-expand: mark only the cards whose Asks/Finds are actually clipped
  // (so short cards get no misleading affordance), then let a click anywhere on
  // such a card toggle its in-place expansion. The title link keeps navigating
  // to the full study, so clicks on it are left alone.
  nodeEls.forEach(n=>{
    const clipped=[...n.querySelectorAll('.wn-row')].some(r=>r.scrollHeight-r.clientHeight>2);
    if(clipped){ n.dataset.clip='1'; n.title='Click to read the full Asks / Finds — the title link opens the study'; }
  });
  canvas.addEventListener('click',e=>{
    if(e.target.closest('a')) return;
    const n=e.target.closest('.wdag-node[data-clip]');
    if(n){ n.classList.toggle('wn-expanded'); relayout(); }
  });
}

/* ---------- ENVIRONMENT → INDIVIDUAL conceptual strip (qualitative) ----------
   A conceptual axis of capabilities migrating from the vent (environment) into
   the protocell (individual) across the campaign. This is a QUALITATIVE framing,
   NOT a measured autonomy metric — no numbers are fabricated. Rendered only when
   there is a staged ordering; otherwise omitted. */
/* ====================== GLOSSARY (accessibility) ====================== */
function renderGlossary(inv){
  const g=inv.glossary;
  if(!g) return '';
  let entries=[];
  if(Array.isArray(g)) entries=g.map(e=>e&&(e.term||e.name)?[e.term||e.name, e.definition||e.def||e.description||'']:null).filter(Boolean);
  else if(typeof g==='object') entries=Object.entries(g).map(([k,v])=>[k, (v&&typeof v==='object')?(v.definition||v.def||v.description||''):v]);
  if(!entries.length) return '';
  const rows=entries.map(([t,d])=>`<div class="refentry"><b class="rt">${esc(t)}</b>${d?`<div class="rmeta">${mdLite(d)}</div>`:''}</div>`).join('');
  return `<div class="appendix fbsection" id="glossary">${fbBubble('glossary','Glossary')}
    <div class="sec-h"><h2>Glossary</h2><span class="rule"></span></div>
    <div class="refs-list">${rows}</div></div>`;
}

/* ---------- one contiguous document ---------- */

  // meta line: status · workspace · N studies · date (calm, not a stat grid)

    `<span>${inv.studies.length} ${inv.studies.length===1?'study':'studies'}</span>`,
    inv.created?`<span>${esc(inv.created)}</span>`:''].filter(Boolean);
  document.getElementById('app').innerHTML=
    `<div class="wrap"><div class="masthead" id="top">
      <div class="eyebrow mono">${esc(inv.slug)} · investigation report</div>
      <h1>${esc(inv.title)}</h1>
      <div class="provline">${metaBits.join('<span class="sep">·</span>')}</div>
    </div></div>`+
    toc(inv)+
    `<div class="wrap">
    ${execSummary(inv)}
    ${renderDiscovery(inv)}
    ${renderSpine(inv)}
    ${renderStudies(inv)}
    ${synthesisAndGaps(inv)}
    ${validationSection(inv)}
    ${claimEvidenceMap(inv)}
    ${evidenceRegister(inv)}
    ${renderReferences(inv)}
    ${renderInvViz(inv)}
    ${renderGlossary(inv)}
    ${renderAppendix(inv)}</div>`+
    `<div class="wrap">
      <div class="sec-h" id="report-feedback"><h2>Report feedback</h2><span class="rule"></span></div>
      <p style="color:var(--ink-2);font-size:14px;max-width:none">Leave an overall note, and per-study notes on each study card. Then <b>Review &amp; export</b> assembles them into a YAML feedback report.</p>
      ${feedbackRow('overall','the whole report')}
    </div>`;
  updateCount(); window.scrollTo(0,0); spy();
  setupWorkbenchDag();
  setupLazyPlotly();
  setupInteractiveLooms();
  setupRealLooms();
}

/* ---------- wiring ---------- */
document.getElementById('foot-prov').textContent=(INV.provenance||'investigations/'+INV.slug+'/investigation.yaml · studies/*/study.yaml · loop-trajectory JSON');
document.getElementById('wsname').textContent=(INV.workspace||'');
{ const fw=document.getElementById('foot-ws'); if(fw) fw.textContent=(INV.workspace||''); }
document.getElementById('themebtn').onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');};
// feedback delegation (bound once; #app persists)
const app=document.getElementById('app');
app.addEventListener('input',e=>{ if(e.target.classList.contains('fbnote')){
  const key=e.target.closest('.fbrow').dataset.fbkey; setFB(key,{note:e.target.value}); markBubble(key); }});
function toggleEditor(bub){
  const key=bub.dataset.fb, label=bub.dataset.fblabel, sec=bub.closest('.fbsection');
  let ed=sec.querySelector(':scope > .fbeditor-wrap');
  if(ed){ ed.remove(); return; }
  ed=document.createElement('div'); ed.className='fbeditor-wrap'; ed.innerHTML=feedbackRow(key,label);
  sec.appendChild(ed); const inp=ed.querySelector('input.fbnote'); if(inp) inp.focus();
}
app.addEventListener('click',e=>{
  // per-section feedback bubble → toggle inline editor
  const bub=e.target.closest('.fbbubble');
  if(bub){ e.stopPropagation(); toggleEditor(bub); return; }
  // feedback disposition
  const btn=e.target.closest('.fbdisp button');
  if(btn){ const row=btn.closest('.fbrow'), key=row.dataset.fbkey, disp=btn.dataset.disp;
    const cur=(FB[key]||{}).disp; setFB(key,{disp:cur===disp?null:disp}); markBubble(key);
    row.querySelectorAll('.fbdisp button').forEach(x=>x.classList.remove('on-ok','on-rev'));
    const nd=(FB[key]||{}).disp;
    if(nd==='ok') row.querySelector('[data-disp=ok]').classList.add('on-ok');
    if(nd==='revise') row.querySelector('[data-disp=revise]').classList.add('on-rev'); return; }
  // expand/collapse all
  if(e.target.id==='expandall'){ document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed')); return; }
  if(e.target.id==='collapseall'){ document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed')); return; }
  // ANY in-page link to a study/section → open any enclosing <details> and expand
  // the target study card before the browser scrolls to it.
  const link=e.target.closest('a[href^="#"]');
  if(link){
    const href=link.getAttribute('href')||'';
    const tgt=href.length>1?document.getElementById(href.slice(1)):null;
    if(tgt){
      let d=tgt.closest('details'); while(d){ d.open=true; d=(d.parentElement&&d.parentElement.closest('details'))||null; }
      if(href.startsWith('#s-')) tgt.classList.remove('collapsed');
    }
    return;
  }
  // a collapsed card is clickable anywhere to expand (ignore real controls/links)
  const anyCard=e.target.closest('.card');
  if(anyCard && anyCard.classList.contains('collapsed') && !e.target.closest('a,button,summary,input,textarea,select')){
    anyCard.classList.remove('collapsed'); return; }
  // header → collapse an expanded study
  const head=e.target.closest('.card-h');
  if(head){ head.closest('.card').classList.toggle('collapsed'); }
});
// modal
const modalbg=document.getElementById('modalbg');
// "Review & export" downloads the YAML feedback report straight to the downloads
// folder (no modal). A Blob + transient <a download> — works in the served page.
document.getElementById('fbfloat').onclick=()=>{
  const yaml=genYaml(INV);
  const blob=new Blob([yaml],{type:'application/x-yaml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='feedback-'+(INV.slug||'investigation')+'.yaml';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const btn=document.getElementById('fbfloat');
  const prev=btn.innerHTML; btn.innerHTML='Downloaded ✓';
  setTimeout(()=>{btn.innerHTML=prev;},1600);
};
document.getElementById('fbclose').onclick=()=>modalbg.classList.remove('open');
modalbg.onclick=e=>{ if(e.target===modalbg) modalbg.classList.remove('open'); };
document.getElementById('fbcopy').onclick=()=>{ const ta=document.getElementById('fbyaml'); ta.select();
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand&&document.execCommand('copy'); }
  document.getElementById('fbcopy').textContent='Copied ✓'; setTimeout(()=>document.getElementById('fbcopy').textContent='Copy YAML',1500); };
render(INV);
</script>
</body>
