[project]
name = "viva-genesis"
version = "0.0.0"
description = "Origins-of-life / eukaryogenesis / multicellularity investigation workspace — the scientific content (studies, investigations, reports) referencing a pinned viva-genesis-sim simulator."
requires-python = ">=3.12"
dependencies = [
    # The simulator — the viva_genesis composites/processes, now extracted to its
    # own version-controlled repo and pinned by tag (see [tool.uv.sources]). This
    # provides the `viva_genesis` import, so study.yaml `composite:` dotted paths
    # (viva_genesis.composites.<…>) resolve exactly as before.
    "viva-genesis-sim",
    # Core process-bigraph substrate used directly by the workspace/dashboard.
    "process-bigraph",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    # Workspace + report tooling (study.yaml handling, schema validation, report
    # rendering).
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Web-based workspace dashboard (server + templates + assets + lib helpers);
    # provides the `vivarium-workbench serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (@ git+https://…) that hatchling
# otherwise rejects.
[tool.hatch.metadata]
allow-direct-references = true

# This repo is now an investigation workspace, not a Python package — the simulator
# lives in viva-genesis-sim. Build a metadata-only wheel (deps resolve for
# `uv pip install -e .`) without selecting any package files.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
# The extracted simulator, pinned by tag. Bump this tag (and the matching
# `simulator: ref` in each study.yaml) to adopt a new simulator version.
viva-genesis-sim = { git = "https://github.com/vivarium-collective/viva-genesis-sim.git", tag = "v0.1.1" }
process-bigraph = { git = "https://github.com/vivarium-collective/process-bigraph.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
