[project]
name = "viva-genesis"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Campaign-0 real geochemistry + reactive transport engines (og-00):
    # phreeqpython bridges the genuine USGS PHREEQC (IPhreeqc) speciation engine;
    # fipy is the finite-volume PDE solver for the spatial vent reactor.
    "phreeqpython>=1.6",
    "fipy>=4.0",
    # Campaign-I (og-01) real reaction thermodynamics: eQuilibrator component-
    # contribution ΔG' (bundled offline cache via equilibrator-cache-data).
    "equilibrator-api>=0.6",
    # Campaign-II (og-02) real SBML reaction-network simulation + graph analysis.
    "tellurium>=2.2",
    "networkx>=3.0",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_genesis"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
