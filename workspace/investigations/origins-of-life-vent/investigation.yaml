      stage's plan but absent from references/papers.bib on this branch, so the findings currently cite the
      present FeS/native-metal chemistry refs (dorr2003prebiotic, huber1997activated, varma2018native) and
      this entry records the specific nitrate->ammonium anchor pending its addition."
