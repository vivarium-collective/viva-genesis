      currency. Fe-disproportionation is a concrete candidate for that drive ΔG (a redox free-energy source
      at vent conditions), so this would anchor the drive term quantitatively rather than as a generic ΔG.
      The energetic-coupling mechanism itself is currently cited to buckel2013energy and lane2010chemiosmotic
      (both on main)."
    provenance: "Scientific Enrichment Plan (section 7). Not on main / not in references/papers.bib; recorded
