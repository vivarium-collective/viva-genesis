  narrative:
    question: Could the first cells have originated at alkaline hydrothermal vents — and where does the geology-to-cells path run continuously, where does it depend on narrow regimes, and where does it break? Can a physically plausible early-Earth vent–ocean interface generate and sustain, in order, the free energy, reduced carbon, persistent network chemistry, concentration, and compartments a protocell needs — without inserting metabolism, membranes, autocatalysis, or heredity by assumption?
    audience: null
    units:
    - claim_id: claim:mem-m4-growth-division-propensity
      proposition: 'Membrane Division: Can a Vesicle Grow and Divide?'
      verdict: unassessed
      evidence_refs: *id001
      order: 0
    - claim_id: claim:og-vent-environment
      proposition: A serpentinizing alkaline vent holds its Lost City window (T 40-91 C, pH 9.0-10.8, positive H2 flux) over ~80% of the swept grid with |charge|=0, and conditioning on that window leaves a posterior 12.5% of the prior in which 100% of empirically supported vent states supply what downstream carbon fixation needs — transport-class-independent, ledger 0/96 rejected. Supported, bounded.
      verdict: supported
      evidence_refs: *id002
      order: 1
    - claim_id: claim:og-vent-interface
      proposition: 'The evolving mineral interface delivers reduced-carbon chemistry only within a bounded two-regime DIC window — under full redox equilibrium, DIC is drawn down before free H2 appears, so the usable window is narrow (og27-dic-crossover-bounded-window; dic-crossover-sweep passes). Qualified: this DIC-cliff is the realized result; sustained-flux, mineral-evolution supply decay and the coupled ledger over timescales are scaffolded (planned), not yet run.'
      verdict: qualified
      evidence_refs: *id003
      order: 2
    - claim_id: claim:og-autocatalysis-a2
      proposition: 'Both tested routes fail under modeled vent conditions — endogenous self-amplifying autocatalysis is refuted across both representable routes, each against its own matched null. This is a limitation of the modeled vent redox environment, NOT a universal impossibility (see the beyond-vent counterfactual below). The linear-C6 formose arm (og-29) is thermodynamically refuted and seed-independent: the canonical doubling step (r409, 2 glycolaldehyde <-> threose) runs toward condensation (dG0 -16.4 kJ/mol) at vent feeds, so the splitting direction carries no net flux (gain 0, motifs 0 across x1-x50) and production is feed-driven, not self-amplified. The branched reductive-TCA arm (og-rtca) is autocatalytic in TOPOLOGY (its net turn doubles oxaloacetate with no coefficient-2 reaction, so a coefficient detector reads 0 by construction and a coefficient-free functional discriminator is required), yet washes out under vent H2 because the closing reductive carboxylations (succinate->a-ketoglutarate
        +18, acetyl->pyruvate +31 kJ/mol) run uphill and too slow against washout — the same reason the biological cycle uses ferredoxin, not H2. In a LABELLED beyond-vent counterfactual (lower carboxylation barrier + lower dilution) the same rTCA topology meets the self-amplification bar and is topology-specific (the matched null stays off), so the vent negative is a redox-environment limitation, not a defect of the cycle''s wiring. The counterfactual is explicitly not a vent claim. Headline verdict is bounded by the honest negative of both arms: refuted. Every matched null and every arm verdict is preserved.'
      verdict: refuted
      evidence_refs: *id004
      order: 3
    - claim_id: claim:og-carbon-fixation
      proposition: 'H2-driven CO2 reduction fixes carbon at the vent. Over Fe/Ni/S catalysts the model reproduces the Preiner-2020 yield hierarchy (formate ~200 mM >> acetate ~100 uM >> pyruvate ~10 uM) and sustains net organic-carbon flux in a bounded pH-gradient x dissolved-H2 region; formate collapses to <1 mM in every no-gradient / no-H2 / no-catalyst control, and carbon fixation spends the proton gradient (~2 H+/carbon, chemiosmotic backpressure) (og-01, canonical, supported). Under explicit electrochemistry the vent cell is activation (catalyst) limited where the wall conducts and its current sits in the Altair-2025 window, but the two model classes agree on the dominant-limitation label on only 47% of the favorable region (below the pre-registered 80% gate), so the limitation attribution is structure-sensitive and og-01-cal-electrochemistry is refuted on that agreement question (og-01-cal, refuted; og-01-cal-dx planned to diagnose). Consolidated headline: supported — carbon fixation
        works and reproduces lab benchmarks; the mechanistic attribution of its rate-limiting step is not yet model-class-robust. Every matched null and arm verdict kept, including the refutation.'
      verdict: supported
      evidence_refs: *id005
      order: 4
    - claim_id: claim:og-network-persistence
      proposition: 'Across fidelities the prebiotic carbon-fixing network persists — it sustains net carbon throughput as a connected system under vent-realistic feed + washout (og-02, canonical, supported) — but its persistence is driven, not autocatalytic self-amplification. Graded by a common detector, og-02''s curated rTCA motif is imposed and element-unbalanced (the apparent gain an artifact); the rule-generated open universe (121 species, 413 balanced reactions) sustains a 14-species persistent network with NO autocatalytic motif at the vent feed, because every C-C-forming route is uphill, and the single motif that emerges (formose) requires an exogenous formaldehyde feed the vent chemistry does not make (og-02-alt, supported, p=0.04 vs 24 matched nulls). A versioned, provenance-tracked reaction atlas with a zero-leakage write gate supplies the balanced, confidence-tiered reactions both arms draw on (og-28, supported). Consolidated headline: supported — the network persists; endogenous
        autocatalysis is refuted at vent feed and tracked as the og-autocatalysis line. Every matched null and arm verdict kept.'
      verdict: supported
      evidence_refs: *id006
      order: 5
    - claim_id: claim:og-nutrient-bottlenecks
      proposition: 'Each non-carbon nutrient bottleneck clears individually: ammonium is produced and sustained, keeping pace with carbon fixation (a viable C:N) while the feature-ablation null produces none and nitrogen mass is conserved (nitrogen arm, supported); reactive phosphorus is available and co-concentrates with carbon in the pore while an open-pore no-enrichment control shows none and P mass is conserved (phosphorus arm, supported). Qualified overall: these are separate concentration successes, not a joint C/N/P feasibility — whether C, N and P are available together in compatible chemical forms and the same physical regime is the harder, open bar carried by og-precursor-pool and og-operating-window. Every matched null and arm verdict preserved.'
      verdict: qualified
      evidence_refs: *id007
      order: 6
    - claim_id: claim:og-precursor-pool
      proposition: The vent's reduced-carbon chemistry delivers a de-novo, atom-balanced, budget-closed functional precursor pool whose controls all collapse it - but within the defensible DIC window the functional C2+ precursors are thermodynamically bounded to sub-micromolar, orders below what downstream chemistry can consume. Qualified.
      verdict: qualified
      evidence_refs: *id008
      order: 7
    - claim_id: claim:og-spatial-concentration
      proposition: A serpentinite pore concentrates a dilute vent feed above the dilution/retention threshold (Baaske regime cleared, accumulation Peclet 18.4) while an open-pore control washes through; but the chemically-necessary eight-solute set fractionates (Soret-driven, co-localization index ~0.18) rather than co-localizing — a candidate spatial incompatibility. Supported, bounded.
      verdict: supported
      evidence_refs: *id009
      order: 8
    - claim_id: claim:og-network-rescue
      proposition: At identical vent-posterior feeds held equal, a concentrating mineral pore ignites the carbon-fixing network (net carbon flux +4.5e-4, 17 persistent species; confirmed on the six-carbon network) while a matched well-mixed, nonconcentrating control stays dead — spatial concentration is the only difference, so the pore causes the productive flux (og-30, canonical). Supported.
      verdict: supported
      evidence_refs: *id010
      order: 9
    - claim_id: claim:og-self-compartmentation
      proposition: A vent-born system acquires a self-made boundary and self-maintains as a protocell, the membrane buying persistence rather than raw throughput. Mixed fatty-acid/alcohol amphiphiles assemble into protocell boundaries in a vent window, giving individuality (retention) without full isolation and beating single-amphiphile controls (og-04, supported); a boundary also forms endogenously from the system's own carbon chemistry with a closed matter ledger (og-04-alt, supported); protometabolism-produced encapsulation pays against a matched equal-feed null on persistence and an access window but not on throughput, and the benefit is windowed (og-31, qualified); the integrated compartment self-maintains its membrane integrity and beats a matched ablation with MD-informed permeability (og-32, canonical, qualified); and real fatty-acid Martini-3 vesicles are stable across C10-C16 while a fully-charged null micellises at the short+charged corner, replacing og-32's phospholipid stand-in
        with a real amphiphile (og-32b, qualified — a short-MD fixed-charge stability trend, with the titratable/PMF gold standard tracked as og-32a). Headline verdict qualified. Every matched null and arm verdict is preserved.
      verdict: qualified
      evidence_refs: *id011
      order: 10
    - claim_id: claim:og-heredity
      proposition: 'A protocell transmits a heritable chemical difference to its daughters at a feasible cost, and heredity need not presume a long high-fidelity RNA template: competing modules graded head-to-head show inheritance beats a non-heritable control and compositional/hybrid heredity escapes the Eigen length catastrophe (og-06), and an information-per-cost frontier ranks six mechanisms by heritable bits per joule with attachment conditional on budget (og-06-alt). Supported. Selectability is tested separately in og-evolvability.'
      verdict: supported
      evidence_refs: *id012
      order: 11
    - claim_id: claim:og-operating-window
      proposition: The downstream pore-enrichment + membrane-retention machinery can rescue og-precursor-pool's nanomolar functional pool to a consumable (~uM) concentration, but only in a narrow corner at the upper edge of defensible small-molecule thermophoresis (S_T ~1e-2/K ceiling + high thermal gradient + high DIC together; overlap volume ~0.11 of the defensible grid, 0.42 overall). The canonical mid-point does not clear it. The rescue hinges on the Soret coefficient of the C2-C3 precursors (the dominant parameter by Morris), so measuring S_T(C2-C3) at the vent gradient is the discriminating experiment.
      verdict: qualified
      evidence_refs: *id013
      order: 12
    - claim_id: claim:og-reproduction
      proposition: A self-maintaining protocell reproduces by metabolism-coupled growth and division into a lineage. Metabolism drives growth to a division at measured geometry with viable daughters, beating a null where growth is decoupled from metabolism or division is imposed (og-33, qualified); net throughput grows the compartment to division rather than lysis or starvation, mass-conserved, where a no-throughput ablation does not (og-growth-division, supported); and a growing, dividing individual builds a >=3-generation lineage with volume conserved across division (og-growth-alt, supported). Headline verdict qualified (coarse-grained geometry/budget abstraction); every matched null and every arm verdict preserved.
      verdict: qualified
      evidence_refs: *id014
      order: 13
    - claim_id: claim:og-evolvability
      proposition: 'A daughter-inherited chemical difference produces a reproducible, selectable fitness difference and the population shifts under selection rather than drifting: parent-offspring fitness correlation +0.949 vs a no-inheritance control, population shift +0.551 vs drift -0.004, against a matched no-inheritance null (og-34, canonical). Qualified — evolvability demonstrated on the modeled trait space; open-ended chemical novelty beyond that space is not.'
      verdict: qualified
      evidence_refs: *id015
      order: 14
    - claim_id: claim:og-ecology
      proposition: Protocell-era chemistry is ecological before it is cellular. A stochastic cross-feeding community out-produces the best single lineage with the margin causally attributable to cross-feeding and coexistence stabilized (not assumed), though the community is NOT more robust than monoculture and low-count stochasticity materially changes outcomes (og-36, qualified); a connected metacommunity beats an isolated control with cross-feeding robustness and closed ledgers (og-07, supported); and real metabolite exchange makes community function PRECEDE cell completeness and VANISH without exchange, segregated placement keeping function (og-07-alt, supported). Headline verdict qualified; every matched null and every arm verdict preserved.
      verdict: qualified
      evidence_refs: *id016
      order: 15
    - claim_id: claim:og-energetics
      proposition: 'Across fidelities, a protocell''s energetics buy robustness/persistence, not raw throughput. A primitive carrier captures geochemical free energy into a transferable store with a closing ledger (proto-energetics arm, supported); a compartment internalizes electrochemical work under selection and pays for it within a Sojo-bounded survival region (internalization arm, supported); which coupling chemistry pays is structure-sensitive and membrane-leak-dependent (5-class alt arm, supported, classes agree ~46%); and a specified thioester carrier does useful work through a gradient dip where gradient-only starves but does NOT improve total useful work (sharpened Gate-E arm, og-35, qualified). The consolidated headline is bounded by that sharpest arm: qualified, dip-persistence not throughput. Every matched null and every arm verdict is preserved.'
      verdict: qualified
      evidence_refs: *id017
      order: 16
    - claim_id: claim:og-independence
      proposition: 'A vent-born protocell lineage reaches GRADED, attributed independence, not an all-or-nothing (and not a free) escape. og-08 withdrew gradient + mineral + feed JOINTLY and found a coordinated innovation set {internal pump, importer, heredity} where any single removal collapses persistence — but joint relaxation cannot attribute which innovation rescues which support, so that general minimal-sufficiency reading is rescoped to a reduced, model-specific hypothesis (supported within its one coarse model). og-08-alt-robust then tests the set ACROSS model structures on a 2³ subset lattice and resolves it driver-specifically: the {pump, importer, heredity} triple is advantageous but NOT a jointly-necessary irreducible unit — only pump+heredity interact positively, the active importer is required by no driver (a net cost under a leaky membrane), and the hard dependency is the geological gradient (the full set rescues its withdrawal in only ~4.2% of structures), while mineral (0.958)
        and feed (0.75) are freely/borderline survivable needing no specific innovation. og-37''s one-at-a-time withdrawal agrees: the gradient is the budget-sensitive hard dependency (pump-internalization flips below pump efficiency ~0.7, grounded in the energy arm''s persistence-not-throughput surplus), while mineral and feed need no innovation. Because the feed is LUMPED (H2+CO2+organics) and the innovations are coarse budget abstractions, this is an affordability/attribution profile, not a demonstrated escape — headline verdict qualified. Every matched null and every arm verdict is preserved explicitly.'
      verdict: qualified
      evidence_refs: *id018
      order: 17
    - claim_id: claim:og-self-maintaining-concentrated
      proposition: 'Reciprocal chemistry-boundary self-maintenance can close spatially: coupling the vent pore''s real thermophoretic (Baaske) trap to the refuted loop lifts the amphiphile pool across its CAC and earns a membrane without a built-in gain - but only at near-maximal trapping (S_T >= ~0.07, dT >= ~45 K). At conservative vent Soret it does not close, so the refutation is re-cast as a quantified conditional, not overturned.'
      verdict: qualified
      evidence_refs: *id019
      order: 18
    - claim_id: claim:og-self-maintaining-individual
      proposition: 'The coupled chemistry-and-boundary system does not maintain itself endogenously under defensible vent conditions: the chemistry''s acetate (even at og-operating-window''s favorable corner) yields an amphiphile pool ~4 orders below its CAC at the corner and ~7 orders below at the canonical point, so no membrane forms without assuming it, and reciprocal maintenance fails to close without a built-in retention gain - across all three ablations. A scoped refutation of endogenous closure; the broader individuality-emergence question stays open (§9).'
      verdict: refuted
      evidence_refs: *id020
      order: 19
    - claim_id: claim:og-evolvable-lineages
      proposition: 'Given a granted individual, stochastic partition + variation produce real heritable, selectable adaptation that shifts the population strongly above both matched nulls (no-inheritance and shared-feed) and re-tracks a changed environment - but it is bounded fixed-trait selection (heritable variance declines as it converges; the trait space is a fixed scalar), not open-ended novelty. Combined with og-self-maintaining-individual: the individuality bottleneck is the binding one; given an individual, evolvability works but is bounded. Qualified.'
      verdict: qualified
      evidence_refs: *id021
      order: 20
    - claim_id: claim:og-vent-specificity
      proposition: 'A generic drive stripped of ALL THREE vent features at once (no sustained H2, no Fe/Ni/S catalyst, no pore concentration) fails all five discriminating gates on the same real og-01/02/03 composites while the vent passes each — so the campaign''s gates are NOT merely generic non-equilibrium detectors; the generic-nonequilibrium null is refuted by every gate (og-adv, canonical; verdict=refuted = null correctly rejected, gate_status=passed = the control discriminates). This is a LUMPED, all-feature-ablated contrast: it does not attribute the rejection to any single feature, and full vent-specificity — against competing realistic alternative environments — is NOT yet demonstrated (the H2 × Fe/Ni/S × pore-gradient 3-way factorial and the competing-environments study are planned, not run). Consolidated: specificity is demonstrated against a feature-ablated null, not yet against competing origin environments. Every matched null and arm verdict kept.'
      verdict: refuted
      evidence_refs: *id022
      order: 21
    limitations:
    - single-regime baselines (pore-only, membrane-only)
    - transport-decoupled null (membrane off; no-gradient trap)
    - report overlap as a volume, NOT as an origin-of-life probability
    - 'Matched non-concentrating control (concentrating=False -> enrichment forced to 1): the no-built-in-gain witness.'
    - ablate chemistry->membrane (no synthesis feedback)
    - ablate membrane->chemistry (retention does not reduce washout)
    - ablate external feed
    - no built-in effective production or retention gain (the defining control)
    - no-inheritance null (inheritance=False)
    - shared-feed null (flat fitness landscape, fitness differential removed)
    - changed-environment adaptation test
    open_questions:
    - claim_id: claim:mem-m4-growth-division-propensity
      proposition: 'Membrane Division: Can a Vesicle Grow and Divide?'
      verdict: unassessed
