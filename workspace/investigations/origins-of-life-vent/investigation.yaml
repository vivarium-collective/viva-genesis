    data_package: reaction_universe (11 rules over 121 linear C1-C4 C/H/O skeletons -> 413 reversible reactions; eQuilibrator dG' for 50 formula-verified KEGG compounds + group additivity for 71; catalyst classes with a saturating site pool)
    exit_criterion: distribution of persistent/autocatalytic subnetworks; motif enrichment vs matched nulls
    result: "Vent-calibration feed: 14 persistent species, 0 motifs (every C-C route uphill at vent activities; nulls 0/24). Formose feed (10 mM CH2O): the formose cycle emerges post hoc (gain 2, dynamic 3.1), 0/24 nulls, p = 0.04; ignites only at >= ~10 mM CH2O and washout >= ~0.02/s. Curated rTCA: motif imposed (detector gain 2.99 = declared), lumped turn creates 4 C per cycle (element residual 8). Universe ledger exact; summation theorem 3.3e-3 on dominant fluxes; tolerance sensitivity 7e-6."
    next: propagate the rate-constant priors (LHS) through both arms; branched C5/C6 skeletons; rule-set-scope decision (N/P); feed the og-03 co-localized concentrations (flagship chain)
  - phase: 4
