  open_calls:
  - kind: decision
    title: 'Ocean-floor H2 / organic prior (og-independence): supply an expert prior on the Hadean ocean''s dissolved H2 and organic background (the off-gradient floor) to turn og-independence''s floor map into a prediction.'
    detail: The floor (swept 1e-3 .. 1e-1) and the bioenergetic upkeep are the numbers the off-gradient verdict turns on. The {pump, heredity} required-set is resolved (driver-specific, see decisions_resolved); this prior is the remaining open piece.
    action: resolve
    refs: []
  - kind: decision
    title: 'MARHYS 4.0 + Hadean-ocean prior (og-vent-environment): attach the MARHYS 4.0 hydrothermal-fluid compilation as a workspace dataset so the vent-calibration conditioning set becomes the ultramafic-vent population rather than Lost City alone, and choose the Hadean-ocean prior (DIC, pH, T) that replaces the modern-seawater proxy.'
    detail: The dissolved-H2 window is the binding observation (pH is mineral-buffered near 9.4 for every draw), and under full redox equilibrium DIC draws down before free H2 appears — so the H2 posterior depends most on the DIC prior and on the equilibrium-vs-kinetic carbon-redox choice, more than on any swept knob.
    action: resolve
    refs: []
  - kind: decision
    title: 'Agent motion model (og-ecology follow-up): which motion model should the ecology follow-up adopt — none, advected with the pore flow, Brownian between cells, or thermophoretic like the solutes?'
    detail: Agents currently sit on fixed cells of the enrichment field, so mixed and segregated placements give the same community-only function (pore diffusion between cells mixes the exchanged intermediate); a motion model would make that mixing a property of the agents rather than of the field.
    action: resolve
    refs: []
  - kind: decision
    title: 'Dicarboxylate membrane permeability (og-ecology): is a leakier boundary (mixed / shorter-chain amphiphiles) or a longer pore residence the defensible route for the cross-feeding C4 branch, or should the exchanged intermediate be a neutral species?'
    detail: Community function emerges only above a diacid permeability of ~3e-9 m/s at 100 s residence, while the measured passage of charged solutes through fatty-acid vesicles is ~1e-11 .. 1e-10 m/s — the canonical operating point sits inside the emergence region but above the measured range.
    action: resolve
    refs: []
  - kind: decision
    title: 'Heredity attachment thresholds (og-heredity): what precursor-copy budget, energy margin and fidelity floor are defensible for attaching heredity to a lineage?'
    detail: The build sweeps the budget x fidelity space with hypothetical values (10 copies, margin 1.0, Eigen's Q >= 1/sigma as the fidelity floor). Expert input decides where the thresholds sit and whether the mineral class's defect-copy error (the number that makes mineral_state dominate the frontier) has a measured anchor.
    action: resolve
    refs: []
  - kind: decision
    title: 'Reaction-universe rule-set scope: keep the C1-C3 C/H/O-only chemistry (as built) or fold N/P-bearing reactions in from the start so amino-acid / nucleotide-precursor motifs compete with formose?'
    detail: 'C/H/O keeps the first enrichment result on eQuilibrator-covered thermodynamics and a (C,O)-balanced null; N/P rules need N/P potentials, a redesigned null and N/P ledgers. Also open: whether branched skeletons (citrate) should be added so rTCA-type cycles can close.'
    action: resolve
    refs: []
  - kind: decision
    title: 'Unified-world architecture: adopt a single persistent-world composite with process-bigraph structural rewrites (boundary formation / division / extinction as _add/_remove/_divide on a map of individuals) and a model-class-as-axis registry as the build target, or keep the current separate-composite staging?'
    detail: The stages currently run as separate composites with hand-carried parameters and a division counter, so "a boundary forms" and "an individual divides" are scalar readouts rather than changes in the composition itself. A unified world would carry a conservation ledger across rewrites. Sequencing relative to the publication milestone is the open piece.
    action: resolve
    refs: []
  - kind: decision
    title: 'Publication scope: close the first paper at the pre-genetic arc (og-vent-environment -> og-spatial- concentration) or extend through the early-genetic arc (og-self-compartmentation protocells -> og-heredity)?'
