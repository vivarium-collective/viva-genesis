      FEM-calibrated surrogate agrees with the dolfinx reference within ~2–19% (was ~35–90% off) —
      coloc_index 0.176 (surrogate) vs 0.171 (FEM) at Pe=1/×8 — so verdict and degree both agree, a small
      residual model-structure difference. Reported as a candidate incompatibility, not a gate. In the
