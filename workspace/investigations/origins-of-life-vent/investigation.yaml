schema_version: 2
name: origins-of-life-vent
title: Origins-of-life vent campaign
created: '2026-10-11'
status: running
question: Could the first cells have originated at alkaline hydrothermal vents? Can a physically 
  plausible early-Earth vent–ocean interface generate and sustain, in order, the free energy, 
  reduced carbon, self-amplifying chemistry, concentration, and compartments a protocell needs — 
  without inserting metabolism, membranes, or heredity by assumption?
hypothesis: >-
  Under field- and lab-consistent parameter ranges, a serpentinization-fed, spatially resolved
  alkaline vent reproduces the conditions for a cellular origin: it crosses, in order, falsifiable
  thresholds for sustained carbon fixation, network persistence, concentration/individuality,
  compartmentation, internalized energy, and heritable organization — with identifiable parameter regions
  where each step fails.
lead: |
  The origin of cells, treated not as a single spark but as a staged sequence of nonequilibrium
  transitions at an alkaline hydrothermal vent — each one a falsifiable step a simulation can pass or
  fail. The guiding hypothesis is the alkaline-vent theory for the origin of life: that the vent–ocean
  interface hands a nascent cell its first free-energy source (a natural proton gradient across thin
  mineral walls), its first reduced carbon (H2-driven CO2 reduction), and a place to concentrate and
  enclose that chemistry — before the cell evolves its own membranes, pumps and genes. The campaign
  builds that vent from real geochemistry upward (serpentinization, reactive transport, H2-driven
  carbon fixation, self-amplifying networks) and runs the classical favorable and the 2026 unfavorable
  scenarios head to head rather than assuming either. Each stage is a coupled Vivarium composite of
  genuine simulators (PHREEQC, FiPy, eQuilibrator, libRoadRunner) under explicit conservation contracts.
  The first three stages — through reduced-carbon protometabolism — are built, run, and accepted; the
  remaining stages toward a compartmentalized, bioenergetically autonomous protocell are designed and
  waiting to run.
executive:
  what_is_this: A staged, falsifiable Vivarium campaign testing the alkaline-vent theory for the 
    origin of cells — treating a cellular origin as coupled transitions from geochemistry to 
    bioenergetic autonomy, grounded in serpentinization-driven alkaline hydrothermal vents, with 
    explicit competing scenarios.
  verdict: In progress — the full pre-genetic to early-genetic arc is complete and passing. og-00 
    (geochemical/spatial testbed), og-01 (geology -> reduced carbon, favorable vs. Tutolo-2026 
    arms), og-02 (reduced carbon -> protometabolism), og-03 (dilution -> localized individuals), 
    og-04 (mineral compartments -> protocells), og-05 (environmental -> internal bioenergetics) and 
    og-06 (chemistry -> heredity) are built on real simulators, run, and pass their pre-stated gates
    with conservation held to machine precision. The adversarial generic-nonequilibrium control runs
    and PASSES by rejection — every discriminating gate rejects a vent-feature-ablated control while
    the vent passes, so the gates are falsifiable and vent-specific. og-07 and og-08 remain designed
    but not yet run.
  verdict_status: in-progress
  verdict_detail: 10 member studies (Campaigns 0-VIII + an adversarial control) wired into a DAG. 
    Stages 0-6 are complete — each runs a coupled Vivarium composite of real tools (PHREEQC + FiPy; 
    eQuilibrator + FiPy; libRoadRunner; a FiPy thermal trap; amphiphile self-assembly; bioenergetic 
    internalization; an agent-based heredity lineage) and passes its conservation and acceptance 
    behavior tests. og-06's compositional-heredity headline ('heredity need not presume RNA') is 
    seed-robust (5/5 graded seeds, 0.878±0.005). The adversarial generic-nonequilibrium control (og-adv) runs and passes
    by rejection — all five discriminating gates reject a vent-feature-ablated control (min margin 
    1.8 decades) while the vent passes all five. og-07 (ecology before LUCA) and og-08 (escape from 
    the vent) remain at Design with contracts (ports + conservation invariants) and behavior tests 
    derived from their acceptance gates.
  decisions_resolved:
  - 'Baseline parameterization: run BOTH arms — classical favorable (Russell/Lane/Sojo) and the 2026 unfavorable
    reassessment (Tutolo/Jackson) — so the campaign adjudicates rather than assumes. Implemented in og-01.'
  - 'Primary geochemistry engine: real PHREEQC (phreeqpython + vendored llnl.dat), which fields the Lost
    City pH endmember once peridotite (not dunite) is reacted. Reaktoro was conda-only and off the uv
    path.'
  - 'Build order: geochemistry + transport first (og-00/og-01), then the reaction network (og-02) — not
    a thin end-to-end skeleton. This put a real composite in the workbench at stage 0.'
  - "Heredity strategy for og-06: compare all modules without presuming RNA. og-06's agent-based lineage
    grades RNA-like template, compositional (GARD), a template-focused hybrid and a non-heritable control
    head-to-head; compositional and hybrid heredity persist length-independently (functional persistence
    ~0.88, seed-robust 5/5 graded seeds) where a long low-fidelity template suffers the Eigen length catastrophe —
    so heredity need NOT presume a long high-fidelity RNA template."
  decisions_needed:
  - question: 'Publication milestone: close the first paper at the pre-genetic arc (og-00 -> og-03) or
      extend through the early-genetic arc (og-04 protocells -> og-06 heredity)?'
    context: 'og-00 -> og-06 have now all run and passed, so both scopes are available. The pre-genetic
      arc (og-00->03: a precipitating interface retaining a persistent protometabolic carbon flux, then
      localized individuals) is the tightest standalone story; extending through og-04-06 adds membrane
      compartmentation, bioenergetic internalization and the agent-based heredity result. Editorial scope
      call.'
  - question: 'First limiting resource / next module: which enrichment-plan module to build first — nitrogen
      assimilation (N2/NO3->NH4, FeS), phosphorus availability (phosphate/polyphosphate co-concentration),
      proto-energetics (thioester/acyl-phosphate energy currency before pumping), or metabolism->growth/division
      (osmotic growth)?'
    context: The Scientific Enrichment Plan (references/scientific-enrichment-plan.md) argues carbon
      is not the only bottleneck. Its recommended arc inserts N, then P, then a coupled C-N-P 
      protometabolism, with proto-energetics before og-05 and growth/division after og-04. Each is a
      new adjacent study of similar size to og-00..06; help-team is already building og-07/08.
  - question: 'Enrich og-01 with explicit electrochemistry (treat the vent as an electrical circuit: fluid
      composition -> redox potential -> mineral conductivity -> current density -> electron-transfer ->
      CO2 reduction), or keep the current gradient-efficiency abstraction?'
    context: "Plan section 2 (strongest near-term enrichment). Would replace the abstract gradient_efficiency
      scalar with electrode-potential/current-density physics and let the campaign ask 'is the conductive
      Fe/Ni/S architecture the real limiting variable?'. New references added: altair2025electrochemical,
      commchem2026currentproducing, commchem2026energeticconstraints."
  - question: Actually RUN the og-03 -> og-02 localization->ignition coupling (trap enrichment feeds
      the rTCA network as a real swept phase map), resolving the demoted phantom finding and giving 
      og-03 its own Decision phase map?
    context: The claims audit found an og-03 finding asserting an in-pore ignition result that was 
      never run (now demoted to a proposed next step). Running it as a (porosity x k_wash) coupled 
      sweep would both make the 'localization makes the individual' claim real AND fix the viz 
      audit's finding that og-03's Decision view borrows og-02's axes.
  - question: Reframe the campaign's headline thesis from 'cells could originate at alkaline vents' 
      to the enrichment plan's 'quantitative MAP OF THE BOTTLENECKS between geology and cells' 
      (dependencies, failure regimes, discriminating experiments)?
    context: The plan's core thesis. The vent hypothesis stays as the primary lens, but the framing 
      shifts from demonstrating one story to mapping where the geology->cells path is physically 
      continuous, where it depends on narrow regimes, and where it breaks. Several design principles
      (phase maps not trajectories, feature ablations, negative controls, 
      negative-results-as-output) are already partly realized (og-adv, the phase maps).
scientific_argument:
  main_claim: Cells could have originated at alkaline hydrothermal vents — the vent–ocean interface 
    supplies, in order, the free energy, reduced carbon, self-amplifying chemistry, concentration, 
    compartmentation and bioenergetic internalization a protocell needs, and each step is an 
    independently falsifiable nonequilibrium transition a Vivarium simulation can pass or fail, so 
    simulations adjudicate among scenarios rather than illustrate one story.
  evidence_for:
  - H2-dependent mineral-catalyzed CO2 fixation (Preiner, Varma, Huber)
  - pH-gradient-driven CO2 reduction with isotope controls (Hudson, Altair)
  - nonenzymatic rTCA/precursor networks (Muchowska/Moran)
  - thermophoretic concentration in pores (Baaske, Mast & Braun)
  - vesicle feasibility under vent-like conditions (Jordan)
  evidence_against:
  - in-situ pH/sulfur/longevity may be far less favorable than classical models assume (Tutolo 2026;
    Jackson 2016)
  - no validated vent pathway spans to open-ended heredity (Module J)
  - lab yields are not Hadean environmental concentrations
  key_figures: []
  caveats:
  - Stages 0–2 are complete and accepted; stages 3–8 and the adversarial control are designed but 
    not yet run. Every quantitative anchor is laboratory/field provenance, not a Hadean 
    environmental concentration.
# The origin-of-cells thesis, broken into the claims the campaign tests — each
# tied to the literature it rests on (bibkeys resolve against references/papers.bib).
# The report renders these as cited bullets so every top-level claim traces to a source.
key_claims:
- claim: Alkaline hydrothermal vents sustain a natural proton gradient across thin inorganic 
    (Fe/Ni-sulfide) walls — a geologically free energy source a nascent cell could tap before 
    evolving its own membrane and pumps.
  cites: [russell1997emergence, martin2007origin, lane2012origin, sojo2016origin]
- claim: Serpentinization of olivine delivers a sustained supply of H2, the reducing power that 
    drives prebiotic chemistry at the vent.
  cites: [kelley2005serpentinite, proskurowski2008abiogenic, schwander2023serpentinization]
- claim: That H2 reduces CO2 to organic carbon on native-metal and mineral catalysts without 
    enzymes, reproducing the acetyl-CoA–like chemistry thought ancestral to life.
  cites: [preiner2020hydrogen, varma2018native, huber1997activated, martin2008hydrothermal]
- claim: Nonenzymatic reaction networks (reductive-TCA fragments) can persist and self-amplify under
    continuous vent flow, a precursor to metabolism.
  cites: [muchowska2019synthesis, muchowska2017metals]
- claim: Thermal gradients in vent pores concentrate molecules by thermophoresis — a route to 
    localized, individual-like accumulations against dilution.
  cites: [baaske2007extreme, mast2010thermal]
- claim: Fatty-acid vesicles can assemble and persist under vent-like temperature and pH, giving the
    chemistry a compartment.
  cites: [jordan2019promotion]
- claim: The classical favorable picture is contested — in-situ pH, sulfide availability and vent 
    longevity may be far less favorable than classical models assume, so each step is run against 
    that challenge.
  cites: [tutolo2026rethinking, jackson2016natural, weiss2016physiology]
