    vg-reaction-universe: viva_genesis/protometabolism/{universe,motifs,universe_process}.py + composites/open_chemical_network.py + data/vg_data/reaction_universe.yaml (built; rule-based generator, eQuilibrator potentials, (C,O)-matched nulls, post-hoc detector, NetworkLedgerProcess)
    vg-pore: built and run (localization) — the localization face carries two multisolute pore classes
      (viva_genesis/multisolute_localization.py — a numpy MultisolutePoreSurrogateProcess + a
