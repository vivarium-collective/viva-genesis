schema_version: 2
name: origins-of-life-vent
title: Origins-of-life vent campaign
created: '2026-10-11'
status: running
question: Could the first cells have originated at alkaline hydrothermal vents? Can a physically 
  plausible early-Earth vent–ocean interface generate and sustain, in order, the free energy, 
  reduced carbon, self-amplifying chemistry, concentration, and compartments a protocell needs — 
  without inserting metabolism, membranes, or heredity by assumption?
hypothesis: >-
  Under field- and lab-consistent parameter ranges, a serpentinization-fed, spatially resolved
  alkaline vent reproduces the conditions for a cellular origin: it crosses, in order, falsifiable
  thresholds for sustained carbon fixation, network persistence, concentration/individuality,
  compartmentation, internalized energy, and heritable organization — with identifiable parameter regions
  where each step fails.
lead: |
  The origin of cells, treated not as a single spark but as a staged sequence of nonequilibrium
  transitions at an alkaline hydrothermal vent — each one a falsifiable step a simulation can pass or
  fail. The guiding hypothesis is the alkaline-vent theory for the origin of life: that the vent–ocean
  interface hands a nascent cell its first free-energy source (a natural proton gradient across thin
  mineral walls), its first reduced carbon (H2-driven CO2 reduction), and a place to concentrate and
  enclose that chemistry — before the cell evolves its own membranes, pumps and genes. The campaign
  builds that vent from real geochemistry upward (serpentinization, reactive transport, H2-driven
  carbon fixation, self-amplifying networks) and runs the classical favorable and the 2026 unfavorable
  scenarios head to head rather than assuming either. Each stage is a coupled Vivarium composite of
  genuine simulators (PHREEQC, FiPy, eQuilibrator, libRoadRunner — plus a merged FEniCS/dolfinx FEM
  solver run under pixi as a high-fidelity cross-check) under explicit conservation contracts.
  All fourteen stages — the full arc from vent geochemistry through carbon fixation, protometabolism,
  individuality, compartmentation, internalized bioenergetics and heredity to ecology, escape, and the
  nitrogen/phosphorus/energy/growth bottlenecks — are built, run on real simulators, and pass their
  pre-stated falsifiable gates, with an adversarial vent-ablated control rejected by every
  discriminating gate.
executive:
  what_is_this: A staged, falsifiable Vivarium campaign testing the alkaline-vent theory for the 
    origin of cells — treating a cellular origin as coupled transitions from geochemistry to 
    bioenergetic autonomy, grounded in serpentinization-driven alkaline hydrothermal vents, with 
    explicit competing scenarios.
  verdict: The full geochemistry-to-heredity arc runs and passes. All fourteen member studies
    execute on real simulators and pass their pre-stated, falsifiable gates with conservation held
    to machine precision — a Lost City vent (og-00), H2-driven carbon fixation benchmarked against
    Preiner/Hudson with the Tutolo-2026 risk mapped (og-01), a self-amplifying rTCA network (og-02),
    thermophoretic individuality (og-03), amphiphile compartments (og-04), internalized bioenergetics
    bounded by the Sojo cost (og-05), heredity that need not presume RNA (og-06), metacommunity
    robustness (og-07), an irreducible escape set {pump, importer, heredity} (og-08), plus the
    nitrogen, phosphorus, energy-currency and growth/division bottleneck modules. Every step also has
    a mapped failure region, and the adversarial generic-nonequilibrium control passes by rejection —
    every discriminating gate rejects a vent-feature-ablated control while the vent passes — so the
    gates are falsifiable and vent-specific. What remains open is editorial (publication scope) and
    architectural (folding the stages into one persistent world), not unrun science.
  verdict_status: complete
  verdict_detail: 14 member studies (Campaigns 0–VIII, four resource/energy bottleneck modules, and
    an adversarial control) wired into a DAG — all run and passing. Each runs a coupled Vivarium
    composite of real tools (PHREEQC + FiPy; eQuilibrator + FiPy; libRoadRunner; a FiPy thermal trap;
    amphiphile self-assembly; bioenergetic internalization; an agent-based heredity lineage; a pore
    metacommunity; an osmotic growth/division compartment) and passes its conservation and acceptance
    gates. Headline results carry numbers — og-00 holds the Lost City window (T 40–91 °C, pH 9.0–10.8,
    positive H2 flux) over ~80% of the swept grid with |charge|=0; og-01 reproduces the Preiner/Hudson
    yields and shows the Tutolo arm halve the usable proton-motive gradient (427→43 mV); og-02 reaches
    autocatalytic gain ~29.5; og-06's compositional/hybrid heredity is seed-robust (0.878±0.005, 5/5
    graded seeds, 8/8 in a wider sweep); og-08's escape set is irreducible (full set survives 1.0,
    any single knockout 0). The adversarial control is rejected by all five discriminating gates
    (min margin 1.8 decades) while the vent passes all five.
  decisions_resolved:
  - 'Baseline parameterization: run BOTH arms — classical favorable (Russell/Lane/Sojo) and the 2026 unfavorable
    reassessment (Tutolo/Jackson) — so the campaign adjudicates rather than assumes. Implemented in og-01.'
  - 'Primary geochemistry engine: real PHREEQC (phreeqpython + vendored llnl.dat), which fields the Lost
    City pH endmember once peridotite (not dunite) is reacted. Reaktoro was conda-only and off the uv
    path.'
  - 'Build order: geochemistry + transport first (og-00/og-01), then the reaction network (og-02) — not
    a thin end-to-end skeleton. This put a real composite in the workbench at stage 0.'
  - "Heredity strategy for og-06: compare all modules without presuming RNA. og-06's agent-based lineage
    grades RNA-like template, compositional (GARD), a template-focused hybrid and a non-heritable control
    head-to-head; compositional and hybrid heredity persist length-independently (functional persistence
    ~0.88, seed-robust 5/5 graded seeds) where a long low-fidelity template suffers the Eigen length catastrophe —
    so heredity need NOT presume a long high-fidelity RNA template."
  decisions_needed:
  - question: 'Publication milestone: close the first paper at the pre-genetic arc (og-00 -> og-03) or
      extend through the early-genetic arc (og-04 protocells -> og-06 heredity)?'
    context: 'og-00 -> og-08 plus the bottleneck modules have now all run and passed, so every scope is
      available. The pre-genetic arc (og-00->03: a precipitating interface retaining a persistent
      protometabolic carbon flux, then localized individuals) is the tightest standalone story; extending
      through og-04-06 adds membrane compartmentation, bioenergetic internalization and the agent-based
      heredity result; the full arc also carries ecology (og-07), escape (og-08) and the N/P/energy/growth
      bottlenecks. Editorial scope call.'
  - question: 'First limiting resource / next module: which enrichment-plan module to build first — nitrogen
      assimilation (N2/NO3->NH4, FeS), phosphorus availability (phosphate/polyphosphate co-concentration),
      proto-energetics (thioester/acyl-phosphate energy currency before pumping), or metabolism->growth/division
      (osmotic growth)?'
    context: The Scientific Enrichment Plan (references/scientific-enrichment-plan.md) argues carbon
      is not the only bottleneck. Its recommended arc inserts N, then P, then a coupled C-N-P 
      protometabolism, with proto-energetics before og-05 and growth/division after og-04. Each is a
      new adjacent study of similar size to og-00..06; help-team is already building og-07/08.
  - question: 'Enrich og-01 with explicit electrochemistry (treat the vent as an electrical circuit: fluid
      composition -> redox potential -> mineral conductivity -> current density -> electron-transfer ->
      CO2 reduction), or keep the current gradient-efficiency abstraction?'
    context: "Plan section 2 (strongest near-term enrichment). Would replace the abstract gradient_efficiency
      scalar with electrode-potential/current-density physics and let the campaign ask 'is the conductive
      Fe/Ni/S architecture the real limiting variable?'. New references added: altair2025electrochemical,
      commchem2026currentproducing, commchem2026energeticconstraints."
  - question: Actually RUN the og-03 -> og-02 localization->ignition coupling (trap enrichment feeds
      the rTCA network as a real swept phase map), resolving the demoted phantom finding and giving 
      og-03 its own Decision phase map?
    context: The claims audit found an og-03 finding asserting an in-pore ignition result that was 
      never run (now demoted to a proposed next step). Running it as a (porosity x k_wash) coupled 
      sweep would both make the 'localization makes the individual' claim real AND fix the viz 
      audit's finding that og-03's Decision view borrows og-02's axes.
  - question: Reframe the campaign's headline thesis from 'cells could originate at alkaline vents' 
      to the enrichment plan's 'quantitative MAP OF THE BOTTLENECKS between geology and cells' 
      (dependencies, failure regimes, discriminating experiments)?
    context: The plan's core thesis. The vent hypothesis stays as the primary lens, but the framing 
      shifts from demonstrating one story to mapping where the geology->cells path is physically 
      continuous, where it depends on narrow regimes, and where it breaks. Several design principles
      (phase maps not trajectories, feature ablations, negative controls,
      negative-results-as-output) are already partly realized (og-adv, the phase maps).
  - question: 'Adopt the Full Modeling Plan architecture (emergence-not-presupposition + structural
      rewrites + canonical schemas + model substitution) as the campaign''s build target, in the plan''s
      section-18 order — canonical schemas + geochemical_world first, then the electrochemical interface,
      then C-N-P/energetics as cross-cutting layers, then localization, boundary, growth/division
      rewrites, competing heredity, ecology, autonomy?'
    context: "The integration design is tracked in references/full-modeling-plan-integration.md. It keeps
      every existing process and composite (they become the model classes behind canonical faces) and
      adds: viva_genesis/schemas.py (units-typed shared types), one persistent world composite that
      later stages extend by composition, boundary-formation / division / extinction / conditional-
      heredity as process-bigraph structural rewrites (_add/_remove/_divide sentinels on a map of
      individuals, verified available in process-bigraph 1.8.5), a model registry so a study can sweep
      the model CLASS as an axis and report structure-vs-parameter uncertainty, and a conservation
      ledger (matter, charge, free energy) that spans rewrites. Decision needed on sequencing relative
      to the publication milestone and on the hypothetical thresholds (heredity attachment, assembly)."
  - question: 'Adopt the Model Upgrade plan''s three-quantity standard (feasibility / robustness /
      discrimination) and evidence tiers as the reporting requirement for every stage — i.e. a stage''s
      verdict may not advance until it carries a TransitionReport whose decision-discipline audit is
      clean — and re-label the fourteen existing studies with their tier language?'
    context: 'Phase 1 is done this way (og-cal-vent-environment; references/model-upgrade-integration.md
      sections 1 and 6): the Lost-City-conditioned vent ensemble reports the posterior-viable fraction, the
      cross-class agreement and the discriminating readouts, with the ledger clean. The remaining studies
      currently report gate PASS/FAIL on swept grids; under the standard most of their claims are
      mechanistic predictions or conceptual demonstrations (guidelines.scientific_standard.
      tier_reading_of_current_studies). Editorial + sequencing call: apply the tier language now, and run
      Phases 2-9 in the recorded order (electrochemistry first) or re-order around the publication scope.'
  - question: 'Attach the MARHYS 4.0 hydrothermal-fluid compilation (PANGAEA) as a workspace dataset so the
      Phase-1 conditioning set becomes the ultramafic-vent population rather than Lost City alone — and
      which Hadean-ocean prior (DIC, pH, T) should replace the modern-seawater proxy the audit flags?'
    context: 'The vg-data package vent_environment marks marhys_conditioning as pending and leaves fluid_dic
      / ocean pH 6.0 / 275 K classed extrapolated-and-unsourced on purpose. In the Phase-1 ensemble the
      dissolved-H2 window is the binding observation (pH is mineral-buffered at ~9.4 for every draw) and,
      under full redox equilibrium in llnl.dat, DIC is reduced before free H2 appears — so the H2 posterior
      depends directly on the DIC prior and on the equilibrium-vs-kinetic carbon-redox choice. The expert''s
      prior here changes the posterior more than any swept knob does.'
  architecture_thesis: >-
    Do not start with a cell. The campaign builds a geological world (environment, minerals,
    molecules, energy) in which increasingly biological organization must EMERGE, and the Process
    Bigraph itself changes shape as it does: localization creates persistent chemical regions;
    boundary formation creates a protocell composite around localized chemistry; growth and division
    rewrite one individual into two daughters with stochastic partitioning; sustained negative energy
    balance dissolves an individual back into the environment; an inheritance process is attached to
    an individual only when precursor availability, copying chemistry and fidelity support it. The
    same environmental world persists across all stages — new processes and bounded agents are added
    by structural transition, never by replacing the earlier model. Shared canonical biological schemas
    (environment, minerals, molecules, energy, boundary, individual, heredity, lineage/ecology) make
    every model class substitutable behind one interface, so swapping a model while holding the world
    constant becomes an experiment that separates parameter uncertainty from model-structure
    uncertainty. Endpoint: cells arise when processes previously distributed across the environment
    become composed inside a persistent, reproducing, heritable boundary.
scientific_argument:
  main_claim: Cells could have originated at alkaline hydrothermal vents. In simulation on real
    geochemical and chemical engines, a serpentinization-fed vent–ocean interface supplies — in order
    — the free energy, reduced carbon, self-amplifying chemistry, concentration, compartmentation,
    internalized bioenergetics and heritable organization a protocell needs, each as an independently
    falsifiable nonequilibrium transition. The full arc passes its pre-stated gates, every step has a
    mapped parameter region where it fails, and an adversarial vent-ablated control is rejected by
    every discriminating gate — so the campaign adjudicates the vent mechanism rather than illustrating
    one story.
  evidence_for:
  - H2-dependent mineral-catalyzed CO2 fixation (Preiner, Varma, Huber)
  - pH-gradient-driven CO2 reduction with isotope controls (Hudson, Altair)
  - nonenzymatic rTCA/precursor networks (Muchowska/Moran)
  - thermophoretic concentration in pores (Baaske, Mast & Braun)
  - vesicle feasibility under vent-like conditions (Jordan)
  evidence_against:
  - in-situ pH/sulfur/longevity may be far less favorable than classical models assume (Tutolo 2026;
    Jackson 2016)
  - no validated vent pathway spans to open-ended heredity (Module J)
  - lab yields are not Hadean environmental concentrations
  key_figures: []
  caveats:
  - Every quantitative anchor is laboratory or field provenance, not a measured Hadean
    environmental concentration — the campaign tests whether each mechanism is feasible and where
    it fails, not that these exact values held on the early Earth.
  - A few headline magnitudes are solver-sensitive extrapolations, not resolved results — notably
    og-03's enrichment fold (~1e6–1e7 at accumulation Péclet ≈ 18 is an extrapolation above the
    Pe ≈ 13 the solver resolves); the defensible claim there is that localization occurs and is
    bounded, not the exact fold-magnitude.
  - The stages currently run as separate composites with hand-carried parameters and a division
    counter rather than one persistent world whose bigraph restructures; until the Full Modeling
    Plan architecture lands (references/full-modeling-plan-integration.md), "a boundary forms" and
    "an individual divides" are scalar readouts, not changes in the composition itself.
  emergence_criterion: >-
    A passing stage must show organization that was NOT inserted by assumption: no cell object exists
    at the start of a run; individuals appear only when localized chemistry crosses assembly criteria
    (a structural rewrite that adds a protocell composite); they reproduce only by a division rewrite
    with conserved partitioning; they disappear by an extinction rewrite that returns their matter to
    the environment; and heredity is attached only when the chemistry supports it. Matter, charge and
    free energy are accounted across every such rewrite.
  model_structure_vs_parameters: >-
    Every interface (environment, carbon_fixation, proto_metabolism, localization, boundary,
    heredity) admits alternative model classes behind one canonical face. A stage's gates are run
    against each class on identical parameter axes; the region where all classes agree is the
    parameter-robust claim, the region where they disagree is model-structure uncertainty, reported
    separately. Competing origin scenarios (deep alkaline vent, shallow vent, terrestrial geothermal,
    generic nonequilibrium control) enter as substitutions on the environment interface, so the
    adversarial control generalizes to every stage.
  endpoint: Cells arise when processes previously distributed across the environment become composed
    inside a persistent, reproducing, heritable boundary — a biological transition that is also a
    change in the Process Bigraph itself.
guidelines:
  architecture_reference: references/full-modeling-plan-integration.md
  # The Model Upgrade and Implementation Plan (2026-10-14) supersedes the above as the
  # campaign's build target; the older doc stays the detailed rewrite/layer design.
  upgrade_reference: references/model-upgrade-integration.md
  scientific_standard:
    source: Model Upgrade and Implementation Plan, section 1 (references/model-upgrade-integration.md section 1)
    three_quantities:
    - 'Feasibility: does at least one physically admissible parameterization (inside the stated
      conditioning set) support the transition?'
    - 'Robustness: what fraction of the empirically supported (conditioned, not merely swept) parameter
      distribution supports it, and across which model classes? 1 - structure_agreement is reported
      separately as model-form uncertainty.'
    - 'Discrimination: which observations or perturbations distinguish the favored mechanism from
      plausible alternatives (paired class differences on identical draws)?'
    implemented_in: viva_genesis/uq/report.py (TransitionReport, EvidenceTier, decision_discipline)
    evidence_tiers:
      reproduction: reproduces an external measured or established result -> "reproduces / validates"
      mechanistic_prediction: a parameterized model makes a new quantitative prediction -> "predicts under stated assumptions"
      conceptual_demonstration: a reduced model shows an organizational principle is possible -> "demonstrates in a coarse-grained model"
    tier_reading_of_current_studies:
      reproduction: [og-00-vent-reactor-baseline, og-01-geology-to-reduced-carbon (Preiner/Hudson yields), og-cal-vent-environment (conditioning step)]
      mechanistic_prediction: [og-01-geology-to-reduced-carbon (Tutolo collapse), og-02-reduced-carbon-to-protometabolism,
        og-03-dilution-to-localized-individuals, og-04-mineral-compartments-to-protocells, og-res-nitrogen-assimilation,
        og-res-phosphorus-availability, og-energy-proto-energetics, og-growth-division, og-cal-vent-environment (posterior prediction)]
      conceptual_demonstration: [og-05-environmental-to-internal-bioenergetics, og-06-chemistry-to-heredity,
        og-07-ecology-before-luca, og-08-escape-from-the-vent]
      null_control: [og-adv-generic-nonequilibrium]
    decision_discipline:
    - Do not move a headline conclusion forward if it depends on a numerically unvalidated regime.
    - Do not call a mechanism necessary until it survives alternative model structures.
    - Do not call a pathway emergent when its topology or capability was inserted by design.
    - Treat incompatibility between stages as a primary discovery, not a failure of the campaign.
    - Prioritize experiments that discriminate between mechanisms over experiments that tighten one fitted parameter.
    - A phase's posterior gate (threshold + pass logic) is declared before its ensemble is run.
  vg_deliverables:
    vg-data: viva_genesis/provenance.py + viva_genesis/data/vg_data/*.yaml (built; first package vent_environment)
    vg-geochemical-world: viva_genesis/composites/geochemical_world.py + viva_genesis/ledger.py (built; Reaktoro/PFLOTRAN classes + mineral feedback planned)
    vg-electrochemistry: Phase 2 (planned; carbon_fixation face with butler_volmer + microkinetic classes)
    vg-reaction-universe: Phase 3 (planned; rule-based generator + matched null networks)
    vg-pore: Phase 4 (planned; FEniCS multisolute Soret + pore-network surrogate)
    vg-protoindividual: Phase 5 (planned; endogenous amphiphiles + boundary/division rewrites)
    vg-energy: Phase 6 (planned; energy ledger + competing coupling classes)
    vg-heredity: Phase 7 (planned; six heredity classes behind one face + information metrics)
    vg-ecology: Phase 8 (planned; real networks per protocell on shared fields)
    campaign-uq-layer: viva_genesis/uq/ (built; ABC/importance calibration, Morris+Sobol, structural ensembles, propagation, report triple)
  roadmap_phases:
  - phase: 1
    name: Environmental calibration
    status: built-and-run
    studies: [og-00-vent-reactor-baseline, og-cal-vent-environment]
    component: geochemical_world behind the serpentinization + spatial_transport faces, with ConservationLedgerProcess
    data_package: vent_environment (Lost City windows; MARHYS 4.0 pending)
    exit_criterion: posterior probability of viable vent states; validated mass/charge/energy ledger
    next: attach MARHYS 4.0; Reaktoro/PFLOTRAN classes under pixi; MineralEvolutionProcess (reactor-stays-open gate); held-out H2 prediction
  - phase: 2
    name: Electrochemical carbon fixation
    status: planned
    studies: [og-01-geology-to-reduced-carbon, og-01-cal-electrochemistry]
    component: carbon_fixation face with empirical | butler_volmer | microkinetic classes; MineralConductivityProcess derives gradient_efficiency
    data_package: electrochemical_interface (Altair 2025, Panico 2026)
    exit_criterion: mechanism map - thermodynamic vs electrical vs catalytic vs transport limitation, classes agreeing on the label in the favorable region
  - phase: 3
    name: Open chemical network
    status: planned
    studies: [og-02-reduced-carbon-to-protometabolism, og-02-alt-reaction-universe]
    component: proto_metabolism face with curated_rtca | reaction_universe | null_network classes
    data_package: reaction_universe (rule set, eQuilibrator dG', catalyst constraints)
    exit_criterion: distribution of persistent/autocatalytic subnetworks; motif enrichment vs matched nulls
  - phase: 4
    name: 3-D multisolute localization
    status: planned
    studies: [og-03-dilution-to-localized-individuals, og-03-alt-colocalization]
    component: localization face with fipy | fenics (species Soret) | pore_network classes
    data_package: pore_physics (per-species D, S_T)
    exit_criterion: co-localization / fractionation phase maps inside a demonstrated numerical-convergence envelope (no gate above the resolvable Peclet)
  - phase: 5
    name: Endogenous boundary + growth/division
    status: planned
    studies: [og-04-mineral-compartments-to-protocells, og-growth-division, og-04-alt-endogenous-boundary, og-growth-alt-physical-reproduction]
    component: AmphiphileSynthesisProcess; BoundaryFormation / Division / Lysis / Extinction structural rewrites on agents map[vg_individual]
    data_package: amphiphile_assembly (Jordan 2019; Lu 2024)
    exit_criterion: first continuous transition from chemistry to a growing, dividing individual with rewrite_residual == 0
  - phase: 6
    name: Proto-energetics
    status: planned
    studies: [og-energy-proto-energetics, og-05-environmental-to-internal-bioenergetics, og-energy-alt-internalization-threshold]
    component: energy_coupling face (passive_gradient | h_na_leaky_membrane | thioester_acyl_phosphate | polyphosphate | fe_redox) inside each protocell; per-individual autonomy
    data_package: energy_currencies
    exit_criterion: energy-capture efficiency and the threshold at which internalization beats leakage + maintenance
  - phase: 7
    name: Competing heredity
    status: planned
    studies: [og-06-chemistry-to-heredity, og-06-alt-information-per-cost]
    component: heredity face (compositional | network | peptide | rna_like | hybrid | mineral_state) attached conditionally; Gillespie at low copy number
    data_package: inheritance_budgets
    exit_criterion: information-per-cost frontier; transition to templated heredity
  - phase: 8
    name: Biochemical ecology
    status: planned
    studies: [og-07-ecology-before-luca, og-07-alt-real-metabolite-exchange]
    component: proto_ecology with real networks per protocell on shared spatial fields; exchange rules; EcologyReducerStep keeps og-07 gate names
    data_package: cnp_resources + reaction_universe
    exit_criterion: emergent cross-feeding, division of labor and robustness from flux and permeability, not symbolic capability transfer
  - phase: 9
    name: Integrated autonomy
    status: planned
    studies: [og-08-escape-from-the-vent, og-adv-generic-nonequilibrium, og-08-alt-robust-innovation-set]
    component: one persistent world with an AblationStep; the {pump, importer, heredity} result re-run under an ensemble of maintenance / transport / storage / permeability / inheritance structures
    data_package: all packages, posterior-propagated from Phase 1
    exit_criterion: the intersection of innovations required across model structures, with the continuous autonomy fraction decomposed by function
  architecture_principles:
  - Build the world, not the cell — environmental stores and processes first; no individual-level
    state exists until a structural rewrite creates it.
  - The same environmental world persists through every stage; stages extend it by composition
    (merging layer generators), never by a replacement composite.
  - "Boundary formation, growth, division, extinction and heredity attachment are process-bigraph
    structural rewrites (_add / _remove / _divide on a map of individuals, a nested local:Composite
    per protocell), logged as events and checked by a conservation ledger."
  - Simulator-native variables are adapted into canonical biological schemas (viva_genesis/schemas.py;
    units-typed vg_* types) so model classes are substitutable behind one face.
  - "Model substitution is an experiment: sweep the model class as a categorical axis against the same
    gates; report parameter-robust vs structure-sensitive regions."
  - "Spatial transport (advection-diffusion-reaction + thermophoretic drift over the vent/pore domain)
    is a solver-agnostic interface with two REAL, merged classes: FiPy (pure-Python finite volume, uv
    .venv) is the live default that backs every graded gate and sweep; FEniCS/dolfinx via viva-fenics
    (compiled FEM + PETSc + Soret drift) is the high-fidelity STRUCTURAL cross-check, run on demand under
    viva-fenics's pixi env (dolfinx is conda-only, so it is not available in the uv workbench — selecting
    'fenics' there raises a clear 'run under pixi' error). The FiPy↔FEniCS head-to-head is a reported
    solver-robustness readout, not a graded gate: it agrees on the smooth og-00 vent (outlet T within
    0.30%, identical pH) and exposes where the og-03 trap's reduced FiPy column over-extrapolates (the
    solvers diverge ~5.6 decades above Pe ≈ 13). Phase maps are sped up independently of solver choice by
    Ray-parallel sweeps on the mini and a declared reduced surrogate for Decision-map cells (full PDE for
    the World view)."
  - C-N-P chemistry, proto-energetics and free-energy accounting are cross-cutting layers (one shared
    molecule pool, a resource-budget step, a world-and-individual energy currency, a ledger), not side
    studies.
  - Phase maps over trajectories; explicit parameter provenance tiers; mechanism ablations for
    necessity; adversarial controls; negative results as first-class outputs; World / Mechanism /
    Decision views kept in sync for every study.
  canonical_schemas:
    module: viva_genesis/schemas.py (implemented 2026-10-14 — registered by build_core; faces audited against it)
    layers:
    - physical world — vg_environment, vg_minerals, vg_molecules, vg_energy
    - boundary — vg_boundary
    - individual — vg_individual (volume, internal pool, boundary, energy, autonomy, maybe[heredity])
    - heredity + lineage/ecology — vg_heredity, vg_lineage
  reusable_composites:
    plan: [geochemical_world, electrochemical_interface, prebiotic_chemistry, pore_localization,
      proto_boundary, proto_individual, proto_bioenergetics, proto_heredity, proto_ecology]
    note: Each is a layer generator built from the existing processes; stage composites merge layers.
  implementation_order:
  - 1. canonical schemas + geochemical_world (+ mineral evolution, conservation ledger, rewrite spike)
  - 2. electrochemical_interface (derive gradient efficiency from circuit physics; fixation model classes)
  - 3. expanded prebiotic_chemistry — C-N-P + proto-energetics as cross-cutting layers
  - 4. pore_localization on shared spatial fields (first _add rewrite: localized regions)
  - 5. proto_boundary + endogenous amphiphile production (boundary-formation rewrite -> protocell composite)
  - 6. growth / division / extinction structural rewrites
  - 7. competing heredity modules behind one face, attached conditionally
  - 8. proto_ecology (shared fields, exchange rules)
  - 9. autonomy / ablation campaign (autonomy continuum, minimum innovation set)
# The origin-of-cells thesis, broken into the claims the campaign tests — each
# tied to the literature it rests on (bibkeys resolve against references/papers.bib).
# The report renders these as cited bullets so every top-level claim traces to a source.
key_claims:
- claim: Alkaline hydrothermal vents sustain a natural proton gradient across thin inorganic 
    (Fe/Ni-sulfide) walls — a geologically free energy source a nascent cell could tap before 
    evolving its own membrane and pumps.
  cites: [russell1997emergence, martin2007origin, lane2012origin, sojo2016origin]
- claim: Serpentinization of olivine delivers a sustained supply of H2, the reducing power that 
    drives prebiotic chemistry at the vent.
  cites: [kelley2005serpentinite, proskurowski2008abiogenic, schwander2023serpentinization]
- claim: That H2 reduces CO2 to organic carbon on native-metal and mineral catalysts without 
    enzymes, reproducing the acetyl-CoA–like chemistry thought ancestral to life.
  cites: [preiner2020hydrogen, varma2018native, huber1997activated, martin2008hydrothermal]
- claim: Nonenzymatic reaction networks (reductive-TCA fragments) can persist and self-amplify under
    continuous vent flow, a precursor to metabolism.
  cites: [muchowska2019synthesis, muchowska2017metals]
- claim: Thermal gradients in vent pores concentrate molecules by thermophoresis — a route to 
    localized, individual-like accumulations against dilution.
  cites: [baaske2007extreme, mast2010thermal]
- claim: Fatty-acid vesicles can assemble and persist under vent-like temperature and pH, giving the
    chemistry a compartment.
  cites: [jordan2019promotion]
- claim: The classical favorable picture is contested — in-situ pH, sulfide availability and vent 
    longevity may be far less favorable than classical models assume, so each step is run against 
    that challenge.
  cites: [tutolo2026rethinking, jackson2016natural, weiss2016physiology]
