    result: "see og-06-alt-information-per-cost: 4/6 classes pass ancestry-predicts-phenotype under the strict rule (MI converged on every seed, >= 0.1 bit, >= 0.05 bit above the class's own unattached control); peptide at q_p = 0.7 sits below the Eigen floor and is refused by the step, mineral_state's estimate does not converge on every seed (its function decays through layer-copy errors). Bits per joule span 3.8 decades; the certified Pareto front is {network, rna_like}; mineral_state would dominate both axes (2.2 bits at 4e-20 J) on a hypothetical defect-copy error. rna_like transmits 1.46 bits at 3e-17 J per offspring and attaches only at the full budget and q >= 0.967; compositional / network / mineral attach from 3 % of it. og-06's 'need not presume RNA' splits by currency: per offspring the RNA-like template carries the most certified bits (best non-RNA = 0.36x), per joule the network class carries 26x. Energy-store residual <= 3e-14 on all 252 runs."
