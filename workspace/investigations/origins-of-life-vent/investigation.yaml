schema_version: 2
name: origins-of-life-vent
title: Origins-of-life vent campaign
created: '2026-10-11'
status: running
question: Could the first cells have originated at alkaline hydrothermal vents — and where does the
  geology-to-cells path run continuously, where does it depend on narrow regimes, and where does it
  break? Can a physically plausible early-Earth vent–ocean interface generate and sustain, in order,
  the free energy, reduced carbon, persistent network chemistry, concentration, and compartments a
  protocell needs — without inserting metabolism, membranes, autocatalysis, or heredity by assumption?
hypothesis: >-
  Under field- and lab-consistent parameter ranges, a serpentinization-fed, spatially resolved
  alkaline vent reproduces the conditions for a cellular origin: it crosses, in order, falsifiable
  thresholds for sustained carbon fixation, network persistence, concentration/individuality,
  compartmentation, internalized energy, and heritable organization — with identifiable parameter regions
  where each step fails.
lead: >-
  The origin of cells, treated not as a single spark but as a staged sequence of nonequilibrium
  transitions at an alkaline hydrothermal vent, each one a falsifiable step a simulation can pass
  or fail. The guiding hypothesis is the alkaline-vent theory for the origin of life: the
  vent-ocean interface hands a nascent cell its first free energy (a natural proton gradient
  across thin mineral walls), its first reduced carbon (H2-driven CO2 reduction), and a place to
  concentrate and enclose that chemistry, before the cell evolves its own membranes, pumps and
  genes. The campaign builds that vent from real geochemistry upward (serpentinization, reactive
  transport, H2-driven carbon fixation, candidate self-amplifying networks — tested, not assumed)
  and runs the classical favorable scenario and the 2026 unfavorable reassessment head to head
  rather than assuming either. Every
  stage is a coupled Vivarium composite of genuine simulators (PHREEQC, FiPy, eQuilibrator,
  libRoadRunner, with a FEniCS/dolfinx FEM solver under pixi as a high-fidelity cross-check) under
  explicit conservation contracts. Thirteen consolidated studies — each gathering the campaign's
  run arms (36 in all) at several fidelities — build and run on real simulators. A five-act arc —
  the geological engine, chemical organization, chemical individuality, reproduction and evolution,
  and robustness and autonomy, plus the nitrogen/phosphorus/energy/growth bottlenecks — is judged
  act by act against matched nulls, with an adversarial vent-ablated control rejected by every
  discriminating gate. The honest headline is that the arc advances on persistence while endogenous
  autocatalysis is tested and refuted, and the central transition — chemistry maintaining a boundary
  that in turn sustains that chemistry — stays open. The sharpest results come from re-grounding each
  act on higher-fidelity model classes, which returns three honest negatives: carbon fixation's
  limiting step is structure-sensitive, no autocatalysis emerges at vent conditions without a
  one-carbon feed, and og-independence's {pump, importer, heredity} set is not jointly sufficient
  off-gradient.
executive:
  what_is_this: >-
    A staged, falsifiable Vivarium campaign mapping where the geology-to-cells path at a
    serpentinizing alkaline hydrothermal vent runs continuously, where it depends on narrow
    regimes, and where it breaks. A cellular origin is treated as five acts of coupled
    nonequilibrium transitions — geological engine, chemical organization, chemical individuality,
    reproduction and evolution, robustness and autonomy — each judged against a matched null with
    input fluxes held equal, with explicit competing scenarios. Not a demonstration that cells did
    originate at vents: a quantitative map of the bottlenecks between geology and cells.
  campaign_synthesis: >-
    Campaign synthesis — the geology-to-cells arc in one place (see campaign-synthesis.md), read as
    five acts, each judged against a matched null with input fluxes held equal. Geochemical
    disequilibria can sustain carbon-reducing chemistry (Acts I–II), and a connected reaction
    network persists without endogenous autocatalysis — amplification beyond a degree-preserving
    null is refuted under vent conditions for both representable routes (A2, off-spine), on
    thermodynamics and on a seed-independence discriminator. Persistence is bought by spatial
    organization, retention and energy-buffering, not by productivity: a concentrating mineral pore
    rescues the network (Act II), but the chemically-necessary multicomponent set fractionates
    rather than co-localizing, and the rescue sits in a bounded, somewhat brittle porosity window.
    An endogenous membrane pays for itself on persistence (Act III), yet self-produced boundary
    closure and the chemistry-to-boundary feedback stay open; physical division is a measured
    propensity, not demonstrated self-maintaining fission; and open-ended chemical evolvability is
    unresolved (Act IV). Under reduced geological support the buffering, community and
    internalization mechanisms map a robustness/productivity frontier, not a demonstrated escape
    (Act V). The central scientific target the campaign now names is the emergence of reciprocal
    coupling: chemistry maintaining a boundary that, in turn, sustains and propagates that
    chemistry. Endogenous autocatalysis is not demonstrated and the chemistry-to-self-maintaining-
    individual transition is open — these are the campaign's sharpest results, kept first-class, not
    gaps papered over.
  act_i_status: >-
    Act I (geological engine) is qualified. The serpentinizing alkaline vent holds its Lost City
    window (T 40-91 C, pH 9.0-10.8, positive H2 flux) over ~80% of the swept grid with the
    charge/element ledger exact (|charge| = 0). Conditioning on that window leaves a posterior that
    is 12.5% of the prior yet in which 100% of the empirically supported vent states supply what
    downstream carbon fixation needs - transport-class-independent, ledger exact (0 of 96 points
    rejected). The dissolved-H2 window is the binding observation (pH is mineral-buffered near 9.4),
    so Act I delivers a bounded, calibrated feed of H2 / inorganic carbon / pH-redox gradient with a
    documented lifetime - a viable geochemical reactor within bounds, not an origin claim. It
    throttles on a bounded two-regime DIC window, and the H2 posterior depends on the DIC prior and
    the equilibrium-vs-kinetic carbon-redox choice (an open expert prior). Exit condition met: the
    calibrated, uncertainty-bearing feed with closed budgets and a documented lifetime that Act II
    consumes.
  act_ii_status: >-
    Act II (chemical organization) resolves to persistence, not amplification. Abiotic carbon
    production is supported: H2-driven CO2 reduction over the vent's Fe/Ni/S interface
    reproduces the Preiner/Hudson yield hierarchy (formate ~200 mM >> acetate ~100 uM >> pyruvate
    ~10 uM) and sustains net organic-carbon flux in a bounded pH-gradient x dissolved-H2 region,
    with every control (no gradient / no H2 / no catalyst) collapsing formate below 1 mM; carbon
    fixation spends the proton gradient (~2 H+/carbon). Network persistence (A1) is met, qualified:
    a connected, carbon-fixing network sustains net throughput on the calibrated feed under washout.
    Spatial organization (B) is met: at the same vent-posterior base feed held equal, a
    concentrating mineral pore at a modest, physical porosity (0.88, pore-local ~0.023 M, enrichment
    ~23x) ignites the network (net carbon flux +4.5e-4, 17 persistent species) while a matched
    well-mixed, nonconcentrating control stays dead - spatial concentration is the only difference,
    confirmed directly on the six-carbon network (flux +4.49e-4, connected, 22 species) that ignites
    only at ~20x well-mixed feed. The rescue holds within a bounded, somewhat brittle porosity window
    (~0.80-0.90); the chemically-necessary eight-solute mixture fractionates rather than
    co-localizing (Soret-driven, co-localization index ~0.18 in the strong-Soret regime), a candidate
    spatial incompatibility. Endogenous autocatalysis (A2, off-spine) is refuted under vent
    conditions for both representable routes: the formose doubling step is thermodynamically
    condensation-favored (-16.4 kJ/mol) so its splitting direction carries no net flux, and on a
    coefficient-free discriminator production is seed-independent (feed-driven, not self-amplified);
    a seeded reductive-TCA cycle washes out because its reductive carboxylations run uphill under vent
    H2 (+18, +31 kJ/mol) - the same reason real rTCA uses ferredoxin, not H2 - though a labelled
    counterfactual shows the rTCA topology is autocatalysis-capable under a stronger reductant (a
    beyond-vent follow-up). Exit condition met: persistence is distinguished from endogenous
    amplification, and the pore rescue and the mixed-solute fractionation are both reported.
  act_iii_status: >-
    Act III (chemical individuality) is qualified and partly open. Self-compartmentation (C) runs
    on the Act-II pore-concentrated, carbon-fixing (not autocatalytic) network: an endogenous membrane
    raises the standing metabolite pool to ~2.9x a no-membrane ablation under the reduced-coupling
    model and ~1.98x under the MD-informed first self-maintaining protocell, while net fixation flux
    stays ~0.6-0.79x (throughput feed-limited) - it pays for itself on persistence, not throughput.
    Short Martini CG-MD gives a thicker long-chain bilayer (di-C16 2.870 nm vs di-C12 2.325 nm) ->
    lower permeability (0.256) -> higher retention (0.661), so composition sets permeability sets
    retention (a resolved coupling, not a free knob), and the system is self-maintaining on the
    measurable criterion (net amphiphile production >= degradation, beating the ablation at equal
    feeds) within a windowed integrity (membrane access >~0.45; k_deg <= ~0.01/s). Nutrient
    availability: reduced nitrogen keeps pace with carbon and reactive phosphorus
    co-concentrates in the pore (or limits first) - studied as nitrogen + phosphorus arms toward a
    joint C/N/P feasibility, not separate single-nutrient successes. Qualified and open because
    self-produced boundary closure and the chemistry-to-boundary reciprocal feedback are not yet
    closed (MD-informed, not PMF-resolved; the GPU gold-standard PMF is tracked, not hidden). The
    exit condition - closure of precursor-to-amphiphile synthesis plus an experimentally grounded
    permeability-retention feedback - is partially met: the permeability-retention feedback is MD-
    grounded; the synthesis closure is open.
  act_iv_status: >-
    Act IV (reproduction and evolution) is qualified. Reproduction: the protocell grows from its own
    amphiphile production and divides at a measured area-doubling geometry, building a multi-generation
    lineage (og-reproduction) - a measured division propensity, not emergent physical fission. Heredity:
    a daughter-inherited compositional difference produces a reproducible, selectable fitness
    difference (parent-offspring fitness correlation +0.949 vs a no-inheritance control under
    selection, og-heredity, seed-robust 5/5 graded seeds), with competing inheritance modules graded
    head-to-head - compositional and hybrid heredity escape the Eigen length catastrophe, so heredity
    need not presume a long high-fidelity RNA template. Both judged against matched nulls at equal
    feeds. Open: open-ended chemical evolvability (novelty beyond the seeded trait space) is not
    demonstrated, and physical division remains a propensity rather than self-maintaining fission -
    the planned membrane-MD division study (mem-m4) is a required mechanical validation, scaffolded,
    not run. Exit condition partially met: physical division propensity, transmission and
    multigeneration selection are shown; chemical novelty is open.
  act_v_status: >-
    Act V (robustness and autonomy) maps a frontier rather than a demonstrated escape, all qualified.
    An energy carrier buys dip-persistence, not more total work (og-energetics: dip useful work 0.030
    vs gradient-only 0.006 kJ/mol, total work NOT improved 0.256 vs 0.282). A cross-feeding community
    out-produces the best single lineage (~1.9x, cross-feeding-causal) but pays in robustness with
    lineage loss at low counts - productivity-yes / robustness-no, the counterpoint (og-ecology).
    Progressive independence is a graded, attributed affordability map (og-independence): the required
    innovation set is driver-specific, not a universal triple - {pump, heredity} rescues the vent-pmf
    gradient (a hard dependency: the full set rescues its withdrawal in only ~4.2% of structures),
    while mineral access and feed are freely/borderline survivable and the importer is never
    individually required. The adversarial vent-ablated control is rejected by every discriminating
    gate (min margin 1.8 decades) while the vent passes all five, so the gates are vent-specific rather
    than generic (og-vent-specificity); genuine specificity also wants positive alternative-environment
    models (planned). Exit condition met as a robustness/productivity frontier and a graded
    support-withdrawal analysis - explicitly not an assumed vent escape, and the Hadean-ocean H2/organic
    floor that would turn the off-gradient map into a prediction remains an open expert prior.
  verdict: >-
    The full geochemistry-to-heredity arc runs end to end on real simulators, with conservation held to
    machine precision, and the campaign adjudicates its scenarios rather than asserting them. The sharpest
    results come from re-running each stage on higher-fidelity model classes under a feasibility / robustness
    / discrimination standard, and the honest headline is a spine that advances on persistence while
    endogenous autocatalysis was tested and refuted along the way. On the spine, a rule-generated C/H/O
    reaction network emerges and fixes carbon and then persists at vent-realistic feeds once a concentrating
    mineral pore is added - network persistence (A1) is met, qualified: a connected carbon-fixing network
    ignites inside a physical pore (porosity ~0.88, pore-local ~0.023 M) where a matched well-mixed control
    stays dead, within a bounded, somewhat brittle porosity window (~0.80-0.90), confirmed directly on the
    six-carbon network (spatial organization, B, met). Endogenous autocatalysis, by contrast, is refuted under vent conditions
    for both representable routes - A2, an off-spine branch, each with a mechanism: the formose doubling
    step is thermodynamically condensation-favored (-16.4 kJ/mol) so its splitting direction carries no net
    flux, and on a coefficient-free discriminator production is seed-independent (feed-driven, not
    self-amplified); a seeded reductive-TCA cycle washes out under vent H2 because its reductive carboxylations
    run uphill (+18, +31 kJ/mol), the same reason real rTCA uses ferredoxin, not H2 - though a labelled
    counterfactual shows the rTCA topology is autocatalysis-capable under a stronger reductant, noted as a
    possible beyond-vent follow-up. An endogenous membrane then pays for itself on persistence (standing pool
    ~2.9x reduced-coupling, ~1.98x MD-informed, over a matched no-membrane ablation) but not throughput, within
    a membrane-access window - Act III self-compartmentation (C) qualified (og-self-compartmentation reduced-coupling plus og-self-compartmentation's MD-informed first
    self-maintaining protocell, where composition sets permeability sets retention; PMF-resolved gold standard
    tracked as og-32a). Reproduction and heredity follow as a genuine positive - Act IV (D) qualified: the protocell
    grows from its own amphiphile production and divides at a measured area-doubling geometry (og-reproduction), and a
    daughter-inherited compositional difference produces a reproducible, selectable fitness difference
    (parent-offspring fitness correlation +0.949 vs a no-inheritance control, og-heredity), both against matched nulls
    at equal feeds. The optional Act V extension has run, all three qualified: an energy carrier buys
    dip-persistence not more total work (og-energetics), a cross-feeding community buys productivity ~1.9x but pays in
    robustness (og-ecology, the counterpoint), and a budget leave-one-out maps a conditional, coarse-budget
    independence with heredity the irreducible substrate - an affordability map, not a demonstrated escape
    (og-independence). The earlier,
    lower-fidelity arc stands as the scaffold these sharpened: a Lost City vent (og-vent-environment) holding its window over
    ~80% of the swept grid with exact charge balance; H2-driven carbon fixation benchmarked against Preiner and
    Hudson (og-carbon-fixation); thermophoretic individuality, amphiphile compartments, internalized bioenergetics bounded
    by the Sojo cost, heredity that need not presume RNA, metacommunity robustness, and the {pump, importer,
    heredity} escape set (og-network-persistence through og-independence), plus the nitrogen, phosphorus, energy-currency and
    growth/division modules. An adversarial vent-ablated control is rejected by every discriminating gate, so
    the gates are vent-specific rather than generic. Three honest negatives are the sharpest of these: carbon
    fixation runs but which limitation stops it is structure-sensitive (the Butler-Volmer and empirical classes
    agree on the label only 47% of the time against an 80% gate, so the mechanism map, not a pass, is the
    result; charge/electron ledger exact on 750 runs); the eight-solute mixture fractionates rather than
    co-localizing in one thermophoretic pore (concentrating one tracer is not concentrating the set a protocell
    needs together); and og-independence's {pump, importer, heredity}, re-asked inside one persistent world across 24
    model structures, is not jointly sufficient (recorded as a hypothesis generator). The vent calibration
    anchors the arc: conditioning on the Lost City windows leaves a posterior in which 100% of the empirically
    supported vent states supply what carbon fixation needs, transport-class-independent, with the ledger exact
    (0 of 96 points rejected). So the campaign's result is a mechanism map and an honestly-advanced spine whose
    central transition is still open, not a declaration of success: a carbon-fixing network persists at
    vent-realistic feeds in a pore (Act II), self-amplification does not occur under vent conditions (A2
    refuted, both routes), a membrane earns its cost on persistence (Act III qualified), and the protocell
    reproduces and inherits a selectable trait (Act IV qualified), with the Act V robustness/autonomy extension a
    mapped frontier rather than a demonstrated escape. The central scientific target the campaign now names is the
    emergence of reciprocal coupling - chemistry maintaining a boundary that, in turn, sustains and propagates
    that chemistry; endogenous autocatalysis is not demonstrated, and the chemistry-to-self-maintaining-individual
    transition is open. A single through-line runs
    across the independent mechanisms: robustness is the consistently hard-won and consistently traded axis -
    the pore, the membrane and the energy carrier each buy persistence/robustness not throughput, the ecology
    (og-ecology) is the counterpoint that buys throughput by spending robustness, and independence (og-independence) is an
    affordability map rather than a demonstrated escape. The honest caveats stay explicit (coarse budgets,
    lumped feeds, MD-informed not PMF-resolved, compositional not template heredity), each a named og-Na
    follow-up; the full gate-by-gate arc is in campaign-synthesis.md. What remains open is editorial
    (publication scope, bottleneck-map framing) and a few expert priors (the Hadean ocean's H2 / organic floor,
    heredity attachment thresholds, membrane permeabilities) - decisions, not unrun science.
  verdict_status: in-progress
  verdict_detail: >-
    Thirteen consolidated studies — the geochemistry-to-heredity arc, the nitrogen / phosphorus /
    energy / growth bottleneck modules, and an adversarial control — gather 36 run arms (the former
    calibration and -alt studies now folded as fidelities) across the five-act spine (its matched-null gates), wired into a DAG and all run. Each runs a
    coupled Vivarium composite of real tools (PHREEQC + FiPy; eQuilibrator; libRoadRunner; a FiPy
    thermal trap; amphiphile self-assembly; bioenergetic internalization; an agent-based heredity
    lineage; a pore metacommunity; an osmotic growth/division compartment; a Butler-Volmer
    galvanic cell) and is graded on its conservation and acceptance gates. Headline numbers: og-vent-environment
    holds the Lost City window (T 40-91 C, pH 9.0-10.8, positive H2 flux) over ~80% of the swept
    grid with |charge| = 0; og-carbon-fixation reproduces the Preiner/Hudson yields and shows the Tutolo arm
    halve the usable proton-motive gradient (427 -> 43 mV); og-network-persistence reaches a peak autocatalytic
    gain ~29.5 in its earlier reduced model - superseded under vent conditions by og-autocatalysis-a2's
    higher-fidelity refutation (Gate A2: autocatalysis refuted for both representable routes);
    og-heredity's compositional / hybrid heredity is seed-robust (0.878 +/- 0.005, 5/5
    graded seeds); og-independence's escape set is irreducible (full set survives 1.0, any single knockout
    0); og-vent-environment's Lost-City-conditioned posterior is 12.5% of the prior yet 100% viable downstream
    and transport-class-independent (ledger 0/96 rejected). og-carbon-fixation builds the vent wall as a
    Butler-Volmer cell in the Altair-2025 current window (7 of 8 gates pass, ledger exact on 750
    runs) but its attribution gate fails at label agreement 0.47. The adversarial control is
    rejected by all five discriminating gates (min margin 1.8 decades) while the vent passes all
    five. The designed arc that sharpened this scaffold (og-vent-environment through og-independence) has now all run and
    merged on main; the central transition stays open. The spine
    lands Act II network persistence (A1, qualified) and spatial rescue (B, met), Act III self-compartmentation (C, qualified:
    og-self-compartmentation reduced-coupling ~2.9x and og-self-compartmentation MD-informed ~1.98x standing pool over a no-membrane ablation, with
    composition -> permeability -> retention resolved) and Act IV reproduction + heredity (D, qualified: og-reproduction
    metabolism-driven division at a measured area-doubling geometry, og-heredity parent-offspring fitness correlation
    +0.949 vs a no-inheritance control under selection), with endogenous autocatalysis refuted for both routes (A2, off-spine: og-autocatalysis-a2 formose
    seed-independent and -16.4 kJ/mol; og-autocatalysis-a2 reductive-TCA uphill +18/+31 kJ/mol under vent H2). The optional
    Act V extension has run and all qualified: og-energetics energy carrier (dip useful work 0.030 vs gradient-only
    0.006 kJ/mol, total work NOT improved 0.256 vs 0.282, ledger closes ~9e-19); og-ecology ecology (community
    productivity ~1.9x over the best single lineage, cross-feeding-causal, but more variable with lineage loss
    at low counts - productivity-yes / robustness-no, the counterpoint); og-independence progressive independence (all
    three validated channels affordable to internalize, conditional on heredity and pump efficiency >~0.7 - an
    affordability / attribution map, not a demonstrated escape). Every gate is judged against a matched null
    with input fluxes held equal; the gold-standard follow-ups (og-32a/33a/34a/35a/36a/37a) are tracked, not
    hidden.
  decisions_resolved:
  - 'Baseline parameterization: run BOTH arms — classical favorable (Russell/Lane/Sojo) and the 2026 unfavorable
    reassessment (Tutolo/Jackson) — so the campaign adjudicates rather than assumes. Implemented in og-carbon-fixation.'
  - 'Primary geochemistry engine: real PHREEQC (phreeqpython + vendored llnl.dat), which fields the Lost
    City pH endmember once peridotite (not dunite) is reacted. Reaktoro was conda-only and off the uv
    path.'
  - 'Build order: geochemistry + transport first (og-vent-environment/og-carbon-fixation), then the reaction network (og-network-persistence) — not
    a thin end-to-end skeleton. This put a real composite in the workbench at stage 0.'
  - "Heredity strategy for og-heredity: compare all modules without presuming RNA. og-heredity's agent-based lineage
    grades RNA-like template, compositional (GARD), a template-focused hybrid and a non-heritable control
    head-to-head; compositional and hybrid heredity persist length-independently (functional persistence
    ~0.88, seed-robust 5/5 graded seeds) where a long low-fidelity template suffers the Eigen length catastrophe —
    so heredity need NOT presume a long high-fidelity RNA template."
  - 'Explicit electrochemistry for og-carbon-fixation: built, but not adopted as the
    gradient-efficiency abstraction — the carbon_fixation face adds a real Butler-Volmer galvanic-cell
    class (Nernst half-cells, Koutecky-Levich transport limits, Preiner electron branching), with
    MineralConductivityProcess deriving gradient_efficiency from the wall circuit and a ChargeLedger
    auditing the Kirchhoff/faradaic residuals. The empirical gradient-efficiency class is kept as
    og-carbon-fixation''s graded default.'
  - 'Carbon-fixation limitation attribution + default class (resolved by Eran): ACCEPT the structure-sensitive limitation
    attribution AS the carbon-fixation result — the empirical and Butler-Volmer classes disagreeing on the
    limitation label in the favorable region (agreement 0.47 < 0.8) IS the finding, reported as the
    og-carbon-fixation mechanism map with gate_status failed (an honest negative); the gate is
    not re-tuned to force a pass. KEEP empirical as og-carbon-fixation''s graded/headline default and butler_volmer as
    the registered high-fidelity electrochemistry class (the same FiPy-grades / FEniCS-cross-checks
    pattern), revisiting butler_volmer as the headline once Altair per-condition data turns its
    calibration window into a fit.'
  - 'Carbon-fixation follow-up (accepted, not done): attach the Altair-2025 per-condition current / product time
    courses (turning the calibration window into a likelihood) and bridge CatMAP/Cantera to run the
    microkinetic carbon_fixation class under pixi, then re-run the mechanism map with three classes.
    Deferred because the per-condition dataset is not yet in-workspace and the microkinetic backend needs
    a pixi env.'
  - 'og-spatial-concentration retention gate (resolved by Eran): RESTATE it at the resolvable Peclet rather than the >=1e6
    enrichment fold — the extreme fold is the closed-cell/reduced-model FiPy exp(Pe) figure the resolved
    FEM does not confirm above Pe ~ 13, so localization is gated on the Peclet, not the fold-magnitude.
    The gate change itself is implemented in a separate og-spatial-concentration PR; recorded here as the decision-state.'
  - 'og-independence {pump, importer, heredity} required-set (resolved by the og-independence rebuild): the per-driver
    one-at-a-time withdrawal resolves the attribution confound — the required innovation set is
    DRIVER-SPECIFIC, not a universal triple. {pump, heredity} rescues the vent-pmf gradient (a hard
    dependency: the full set rescues its withdrawal in only ~4.2% of structures), while mineral access
    (0.958) and feed (0.75) are freely/borderline survivable needing no specific innovation, and the
    importer is never individually required. The earlier "no subset jointly sufficient / hypothesis
    generator" reading was the gradient''s rarity dominating the lumped all-at-once collapse (og-independence is
    now gate_status passed / verdict qualified; confound_resolved, ledgers close). So the campaign''s
    endpoint statement reads "driver-specific rescue, the vent drive the hard dependency," not "no subset
    sufficient." The ocean-floor H2/organic prior remains an open refinement (still in decisions_needed).'
  decisions_needed:
  - question: 'Ocean-floor H2 / organic prior (og-independence autonomy floor): supply an expert prior on the Hadean
      ocean''s dissolved H2 and organic background (the floor) to turn og-independence''s floor map into a
      prediction. (The {pump, importer, heredity} required-set framing is now RESOLVED — driver-specific,
      see decisions_resolved; this is the remaining open piece.)'
    context: 'og-independence: the floor (vg-data integrated_autonomy, hypothetical, swept
      1e-3 .. 1e-1) and the bioenergetics upkeep are the numbers the off-gradient verdict turns on; an
      expert prior on the Hadean ocean''s dissolved H2 and organics would turn the floor map into a
      prediction. The attribution confound itself is resolved by the per-driver rebuild (decisions_resolved).'
  - question: 'Agent motion model (ecology stage): DEFERRED. The proto_ecology component points agents at fixed cells
      of the og-spatial-concentration enrichment field (interleaved or segregated along the pore); no motility, chemotaxis or advective
      drift of agents is modelled. Which motion model (none / advected with the pore flow / Brownian between
      cells / thermophoretic like the solutes) should the ecology follow-up adopt?'
    context: 'og-ecology: the
      the study defers motion ("point agents on fields first"). With fixed positions the mixed and
      segregated placements give the same community-only function because pore diffusion between cells
      (k_diffusion 0.1/s, hypothetical) mixes the exchanged intermediate; a motion model would make that
      mixing a property of the agents rather than of the field.'
  - question: 'Membrane permeability of dicarboxylates (ecology stage): the community function (the reductive C4
      branch crossing from the carboxylating to the hydrogenating lineage) emerges only above a diacid
      permeability of ~3e-9 m/s at 100 s residence, while the measured passage of charged solutes through
      fatty-acid vesicles (Mansy 2008, proposed_inputs, pending) is ~1e-11-1e-10 m/s. Is a leakier boundary
      (mixed / shorter-chain amphiphiles, the thioester_aminothiol boundary class) or a longer pore residence the
      defensible route, or should the exchanged intermediate be a neutral species?'
    context: 'The canonical point (p_diacid 1e-8 m/s, hypothetical) is an operating point inside the
      emergence region; the Decision map places the measured range below the boundary. The number is the
      weakest in vg-data cnp_resources and is swept, not asserted.'
  - question: 'Heredity attachment thresholds: what precursor budget (copies per individual the pool
      must cover, attach_min_copies), energy margin (attach_energy_margin) and fidelity floor are defensible
      for attaching heredity to a lineage? The build uses hypothetical values (10 copies, margin 1.0) and
      Eigen''s error threshold Q >= 1/sigma as the fidelity floor, and SWEEPS the budget x fidelity space
      instead of asserting a point.'
    context: 'og-heredity: the
      HeredityAttachmentStep attaches a class only when all three conditions hold; the attachment map shows
