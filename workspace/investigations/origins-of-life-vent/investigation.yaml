schema_version: 2
name: origins-of-life-vent
title: Origins-of-life vent campaign
created: '2026-10-11'
status: running
question: Can a physically plausible early-Earth hydrothermal system generate and sustain localized, increasingly
  autonomous chemical organizations — without inserting metabolism, membranes, or heredity by assumption?
hypothesis: Under field- and lab-consistent parameter ranges, a serpentinization-fed, spatially resolved
  vent–ocean interface crosses, in order, falsifiable thresholds for sustained carbon fixation, network
  persistence, concentration/individuality, compartmentation, internalized energy, and heritable organization
  — with identifiable parameter regions where each fails.
lead: |
  The origin of life, treated not as a single spark but as a staged sequence of nonequilibrium
  transitions — each one a falsifiable step a simulation can pass or fail. The campaign builds an
  alkaline hydrothermal vent from real geochemistry upward: serpentinization, reactive transport,
  H2-driven carbon fixation, and self-amplifying reaction networks, with competing favorable and
  unfavorable scenarios run head to head rather than assumed. Each stage is a coupled Vivarium
  composite of genuine simulators (PHREEQC, FiPy, eQuilibrator, libRoadRunner) under explicit
  conservation contracts. The first three stages — through reduced-carbon protometabolism — are
  built, run, and accepted; the remaining stages are designed and waiting to run.
executive:
  what_is_this: A staged, falsifiable Vivarium campaign treating the origin of life as coupled transitions
    from geochemistry to autonomy, grounded in serpentinization-driven alkaline hydrothermal vents with
    explicit competing scenarios.
  verdict: In progress — the pre-genetic milestone is three-for-three. og-00 (geochemical/spatial testbed),
    og-01 (geology → reduced carbon, favorable vs. Tutolo-2026 arms) and og-02 (reduced carbon → protometabolism)
    are built on real simulators, run, and accepted against pre-stated gates with conservation held to
    machine precision. og-03 (dilution → localized individuals) is next; og-04–og-08 and the adversarial
    control are designed but not yet run.
  verdict_status: in-progress
  verdict_detail: 10 member studies (Campaigns 0–VIII + an adversarial control) wired into a DAG. Stages
    0–2 are complete — each runs a coupled Vivarium composite of real tools (PHREEQC + FiPy; eQuilibrator
    + FiPy; libRoadRunner) and passes its conservation and acceptance behavior tests. The remaining stages
    open at Design with a contract (ports + conservation invariants) and behavior tests derived from the
    acceptance gates and discriminating experiments.
  decisions_resolved:
  - 'Baseline parameterization: run BOTH arms — classical favorable (Russell/Lane/Sojo) and the 2026 unfavorable
    reassessment (Tutolo/Jackson) — so the campaign adjudicates rather than assumes. Implemented in og-01.'
  - 'Primary geochemistry engine: real PHREEQC (phreeqpython + vendored llnl.dat), which fields the Lost
    City pH endmember once peridotite (not dunite) is reacted. Reaktoro was conda-only and off the uv path.'
  - 'Build order: geochemistry + transport first (og-00/og-01), then the reaction network (og-02) — not
    a thin end-to-end skeleton. This put a real composite in the workbench at stage 0.'
  decisions_needed:
  - question: 'Confirm the first-publication milestone stays og-00 → og-03 (pre-genetic: a precipitating
      interface that retains a persistent protometabolic carbon flux), or extend to og-04 (protocells)?'
    context: Extending to og-04 adds membrane biophysics and roughly one more module before a publishable
      result. og-00 → og-02 are already accepted, so og-03 is the one remaining stage for the current scope.
  - question: 'Heredity strategy for og-06: which modules to prioritize (RNA-world, peptide-first, compositional,
      mineral-templating)?'
    context: og-06 is the weakest link and a deliberate branch point; the choice sets what the late campaign
      compares.
scientific_argument:
  main_claim: Origins can be represented as a succession of independently falsifiable nonequilibrium transitions,
    each a Vivarium process with explicit state, rate laws, units, uncertainty and alternative implementations
    — so simulations adjudicate among scenarios rather than illustrate one story.
  evidence_for:
  - H2-dependent mineral-catalyzed CO2 fixation (Preiner, Varma, Huber)
  - pH-gradient-driven CO2 reduction with isotope controls (Hudson, Altair)
  - nonenzymatic rTCA/precursor networks (Muchowska/Moran)
  - thermophoretic concentration in pores (Baaske, Mast & Braun)
  - vesicle feasibility under vent-like conditions (Jordan)
  evidence_against:
  - in-situ pH/sulfur/longevity may be far less favorable than classical models assume (Tutolo 2026; Jackson
    2016)
  - no validated vent pathway spans to open-ended heredity (Module J)
  - lab yields are not Hadean environmental concentrations
  key_figures: []
  caveats:
  - Stages 0–2 are complete and accepted; stages 3–8 and the adversarial control are designed but not
    yet run. Every quantitative anchor is laboratory/field provenance, not a Hadean environmental concentration.
