  architecture_principles:
  - Build the world, not the cell — environmental stores and processes first; no individual-level
    state exists until a structural rewrite creates it.
  - The same environmental world persists through every stage; stages extend it by composition
    (merging layer generators), never by a replacement composite.
  - "Boundary formation, growth, division, extinction and heredity attachment are process-bigraph
    structural rewrites (_add / _remove / _divide on a map of individuals, a nested local:Composite
    per protocell), logged as events and checked by a conservation ledger."
  - Simulator-native variables are adapted into canonical biological schemas (viva_genesis/schemas.py;
    units-typed vg_* types) so model classes are substitutable behind one face.
  - "Model substitution is an experiment: sweep the model class as a categorical axis against the same
    gates; report parameter-robust vs structure-sensitive regions."
  - "Spatial transport (advection-diffusion-reaction + thermophoretic drift over the vent/pore domain)
    is a solver-agnostic interface with two REAL, merged classes: FiPy (pure-Python finite volume, uv
    .venv) is the live default that backs every graded gate and sweep; FEniCS/dolfinx via viva-fenics
    (compiled FEM + PETSc + Soret drift) is the high-fidelity STRUCTURAL cross-check, run on demand under
    viva-fenics's pixi env (dolfinx is conda-only, so it is not available in the uv workbench — selecting
    'fenics' there raises a clear 'run under pixi' error). The FiPy↔FEniCS head-to-head is a reported
    solver-robustness readout, not a graded gate: it agrees on the smooth og-00 vent (outlet T within
    0.30%, identical pH) and exposes where the og-03 trap's reduced FiPy column over-extrapolates (the
    solvers diverge ~5.6 decades above Pe ≈ 13). Phase maps are sped up independently of solver choice by
    Ray-parallel sweeps on the mini and a declared reduced surrogate for Decision-map cells (full PDE for
    the World view)."
  - C-N-P chemistry, proto-energetics and free-energy accounting are cross-cutting layers (one shared
    molecule pool, a resource-budget step, a world-and-individual energy currency, a ledger), not side
    studies.
  - Phase maps over trajectories; explicit parameter provenance tiers; mechanism ablations for
    necessity; adversarial controls; negative results as first-class outputs; World / Mechanism /
    Decision views kept in sync for every study.
  canonical_schemas:
    module: viva_genesis/schemas.py (implemented 2026-10-14 — registered by build_core; faces audited against it)
    layers:
    - physical world — vg_environment, vg_minerals, vg_molecules, vg_energy
    - boundary — vg_boundary
    - individual — vg_individual (volume, internal pool, boundary, energy, autonomy, maybe[heredity])
    - heredity + lineage/ecology — vg_heredity, vg_lineage
  reusable_composites:
    plan: [geochemical_world, electrochemical_interface, prebiotic_chemistry, pore_localization,
      proto_boundary, proto_individual, proto_bioenergetics, proto_heredity, proto_ecology]
    note: Each is a layer generator built from the existing processes; stage composites merge layers.
  implementation_order:
  - 1. canonical schemas + geochemical_world (+ mineral evolution, conservation ledger, rewrite spike)
  - 2. electrochemical_interface (derive gradient efficiency from circuit physics; fixation model classes)
  - 3. expanded prebiotic_chemistry — C-N-P + proto-energetics as cross-cutting layers
  - 4. pore_localization on shared spatial fields (first _add rewrite: localized regions)
  - 5. proto_boundary + endogenous amphiphile production (boundary-formation rewrite -> protocell composite)
  - 6. growth / division / extinction structural rewrites
  - 7. competing heredity modules behind one face, attached conditionally
  - 8. proto_ecology (shared fields, exchange rules)
  - 9. autonomy / ablation campaign (autonomy continuum, minimum innovation set)
# The origin-of-cells thesis, broken into the claims the campaign tests — each
# tied to the literature it rests on (bibkeys resolve against references/papers.bib).
# The report renders these as cited bullets so every top-level claim traces to a source.
key_claims:
- claim: Alkaline hydrothermal vents sustain a natural proton gradient across thin inorganic 
    (Fe/Ni-sulfide) walls — a geologically free energy source a nascent cell could tap before 
    evolving its own membrane and pumps.
  cites: [russell1997emergence, martin2007origin, lane2012origin, sojo2016origin]
- claim: Serpentinization of olivine delivers a sustained supply of H2, the reducing power that 
    drives prebiotic chemistry at the vent.
  cites: [kelley2005serpentinite, proskurowski2008abiogenic, schwander2023serpentinization]
- claim: That H2 reduces CO2 to organic carbon on native-metal and mineral catalysts without 
    enzymes, reproducing the acetyl-CoA–like chemistry thought ancestral to life.
  cites: [preiner2020hydrogen, varma2018native, huber1997activated, martin2008hydrothermal]
- claim: Nonenzymatic reaction networks (reductive-TCA fragments) can persist and self-amplify under
    continuous vent flow, a precursor to metabolism.
  cites: [muchowska2019synthesis, muchowska2017metals]
- claim: Thermal gradients in vent pores concentrate molecules by thermophoresis — a route to 
    localized, individual-like accumulations against dilution.
  cites: [baaske2007extreme, mast2010thermal]
- claim: Fatty-acid vesicles can assemble and persist under vent-like temperature and pH, giving the
    chemistry a compartment.
  cites: [jordan2019promotion]
- claim: The classical favorable picture is contested — in-situ pH, sulfide availability and vent 
    longevity may be far less favorable than classical models assume, so each step is run against 
    that challenge.
  cites: [tutolo2026rethinking, jackson2016natural, weiss2016physiology]
