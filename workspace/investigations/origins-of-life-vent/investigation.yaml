schema_version: 2
name: origins-of-life-vent
title: Origins-of-life vent campaign
created: '2026-10-11'
status: running
question: Could the first cells have originated at alkaline hydrothermal vents? Can a physically 
  plausible early-Earth vent–ocean interface generate and sustain, in order, the free energy, 
  reduced carbon, self-amplifying chemistry, concentration, and compartments a protocell needs — 
  without inserting metabolism, membranes, or heredity by assumption?
hypothesis: >-
  Under field- and lab-consistent parameter ranges, a serpentinization-fed, spatially resolved
  alkaline vent reproduces the conditions for a cellular origin: it crosses, in order, falsifiable
  thresholds for sustained carbon fixation, network persistence, concentration/individuality,
  compartmentation, internalized energy, and heritable organization — with identifiable parameter regions
  where each step fails.
lead: >-
  The origin of cells, treated not as a single spark but as a staged sequence of nonequilibrium
  transitions at an alkaline hydrothermal vent, each one a falsifiable step a simulation can pass
  or fail. The guiding hypothesis is the alkaline-vent theory for the origin of life: the
  vent-ocean interface hands a nascent cell its first free energy (a natural proton gradient
  across thin mineral walls), its first reduced carbon (H2-driven CO2 reduction), and a place to
  concentrate and enclose that chemistry, before the cell evolves its own membranes, pumps and
  genes. The campaign builds that vent from real geochemistry upward (serpentinization, reactive
  transport, H2-driven carbon fixation, self-amplifying networks) and runs the classical favorable
  scenario and the 2026 unfavorable reassessment head to head rather than assuming either. Every
  stage is a coupled Vivarium composite of genuine simulators (PHREEQC, FiPy, eQuilibrator,
  libRoadRunner, with a FEniCS/dolfinx FEM solver under pixi as a high-fidelity cross-check) under
  explicit conservation contracts. Twenty-three studies build and run on real simulators. A
  fourteen-stage arc from vent geochemistry through carbon fixation, protometabolism,
  individuality, compartmentation, internalized bioenergetics and heredity to ecology, escape, and
  the nitrogen/phosphorus/energy/growth bottlenecks passes its pre-stated gates, with an
  adversarial vent-ablated control rejected by every discriminating gate. The sharper findings
  come from re-grounding each stage on higher-fidelity
  model classes, which returns three honest negatives: carbon fixation's limiting step is
  structure-sensitive, no autocatalysis emerges at vent conditions without a one-carbon
  feed, and og-08's {pump, importer, heredity} set is not jointly sufficient
  off-gradient.
executive:
  what_is_this: A staged, falsifiable Vivarium campaign testing the alkaline-vent theory for the 
    origin of cells — treating a cellular origin as coupled transitions from geochemistry to 
    bioenergetic autonomy, grounded in serpentinization-driven alkaline hydrothermal vents, with 
    explicit competing scenarios.
  gate_a_status: >-
    Gate A (chemical emergence) is recorded as two sub-gates, split because they answer different questions and
    sit at different places in the spine. A1 (network persistence) is a spine gate and is met, qualified. A2
    (endogenous autocatalysis) is an off-spine branch - tested and refuted, not a prerequisite for the spine.


    A1 - network persistence (spine; met, qualified): a sustained, connected, carbon-fixing network emerges on
    bounded geochemical feeds. In a well-mixed system the six-carbon network ignites only at about 20x the vent
    posterior feed, above defensible vent concentrations; Gate B (og-30) bridges that gap - a concentrating
    mineral pore at a modest, physical porosity (0.88, pore-local ~0.023 M) ignites the network, confirmed
    directly on the C6 network (flux +4.49e-4, connected), where a matched well-mixed control stays dead. The
    rescue holds within a bounded, somewhat brittle pore-geometry window (porosity ~0.80-0.90): below it
    enrichment is sub-threshold, above it pore-local feeds are physically implausible. So a carbon-fixing
    network persists at vent-realistic feeds inside a pore, within that window - this is what Gates B and C
    build on.


    A2 - endogenous autocatalysis (off-spine branch; refuted, mechanistic): self-amplification beyond a
    degree-preserving matched null is refuted under vent conditions for both candidate routes, each with a
    distinct mechanism; this is a tested-and-refuted branch, not a spine prerequisite. (i) Formose (linear): the
    canonical doubling step (r409, two glycolaldehyde to threose) is thermodynamically condensation-favored
    (standard free energy -16.4 kJ/mol), so its splitting direction carries no net flux; and on a coefficient-free
    functional discriminator it is refuted again - the network fixes carbon but production is seed-independent,
    i.e. feed-driven rather than self-amplified. (ii) rTCA (branched): under vent H2 a seeded reductive-TCA cycle
    washes out, because the reductive carboxylations (succinate to alpha-ketoglutarate, +18 kJ/mol; acetyl to
    pyruvate, +31 kJ/mol) run uphill under H2 and too slow against washout - the same reason real rTCA uses
    ferredoxin, not H2, as its reductant. The rTCA topology is shown autocatalysis-capable and topology-specific
    in a labelled counterfactual (lowering the carboxylation barrier switches it on), so the vent negative is a
    redox-environment limitation, not a limitation of the cycle's wiring.


    Overall: the spine advances on persistence - A1 is met (qualified: holds in a pore, within a bounded porosity
    window) and is what B (met), C (partial) and D build on - while endogenous autocatalysis was tested and
    refuted along the way (A2, off-spine, both representable routes under vent conditions). The
    autocatalysis-capable rTCA topology under a stronger reductant is noted as the basis for a possible
    beyond-vent follow-up, outside the current vent scope.
  gate_b_status: >-
    Gate B (spatial organization) is met. At the same vent-posterior base feed held equal (CO2 and H2 at 1e-3),
    a concentrating mineral pore at a modest, physical porosity (0.88; enrichment ~23x; pore-local ~0.023 M)
    ignites the reaction network (net carbon flux +4.5e-4, a connected network of 17 persistent species) while a
    matched well-mixed, nonconcentrating control does not (flux ~0, not connected) - spatial concentration is
    the only difference, so the pore itself causes the productive flux, and Gate B's criterion is met at the
    demonstrated pore. A porosity sweep shows this is a bounded, somewhat brittle window rather than a broad
    swath: net carbon flux rises monotonically with confinement (no flux washout), but the connectivity-defined
    ignition occupies a band around porosity ~0.80-0.90 (pore-local ~0.01-0.2 M) - below it enrichment is sub-
    threshold, above it the pore-local feeds become physically implausible (0.70 -> 2.6 M, 0.60 -> 36 M) and the
    connectivity metric itself degrades (flipping 1/0/1 across adjacent porosities). The result is confirmed
    directly on the C6 network - the one og-29 found ignites only at ~20x well-mixed feed - which ignites in the
    demo pore at the vent-posterior feed (flux +4.49e-4, connected, 22 species) while its matched well-mixed
    control stays dead, with the same bounded-window behavior (no flux-washout upper bound). Beyond meeting its
    own criterion, Gate B resolves Gate A's open A1 feed-plausibility question: the ~20x well-mixed ignition gap
    is bridged inside this physical pore window, so a carbon-fixing network persists at vent-realistic feeds in
    a pore.
  gate_c_status: >-
    Gate C (self-compartmentation) is PARTIAL. og-31 tests the "benefits from it" half under a reduced-coupling
    membrane model (retention/access, explicitly NOT the MD-resolved permeability PMF): on the Gate-B pore-
    concentrated, carbon-fixing (not autocatalytic) network at the Jordan-2019 vent-calibrated setting
    (retention 0.905, access 0.997), an endogenous membrane raises the standing metabolite pool to about 2.9x
    the no-membrane ablation - it pays for itself on persistence - while net fixation flux is about 0.6x
    (lower), because throughput is feed-limited. The benefit is windowed (holds for access down to ~0.45,
    inverts below, vent-calibrated point inside). Together with og-31's Martini-MD cohesion (the "makes a
    membrane" half), this is partial Gate C. Full Gate C - the structurally-resolved coupling of composition to
    permeability to retention, and whether the compartment is genuinely self-maintaining - requires study 32
    (First Self-Maintaining Protocell) plus the viva-md-membrane coupling (to-build). Guardrail: the metabolism
    here is the sustained A1 carbon-fixing network, not autocatalysis (A2 is refuted under vent conditions) -
    the claim is that a persisting network makes a membrane that pays for itself on persistence, never that the
    chemistry self-amplifies.
  verdict: >-
    The full geochemistry-to-heredity arc runs on real simulators and passes its pre-stated,
    falsifiable gates, with conservation held to machine precision. Twenty-three studies execute
    end to end: a Lost City vent (og-00), H2-driven carbon fixation benchmarked against Preiner
    and Hudson (og-01), a self-amplifying rTCA network (og-02), thermophoretic individuality
    (og-03), amphiphile compartments (og-04), internalized bioenergetics bounded by the Sojo cost
    (og-05), heredity that need not presume RNA (og-06), metacommunity robustness (og-07), the
    {pump, importer, heredity} escape set (og-08), plus the nitrogen, phosphorus, energy-currency
    and growth/division modules. An adversarial vent-ablated control is rejected by every
    discriminating gate, so the gates are vent-specific rather than generic. The sharpest findings
    come from re-running each stage on higher-fidelity model
    classes under a feasibility / robustness / discrimination standard, which returned three honest
    negatives. Carbon fixation runs, but which limitation stops it is
    structure-sensitive. The Butler-Volmer and empirical classes agree on the label only 47% of
    the time against an 80% gate, so the mechanism map, not a pass, is the result (charge/electron
    ledger exact on 750 runs). A rule-generated C/H/O reaction universe (413 reactions,
    real eQuilibrator dG') on the calibrated vent grows zero autocatalytic motifs, every C-C route
    uphill at vent activities, and grows exactly one (the formose cycle) once fed formaldehyde,
    enriched over matched nulls (p = 0.04). No autocatalysis without a one-carbon feed. The capstone: og-08's {pump, importer, heredity}, re-asked inside one persistent world across
    24 model structures under seven ledgers, is not jointly sufficient. No subset persists into a
    1% ocean, only {pump, heredity} into a 10% one (2 of 24 structures), and the importer is a net
    cost under a leaky membrane, so og-08 is recorded as a hypothesis generator. A fourth result
    is spatial: in the localization stage the eight-solute prebiotic mixture fractionates rather than
    co-localizing in one thermophoretic pore (Soret-driven; surrogate and dolfinx FEM agree), and
    concentrating one tracer is not concentrating the set a protocell needs together. The vent calibration
    anchors the arc: conditioning on the Lost City windows leaves a posterior in which 100% of the
    empirically supported vent states supply what carbon fixation needs, the two
    transport-structure classes agree, dissolved H2 is the single binding observation, and the
    ledger is exact (0 of 96 points rejected). Every stage is built and run. What remains open is
    editorial (publication scope, bottleneck-map framing) and a few expert priors (the Hadean
    ocean's H2 / organic floor, heredity attachment thresholds, membrane permeabilities):
    decisions, not unrun science.
  verdict_status: complete
  verdict_detail: >-
    Twenty-three studies, the fourteen-stage arc (the geochemistry-to-heredity stages, the nitrogen / phosphorus /
    energy / growth bottleneck modules, an adversarial control) plus nine
    calibration and -alt studies spanning every stage, wired into a DAG and all run. Each runs a
    coupled Vivarium composite of real tools (PHREEQC + FiPy; eQuilibrator; libRoadRunner; a FiPy
    thermal trap; amphiphile self-assembly; bioenergetic internalization; an agent-based heredity
    lineage; a pore metacommunity; an osmotic growth/division compartment; a Butler-Volmer
    galvanic cell) and is graded on its conservation and acceptance gates. Headline numbers: og-00
    holds the Lost City window (T 40-91 C, pH 9.0-10.8, positive H2 flux) over ~80% of the swept
    grid with |charge| = 0; og-01 reproduces the Preiner/Hudson yields and shows the Tutolo arm
    halve the usable proton-motive gradient (427 -> 43 mV); og-02 reaches a peak autocatalytic
    gain ~29.5; og-06's compositional / hybrid heredity is seed-robust (0.878 +/- 0.005, 5/5
    graded seeds); og-08's escape set is irreducible (full set survives 1.0, any single knockout
    0); og-cal's Lost-City-conditioned posterior is 12.5% of the prior yet 100% viable downstream
    and transport-class-independent (ledger 0/96 rejected). og-01-cal builds the vent wall as a
    Butler-Volmer cell in the Altair-2025 current window (7 of 8 gates pass, ledger exact on 750
    runs) but its attribution gate fails at label agreement 0.47. The adversarial control is
    rejected by all five discriminating gates (min margin 1.8 decades) while the vent passes all
    five.
  decisions_resolved:
  - 'Baseline parameterization: run BOTH arms — classical favorable (Russell/Lane/Sojo) and the 2026 unfavorable
    reassessment (Tutolo/Jackson) — so the campaign adjudicates rather than assumes. Implemented in og-01.'
  - 'Primary geochemistry engine: real PHREEQC (phreeqpython + vendored llnl.dat), which fields the Lost
    City pH endmember once peridotite (not dunite) is reacted. Reaktoro was conda-only and off the uv
    path.'
  - 'Build order: geochemistry + transport first (og-00/og-01), then the reaction network (og-02) — not
    a thin end-to-end skeleton. This put a real composite in the workbench at stage 0.'
  - "Heredity strategy for og-06: compare all modules without presuming RNA. og-06's agent-based lineage
    grades RNA-like template, compositional (GARD), a template-focused hybrid and a non-heritable control
    head-to-head; compositional and hybrid heredity persist length-independently (functional persistence
    ~0.88, seed-robust 5/5 graded seeds) where a long low-fidelity template suffers the Eigen length catastrophe —
    so heredity need NOT presume a long high-fidelity RNA template."
  - 'Explicit electrochemistry for og-01: built, but not adopted as the
    gradient-efficiency abstraction — the carbon_fixation face adds a real Butler-Volmer galvanic-cell
    class (Nernst half-cells, Koutecky-Levich transport limits, Preiner electron branching), with
    MineralConductivityProcess deriving gradient_efficiency from the wall circuit and a ChargeLedger
    auditing the Kirchhoff/faradaic residuals. The empirical gradient-efficiency class is kept as
    og-01''s graded default.'
  - 'Carbon-fixation limitation attribution + default class (resolved by Eran): ACCEPT the structure-sensitive limitation
    attribution AS the carbon-fixation result — the empirical and Butler-Volmer classes disagreeing on the
    limitation label in the favorable region (agreement 0.47 < 0.8) IS the finding, reported as the
    og-01-cal-electrochemistry mechanism map with gate_status failed (an honest negative); the gate is
    not re-tuned to force a pass. KEEP empirical as og-01''s graded/headline default and butler_volmer as
    the registered high-fidelity electrochemistry class (the same FiPy-grades / FEniCS-cross-checks
    pattern), revisiting butler_volmer as the headline once Altair per-condition data turns its
    calibration window into a fit.'
  - 'Carbon-fixation follow-up (accepted, not done): attach the Altair-2025 per-condition current / product time
    courses (turning the calibration window into a likelihood) and bridge CatMAP/Cantera to run the
    microkinetic carbon_fixation class under pixi, then re-run the mechanism map with three classes.
    Deferred because the per-condition dataset is not yet in-workspace and the microkinetic backend needs
    a pixi env.'
  - 'og-03 retention gate (resolved by Eran): RESTATE it at the resolvable Peclet rather than the >=1e6
    enrichment fold — the extreme fold is the closed-cell/reduced-model FiPy exp(Pe) figure the resolved
    FEM does not confirm above Pe ~ 13, so localization is gated on the Peclet, not the fold-magnitude.
    The gate change itself is implemented in a separate og-03 PR; recorded here as the decision-state.'
