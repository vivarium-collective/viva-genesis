at_a_glance:
- study: og-vent-environment
  role: The calibrated vent environment a cell would form in — the serpentinizing reactor settles in the Lost City window over ~80% of the grid, and conditioning (12.5% of plausible states bind, H2-limited) leaves a posterior 100% viable downstream, transport-class-independent (ledger 0/96); supported — a bounded, calibrated feed (no origin claim). The evolving mineral interface that delivers it over time is the separate og-vent-interface.
- study: og-carbon-fixation
  role: The cell's first carbon — H2-driven CO2 reduction reproduces the Preiner yield hierarchy and sustains net organic-carbon flux in a bounded pH/H2 region, controls collapsing (supported); the explicit electrochemical mechanism-attribution arm is refuted on a secondary question (the two model classes agree on which limitation dominates only 47%, below the 80% gate) — kept honest as an arm without flipping the supported headline.
- study: og-network-persistence
  role: 'Network persistence — the carbon-fixing network sustains net carbon throughput as a connected system under vent-realistic feed + washout (supported); persistence is driven, not autocatalytic: under rule-generated real thermodynamics no self-amplifying motif emerges at the vent feed (formose only with exogenous formaldehyde, p=0.04 vs matched nulls), and the curated rTCA motif is reclassed as imposed + element-unbalanced. A provenance-gated reaction atlas supplies the balanced reactions both arms draw on. Endogenous autocatalysis (A2) is the separate og-autocatalysis line.'
- study: og-spatial-concentration
  role: Multisolute spatial enrichment — long tight pores cross the concentration/retention threshold (Baaske cleared, accumulation Peclet 18.4) while open pores wash the feed through, but the eight-solute set fractionates (Soret-driven, co-localization index ~0.18) rather than co-localizing; supported transport physics within a bounded window. Whether that enrichment ignites the reaction network is the separate og-network-rescue.
- study: og-self-compartmentation
  role: Self-compartmentation — from a self-made amphiphile boundary (retention without isolation) to the first self-maintaining protocell whose membrane pays on persistence, with real fatty-acid vesicle MD replacing the phospholipid stand-in; studied at several fidelities as arms
- study: og-energetics
  role: Proto-energetics — capturing geochemical free energy into a transferable store, internalizing it under selection, and coupling a carrier; which coupling chemistry pays, studied at several fidelities as arms (the carrier buys dip-persistence, not more total throughput)
- study: og-heredity
  role: 'Chemical inheritance — a heritable chemical difference transmitted at feasible cost, need not presume RNA: competing inheritance modules graded head-to-head (compositional/hybrid escape the Eigen length catastrophe) and an information-per-cost frontier of six mechanisms; supported. Whether that inherited difference is selectable is the separate og-evolvability.'
- study: og-ecology
  role: Protocell ecology — a cross-feeding community out-produces the best single lineage (margin causally cross-feeding) and community function precedes cell completeness; studied as arms (og-36 stochastic community-vs-single, og-07 metacommunity, og-07-alt real metabolite exchange)
- study: og-independence
  role: Escape and progressive independence from the vent — the minimum innovation set off-gradient, then a graded, attributed map of which innovation internalizes which support; a 2³ epistasis analysis shows the {pump, importer, heredity} set is advantageous but driver-specific, not a jointly-necessary irreducible unit (only pump+heredity interact; the importer is required by no driver; the gradient is the hard dependency)
- study: og-vent-specificity
  role: 'Adversarial control: the gates must reject generic non-vent chemistry'
- study: og-nutrient-bottlenecks
  role: Nutrient bottlenecks — reduced nitrogen keeps pace with carbon and reactive phosphorus co-concentrates in the pore (or limits first), studied as nitrogen + phosphorus arms
- study: og-reproduction
  role: Reproduction — metabolism-coupled growth to a measured-geometry division with viable daughters, building a multi-generation lineage; studied at several fidelities as arms (og-33 coupled growth+division, og-growth-division fate, og-growth-alt physical reproduction)
- study: og-evolvability
  role: Evolvability & selection — a daughter-inherited chemical difference produces a reproducible, selectable fitness difference (parent-offspring correlation +0.949 vs a no-inheritance control) and the population shifts under selection rather than drifting; qualified. The Gate-D selectable-fitness result, split from og-heredity (which carries the inheritance half).
- study: og-network-rescue
  role: Reaction-network rescue — at equal vent feed a concentrating pore ignites the full carbon-fixing network (net carbon flux +4.5e-4, 17 persistent species) while a matched well-mixed, nonconcentrating control stays dark; supported (Gate B). Split from og-spatial-concentration (the enrichment half); also resolves network persistence (A1) feed-plausibility.
- study: og-vent-interface
  role: The evolving mineral interface — the coupled geochemical interface delivers reduced-carbon chemistry only within a bounded two-regime DIC window (under full redox equilibrium DIC draws down before free H2 appears); qualified on the realized DIC-cliff, with its sustained-flux / mineral-evolution / coupled-ledger findings still planned. Split from og-vent-environment (the calibrated-states half).
- study: og-precursor-pool
  role: Functional precursor pool — the vent's reduced-carbon chemistry delivers a de-novo, atom-balanced, budget-closed precursor pool (carbon-source attribution, closed carbon/electron budgets) whose no-H2 / no-catalyst / no-gradient controls all collapse it; but within the defensible DIC window the functional C2-C3 precursors are thermodynamically bounded to sub-micromolar, orders below what the network and amphiphile studies can consume. Qualified. The concentration gap it exposes is taken up by og-operating-window.
- study: og-operating-window
  role: Operating window — the real pore (FiPy Soret trap) plus membrane retention can lift the precursor pool from nanomolar to a consumable micromolar, but only in a narrow corner at the upper edge of defensible small-molecule thermophoresis (Soret coefficient near the ~1e-2/K ceiling with a high thermal gradient and high DIC; overlap volume ~0.11 of the defensible grid); the canonical mid-point does not clear it. Qualified, and hinging on the Soret coefficient of the C2-C3 precursors — measuring it at the vent gradient is the discriminating experiment. Consumes og-precursor-pool's yield vectors.
- study: og-self-maintaining-individual
  role: 'Self-maintaining individuality — the campaign''s central reciprocal-maintenance target: the coupled chemistry-and-boundary loop does not maintain itself endogenously under defensible conditions. The amphiphile pool the chemistry produces falls ~4 orders below its critical aggregation concentration even at the operating window''s favorable corner (~7 orders at the canonical point), so no membrane forms without assuming one and reciprocal maintenance never closes without a built-in retention gain. Refuted, scoped to endogenous closure; the broader individuality-emergence question stays open.'
- study: og-evolvable-lineages
  role: Evolvable lineages — given a granted individual, stochastic partition and variation produce real heritable, selectable adaptation that shifts the population above both matched nulls (no-inheritance and shared-feed) and re-tracks a changed environment, but it is bounded fixed-trait selection, not open-ended novelty (heritable variance declines as the population converges; the trait is a fixed scalar). Qualified. With the self-maintenance result it locates the binding bottleneck of the chemistry-to-life transition at individuality, not evolvability.
