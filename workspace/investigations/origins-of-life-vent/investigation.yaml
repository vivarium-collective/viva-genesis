at_a_glance:
- study: og-00-vent-reactor-baseline
  role: The vent a cell would form in — validated geochemical/spatial testbed (no origin claim yet)
- study: og-01-geology-to-reduced-carbon
  role: The cell's first carbon — H2-driven CO2 reduction; reproduce lab benchmarks; map the flux 
    region
- study: og-02-reduced-carbon-to-protometabolism
  role: The first metabolism — reaction-network persistence and autocatalysis under flow
- study: og-03-dilution-to-localized-individuals
  role: Becoming an individual — long tight pores cross the concentration/retention threshold while
    open pores wash the feed through
- study: og-04-mineral-compartments-to-protocells
  role: The first boundary — amphiphile compartments give retention without isolation
- study: og-05-environmental-to-internal-bioenergetics
  role: Owning its energy — selection internalizes the vent's proton-gradient bioenergetics
- study: og-06-chemistry-to-heredity
  role: The first heredity — competing inheritance modules; heredity must earn its keep
- study: og-07-ecology-before-luca
  role: Before LUCA — population-level emergence vs single-lineage reconstruction
- study: og-08-escape-from-the-vent
  role: Leaving home — the minimum innovation set for an autonomous cell off-gradient
- study: og-adv-generic-nonequilibrium
  role: 'Adversarial control: the gates must reject generic non-vent chemistry'
- study: og-res-nitrogen-assimilation
  role: 'The first nitrogen — reduced-N keeps pace with carbon, or limits first'
- study: og-res-phosphorus-availability
  role: Phosphorus — can the pore co-concentrate P with C and N, or does it precipitate first?
- study: og-energy-proto-energetics
  role: Owning its energy currency — capturing geochemical free energy into a transferable store before modern pumps
- study: og-growth-division
  role: Growth and division — metabolism changes the compartment's physical fate (grow->divide vs lyse
    vs starve)
- study: og-04-alt-endogenous-boundary
  role: The endogenous boundary — a protocell boundary built from the campaign's own carbon chemistry
- study: og-growth-alt-physical-reproduction
  role: Physical reproduction — a growing, dividing individual builds a multi-generation lineage in the agents map
- study: og-cal-vent-environment
  role: 'Vent calibration: what fraction of vent states consistent with observation also supply what
    downstream chemistry needs — posterior, cross-class agreement, discriminating readouts, exact ledger'
- study: og-01-cal-electrochemistry
  role: 'Carbon-fixation mechanism map: the vent wall as a galvanic cell — which limitation (thermodynamic,
    electrical, catalytic, transport) stops carbon fixation where, and whether the empirical and
    Butler-Volmer classes agree on it; charge + electron ledger'
- study: og-02-alt-reaction-universe
  role: 'Open chemical network: a rule-generated C/H/O universe with real dG'' fed the vent-calibration posterior grows no
    autocatalytic motif; fed formaldehyde it grows the formose cycle, enriched over matched nulls (p = 0.04); the
    curated rTCA motif is reclassed as imposed and non-conserving'
- study: og-energy-alt-internalization-threshold
  role: 'Internalization threshold: five energy-coupling classes inside one protocell under a free-energy
    ledger — the thioester store pays from a tenth of the drive, Fe-redox only near full activity, the H+/Na+
    gradient only in a 100x tighter membrane, polyphosphate never; per-individual autonomy'
- study: og-06-alt-information-per-cost
  role: 'Competing heredity: six inheritance mechanisms as classes on one face, each an exact
    Gillespie lineage at low copy number under matched precursor + energy budgets, attached conditionally;
    parent-offspring mutual information per class (5/6 pass, converged), bits per joule spanning > 3 decades,
    mineral-state heredity cheapest and richest under hypothetical costs, templated heredity attaching only
    at the full budget and ribozyme-level fidelity; og-06''s "need not presume RNA" becomes a
    class-substitution result that splits by currency (fewer bits per offspring, 26x the bits per joule)'
- study: og-07-alt-real-metabolite-exchange
  role: 'Biochemical ecology: the reaction universe inside every protocell, masked to a lineage
    repertoire, coupled only by matter crossing membranes into an og-03-shaped pore — a community of a
    carboxylating and a hydrogenating lineage holds the reductive C4 branch (malate) that neither performs alone,
    vanishing without sharing, sustained by oxaloacetate crossing between them, before any cell is complete; it
    needs a dicarboxylate permeability above ~3e-9 m/s; C/N/P ledger over agents + field closed on every run'
- study: og-08-alt-robust-innovation-set
  role: 'Integrated autonomy (capstone): og-08''s {pump, importer, heredity} re-run as real processes inside one persistent world under seven ledgers across 24 sampled model structures at the vent-calibration posterior — an honest negative: no subset persists into a 1 % ocean, only {pump, heredity} into a 10 % one (2/24); the importer is a net cost under a leaky membrane; autonomy near 1 but insufficient; og-08 recorded as a hypothesis generator'
