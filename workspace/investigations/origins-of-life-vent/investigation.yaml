  - question: 'Agent motion model (ecology stage): DEFERRED. The proto_ecology component points agents at fixed cells
      of the og-03 enrichment field (interleaved or segregated along the pore); no motility, chemotaxis or advective
      drift of agents is modelled. Which motion model (none / advected with the pore flow / Brownian between
      cells / thermophoretic like the solutes) should the ecology follow-up adopt?'
    context: 'og-07-alt-real-metabolite-exchange: the
      the study defers motion ("point agents on fields first"). With fixed positions the mixed and
      segregated placements give the same community-only function because pore diffusion between cells
      (k_diffusion 0.1/s, hypothetical) mixes the exchanged intermediate; a motion model would make that
      mixing a property of the agents rather than of the field.'
  - question: 'Membrane permeability of dicarboxylates (ecology stage): the community function (the reductive C4
