at_a_glance:
- study: og-00-vent-reactor-baseline
  role: Validated geochemical/spatial testbed (no OoL claim)
- study: og-01-geology-to-reduced-carbon
  role: H2-driven CO2 reduction; reproduce lab benchmarks; map flux region
- study: og-02-reduced-carbon-to-protometabolism
  role: Reaction network persistence + autocatalysis under flow
- study: og-03-dilution-to-localized-individuals
  role: Concentration/retention crosses persistence thresholds (milestone end)
- study: og-04-mineral-compartments-to-protocells
  role: 'Amphiphile compartments: retention without isolation'
- study: og-05-environmental-to-internal-bioenergetics
  role: Selection internalizes energy conversion
- study: og-06-chemistry-to-heredity
  role: Competing heredity modules; inheritance must earn its keep
- study: og-07-ecology-before-luca
  role: Population-level emergence vs LUCA reconstruction
- study: og-08-escape-from-the-vent
  role: Minimum innovation set for autonomy off-gradient
- study: og-adv-generic-nonequilibrium
  role: 'Adversarial control: gates must reject non-vent chemistry'
