    next: propagate the energy_currencies priors (LHS / Sobol over 18 free parameters); put the classes inside each og-05 strategy and re-run selection on per-individual autonomy; feed the og-04 membrane's permeability directly; transcribe the Fe(II)-disproportionation numbers once the reference is accepted
