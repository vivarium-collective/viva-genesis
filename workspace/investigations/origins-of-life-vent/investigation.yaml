at_a_glance:
- study: og-00-vent-reactor-baseline
  role: The vent a cell would form in — validated geochemical/spatial testbed (no origin claim yet)
- study: og-01-geology-to-reduced-carbon
  role: The cell's first carbon — H2-driven CO2 reduction; reproduce lab benchmarks; map the flux 
    region
- study: og-02-reduced-carbon-to-protometabolism
  role: The first metabolism — reaction-network persistence and autocatalysis under flow
- study: og-03-dilution-to-localized-individuals
  role: Becoming an individual — long tight pores cross the concentration/retention threshold while
    open pores wash the feed through
- study: og-04-mineral-compartments-to-protocells
  role: The first boundary — amphiphile compartments give retention without isolation
- study: og-05-environmental-to-internal-bioenergetics
  role: Owning its energy — selection internalizes the vent's proton-gradient bioenergetics
- study: og-06-chemistry-to-heredity
  role: The first heredity — competing inheritance modules; heredity must earn its keep
- study: og-07-ecology-before-luca
  role: Before LUCA — population-level emergence vs single-lineage reconstruction
- study: og-08-escape-from-the-vent
  role: Leaving home — the minimum innovation set for an autonomous cell off-gradient
- study: og-adv-generic-nonequilibrium
  role: 'Adversarial control: the gates must reject generic non-vent chemistry'
- study: og-res-nitrogen-assimilation
  role: 'The first nitrogen — reduced-N keeps pace with carbon, or limits first'
- study: og-res-phosphorus-availability
  role: Phosphorus — can the pore co-concentrate P with C and N, or does it precipitate first?
- study: og-energy-proto-energetics
  role: Owning its energy currency — capturing geochemical free energy into a transferable store before modern pumps
- study: og-growth-division
  role: Growth and division — metabolism changes the compartment's physical fate (grow->divide vs lyse
    vs starve)
- study: og-cal-vent-environment
  role: 'Phase 1 calibration: what fraction of vent states consistent with observation also supply what
    downstream chemistry needs — posterior, cross-class agreement, discriminating readouts, exact ledger'
