  - kind: narrative_gap
    title: 'Unsupported transition: og-autocatalysis-a2 → og-carbon-fixation'
    detail: 'evidence linking “Both tested routes fail under modeled vent conditions — endogenous self-amplifying autocatalysis is refuted across both representable routes, each against its own matched null. This is a limitation of the modeled vent redox environment, NOT a universal impossibility (see the beyond-vent counterfactual below). The linear-C6 formose arm (og-29) is thermodynamically refuted and seed-independent: the canonical doubling step (r409, 2 glycolaldehyde <-> threose) runs toward condensation (dG0 -16.4 kJ/mol) at vent feeds, so the splitting direction carries no net flux (gain 0, motifs 0 across x1-x50) and production is feed-driven, not self-amplified. The branched reductive-TCA arm (og-rtca) is autocatalytic in TOPOLOGY (its net turn doubles oxaloacetate with no coefficient-2 reaction, so a coefficient detector reads 0 by construction and a coefficient-free functional discriminator is required), yet washes out under vent H2 because the closing reductive carboxylations
      (succinate->a-ketoglutarate +18, acetyl->pyruvate +31 kJ/mol) run uphill and too slow against washout — the same reason the biological cycle uses ferredoxin, not H2. In a LABELLED beyond-vent counterfactual (lower carboxylation barrier + lower dilution) the same rTCA topology meets the self-amplification bar and is topology-specific (the matched null stays off), so the vent negative is a redox-environment limitation, not a defect of the cycle''s wiring. The counterfactual is explicitly not a vent claim. Headline verdict is bounded by the honest negative of both arms: refuted. Every matched null and every arm verdict is preserved.” to “H2-driven CO2 reduction fixes carbon at the vent. Over Fe/Ni/S catalysts the model reproduces the Preiner-2020 yield hierarchy (formate ~200 mM >> acetate ~100 uM >> pyruvate ~10 uM) and sustains net organic-carbon flux in a bounded pH-gradient x dissolved-H2 region; formate collapses to <1 mM in every no-gradient / no-H2 / no-catalyst control, and carbon
      fixation spends the proton gradient (~2 H+/carbon, chemiosmotic backpressure) (og-01, canonical, supported). Under explicit electrochemistry the vent cell is activation (catalyst) limited where the wall conducts and its current sits in the Altair-2025 window, but the two model classes agree on the dominant-limitation label on only 47% of the favorable region (below the pre-registered 80% gate), so the limitation attribution is structure-sensitive and og-01-cal-electrochemistry is refuted on that agreement question (og-01-cal, refuted; og-01-cal-dx planned to diagnose). Consolidated headline: supported — carbon fixation works and reproduces lab benchmarks; the mechanistic attribution of its rate-limiting step is not yet model-class-robust. Every matched null and arm verdict kept, including the refutation.”'
    action: seed discriminate-og-carbon-fixation
