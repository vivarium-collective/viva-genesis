    report."
  items:
  - id: segre2000compositional
    kind: reference
    citation: "Segre D., Ben-Eli D. & Lancet D. (2000). Compositional genomes: prebiotic information transfer
      in mutually catalytic noncovalent assemblies. PNAS 97(8):4112-4117."
    proposed_by: agent
    proposed_at: '2026-10-13'
    related_study: og-06-chemistry-to-heredity
    rationale: "og-06's agent-based lineage uses a GARD-style compositional module (multinomial fission
      of an autocatalytic composition vector) as the length-independent, non-template heredity arm that
      escapes the Eigen length catastrophe — the basis of the 'do NOT presume RNA' finding."
    provenance: "Not in the expert dossier or references/papers.bib; introduced while building the og-06
      lineage model. Recorded here (not cited as provided) pending expert review."
    status: accepted
    decided_at: '2026-10-13'
    decided_by: expert
  - id: eigen1971selforganization
    kind: reference
    citation: "Eigen M. (1971). Selforganization of matter and the evolution of biological macromolecules.
      Die Naturwissenschaften 58(10):465-523."
    proposed_by: agent
    proposed_at: '2026-10-13'
    related_study: og-06-chemistry-to-heredity
    rationale: "og-06's quasispecies replicator and its central result — the error threshold Q=fidelity^length,
      above which correct templates outreplicate the error tail and below which the error catastrophe
      destroys information — are Eigen's error-threshold/quasispecies theory. It is the load-bearing mechanism
      of the stage, currently anchored in prose only (findings cite huber1998peptides for the peptide
      module, not the threshold theory)."
    provenance: "Not in the expert dossier or references/papers.bib; the error-threshold mechanism was
      used from the start of og-06. Recorded here (not cited as provided) pending expert review; on accept
      its id becomes the bibkey to wire onto the error-threshold findings."
    status: accepted
    decided_at: '2026-10-13'
    decided_by: expert
  - id: est2024fesnitrate
    kind: reference
    citation: "FeS-mediated reduction of nitrate to ammonium under early-Earth hydrothermal conditions
      (Environmental Science & Technology, 2024). Full bibliographic details pending."
