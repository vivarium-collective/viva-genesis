at_a_glance:
- study: og-vent-environment
  role: The vent environment a cell would form in — the serpentinizing reactor (settles in the Lost City
    window over ~80% of the grid), its calibration (12.5% of plausible vent states bind, H2-limited), and the
    sharpened coupled interface that supplies H2 / inorganic carbon / pH-redox gradients + a CO2-reducing
    electrochemical driving force but throttles on a bounded two-regime DIC window; qualified — a viable
    geochemical reactor within bounds (no origin claim; the testbed downstream chemistry draws on).
- study: og-carbon-fixation
  role: The cell's first carbon — H2-driven CO2 reduction reproduces the Preiner yield hierarchy and sustains
    net organic-carbon flux in a bounded pH/H2 region, controls collapsing (supported); the explicit
    electrochemical mechanism-attribution arm is refuted on a secondary question (the two model classes agree
    on which limitation dominates only 47%, below the 80% gate) — kept honest as an arm without flipping the
    supported headline.
- study: og-network-persistence
  role: >-
    Network persistence — the carbon-fixing network sustains net carbon throughput as a connected
    system under vent-realistic feed + washout (supported); persistence is driven, not autocatalytic: under
    rule-generated real thermodynamics no self-amplifying motif emerges at the vent feed (formose only with
    exogenous formaldehyde, p=0.04 vs matched nulls), and the curated rTCA motif is reclassed as imposed +
    element-unbalanced. A provenance-gated reaction atlas supplies the balanced reactions both arms draw on.
    Endogenous autocatalysis (A2) is the separate og-autocatalysis line.
- study: og-spatial-concentration
  role: Spatial concentration & individuation — long tight pores cross the concentration/retention
    threshold (Baaske regime cleared, accumulation Peclet 18.4) while open pores wash the feed through, and
    at equal vent feed the concentrating pore ignites the full network (net carbon flux +4.5e-4, 17 persistent
    species) vs a matched well-mixed control that stays dark; the benefit is a bounded porosity window. Also
    resolves network persistence (A1) feed-plausibility.
- study: og-self-compartmentation
  role: 'Self-compartmentation — from a self-made amphiphile boundary (retention without isolation) to the first self-maintaining protocell whose membrane pays on persistence, with real fatty-acid vesicle MD replacing the phospholipid stand-in; studied at several fidelities as arms'
- study: og-energetics
  role: Proto-energetics — capturing geochemical free energy into a transferable store, internalizing it
    under selection, and coupling a carrier; which coupling chemistry pays, studied at several fidelities as
    arms (the carrier buys dip-persistence, not more total throughput)
- study: og-heredity
  role: >-
    Heredity — an inherited chemical difference transmitted and selectable, studied at several
    fidelities as arms: competing inheritance modules (need not presume RNA; compositional/hybrid escape the
    Eigen length catastrophe), the information-per-cost frontier of six mechanisms, and a reproducible
    selectable fitness difference (parent-offspring correlation +0.949 vs a no-inheritance control); qualified
- study: og-ecology
  role: 'Protocell ecology — a cross-feeding community out-produces the best single lineage (margin causally cross-feeding) and community function precedes cell completeness; studied as arms (og-36 stochastic community-vs-single, og-07 metacommunity, og-07-alt real metabolite exchange)'
- study: og-independence
  role: 'Escape and progressive independence from the vent — the minimum innovation set off-gradient, then a graded, attributed map of which innovation internalizes which support, bounded by an honest negative on joint sufficiency across model structures'
- study: og-vent-specificity
  role: 'Adversarial control: the gates must reject generic non-vent chemistry'
- study: og-nutrient-bottlenecks
  role: 'Nutrient bottlenecks — reduced nitrogen keeps pace with carbon and reactive phosphorus co-concentrates in the pore (or limits first), studied as nitrogen + phosphorus arms'
- study: og-reproduction
  role: 'Reproduction — metabolism-coupled growth to a measured-geometry division with viable daughters, building a multi-generation lineage; studied at several fidelities as arms (og-33 coupled growth+division, og-growth-division fate, og-growth-alt physical reproduction)'
