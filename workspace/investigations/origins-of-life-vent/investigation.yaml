    next: exact low-copy-number stochastics per agent (4e-3 molecules per femtolitre cell, 4 per picolitre compartment); permeabilities from the og-04 boundary classes and the measured charged-solute anchor (proposed_inputs); a motion model (decisions_needed); growth / division of agents on the field; N/P-bearing rules so the C:N:P demand becomes a gate; a second lineage partition
