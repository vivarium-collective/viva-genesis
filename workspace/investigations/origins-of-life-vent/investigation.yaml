    title: 'Unsupported transition: og-independence → og-self-maintaining-concentrated'
    detail: 'evidence linking “A vent-born protocell lineage reaches GRADED, attributed independence, not an all-or-nothing (and not a free) escape. og-08 withdrew gradient + mineral + feed JOINTLY and found a coordinated innovation set {internal pump, importer, heredity} where any single removal collapses persistence — but joint relaxation cannot attribute which innovation rescues which support, so that general minimal-sufficiency reading is rescoped to a reduced, model-specific hypothesis (supported within its one coarse model). og-08-alt-robust then tests the set ACROSS model structures on a 2³ subset lattice and resolves it driver-specifically: the {pump, importer, heredity} triple is advantageous but NOT a jointly-necessary irreducible unit — only pump+heredity interact positively, the active importer is required by no driver (a net cost under a leaky membrane), and the hard dependency is the geological gradient (the full set rescues its withdrawal in only ~4.2% of structures), while
      mineral (0.958) and feed (0.75) are freely/borderline survivable needing no specific innovation. og-37''s one-at-a-time withdrawal agrees: the gradient is the budget-sensitive hard dependency (pump-internalization flips below pump efficiency ~0.7, grounded in the energy arm''s persistence-not-throughput surplus), while mineral and feed need no innovation. Because the feed is LUMPED (H2+CO2+organics) and the innovations are coarse budget abstractions, this is an affordability/attribution profile, not a demonstrated escape — headline verdict qualified. Every matched null and every arm verdict is preserved explicitly.” to “Reciprocal chemistry-boundary self-maintenance can close spatially: coupling the vent pore''s real thermophoretic (Baaske) trap to the refuted loop lifts the amphiphile pool across its CAC and earns a membrane without a built-in gain - but only at near-maximal trapping (S_T >= ~0.07, dT >= ~45 K). At conservative vent Soret it does not close, so the refutation is re-cast
      as a quantified conditional, not overturned.”'
    action: seed discriminate-og-self-maintaining-concentrated
