# Cumulative integration gates (upgrade plan §"Four cumulative integration gates")
# + an optional extension. Gate definitions + membership + criteria are authored;
# each gate's `status` here is a STUB — the live board status is DERIVED from member
# studies' own evaluated verdicts by viva_genesis.plan_progress.build_plan_progress
# (each evaluated gate shows its OWN verdict: met / qualified / refuted, + the gate's
# matched-null/ablation criterion_findings). member_studies = studies ADDED at each
# gate (27-31 real); pending_studies = plan members not yet scaffolded (32-37).
#
# Gate A is recorded as TWO sub-gates answering different questions at different
# spine positions: A1 (network persistence) is the SPINE ROOT — B/C/D build on it;
# A2 (endogenous autocatalysis) is an OFF-SPINE BRANCH (off_spine: true) — nothing
# extends it, so its refuted verdict never gates the spine.
#
# The five-act narrative spine (plan_acts, below) is an ADDITIVE overlay that groups
# these canonical gates into Acts I-V; plan_gates stays the source of truth for gate
# state, so any reader (the dashboard board included) that does not know plan_acts
# still works unchanged.
plan_gates:
  - id: A1
    name: Network persistence
    extends: null
    member_studies:
      - og-vent-environment
      - og-network-persistence
    pending_studies:
      # Evidence-expansion sub-program (PLANNED challenge studies; honest-bar — they test whether
      # the A1 conclusions SURVIVE harder scrutiny, a negative being a meaningful result). These
      # EXTEND Gate A1; they do not contribute to its verdict (which rests on the member_studies).
    # No matched-null clause here — persistence is the criterion; the autocatalysis
    # matched-null arm lives on the A2 branch below.
    criterion: >-
      An endogenous reaction network persists on measured or plausibly-bounded geochemical
      feeds (chemical foundation). Spine root — Gates B, C and D build on this.
    status: pending
  - id: A2
    name: Endogenous autocatalysis
    extends: A1
    off_spine: true
    member_studies:
      - og-autocatalysis-a2
    pending_studies: []
    # Explicit matched-null / refutation evidence the board audits for this branch
    # (confirmed → criterion met; contradicted → criterion refuted). Real member
    # finding ids: the formose matched-null arm and the rTCA vent-H2 washout.
    criterion_findings:
      - og29-beats-matched-null
      - og-rtca-vent-h2-washout
    criterion: >-
      Any detected autocatalysis/amplification must beat a matched (degree-preserving)
      null with chemical input fluxes held equal. Off-spine branch — tested and refuted
      under vent conditions for both routes; never a spine prerequisite.
    status: pending
  - id: B
    name: Spatial organization
    extends: A1
    member_studies:
      - og-spatial-concentration
    pending_studies:
      # Evidence-expansion discriminator (PLANNED; EXTENDS Gate B, does not change its verdict).
    criterion_findings:
      - og30-pore-ignites-vs-control
    criterion: >-
      Explicit mineral pores improve productive network persistence — productive flux must
      exceed a matched well-mixed (and nonconcentrating) control with chemical input fluxes
      held equal.
    status: pending
  - id: C
    name: Self-compartmentation
    extends: B
    member_studies:
      - og-self-compartmentation
    # og-self-compartmentation consolidates og-31 (Gate-C membrane benefit), og-32 (first
    # self-maintaining protocell, canonical), og-32b (real fatty-acid vesicle MD, replacing og-32's
    # DLPC/DPPC phospholipid stand-in), plus the membrane-MD sub-program (mem-m1/m2/m3/m5) and the
    # chemistry-membrane composition-overlap discriminator (og-ev) as PLANNED arms. The GPU
    # gold-standard PMF (og-32a) and self-assembly (og-32c) are tracked follow-ups there, not hidden.
    pending_studies: []
    criterion: >-
      Metabolism makes its own membrane and benefits from it — the compartmented system must
      beat a matched ablation (no endogenous membrane) with chemical input fluxes held equal.
    status: pending
  - id: D
    name: Reproduction & heredity
    extends: C
    member_studies:
      - og-reproduction
      - og-heredity
    pending_studies:
      # Membrane-MD sub-program (PLANNED). Division PROPENSITY only (geometry/curvature/barrier) —
      # explicitly NOT heritable division (og-33/og-heredity remain the gate-earning lines). See
      # membrane-md-studies-m1-m5-designs.md.
      - {slug: mem-m4-growth-division-propensity, title: Growth, shape change & division propensity, scaffolded: true, planned: true, program: membrane-md}
    criterion: >-
      Viable daughters inherit functional traits that influence fitness — an inherited
      functional difference must produce a reproducible fitness difference versus a matched
      ablation with input fluxes held equal.
    status: pending
  - id: E
    name: Optional extension (energy / ecology / graded autonomy)
    extends: D
    optional: true
    member_studies:
      - og-energetics
      - og-ecology
      - og-independence
    pending_studies: []
    criterion: >-
      Each extension gate's composite is compared against a matched ablation with chemical
      input fluxes held equal; these extend the spine rather than gating it.
    status: pending
# Five-act narrative spine (strengthening plan §2) — ADDITIVE overlay over plan_gates.
# The acts group the canonical gates (referenced by id in `gates:` / `off_spine_gates:`)
# into the geology-to-cells chapters and carry the act-level narrative. Nothing is
# nested or copied: plan_gates stays the source of truth for gate state. Transition
# rule: each act's `upstream_state_consumed` names the EXACT state variables +
# uncertainty it draws from the upstream act (a conceptual handoff is not a validated
# coupling). Gate A1's roster also carries og-vent-environment (Act I's study); A1 is
# grouped under Act II because its criterion is network persistence.
plan_acts:
  - act: I
    name: Geological engine
    primary_question: >-
      Do observed vent-like conditions deliver useful reactants and energy?
    decisive_exit_condition: >-
      A calibrated, time-varying feed with uncertainty, closed carbon/electron budgets, and a
      documented reactor lifetime.
    member_studies:
      - og-vent-environment
    gates: []                     # vent feasibility feeds gate A1; no distinct campaign gate of its own
    upstream_state_consumed: []   # root act — draws on geochemical priors (inputs), not an upstream act
  - act: II
    name: Chemical organization
    primary_question: >-
      Does realistic driven chemistry persist, amplify, and benefit from spatial structure?
    decisive_exit_condition: >-
      Persistence distinguished from endogenous amplification, with pore rescue and mixed-solute
      fractionation reported.
    member_studies:
      - og-carbon-fixation
      - og-network-persistence
      - og-spatial-concentration
    gates: [A1, B]                # A1 network persistence (roster also carries og-vent-environment); B spatial
    off_spine_gates: [A2]         # endogenous autocatalysis — tested and refuted, never a spine prerequisite
    upstream_state_consumed:
      - from: og-vent-environment
        relation: builds-on
        provides: >-
          the calibrated vent feed posterior (dissolved inorganic carbon and H2 with uncertainty),
          pH, temperature, H2 flux, and the documented reactor lifetime
  - act: III
    name: Chemical individuality
    primary_question: >-
      Can the network generate a boundary that feeds back on its own persistence?
    decisive_exit_condition: >-
      Closure of precursor-to-amphiphile synthesis and an experimentally grounded
      permeability-retention feedback.
    member_studies:
      - og-self-compartmentation
      - og-nutrient-bottlenecks
    gates: [C]
    upstream_state_consumed:
      - from: og-spatial-concentration
        relation: builds-on
        provides: >-
          the pore-concentrated, carbon-fixing persistent network at the calibrated setting (species
          pool, standing concentrations, net fixation flux) within the bounded porosity window
  - act: IV
    name: Reproduction and evolution
    primary_question: >-
      Can a boundary grow, divide physically, and transmit selectable organization?
    decisive_exit_condition: >-
      Physical division propensity plus chemical novelty, transmission, and multigeneration selection.
    member_studies:
      - og-reproduction
      - og-heredity
    gates: [D]
    pending_studies:
      - {slug: mem-m4-growth-division-propensity, title: Growth, shape change & division propensity, scaffolded: true, planned: true, program: membrane-md}
    upstream_state_consumed:
      - from: og-self-compartmentation
        relation: builds-on
        provides: >-
          the self-maintaining protocell (membrane composition -> permeability -> retention, standing
          metabolite pool, net amphiphile production rate, integrity window)
  - act: V
    name: Robustness and autonomy
    primary_question: >-
      Which buffering, community and internalization mechanisms survive reduced geological support?
    decisive_exit_condition: >-
      A robustness / productivity frontier and a graded support-withdrawal analysis, not an assumed
      vent escape.
    member_studies:
      - og-energetics
      - og-ecology
      - og-independence
      - og-vent-specificity
    gates: [E]
    upstream_state_consumed:
      - from: og-heredity
        relation: builds-on
        provides: >-
          the reproducing, inheriting lineage (division geometry, the inherited compositional trait and
          its selectable fitness difference, the multi-generation lineage)
