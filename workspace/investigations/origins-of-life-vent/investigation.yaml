    next: attach MARHYS 4.0; Reaktoro/PFLOTRAN classes under pixi; MineralEvolutionProcess (reactor-stays-open gate); held-out H2 prediction
  - phase: 2
    name: Electrochemical carbon fixation
    status: built-and-run
    studies:
    - og-carbon-fixation
    component: carbon_fixation face with empirical | butler_volmer (primary, real Nernst + Butler-Volmer galvanic cell) | microkinetic (CatMAP/Cantera, registered, runs under pixi) classes; MineralConductivityProcess derives gradient_efficiency from the wall's circuit; ChargeLedgerProcess (Kirchhoff residual, faradaic efficiency <= 1, current-voltage residual)
