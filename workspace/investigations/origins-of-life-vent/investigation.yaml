  gates:
  - id: A1
    name: Network persistence
    criterion: An endogenous reaction network persists on measured or plausibly-bounded geochemical feeds (chemical foundation). Spine root — Gates B, C and D build on this.
    extends: null
    off_spine: false
    verdict: qualified
    members:
    - slug: og-vent-environment
      verdict: supported
    - slug: og-network-persistence
      verdict: supported
    - slug: og-precursor-pool
      verdict: qualified
    pending: []
  - id: A2
    name: Endogenous autocatalysis
    criterion: Any detected autocatalysis/amplification must beat a matched (degree-preserving) null with chemical input fluxes held equal. Off-spine branch — tested and refuted under vent conditions for both routes; never a spine prerequisite.
    extends: A1
    off_spine: true
    verdict: refuted
    members:
    - slug: og-autocatalysis-a2
      verdict: refuted
    pending: []
  - id: B
    name: Spatial organization
    criterion: Explicit mineral pores improve productive network persistence — productive flux must exceed a matched well-mixed (and nonconcentrating) control with chemical input fluxes held equal.
    extends: A1
    off_spine: false
    verdict: supported
    members:
    - slug: og-network-rescue
      verdict: supported
    pending: []
  - id: C
    name: Self-compartmentation
    criterion: Metabolism makes its own membrane and benefits from it — the compartmented system must beat a matched ablation (no endogenous membrane) with chemical input fluxes held equal.
    extends: B
    off_spine: false
    verdict: qualified
    members:
    - slug: og-self-compartmentation
      verdict: qualified
    pending: []
  - id: C2
    name: Reciprocal self-maintenance (endogenous closure)
    criterion: The coupled chemistry-and-boundary loop closes endogenously — a membrane is sustained because the chemistry's own amphiphile pool clears its critical aggregation concentration, without a built-in production/retention gain — beating the no-gain construction and each single-direction ablation with chemical input fluxes held equal.
    extends: C
    off_spine: true
    verdict: qualified
    members:
    - slug: og-operating-window
      verdict: qualified
    - slug: og-self-maintaining-individual
      verdict: refuted
    pending: []
  - id: D
    name: Reproduction & heredity
    criterion: Viable daughters inherit functional traits that influence fitness — an inherited functional difference must produce a reproducible fitness difference versus a matched ablation with input fluxes held equal.
    extends: C
    off_spine: false
