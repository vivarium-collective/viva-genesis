    status: built-and-run
    studies:
    - og-network-persistence
    component: proto_metabolism face with curated_rtca | reaction_universe | null_network classes (all on libRoadRunner), NetworkLedgerProcess, post-hoc motif detector
    data_package: reaction_universe (11 rules over 121 linear C1-C4 C/H/O skeletons -> 413 reversible reactions; eQuilibrator dG' for 50 formula-verified KEGG compounds + group additivity for 71; catalyst classes with a saturating site pool)
    exit_criterion: distribution of persistent/autocatalytic subnetworks; motif enrichment vs matched nulls
    result: 'Vent-calibration feed: 14 persistent species, 0 motifs (every C-C route uphill at vent activities; nulls 0/24). Formose feed (10 mM CH2O): the formose cycle emerges post hoc (gain 2, dynamic 3.1), 0/24 nulls, p = 0.04; ignites only at >= ~10 mM CH2O and washout >= ~0.02/s. Curated rTCA: motif imposed (detector gain 2.99 = declared), lumped turn creates 4 C per cycle (element residual 8). Universe ledger exact; summation theorem 3.3e-3 on dominant fluxes; tolerance sensitivity 7e-6.'
    next: propagate the rate-constant priors (LHS) through both arms; branched C5/C6 skeletons; rule-set-scope decision (N/P); feed the og-03 co-localized concentrations (flagship chain)
  - phase: 4
    name: 3-D multisolute localization
    status: built-and-run
    studies:
    - og-spatial-concentration
    - og-03-alt-colocalization
    component: localization face with the single-solute fipy | fenics | surrogate classes AND the multisolute pair — MultisolutePoreSurrogateProcess (numpy reduced pore-network) | FenicsMultisolutePoreProcess (dolfinx 3-D under pixi) — which transport the eight-solute mixture with per-species D / Soret / adsorption / degradation and report per-species enrichment (viva_genesis/multisolute_localization.py); viva_genesis/colocalization_map.py sweeps (Péclet × Soret) as the Decision surface
    data_package: pore_physics (per-species D, S_T, adsorption, degradation for the eight solutes — literature-sourced in references/multisolute-pore-physics.md and baked in as class defaults; not yet a loaded vg-data provenance package)
    exit_criterion: co-localization / fractionation phase maps inside a demonstrated numerical-convergence envelope (no gate above the resolvable Peclet)
    result: on the eight-solute mixture the pore FRACTIONATES rather than co-localizes, SORET-DRIVEN — the strongly-thermophoretic species concentrate while low-S_T species such as ammonium lag, holding the co-localization index low in the strong-Soret regime (~0.18, rising toward ~1 at weak Soret contrast); adsorption is kinetically negligible over the transit (FEM mobile fraction 0.93–1.0), not the cause. After the reconciliation (kinetic-adsorption fix + contact-time calibration) the FEM-calibrated surrogate agrees with the dolfinx reference within ~2–19% (was ~35–90% off) — coloc_index 0.176 (surrogate) vs 0.171 (FEM) at Pe=1/×8 — so verdict and degree both agree, a small residual model-structure difference. Reported as a candidate incompatibility, not a gate. In the resolved FLOW-THROUGH pore enrichment is strongest at low Péclet and washes out as Pe rises (1/(1+Pe/pe0)) — distinct from the convection-enhanced closed-cell Baaske regime that og-03's reduced column extrapolates
    remaining: a loaded pore_physics vg-data package; an og-03-alt-colocalization study YAML wrapping the map
