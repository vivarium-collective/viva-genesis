<script>
const D={"title": "The Endosymbiotic Transition", "question": "Under what physical, metabolic, ecological, and evolutionary conditions can an archaeal host and a bacterial partner cross from ecological association to a stable, integrated eukaryotic lineage? Endosymbiotic integration is treated not as a single event but as a succession of barriers \u2014 biochemical, spatial, mechanical, energetic, and reproductive \u2014 each of which must be crossed on plausible terms. The aim is to identify which combinations of mechanisms make the crossings possible, which make them impossible, and which competing histories remain consistent with the surviving evidence \u2014 not to animate a predetermined origin story.", "executive": {"what_is_this": "A branching, evidence-grounded campaign that constructs, tests, compares, and composes mechanistic explanations for the endosymbiotic transition. Each study carries its own assumptions, parameter ranges, evidence links, interventions, model versions, and validators, and keeps four classes of evidence strictly separate \u2014 each with its proper interpretation: (1) modern proxy observation (e.g. Asgard protrusion geometry and motility) constrains plausible mechanism and parameters, but is not a direct ancestral observation; (2) genomic / phylogenetic evidence (gene histories, transporters, energy metabolism) sets priors on ancestral states and models their uncertainty, it does not fix an ordering; (3) a model demonstration (stable spatial mutualism, a dynamically closed membrane, net ATP export) establishes mechanistic possibility in a stated parameter region, not historical fact; (4) historical inference (the specific ordering of integration events) can be weighed by model comparison but cannot be established by simulation alone.", "verdict": "Feasible but multiply-bounded. Reopened per expert feedback, the five original studies were demoted from a finished explanation to components, and six coupled models (M1-M7) were built to MEASURE the discriminating observables the per-study composites could not. Result: the syntrophy->enclosure path works only inside a region bounded on every axis \u2014 selection, enclosure, persistence, proximity, and reciprocity.", "verdict_status": "complete", "verdict_detail": "M1 selection_coefficient_for_adhesion +0.63 vs -0.36 control (exchange necessary); M2 probability_of_stable_enclosure 0.95 vs 0.14; M3 joint_feasibility_region 0.91 vs 0.075; M5 endosymbiont_retention_fraction 0.78 vs 0.03 (establishment != permanence); M6 realised exchange 49x proximity advantage (M1's premise validated mechanistically); M7 mutualistic_exchange_benefit 1.52 vs 0.30 (obligate syntrophy needs reciprocal balance). All six discriminating studies resolved through the run pipeline with registered runs + findings + provisional verdicts; the three-axis phase diagram (242 runs) maps the feasible region.", "central_gap": "RESOLVED for this campaign: the coupled models demonstrate a causal, physically consistent transition path (contact provides enclosure's adhesion; enclosure locks in the exchange benefit that keeps contact selected; transmission fidelity + benefit must outrun loss to retain it) rather than separate feasibility conditions. Higher-fidelity axes (membrane PDE, ATP accounting, 3-D geometry) remain as named deferrals."}, "argument": {"main_claim": "The archaeal-host / bacterial-partner endosymbiotic transition along the syntrophy->enclosure path is feasible, evolutionarily retainable, and mechanistically proximity-driven, but ONLY within a region bounded simultaneously on five axes (selection, enclosure, persistence, spatial proximity, metabolic reciprocity) \u2014 each boundary measured by a coupled model, not assumed.", "evidence_for": ["M1 (study-selection-for-proximity): metabolic exchange positively selects a heritable contact propensity (+0.63) and selects against it in the no-exchange control (-0.36).", "M2 (study-enclosure-mechanics): stable enclosure is the majority outcome (0.95) only when adhesion overcomes the bending barrier and survives perturbation (vs 0.14 under conflict).", "M3 (study-contact-to-enclosure-coupling): the two co-succeed (joint feasibility 0.91) only when all establishment conditions align (vs 0.075 decoupled).", "M5 (study-vertical-transmission-stability): an established symbiosis is retained (0.78) only when transmission fidelity + benefit outrun conflict/partner-loss (vs 0.03) \u2014 establishment does not guarantee permanence.", "M6 (study-spatial-exchange-proximity): realised exchange is 49x stronger at contact than distal in the screened regime \u2014 M1's contact-scales-access premise is mechanistically justified.", "M7 (study-bidirectional-syntrophy): obligate two-metabolite syntrophy (Liebig-limited) requires reciprocal balance \u2014 asymmetric production yields 20% of the balanced benefit even at contact."], "evidence_against": ["The feasible region is narrow: each axis independently collapses the transition, so the path is contingent rather than inevitable.", "M6 shows the whole syntrophy-first premise weakens in a well-mixed regime (proximity advantage ~3x), a boundary condition on the hypothesis."], "key_figures": ["figures/transition_phase_diagram.html"], "caveats": ["All models are reduced coupled models measuring the discriminating observable directly; each records an explicit inferential scope.", "Named deferrals (not yet modelled): spatial membrane PDE / full enclosure geometry, ATP/energy accounting, genome-scale metabolic stoichiometry, 3-D geometry.", "Verdicts are provisional: discrimination is demonstrated in the reduced models' regimes, not calibrated to a specific organism pair."]}, "synthesis_headline": "The syntrophy->enclosure eukaryogenesis path is feasible, retained, and mechanistically proximity-driven only within a MULTIPLY-bounded region: selection+sealing+persistence must align to establish it, fidelity+benefit must outrun loss to keep it, exchange must be proximity-screened to drive it, and (for obligate bidirectional syntrophy) reciprocal production must be balanced for the mutualism to pay \u2014 each shown by a coupled model that measures the axis."};
const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
const A=D.argument||{};
document.getElementById("app").innerHTML=`
<h1>${esc(D.title)}</h1>
<div class="status">${esc(D.executive.verdict_status||"complete").toUpperCase()}</div>
<p class="q">${esc(D.question)}</p>

<div class="panel verdict"><b>Verdict.</b> ${esc(D.executive.verdict)}
<p class="mut" style="font-size:13px;margin:8px 0 0">${esc(D.executive.verdict_detail)}</p></div>

<h2>Main claim</h2>
<p>${esc(A.main_claim)}</p>
<p class="mut" style="font-size:13.5px">${esc(D.synthesis_headline)}</p>

<h2>Evidence chain — six coupled models (M1–M7)</h2>
<table><tr><th></th><th></th><th></th></tr><tr><td><code>proto_endosymbiosis_hybrid (M1)</code></td><td>study-selection-for-proximity</td><td>selection_coefficient_for_adhesion +0.63 under exchange vs -0.36 no-exchange control — exchange necessary to select contact.</td></tr><tr><td><code>proto_endosymbiosis_enclosure (M2)</code></td><td>study-enclosure-mechanics</td><td>probability_of_stable_enclosure 0.95 when adhesion beats the bending barrier and survives perturbation vs 0.14 under conflict.</td></tr><tr><td><code>proto_endosymbiosis_coupled (M3)</code></td><td>study-contact-to-enclosure-coupling</td><td>joint_feasibility_region 0.91 aligned vs 0.075 decoupled — the two co-succeed only when all three conditions hold.</td></tr><tr><td><code>proto_endosymbiosis_transmission (M5)</code></td><td>study-vertical-transmission-stability</td><td>endosymbiont_retention_fraction 0.78 (stable) vs 0.03 (high conflict) — establishment does not guarantee evolutionary permanence; retention needs fidelity+benefit to outrun loss.</td></tr><tr><td><code>proto_endosymbiosis_spatial (M6)</code></td><td>study-spatial-exchange-proximity</td><td>realised_exchange_level 49x higher at contact than distal (screened regime) — M1&#x27;s contact-scales-exchange premise is mechanistically justified, collapsing only when well-mixed.</td></tr><tr><td><code>proto_endosymbiosis_multimetab (M7)</code></td><td>study-bidirectional-syntrophy</td><td>mutualistic_exchange_benefit 1.52 balanced vs 0.30 asymmetric (Liebig-capped) — obligate bidirectional syntrophy adds a metabolic-reciprocity requirement beyond proximity.</td></tr></table>
<div class="fig panel" style="margin-top:14px">Three-axis phase diagram (242 real runs): establishment (selection × enclosure barrier; selection × persistence) + evolutionary stability (fidelity × loss).
<a href="figures/transition_phase_diagram.html">Open the phase diagram →</a></div>

<h2>Evidence for</h2><ul>${li(A.evidence_for)}</ul>
<h2>Evidence against / boundary conditions</h2><ul>${li(A.evidence_against)}</ul>

<h2>Member studies</h2>
<div class="study"><div class="sh"><h3>S1 — Metabolic partnership: can an archaeal-bacterial pair gain fitness from exchange?</h3><span class="badge b-—">— · </span></div><p class="q">Can plausible archaeal-bacterial pairs gain fitness from metabolite exchange, and under which redox and substrate regimes? Does the predicted mutualism survive mass-balance and electron-donor/acceptor feasibility audits and alternative reconstructions?</p><p class="find">Calibrated (p_diacid=1e-8, p_monoacid=1e-7, k_wash=0.01, 250 steps): the connected cross-feeding community settles to metacommunity_robustness 0.536 (&gt; 0.5, PASS) while the isolated control (coupling=private) settles to 0.464 (&lt; 0.5, FAIL) — a partner-dependent advantage of 1.15 (connected/isolated). Carbon mass balance holds (worst-case residual 5.6e-11). Establishes a mechanistically plausible route (connected community) and a well-characterized failure route (isolated control) at first fidelity. Computed via a direct in-process composite run; the tracked workbench run awaits the evaluator reaching the genesis venv.</p><p class="scope"><b>Inferential scope:</b> </p></div><div class="study"><div class="sh"><h3>S2 — Ecology to proximity: when does cross-feeding select for persistent contact?</h3><span class="badge b-—">— · </span></div><p class="q">When do cross-feeding benefits select for persistent proximity rather than independent coexistence? Does the predicted selection for proximity disappear under high diffusion / well-mixed conditions?</p><p class="find">Calibrated (k_diffusion=0.001, 250 steps): proximate (mixed) partners sustain cross-lineage flux 4.0e-22 mol/tick while distant (segregated) partners sustain only 1.8e-23 — a 22x proximity advantage, so selection favours persistent contact. The advantage is diffusion- dependent: at k_diffusion=0.1 the mixed/segregated ratio is 1.26 (proximity barely matters, diffusion carries the intermediate). Establishes that proximity selection is a spatial- structure effect, not a given — a precondition for intimate symbiosis. Direct in-process run.</p><p class="scope"><b>Inferential scope:</b> </p></div><div class="study"><div class="sh"><h3>S3 — Protrusions to enclosure: can protrusion mechanics reach stable wrapping?</h3><span class="badge b-—">— · </span></div><p class="q">Can observed archaeal protrusion mechanics plausibly transition from contact to stable wrapping / engulfment, within membrane area, bending-cost, and timescale budgets? Morphology alone cannot demonstrate engulfment.</p><p class="find">Enclosure is topology-gated, not a settled yes. The higher-fidelity active-protrusion membrane-wrapping model (Helfrich bending + adhesion + tension + finite protrusion area + active force F*R, 3D; the mechanism the question is about) supersedes the coarser arms: classical EXTERNAL engulfment reaches a stable wrap for only a MINORITY of partners (probability 0.27, a narrow 0.41-0.56 um window), with the active protrusion load-bearing (raises it from 0.17; 36% of enclosures need the force); INSIDE-OUT invagination (Baum &amp; Baum) is far more feasible (0.83). The coarse arms overstated it — the 2D passive-adhesion CPM read 1.00 (but that is regime-assumed, J_hs &lt; J_sM-J_hM, with no protrusion) and the static area+bending budget read 0.61/0.98. So whether the enclosure hypothesis is supported depends on which topology is primary, which remains an open investigation decision. Enclosure is a separate hurdle from metabolic benefit; morphology alone does not demonstrate engulfment.</p><p class="scope"><b>Inferential scope:</b> </p></div><div class="study"><div class="sh"><h3>S4 — Compartmental energetic coupling: does internalization pay for itself?</h3><span class="badge b-—">— · </span></div><p class="q">Does internalization increase net fitness given ATP production, transport losses, upkeep, and host-symbiont conflict — and in which parameter regimes is internalization actually harmful?</p><p class="find">Calibrated (60 steps, declining external gradient): with an efficient pump (catalyst_efficiency=1.0) the population internalizes gradient generation and survives (survivors 1.00, autonomy 0.99, fitness 0.68) — internalization is net-positive. The weak-pump control (catalyst_efficiency=0.3) collapses (survivors 0.00, fitness 0.059) — a well-characterized harmful regime where internalization cannot pay the Sojo membrane cost. An enclosed partner develops organelle-like function only under restricted physiological conditions. Direct in-process run.</p><p class="scope"><b>Inferential scope:</b> </p></div><div class="study"><div class="sh"><h3>S5 — From symbiont to organelle: when does integration become heritable?</h3><span class="badge b-—">— · </span></div><p class="q">Which routes to inheritance lead to stable vertical transmission and a persistent lineage? Distinguish mere within-host survival from high-fidelity vertical transmission over many generations.</p><p class="find">Calibrated (60 generations): a high-fidelity template lineage (per_site_fidelity=0.99) reaches heritability 0.989 and persists with full function (population 220) — stable heritable integration, a new evolutionary individual. Two well-characterized failure routes: a low-fidelity template (0.80) hits the Eigen error catastrophe and collapses (heritability 0.799, population 0), and a non-heritable mechanism transmits nothing (heritability 0.106). Heritable integration emerges only above the fidelity threshold. Direct in-process run.</p><p class="scope"><b>Inferential scope:</b> </p></div><div class="study"><div class="sh"><h3>Does exchange increase the fitness of contact-seeking phenotypes?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">Does exchange increase the fitness of contact-seeking phenotypes?</p><p class="find">Under metabolic exchange, a heritable contact/adhesion propensity is POSITIVELY selected (selection coefficient +0.63, contact fixes) above a frequency-dependent invasion threshold; the matched no-exchange control shows NEGATIVE selection (-0.36, contact eliminated). Exchange is necessary for selection-for-contact. Supports H1-syntrophy-first in the favorable regime; rejects H4-no-integration there.</p><p class="scope"><b>Inferential scope:</b> Reduced coupled model (replicator on contact propensity; frequency-dependent exchange benefit vs energetic adhesion cost). Establishes that exchange CAN select for contact given benefit&gt;cost and partner availability; does NOT model spatial exchange PDE or membrane mechanics (M2+). The selection is regime-dependent — a frequency threshold exists (full phase map = M4).</p></div><div class="study"><div class="sh"><h3>Can selected contact transition to stable enclosure under physical constraints?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">Can selected contact transition to stable enclosure under physical constraints?</p><p class="find">Stable, persistent enclosure is the MAJORITY outcome (P=0.95) only in the geometry-first regime where adhesion overcomes the bending neck-closure barrier AND survives perturbation; under conflict (high perturbation) P=0.14 — enclosure seals but unwraps. Supports H2-geometry-first in the favorable regime; H3-parasitism/conflict where perturbation dominates.</p><p class="scope"><b>Inferential scope:</b> Reduced three-compartment enclosure ensemble (attempting-&gt;sealed&lt;-&gt;stalled) with sealing driven by adhesion vs bending barrier and unwrapping by perturbation vs adhesion. Establishes that stable enclosure is reachable+persistent given a favorable mechanical balance; does NOT resolve the full membrane PDE / CPM geometry (next fidelity). Outcome is regime-dependent.</p></div><div class="study"><div class="sh"><h3>Do the same conditions that select proximity also permit enclosure?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">Do the same conditions that select proximity also permit enclosure?</p><p class="find">A self-reinforcing contact+enclosure regime EXISTS: joint_feasibility_region=0.91 when exchange selects contact AND contact&#x27;s adhesion overcomes the bending barrier AND the seal persists. It collapses to 0.07 when contact is not selected (benefit&lt;cost), and (directly measured) toward zero when enclosure destabilises (0.14) or the bending barrier blocks sealing (0.21). So selection-for-contact and stable enclosure CO-SUCCEED only when all three conditions align — the coupled eukaryogenesis transition is feasible along the syntrophy-&gt;enclosure path, but narrowly.</p><p class="scope"><b>Inferential scope:</b> Reduced four-compartment coupled model (lc&lt;-&gt;hc_un&lt;-&gt;hc_se, hc_st stalled trap) with contact providing enclosure&#x27;s adhesion and enclosure locking in the exchange benefit. Establishes that a jointly-feasible regime EXISTS and is contingent on all three sub-mechanisms; does not resolve the spatial membrane PDE or full energy accounting (M4).</p></div><div class="study"><div class="sh"><h3>Is the established endosymbiosis evolutionarily stable?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">Once contact+enclosure establish the symbiosis (M3), is the symbiont heritably retained across generations, or does conflict/partner-loss decay it?</p><p class="find">An established endosymbiosis is evolutionarily STABLE (retention 0.78) only when transmission fidelity and the selective benefit together outrun conflict/partner-loss and segregational leakage; under high conflict it decays to 0.03 even though it established. Establishment (M3) does NOT guarantee permanence — retention also collapses under low transmission fidelity (0.19) or no net benefit (0.06).</p><p class="scope"><b>Inferential scope:</b> Reduced frequency replicator (symbiont-bearing vs free) balancing selection, segregational transmission loss, conflict/partner-loss, and re-acquisition. Captures the evolutionary-stability balance; not the molecular partition machinery or an explicit genome.</p></div><div class="study"><div class="sh"><h3>Does contact mechanistically confer an exchange advantage?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">M1 assumes contact scales exchange access. Under explicit diffusion, is realised metabolite exchange strongly proximity-dependent, or well-mixed (premise invalid)?</p><p class="find">Realised metabolite exchange is strongly proximity-dependent in the screened diffusion regime: a contact partner receives 49x the exchange of a distal one (1.70 vs 0.034 at screening length lambda~2.2), rising to ~1900x under strong screening. The advantage collapses to ~3x only when the metabolite is effectively well-mixed (lambda&gt;&gt;distance). So M1&#x27;s lumped premise — contact scales exchange access — is MECHANISTICALLY justified wherever the metabolite decays on the inter-partner length scale, not an imposed assumption.</p><p class="scope"><b>Inferential scope:</b> Reduced 1-D screened reaction-diffusion field at steady state (producer source, decay, consumer uptake), reflecting boundaries. Establishes the proximity-benefit relationship and its screening regime; not a 3-D geometry, advection, or multi-metabolite stoichiometry.</p></div><div class="study"><div class="sh"><h3>Does obligate bidirectional syntrophy add a constraint beyond proximity?</h3><span class="badge b-supported">supported · provisional</span></div><p class="q">The syntrophy/hydrogen hypotheses are obligate two-metabolite mutualisms. Does Liebig-limited reciprocal exchange require metabolic BALANCE, not just contact?</p><p class="find">Obligate bidirectional (two-metabolite, Liebig-limited) syntrophy is proximity-dependent much like the one-way case when production is BALANCED (54x contact-vs-distal advantage, cf. M6&#x27;s 49x), but adds a new constraint: the mutual benefit is capped at the SCARCER reciprocal flux, so asymmetric production (B=0.2 vs A=1.0) yields only 0.30 vs 1.52 — 20% of balanced — even at contact. So the syntrophy/hydrogen hypotheses require metabolic RECIPROCITY, not just proximity; an imbalanced pair is starved regardless of contact.</p><p class="scope"><b>Inferential scope:</b> Reduced 1-D screened two-field diffusion at steady state with Liebig (minimum) coupling; captures the stoichiometric + bidirectional structure, not genome-scale metabolic stoichiometry or 3-D geometry.</p></div>

<h2>Caveats &amp; inferential scope</h2>
<ul class="caveat">${li(A.caveats)}</ul>
<p class="mut" style="font-size:12.5px;margin-top:24px">Generated from investigation.yaml + member study findings. Resolved via the feedback-driven discovery cycle: reopen → discriminating studies → coupled models that measure → registered runs → synthesis.</p>
`;
</script></div></body></html>
