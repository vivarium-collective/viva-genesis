synthesis:
  headline: 'The syntrophy->enclosure eukaryogenesis path is feasible, retained, and
    mechanistically proximity-driven only within a MULTIPLY-bounded region: selection+sealing+persistence
    must align to establish it, fidelity+benefit must outrun loss to keep it, exchange
    must be proximity-screened to drive it, and (for obligate bidirectional syntrophy)
    reciprocal production must be balanced for the mutualism to pay — each shown by
    a coupled model that measures the axis.'
  evidence_chain:
  - study: study-selection-for-proximity
    model: proto_endosymbiosis_hybrid (M1)
    result: selection_coefficient_for_adhesion +0.63 under exchange vs -0.36 no-exchange
      control — exchange necessary to select contact.
  - study: study-enclosure-mechanics
    model: proto_endosymbiosis_enclosure (M2)
    result: probability_of_stable_enclosure 0.95 when adhesion beats the bending barrier
      and survives perturbation vs 0.14 under conflict.
  - study: study-contact-to-enclosure-coupling
    model: proto_endosymbiosis_coupled (M3)
    result: joint_feasibility_region 0.91 aligned vs 0.075 decoupled — the two co-succeed
      only when all three conditions hold.
  - study: study-vertical-transmission-stability
    model: proto_endosymbiosis_transmission (M5)
    result: endosymbiont_retention_fraction 0.78 (stable) vs 0.03 (high conflict)
      — establishment does not guarantee evolutionary permanence; retention needs
      fidelity+benefit to outrun loss.
  - study: study-spatial-exchange-proximity
    model: proto_endosymbiosis_spatial (M6)
    result: realised_exchange_level 49x higher at contact than distal (screened regime)
      — M1's contact-scales-exchange premise is mechanistically justified, collapsing
      only when well-mixed.
  - study: study-bidirectional-syntrophy
    model: proto_endosymbiosis_multimetab (M7)
    result: mutualistic_exchange_benefit 1.52 balanced vs 0.30 asymmetric (Liebig-capped)
      — obligate bidirectional syntrophy adds a metabolic-reciprocity requirement
      beyond proximity.
  phase_diagram:
    figure: figures/transition_phase_diagram.html
    data: figures/transition_phase_data.json
    model: proto_endosymbiosis_coupled (M4 sweep, 242 real runs)
    reads: Feasible region (joint_feasibility ~0.9) occupies high-benefit/low-bending/low-perturbation
      corner; collapses to ~0 as benefit<cost (no selection substrate), bending exceeds
      adhesion (no sealing), or perturbation dominates (no persistence). net_lineage_fitness
      is positive only inside the feasible region, neutral elsewhere.
  inferential_scope: Reduced coupled models measuring the discriminating observables
    directly (not the identity/prerequisite baselines the original 5 studies graded).
    Spatial membrane PDE, full energy accounting, explicit vertical-transmission and
    conflict dynamics are named deferrals (higher-fidelity M4+).
  answer_to_reopening: 'Which combinations work: selection+sealing+persistence together.
    Which fail: any single axis failing (shown directly). Why: contact provides the
    adhesion enclosure needs and enclosure locks in the exchange benefit that keeps
    contact selected — the feedback is self-reinforcing only inside the narrow aligned
    region.'
  premise_check: 'M6 validates the exchange-access premise M1-M5 rest on: realised
    exchange is proximity-dependent wherever the metabolite is screened; the whole
    syntrophy-first path would weaken only in a well-mixed regime.'
scientific_argument:
  main_claim: The archaeal-host / bacterial-partner endosymbiotic transition along
    the syntrophy->enclosure path is feasible, evolutionarily retainable, and mechanistically
    proximity-driven, but ONLY within a region bounded simultaneously on five axes
    (selection, enclosure, persistence, spatial proximity, metabolic reciprocity)
    — each boundary measured by a coupled model, not assumed.
  evidence_for:
  - 'M1 (study-selection-for-proximity): metabolic exchange positively selects a heritable
    contact propensity (+0.63) and selects against it in the no-exchange control (-0.36).'
  - 'M2 (study-enclosure-mechanics): stable enclosure is the majority outcome (0.95)
    only when adhesion overcomes the bending barrier and survives perturbation (vs
    0.14 under conflict).'
  - 'M3 (study-contact-to-enclosure-coupling): the two co-succeed (joint feasibility
    0.91) only when all establishment conditions align (vs 0.075 decoupled).'
  - 'M5 (study-vertical-transmission-stability): an established symbiosis is retained
    (0.78) only when transmission fidelity + benefit outrun conflict/partner-loss
    (vs 0.03) — establishment does not guarantee permanence.'
  - 'M6 (study-spatial-exchange-proximity): realised exchange is 49x stronger at contact
    than distal in the screened regime — M1''s contact-scales-access premise is mechanistically
    justified.'
  - 'M7 (study-bidirectional-syntrophy): obligate two-metabolite syntrophy (Liebig-limited)
    requires reciprocal balance — asymmetric production yields 20% of the balanced
    benefit even at contact.'
  evidence_against:
  - 'The feasible region is narrow: each axis independently collapses the transition,
    so the path is contingent rather than inevitable.'
  - M6 shows the whole syntrophy-first premise weakens in a well-mixed regime (proximity
    advantage ~3x), a boundary condition on the hypothesis.
  key_figures:
  - figures/transition_phase_diagram.html
  caveats:
  - All models are reduced coupled models measuring the discriminating observable
    directly; each records an explicit inferential scope.
  - 'Named deferrals (not yet modelled): spatial membrane PDE / full enclosure geometry,
    ATP/energy accounting, genome-scale metabolic stoichiometry, 3-D geometry.'
  - 'Verdicts are provisional: discrimination is demonstrated in the reduced models''
    regimes, not calibrated to a specific organism pair.'
