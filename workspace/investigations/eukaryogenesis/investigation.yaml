schema_version: 2
name: eukaryogenesis
title: The Endosymbiotic Transition
created: '2026-10-27'
status: active
question: Under what physical, metabolic, ecological, and evolutionary conditions
  can an archaeal host and a bacterial partner cross from ecological association to
  a stable, integrated eukaryotic lineage? Endosymbiotic integration is treated not
  as a single event but as a succession of barriers — biochemical, spatial, mechanical,
  energetic, and reproductive — each of which must be crossed on plausible terms.
  The aim is to identify which combinations of mechanisms make the crossings possible,
  which make them impossible, and which competing histories remain consistent with
  the surviving evidence — not to animate a predetermined origin story.
hypothesis: The endosymbiotic transition is persuasive only if each barrier-crossing
  (exchange, proximity, enclosure, physiology, individuality, complexity) emerges
  from plausible preceding conditions, conserves the relevant physical quantities
  (mass, charge, electron, free energy), improves or at least preserves lineage fitness,
  and persists through generations. Each crossing introduces new benefits and new
  constraints; the discovery problem is which mechanism combinations let cooperation
  become stable cellular integration, and which alternative histories the evidence
  cannot yet rule out.
lead: 'A mechanistic, falsifiable investigation of the endosymbiotic transition, staged
  as a chain of barrier-crossings with an explicit decision gate at each one. The
  built arc is five bridge studies — metabolic partnership (S1, gate G1·Exchange),
  ecology to proximity (S2, G2·Proximity), protrusions to enclosure (S3, G3·Enclosure),
  compartmental energetic coupling (S4, G4·Physiology), and symbiont to organelle
  (S5, G5·Individuality) — bracketed by two proposed bookend studies: genome-resolved
  ancestral reconstruction (S0, G0·Reconstruct) and the emergence of cellular complexity
  (S6, G6·Complexity). The ordering is a CONCEPTUAL dependency graph, not a fixed
  temporal sequence: independent cells -> metabolic benefit -> persistent contact
  -> enclosure / compartmental coupling -> net energetic and genetic dependence ->
  coordinated inheritance and evolutionary individuality -> new capability. Counter-narratives
  are tested head to head — physical internalization preceding strong syntrophy; protrusion-driven
  external wrapping rather than classical phagocytosis; energetic benefit without
  internalization; and stable ectosymbioses that never become organelles. Extant Asgard
  archaea and alphaproteobacteria are experimental proxies that constrain mechanism,
  not recovered ancestors; phylogenetic reconstructions are treated as ensembles,
  never a single definitive lineage. The campaign''s capstone deliverable is a phase
  diagram of endosymbiosis (see final_deliverable) — a systematic map of where each
  proposed transition can and cannot work.'
executive:
  what_is_this: 'A branching, evidence-grounded campaign that constructs, tests, compares,
    and composes mechanistic explanations for the endosymbiotic transition. Each study
    carries its own assumptions, parameter ranges, evidence links, interventions,
    model versions, and validators, and keeps four classes of evidence strictly separate
    — each with its proper interpretation: (1) modern proxy observation (e.g. Asgard
    protrusion geometry and motility) constrains plausible mechanism and parameters,
    but is not a direct ancestral observation; (2) genomic / phylogenetic evidence
    (gene histories, transporters, energy metabolism) sets priors on ancestral states
    and models their uncertainty, it does not fix an ordering; (3) a model demonstration
    (stable spatial mutualism, a dynamically closed membrane, net ATP export) establishes
    mechanistic possibility in a stated parameter region, not historical fact; (4)
    historical inference (the specific ordering of integration events) can be weighed
    by model comparison but cannot be established by simulation alone.'
  verdict: 'Feasible but multiply-bounded. Reopened per expert feedback, the five
    original studies were demoted from a finished explanation to components, and six
    coupled models (M1-M7) were built to MEASURE the discriminating observables the
    per-study composites could not. Result: the syntrophy->enclosure path works only
    inside a region bounded on every axis — selection, enclosure, persistence, proximity,
    and reciprocity.'
  verdict_status: open
  verdict_detail: M1 selection_coefficient_for_adhesion +0.63 vs -0.36 control (exchange
    necessary); M2 probability_of_stable_enclosure 0.95 vs 0.14; M3 joint_feasibility_region
    0.91 vs 0.075; M5 endosymbiont_retention_fraction 0.78 vs 0.03 (establishment
    != permanence); M6 realised exchange 49x proximity advantage (M1's premise validated
    mechanistically); M7 mutualistic_exchange_benefit 1.52 vs 0.30 (obligate syntrophy
    needs reciprocal balance). All six discriminating studies resolved through the
    run pipeline with registered runs + findings + provisional verdicts; the three-axis
    phase diagram (242 runs) maps the feasible region.
  decisions_needed:
  - question: Which two or more candidate archaeal-host / bacterial-partner genome
      pairs anchor S1 (e.g. Asgard + alphaproteobacterium selections from GTDB/NCBI),
      and under which redox / substrate regimes (anaerobic, micro-aerobic, oxygen-tolerant)
      are they first tested?
    context: No single extant isolate is the ancestral host; S0/S1 must reconstruct
      two or more pairs with explicit uncertainty rather than pick one (gate G0·Reconstruct).
  - question: Which initial ecology (syntrophy, commensalism, parasitism) is the primary
      scenario for S2, and which are the competing scenarios run head to head?
    context: The campaign requires testing alternative initial ecologies, not assuming
      syntrophy (hypotheses H1 vs H4 vs H5).
  decisions_resolved: []
  computed_verdict_status: in-progress
  computed_acceptance:
