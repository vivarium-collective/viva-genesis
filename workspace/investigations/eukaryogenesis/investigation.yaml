final_deliverable: 'The campaign''s capstone is a phase diagram of endosymbiosis:
  a map over metabolic, physical, ecological, and evolutionary conditions that separates
  five outcome regimes — independent organisms, stable ectosymbiosis, transient internalization,
  parasitic association, and stable inherited endosymbiosis. Each regime is defined
  by how far a parameter set travels through the gate chain: independent organisms
  fail G1/G2 (no exchange benefit, no contact selection); stable ectosymbiosis clears
  G1-G2 but not G3 (favored contact without enclosure, hypothesis H5); transient internalization
  clears G3 but fails G4/G5 (enclosed but not net-beneficial or not heritable); parasitic
  association is negative-sum at G4/G5 (one partner exploited, conflict wins); and
  stable inherited endosymbiosis crosses G1-G5 to a coordinated, heritable lineage.
  The product is therefore not a single simulation of "the" endosymbiotic theory but
  a systematic search — endosymbiosis put to the test — for the conditions under which
  its proposed transitions can and cannot work, reported with quantitative uncertainty
  and explicit unresolved historical alternatives.'
regimes:
- independent organisms
- stable ectosymbiosis
- transient internalization
- parasitic association
- stable inherited endosymbiosis
flagship_studies:
- framing: Can syntrophy drive physical association?
  studies:
  - s1-metabolic-partnership
  - s2-ecology-to-proximity
  composite: A
  why: bridges S1 and S2 into a tractable, testable first result — does improved metabolic
    exchange actually select for sustained cell-cell contact when adhesion is an evolving
    trait?
- framing: Can archaeal protrusions produce endosymbiosis?
  studies:
  - s3-protrusions-to-enclosure
  composite: B
  why: the most visually compelling study — with realistic size, force, adhesion and
    surface-area constraints, when does a partner become enclosed, what membrane topology
    results, and does the host remain viable? (a viva-cpm spike already shows the
    wrapping transition.)
- framing: When do two organisms become one evolutionary individual?
  studies:
  - s5-symbiont-to-organelle
  composite: D
  why: the deepest evolutionary question — couples metabolic dependency to multigenerational
    population genetics with symbiont transmission, gene loss, protein import, and
    competition between integrated and unintegrated lineages.
