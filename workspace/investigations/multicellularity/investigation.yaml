schema_version: 2
name: multicellularity
title: From Cells to Organisms
created: '2026-11-01'
status: running
seed_id: VG-MULTI-001
question: Under what physical, metabolic, ecological, developmental, and evolutionary
  conditions can independent cells become a persistent, integrated, self-reproducing
  multicellular evolutionary individual? The existence of adherent cells is not sufficient
  to establish a major transition; a defensible investigation must identify a SEQUENCE
  of separately measurable properties — collective formation, physiological coordination,
  reproducible group reproduction, heritable group-level traits, and adaptation at
  the collective level — which may evolve in different orders and need not all appear
  in every lineage.
hypothesis: 'The transition is persuasive only when each property is demonstrated
  on plausible mechanistic terms and the combination is shown sufficient for persistence
  and further complexity. Discriminating objective: determine WHEN size-dependent
  ecological selection and elementary adhesion explain observed group formation, and
  WHEN metabolism, development, heritable life cycles, or conflict suppression are
  NECESSARY for persistence and further complexity. No single mechanism is assumed
  universally sufficient.'
lead: This investigation is a falsifiable simulation-and-evidence program for the
  emergence of multicellularity, synthesizing Morowitz's emergence framework with
  experimental evolution (snowflake yeast, predator-selected Chlamydomonas; volvocine
  algae and filamentous cyanobacteria as comparative systems) and biophysical modeling.
  It distinguishes well-supported observations from hypotheses, proposes interoperable
  mechanistic models compiled into process-bigraph composites, and specifies a first
  discovery cycle capable of REJECTING explanations. The first deliverable is a validated
  minimal cell-collective simulator and a claim-evidence graph.
executive:
  what_is_this: Seed for a falsifiable program testing which conditions turn independent
    cells into an integrated, self-reproducing multicellular individual.
  verdict: 'First cycle: clonal adhesion produces persistent groups, but adhesion
    alone confers no fitness advantage; size-dependent ecological selection (predation/settling)
    is what makes groups fitter than unicells; oxygen/transport then bounds that advantage
    to an optimal intermediate group size.'
  verdict_status: in-progress
  verdict_detail: Proposed seed — tool names and the import manifest are design targets,
    not a verified importer schema. No studies have run; every claim is provisional
    until mapped to source-specific evidence.
  objective: Reproduce group formation, fragmentation, and group-level fitness from
    first principles, and bound which constraint combinations are sufficient versus
    necessary for persistence and further complexity.
  central_gap: Separately measurable properties (formation, coordination, group reproduction,
    heritable group traits, collective adaptation) have not been demonstrated together
    on one mechanistically consistent system; it is unknown which combinations are
    sufficient, which necessary, and which merely possible.
  mandate: Test whether ecological selection plus simple clonal adhesion suffices
    to reproduce group formation and group-level fitness; compare competing mechanistic
    models; report non-identifiability and select a discriminating intervention rather
    than announcing discovery. Preserve the distinction among possibility, sufficiency,
    necessity, and historical inference.
  decisions_needed:
  - question: Which test system anchors the first cycle — snowflake yeast (settling)
      or predator-selected Chlamydomonas?
    context: S01/S02 benchmark against Ratcliff 2012 and Herron 2019; the anchor choice
      sets the ecological-selection treatment.
  - question: Ingest the Bozdag 2023 source data/code (R8) and SRA PRJNA943273 (R9),
      or treat them as comparison-only?
    context: S03/S04 benchmark against Bozdag 2023 (oxygen, elongation, macroscopic
      size, mechanical robustness); direct ingestion enables held-out prediction.
  decisions_resolved:
  - question: Does ecological selection + simple clonal adhesion suffice for group
      formation and a group-level fitness advantage? (first-cycle A/B/C)
    resolution: 'Discriminated on cell_collective: A (adhesion only) forms persistent
      groups (0.67) but adv~0; B (+predation/settling) gives adv>0 (+0.15); C (+O2-limited
      growth) bounds the advantage to small/intermediate size. Ecology is sufficient
      for the advantage; adhesion alone is not; transport sets a size optimum.'
competing_frameworks:
- name: Morowitz emergence framework
  relation: interpretive lens — emergence as successive constraint-crossings toward
    a new individual
- name: De novo experimental evolution
  relation: empirical anchor — Ratcliff/Herron/Bozdag selection experiments as reproducible
    targets
- name: Comparative phylogenetic origins
  relation: comparative baseline — Knoll/Grosberg multiple-independent-origins framing;
    guards against a single necessary pathway
transition_barriers:
- barrier: Adhesion and topology
  mechanistic_implication: Group stability depends on cell-cell bond formation, geometry
    and fragmentation.
  testable_measurement: Bond lifetime, group connectivity, propagule distributions.
- barrier: Transport and metabolic demand
  mechanistic_implication: Increasing group size can impose nutrient, oxygen and waste
    gradients.
  testable_measurement: Growth/viability versus radius, diffusion length, uptake flux.
- barrier: Ecological selection
  mechanistic_implication: Predation and settling can reward size even without specialization.
  testable_measurement: Fitness advantage under predator/settling treatments.
- barrier: Coordination and differentiation
  mechanistic_implication: Signals, local gradients and regulatory plasticity may
    create distinct cell states.
  testable_measurement: Spatial fate maps, group productivity, phenotypic stability.
- barrier: Heritability and conflict
  mechanistic_implication: Within-collective competition can undermine group-level
    adaptations.
  testable_measurement: Between/within-group selection, life-cycle fidelity.
physical_scalings: 'Baseline checks: for a sphere, surface-to-volume ratio A/V = 3/R;
  characteristic diffusion time scales as L^2/D. These constrain but do not uniquely
  predict colony dimensions — shape, metabolism, convection and active transport alter
  outcomes.'
candidate_composites:
- id: A
  title: Adhesion-only formation
  stack: agent/particle mechanics (cells + bonds)
  tests: whether clonal incomplete separation + reversible adhesion alone yield persistent
    groups and heritable cluster traits (null baseline for the ecological comparison).
- id: B
  title: Adhesion + predation/settling ecology
  stack: model A + size-dependent predation/settling + population dynamics
  tests: whether ecological selection rewards group formation without added physiology
    (H1).
- id: C
  title: Model B + oxygen-limited growth
  stack: model B + reaction-diffusion transport (O2/nutrient/waste) coupled to growth
  tests: whether transport limits reshape size/viability and interact with ecological
    selection (C3).
candidate_software:
- layer: Cell growth/division
  software:
  - custom agent process
  - PhysiCell
  role: nutrients/state -> biomass, births, lineage edges
- layer: Mechanics/adhesion
  software:
  - Spatio-Flux/Pymunk
  - viva-cpm
  - vivarium-tyssue
  role: geometry/bonds/division -> positions, contact graph, breakage
- layer: Transport fields
  software:
  - Spatio-Flux PDE
  - Morpheus
  - CompuCell3D
  role: cell uptake/secretion -> spatial concentration fields
- layer: Metabolism
  software:
  - COBRApy/dFBA
  - COMETS
  role: nutrient boundary conditions -> growth/yields/exchange
- layer: Cell-state regulation
  software:
  - COPASI
  - Tellurium
  - Boolean/ODE modules
  role: signals/metabolites -> phenotype state transitions
- layer: Evolution/life cycle
  software:
  - custom population-genetic process
  role: heritable traits, propagules, outcomes -> next generation
- layer: Composition
  software:
  - Vivarium / Process Bigraph
  role: typed shared stores, scheduler, provenance, recording
model_families:
- agent-based
- particle mechanics
- Cellular Potts
- vertex
- reaction-diffusion
- dFBA
- regulatory
- evolutionary population
regimes:
- unicellular
- transient aggregate
- persistent clonal collective
- physiologically integrated collective
- reproducing multicellular individual
final_deliverable: 'A validated minimal cell-collective simulator and a claim-evidence
  graph: an evidence-linked narrative of the origins of multicellularity, a reusable
  suite of interoperable cell/collective model blueprints with backend comparisons,
  a phase atlas of viable/unstable/selectively-advantageous regimes, quantitative
  boundaries separating physical aggregation from physiological integration and evolutionary
  individuality, and a prioritized queue of decisive simulations and testable predictions.'
flagship_studies:
- framing: Does ecological selection plus simple clonal adhesion suffice to reproduce
    group formation, fragmentation, and group-level fitness advantages?
  studies:
  - s01-formation
  - s02-ecological-selection
  composite: B
  why: First-cycle priority. Compare three mechanistic models head to head — (A) adhesion
    only, (B) adhesion + predation/settling ecology, (C) model B + oxygen-limited
    growth — hold out at least one ecological or metabolic regime for prediction,
    and use sensitivity analysis and replicate stochastic seeds.
