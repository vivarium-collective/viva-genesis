hypotheses:
- id: H1
  statement: 'Ecology-first: size-dependent survival or settling favors initial groups.'
  prediction: Under selected ecological regimes, simple adhesive collectives outperform
    unicells without metabolic exchange.
  competing_with:
  - H2
  - H3
  - H4
  - H5
- id: H2
  statement: 'Metabolism-first: cooperation and resource partitioning promote integration.'
  prediction: Metabolically complementary groups gain fitness even when size protection
    is controlled.
  competing_with:
  - H1
  - H3
  - H4
  - H5
- id: H3
  statement: 'Plasticity-first: local gradients induce divergent cell states.'
  prediction: Spatial fate patterns arise before evolved cell-fate circuitry; regulatory
    fixation increases stability.
  competing_with:
  - H1
  - H2
  - H4
  - H5
- id: H4
  statement: 'Alignment-first: clonality and group reproduction enable stable collectives.'
  prediction: Clonal bottlenecked populations maintain group adaptations more effectively
    than genetically mixed groups.
  competing_with:
  - H1
  - H2
  - H3
  - H5
- id: H5
  statement: 'Coupled constraints: no single mechanism is generally sufficient.'
  prediction: Different combinations create distinct viable regimes, with interactions
    exceeding additive effects.
  competing_with:
  - H1
  - H2
  - H3
  - H4
