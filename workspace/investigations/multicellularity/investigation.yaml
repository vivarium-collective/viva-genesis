promotion_rules: A model is promoted only after reproducing baseline experimental
  trends, satisfying conservation/unit checks, and predicting at least one held-out
  observation or cross-condition perturbation. Failed models remain linked to their
  falsifying evidence. Where multiple models fit equally well, report non-identifiability
  and select a discriminating intervention rather than announcing discovery.
