scientific_argument:
  main_claim: A major transition to multicellularity requires a sequence of separately
    measurable properties (formation, coordination, group reproduction, heritable
    group traits, collective adaptation) that can evolve in different orders; simulation
    under shared canonical states can bound which constraint combinations are sufficient
    versus necessary.
  evidence_for:
  - C1 Predation can favor groups (R4, experimental).
  - C3 Diffusion limits size (R3, R5 — physical premise + evidence).
  - C4 Mechanics permits macroscopic clusters (R5, direct yeast evidence).
  - C6 Life cycles sustain group selection (R2, R6 — theory + yeast data).
  evidence_against:
  - C5 Gradients-initiate-specialization is a mechanistic hypothesis without a demonstrated
    non-regulated null.
  - C7 Complexity-requires-integration rests on broad comparative inference and must
    avoid asserting a universal necessary pathway.
  key_figures: []
  caveats:
  - Reproducing multicellular phenotypes does not by itself establish the actual prehistoric
    sequence of evolutionary events. The program explicitly preserves the distinctions
    among possibility, sufficiency, necessity, and historical inference. S05 uses
    volvocine/cyanobacterial differentiation as qualitative comparison unless directly
    usable datasets are ingested; S06 does not imply historical reconstruction from
    present-day experiments.
seed_acceptance_checklist:
- each claim has an evidence status
- every study has at least one falsifiable prediction and a baseline/null
- resource URLs resolve
- physical units and model interfaces are explicit
- no conclusion is declared established merely from simulation fit
- competing hypotheses remain visible
- outputs, failures and provenance can be stored in the investigation graph
