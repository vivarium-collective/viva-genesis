schema_version: 4
name: og-ev-timevarying-forcing
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: exploratory
proposed: true
title: Time-varying geochemical forcing (P1)
program: evidence-expansion
honest_caveat: >-
  A challenge study: it tests whether network persistence SURVIVES fluctuating vent conditions
  instead of fixed-favorable ones. A washout under realistic fluctuation is a meaningful
  negative, not tuned away.
question: >-
  Do the carbon-fixing network and the protocell persist under FLUCTUATING pH / feed / flow /
  temperature / mineral activity, rather than only under fixed-favorable conditions?
hypothesis: >-
  Persistence degrades gracefully under modest fluctuation (bounded recovery times) but fails
  past a fluctuation amplitude / frequency threshold - the robustness the pore, membrane and
  energy carrier buy is spent against environmental variability, so this is the robustness-is-
  the-traded-axis through-line tested directly against time-varying forcing.
objective: >-
  Drive the A1 (and compartmented) network with time-varying forcing trajectories (steps, ramps,
  oscillations, stochastic) over the vent-realistic ranges and measure persistence, recovery and
  budgets vs the fixed-favorable baseline.
primary_output: >-
  Persistence under perturbation, recovery times, and energy / carbon budgets across the
  forcing trajectories; the fluctuation threshold beyond which persistence fails.
refines: "extends og-27-coupled-geochemical-reaction-interface, og-30, and the og-08 autonomy budget (ties to the robustness through-line)"
baseline:
- name: Fixed-favorable forcing (the campaign's standard held conditions)
  planned: true
  params: {forcing: fixed_favorable}
- name: Time-varying forcing (steps / ramps / oscillations / stochastic over vent-realistic ranges)
  planned: true
  params: {forcing: time_varying}
proposed_acceptance_criteria:
- Forcing trajectories span vent-realistic ranges at matched mean input fluxes vs the fixed baseline (equal-feed).
- Persistence, recovery time and energy/carbon budgets are reported across the trajectories, with the fluctuation threshold identified.
- Whether persistence holds under fluctuation is reported either way (a washout threshold is an accepted result).
literature_anchors: [kelley2005serpentinite, fruhgreen2003thirtythousand, tutolo2026rethinking]
visualizations: []
