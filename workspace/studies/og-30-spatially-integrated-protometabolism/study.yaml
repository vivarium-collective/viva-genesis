schema_version: 4
name: og-30-spatially-integrated-protometabolism
investigation: origins-of-life-vent
created: '2026-10-17'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Spatially Integrated Protometabolism
question: Can the full chemical network operate in a pore despite fractionation and washout?
hypothesis: In a pore with reactive multispecies transport, thermophoresis, adsorption and surfaces,
  the vetted protometabolic network sustains productive flux above matched well-mixed and nonconcentrating
  controls — concentration and co-localization winning out over fractionation and washout — where continuum
  concentrations fail, discrete stochastic chemistry carries the low-count species.
objective: Run the full network under FiPy reactive multispecies transport with thermophoresis, adsorption
  and surfaces (discrete stochastic chemistry where molecule counts demand it) and compare productive
  flux against matched well-mixed and nonconcentrating controls.
# Verbatim plan dependencies (handoff contracts wired by genesis-writer after scaffolding).
# 11 and 21 have no scaffolded slug yet; recorded here only.
builds_on: [3, 11, 21, 27, 29]
proposed_mechanisms:
- thermophoretic / adsorptive concentration and co-localization in the pore
- continuum-to-stochastic handoff where expected molecule counts make continuum concentrations unreliable
proposed_models_methods:
- FiPy reactive multispecies transport
- thermophoresis, adsorption, surfaces
- discrete stochastic chemistry where needed
- matched well-mixed + nonconcentrating controls
# Tools this study draws on, at their TRUE build status (see workspace/references/build-registry.yaml).
tools:
- {id: viva-fipy, build_status: in-workspace, role: finite-volume multispecies reactive transport}
- {id: viva-phreeqc, build_status: wrapper-needed, role: cell-resolved aqueous speciation}
- {id: viva-kinetics, build_status: in-workspace, role: reaction-network kinetics}
- {id: multispecies-reactive-transport, build_status: to-build, role: thermophoresis + cross-solver comparison}
- {id: mineral-surface-dynamics, build_status: to-build, role: adsorption / surface accessibility}
contract:
  face:
    inputs:
      temperature_gradient:
        _type: float
        _units: kelvin/meter
      flow_velocity:
        _type: float
        _units: meter/second
    outputs:
      productive_flux:
        _type: float
        _units: mol/second
      co_localization:
        _type: float
        _units: dimensionless
      residence_time:
        _type: float
        _units: second
  conditions:
  - kind: invariant
    name: species_mass_balance
    expr: per-species mass balance holds across transport + reaction + adsorption
  - kind: invariant
    name: controls_matched
    expr: well-mixed and nonconcentrating controls share feed, network and total material
  note: Outputs the plan calls for — co-localization, spatial reaction flux, residence, persistence —
    are the typed outputs plus spatially resolved readouts; discrete stochastic chemistry replaces continuum
    where counts are low.
behavior_tests:
- name: productive-flux-beats-mixed-and-nonconcentrating-controls
  classification: primary
  description: 'Decision test — productive flux exceeds matched well-mixed and nonconcentrating controls:
    the pore''s spatial concentration and co-localization produce more productive reaction flux than
    both a well-mixed control and a nonconcentrating control on the same feed and network.'
  measure:
    kind: observable
    detail: productive reaction flux in the pore vs. matched well-mixed and nonconcentrating controls
  pass_if:
    op: threshold
    detail: pore productive flux > both matched controls
  requires_simulation: 'yes'
literature_anchors: []
baseline:
- name: Spatially Integrated Protometabolism
  composite: viva_genesis.composites.og_30_spatially_integrated_protometabolism
  params: {}
  planned: true
parent_studies:
- {study: og-03-dilution-to-localized-individuals, condition: tests-passed}
- {study: og-27-coupled-geochemical-reaction-interface, condition: tests-passed}
- {study: og-29-endogenous-autocatalysis, condition: tests-passed}
key_assumptions:
- Two adverse controls are required — a well-mixed control and a nonconcentrating control — both matched
  on feed, network and total material.
- Where molecule counts are low, continuum concentrations are unreliable and discrete stochastic chemistry
  is used instead.
parent_relations:
- {study: og-03-dilution-to-localized-individuals, relation: builds-on}
- {study: og-27-coupled-geochemical-reaction-interface, relation: builds-on}
- {study: og-29-endogenous-autocatalysis, relation: builds-on}
expert_questions:
- What count threshold should trigger the continuum-to-stochastic handoff, and which species most need
  it?
