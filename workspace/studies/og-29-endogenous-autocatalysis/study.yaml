gate_status: failed
gate_reason: >-
  Gate A keystone, C6 universe: formose-type autocatalysis (linear C≤6) refuted with mechanism — the
  canonical doubling step r409 (2 glycolaldehyde ⇌ threose) is condensation-favored (ΔG° = −16.4 kJ/mol),
  so the autocatalytic splitting direction carries no net flux across the x1–x50 feed sweep (motifs = 0,
  gain = 0 everywhere, including x20 where the network is connected and fixing carbon). Branched C6 rTCA
  is under active test (branched-skeleton v2 build). Carbon fixation at C6 is network persistence (A1),
  not self-amplification (A2).
confidence: Investigating
verdict: honest-negative
evidence_tier: mechanistic_prediction
title: Endogenous Autocatalysis
claim: >-
  Vent-fed chemistry, assembled from the study-28 atlas reactions under the study-27 interface feeds,
  either forms a genuinely balanced, mass-conserving autocatalytic cycle whose amplification beats a
  matched null with equal chemical input fluxes — or it does not, in which case the study names the
  specific missing precursor or rate-limiting mechanism. Spontaneous network amplification is a claim
  won against a null, never inferred from apparent growth.
question: >-
  Can vent-fed chemistry spontaneously form network amplification or self-maintaining cycles — genuine,
  balanced autocatalysis rather than accumulation driven by the input feed?
hypothesis: >-
  Given the 27 interface feeds and the 28 reaction set, stoichiometric autocatalysis detection plus
  kinetic simulation under dilution will reveal whether a self-amplifying cycle exists; if it does, its
  amplification and net carbon fixation exceed a matched null (identical input fluxes, autocatalytic
  topology removed) and persist above a critical dilution rate; if it does not, the analysis isolates
  the missing precursor or rate-limiting step.
objective: >-
  Assemble vent-fed reaction networks from the 27 and 28 handoff bundles, detect stoichiometric
  autocatalysis, simulate kinetics with dilution, and test any detected amplification against a matched
  null — reporting either genuine autocatalysis with its critical dilution, or a clean negative that
  names the gap.
# Verbatim plan dependencies (handoff contracts wired by genesis-writer after scaffolding).
# 16 has no scaffolded slug yet; recorded numeric-only — parent_studies holds the resolvable deps.
builds_on: [2, 16, 27, 28]
