      result: FAIL
      detail: >-
        No stoichiometric autocatalytic motif detected at any feed, including the ignited x20 point
        (n_autocatalytic_motifs=0 throughout). The linear C<=6 formose network fixes carbon but contains
        no self-amplifying cycle.
    negative-result-isolates-gap:
      result: PASS
      detail: >-
        Gap isolated and characterized: the linear formose universe (C<=6) has no autocatalytic motif
        even with an active network; the branched C6 rTCA cycle (citrate/isocitrate) is outside the v1
        linear-skeleton representation and is the named v2 follow-up.
limitations:
- >-
  Autocatalysis discriminator result (C6): formose-type (linear C≤6) refuted, with mechanism. The
  canonical formose doubling step is present in the universe (r409: 2 glycolaldehyde [X_DH] ⇌ threose
  [X_DOOH], a coefficient-2 splitting), so this is not detector blindness or an absent motif. Its ΔG° is
  −16.4 kJ/mol toward condensation, so under vent feeds net flux runs the building direction (2 C2 → C4)
  while the autocatalytic splitting direction (C4 → 2 C2) is +16.4 kJ/mol uphill and carries no net flux
  across the x1–x50 feed sweep — motifs = 0 and gain = 0 everywhere, including x20 where the network is
  connected and fixing carbon. Formose-type does not self-amplify because the doubling step runs the
  wrong way at vent conditions. Branched C6 rTCA (citrate/isocitrate) is outside the v1 linear-skeleton
  representation and is under active test via the branched-skeleton v2 build. Functional cross-check
  (coefficient-free discriminator, now run): formose is refuted functionally as well — carbon is fixed,
  but production is seed-independent (feed-driven), not self-amplified — confirming the thermodynamic
  negative by a second, coefficient-independent method.
- >-
  Persistence is QUALIFIED by feed plausibility. The network ignites only at x20 (supply_H2 20 mM,
  supply_CO2 40 mM); at the vent-posterior operating point (x1) and x5 it does not ignite, and x50
  washes out - a narrow window well ABOVE defensible vent feeds. Lost City dissolved H2 is ~1-15
  mmol/kg (posterior example 10.8), so x20's 20 mM is ~1.3x over the H2 window; the DIC posterior
  is ~1.2-2.9 mM (example 1.4), so x20's 40 mM CO2 is ~14x over the DIC upper bound. So the
  carbon-fixing network emerges only above vent-realistic concentrations; at defensible vent feeds
  it does not ignite. (The autocatalysis refutation is unaffected - at the ignition point there is
  still 0 gain.) Cross-link to og-30: that ~x50 "washout" is the brittle network_connected proxy
  degrading at high feed - raw carbon flux stays high, the connectivity metric drops - not a loss of
  flux, the same behavior og-30 documents across C4/C6 and well-mixed vs pore. The refutation stands on
  thermodynamics and the coefficient-free seed-independence discriminator, not connectivity.
- >-
  The autocatalytic gain is 0 for both the vent-fed network and its matched null across the x1–x50 feed
  sweep, and with the C6 universe built this is a genuine, mechanistically-explained result — not a
  truncation artifact. The canonical doubling step (r409) is representable and present; it simply runs
  toward condensation (ΔG° −16.4 kJ/mol) at vent conditions, so the splitting direction that would drive
  self-amplification carries no net flux. The one case still outside scope is the reductive TCA cycle,
  whose branched C6 species the v1 linear skeleton cannot hold — the branched-skeleton v2 is being built
  now to test it. A coefficient-independent functional discriminator (seed-dependence + super-linear
  production) has now run, judging formose and rTCA on the same footing: formose is seed-independent
  (refuted), and rTCA is topology-specific under a permissive counterfactual but washes out under vent H2
  (refuted). So the negative is mechanistic for formose-type and an open, actively-building test for
  branched rTCA — not a claim that vent-fed chemistry cannot self-amplify by any route.
