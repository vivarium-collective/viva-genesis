schema_version: 4
name: og-29-endogenous-autocatalysis
investigation: origins-of-life-vent
created: '2026-10-17'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Endogenous Autocatalysis
claim: >-
  Vent-fed chemistry, assembled from the study-28 atlas reactions under the study-27 interface feeds,
  either forms a genuinely balanced, mass-conserving autocatalytic cycle whose amplification beats a
  matched null with equal chemical input fluxes — or it does not, in which case the study names the
  specific missing precursor or rate-limiting mechanism. Spontaneous network amplification is a claim
  won against a null, never inferred from apparent growth.
question: >-
  Can vent-fed chemistry spontaneously form network amplification or self-maintaining cycles — genuine,
  balanced autocatalysis rather than accumulation driven by the input feed?
hypothesis: >-
  Given the 27 interface feeds and the 28 reaction set, stoichiometric autocatalysis detection plus
  kinetic simulation under dilution will reveal whether a self-amplifying cycle exists; if it does, its
  amplification and net carbon fixation exceed a matched null (identical input fluxes, autocatalytic
  topology removed) and persist above a critical dilution rate; if it does not, the analysis isolates
  the missing precursor or rate-limiting step.
objective: >-
  Assemble vent-fed reaction networks from the 27 and 28 handoff bundles, detect stoichiometric
  autocatalysis, simulate kinetics with dilution, and test any detected amplification against a matched
  null — reporting either genuine autocatalysis with its critical dilution, or a clean negative that
  names the gap.
# Verbatim plan dependencies (handoff contracts wired by genesis-writer after scaffolding).
# 16 has no scaffolded slug yet; recorded numeric-only — parent_studies holds the resolvable deps.
builds_on: [2, 16, 27, 28]
proposed_mechanisms:
- network amplification / self-maintaining cycles seeded from atlas reactions
- stoichiometric autocatalysis (a subnetwork that produces its own catalyst/seed)
- dilution as the selective pressure separating true autocatalysis from feed-driven accumulation
proposed_models_methods:
- 'RDKit rule-generated reaction candidates + curated atlas alternatives [to-build: reaction-rule-generation / viva_reaction_atlas]'
- stoichiometric autocatalysis detection on the reaction network (algebraic, pre-kinetic)
- 'COPASI/libRoadRunner kinetic simulation with dilution                 [in-workspace: viva_genesis.protometabolism]'
- discrete/stochastic kinetics where expected molecule counts make continuum concentrations unreliable (evidence standard #7)
- 'eQuilibrator ΔG screen so any detected cycle is thermodynamically allowed [exists: viva_equilibrator]'
- 'matched-null construction + PyMC/SALib sensitivity & identifiability   [partial: viva_genesis.uq]'
model_approach:
  prose: >-
    Study 29 is the chemical-emergence test. It assumes no amplification; it consumes the 27 feeds and
    28 reactions as given typed bundles, detects candidate autocatalytic cycles stoichiometrically
    (before any kinetics), then simulates them under dilution. The decisive control is the matched null —
    the same chemical input fluxes with the autocatalytic coupling removed — and only amplification that
    beats that null counts as autocatalysis. Low-count intermediates are simulated with discrete kinetics
    so a handful of molecules is never mistaken for a continuum concentration.
# Tools at their TRUE build status (workspace/references/build-registry.yaml); not upgraded.
tools:
- {id: viva-equilibrator, build_status: exists, role: feasibility deltaG screen on candidate cycles}
- {id: viva-kinetics, build_status: in-workspace, role: SBML/libRoadRunner kinetic simulation (tellurium engine-reuse)}
- {id: reaction-rule-generation, build_status: to-build, role: RDKit rule generation of candidate networks}
- {id: bayesian-calibration-sensitivity, build_status: partial, role: matched-null + PyMC/SALib sensitivity & identifiability}
contract:
  face:
    inputs:
      feed_rate:
        _type: float
        _units: molar/second
        _min: 0.0
      dilution_rate:
        _type: float
        _units: 1/second
        _min: 0.0
    outputs:
      autocatalytic_gain:
        _type: float
        _units: dimensionless
      net_carbon_fixation:
        _type: float
        _units: mol/second
      critical_dilution:
        _type: float
        _units: 1/second
  conditions:
  - kind: invariant
    name: balanced_autocatalysis
    expr: any detected autocatalytic cycle is mass- and charge-balanced (no phantom source)
  - kind: invariant
    name: null_controls_fail
    expr: matched non-autocatalytic nulls show no amplification above washout
  note: Consumes both handoff bundles — 27→29 (feeds) and 28→29 (reaction set). Part of Gate A (chemical
    emergence = 27+28+29).
behavior_tests:
- name: receives-27-handoff-bundle
  classification: secondary
  description: Study 29 receives the full 27→29 bundle — H2 + inorganic-carbon flux, pH, T, ionic
    activities, catalyst state and time-dependent feeds — as typed inputs, verified complete before any
    network is assembled.
  measure:
    kind: observable
    detail: completeness + typing of the 27→29 bundle checked against 27's emitted bundle
  pass_if:
    op: threshold
    detail: bundle received complete and typed
  requires_simulation: 'yes'
- name: receives-28-handoff-bundle
  classification: secondary
  description: Study 29 receives the full 28→29 bundle — canonical species, balanced stoichiometry, rate
    forms, parameter bounds and confidence tags — as the reaction set, verified complete.
  measure:
    kind: observable
    detail: completeness + typing of the 28→29 bundle checked against 28's emitted bundle
  pass_if:
    op: threshold
    detail: bundle received complete and typed
  requires_simulation: 'yes'
- name: stoichiometric-autocatalysis-detection
  classification: primary
  description: Stoichiometric detection plus kinetic simulation either exhibit a balanced, mass-conserving
    autocatalytic cycle with measurable amplification and net carbon fixation, or they do not.
  measure:
    kind: observable
    detail: detected autocatalytic cycle; amplification factor + net carbon fixation when positive
  pass_if:
    op: threshold
    detail: balanced autocatalysis detected, OR a clean no-detection result
  requires_simulation: 'yes'
- name: autocatalysis-beats-matched-null
  classification: primary
  description: Any detected amplification must exceed a matched null (identical chemical input fluxes,
    autocatalytic topology removed); amplification not separable from the null is reported as feed-driven
    accumulation, not autocatalysis. This is the Gate A null arm.
  measure:
    kind: observable
    detail: amplification in the autocatalytic network vs. matched null with equal input fluxes
  pass_if:
    op: threshold
    detail: amplification margin over the matched null (else reported as feed-driven accumulation)
  requires_simulation: 'yes'
- name: critical-dilution-threshold
  classification: secondary
  description: The study reports the critical dilution rate above which any self-maintaining cycle
    collapses — its robustness envelope, not a single operating point.
  measure:
    kind: observable
    detail: autocatalytic gain vs. dilution rate; critical dilution at collapse
  pass_if:
    op: threshold
    detail: critical dilution rate reported (robustness envelope characterised)
  requires_simulation: 'yes'
- name: carbon-conservation-ledger
  classification: secondary
  description: Carbon, mass and charge close across the kinetic run with the 27 feeds as the only
    carbon/energy source; no untracked input.
  measure:
    kind: observable
    detail: C/mass/charge residuals across the kinetic run
  pass_if:
    op: threshold
    detail: residuals within tolerance; 27 feeds the only source
  requires_simulation: 'yes'
- name: negative-result-isolates-gap
  classification: primary
  description: If no genuine autocatalysis is found, the study isolates and names the missing precursor or
    rate-limiting mechanism — a clean negative is an accepted result that scopes downstream work.
  measure:
    kind: observable
    detail: on no-detection, the identified missing precursor / rate-limiting mechanism
  pass_if:
    op: threshold
    detail: balanced autocatalysis demonstrated OR a named missing precursor/mechanism
  requires_simulation: 'yes'
gate_A: >-
  Gate A (chemical emergence) = studies 27 + 28 + 29 passing together. Its acceptance REQUIRES that
  29's detected autocatalysis beats the matched null with chemical input fluxes held equal; without the
  null-beating margin, Gate A does not pass regardless of raw amplification.
decision_test: >-
  Detect genuine balanced autocatalysis — a mass-conserving cycle whose amplification and net carbon
  fixation beat a matched null with equal input fluxes and persist above a critical dilution — OR
  identify the specific missing precursor/mechanism. A clean negative is a result; apparent growth that
  does not separate from the matched null is NOT autocatalysis and is reported as such (evidence
  standard #5, #8).
