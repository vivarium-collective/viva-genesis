- name: gate-a-c6-ignition-sweep
  status: completed
  params: {max_carbons: 6, feed_sweep: x1/x5/x20/x50, steps: 350}
  outcomes:
    autocatalysis-beats-matched-null:
      result: FAIL
      measured_value: 0.0
      detail: >-
        At max_carbons=6 the favorable network ignites at x20 feed (network_connected=1, net_carbon_flux
