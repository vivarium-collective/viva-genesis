  evidence: {from_test: autocatalysis-beats-matched-null}   # internal matched-null comparison → run_ids (correct-uncitable)
- id: og29-critical-dilution
  kind: computational
  status: planned
  statement: The study reports the critical dilution rate above which any self-maintaining cycle
    collapses — its robustness envelope, not a single operating point.
  evidence: {from_test: critical-dilution-threshold}   # internal → run_ids (correct-uncitable)
- id: og29-carbon-conservation-ledger
  kind: computational
  status: planned
  statement: Carbon, mass and charge close across the kinetic run with the 27 feeds as the only
    carbon/energy source; no untracked input.
  evidence: {from_test: carbon-conservation-ledger}   # internal-threshold invariant → run_ids (correct-uncitable)
- id: og29-clean-negative-names-gap
  kind: methodological
  status: planned
  statement: If no genuine autocatalysis is found, the study isolates and names the missing precursor or
