  statement: Study 29 receives the full 28→29 bundle — canonical species, balanced stoichiometry, rate
    forms, parameter bounds and confidence tags — as the reaction set, verified complete.
  evidence: {from_test: receives-28-handoff-bundle}   # handoff verifiable against 28's emitted bundle
- id: og29-autocatalysis-detected-or-not
  kind: computational
  status: planned
  statement: Stoichiometric detection plus kinetic simulation either exhibit a balanced, mass-conserving
    autocatalytic cycle with measurable amplification and net carbon fixation, or they do not; the
    finding reports which, with the amplification factor and net fixation when positive.
  evidence: {from_test: stoichiometric-autocatalysis-detection}
  expected: {cites: [muchowska2019synthesis, preiner2020hydrogen]}
- id: og29-beats-matched-null
