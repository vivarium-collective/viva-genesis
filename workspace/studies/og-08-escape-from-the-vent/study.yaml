schema_version: 4
name: og-08-escape-from-the-vent
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Escape from the vent (Campaign VIII)
question: What is the minimum set of innovations required for autonomous persistence away from the geological
  reactor, as environmental support is relaxed?
hypothesis: A bounded innovation set (internal energy conversion + resource import + heredity) allows
  persistence as gradient strength/mineral access/feed are reduced; below it, systems stay obligately
  vent-tied.
objective: Relax environmental support via ablation sweeps and identify the minimum innovation set for
  autonomy.
proposed_mechanisms:
- all modules integrated
- autonomy readout
proposed_models_methods:
- multi-agent composites with relaxed boundaries
- ablation sweeps over gradient/mineral/feed
- population genetics
contract:
  face:
    inputs:
      H2:
        _type: float
        _units: molar
        _min: 0.0
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
    outputs:
      lineage_fitness:
        _type: float
        _units: dimensionless
      free_energy_flux:
        _type: float
        _units: watt
  conditions:
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built
    for this study must declare a ProcessContract matching this face (audited via the workbench §Contract
    panel).
behavior_tests:
- name: survival-off-gradient
  classification: primary
  description: At least one lineage persists as the external gradient goes to zero.
  measure:
    kind: observable
    detail: survival as external gradient -> 0
  pass_if:
    op: threshold
    detail: '>=1 lineage persists'
  requires_simulation: 'yes'
- name: minimum-innovation-set
  classification: primary
  description: The smallest ablation-robust innovation set is identified.
  measure:
    kind: observable
    detail: ablation sweep over innovations
  pass_if:
    op: threshold
    detail: minimum robust set identified
  requires_simulation: 'yes'
literature_anchors: []
baseline:
- name: Escape from the vent (Campaign VIII)
  composite: viva_genesis.composites.og_08_escape_from_the_vent
  params: {}
  planned: true
parent_studies:
- study: og-07-ecology-before-luca
  condition: tests-passed
key_assumptions:
- Autonomy is reduced dependence on the exact vent interface, measured by ablation — not a binary.
parent_relations:
- study: og-07-ecology-before-luca
  relation: leads-to
expert_questions:
- Define 'autonomy' as survival off-gradient, or as a quantitative reduced-dependence threshold?
