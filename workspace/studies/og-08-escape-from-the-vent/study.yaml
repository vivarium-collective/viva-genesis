conclusion: A deterministic co-limited free-energy + resource budget shows that persistence
  away from the geological reactor requires three innovations at once — a pump to
  make free energy without the external gradient, an importer to acquire resources
  without ambient abundance, and heredity to hold that machinery against decay. The
  full set persists to support 0 (autonomous); each single knockout is lifted off
  the gradient and collapses. Co-limitation is what makes the set irreducible — a
  half-equipped lineage pays upkeep without a co-benefit. Closes the campaign's arc
  from vent chemistry (og-00) to a free-living lineage.
