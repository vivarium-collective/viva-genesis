findings:
- id: s-spatial-contact-confers-exchange
  statement: "Realised metabolite exchange is strongly proximity-dependent in the\
    \ screened diffusion regime: a contact partner receives 49x the exchange of a\
    \ distal one (1.70 vs 0.034 at screening length lambda~2.2), rising to ~1900x\
    \ under strong screening. The advantage collapses to ~3x only when the metabolite\
    \ is effectively well-mixed (lambda>>distance). So M1's lumped premise \u2014\
    \ contact scales exchange access \u2014 is MECHANISTICALLY justified wherever\
    \ the metabolite decays on the inter-partner length scale, not an imposed assumption."
  status: confirms
  evidence:
    observed: 1.701
    from_test: study-spatial-exchange-proximity-discriminates
    from_run: proto_endosymbiosis_spatial contact (d=1) vs distal (d=10) baseline,
      seed 1
  inferential_scope: Reduced 1-D screened reaction-diffusion field at steady state
    (producer source, decay, consumer uptake), reflecting boundaries. Establishes
    the proximity-benefit relationship and its screening regime; not a 3-D geometry,
    advection, or multi-metabolite stoichiometry.
verdict: supported
confidence: provisional
verdict_rationale: 'Spatial-exchange campaign: realised_exchange_level 1.70 at contact
  vs 0.034 distal (49x). Confirms M1''s contact-scales-access premise in the screened
  regime; flags well-mixed regime as the boundary where it fails.'
