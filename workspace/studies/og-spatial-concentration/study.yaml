design_status: approved
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
verdict: supported
primary_limitation: "The pore clears the Baaske accumulation regime but the chemically-necessary eight-solute set fractionates (Soret-driven, co-localization index ~0.18) rather than co-localizing - a candidate downstream bottleneck."
key_assumptions:
- "Concentration is a serpentinite pore (Soret + convection) vs an open-pore washout control"
- "The Baaske-2007 extreme-accumulation regime is the benchmark"
- "Localization is resolved as a bounded porosity x pore-length region"
evidence_tier: mechanistic_prediction
program: consolidated
title: 'Spatial Concentration: Does a Pore Enrich a Dilute Feed?'
concept: >-
  Multisolute physical enrichment: whether a serpentinite pore concentrates a dilute vent feed above the dilution/retention
  threshold by thermophoresis, adsorption and advection — and whether the chemically-necessary multi-solute set
  co-localizes or FRACTIONATES. Transport physics, kept distinct from whether that enrichment ignites the reaction
  network (og-network-rescue, 4B).
gate_reason: >-
  Multisolute-enrichment half of the former og-spatial-concentration (split from the network-rescue half, og-network-rescue).
  Canonical arm og-03: long tight pores cross the concentration/retention threshold (Baaske regime cleared, accumulation
  Peclet 18.4) while open pores wash through; the eight-solute set fractionates (Soret-driven) rather than co-localizing.
  Supported: a pore enriches a dilute feed, within bounds. Whether that enrichment ignites the network is og-network-rescue.
claim: >-
  A serpentinite pore concentrates a dilute vent feed above the dilution/retention threshold (Baaske regime cleared,
  accumulation Peclet 18.4) while an open-pore control washes through; but the chemically-necessary eight-solute
  set fractionates (Soret-driven, co-localization index ~0.18) rather than co-localizing — a candidate spatial
  incompatibility. Supported, bounded.
question: >-
  Does a serpentinite pore concentrate a dilute vent feed above the dilution/retention threshold, and does the
  chemically-necessary multi-solute set co-localize or fractionate?
hypothesis: >-
  Thermophoretic/adsorptive enrichment in a long tight pore crosses the Baaske concentration threshold against
  washout, though strongly- and weakly-thermophoretic solutes separate rather than concentrating together.
experiment: >-
  Resolve diffusion, thermophoresis, adsorption and advection for every reactant in a bounded serpentinite pore
  vs an open-pore control (og-03), and map multi-solute co-localization across the Soret contrast.
result: >-
  The pore crosses the concentration/retention threshold (Baaske cleared, Peclet 18.4) where an open pore does
  not; the eight-solute mixture fractionates (coloc index ~0.18 strong-Soret), so concentrating one tracer is
  not concentrating the set a protocell needs together.
