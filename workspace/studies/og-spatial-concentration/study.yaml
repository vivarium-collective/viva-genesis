behavior_tests:
- name: thermophoretic-enrichment-reproduces-baaske
  classification: primary
  description: >-
    The thermophoretic trap concentrates the dilute feed. The reduced accumulation column reaches the Baaske-2007
    extreme figure (~10^8-fold, Pe_acc ≈ 18.4) in the favorable pore, but that sits ABOVE the demonstrated solver-convergence
    range: the resolved dolfinx FEM saturates (~10^2-fold) past Pe_acc ≈ 13 (spatial-transport-solver-comparison),
    so the >10^6 figure is a flow-through reduced-column exp(Pe) extrapolation / closed-cell figure, not a resolved
    result. Per "no acceptance gate outside demonstrated convergence" the magnitude is REPORTED here, not gated
    as a pass; localization within the resolvable range (Pe_acc ≲ 13) is the gated claim (see enrichment-resolved-within-convergence).
  measure:
    kind: derived
    path: settled_accumulation_peclet
    detail: ln(enrichment) = beta × pore length (reduced column)
  pass_if:
    op: arms_reported
    detail: >-
      reduced-column Pe_acc ≈ 18.4 (~10^8-fold) reported as the closed-cell/reduced-model figure; the resolved
      FEM does not confirm it past the convergence-verified Pe_acc ≈ 13
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
  - mast2010thermal
  gate_class: acceptance_criterion
- name: enrichment-resolved-within-convergence
  classification: diagnostic
  description: >-
    Within the FEM-trustworthy / convergence-verified Péclet range (Pe_acc ≲ 13, spatial-transport-solver-comparison),
    the resolved thermophoretic field DOES concentrate the feed above its inflow — a bounded individual forms.
    This is the honest, solver-agnostic localization claim (both FiPy and dolfinx agree in this range); the far
    larger reduced-column figure above Pe_acc ≈ 13 is reported separately (thermophoretic-enrichment-reproduces-baaske),
    not gated.
  measure:
    kind: derived
    path: log10_enrichment
    detail: localization occurs within the resolvable range (positive enrichment
    agreement region): null
  pass_if:
    op: '>'
    value: 0.0
    detail: log10_enrichment > 0 (the resolved trap concentrates above inflow within Pe_acc ≲ 13)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
  - mast2010thermal
  gate_class: acceptance_criterion
  band_basis: solver_convergence
- name: retention-beats-destruction
  classification: primary
  description: >-
    A net-accumulation region exists where the trap concentrates enough that synthesis outruns hydrolysis/leakage.
    The ≥10^6-fold figure is the reduced-model (closed-cell) extrapolation; the gated claim is the resolved net-accumulation
    within the convergence-verified Péclet range (Pe_acc ≲ 13, spatial-transport-solver-comparison), so the magnitude
    is REPORTED, not gated on the un-converged ≥10^6 value.
  measure:
    kind: derived
    path: log10_enrichment
    detail: log10 of the settled enrichment fold (reduced column; resolved value within Pe_acc ≲ 13)
  pass_if:
    op: arms_reported
    detail: >-
      reduced-column ≥10^6-fold reported as the closed-cell figure; net accumulation within demonstrated convergence
      is the gated claim (enrichment-resolved-within-convergence)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
  gate_class: acceptance_criterion
  band_basis: solver_convergence
- name: open-pore-control-does-not-concentrate
  classification: primary
  description: >-
    An open pore (porosity → 1) lets the dilute feed wash through — no individual forms (enrichment ~1). The washout-wins
    region mapped by the control.
  measure:
    kind: cross_run
    detail: favorable enrichment vs open-pore control
  pass_if:
    op: controls_absent
    detail: enrichment collapses to ~1 in the open-pore control
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
  gate_class: acceptance_criterion
- name: enrichment-exponential-in-pore-length
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    Enrichment is exponential in pore length (Baaske's geometry threshold) — a 10× shorter pore drops far below
    the favorable accumulation.
  measure:
    kind: cross_run
    detail: favorable vs 10× shorter pore
  pass_if:
    op: arms_reported
    detail: short pore enriches ≥100× less than the favorable pore
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
- name: spatial-flux-conserved
  gate_class: regression_pin
  classification: diagnostic
  description: The FiPy accumulation column conserves flux (FVM balance residual ~ machine epsilon).
  measure:
    kind: derived
    path: max_abs_trap_flux_residual
    detail: max |FVM flux-divergence residual|
  pass_if:
    op: <=
    value: 0.01
    detail: FVM residual small (direct LU solve)
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
findings:
- id: og03-baaske-enrichment
  evidence_basis: predicted
  evidence_basis_note: "The accumulation Peclet from the FVM transport model clears the independent Baaske-2007 regime; it is not fit to it."
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.thermophoretic_concentration.thermophoretic_concentration__1791944471__df60ba
  kind: computational
  status: confirms
  statement: >-
    A favorable serpentinite pore (5 mm × 0.1 mm, ΔT 30 K, convective flow) clears the Baaske-2007 extreme-accumulation
    regime at accumulation Péclet 18.4 from the real thermophoretic + convective transport, with FVM flux conserved
    to machine epsilon. The corresponding fold-enrichment (reduced-model exp(Pe) ≈ 1e6–1e7, nominally ~9.6×10⁷)
    is an extrapolation whose magnitude is solver-sensitive above Pe ≈ 13 — the graded quantity is the Péclet,
    not the precise fold.
  evidence:
    from_test: thermophoretic-enrichment-reproduces-baaske
    observed: favorable Pe_acc 18.4 (reduced-model fold-estimate ~1e6–1e7); FVM residual ~2e-14
    units: dimensionless
  expected:
    cites:
    - baaske2007extreme
    - mast2010thermal
  explanation: >-
    ThermophoreticTrapProcess solves the steady accumulation column; the Péclet is the resolved readout, while
    the fold-enrichment = exp(beta·L) is a reduced-model extrapolation. A FiPy↔FEniCS head-to-head cross-check
    finds the two solvers diverge by up to ~5.6 decades at Pe ≳ 13, so the extreme fold-magnitude is not treated
    as a precise resolved result.
- id: og03-individual-threshold
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.thermophoretic_concentration.thermophoretic_concentration__1791944471__df60ba
  kind: computational
  status: novel
  statement: >-
    The native pore-localization phase map (porosity × pore length) resolves localization as a bounded region,
    not a single favourable/open pair: the real trap localizes above the frontier (Péclet ≈ 18, reduced-model
    fold ≥ 1e6) at 25/144 grid points (~17%), enrichment rising with pore length, while an open pore (porosity→1)
    and a 10× shorter pore wash the feed through (no localization). The map is native to og-03's own trap readouts
    — it no longer borrows og-02's feed/washout axes. Localization (an individual forms vs washes through) is
    robust; the precise fold-magnitude in the high-Péclet interior is solver-sensitive (see limitations).
  evidence:
    from_test: open-pore-control-does-not-concentrate
    observed: >-
      25/144 (17%) localized over (porosity 0.05–0.95 × pore length 5e-4–8e-3 m); open-pore does not concentrate
      (~1×), 10× shorter pore ~6× — both far below the frontier
    units: dimensionless
  expected:
    cites:
    - baaske2007extreme
  explanation: >-
    Enrichment rises with pore length and vanishes with confinement/openness — the dilution/localization boundary
    the campaign sought, read from the real FiPy accumulation solve and rendered as the pore-localization map
    (Decision view). The frontier LOCATION is robust; the fold-values deep in the high-Péclet interior are a reduced-model
    extrapolation.
