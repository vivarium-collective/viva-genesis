title: 'Spatial Concentration: Does a Pore Make an Individual?'
concept: >-
  Spatial individuation of the protometabolism: whether vent pore physics concentrates a dilute feed strongly
  enough to ignite the reaction network and form a persistent, localized individual rather than washing
  into the ocean — one concept studied at several fidelities (thermophoretic concentration physics, full-network
  pore ignition) as arms.
gate_reason: >-
  Gate B (does spatial concentration make an individual). Consolidates the campaign's concentration/individuation
  line into one concept with explicit fidelity-labelled arms: the thermophoretic concentration physics
  (og-03) and the full-network pore ignition (og-30, canonical) — each judged against its own matched
  well-mixed null with feeds held equal. Headline (og-30, canonical): at identical vent-posterior feeds
  a concentrating mineral pore IGNITES the network (net carbon flux +4.5e-4, 17 persistent species) while
  a matched well-mixed, non-concentrating control stays dark — spatial concentration is load-bearing,
  SUPPORTED. Guardrail (kept explicit): the pore benefit is a BOUNDED porosity window, not a broad swath,
  and network_connected is a brittle proxy near threshold. og-30 does double duty — it meets Gate B and
  resolves Gate A1's open feed-plausibility question (the pore explains how the A1 carbon-fixing network
  persists at vent feeds).
claim: >-
  Across fidelities, vent pore physics concentrates a dilute feed into a persistent localized individual
  and ignites the reaction network. Resolving diffusion, thermophoresis, adsorption, surface catalysis
  and advection, a bounded serpentinite pore clears the Baaske-2007 extreme-accumulation regime (accumulation
  Peclet 18.4) and localizes a persistent individual vs a well-mixed control (og-03, supported). At identical
  vent-posterior feeds the concentrating pore ignites the full network — net carbon flux +4.5e-4, 17 persistent
  species — while a matched well-mixed, non-concentrating control stays dark (og-30, canonical, supported);
  the C6 network og-29 found needs ~20x well-mixed feed ignites directly in the pore at base feed. The
  pore benefit is a bounded porosity window, and network_connected is a brittle proxy near threshold (both
  kept honest). og-30 does double duty: it meets Gate B and resolves Gate A1's feed-plausibility. Consolidated
  headline: supported — spatial concentration makes the individual and rescues ignition. Every matched
  null and arm verdict kept.
question: >-
  Can vent pore physics concentrate a dilute vent feed strongly enough to form a persistent localized
  individual and ignite the reaction network productively — more than a matched well-mixed, non-concentrating
  control at identical feeds?
hypothesis: >-
  Bounded-geometry pore physics (thermophoresis + adsorption + advection) concentrates a dilute feed enough
  to retain a persistent individual and ignite the network, within a bounded porosity window; no individuation
  or ignition is claimed where a matched well-mixed control matches it.
experiment: >-
  Consolidate the spatial-concentration studies into one concept with explicit fidelity-labelled arms
  (concentration physics, full-network pore ignition), each preserving its matched well-mixed null, verdict,
  findings and run provenance; report the consolidated verdict (supported) with the bounded-porosity-window
  guardrail.
result: >-
  Vent pore physics concentrates a dilute feed into a persistent localized individual (Baaske regime cleared,
  accumulation Peclet 18.4) and ignites the full reaction network (net carbon flux +4.5e-4, 17 persistent
  species) where a matched well-mixed control stays dark (SUPPORTED); the benefit is a bounded porosity
  window, and og-30 also resolves Gate A1's feed-plausibility.
