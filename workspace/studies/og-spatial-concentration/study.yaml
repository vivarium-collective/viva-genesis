- name: colocalization-residence-measured
  classification: primary
  description: >-
    Reactive transport with thermophoresis and adsorption produces measurable co-localization of intermediates
    and increased residence time in the pore, reported as time- and space-resolved fields, not a terminal
    snapshot.
  measure:
    kind: observable
    detail: co-localization + residence time as time/space-resolved fields
  pass_if:
    op: threshold
    detail: measurable co-localization and residence increase reported
  requires_simulation: 'yes'
- name: productive-flux-beats-wellmixed-and-nonconcentrating
  classification: primary
  description: >-
    Productive network flux (and persistence) in the pore EXCEEDS both a matched well-mixed control and
    a matched nonconcentrating control with chemical input fluxes held equal; flux not separable from
    the controls is reported as "pores do not help," not tuned away. This is the Gate B arm.
  measure:
    kind: observable
    detail: pore productive flux + persistence vs. matched well-mixed and nonconcentrating controls
  pass_if:
    op: threshold
    detail: pore flux exceeds BOTH matched controls (else reported as no benefit)
  requires_simulation: 'yes'
- name: spatial-flux-conservation-and-cross-solver
  classification: secondary
  description: >-
    Mass and charge close across the spatial reactive-transport solve (divergence of flux equals source
    minus sink) with no untracked feed; the cross-solver comparison agrees to tolerance.
  measure:
    kind: observable
    detail: flux-divergence residual vs. source−sink; cross-solver agreement
  pass_if:
    op: threshold
    detail: conservation within tolerance; cross-solver agreement to tolerance
  requires_simulation: 'yes'
findings:
- id: og03-baaske-enrichment
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.thermophoretic_concentration.thermophoretic_concentration__1791944471__df60ba
  kind: computational
  status: confirms
  statement: >-
    A favorable serpentinite pore (5 mm × 0.1 mm, ΔT 30 K, convective flow) clears the Baaske-2007 extreme-accumulation
    regime at accumulation Péclet 18.4 from the real thermophoretic + convective transport, with FVM flux
    conserved to machine epsilon. The corresponding fold-enrichment (reduced-model exp(Pe) ≈ 1e6–1e7,
    nominally ~9.6×10⁷) is an extrapolation whose magnitude is solver-sensitive above Pe ≈ 13 — the graded
    quantity is the Péclet, not the precise fold.
  evidence:
    from_test: thermophoretic-enrichment-reproduces-baaske
    observed: favorable Pe_acc 18.4 (reduced-model fold-estimate ~1e6–1e7); FVM residual ~2e-14
    units: dimensionless
  expected:
    cites:
    - baaske2007extreme
    - mast2010thermal
  explanation: >-
    ThermophoreticTrapProcess solves the steady accumulation column; the Péclet is the resolved readout,
    while the fold-enrichment = exp(beta·L) is a reduced-model extrapolation. A FiPy↔FEniCS head-to-head
    cross-check finds the two solvers diverge by up to ~5.6 decades at Pe ≳ 13, so the extreme fold-magnitude
    is not treated as a precise resolved result.
- id: og03-individual-threshold
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.thermophoretic_concentration.thermophoretic_concentration__1791944471__df60ba
  kind: computational
  status: novel
  statement: >-
    The native pore-localization phase map (porosity × pore length) resolves localization as a bounded
    region, not a single favourable/open pair: the real trap localizes above the frontier (Péclet ≈ 18,
    reduced-model fold ≥ 1e6) at 25/144 grid points (~17%), enrichment rising with pore length, while
    an open pore (porosity→1) and a 10× shorter pore wash the feed through (no localization). The map
    is native to og-03's own trap readouts — it no longer borrows og-02's feed/washout axes. Localization
    (an individual forms vs washes through) is robust; the precise fold-magnitude in the high-Péclet interior
    is solver-sensitive (see limitations).
  evidence:
    from_test: open-pore-control-does-not-concentrate
    observed: >-
      25/144 (17%) localized over (porosity 0.05–0.95 × pore length 5e-4–8e-3 m); open-pore does not concentrate
      (~1×), 10× shorter pore ~6× — both far below the frontier
    units: dimensionless
  expected:
    cites:
    - baaske2007extreme
  explanation: >-
    Enrichment rises with pore length and vanishes with confinement/openness — the dilution/localization
    boundary the campaign sought, read from the real FiPy accumulation solve and rendered as the pore-localization
    map (Decision view). The frontier LOCATION is robust; the fold-values deep in the high-Péclet interior
    are a reduced-model extrapolation.
- id: og30-pore-ignites-vs-control
  kind: computational
  status: confirms
  statement: >-
    At identical vent-posterior feeds (CO2/H2 = 1e-3), the concentrating pore ignites the network (net
    carbon flux +4.5e-4; connected; 17 persistent species) while the matched well-mixed nonconcentrating
    control does not (flux ~0; not connected) - spatial concentration is the only difference, so the pore
    causes the productive flux.
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
- id: og30-c6-confirmation
  kind: computational
  status: confirms
  statement: >-
    The C6 network - the one og-29 found ignites only at ~20x well-mixed feed - ignites directly in the
    demo pore at the vent-posterior base feed (porosity 0.88, pore-local 0.023 M), net carbon flux +4.49e-4,
    connected, 22 persistent species, while the matched well-mixed C6 control stays dead (flux +1.5e-9,
    not connected). C6 shows the same bounded-window behavior as C4 - a tight pore (porosity 0.70, pore-local
    2.63 M) gives higher flux (+0.072) but the connectivity metric still degrades (network_connected =
    0), so there is no flux-washout upper bound; the bound above is physically-implausible feeds plus
    connectivity-metric degradation, not flux loss.
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
- id: og30-enrichment-bridges-ignition-gap
  kind: computational
  status: partial
  statement: >-
    A porosity sweep shows the pore's benefit is a bounded window, not a broad swath. Net carbon flux
    rises monotonically with confinement (no flux washout in the C4 network, even at extreme feeds), but
    the connectivity-defined ignition (og-29's network_connected metric) occupies a bounded, somewhat
    brittle porosity band (~0.80-0.90; pore-local ~0.01-0.2 M) - below it enrichment is sub-threshold,
    and above it the pore-local feeds become physically implausible (porosity 0.70 implies 2.6 M, 0.60
    implies 36 M) while the connectivity metric itself degrades, flipping 1/0/1 across adjacent porosities
    at similar high flux. So ignition is met in a specific pore-geometry window, not robustly across geometry.
  evidence:
    from_test: colocalization-residence-measured
  expected:
    cites:
    - baaske2007extreme
    - mast2010thermal
- id: og30-connectivity-metric-brittle
  kind: methodological
  status: novel
  statement: >-
    network_connected (og-29's ignition metric) is a BRITTLE proxy near threshold - at high feed the network
    stays carbon-fixing (flux high and monotone in enrichment) but loses broad connectivity (connected
    flips to 0), the same signal og-29 recorded as "washout" at x50 well-mixed, now seen to be connectivity-breadth
    loss rather than flux loss, consistent across C4/C6 and well-mixed/pore. This is a methodological
    caveat on the ignition metric only; it does NOT touch og-29's formose refutation, which rests on the
    thermodynamic mechanism and the coefficient-free seed-independence discriminator, not on connectivity.
  evidence:
    from_test: colocalization-residence-measured
- id: og30-resolves-a1-feed-plausibility
  kind: methodological
  status: confirms
  statement: >-
    This does double duty - it meets Gate B's own criterion (pore flux far exceeds the matched control)
    and resolves Gate A's open A1 feed-plausibility question: the ~20x well-mixed ignition gap is bridged
    by pore enrichment within the physical pore window, so a carbon-fixing network persists at vent-realistic
    feeds inside a pore (demonstrated on C4 and confirmed directly on C6).
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
