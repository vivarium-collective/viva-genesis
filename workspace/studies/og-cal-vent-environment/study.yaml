schema_version: 4
name: og-cal-vent-environment
investigation: origins-of-life-vent
created: '2026-10-14'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: 'Calibrating the Vent: What Fraction of Observed-Consistent Vent States Feed
  Downstream Chemistry'
question: 'Model Upgrade plan, Phase 1 (priority upgrade A). og-00 showed the real
  PHREEQC + FiPy vent settles in the Lost City window over ~80% of a swept grid —
  but the fraction of a chosen grid that passes is not a probability of feasibility,
  and sweep bounds can determine apparent robustness. Conditioning on observed systems
  instead: of the vent states consistent with the Lost City field observations (outlet
  T, pH, dissolved H2), what fraction also satisfies what og-01''s carbon fixation
  needs (H2 >= 1 mM at the interface, a >= 3-unit pH gradient, T inside validity)?
  Which observation binds, which parameters does it pin, and does the answer depend
  on whether the vent wall convects?'
hypothesis: A Lost-City-consistent posterior exists inside the empirically motivated
  prior of the og-00 world, most of it also satisfies the downstream requirements,
  the result is the same under the convecting and the prescribed-upflow transport
  classes, and the conservation ledger closes exactly on every draw.
objective: 'Run the Phase-1 environmental-calibration pipeline on the real geochemical
  world: LHS prior from the vg-data package vent_environment -> ensemble per spatial-transport
  model class -> ABC conditioning on the field windows -> posterior-predictive fraction
  meeting the downstream requirements -> Morris screening -> the Feasibility / Robustness
  / Discrimination report with the ledger verified.'
claim: 'Conditioning the real vent on field observations turns og-00''s "80% of a
  swept grid is habitable" into a posterior statement: 12.5% of the empirically motivated
  prior reproduces Lost City, the dissolved-H2 observation does all the work (pH is
  buffered, T is loose), and 100% of that posterior supplies the H2 and pH gradient
  downstream carbon fixation requires — a result that does not depend on whether the
  wall convects, and that identifies the DIC prior and the equilibrium-vs-kinetic
  carbon-redox assumption as the decisions that move it.'
findings:
- id: ogcal-posterior-viable-fraction
  kind: computational
  status: confirms
  statement: 'Feasibility and robustness, in the plan''s sense: 6/48 prior draws (12.5%)
    settle inside every Lost City window, and 6/6 of those (posterior-viable fraction
    1.00) also satisfy og-01''s requirements — dissolved H2 >= 1 mM at the interface,
    pH gradient >= 3 units against pH 6.0, T <= 100 C. One supporting parameterization:
    flow 3.2e-4 m/s, olivine_rate 0.38, pyroxene 0.54, fe 0.26, heat partition 6.2e-4,
    DIC 1.4 mM -> 49.2 C, pH 9.38, H2 10.8 mmol/kg, delta pH 3.38.'
  evidence:
    from_test: posterior-viable-vent-fraction
    observed: consistent 6/48; viable|consistent 1.00 (both transport classes)
    units: dimensionless
  explanation: 'ABC rejection on the vg-data windows (outlet T 40-91 C; pH 9.0-10.8;
    H2 1-15 mmol/kg) over a 48-point Latin-hypercube prior of the six free parameters
    of the real PHREEQC + FiPy world, then the downstream-requirement mask on the
    accepted set. Artifact: artifacts/vent_environment_report.json.'
  expected:
    cites:
    - kelley2001offaxis
    - kelley2005serpentinite
    - ludwig2006formation
    - proskurowski2008abiogenic
- id: ogcal-h2-is-the-binding-observation
  kind: computational
  status: novel
  statement: 'The dissolved-H2 window binds: 48/48 draws pass the pH window, 47/48
    the temperature window, only 6/48 the H2 window (39 fall below 1 mmol/kg, 3 above
    15). The posterior narrows the inflowing DIC from the prior 1.2-17 mM to 1.2-2.9
    mM and pushes the reaction extent high (olivine_rate 0.09-0.38 vs prior 0.02-0.35),
    with fe_fraction 0.14-0.26. Mechanism: at full redox equilibrium in llnl.dat the
    Fe(II) budget first reduces the fluid''s DIC (toward CH4 — Lost City''s abiogenic
    methane); free dissolved H2 appears only once that carbon sink is exhausted, so
    H2 is a threshold in (fe_fraction x olivine_rate) / DIC, not a smooth function
    of the Fe budget.'
  evidence:
    observed: per-observation acceptance pH 48/48, T 47/48, H2 6/48; DIC posterior
      q05-q95 1.2-2.9 mM vs prior 1.2-17 mM
    units: dimensionless
  explanation: 'Direct PHREEQC probe: at olivine_rate 0.15 / DIC 2 mM, fe 0.25 gives
    4.6 mmol/kg H2 (pe -9.6) while fe 0.10 gives 0 (pe -7.4); raising DIC to 15 mM
    at fe 0.25 also gives 0. This is an equilibrium-model statement: a kinetic (non-equilibrium)
    carbon-redox class on the serpentinization face would shift the threshold — recorded
    as the structural uncertainty to test next (Reaktoro / PFLOTRAN; decision in the
    investigation).'
  expected:
    cites:
    - kelley2005serpentinite
    - proskurowski2008abiogenic
    - schwander2023serpentinization
- id: ogcal-ph-is-buffered-not-discriminating
  kind: computational
  status: novel
  statement: Outlet pH is 9.38-9.91 for every one of the 96 runs regardless of flow,
    reaction extent, DIC or Fe budget — the peridotite (Ca-OH / tremolite-diopside)
    assemblage buffers it, so the pH observation accepts the whole prior and carries
    no information about the parameters. Morris mu* for pH is <= 0.11 on every parameter
    (vs 23 for H2 on olivine_rate). og-00's "pH in window" gate is therefore a reproduction
    of the buffer, not a constraint on the vent's operating point.
  evidence:
    observed: pH range 9.38-9.91 over 96 runs; mu*(pH) <= 0.108; pH window accepts
      48/48
    units: dimensionless
  expected:
    cites:
    - kelley2005serpentinite
    - ludwig2006formation
- id: ogcal-transport-class-does-not-change-the-verdict
  kind: computational
  status: confirms
  statement: 'Discrimination, in the plan''s sense: the convecting (Darcy-Boussinesq)
    and prescribed-uniform-upflow FiPy classes agree on consistency and viability
    for 48/48 identical draws (structure agreement 1.00, model-form uncertainty 0.00).
    They are told apart only by outlet temperature (paired standardised difference
    d = 0.89; convection settles ~2 C warmer at nx = 20), not by pH (d = -0.54 at
    a 0.02-unit scale), dissolved H2 (d = 0.00) or pe (0.06). Whether the wall convects
    is a structural choice og-00''s conclusions do not depend on.'
  evidence:
    from_test: structure-agreement-across-transport-classes
    observed: agreement 1.00 on viability; d(T) = 0.89, d(H2) = 0.00
    units: dimensionless
  explanation: Same 48 draws run through model_spatial_transport = fipy and fipy_uniform_upflow
    (buoyancy 0); the serpentinization source is identical, and the outlet pH/H2 are
    set by speciation, not by the wall's flow pattern. The FEniCS class (a merged
    dolfinx alternative, run under viva-fenics's pixi env) is a third available class
    on this axis, held out of this uv-.venv ensemble — not a forthcoming addition.
  expected:
    cites:
    - kelley2001offaxis
- id: ogcal-morris-screening
  kind: computational
  status: novel
  statement: 'Morris screening (r = 4 trajectories, 28 world runs): dissolved H2 is
    controlled by olivine_rate (mu* 23.0), fluid DIC (20.8) and flow (16.9), weakly
    by fe_fraction (3.1), not at all by pyroxene fraction or heat partition; outlet
    temperature by the heat-partition fraction (2.16), flow (1.47) and olivine_rate
    (0.84). The two conditioning readouts that carry information (T, H2) are controlled
    by disjoint parameters, so the posterior factorises: T pins heat_to_fluid_fraction,
    H2 pins the Fe-budget-to-DIC ratio.'
  evidence:
    observed: 'mu*(H2): olivine_rate 23.0, fluid_dic 20.8, flow 16.9, fe 3.1; mu*(T):
      heat_to_fluid 2.16, flow 1.47, olivine 0.84'
    units: dimensionless
  explanation: Elementary effects on the log-scaled prior bounds of the vg-data package;
    artifact ensemble.morris.
- id: ogcal-ledger-exact
  kind: computational
  status: confirms
  statement: 'Numerical verification: the ConservationLedgerProcess closes exactly
    on all 96 ensemble runs and on the 120-tick canonical run — integrated H2 / alkalinity
    / heat sources equal the accumulated pools bit-for-bit (residual 0.0), PHREEQC
    charge imbalance 0, FiPy flux-divergence residual <= 1.1e-14, and serpentinization
    heat is released, never absorbed (energy_directionality 1). No prior draw was
    rejected by PHREEQC (0 failed points), so the posterior is not truncated by engine
    validity.'
  evidence:
    from_test: ledger-closes
    observed: mass residual 0.0; energy residual 0.0; charge 0; flux <= 1.1e-14; 0/96
      failed
    units: dimensionless
  explanation: The og-00 contract's four invariants (mass_balance, charge_neutrality,
    spatial_flux_conservation, energy_directionality) are now all machine-witnessed;
    energy_directionality was previously declared but not computed.
conclusion: 12.5% of the empirically motivated prior reproduces the Lost City observations,
  the dissolved-H2 window is the only informative one, 100% of the posterior supplies
  what carbon fixation needs, the transport class changes nothing but outlet temperature,
  and the ledger closes exactly.
conclusion_verdicts:
  biological_validation:
    result: PENDING
    basis: Geochemical calibration only — no origin-of-life claim; it supplies the
      posterior the later stages propagate.
  explanatory_gain:
    result: POSITIVE
    basis: Identifies WHICH observation constrains the vent (H2, via the DIC-before-H2
      equilibrium threshold) and which parameters it pins (DIC, reaction extent),
      separating that from the uninformative buffered pH.
limitations:
- Lost City windows only; MARHYS 4.0 not yet attached (proposed_inputs marhys4_hydrothermal_fluids).
- 48 draws x 2 classes, serial (PHREEQC cannot run in a process pool); Sobol indices
  not yet computed on the posterior.
- Equilibrium carbon redox (llnl.dat) sets the H2 threshold; a kinetic carbon-redox
  class is the planned structural alternative.
- fluid_dic, ocean pH 6.0 and ocean T 275 K are extrapolated / hypothetical and unsourced
  on purpose.
discovery_implications:
  resolved_uncertainties:
  - A conditioned posterior of viable vent states exists and is transport-class-independent.
  - Outlet pH is a buffer property of the peridotite assemblage, not an operating-point
    constraint.
  remaining_uncertainties:
  - How the H2 threshold moves under kinetic (non-equilibrium) carbon redox and under
    a Hadean DIC prior.
  - Whether the MARHYS population widens or narrows the posterior relative to Lost
    City alone.
  followup_study_proposals:
  - study: og-cal-vent-environment-b
    rationale: Attach MARHYS 4.0; add Reaktoro/PFLOTRAN + a kinetic carbon-redox class
      on the serpentinization face; hold out the H2 window and test whether T + pH
      predict it.
  - study: og-00-alt-reactor-stays-open
    rationale: MineralEvolutionProcess (precipitation -> porosity/permeability feedback)
      and the reactor-stays-open gate.
