key_assumptions:
- 'The prior is the vg-data package vent_environment (six free parameters; provenance
  audit: 0 measured, 2 calibrated, 1 inferred, 3 extrapolated, 2 hypothetical).'
- 'Uniform likelihood on observation windows (ABC rejection): a vent state is consistent
  when every readout lies inside its window.'
- 'Full redox equilibrium each step (PHREEQC, llnl.dat): DIC is reduced before free
  H2 appears; a kinetic carbon-redox class is the planned alternative.'
- Downstream requirements are og-01's favorable regime (H2 >= 1 mM, delta pH >= 3
  against pH 6.0, T <= 100 C), classed inferred.
expert_questions:
- Which Hadean DIC / ocean-pH / ocean-T prior should replace the modern-seawater proxy?
- Is the equilibrium reduction of DIC before H2 release physically acceptable at 40-90
  C, or should carbon redox be kinetically inhibited on the serpentinization face?
