proposed_mechanisms:
- 'A: serpentinization as boundary flux (PHREEQC speciation)'
- 'B: flow/mixing (convecting vs prescribed-upflow transport classes)'
proposed_models_methods:
- vg-data prior package (value-or-distribution + provenance class per parameter)
- Latin-hypercube ensemble through the real PHREEQC + FiPy geochemical_world per model
  class
- ABC rejection on field observation windows; posterior-predictive requirement mask
- Morris elementary-effects screening; paired class differences; conservation ledger
implemented_methods:
- 'geochemical_world: PhreeqcSerpentinizationProcess (real IPhreeqc, llnl.dat, peridotite
  assemblage) behind the serpentinization face; FipyReactiveTransportProcess / FipyUniformUpflowTransportProcess
  (real 2-D FVM) behind the spatial_transport face; ConservationLedgerProcess auditing
  pools vs integrated sources, charge, flux divergence, heat directionality.'
- 'viva_genesis.uq.environment_calibration: sample_package (scipy LatinHypercube over
  the six free parameters), run_point per class (serial, tolerant), abc_rejection
  on the package observations, requirement mask, posterior_summary, structure_agreement,
  paired_class_difference, morris (r=4, levels=4, log-scaled bounds), TransitionReport
  + decision_discipline (clean).'
contract:
  face:
    inputs:
      flow_velocity:
        _type: float
        _units: meter/second
        _min: 0.0
      olivine_rate:
        _type: float
        _units: dimensionless
        _min: 0.0
      fluid_dic:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      H2_flux:
        _type: float
        _units: mole/second
        _min: 0.0
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pH:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 14.0
  conditions:
  - kind: invariant
    name: mass_balance
    expr: ledger.H2_residual == 0 and ledger.alkalinity_residual == 0
  - kind: invariant
    name: charge_neutrality
    expr: abs(charge_imbalance) < 1e-6
  - kind: invariant
    name: spatial_flux_conservation
    expr: flux_divergence_residual < 1e-3
  - kind: invariant
    name: energy_directionality
    expr: ledger.energy_directionality == 1
  note: The ledger witnesses every invariant of the og-00 contract on the same world;
    ports are canonical vg_* fields (viva_genesis/schemas.py PORT_TO_CANONICAL).
behavior_tests:
- name: ledger-closes
  classification: primary
  description: Integrated H2 / alkalinity sources equal the accumulated pools (matter
    ledger exact by construction).
  measure:
    kind: derived
    path: max_ledger_mass_residual
    detail: worst-case |pool - integral| / integral over H2 and alkalinity
  pass_if:
    op: <=
    value: 1.0e-12
    detail: matter ledger residual at machine precision
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: energy-ledger-closes
  classification: primary
  description: Integrated serpentinization heat equals the accumulated heat pool.
  measure:
    kind: derived
    path: max_ledger_energy_residual
    detail: worst-case |heat pool - integrated heat| / integral
  pass_if:
    op: <=
    value: 1.0e-12
    detail: energy ledger residual at machine precision
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: heat-released-not-absorbed
  classification: diagnostic
  description: Serpentinization is exothermic — the heat source never goes negative
    (energy_directionality invariant, previously declared but uncomputed in og-00).
  measure:
    kind: derived
    path: energy_directionality_final
    detail: 1 while the heat source has never been negative
  pass_if:
    op: '>='
    value: 1.0
    detail: directionality witness holds through the run
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
- name: charge-conserved
  classification: diagnostic
  description: PHREEQC balances charge every step (charge_neutrality invariant).
  measure:
    kind: derived
    path: max_abs_charge_imbalance
    detail: worst-case |charge imbalance| over the run
  pass_if:
    op: <=
    value: 1.0e-06
    detail: '|charge imbalance| < 1e-6 throughout'
  units: eq/kgw
  requires_simulation: 'yes'
  band_basis: first_principles
- name: dissolved-h2-in-lost-city-range
  classification: primary
  description: The canonical operating point's reacted-fluid dissolved H2 (backed
    out of the settled H2 flux) sits in the Lost City end-member range 1-15 mmol/kg.
  measure:
    kind: derived
    path: settled_dissolved_h2_mM
    detail: settled H2_flux / (flow_velocity x flux_area)
    mmol/kg: null
  params:
    flow_velocity: 0.001
    flux_area: 60.0
  pass_if:
    op: range
    low: 1.0
    high: 15.0
    detail: dissolved H2 in [1, 15] mmol/kg
  units: millimole/kilogram
  requires_simulation: 'yes'
  cites:
  - kelley2005serpentinite
  - proskurowski2008abiogenic
  gate_class: acceptance_criterion
- name: posterior-viable-vent-fraction
  classification: primary
  description: 'Phase-1 exit criterion (Feasibility + Robustness): the fraction of
    prior draws consistent with every observation window that also satisfy the downstream
    requirements must be positive (at least one physically admissible, observation-consistent
    vent state feeds carbon fixation); the value itself is the deliverable.'
  measure:
    kind: derived
    path: posterior_viable_fraction
    detail: viable | consistent, headline transport class, from artifacts/vent_environment_report.json
  artifact: workspace/studies/og-cal-vent-environment/artifacts/vent_environment_report.json
  pass_if:
    op: '>'
    value: 0.0
    detail: posterior-viable fraction > 0
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - kelley2005serpentinite
  - ludwig2006formation
  - proskurowski2008abiogenic
  gate_class: acceptance_criterion
- name: structure-agreement-across-transport-classes
  classification: primary
  description: 'Discrimination / model-form uncertainty: the convecting and prescribed-upflow
    transport classes must agree on viability for at least 80% of the prior draws,
    else og-00''s conclusions are structure-sensitive.'
  measure:
    kind: derived
    path: structure_agreement_viable
    detail: fraction of identical draws on which every class agrees about viability
  artifact: workspace/studies/og-cal-vent-environment/artifacts/vent_environment_report.json
  pass_if:
    op: '>='
    value: 0.8
    detail: cross-class agreement >= 0.8
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
