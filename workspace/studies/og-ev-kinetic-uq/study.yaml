schema_version: 4
name: og-ev-kinetic-uq
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: exploratory
proposed: true
title: Kinetic-network re-evaluation under realistic uncertainty (P0)
program: evidence-expansion
honest_caveat: >-
  A challenge study: it tests whether the campaign's persistence / amplification conclusions
  SURVIVE realistic kinetic uncertainty. A negative (they do not survive) is a meaningful
  result, reported as such and not tuned away.
question: >-
  Do the A1 network's persistence and (apparent) amplification survive realistic KINETIC
  uncertainty, rather than holding only at idealized order-of-magnitude rate constants?
hypothesis: >-
  With bounded, fitted reaction rates and side products, reversibility, substrate depletion and
  catalyst aging included, net persistence is retained but the probability-of-persistence is
  reduced and the apparent amplification weakens further - consistent with A1 qualified and A2
  refuted, now under an uncertainty budget rather than point rates.
objective: >-
  Re-run the og-02 / og-30 carbon-fixing network with fitted, bounded rate distributions and the
  neglected kinetic effects, and report persistence as a probability with posterior-predictive
  checks against the idealized baseline.
primary_output: >-
  Time courses, reaction fluxes, mass-balance residuals, posterior-predictive checks, and a
  probability-of-persistence over the fitted rate uncertainty.
refines: "upgrades og-02-reduced-carbon-to-protometabolism and og-30-spatially-integrated-protometabolism (builds on them)"
evidence_datasets: [evidence-muchowska2019-rtca-network]
baseline:
- name: Idealized point-rate network (og-02/og-30 canonical)
  planned: true
  params: {rates: point, side_products: false, catalyst_aging: false}
- name: Fitted bounded-rate ensemble (side products + reversibility + substrate depletion + catalyst aging)
  planned: true
  params: {rates: fitted_bounded, side_products: true, reversibility: true, catalyst_aging: true}
proposed_acceptance_criteria:
- Reaction rates are fitted to bounded distributions (with a stated kinetic model), not asserted as point values - no rate constants inferred from endpoint yields without that model.
- Persistence is reported as a probability over the rate uncertainty, with posterior-predictive checks vs the idealized baseline, mass balance closing.
- Whether persistence/amplification survive the uncertainty is reported either way (a reduced or lost probability is an accepted result).
literature_anchors: [muchowska2019synthesis, wolos2020synthetic, somogyi2015libroadrunner]
visualizations: []
