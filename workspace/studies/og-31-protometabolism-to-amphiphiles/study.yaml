schema_version: 4
name: og-31-protometabolism-to-amphiphiles
investigation: origins-of-life-vent
created: '2026-10-17'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Protometabolism to Amphiphiles
question: Can actual metabolic products yield membrane-forming amphiphile mixtures?
hypothesis: The actual carbon products of the protometabolic network, through candidate chain extension,
  headgroup generation and hydrolysis, reach a chain-length and headgroup mixture whose concentration
  crosses a measured critical aggregation window and forms a phase-stable membrane — with no exogenous
  amphiphile added.
objective: Take the network's real carbon products through candidate carbon-chain extension, headgroup
  generation and hydrolysis, and compare the resulting amphiphile concentrations against measured critical
  aggregation and phase-stability windows to decide whether membrane-forming mixtures arise endogenously.
# Verbatim plan dependencies (handoff contracts wired by genesis-writer after scaffolding).
# 17 has no scaffolded slug yet; recorded here only.
builds_on: [4, 17, 28, 30]
proposed_mechanisms:
- chain extension + headgroup generation building amphiphiles from endogenous carbon products
- hydrolysis as the loss term competing with amphiphile accumulation
proposed_models_methods:
- candidate carbon-chain extension
- headgroup generation
- hydrolysis
- measured critical aggregation + phase stability
# Tools this study draws on, at their TRUE build status (see workspace/references/build-registry.yaml).
tools:
- {id: viva-md-membrane, build_status: to-build, role: coarse-grained closure laws for assembly + permeability}
- {id: molecular-to-continuum-membrane, build_status: to-build, role: composition -> assembly/leakage/permeability closure}
- {id: reaction-rule-generation, build_status: to-build, role: RDKit chain-extension / headgroup enumeration}
contract:
  face:
    inputs:
      carbon_product_supply:
        _type: float
        _units: molar/second
        _min: 0.0
    outputs:
      amphiphile_concentration:
        _type: float
        _units: molar
        _min: 0.0
      mean_chain_length:
        _type: float
        _units: dimensionless
      hydrolysis_loss:
        _type: float
        _units: molar/second
  conditions:
  - kind: invariant
    name: no_exogenous_amphiphile
    expr: all amphiphiles derive from the network's carbon products (no untracked amphiphile feed)
  - kind: invariant
    name: carbon_mass_balance
    expr: chain extension + headgroup + hydrolysis conserve carbon (balanced against supply)
  note: Outputs the plan calls for — chain-length + headgroup distributions, concentrations, losses —
    are the typed outputs plus distribution readouts; the assembly window is a MEASURED critical aggregation
    / phase-stability band, not a tuned threshold.
behavior_tests:
- name: reaches-assembly-window-without-exogenous-amphiphiles
  classification: primary
  description: 'Decision test — model reaches an experimental assembly window without exogenous amphiphiles:
    the amphiphile mixture built from endogenous carbon products reaches a measured critical aggregation
    / phase-stability window with no amphiphile added from outside the network.'
  measure:
    kind: observable
    detail: endogenous amphiphile concentration + chain-length/headgroup mixture vs. measured critical
      aggregation and phase-stability windows
  pass_if:
    op: threshold
    detail: concentration reaches the measured assembly window with no exogenous amphiphile supply
  requires_simulation: 'yes'
