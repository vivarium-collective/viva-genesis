title: Physical Reproduction
question: Can an individual physically reproduce — grow to a division threshold and divide into daughters that grow and divide in turn — building a multi-generation lineage in the agents map, with matter and volume conserved at every division?
hypothesis: A founder individual whose division_state grows to threshold divides by a _divide structural rewrite that halves its matter and volume; the daughters inherit half each (their amounts and volumes sum to the mother's) and grow and divide in turn, so a >=3-generation lineage forms in the agents map with the partition residual 0 at every division.
objective: Drive AgentGrowthProcess -> DivisionStep over the agents map from a single founder; gate that the lineage reaches >=3 generations and that every _divide conserves matter and volume (daughter volumes sum to the mother's — partition residual 0, total volume constant).
proposed_mechanisms:
- 'H+: reproduction is a structural rewrite (_divide) on the agents map, not a counter'
- conserving partition (FMP §9.1) — daughters'' amounts + volumes sum to the mother''s
proposed_models_methods:
- AgentGrowthProcess (division_state -> threshold) + DivisionStep (_divide, matter + volume halved)
- LineageStatsProcess (deepest generation, total volume) + RewriteLedgerProcess (partition residual)
contract:
  face:
    inputs:
      growth_per_step:
        _type: float
        _units: dimensionless
        _min: 0.0
      founder_volume:
        _type: float
        _units: liter
        _min: 0.0
    outputs:
      max_generation:
        _type: float
        _units: dimensionless
        _min: 0.0
      total_volume:
        _type: float
        _units: liter
        _min: 0.0
      partition_residual_max:
        _type: float
        _units: dimensionless
  conditions:
  - name: partition_conservation
    expr: partition_residual_max == 0 (daughter amounts + volumes sum to the mother)
behavior_tests:
- name: lineage-reaches-three-generations
  classification: primary
  description: A founder individual grows and divides, its daughters grow and divide in turn, so the lineage in the agents map reaches at least 3 generations.
  measure: {kind: derived, path: max_generation, detail: deepest generation reached in the agents map}
  pass_if: {op: '>=', value: 3.0, detail: a >=3-generation lineage forms}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: division-conserves-volume
  classification: primary
  description: Every _divide conserves matter and volume — the daughters' volumes sum to the mother's, so the total volume is constant across the lineage and the partition residual is 0.
  measure: {kind: derived, path: partition_residual_max, detail: max |mother - sum(daughters)| over divisions}
  pass_if: {op: '<=', value: 1.0e-9, detail: partition residual ~ 0 (conserving split)}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
literature_anchors:
- key: sutherland2017opinion
  relevance: the origin of a self-reproducing individual as the pre-genetic endpoint of the chemistry.
baseline:
- name: Founder lineage — growth to a >=3-generation lineage
  composite: viva_genesis.composites.physical_reproduction.physical_reproduction
  params: {growth_per_step: 0.4, founder_volume: 8.0e-12, founder_formate: 8.0, founder_acetate: 4.0}
  canonical: true
claim: An individual physically reproduces by a _divide structural rewrite, building a >=3-generation lineage in the agents map with matter and volume conserved (partition residual 0) at every division.
result: The founder reaches generation >=3 (a growing population of individuals) with the total volume held constant and the partition residual 0 at every division.
findings:
- id: physical-reproduction-lineage
  kind: computational
  status: confirms
  statement: A founder grows, divides, and its daughters do the same — a >=3-generation lineage forms in the agents map, matter and volume conserved at every division.
  from_test: lineage-reaches-three-generations
report:
