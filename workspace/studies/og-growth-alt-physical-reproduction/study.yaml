design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: Physical Reproduction
question: Can an individual physically reproduce — grow to a division threshold and
  divide into daughters that grow and divide in turn — building a multi-generation
  lineage in the agents map, with matter and volume conserved at every division?
hypothesis: A founder individual whose division_state grows to threshold divides by
  a _divide structural rewrite that halves its matter and volume; the daughters inherit
  half each (their amounts and volumes sum to the mother's) and grow and divide in
  turn, so a >=3-generation lineage forms in the agents map with the partition residual
  0 at every division.
objective: Drive AgentGrowthProcess -> DivisionStep over the agents map from a single
  founder; gate that the lineage reaches >=3 generations and that every _divide conserves
  matter and volume (daughter volumes sum to the mother's — partition residual 0,
  total volume constant).
proposed_mechanisms:
- 'H+: reproduction is a structural rewrite (_divide) on the agents map, not a counter'
- conserving partition (FMP §9.1) — daughters'' amounts + volumes sum to the mother''s
proposed_models_methods:
- AgentGrowthProcess (division_state -> threshold) + DivisionStep (_divide, matter
  + volume halved)
- LineageStatsProcess (deepest generation, total volume) + RewriteLedgerProcess (partition
  residual)
contract:
  face:
    inputs:
      growth_per_step:
        _type: float
        _units: dimensionless
        _min: 0.0
      founder_volume:
        _type: float
        _units: liter
        _min: 0.0
    outputs:
      max_generation:
        _type: float
        _units: dimensionless
        _min: 0.0
      total_volume:
        _type: float
        _units: liter
        _min: 0.0
      partition_residual_max:
        _type: float
        _units: dimensionless
  conditions:
  - name: partition_conservation
    expr: partition_residual_max == 0 (daughter amounts + volumes sum to the mother)
behavior_tests:
- name: lineage-reaches-three-generations
  classification: primary
  description: A founder individual grows and divides, its daughters grow and divide
    in turn, so the lineage in the agents map reaches at least 3 generations.
  measure:
    kind: derived
    path: peak_generation
    detail: deepest generation the lineage REACHES (peak over the run, not the time-mean);
      from artifacts/physical_reproduction_report.json
  artifact: workspace/studies/og-growth-alt-physical-reproduction/artifacts/physical_reproduction_report.json
  pass_if:
    op: '>='
    value: 3.0
    detail: a >=3-generation lineage forms (peak reaches generation 5)
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: division-conserves-volume
  classification: primary
  description: Every _divide conserves matter and volume — the daughters' volumes
    sum to the mother's, so the total volume is constant across the lineage and the
    partition residual is 0.
  measure:
    kind: derived
    path: partition_residual_peak
    detail: worst (max) |mother - sum(daughters)| over every _divide; from artifacts/physical_reproduction_report.json
  artifact: workspace/studies/og-growth-alt-physical-reproduction/artifacts/physical_reproduction_report.json
  pass_if:
    op: <=
    value: 1.0e-09
    detail: partition residual ~ 0 at every division (conserving split)
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
literature_anchors:
- key: sutherland2017opinion
  relevance: the origin of a self-reproducing individual as the pre-genetic endpoint
    of the chemistry.
