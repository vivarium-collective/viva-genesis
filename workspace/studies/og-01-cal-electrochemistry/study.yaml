proposed_mechanisms:
- 'A: empirical gated kinetics (og-01) with the gradient efficiency derived from the wall circuit'
- 'B: the wall as a galvanic cell — Nernst potentials, Butler-Volmer kinetics, ohmic mineral + ionic path, faradaic split'
- 'C: adsorbate microkinetics with site coverage and passivation (deferred; pixi)'
proposed_models_methods:
- carbon_fixation face with the model class as a categorical sweep axis
- Nernst + Butler-Volmer galvanic-cell solve (Brent) per tick; Koutecky-Levich transport limits; Bruggeman ionic path
- Loss-fraction partition of the fresh-fluid emf -> limitation label per point; cross-class agreement + confusion
- Charge + electron ledger (Kirchhoff residual, faradaic efficiency <= 1, current-voltage residual)
implemented_methods:
- 'electrochemical_carbon_fixation: MineralConductivityProcess (circuit-derived gradient efficiency) -> PhGradientNernstPlanckProcess (real FiPy) -> [empirical: ProtonBudgetProcess + EquilibratorThermoStep + EmpiricalCarbonFixationProcess | butler_volmer: ButlerVolmerCarbonFixationProcess] -> ChargeLedgerProcess; the class resolved through models.resolve_checked on the carbon_fixation face.'
- 'viva_genesis.uq.electrochemistry_calibration: sweep_grid over (model_carbon_fixation x ph_vent x h2 x conductivity x ni_fraction), attribute_mechanisms (labels, favorable regions, agreement, confusion, per-axis agreement, ledger summary), electrochemistry_report (TransitionReport + decision_discipline), save_artifacts (map + report + nominal cell + polarization curve).'
contract:
  face:
    inputs:
      ph_vent: {_type: float, _units: dimensionless, _min: 0.0, _max: 14.0}
      h2: {_type: float, _units: molar, _min: 0.0}
      conductivity: {_type: float, _units: siemens/meter, _min: 0.0}
      ni_fraction: {_type: float, _units: dimensionless, _min: 0.0, _max: 1.0}
    outputs:
      net_carbon_flux: {_type: float, _units: mole/second, _min: 0.0}
      current_density: {_type: float, _units: ampere/meter**2, _min: 0.0}
      faradaic_efficiency: {_type: float, _units: dimensionless, _min: 0.0, _max: 1.0}
  conditions:
  - {kind: invariant, name: charge_conservation, expr: 'ledger.charge_residual <= 1e-9 every tick'}
  - {kind: invariant, name: faradaic_bound, expr: 'ledger.faradaic_efficiency <= 1'}
  - {kind: invariant, name: current_voltage_consistency, expr: 'ledger.iv_residual_max <= 1e-6'}
  - {kind: invariant, name: loss_partition, expr: 'loss_thermodynamic + loss_electrical + loss_catalytic + loss_transport == 1 while current flows (butler_volmer)'}
  note: Ports are canonical vg_* fields (viva_genesis/schemas.py PORT_TO_CANONICAL); every carbon_fixation class is face-checked at build (models.assert_face).
behavior_tests:
# Canonical-run gates (derived scalars over the persisted sqlite store) + mechanism-map gates that read the
# committed artifact. Thresholds: the roadmap row's gate wording + Phase 1's 0.8 agreement convention,
# declared before the sweep ran (preregistered below).
- name: failure-mode-labelled
  classification: primary
  description: Every mechanism-map point carries a limitation label (thermodynamic / electrical / catalytic / transport) in every runnable class.
  measure: {kind: derived, path: failure_mode_label_coverage, detail: min over classes of the fraction of points with a finite label}
  artifact: workspace/studies/og-01-cal-electrochemistry/artifacts/electrochemistry_report.json
  pass_if: {op: '>=', value: 1.0, detail: label coverage 1.0 in every class}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: failure-mode-attributed
  classification: primary
  description: >-
    Phase-2 exit criterion: the model classes agree on the limitation label on at least 80% of the region
    they both call favorable (throughput >= 10% of each class's own maximum). Below that the attribution is
    structure-sensitive.
  measure: {kind: derived, path: failure_mode_agreement_favorable, detail: fraction of favorable-both points with identical labels}
  artifact: workspace/studies/og-01-cal-electrochemistry/artifacts/electrochemistry_report.json
  pass_if: {op: '>=', value: 0.8, detail: cross-class label agreement >= 0.8 in the favorable region}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: mechanism-map-ledger-closes
  classification: primary
  description: The charge ledger closed on every mechanism-map run of every class.
  measure: {kind: derived, path: mechanism_map_ledger_all_ok, detail: 1 when charge_ledger_ok on every point}
  artifact: workspace/studies/og-01-cal-electrochemistry/artifacts/electrochemistry_report.json
  pass_if: {op: '>=', value: 1.0, detail: ledger ok on all points}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: charge-ledger-closes
  classification: primary
  description: Kirchhoff residual |anode - (carbon + H2 evolution)| / anode at machine precision every tick of the canonical run.
  measure: {kind: derived, path: charge_ledger_residual_max, detail: worst-case charge residual}
  pass_if: {op: <=, value: 1.0e-9, detail: charge residual within tolerance}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: faradaic-efficiency-bounded
  classification: primary
  description: Electrons delivered to carbon never exceed the electrons supplied (faradaic efficiency <= 1).
  measure: {kind: derived, path: faradaic_efficiency_max, detail: worst-case faradaic efficiency over the run}
  pass_if: {op: <=, value: 1.000001, detail: 'FE <= 1 (1e-6 rounding allowance)'}
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: current-voltage-residual
  classification: diagnostic
  description: The galvanic-cell circuit equation E_c(j) - E_a(j) - j R = 0 is solved to tolerance every tick.
  measure: {kind: derived, path: iv_residual_max, detail: worst-case |residual| / emf_fresh}
  pass_if: {op: <=, value: 1.0e-6, detail: circuit residual below 1e-6}
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
- name: current-in-altair-window
  classification: primary
  description: The canonical operating point's settled current density lies in the Altair-2025 reactor window (10 nA .. 10 uA on a ~1e-3 m^2 interface).
  measure: {kind: derived, path: settled_current_density, detail: settled cell current density}
