schema_version: 4
name: og-01-cal-electrochemistry
investigation: origins-of-life-vent
created: '2026-10-15'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: failed
title: 'The Vent Wall as a Galvanic Cell: Which Limitation Stops Carbon Fixation, and Do the Model Classes Agree?'
question: >-
  Model Upgrade plan, Phase 2 (electrochemical carbon fixation). og-01 drives CO2 reduction with a scalar
  gradient_efficiency and a Michaelis drive in the proton-motive force, so it can say WHETHER fixation runs
  but not WHY it stops. Treating the vent wall as an electrical circuit instead — fluid redox state ->
  Nernst electrode potentials -> Butler-Volmer overpotentials -> current density -> surface rates — which
  limitation (thermodynamic, electrical, catalytic, transport) binds where over (vent pH x dissolved H2 x
  mineral conductivity x Ni/Fe), and do the empirical and the electrochemical model classes on the new
  carbon_fixation face agree on that label in the region both call favorable?
hypothesis: >-
  Explicit electrochemistry reproduces the Altair-2025 current window at the nominal operating point with
  the Preiner product hierarchy, derives og-01's gradient efficiency from the wall's conductivity (an
  insulating wall collapses it, the Tutolo-2026 arm, as a consequence rather than a knob), closes a charge +
  electron ledger exactly, and labels every swept point with its dominant limitation. Pre-registered gate:
  the classes agree on the label on >= 80% of the region both call favorable.
objective: >-
  Build the carbon_fixation face with three classes (empirical = og-01's kinetics; butler_volmer = Nernst +
  Butler-Volmer galvanic cell, the primary new class; microkinetic = CatMAP/Cantera, pixi-only), the
  MineralConductivityProcess that derives gradient_efficiency from circuit physics, the ChargeLedgerProcess
  (Kirchhoff residual per tick, faradaic efficiency <= 1, current-voltage residual) and the vg-data package
  electrochemical_interface; sweep (pH x H2 x conductivity x Ni) x classes in open flow; attribute the
  limitation at every point; measure cross-class agreement; report Feasibility / Robustness / Discrimination.
result: >-
  375 grid points x 2 runnable classes (750 real runs, 40 ticks, 117 s on 6 workers; the microkinetic class
  is registered but its backend is pixi-only, so it is recorded as deferred). Every point is labelled
  (coverage 1.00 in both classes) and the charge ledger closes on all 750 runs (Kirchhoff residual <= 1.7e-13,
  faradaic efficiency <= 1, circuit residual <= 8.5e-9). The Butler-Volmer cell sits inside the Altair-2025
  current window on 79.7% of the grid (1.4e-7 .. 3.0e-3 A/m^2; nominal 1.06e-3 A/m^2, FE 0.92, emf 0.49 V)
  and derives og-01's gradient efficiency as 0.01 / 0.42 / 0.98 / 1.00 at 1e-9 / 1e-7 / 1e-5 / >= 1e-3 S/m.
  The mechanism map disagrees between classes: the Butler-Volmer class labels its whole favorable region
  (93/93 points) CATALYTIC (activation overpotential ~ 0.99 of the fresh-fluid emf at Altair-level exchange
  currents), electrical only below ~1e-6 S/m (149 points), never transport or thermodynamic; the empirical
  class labels the same region electrical (pmf-drive headroom, 47) / catalytic (117) / transport (28, Michaelis
  in H2 below ~1e-4 M). Label agreement is 0.47 on the 78 points both classes call favorable (0.45 overall;
  0.81 where the wall is insulating, 0.01 at 1 uM H2), so the pre-registered gate (>= 0.8) FAILS and the
  decision-discipline audit flags the attribution as structure-sensitive.
claim: >-
  Explicit electrochemistry is feasible, calibrated and ledger-exact, and it changes the answer to "why does
  fixation stop": under the Butler-Volmer class the alkaline-vent cell is activation-limited everywhere the
  wall conducts — the catalyst, not the gradient, binds — and the Tutolo-style collapse is an electrical
  regime below ~1e-6 S/m that both classes recover. The empirical class cannot make that attribution because
  its one Michaelis drive term lumps electrical and catalytic limitation and its substrate Michaelis constant
  invents a transport limit the cell physics does not have. The failure-mode label is therefore
  structure-sensitive (agreement 0.47 < 0.8): a negative result on the gate and the Phase-2 mechanism map
  the plan asked for, recorded as a decision for the expert rather than hidden.
findings:
- id: og01cal-every-point-attributed
  kind: computational
  status: confirms
  statement: >-
    Every one of the 375 grid points carries a limitation label in both runnable classes (coverage 1.00; 0
    failed runs). Butler-Volmer: catalytic 226, electrical 149, transport 0, thermodynamic 0. Empirical:
    transport 147, catalytic 117, electrical 108, thermodynamic 3.
  evidence:
    from_test: failure-mode-labelled
    observed: 'label coverage 1.00 (empirical), 1.00 (butler_volmer); 0/750 failed points'
    units: dimensionless
  explanation: >-
    The Butler-Volmer class partitions the fresh-fluid emf into product back-pressure (thermodynamic), ohmic
    drop (electrical), activation overpotential (catalytic) and concentration overpotential (transport) —
    four fractions that sum to one while current flows — and takes the largest (a cathode sending most
    electrons to H2 is catalytic / selectivity-limited). The empirical class publishes the headroom of each
    of its multiplicative gates (1 - feasible, 1 - drive(pmf), 1 - catalyst x Ni gain, 1 - availability).
    Artifact: artifacts/electrochemistry_mechanism_map.json.
- id: og01cal-classes-disagree-in-the-favorable-region
  kind: computational
  status: novel
  statement: >-
    The pre-registered failure-mode-attributed gate fails: on the 78 points both classes call favorable the
    labels agree on 37 (0.47); overall 168/375 (0.45). The confusion is systematic, not noise — every
    Butler-Volmer favorable point is catalytic (93/93), while the empirical class calls 47 of its favorable
    points electrical and 28 transport. Agreement is high only where the physics is unambiguous: 0.81 at 1e-9
    S/m (both: electrical) and 0.67-0.68 at H2 >= 1.4e-4 M; it collapses to 0.01 at 1 uM H2, where the
    empirical Michaelis constant (1e-4 M) declares transport limitation that the cell never reaches (the
    limiting current stays above the activation-limited current at these exchange currents).
  evidence:
    from_test: failure-mode-attributed
    observed: 'label agreement 0.474 on 78 favorable-both points (gate >= 0.8); 0.448 overall; favorability structure agreement 0.65'
    units: dimensionless
  explanation: >-
    The empirical rate law's drive(pmf) = pmf / (pmf + 0.08 V) lumps the delivered gradient (electrical) and
    the electrode kinetics (catalytic) into one saturating term, so its "electrical" headroom in the favorable
    region is what the Butler-Volmer class resolves as activation overpotential. Paired class differences on
    identical points: loss_transport d = 1.77, loss_thermodynamic d = 0.68 (discriminating); loss_electrical,
    loss_catalytic and gradient_efficiency |d| < 0.5 (not discriminating). decision_discipline flags the
    attribution as structure-sensitive.
  expected:
    cites: [commchem2026energeticconstraints, altair2025electrochemical]
- id: og01cal-butler-volmer-cell-is-activation-limited
  kind: computational
  status: novel
  statement: >-
    Under explicit electrochemistry the alkaline-vent cell is catalytically (activation) limited everywhere
    the wall conducts: at the nominal point (pH 9.5 | 6.0, 5 mM H2, 2 mM CO2, 100 C, 1e-3 S/m, Ni3Fe) the
    anode + cathode activation overpotentials take 0.996 of the 0.49 V fresh-fluid emf, the ohmic drop 0.002
    and transport 0.001, at j = 1.06e-3 A/m^2 with faradaic efficiency 0.92 to carbon. Throughput rises only
    ~40x across the whole (pH x H2) plane (74 mV per pH unit, (RT/2F) ln10 per decade of H2) because the
    current scales with the exchange current, not the driving force. The electrical regime appears below
    ~1e-6 S/m (ohmic drop > activation), where the circuit-derived gradient efficiency is 0.01-0.42.
  evidence:
    observed: 'nominal losses: catalytic 0.996, electrical 0.002, transport 0.001, thermodynamic 0.0; j = 1.06e-3 A/m^2; FE 0.92; gradient_efficiency 0.01 / 0.42 / 0.98 / 1.00 at 1e-9 / 1e-7 / 1e-5 / 1e-3 S/m'
    units: dimensionless
  explanation: >-
    Exchange currents calibrated to the Altair-2025 current window (j0_co2 1e-5, j0_h2 5e-5, j0_her 2.5e-6
    A/m^2 at Ni3Fe, 100 C) are small, so the Butler-Volmer branches need ~0.2-0.3 V each to carry 1e-3 A/m^2;
    the mineral + ionic path drops microvolts unless the wall is an insulator. This is a prediction under the
    calibration, not a measurement: the per-condition Altair currents are not yet attached.
  expected:
    cites: [altair2025carbon, commchem2026currentproducing]
- id: og01cal-current-window-reproduced
  kind: computational
  status: confirms
  statement: >-
    The Butler-Volmer class's settled current density lies inside the Altair-2025 window (1e-5 .. 1e-2 A/m^2,
    i.e. ~10 nA .. 10 uA on the cm^2-scale interface) at the canonical operating point and on 79.7% of the
    grid (range 1.4e-7 .. 3.0e-3 A/m^2; the points below the window are the insulating walls). Selectivity
    to carbon products stays 0.76-1.00.
  evidence:
    from_test: current-in-altair-window
    observed: 'canonical j = 1.06e-3 A/m^2; grid fraction in window 0.797; FE 0.76-1.00'
    units: ampere/meter**2
  explanation: Reproduction-tier check against the calibration window (vg-data electrochemical_interface.observations.cell_current_density); the window is the dossier summary, not a per-condition fit.
  expected:
    cites: [altair2025carbon]
- id: og01cal-charge-ledger-exact
  kind: computational
  status: confirms
  statement: >-
    Numerical verification: the ChargeLedgerProcess closes on all 750 mechanism-map runs and on the 120-tick
    canonical run — Kirchhoff residual |anode - (carbon + H2 evolution)| / anode <= 1.7e-13 (0.0 for the
    empirical class), faradaic efficiency never above 1 (max 1 + 1e-13), circuit residual <= 8.5e-9. The
    ledger caught a real bookkeeping gap during the build (on insulating walls the trace ocean-side H2
    oxidising at the cathode co-supplies electrons), which is now counted explicitly.
  evidence:
    from_test: charge-ledger-closes
    observed: 'charge residual <= 1.7e-13; FE max 1.0000000000001; iv residual <= 8.5e-9; 0/750 failed'
    units: dimensionless
report:
  title: 'Phase 2 — electrochemical carbon fixation: the mechanism map'
  verdict: FAIL on the pre-registered agreement gate (0.47 < 0.8) — the limitation label is structure-sensitive; explicit electrochemistry is built, calibrated to the Altair current window, ledger-exact, and attributes the favorable region to the catalyst, not the gradient
  confidence: medium
  main_insight: >-
    Making the vent wall an explicit galvanic cell moves the answer to "why does fixation stop": at
    Altair-level exchange currents the cell is activation-limited everywhere the wall conducts, the Tutolo
    collapse is an electrical regime below ~1e-6 S/m that the circuit derives rather than assumes, and
    thermodynamics never binds in open flow. The empirical class cannot see this because one Michaelis
    drive term lumps the electrical and catalytic limitations and its substrate Michaelis constant invents a
    transport limit the cell physics does not reach — so the classes agree only where the wall is insulating.
  conclusion: >-
    Phase 2 delivers its reusable component (the carbon_fixation face with two real classes and a pixi-only
    third), its vg-data package (13 parameters, none unsourced except the deliberately flagged ocean-side H2
    and Ni gain), its charge + electron ledger and its mechanism map — but not the agreement the gate asked
    for. The honest reading is that the attribution of a limitation is a property of the model class, which
    is exactly the structure-sensitivity the plan says must be reported; the discriminating experiment is the
    wall's polarization curve (current vs a 10x catalyst change), recorded as a decision for the expert.
  caveat: >-
    Exchange currents are calibrated to the dossier's current WINDOW (10 nA .. 10 uA), not to Altair's
    per-condition time courses (not attached); the Ni gain shape and the ocean-side H2 are hypothetical; the
    two classes live on different absolute throughput scales (empirical abstract tick vs physical second),
    so favorability is defined per class relative to its own maximum; the microkinetic class is registered
    but not run (CatMAP/Cantera under pixi); the grid is uniform in log over the priors, not a conditioned
    posterior.
  key_metrics:
  - {label: Points labelled (both classes), value: 375/375 (coverage 1.00), status: pass}
  - {label: Label agreement in the favorable-both region (gate >= 0.8), value: '0.47 (37/78)', status: fail}
  - {label: Label agreement overall / insulating wall / 1 uM H2, value: 0.45 / 0.81 / 0.01, status: info}
  - {label: Butler-Volmer favorable region label, value: catalytic 93/93, status: info}
  - {label: Canonical current density vs Altair window, value: '1.06e-3 A/m^2 in [1e-5, 1e-2]', status: pass}
  - {label: Charge ledger (Kirchhoff / FE <= 1 / circuit residual), value: 1.7e-13 / 1.0 / 8.5e-9, status: pass}
conclusion: >-
  The electrochemical interface is real, calibrated and ledger-exact; its mechanism map says the conducting
  vent wall is catalyst-limited and the insulating wall gradient-limited; the empirical class disagrees in
  the favorable region (agreement 0.47), so the gate fails and the attribution is reported as
  structure-sensitive.
conclusion_verdicts:
  biological_validation:
    result: PENDING
    basis: Calibrated to a current window; the per-condition Altair currents and the microkinetic class are needed before the catalytic-limitation claim can be called validated.
  explanatory_gain:
    result: POSITIVE
    basis: Separates electrical from catalytic limitation, derives the Tutolo collapse from conductivity, and shows the empirical rate law cannot attribute the limitation — a structural result the empirical class alone could not produce.
limitations:
- Current-window calibration only; the Altair-2025 per-condition currents / products are not attached as a dataset.
- Two runnable classes; the microkinetic (CatMAP/Cantera) class builds and face-checks but runs only under pixi.
- Favorability is per class relative to its own maximum because the classes' absolute throughputs differ by ~10 decades (abstract vs physical ticks).
- The ocean-side H2 (1e-7 M) and the Ni-gain shape are hypothetical; the mineral conductivity prior is extrapolated.
discovery_implications:
  resolved_uncertainties:
  - gradient_efficiency can be derived from the wall's circuit; an insulating wall (< 1e-6 S/m) collapses it as a consequence.
  - The charge + electron ledger closes for both classes; faradaic efficiency is bounded.
  remaining_uncertainties:
  - Whether the cell is really activation-limited at Lost-City-like conditions (depends on the exchange currents; the per-condition Altair data would pin them).
  - Whether site coverage and passivation (microkinetic class) move the catalytic label toward transport at high current.
  followup_study_proposals:
  - {study: og-01-cal-electrochemistry-b, rationale: Run the microkinetic class under pixi; attach the Altair-2025 time courses and fit the exchange currents; re-evaluate the agreement gate with three classes.}
  - {study: og-01-alt-butler-volmer-default, rationale: Re-run og-01's gates with model_carbon_fixation = butler_volmer as the default class and report the parameter-robust vs structure-sensitive regions of its phase map.}
