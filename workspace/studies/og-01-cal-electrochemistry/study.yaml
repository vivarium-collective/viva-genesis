  description: Butler-Volmer electrochemical_carbon_fixation at the nominal point, open flow (120 ticks) -> isolated sqlite store -> auto-graded ledger + current-window gates.
- name: electrochemistry-mechanism-map
  script: workspace/studies/og-01-cal-electrochemistry/sims/compute_electrochemistry_mechanism_map.py
  description: (pH x H2 x conductivity x Ni) = 375 points x 2 classes, 40 ticks -> artifacts/electrochemistry_mechanism_map.json + electrochemistry_report.json (6 workers, ~2 min).
visualizations:
- name: electrochemistry-mechanism-map
  address: local:ElectrochemistryMechanismMap
  config:
    title: The vent wall as a galvanic cell — an honest negative
    mechanism_map_json: workspace/studies/og-01-cal-electrochemistry/artifacts/electrochemistry_mechanism_map.json
    report_json: workspace/studies/og-01-cal-electrochemistry/artifacts/electrochemistry_report.json
- name: electrochemistry-polarization
  address: local:ElectrochemistryPolarization
  config:
    title: Vent wall as a galvanic cell at the nominal point (Mechanism view)
pipeline_gate:
  gate_evaluator:
    result: failed
    blocked_by: [failure-mode-attributed]
    evaluated_by: code
    diverges_from_authored: false
  prerequisites:
  - study: og-01-geology-to-reduced-carbon
    condition: tests-passed
conditions:
  baseline:
    composite: viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation
    params: {model_carbon_fixation: butler_volmer, dilution_rate: 2.0}
variants:
- name: empirical-class
  params: {model_carbon_fixation: empirical, dilution_rate: 2.0}
- name: microkinetic-class-pixi-only
  params: {model_carbon_fixation: microkinetic, dilution_rate: 2.0}
- name: insulating-wall
  params: {model_carbon_fixation: butler_volmer, dilution_rate: 2.0, conductivity: 1.0e-9}
- name: iron-only-catalyst
  params: {model_carbon_fixation: butler_volmer, dilution_rate: 2.0, ni_fraction: 0.0}
- name: control-no-catalyst
  params: {model_carbon_fixation: butler_volmer, dilution_rate: 2.0, catalyst_active: 0.0}
simulation_set:
- name: Electrochemical interface — Butler-Volmer, open flow
  kind: single
  base_model: viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation
  is_baseline: true
  status: ran
units_and_time:
  tick: 1 s per step (steady cell solve per tick; FiPy Nernst-Planck relaxation)
  concentration_unit: molar
  note: The Butler-Volmer class runs in physical seconds (products in nM at the Altair current window); the empirical class keeps og-01's abstract ticks, so the two throughput scales differ by ~10 decades and favorability is defined per class.
study_card:
  headline: >-
    375 points x 2 classes, every point labelled and the charge ledger exact; the Butler-Volmer cell is
    activation-limited wherever the wall conducts and electrical below ~1e-6 S/m, the empirical class
    disagrees in the favorable region (label agreement 0.47 < 0.8), so the gate fails and the attribution
    is structure-sensitive.
  status: FAIL on the agreement gate — predicts under stated assumptions (mechanistic prediction tier; the current-window check at reproduction tier)
  evidence_tier: mechanistic_prediction
preregistered:
  registered_at: '2026-10-15T07:30:00Z'
  note: >-
    Gates (label coverage 1.0; cross-class label agreement >= 0.8 on the favorable-both region; charge
    residual <= 1e-9; faradaic efficiency <= 1; circuit residual <= 1e-6; current in [1e-5, 1e-2] A/m^2;
    FE to carbon >= 0.5), the favorable-region rule (>= 10% of each class's own maximum) and the
    calibration window (vg-data electrochemical_interface v1) were fixed from the roadmap row and Phase 1's
    agreement convention before the 750-run sweep was read; the result text was written after.
