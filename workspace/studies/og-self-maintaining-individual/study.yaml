gate_status: failed
study_type: exploratory
title: NEW C — Self-Maintaining Chemical Individuality
program: bridge-study
verdict: refuted
confidence: Refuted
evidence_tier: mechanistic_prediction
primary_limitation: >-
  The refutation is SCOPED: reciprocal self-maintenance does not close ENDOGENOUSLY under defensible vent conditions
  without a built-in production/retention gain. The broader "can a chemical individual emerge at all" question stays
  OPEN per §9 - this is not a claim of universal impossibility, only that this coupled chemistry+boundary loop, fed
  the real A pool (even at B's favorable corner), cannot build and keep its own membrane without assuming it.
key_assumptions:
- >-
  No built-in gain (the defining constraint): membrane retention is GATED on the chemistry's ACTUAL
  aggregation_competent (long-chain amphiphile pool / CAC). A membrane (retention > 0) exists only when the pool
  clears CAC; the earned value (when competent) is og_32's MD-informed long-chain retention, never assumed. Pinning
  retention at ~0.9 regardless of CAC clearance is the false closure this study forbids, surfaced explicitly.
- >-
  Conditional on B: run and reported at BOTH the canonical point AND B's favorable S_T corner (the only regime where
  B found the precursor pool consumable: S_T ~1e-2/K ceiling + high dT + high DIC + pore enrichment), so C is not
  evaluated as if the pool were given.
- >-
  Amphiphile synthesis is the real AmphiphileChainExtensionProcess (explicit C2 fatty-acid elongation, CAC falls
  with chain length) at its default kinetics; the C2 feed is A's actual acetate output, never inflated.
- >-
  Decay is real (amphiphile hydrolysis k_degrade + metabolite washout); external feeds held equal across arms
  (matched-null standard).
claim: >-
  The coupled chemistry-and-boundary system does NOT maintain itself endogenously under defensible vent conditions:
  the chemistry's acetate (even at B's favorable corner) yields an amphiphile pool ~4 orders below its CAC at the
  corner and ~7 orders below at the canonical point, so no membrane forms without assuming it, and reciprocal
  maintenance fails to close without a built-in retention gain - across all three ablations. SCOPED REFUTED of
  endogenous closure; the broader individuality-emergence question stays open (§9).
question: >-
  Does the coupled chemistry-and-boundary system MAINTAIN ITSELF - chemistry making the boundary that in turn
  sustains the chemistry - under perturbation, without a built-in production or retention gain?
hypothesis: >-
  Coupling explicit amphiphile precursor flux, synthesis, membrane composition, permeability, nutrient influx,
  product retention and decay yields reciprocal maintenance that survives relevant perturbations only when neither
  direction of the coupling is assumed.
experiment: >-
  Couple A's real precursor pool (acetate) -> real fatty-acid chain-extension -> aggregation-gated membrane
  retention -> reduced washout -> back to the chemistry, solved as a reciprocal fixed point; ablate
  chemistry->membrane, membrane->chemistry and external feed SEPARATELY; compare WITH vs WITHOUT the built-in
  retention gain; run at the canonical point AND B's favorable corner. Claim individuality only if maintenance
  survives without a built-in gain.
primary_output: >-
  Whether reciprocal maintenance closes (yes/no) without a built-in gain, by how many orders the amphiphile pool
  falls short of CAC, at the canonical point AND B's corner, across all three ablations, with the built-in-gain
  comparison - and the quantified cascading A->B->C concentration gap.
