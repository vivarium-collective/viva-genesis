  composite: viva_genesis.composites.self_maintaining.og_self_maintaining_individual
behavior_tests:
- name: acetate-delivered-to-synthesis
  classification: supporting
  gate_class: acceptance_criterion
  description: >-
    The chemistry->membrane arrow carries signal: A's reaction network delivers nonzero acetate (C2) to the
    fatty-acid chain-extension synthesis.
  measure:
    kind: derived
    path: settled_synth_acetate
    detail: settled acetate delivered to synthesis
  pass_if:
    op: '>'
    value: 0.0
    detail: the network delivers acetate to synthesis
  units: molar
  requires_simulation: 'yes'
  band_basis: first_principles
- name: amphiphiles-aggregation-competent
  classification: primary
  gate_class: acceptance_criterion
  description: >-
    Does the amphiphile pool the chemistry actually produces clear its critical aggregation concentration
    (aggregation_competent >= 1) so a membrane can form WITHOUT assuming it? It does NOT - this is the no-built-in-gain
    witness and the core of the refutation.
  measure:
    kind: derived
    path: settled_aggregation_competent
    detail: long-chain amphiphile pool / CAC
  pass_if:
    op: '>='
    value: 1.0
    detail: amphiphile pool clears CAC (a membrane can form endogenously)
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
  cites:
  - jordan2019promotion
- name: reciprocal-maintenance-closes-endogenously
  classification: primary
  gate_class: acceptance_criterion
  description: >-
    Cross-run: does the reciprocal loop close (a membrane is sustained, retention > 0, WITHOUT a built-in gain) at
    the canonical point AND B's corner, and do all three ablations fail to close? Graded by sims/run.py. Closure
    FAILS (no endogenous membrane); the ablations and the with/without-gain comparison confirm it.
  measure:
    kind: cross_run
    detail: endogenous closure (no built-in gain) at canonical + B-corner, vs the three ablations and the gain comparison
  pass_if:
    op: controls_absent
    detail: reciprocal maintenance closes endogenously without a built-in gain
  units: dimensionless
  requires_simulation: 'yes'
findings:
- id: ogc-acetate-delivered
  evidence_basis: predicted
  evidence_basis_note: >-
    The acetate the network delivers to synthesis is a model output of A's real reactor (not fit); it is nonzero but
    far too dilute to build a membrane.
  kind: computational
  status: confirms
  statement: >-
    The chemistry->membrane arrow carries real signal: A's network delivers acetate (C2) to the fatty-acid
    chain-extension (~1e-11 M canonical, ~1.4e-8 M enriched at B's corner) - so the coupling exists; it is the
    concentration that fails.
  evidence:
    from_test: acetate-delivered-to-synthesis
    observed: settled acetate ~1e-11 M (canonical); ~1.4e-8 M (B corner, enriched+retained)
    units: molar
  explanation: >-
    Acetate is A's C2 product; the chain-extension elongates it to long-chain fatty acids - the real
    chemistry->membrane path, present but thin.
- id: ogc-no-membrane
  evidence_basis: predicted
  evidence_basis_note: >-
    aggregation_competent is a model output (long-chain pool / CAC), not fit to any target; it is the explicit
    no-built-in-gain witness, and it lands orders below 1.
  kind: computational
  status: novel
  statement: >-
    The amphiphile pool the chemistry produces does NOT clear its CAC: aggregation_competent ~9e-8 at the canonical
    point and well below 1 even at B's corner, so no membrane forms without assuming one. The long-chain FRACTION is
    fine (~0.95) - it is a pure concentration failure, the same nM gap cascading from A.
  evidence:
    from_test: amphiphiles-aggregation-competent
    observed: aggregation_competent ~9e-8 (canonical, FAIL vs 1); amphiphile pool ~1e-9 M vs CAC 5e-3 M
    units: dimensionless
  explanation: >-
    A membrane forms only when the long-chain pool reaches its critical aggregation concentration; the chemistry's
    output is ~4-7 orders below the acetate needed for that, so the boundary cannot be built endogenously.
- id: ogc-no-endogenous-closure
  evidence_basis: predicted
  evidence_basis_note: >-
    The closure result is a model prediction across the fixed point + ablations + the built-in-gain comparison; it is
    the central negative, not an assumed one.
  kind: computational
  status: novel
  statement: >-
    Reciprocal self-maintenance does NOT close endogenously without a built-in gain, at the canonical point OR B's
    corner, and all three ablations also fail to close. With the built-in gain the loop "closes" only because
    retention is forced to the long-chain value regardless of CAC - a membrane is never physically present - which is
    exactly the false closure the no-built-in-gain constraint forbids.
  evidence:
    from_test: reciprocal-maintenance-closes-endogenously
    observed: closes(no gain) = False at canonical and B-corner; all 3 ablations fail; with-gain closure is assumed-only
    units: dimensionless
  expected:
    cites:
    - sojo2016origin
  explanation: >-
    The membrane->chemistry arrow can only help once a membrane exists; since the chemistry never clears CAC, the gate
    stays open (retention 0), washout is unreduced, and the loop has no fixed point with a real boundary.
- id: ogc-cascade
  evidence_basis: extrapolated
  evidence_basis_note: >-
    The cascading gap is extrapolated across the A->B->C chain from each study's model outputs and the CAC-clearance
    threshold; it is the headline quantification, not a fitted value.
  kind: computational
  status: novel
  statement: >-
    The precursor concentration gap cascades A->B->C and is quantified: A's acetate (9.6e-12 M) is ~6.9 orders below
    the CAC-clearance threshold (7.6e-5 M) at the canonical point; B's best corner lifts the acetate the membrane
    sees to 6.7e-9 M, still ~4.1 orders short; neither closes the loop. The central chemistry-to-individual
    transition is OPEN, bounded here by a ~4-order concentration shortfall even at the most favorable defensible corner.
  evidence:
    from_test: amphiphiles-aggregation-competent
    observed: orders short of CAC ~6.9 (canonical), ~4.1 (B corner); acetate needed for CAC clearance ~7.6e-5 M
    units: dimensionless
  explanation: >-
    Each bridge narrows but does not close the gap: thermodynamic ceiling (A) -> narrow S_T-conditional enrichment
    (B) -> still sub-CAC amphiphile synthesis (C). The shortfall is the concrete, quantified open problem.
