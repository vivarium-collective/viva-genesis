schema_version: 4
name: mem-m3-stability-gradients
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: exploratory
proposed: true
title: Stability across environmental gradients (membrane-MD M3)
program: membrane-md
design_ref: workspace/references/membrane-md-studies-m1-m5-designs.md
honest_caveat: >-
  MD tests candidate prebiotic compositions; it does NOT by itself demonstrate endogenous
  membrane formation.
question: >-
  How do ionic strength, mono- and divalent ions, temperature, and carboxylate protonation
  fraction change membrane integrity?
hypothesis: >-
  Vent-relevant ionic strength, divalent cations (Mg2+/Ca2+), temperature and pH-set
  protonation define a stability envelope; integrity degrades (defects, desorption, rupture)
  outside it, and that envelope may not coincide with the functional (selective-permeability)
  window.
experiment: >-
  Map the stability envelope of candidate compositions across the vent-relevant gradients,
  one factor at a time then a small factorial.
primary_output: >-
  Stability envelopes over the gradients, defect statistics, desorption/exchange rates, and
  rupture / pore-formation thresholds.
first_cut_forthcoming: >-
  A lightweight pH x chain-length stability-window MD (planned, not yet scaffolded or named).
  Soft forward-reference only; hardened when the Martini vesicle thread is scaffolded.
extends: mem-m1-amphiphile-assembly (the assembled compositions)
baseline:
- name: One-factor-at-a-time gradient sweeps (ionic strength / ion identity / temperature / protonation)
  planned: true
  params: {design: oat}
- name: Small factorial over the gradients
  planned: true
  params: {design: factorial}
- name: Reference composition held across all conditions (internal control)
  planned: true
  params: {composition: reference}
proposed_acceptance_criteria:
- Integrity (defects, desorption, rupture thresholds) is measured across the gradient ranges at matched counts/seeds.
- The stability envelope is reported whether or not candidate compositions stay intact across vent-relevant ranges.
- Where the stability envelope and the M2 functional window diverge is identified (the feasibility tension).
literature_anchors: [janke2014oleic, grunewald2020titratable, souza2021martini3]
visualizations: []
