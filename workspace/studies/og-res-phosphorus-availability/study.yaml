schema_version: 4
name: og-res-phosphorus-availability
investigation: origins-of-life-vent
created: '2026-10-13'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: The Phosphorus Bottleneck
question: >-
  Can the same thermal-gradient vent pore that concentrates carbon and nitrogen also make
  phosphorus chemically available, or does phosphate precipitate and adsorb before it is
  useful?
hypothesis: In a thermal-gradient pore (coupled from og-03), enrichment drives phosphate
  condensation and activation steeply enough that reactive-P formation outruns the
  first-order precipitation/adsorption sink in a bounded (source × enrichment) region
  — and that same enrichment co-concentrates P alongside carbon; without the gradient
  (open pore), precipitation wins and no reactive P accumulates.
objective: Build a real P-speciation process (phosphate <-> polyphosphate <-> reactive-P
  with a precipitation/adsorption mineral sink), couple it to the og-03 thermal pore,
  and map where reactive-P availability beats loss and co-concentrates with carbon.
claim: >-
  A P-speciation network coupled to the thermal pore makes reactive phosphorus net-positive
  only in a bounded phosphate-source by pore-enrichment window where condensation and
  activation outrun the precipitation and adsorption sink; at the favourable point reactive P
  accumulates to about 94% of the supplied phosphorus with only about 6% precipitated. The
  same enrichment that concentrates carbon co-concentrates phosphorus, whereas the open-pore
  ablation precipitates about 96% of it before it is useful. In the model phosphorus is thus a
  localization-gated bottleneck rather than a freely available input.
findings:
- id: ogres-reactive-p-available
  provenance:
    run_ids:
    - viva_genesis.composites.phosphorus_availability.phosphorus_availability__1791926628__6912fc
  kind: computational
  status: confirms
  statement: In the favorable thermal-gradient pore, reactive-P formation outpaces
    the precipitation/adsorption loss — net reactive-P availability settles positive
    (~+1.8e-6 mol/s) and reactive P accumulates to ~94% of the supplied phosphorus
    while only ~6% precipitates. A bounded local window exists where reactive P is
    produced faster than it is lost.
  evidence:
    from_test: reactive-p-available
    observed: ~+1.8e-6 mol/s net availability; reactive P ~94% of supply; ~6% precipitated
    units: mole/second
  explanation: 'Real libRoadRunner ODE P-speciation network: enrichment enters condensation
    as enr^2 and activation as enr, while precipitation is first-order in phosphate,
    so a concentrated pore tips phosphate''s fate toward the reactive route.'
  expected:
    cites:
    - pasek2017schreibersite
- id: ogres-p-coconcentrates-with-carbon
  provenance:
    run_ids:
    - viva_genesis.composites.phosphorus_availability.phosphorus_availability__1791926628__6912fc
  kind: computational
  status: novel
  statement: 'The SAME real og-03 thermophoretic pore that lifts a dilute carbon feed
    across the ignition threshold (species-agnostic Soret + convection trap) co-concentrates
    phosphate: at the pore''s enrichment the P reactive-availability is positive and
    the enrichment exceeds the carbon co-concentration floor (~10×). C and P co-concentrate
    in one pore regime — reported as an overlap boundary, not a fitted target.'
  evidence:
    from_test: p-coconcentrates-with-carbon
    observed: og-03 pore enrichment >> 10× carbon co-concentration floor; P reactive-availability
      positive at that enrichment
    units: dimensionless
  explanation: The thermophoretic trap enrichment depends on the Soret coefficient
    and pore geometry, not on the solute identity, so the pore that concentrates carbon
    concentrates phosphate; coupling it to the P-speciation network shows reactive
    P becomes available in the same regime.
  expected:
    cites:
    - baaske2007extreme
    - mast2010thermal
- id: ogres-precipitation-ablation
  provenance:
    run_ids:
    - viva_genesis.composites.phosphorus_availability.phosphorus_availability__1791926628__6912fc
  kind: computational
  status: novel
  statement: 'The feature ablation is decisive — an open pore / no thermal gradient
    (enrichment = 1) collapses reactive-P availability: net availability goes negative
    and ~96% of phosphorus precipitates to the mineral sink. Phosphate precipitates/adsorbs
    before it is chemically useful unless the pore concentrates it first.'
  evidence:
    from_test: open-pore-no-enrichment-control
    observed: favorable net ~+1.8e-6 (6% precipitated) vs open-pore net < 0 (~96%
      precipitated)
    units: mole/second
  explanation: Without enrichment the condensation/activation fluxes (enr-gated) fall
    below the first-order precipitation loss, so phosphate drains into mineral-bound
    P — the phosphorus bottleneck made explicit.
  expected:
    cites:
    - pasek2017schreibersite
- id: ogres-availability-landscape
  provenance:
    run_ids:
    - viva_genesis.composites.phosphorus_availability.phosphorus_availability__1791926628__6912fc
  kind: computational
  status: novel
  statement: A 16×16 sweep over (phosphate source × pore/thermal enrichment) maps
    where reactive P is available, not just that it is at one point. Reactive-P availability
    is bounded by the net-availability threshold (production = loss) on the enrichment
    axis; the PASS region is where that threshold is crossed AND the enrichment co-concentrates
    carbon (right of the ~10× carbon floor). Below the threshold phosphate precipitates
    before it is useful.
  evidence:
    observed: reactive-P pool ranges ~0 to ~1 mM across the (source × enrichment)
      plane (~94% of supply, ~94 µM, at the favorable 1e-4 M point); availability
      bounded by net=0 and the carbon co-concentration floor
    units: molar
  explanation: 16×16 sweep of the real libRoadRunner composite reduced to the settled
    reactive-P pool, net availability and precipitated fraction; rendered as the reactive-P
    availability phase map (Decision view). Runner sims/compute_phosphorus_availability_grid.py.
  expected:
    cites:
    - baaske2007extreme
    - pasek2017schreibersite
conclusion: Reactive phosphorus becomes available only in a bounded enriched-pore
  window where condensation and activation outrun the precipitation/adsorption sink;
  the same og-03 pore co-concentrates P with carbon, and the open-pore ablation precipitates
  ~96% of P — phosphorus is a localization-gated bottleneck.
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reactive-P availability beats loss in the favorable pore and co-concentrates
      with carbon, with the open-pore ablation collapsing it.
  explanatory_gain:
    result: POSITIVE
    basis: The real speciation network shows WHY P is a harder bottleneck — precipitation
      is first-order while the useful routes are enrichment-gated, so P needs localization
      that C needs less.
limitations:
- The P-speciation network is a lumped reduced model (single reactive-P pool, reversible
  mineral sink); rate constants are calibrated to the precipitation-vs-reactive competition,
  not fit to a mineral assemblage.
- The co-concentration argument uses the og-03 trap enrichment as a species-agnostic
  multiplier into the P network; a fully coupled spatial C+P pore solve is deferred.
- natcomm2023phosphorus / natcomm2025phosphateactivation (plan refs) are not yet on
  main's papers.bib — recorded as pending proposed_inputs, not cited here.
discovery_implications:
  resolved_uncertainties:
  - A bounded (source × enrichment) window exists where reactive P is produced faster
    than it precipitates.
  - The same thermal pore that concentrates carbon co-concentrates phosphorus.
  remaining_uncertainties:
  - Whether a fully coupled spatial C+N+P pore solve preserves the co-concentration
    overlap under shared transport.
  followup_study_proposals:
  - study: og-res-phosphorus-b
    rationale: Couple C
    N and P in one spatial pore solve and test simultaneous co-enrichment under shared flow.: null
