behavior_tests:
- name: reactive-p-available
  classification: primary
  description: Reactive-P production outpaces precipitation/adsorption loss — net
    reactive-P availability settles positive in the favorable (enriched) pore (a window
    where reactive P is produced faster than it is lost).
  measure:
    kind: derived
    path: phosphorus_net_reactive_availability
    detail: settled net reactive-P availability = production - precipitation loss
  pass_if:
    op: '>'
    value: 0.0
    detail: net availability > 0 (reactive P produced faster than lost)
  units: mole/second
  requires_simulation: 'yes'
  cites:
  - pasek2017schreibersite
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: p-coconcentrates-with-carbon
  classification: primary
  description: The real og-03 thermophoretic pore enriches phosphate alongside carbon
    (species-agnostic Soret+convection trap) — overlap reported as a boundary, not
    a fitted target.
  measure:
    kind: cross_run
    detail: og-03 pore enrichment vs the carbon co-concentration floor; P reactive-availability
      at that enrichment
  pass_if:
    op: arms_reported
    detail: the same pore regime co-concentrates P with C (enrichment >= carbon floor
      AND P reactive-availability positive)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - baaske2007extreme
  - mast2010thermal
  gate_class: acceptance_criterion
- name: open-pore-no-enrichment-control
  classification: primary
  description: An open pore / no thermal gradient (enrichment = 1) lets precipitation
    win — reactive-P availability collapses (net < 0, phosphate precipitates before
    it is useful). The feature ablation.
  measure:
    kind: cross_run
    detail: favorable enriched pore vs open-pore / no-gradient control
  pass_if:
    op: controls_absent
    detail: reactive-P availability collapses (net <= 0
    ~fully precipitated) without enrichment: null
  units: mole/second
  requires_simulation: 'yes'
  cites:
  - pasek2017schreibersite
  gate_class: acceptance_criterion
- name: p-mass-conserved
  gate_class: regression_pin
  classification: diagnostic
  description: The closed P-speciation network conserves total phosphorus (|total
    P - supplied| / supplied ~ machine epsilon).
  measure:
    kind: derived
    path: phosphorus_p_mass_residual
    detail: max |total P - supplied| / supplied
  pass_if:
    op: <=
    value: 1.0e-06
    detail: P-mass residual small (P-atom-conserving network)
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
