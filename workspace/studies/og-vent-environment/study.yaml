    units: dimensionless
  explanation: >-
    Direct PHREEQC probe: at olivine_rate 0.15 / DIC 2 mM, fe 0.25 gives 4.6 mmol/kg H2 (pe -9.6) while
    fe 0.10 gives 0 (pe -7.4); raising DIC to 15 mM at fe 0.25 also gives 0. This is an equilibrium-model
    statement: a kinetic (non-equilibrium) carbon-redox class on the serpentinization face would shift
    the threshold — recorded as the structural uncertainty to test next (Reaktoro / PFLOTRAN; decision
    in the investigation).
