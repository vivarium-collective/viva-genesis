behavior_tests:
- name: vent-temperature-in-lostcity-range
  classification: primary
  description: Settled outlet temperature sits in the Lost City envelope (40-91 C).
  measure:
    kind: derived
    path: settled_temperature_c
    detail: last-quartile mean outlet temperature, degrees C
  pass_if:
    op: range
    low: 40.0
    high: 91.0
    detail: settled T in [40, 91] C
  units: degC
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - ludwig2006formation
  gate_class: acceptance_criterion
- name: h2-flux-sustained
  classification: primary
  description: Real PHREEQC serpentinization delivers a sustained, non-collapsing H2 source.
  measure:
    kind: derived
    path: min_sustained_H2_flux
    detail: minimum H2 source flux over the back half of the run
  pass_if:
    op: '>'
    value: 1.0e-09
    detail: min sustained H2 flux > 0
  units: mole/second
  requires_simulation: 'yes'
  cites:
  - schwander2023serpentinization
  gate_class: acceptance_criterion
- name: charge-conserved
  classification: primary
  description: PHREEQC balances charge every step (charge_neutrality invariant).
  measure:
    kind: derived
    path: max_abs_charge_imbalance
    detail: worst-case |charge imbalance| over the run (eq/kgw)
  pass_if:
    op: <=
    value: 1.0e-06
    detail: '|charge imbalance| < 1e-6 throughout'
  units: eq/kgw
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: spatial-flux-conserved
  classification: primary
  description: FiPy finite-volume transport conserves flux (spatial_flux_conservation invariant).
  measure:
    kind: derived
    path: max_flux_divergence_residual
    detail: worst-case normalized FVM flux-divergence residual over the run
  pass_if:
    op: <=
    value: 0.001
    detail: max |flux divergence residual| < 1e-3 (direct LU solve ~ machine eps)
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: vent-pH-in-lostcity-range
  classification: primary
  description: >-
    Settled outlet pH sits in the Lost City envelope (9.0-10.8). Met by reacting PERIDOTITE (olivine +
    diopside pyroxene), not dunite: once Mg is consumed into serpentine/brucite, the Ca released from
    pyroxene gives the real Ca-OH-rich, high-pH endmember (tremolite/diopside-buffered), reproducing field
    pH ~9.2-9.5 at vent temperature — a genuine PHREEQC speciation result, not a tuned value.
  measure:
    kind: derived
    path: settled_pH
    detail: last-quartile mean outlet pH
  pass_if:
    op: range
    low: 9.0
    high: 10.8
    detail: settled pH in [9.0, 10.8]
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - ludwig2006formation
  gate_class: acceptance_criterion
- name: ledger-closes
  classification: primary
  description: >-
    Integrated H2 / alkalinity sources equal the accumulated pools (matter ledger exact by construction).
  measure:
    kind: derived
    path: max_ledger_mass_residual
    detail: worst-case |pool - integral| / integral over H2 and alkalinity
  pass_if:
    op: <=
    value: 1.0e-12
    detail: matter ledger residual at machine precision
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: energy-ledger-closes
  classification: primary
  description: Integrated serpentinization heat equals the accumulated heat pool.
  measure:
    kind: derived
    path: max_ledger_energy_residual
    detail: worst-case |heat pool - integrated heat| / integral
  pass_if:
    op: <=
    value: 1.0e-12
    detail: energy ledger residual at machine precision
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: heat-released-not-absorbed
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    Serpentinization is exothermic — the heat source never goes negative (energy_directionality invariant,
    previously declared but uncomputed in og-00).
  measure:
    kind: derived
    path: energy_directionality_final
    detail: 1 while the heat source has never been negative
  pass_if:
    op: '>='
    value: 1.0
    detail: directionality witness holds through the run
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
- name: dissolved-h2-in-lost-city-range
  classification: primary
  description: >-
    The canonical operating point's reacted-fluid dissolved H2 (backed out of the settled H2 flux) sits
    in the Lost City end-member range 1-15 mmol/kg.
  measure:
    kind: derived
    path: settled_dissolved_h2_mM
    detail: settled H2_flux / (flow_velocity x flux_area)
    mmol/kg: null
  params:
    flow_velocity: 0.001
    flux_area: 60.0
  pass_if:
    op: range
    low: 1.0
    high: 15.0
    detail: dissolved H2 in [1, 15] mmol/kg
  units: millimole/kilogram
  requires_simulation: 'yes'
  cites:
  - kelley2005serpentinite
  - proskurowski2008abiogenic
  gate_class: acceptance_criterion
- name: posterior-viable-vent-fraction
  classification: primary
  description: >-
    Vent-calibration exit criterion (Feasibility + Robustness): the fraction of prior draws consistent
    with every observation window that also satisfy the downstream requirements must be positive (at least
    one physically admissible, observation-consistent vent state feeds carbon fixation); the value itself
    is the deliverable.
  measure:
    kind: derived
    path: posterior_viable_fraction
    detail: viable | consistent, headline transport class, from artifacts/vent_environment_report.json
  artifact: >-
    workspace/studies/og-vent-environment/artifacts/og-cal-vent-environment/vent_environment_report.json
  pass_if:
    op: '>'
    value: 0.0
    detail: posterior-viable fraction > 0
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - kelley2005serpentinite
  - ludwig2006formation
  - proskurowski2008abiogenic
  gate_class: acceptance_criterion
- name: structure-agreement-across-transport-classes
  classification: primary
  description: >-
    Discrimination / model-form uncertainty: the convecting and prescribed-upflow transport classes must
    agree on viability for at least 80% of the prior draws, else og-00's conclusions are structure-sensitive.
  measure:
    kind: derived
    path: structure_agreement_viable
    detail: fraction of identical draws on which every class agrees about viability
  artifact: >-
    workspace/studies/og-vent-environment/artifacts/og-cal-vent-environment/vent_environment_report.json
  pass_if:
    op: '>='
    value: 0.8
    detail: cross-class agreement >= 0.8
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: sustained-reactive-flux-over-timescales
  classification: primary
  artifact: >-
    workspace/studies/og-vent-environment/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a maintained pH/redox
    gradient at or above the levels used by published vent-reactor and H2-dependent-metabolism work; the
    full time series and the onset of decay are reported, not a single terminal value.
  measure:
    kind: observable
    detail: >-
      time- and space-resolved H2 + inorganic-carbon flux and pH/redox gradient over transport timescales
  pass_if:
    op: threshold
    detail: delivery at or above the downstream-required level over the transport timescale
  requires_simulation: 'yes'
- name: mineral-evolution-supply-decay
  classification: primary
  artifact: >-
    workspace/studies/og-vent-environment/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Precipitation and surface passivation reduce reactive surface and throttle catalytic supply on the
    mineral-evolution timescale; the crossover time at which delivery drops below the downstream-required
    threshold is quantified.
  measure:
    kind: observable
    detail: >-
      catalytic supply / reactive surface vs. the slower mineral-evolution timescale; crossover time below
      threshold
  pass_if:
    op: threshold
    detail: crossover time quantified (depleting-supply behaviour characterised)
  requires_simulation: 'yes'
- name: electrochemical-driving-force-verified
  classification: secondary
  description: >-
    The cross-interface electrical driving force is non-trivial and of the sign/scale needed to drive
    CO2 reduction, verified independently by a FEniCSx Nernst–Planck solve against the FiPy transport
    result.
  measure:
    kind: observable
    detail: interface potential from FiPy transport vs. independent FEniCSx Nernst–Planck solve
  pass_if:
    op: threshold
    detail: non-trivial driving force, cross-solver agreement to tolerance
  requires_simulation: 'yes'
- name: coupled-conservation
  classification: secondary
  artifact: >-
    workspace/studies/og-vent-environment/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Mass, charge and energy close across the coupled PHREEQC+FiPy+Reaktoro solve to tolerance with no
    untracked feeds.
  measure:
    kind: observable
    detail: C/H/O/charge/energy residuals across the coupled solve
  pass_if:
    op: threshold
    detail: residuals within tolerance; no untracked feed
  requires_simulation: 'yes'
- name: handoff-27-to-29-complete
  classification: secondary
  description: >-
    The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic activities,
    catalyst (mineral-surface) state and time-dependent feeds — as the typed boundary condition study
    29 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 27→29 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 27→29 handoff validator)
  requires_simulation: 'yes'
- name: dic-crossover-sweep
  classification: primary
  description: >-
    A dense fluid_dic sweep across the PHREEQC SI=0 crossover characterizes the supply-vs-throttle two-regime
    behavior and whether any operating point sustains flux AND exercises throttling with the pore open
    (the calibration that resolves needs_calibration).
  measure:
    kind: observable
    detail: H2 flux / precipitation / accessibility / porosity vs fluid_dic across SI=0
    ledger closure: null
  pass_if:
    op: threshold
    detail: >-
      the crossover is characterized with the ledger closing at every point (window_exists resolved either
      way)
  requires_simulation: 'yes'
findings:
- id: og00-temperature-ph-in-window
  kind: computational
  status: confirms
  statement: >-
    Outlet settles at 50.6 °C and pH 9.37 — both inside the Lost City field window (40–91 °C, 9.0–10.8).
  evidence:
    from_test: vent-temperature-in-lostcity-range
    observed: T=50.6 °C, pH=9.37
    units: °C / pH
  expected:
    cites:
    - kelley2001offaxis
    - ludwig2006formation
  explanation: >-
    Real PHREEQC peridotite serpentinization (Ca-OH endmember) + FiPy transport; pH is a genuine speciation
    result, not tuned.
- id: og00-h2-sustained
  kind: computational
  status: confirms
  statement: >-
    Serpentinization delivers a sustained H2 reducing-power flux (min 2.75e-4 mol/s over the back half
    of the run).
  evidence:
    from_test: h2-flux-sustained
    observed: 2.75e-4 mol/s
    units: mole/second
  expected:
    cites:
    - schwander2023serpentinization
- id: og00-conservation
  provenance:
    run_ids:
    - viva_genesis.composites.vent_reactor.serpentinizing_vent_reactor__1791945139__b33a98
  kind: computational
  status: confirms
  statement: >-
    PHREEQC charge balance is conserved exactly (|charge|=0) and the FiPy FVM spatial-flux divergence
    is held to 4.9e-5 — within the 1e-3 contract tolerance (not machine epsilon).
  evidence:
    from_test: charge-conserved
    observed: '|charge|=0, |flux residual|=4.9e-5 (within 1e-3 tol)'
- id: og00-peridotite-endmember
  kind: methodological
  status: novel
  statement: >-
    The Lost City pH endmember required reacting PERIDOTITE (olivine+pyroxene), not dunite — Ca released
    once Mg is consumed buffers the fluid to pH ~9.5.
  explanation: >-
    Olivine-only buffers at ~7.8 (brucite); adding diopside gives the Ca-OH endmember that reproduces
    field pH.
  expected:
    cites:
    - kelley2005serpentinite
    - ludwig2006formation
- id: og00-buoyant-convection
  kind: computational
  status: novel
  statement: >-
    The vent wall convects. Solving Darcy–Boussinesq porous flow (a stream-function Poisson ∇²ψ = −buoyancy·∂T/∂x
    on the real FiPy mesh) gives a buoyant recirculation cell — the hot alkaline conduit rises, the cold
    ocean sinks, convective velocities ~5× the background upflow (Peclet ~8) — rather than a prescribed
    uniform upflow. The recirculation mixes cold ocean inward, settling the outlet ~8 °C cooler (59 →
    51 °C) while staying inside the Lost City window; flux conservation is preserved within the solver
    tolerance (flux residual ~5e-5, within the 1e-3 bound).
  evidence:
    from_test: spatial-flux-conserved
    observed: recirculation cell (cold-left sinks, hot-right rises); vmax ~5× background; outlet 50.6
      °C
    units: dimensionless
  expected:
    cites:
    - kelley2001offaxis
    - ludwig2006formation
  explanation: >-
    FipyReactiveTransportProcess now solves the stream function each step and advects T + solute with
    the divergence-free Darcy velocity (u=∂ψ/∂y, v=−∂ψ/∂x + upflow); ψ contours are the streamlines the
    cross-section viz overlays. buoyancy=0 recovers the old constant upflow.
- id: og00-habitability-window
  seeded_study: og-00b-ph-endmember-sweep
  kind: computational
  status: novel
  statement: >-
    Habitability is a bounded REGION of the (olivine reaction rate × flow velocity) operating space, not
    one tuned run — the real PHREEQC + FiPy vent settles inside the Lost City window (T 40–91 °C AND pH
    9.0–10.8 AND H2>0) over ~80% of the swept grid (115/144 points). The FAIL regions are a cold-washout
    band at the fastest flow (17 cold points) and 12 points at the flow extreme that fall outside PHREEQC's
    0–100 °C validity (recorded NaN → FAIL); the baseline operating point sits safely inside the window.
  evidence:
    from_test: vent-temperature-in-lostcity-range
    observed: >-
      115/144 (80%) habitable over (olivine_rate 0.005–0.4 × flow_velocity 2e-4–3e-2); 17 cold-washout
      FAILs, 12 out-of-range NaN; baseline (★) in-window at 50.6 °C / pH 9.37
    units: dimensionless
  expected:
    cites:
    - kelley2001offaxis
    - ludwig2006formation
  explanation: >-
    The vent_habitability_phase_map sweeps the real serpentinizing reactor and reduces each point to the
    habitability PASS flag (settled outlet in-window with a positive H2 flux); rendered as the Lost City
    habitability map (Decision view). Enough serpentinization to drive H2 + alkalinity and slow enough
    flow to hold 40–91 °C / pH 9.0–10.8 bounds the habitable band.
  next_action: >-
    Sweep pyroxene_fraction (ol/px ratio) and seawater-mixing dilution to bound the pH endmember (og-00b).
  next_action_type: calibrate
- id: ogcal-posterior-viable-fraction
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: confirms
  statement: >-
    Feasibility and robustness, in the plan's sense: 6/48 prior draws (12.5%) settle inside every Lost
    City window, and 6/6 of those (posterior-viable fraction 1.00) also satisfy og-01's requirements —
    dissolved H2 >= 1 mM at the interface, pH gradient >= 3 units against pH 6.0, T <= 100 C. One supporting
    parameterization: flow 3.2e-4 m/s, olivine_rate 0.38, pyroxene 0.54, fe 0.26, heat partition 6.2e-4,
    DIC 1.4 mM -> 49.2 C, pH 9.38, H2 10.8 mmol/kg, delta pH 3.38.
  evidence:
    from_test: posterior-viable-vent-fraction
    observed: consistent 6/48; viable|consistent 1.00 (both transport classes)
    units: dimensionless
  explanation: >-
    ABC rejection on the vg-data windows (outlet T 40-91 C; pH 9.0-10.8; H2 1-15 mmol/kg) over a 48-point
    Latin-hypercube prior of the six free parameters of the real PHREEQC + FiPy world, then the downstream-requirement
    mask on the accepted set. Artifact: artifacts/vent_environment_report.json.
  expected:
    cites:
    - kelley2001offaxis
    - kelley2005serpentinite
    - ludwig2006formation
    - proskurowski2008abiogenic
- id: ogcal-h2-is-the-binding-observation
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: novel
  statement: >-
    The dissolved-H2 window binds: 48/48 draws pass the pH window, 47/48 the temperature window, only
    6/48 the H2 window (39 fall below 1 mmol/kg, 3 above 15). The posterior narrows the inflowing DIC
    from the prior 1.2-17 mM to 1.2-2.9 mM and pushes the reaction extent high (olivine_rate 0.09-0.38
    vs prior 0.02-0.35), with fe_fraction 0.14-0.26. Mechanism: at full redox equilibrium in llnl.dat
    the Fe(II) budget first reduces the fluid's DIC (toward CH4 — Lost City's abiogenic methane); free
    dissolved H2 appears only once that carbon sink is exhausted, so H2 is a threshold in (fe_fraction
    x olivine_rate) / DIC, not a smooth function of the Fe budget.
  evidence:
    from_test: dissolved-h2-in-lost-city-range
    observed: >-
