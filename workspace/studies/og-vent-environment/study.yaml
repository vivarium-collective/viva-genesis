- id: ogcal-ph-is-buffered-not-discriminating
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: novel
  statement: >-
    Outlet pH is 9.38-9.91 for every one of the 96 runs regardless of flow, reaction extent, DIC or Fe
    budget — the peridotite (Ca-OH / tremolite-diopside) assemblage buffers it, so the pH observation
    accepts the whole prior and carries no information about the parameters. Morris mu* for pH is <= 0.11
    on every parameter (vs 23 for H2 on olivine_rate). og-00's "pH in window" gate is therefore a reproduction
    of the buffer, not a constraint on the vent's operating point.
  evidence:
    from_test: posterior-viable-vent-fraction
    observed: pH range 9.38-9.91 over 96 runs; mu*(pH) <= 0.108; pH window accepts 48/48
    units: dimensionless
  expected:
    cites:
    - kelley2005serpentinite
    - ludwig2006formation
- id: ogcal-transport-class-does-not-change-the-verdict
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: confirms
  statement: >-
    Discrimination, in the plan's sense: the convecting (Darcy-Boussinesq) and prescribed-uniform-upflow
    FiPy classes agree on consistency and viability for 48/48 identical draws (structure agreement 1.00,
    model-form uncertainty 0.00). They are told apart only by outlet temperature (paired standardised
    difference d = 0.89; convection settles ~2 C warmer at nx = 20), not by pH (d = -0.54 at a 0.02-unit
    scale), dissolved H2 (d = 0.00) or pe (0.06). Whether the wall convects is a structural choice og-00's
    conclusions do not depend on.
  evidence:
    from_test: structure-agreement-across-transport-classes
    observed: agreement 1.00 on viability; d(T) = 0.89, d(H2) = 0.00
    units: dimensionless
  explanation: >-
    Same 48 draws run through model_spatial_transport = fipy and fipy_uniform_upflow (buoyancy 0); the
    serpentinization source is identical, and the outlet pH/H2 are set by speciation, not by the wall's
    flow pattern. The FEniCS class (a merged dolfinx alternative, run under viva-fenics's pixi env) is
    a third available class on this axis, held out of this uv-.venv ensemble — not a forthcoming addition.
  expected:
    cites:
    - kelley2001offaxis
- id: ogcal-morris-screening
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: novel
  statement: >-
    Morris screening (r = 4 trajectories, 28 world runs): dissolved H2 is controlled by olivine_rate (mu*
    23.0), fluid DIC (20.8) and flow (16.9), weakly by fe_fraction (3.1), not at all by pyroxene fraction
    or heat partition; outlet temperature by the heat-partition fraction (2.16), flow (1.47) and olivine_rate
    (0.84). The two conditioning readouts that carry information (T, H2) are controlled by disjoint parameters,
    so the posterior factorises: T pins heat_to_fluid_fraction, H2 pins the Fe-budget-to-DIC ratio.
  evidence:
    from_test: posterior-viable-vent-fraction
    observed: >-
      mu*(H2): olivine_rate 23.0, fluid_dic 20.8, flow 16.9, fe 3.1; mu*(T): heat_to_fluid 2.16, flow
      1.47, olivine 0.84
    units: dimensionless
  explanation: >-
    Elementary effects on the log-scaled prior bounds of the vg-data package; artifact ensemble.morris.
- id: ogcal-ledger-exact
  provenance:
    run_ids:
    - viva_genesis.composites.geochemical_world.geochemical_world__1792035577__f4b955
  kind: computational
  status: confirms
  statement: >-
    Numerical verification: the ConservationLedgerProcess closes exactly on all 96 ensemble runs and on
    the 120-tick canonical run — integrated H2 / alkalinity / heat sources equal the accumulated pools
    bit-for-bit (residual 0.0), PHREEQC charge imbalance 0, FiPy flux-divergence residual <= 1.1e-14,
    and serpentinization heat is released, never absorbed (energy_directionality 1). No prior draw was
    rejected by PHREEQC (0 failed points), so the posterior is not truncated by engine validity.
  evidence:
    from_test: ledger-closes
    observed: mass residual 0.0; energy residual 0.0; charge 0; flux <= 1.1e-14; 0/96 failed
    units: dimensionless
  explanation: >-
    The og-00 contract's four invariants (mass_balance, charge_neutrality, spatial_flux_conservation,
    energy_directionality) are now all machine-witnessed; energy_directionality was previously declared
    but not computed.
- id: og27-dic-crossover-bounded-window
  kind: computational
  status: novel
  statement: >-
    The interface's supply↔throttle behavior is a sharp two-regime cliff, not a gradual depletion: across
    a dense fluid_dic sweep (2–20 mM) real PHREEQC carbonate saturation crosses SI=0 at ~3.2 mM, and the
    interface either SUPPLIES (undersaturated, SI<0: H2 flux 2.75e-4 → 3.55e-5 from 2.0 → 3.0 mM, no precipitation,
    pore open at porosity 0.96–0.97) OR THROTTLES-AND-CHOKES (supersaturated, SI≥+0.7: precipitation 0.23–0.29
    and catalytic-accessibility drop ~0.12, but H2 flux crashes four orders to ~1e-8 and porosity collapses
    to 0) — never both. No fluid_dic sustains flux AND exercises throttling with the pore open (window_exists=False),
    so the self-limiting carbonate chemistry forces the vent operating point into the undersaturated regime.
    The free-energy/mass/charge ledger closes at every sweep point.
  evidence:
    from_test: dic-crossover-sweep
  expected:
    cites: []
    uncitable: true
- id: og27-sustained-reactive-flux
  kind: computational
  status: planned
  statement: >-
    Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a maintained pH/redox
    gradient at or above the levels used by published vent-reactor and H2-dependent-metabolism work; the
    study reports the full time series and the onset of decay, not a single terminal value.
  evidence:
    from_test: sustained-reactive-flux-over-timescales
  expected:
    cites:
    - herschy2014originreactor
    - preiner2020hydrogen
- id: og27-mineral-evolution-throttles-supply
  kind: computational
  status: planned
  statement: >-
    Precipitation and surface passivation reduce reactive surface and throttle catalytic supply on the
    mineral-evolution timescale — the interface is depleting, and the study quantifies the crossover time
    at which delivery drops below the downstream-required threshold.
  evidence:
    from_test: mineral-evolution-supply-decay
  expected:
    cites:
    - varma2018native
    - naturecomms2024ironsulfide
- id: og27-electrochemical-driving-force
  kind: computational
  status: planned
  statement: >-
    The cross-interface electrical driving force is non-trivial and of the sign/scale needed to drive
    CO2 reduction, verified independently by a FEniCSx Nernst–Planck solve against the FiPy transport
    result.
  evidence:
    from_test: electrochemical-driving-force-verified
- id: og27-coupled-conservation-ledger
  kind: computational
  status: planned
  statement: >-
    Mass, charge and energy close across the coupled PHREEQC+FiPy+Reaktoro solve to tolerance with no
    untracked feeds.
  evidence:
    from_test: coupled-conservation
- id: og27-handoff-bundle-to-29
  kind: methodological
  status: planned
  statement: >-
    The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic activities,
    catalyst (mineral-surface) state and time-dependent feeds — as the typed boundary condition study
    29 consumes.
  evidence:
    from_test: handoff-27-to-29-complete
