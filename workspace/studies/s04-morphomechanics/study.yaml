      detail: 'Seed-mean largest_cluster_fraction at the 40-update window is non-decreasing in adhesion (adh 0.0: mean lcf 0.194; adh 0.3: mean lcf 0.565; adh 0.5: mean lcf 1.000; adh 0.62: mean lcf 1.000; adh 0.75: mean lcf 1.000; adh 0.9: mean lcf 1.000; adh 0.95: mean lcf 1.000) across 3 seeds per point; the zero-adhesion control fractures (n_propagules [16, 11, 12], largest_cluster_fraction [0.078, 0.267, 0.239], all < 0.5) while adhesion >= 0.5 stays a single propagule in every seed. Per-seed series are not strictly monotone (seed 2: 0.0->0.3 0.267->0.262): graded on the seed-mean, the 0.0->0.3 seed-2 dip is within replicate noise. Transient, quasi-static readout (re-merges past ~80 updates); adhesion is the only swept knob.'
