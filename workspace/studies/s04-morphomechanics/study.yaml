    divide_threshold: 55.0
    n_steps: 40
  note: Spatial CPM clonal cluster (Rust viva-cpm); adhesion sets homotypic contact energy. Measured at the pinned 40-update window. n_steps=40 pins the transient window (the runner ignores the composite default_n_steps).
