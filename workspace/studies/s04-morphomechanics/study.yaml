schema_version: 4
name: s04-morphomechanics
investigation: multicellularity
created: '2026-11-01'
title: Morphomechanics
phase: Simulate
status: investigating
design_status: drafted
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
topic: multicellularity
tags:
- seed
- planned
- multicellularity
concept: emergence of multicellularity
question: How do cell aspect ratio, branch topology, packing and bond strength set collective toughness and propagule size? (Q2)
hypothesis: Varying aspect ratio, branch topology, packing and bond strength predicts toughness and propagule-size distributions; mechanics backends agree on the summary observables (C4).
claim: 'Cell adhesion (homotypic contact energy) sets collective toughness: a clonal CPM cluster under growth-driven stress stays one cohesive propagule at strong adhesion and fractures into multiple propagules at weak adhesion. UNPROVEN until the adhesion x seed sweep is graded; aspect ratio, branch topology and cross-backend agreement (C4) are not tested here.'
behavior_tests:
- name: propagule-toughness-predicted
  classification: primary
  description: 'Vary cell aspect ratio, branch topology, packing and bond strength; compare mechanics backends. Decision criterion: predict toughness and propagule-size distributions.'
acceptance_criteria: []
findings:
- id: s04-propagule-toughness-adhesion
  statement: 'In a Rust CPM clonal growth world, adhesion sets propagule toughness: seed-mean largest_cluster_fraction is 0.19 at adhesion 0, 0.57 at 0.3 and 1.0 (a single propagule) for adhesion >= 0.5; the zero-adhesion control fractures into 11-16 propagules.'
  status: confirms
  kind: computational
  from_test: propagule-toughness-predicted
  inferential_scope: Transient (~40-update), quasi-static readout of one CPM backend (viva-cpm); adhesion is the only swept knob (aspect ratio, topology, packing and cross-backend agreement untested). Fracture re-merges past ~80 updates.
literature_anchors:
- source: Bozdag et al. 2023, Nature
  cites:
  - bozdag2023denovo
  status_in_workspace: proposed
- source: Bozdag et al. 2023 data/code (GitHub)
  cites:
  - bozdag2023data
  status_in_workspace: proposed
- source: NCBI SRA PRJNA943273
  cites:
