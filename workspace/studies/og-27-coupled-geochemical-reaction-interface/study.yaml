    detail: residuals within tolerance; no untracked feed
  requires_simulation: 'yes'
- name: handoff-27-to-29-complete
  classification: secondary
  description: The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic
    activities, catalyst (mineral-surface) state and time-dependent feeds — as the typed boundary
    condition study 29 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 27→29 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 27→29 handoff validator)
  requires_simulation: 'yes'
- name: dic-crossover-sweep
  classification: primary
  description: A dense fluid_dic sweep across the PHREEQC SI=0 crossover characterizes the
    supply-vs-throttle two-regime behavior and whether any operating point sustains flux AND
    exercises throttling with the pore open (the calibration that resolves needs_calibration).
  measure: {kind: observable, detail: H2 flux / precipitation / accessibility / porosity vs fluid_dic across SI=0, ledger closure}
  pass_if: {op: threshold, detail: the crossover is characterized with the ledger closing at every point (window_exists resolved either way)}
  requires_simulation: 'yes'
decision_test: >-
  PROCEED to coupling study 29 only if the interface sustains reactive flux — H2 + inorganic-carbon
  delivery and gradients above the downstream-required threshold — over BOTH the transport and the
  mineral-evolution timescales, with conservation ledgers intact. If supply decays below threshold
  before the network can turn over, that is a reported negative result that bounds where and when the
  interface is viable and reshapes downstream scope — it is not tuned away (evidence standard #8).
findings:
- id: og27-dic-crossover-bounded-window
  kind: computational
  status: novel
  statement: "The interface's supply↔throttle behavior is a sharp two-regime cliff, not a gradual depletion: across a dense fluid_dic sweep (2–20 mM) real PHREEQC carbonate saturation crosses SI=0 at ~3.2 mM, and the interface either SUPPLIES (undersaturated, SI<0: H2 flux 2.75e-4 → 3.55e-5 from 2.0 → 3.0 mM, no precipitation, pore open at porosity 0.96–0.97) OR THROTTLES-AND-CHOKES (supersaturated, SI≥+0.7: precipitation 0.23–0.29 and catalytic-accessibility drop ~0.12, but H2 flux crashes four orders to ~1e-8 and porosity collapses to 0) — never both. No fluid_dic sustains flux AND exercises throttling with the pore open (window_exists=False), so the self-limiting carbonate chemistry forces the vent operating point into the undersaturated regime. The free-energy/mass/charge ledger closes at every sweep point."
  evidence: {from_test: dic-crossover-sweep}
  expected: {cites: [], uncitable: true}
- id: og27-sustained-reactive-flux
  kind: computational
  status: planned
  statement: Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a
    maintained pH/redox gradient at or above the levels used by published vent-reactor and
    H2-dependent-metabolism work; the study reports the full time series and the onset of decay, not a
    single terminal value.
  evidence: {from_test: sustained-reactive-flux-over-timescales}
  expected: {cites: [herschy2014originreactor, preiner2020hydrogen]}
