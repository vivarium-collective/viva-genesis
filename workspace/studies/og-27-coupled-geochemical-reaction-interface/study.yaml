title: Coupled Geochemical Reaction Interface
claim: >-
  An evolving mineral–water interface at a Lost City–type vent can be modeled as a coupled
  geochemical reactor whose precipitation, dissolution and surface passivation reshape — not
  merely sustain — its delivery of H2, inorganic carbon, pH/redox gradients and catalytic
  surface. Whether that delivery stays above the level a downstream reaction network needs,
  and for how long before mineral evolution throttles it, is the quantity this study measures;
  sustained reactive flux is a result to demonstrate, not an assumption.
question: >-
  Can an evolving mineral–water interface sustainably supply carbon, H2, chemical gradients and
  catalysis to a prebiotic reaction network — and over what timescale, before mineral evolution
  (precipitation, passivation) chokes that supply?
hypothesis: >-
  A cell-resolved coupling of aqueous speciation (PHREEQC/PhreeqcRM), reactive transport (FiPy)
  and multiphase mineral equilibrium (Reaktoro), with explicit precipitation/dissolution and
  surface-passivation dynamics, will show H2, inorganic-carbon and gradient delivery sustained
  over transport timescales but declining on the slower mineral-evolution timescale as reactive
  surfaces passivate — i.e. the interface is a depleting supply with a measurable crossover time,
  not a perpetual one.
objective: >-
  Build a cell-resolved geochemical reaction interface that evolves its own mineral surfaces, and
  quantify the time- and space-resolved supply of reducing power, carbon, gradients and catalytic
  surface it hands to the downstream network (study 29), with closed mass/charge/energy ledgers.
# Verbatim plan dependencies (handoff contracts wired by genesis-writer after scaffolding).
# 14, 15 have no scaffolded slug yet; recorded numeric-only — parent_studies holds the resolvable deps.
builds_on: [0, 1, 14, 15]
plan_id: 27
# Machine-checkable handoff contract (read by viva_genesis/handoff/validate.py).
# The prose handoff findings above are the human record; this is the audited contract.
handoff:
  emits:
  - {to: 29, provides: [H2 flux, inorganic carbon flux, pH, T, ionic activities, catalyst state, time-dependent feeds]}
  receives: []
proposed_mechanisms:
- serpentinization-driven H2 + alkalinity generation at the vent wall
- mixing-controlled pH/redox/ionic-activity gradients across the interface
- mineral precipitation/dissolution that opens and closes reactive porosity
- surface passivation degrading catalytic accessibility over time
proposed_models_methods:
- 'PHREEQC/PhreeqcRM cell-resolved aqueous speciation + mineral reactions  [build_status: wrapper-needed]'
- 'FiPy finite-volume multispecies reactive transport                      [in-workspace: viva_genesis.transport]'
- 'Reaktoro multiphase equilibrium cross-check                             [in-workspace: viva_genesis.geochemistry]'
- 'FEniCSx Poisson/Nernst–Planck verification of electrochemical driving forces [exists: viva_fenics]'
- PetDB/EarthChem rock & mineral constraints for boundary composition
model_approach:
  prose: >-
    This study turns the og-00 vent-reactor baseline from a fixed-boundary testbed into an interface
    that evolves. The new, to-build piece is mineral-surface dynamics — precipitation, dissolution,
    adsorption and passivation that change reactive porosity and catalytic area as the run proceeds —
    coupled cell-by-cell to speciation and reactive transport. Every physical input (fluid end-members,
    mineral assemblage, flow) is sourced to field/geochemical constraints, not tuned; the interface
    is driven, never fed an untracked supply. Reactive flux is reported as time- and space-resolved
    series with conservation ledgers, so a decline is visible rather than hidden in a terminal average.
# Tools at their TRUE build status (workspace/references/build-registry.yaml); not upgraded.
tools:
- {id: viva-fenics, build_status: exists, role: FEM Poisson/Nernst-Planck verification}
- {id: viva-reaktoro, build_status: in-workspace, role: multiphase equilibrium + reactive geochemistry}
- {id: viva-phreeqc, build_status: wrapper-needed, role: cell-resolved aqueous speciation (PhreeqcRM)}
- {id: viva-fipy, build_status: in-workspace, role: finite-volume reactive transport}
- {id: mineral-surface-dynamics, build_status: to-build, role: dissolution/precipitation/passivation + catalyst-state ledger}
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      reactive_flux:
        _type: float
        _units: mol/second
      interface_potential:
        _type: float
        _units: volt
      catalyst_accessibility:
        _type: float
        _units: dimensionless
  conditions:
  - kind: invariant
    name: mass_charge_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O)+abs(residual_charge) < tol
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports + conservation predicates; the composite built for this study must
    declare a ProcessContract matching this face (audited via the workbench §Contract panel).
behavior_tests:
- name: sustained-reactive-flux-over-timescales
  classification: primary
  artifact: workspace/studies/og-27-coupled-geochemical-reaction-interface/artifacts/interface_report.json
  description: Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a
    maintained pH/redox gradient at or above the levels used by published vent-reactor and
    H2-dependent-metabolism work; the full time series and the onset of decay are reported, not a single
    terminal value.
  measure:
    kind: observable
    detail: time- and space-resolved H2 + inorganic-carbon flux and pH/redox gradient over transport
      timescales
  pass_if:
    op: threshold
    detail: delivery at or above the downstream-required level over the transport timescale
  requires_simulation: 'yes'
- name: mineral-evolution-supply-decay
  classification: primary
  artifact: workspace/studies/og-27-coupled-geochemical-reaction-interface/artifacts/interface_report.json
  description: Precipitation and surface passivation reduce reactive surface and throttle catalytic
    supply on the mineral-evolution timescale; the crossover time at which delivery drops below the
    downstream-required threshold is quantified.
  measure:
    kind: observable
    detail: catalytic supply / reactive surface vs. the slower mineral-evolution timescale; crossover
      time below threshold
  pass_if:
    op: threshold
    detail: crossover time quantified (depleting-supply behaviour characterised)
  requires_simulation: 'yes'
- name: electrochemical-driving-force-verified
  classification: secondary
  description: The cross-interface electrical driving force is non-trivial and of the sign/scale needed
    to drive CO2 reduction, verified independently by a FEniCSx Nernst–Planck solve against the FiPy
    transport result.
  measure:
    kind: observable
    detail: interface potential from FiPy transport vs. independent FEniCSx Nernst–Planck solve
  pass_if:
    op: threshold
    detail: non-trivial driving force, cross-solver agreement to tolerance
  requires_simulation: 'yes'
- name: coupled-conservation
  classification: secondary
  artifact: workspace/studies/og-27-coupled-geochemical-reaction-interface/artifacts/interface_report.json
  description: Mass, charge and energy close across the coupled PHREEQC+FiPy+Reaktoro solve to tolerance
    with no untracked feeds.
  measure:
    kind: observable
    detail: C/H/O/charge/energy residuals across the coupled solve
  pass_if:
    op: threshold
    detail: residuals within tolerance; no untracked feed
  requires_simulation: 'yes'
- name: handoff-27-to-29-complete
  classification: secondary
  description: The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic
    activities, catalyst (mineral-surface) state and time-dependent feeds — as the typed boundary
    condition study 29 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 27→29 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 27→29 handoff validator)
  requires_simulation: 'yes'
decision_test: >-
  PROCEED to coupling study 29 only if the interface sustains reactive flux — H2 + inorganic-carbon
  delivery and gradients above the downstream-required threshold — over BOTH the transport and the
  mineral-evolution timescales, with conservation ledgers intact. If supply decays below threshold
  before the network can turn over, that is a reported negative result that bounds where and when the
  interface is viable and reshapes downstream scope — it is not tuned away (evidence standard #8).
