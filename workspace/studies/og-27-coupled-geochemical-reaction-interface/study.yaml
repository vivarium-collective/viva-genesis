  and what passivation law for the evolving surface?
runs:
- name: gate-a-execution
  status: completed
  timestamp: 1792285919.102866
  params: {nx: 20}
  outcomes:
    sustained-reactive-flux-over-timescales:
      result: PASS
      measured_value: 0.0002742
      detail: H2 source flux sustained (0 -> 2.74e-4 mol/s) over the transport timescale; conservation holds.
