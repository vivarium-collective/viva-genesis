limitations:
- Mineral-evolution throttling criterion unexercised - at the current undersaturated operating point (SI -15 to -17) the system is in a dissolution regime (porosity opens, no precipitation/passivation). Serpentinization reaches carbonate/brucite supersaturation (Lost City chimney precipitation), so the throttling half of the decision test requires a supersaturating operating point (higher Ca/Mg/DIC or pH) - named follow-up.
