title: 'The Adversarial Control'
question: Does a generic nonequilibrium chemical system with no vent-specific features (no sustained H2, no Fe/Ni/S catalytic interface, no pore concentration) pass the vent-specific gates? It SHOULD NOT.
hypothesis: The og-01/og-02/og-03 gates REJECT this control; if they pass it, the gates measure generic nonequilibrium chemistry, not the vent mechanism.
objective: Run the og-01..03 behavior tests on a vent-feature-ablated control; the campaign's gates must reject it, and the vent must pass the same tests.
claim: The og-01/02/03 gates are vent-specific and falsifiable. A generic nonequilibrium control — the SAME real composites with no sustained H2, no Fe/Ni/S catalytic interface and no pore concentration — is rejected by every discriminating gate (carbon flux, formate yield, protometabolic throughput, thermophoretic Péclet, enrichment), while the vent passes all five. So a PASS elsewhere in the campaign certifies the vent MECHANISM, not merely "some nonequilibrium chemistry".
result: All five discriminating gates reject the generic control (tightest margin 1.8 decades below threshold) and the vent passes all five — the campaign's gates are falsifiable and vent-specific.
findings:
- id: ogadv-gates-reject-generic
  kind: methodological
  status: confirms
  statement: Every vent-specific gate rejects the generic control. Running the real og-01/02/03 composites with no sustained H2, no Fe/Ni/S catalyst and no pore concentration, all five discriminating gates fall below threshold — net C-flux 4e-13 vs 1e-6 mol/s; formate ~0 vs 50 mM; protometabolic throughput 3e-13 vs 1e-6 mol/s; accumulation Péclet 0.26 vs 18; enrichment 1.3 (generic) vs the vent clearing the ≥10⁶-fold gate (a reduced-model magnitude, solver-sensitive above Pe ≈ 13; see og-03) — the tightest by 1.8 decades. The vent passes all five.
  evidence:
    from_test: gates-reject-generic
    observed: 'min rejection margin 1.84 decades (tightest gate: og-03 accumulation Péclet, generic 0.26 < 18); all 5 gates reject generic, vent passes all 5'
    units: decades
  expected:
    cites: [sutherland2017opinion]
  explanation: The vent features are PARAMETERS on the same real composites, so the control is a parameterization of the vent models, not a hand-tuned mock. No dissolved H2 → no CO2 reduction; no Fe/Ni/S interface → no abiotic carbon fixation; an open pore → no thermophoretic concentration.
- id: ogadv-vent-specificity
  kind: methodological
  status: novel
  statement: The gates are vent-specific detectors, not generic nonequilibrium detectors — the vent passes where the control fails on each of the five gates. A PASS therefore certifies the vent mechanism (sustained H2 + Fe/Ni/S catalysis + pore concentration), falsifying the "the gates just measure any driven chemistry" objection.
  evidence:
    from_test: vent-specificity-demonstrated
    observed: 'vent passes 5/5 gates; generic control fails 5/5 — pass-where-control-fails on every gate'
    units: dimensionless
  explanation: Falsification exposure for the whole investigation — the headline claims would be hollow if a feature-ablated control cleared the same bars. It does not.
- id: ogadv-catalyst-control-integrity
  kind: methodological
  status: novel
  statement: Building the control exposed a latent control-integrity bug — catalyst_active=0 was silently swallowed by process-bigraph's is_empty(Float, 0.0) and refilled with the default, so the no-catalyst control (here AND in og-01's cross-run gate) secretly ran WITH full catalyst. Clamping to 1e-6 honors the control; og-01's gates still pass (9/9 + both cross-run) with the now-truthful control.
  evidence:
    observed: 'no-catalyst formate dropped from ~0.014 mM (catalyst silently on) to ~2e-8 mM (honored); og-01 still PASS'
    units: dimensionless
  explanation: Same gotcha as og-04's mix_fraction=0; a control parameter set to exactly 0.0 must be clamped to a negligible floor so the ablation is real.
report:
  title: 'Adversarial control — generic nonequilibrium'
  verdict: PASS — the gates reject the generic control (all 5) and the vent passes all 5; the campaign is falsifiable and vent-specific
  confidence: high
  main_insight: A generic nonequilibrium control built by removing the vent features from the real composites is rejected by every discriminating gate, while the vent passes them all — so the campaign's gates measure the vent mechanism, not generic driven chemistry.
  conclusion: >-
    The adversarial control closes the falsifiability loop for the investigation. Running the SAME og-01/02/03
    composites with no sustained H2, no Fe/Ni/S catalytic interface and no pore concentration, all five
    discriminating gates reject it (tightest margin 1.8 decades) where the vent passes all five. A PASS
    anywhere in the campaign therefore certifies the vent mechanism rather than generic nonequilibrium
    chemistry.
  caveat: One control family (feature ablation on the three composites). Other non-vent scenarios (e.g. atmospheric or impact-driven chemistries) are not modeled; this control falsifies the "any driven chemistry passes" objection, not every alternative.
  key_metrics:
  - {label: Gates rejecting generic, value: 5 / 5, status: pass}
  - {label: Gates vent passes, value: 5 / 5, status: pass}
  - {label: Min rejection margin (decades), value: 1.84, status: pass}
  - {label: og-01 net C-flux (generic / vent), value: 4e-13 / 0.039, status: pass}
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: The generic non-vent control is rejected by every discriminating gate, while the vent passes all five — the gates are vent-specific.
  explanatory_gain:
    result: POSITIVE
    basis: Demonstrates falsification exposure for the whole investigation — the gates could have passed a feature-ablated control and did not.
limitations:
- One control family (feature ablation on the og-01/02/03 composites); alternative non-vent chemistries (atmospheric, impact, surface) are out of scope.
- The gates are lower-bound thresholds; the control is rejected by margin, not by a two-sided equivalence test.
discovery_implications:
  resolved_uncertainties:
  - The og-01/02/03 gates are vent-specific and falsifiable — a feature-ablated generic control is rejected by all five while the vent passes all five.
  remaining_uncertainties:
  - Whether broader non-vent scenario families (atmospheric/impact/surface chemistries) are also rejected.
  followup_study_proposals:
  - {study: og-adv-b, rationale: Add a second adversarial family (e.g. an atmospheric-spark or impact-plume control) and confirm the gates reject it too.}
readouts:
- {name: net_carbon_flux, store_path: flux.net_carbon_flux, units: mole/second, description: Net carbon-fixation rate of the generic control (gate reads peak), status: available}
- {name: formate, store_path: products.formate, units: molar, description: Formate produced by the generic control (gate reads settled, mM): null, status: available}
- {name: accumulation_peclet, store_path: trap.accumulation_peclet, units: dimensionless, description: Thermophoretic accumulation Péclet of the open-pore control, status: available}
- {name: enrichment_factor, store_path: trap.enrichment_factor, units: dimensionless, description: Fold enrichment of the open-pore control, status: available}
proposed_mechanisms:
- the same real og-01/02/03 composites with vent features (H2, Fe/Ni/S catalyst, pore concentration) disabled
proposed_models_methods:
- flat gradient, inert surface, open pore, well-mixed — a generic abiotic nonequilibrium mixture
- re-run the og-01/02/03 behavior-test gates unchanged and require rejection
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pH:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 14.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
      CO2:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      net_carbon_flux:
        _type: float
        _units: mole/second
      formate:
        _type: float
        _units: molar
        _min: 0.0
  conditions:
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  note: Reuses the og-01 carbon-fixation composite's ProcessContract (typed ports + conservation predicates); the control is a parameterization, so it inherits the same audited face.
behavior_tests:
- name: gates-reject-generic
  classification: primary
  description: Every vent-specific gate (og-01/02/03) rejects the feature-ablated control — it passes by being rejected.
  measure:
    kind: observable
    detail: run og-01/02/03 gates on the generic control; each measured value below its threshold
  pass_if:
    op: controls_absent
    detail: all five gates reject generic (net flux / formate / throughput / Péclet / enrichment below threshold)
  requires_simulation: 'yes'
  cites:
  - sutherland2017opinion
- name: vent-specificity-demonstrated
  classification: primary
  description: The vent passes the same five gates the control fails — pass-where-control-fails.
  measure:
    kind: observable
    detail: vent vs generic on identical gates
  pass_if:
    op: arms_reported
    detail: vent passes 5/5 where the control fails 5/5
  requires_simulation: 'yes'
  cites:
  - sutherland2017opinion
