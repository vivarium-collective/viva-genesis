schema_version: 4
name: og-adv-generic-nonequilibrium
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: 'Adversarial: generic nonequilibrium control'
question: Does a generic nonequilibrium chemical system with no vent-specific features (no sustained H2,
  no Fe/Ni/S catalytic interface, no pore concentration) pass the vent-specific gates? It SHOULD NOT.
hypothesis: The og-01/og-02/og-03 gates REJECT this control; if they pass it, the gates measure generic
  nonequilibrium chemistry, not the vent mechanism.
objective: Run the og-01..03 behavior tests on a vent-feature-ablated control; the campaign's gates must
  reject it.
proposed_mechanisms:
- same composites as og-01..03 with vent features disabled
proposed_models_methods:
- flat gradient, inert surface, well-mixed
- re-run the og-01..03 behavior_tests unchanged
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pH:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 14.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
      CO2:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      net_carbon_flux:
        _type: float
        _units: mole/second
      formate:
        _type: float
        _units: molar
        _min: 0.0
  conditions:
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built
    for this study must declare a ProcessContract matching this face (audited via the workbench §Contract
    panel).
behavior_tests:
- name: gates-reject-generic
  classification: primary
  description: The vent gates FAIL on the feature-ablated control (pass by rejecting).
  measure:
    kind: observable
    detail: og-01..03 behavior_tests on the control
  pass_if:
    op: threshold
    detail: 'they FAIL: no sustained flux / no persistence / no enrichment'
  requires_simulation: 'yes'
- name: vent-specificity-demonstrated
  classification: primary
  description: The vent arm passes the same tests the control fails.
  measure:
    kind: observable
    detail: vent arm vs control on identical tests
  pass_if:
    op: threshold
    detail: vent passes where control fails
  requires_simulation: 'yes'
  cites:
  - sutherland2017opinion
literature_anchors: []
baseline:
- name: 'Adversarial: generic nonequilibrium control'
  composite: viva_genesis.composites.og_adv_generic_nonequilibrium
  params: {}
  planned: true
parent_studies:
- study: og-02-reduced-carbon-to-protometabolism
  condition: tests-passed
key_assumptions:
- This study passes by REJECTING; a control that passes the gates means the gates are not vent-specific.
parent_relations:
- study: og-02-reduced-carbon-to-protometabolism
  relation: refutes
expert_questions:
- 'Which vent features to ablate first for the control: the gradient, the catalytic surface, or the pore
  concentration?'
kind: adversarial
