schema_version: 4
name: og-evolvable-lineages
investigation: origins-of-life-vent
created: '2026-10-19'
execution_status: completed
gate_status: passed
study_type: exploratory
title: 'Evolvable Lineages: Can a Granted Individual Evolve?'
program: transition-arc
verdict: qualified
confidence: Accepted
evidence_tier: mechanistic_prediction
primary_limitation: >-
  Evolvability here is bounded fixed-trait selection, not open-ended novelty: the inherited trait is a fixed scalar
  network-composition c in [0,1] with a single fitness optimum, so heritable variance declines as the population
  converges and a changed environment is re-tracked within the same fixed trait space. And the whole result is
  conditional on a granted individual - og-self-maintaining-individual refuted endogenous closure, so this does not claim an individual forms.
key_assumptions:
- >-
  Granted-individual premise (front and centre): og-self-maintaining-individual refuted endogenous reciprocal
  closure, so the self-maintaining individual this study needs does not form endogenously under defensible conditions.
  This study therefore grants the protocell/membrane as an explicit assumption and grounds fitness at
  og-operating-window's favorable S_T corner regime; evolvability is not claimed for an individual that forms for free.
- >-
  The inherited trait is a fixed scalar composition c in [0,1] (compositional / GARD-style inheritance) mapping
  monotonically to a single fitness optimum. Open-endedness would require a novelty-generating (unbounded) trait
  space, which this model does not provide - so a bounded fixed-trait result cannot be read as open-ended evolvability.
- >-
  Two matched nulls isolate the signal: the no-inheritance null (inheritance=False; daughters reset to the common
  composition, breaking heredity) and the shared-feed null (a flat fitness landscape, retention_lo == retention_hi,
  removing the fitness differential while leaving heredity intact). A real response must beat both.
- >-
  Fitness is grounded in the real composition -> membrane retention (study-32 MD endpoints 0.333/0.661) -> standing
  pool -> division-rate coupling, never a toy fitness function; sigma is a declared heritable variance, not tuned to
  force a shift; division is the og-reproduction mechanically-defensible split (reused), not a relabeled threshold.
claim: >-
  Given a granted individual, stochastic partition + variation produce real heritable, selectable adaptation that
  shifts the population strongly above both matched nulls (no-inheritance and shared-feed) and re-tracks a changed
  environment - but it is bounded fixed-trait selection (heritable variance declines as it converges; the trait
  space is a fixed scalar), not open-ended novelty. Combined with og-self-maintaining-individual: the individuality
  bottleneck is the binding one; given an individual, evolvability works but is bounded. Qualified.
question: >-
  Do mechanically defensible daughters carry heritable chemical variation that produces a multi-generation, open-ended
  evolutionary response - beyond a fixed trait space?
hypothesis: >-
  Stochastic chemical partition and variation at division produce heritable phenotype differences whose fitness,
  emerging from chemical persistence or division, drives a multi-generation response and adaptation to changed
  environments beyond a no-inheritance / shared-feed null.
experiment: >-
  Given a granted individual, run a population of og-reproduction-dividing protocells under grounded selection on an
  inherited composition trait (fitness from composition -> retention -> division rate); measure the multi-generation
  response and changed-environment adaptation against two matched nulls (no-inheritance, shared-feed), and test
  whether the response is open-ended or bounded fixed-trait (heritable-variance trajectory + the fixed trait space).
primary_output: >-
  Heritable-phenotype variance (+ trajectory), fitness-from-chemistry, multi-generation response curves, and
  adaptation-to-change vs the no-inheritance / shared-feed nulls - plus the explicit open-ended-vs-bounded verdict.
parent_studies:
- study: og-self-maintaining-individual
  condition: tests-passed
- study: og-reproduction
  condition: tests-passed
- study: og-evolvability
  condition: tests-passed
parent_relations:
- study: og-self-maintaining-individual
  relation: builds-on
- study: og-reproduction
  relation: builds-on
- study: og-evolvability
  relation: builds-on
upstream_state_consumed:
- from: og-self-maintaining-individual
  provides: the (granted) self-maintaining individual that must divide (from og-self-maintaining-individual; its endogenous closure refuted)
- from: og-reproduction
  provides: the mechanically defensible division geometry producing viable daughters
- from: og-evolvability
  provides: the selectable inherited difference + population-shift-under-selection result being extended toward open-endedness
proposed_controls:
- no-inheritance null (inheritance=False)
- shared-feed null (flat fitness landscape, fitness differential removed)
- changed-environment adaptation test
arms:
- id: evolvable_lineages_canonical
  canonical: true
  concept_role: >-
    Evolvability given a granted individual: grounded selection on an inherited composition trait across generations,
    vs two matched nulls, static + changed environment, with the open-ended-vs-bounded test.
  fidelity: real
  verdict: qualified
  gate_status: passed
  matched_null: no-inheritance-and-shared-feed
  composite: viva_genesis.composites.evolvable_lineages.og_evolvable_lineages
behavior_tests:
- name: selection-shifts-composition
  classification: primary
  gate_class: acceptance_criterion
  description: >-
    Grounded selection shifts the population mean composition well above its starting value over generations (the
    inherited trait responds to selection via the real composition -> retention -> division-rate fitness).
  measure:
    kind: derived
    path: final_mean_composition
    detail: final-generation mean composition
  pass_if:
    op: '>='
    value: 0.6
    detail: composition selected well above the ~0.4 start
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
- name: parent-offspring-heritability
  classification: supporting
  gate_class: acceptance_criterion
  description: >-
    Offspring fitness is heritable: the parent-offspring fitness correlation is high under inheritance (and near 0 in
    the no-inheritance null, confirmed cross-run).
  measure:
    kind: derived
    path: final_parent_offspring_r
    detail: parent-offspring fitness correlation
  pass_if:
    op: '>='
    value: 0.5
    detail: fitness is substantially heritable
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
  cites:
  - jordan2019promotion
- name: heritable-selection-above-both-nulls
  classification: primary
  gate_class: acceptance_criterion
  description: >-
    Cross-run: the composition shift under inheritance+selection exceeds BOTH matched nulls - the no-inheritance null
    (heredity broken) and the shared-feed null (fitness differential removed) - so the response is heritability AND
    selection, not drift or feed. Graded by sims/run.py.
  measure:
    kind: cross_run
    detail: full shift vs no-inheritance null vs shared-feed null
  pass_if:
    op: controls_absent
    detail: response present under inheritance+selection, absent in both matched nulls
  units: dimensionless
  requires_simulation: 'yes'
- name: heritable-variance-sustained
  classification: diagnostic
  gate_class: regression_pin
  description: >-
    DIAGNOSTIC (the open-ended-vs-bounded test): is heritable variance SUSTAINED/regenerated across generations
    (open-ended) rather than consumed as the population converges? It is NOT - the variance ratio final/initial < 1
    and the trait space is a fixed scalar, so this is BOUNDED fixed-trait selection, not open-ended novelty.
  measure:
    kind: derived
    path: heritable_variance_ratio
    detail: heritable fitness variance final / initial
  pass_if:
    op: '>='
    value: 1.0
    detail: heritable variance sustained (open-ended) rather than declining (bounded)
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
  cites:
  - vasas2010lack
findings:
- id: ogel-selection-real
  evidence_basis: predicted
  evidence_basis_note: >-
    The composition shift and parent-offspring correlation are model outputs over replicate seeds (not fit); the
    response is measured against BOTH matched nulls.
  kind: computational
  status: confirms
  statement: >-
    Given a granted individual, heritable selection is real: the population mean composition shifts strongly (~0.38
    -> ~0.91, shift ~0.5 over seeds) with parent-offspring fitness correlation ~0.9, far above both the no-inheritance
    null (shift ~0) and the shared-feed null (drift ~0). Not a Vasas washout - the compositional inheritance carries
    selectable variance.
  evidence:
    from_test: heritable-selection-above-both-nulls
    observed: full shift ~0.5 (r ~0.9) vs no-inheritance ~0 and shared-feed ~0
    units: dimensionless
  explanation: >-
    Fitness rises with retention (higher standing pool -> higher division rate), so selection pulls the inherited
    composition toward the high-retention optimum; breaking heredity OR removing the fitness differential abolishes it.
- id: ogel-adapts-to-change
  evidence_basis: predicted
  evidence_basis_note: >-
    The changed-environment re-tracking is a model output; the adaptation magnitude is compared to the no-inheritance null.
  kind: computational
  status: confirms
  statement: >-
    The inheriting population adapts to a changed environment: when the favored composition is flipped mid-run, the
    population re-tracks toward the new optimum, well above the no-inheritance null - multi-generation adaptation to
    change is real given an individual.
  evidence:
    from_test: heritable-selection-above-both-nulls
    observed: full re-tracks strongly after the optimum flip; no-inheritance null does not
    units: dimensionless
  explanation: >-
    Heredity + the re-pointed fitness gradient let selection move the population to the new optimum within the trait space.
- id: ogel-bounded-not-open-ended
  evidence_basis: extrapolated
  evidence_basis_note: >-
    The bounded character is extrapolated from the heritable-variance trajectory (declines as it converges) and the
    fixed scalar trait space; open-endedness is not a fitted quantity but is denied by these structural facts.
  kind: computational
  status: novel
  statement: >-
    The evolvability is bounded fixed-trait selection, not open-ended: heritable variance declines (ratio final/initial
    < 1) as the population converges to the single optimum, and the trait is a fixed scalar - the changed-environment
    adaptation is re-tracking within the same fixed trait space, not new organization. Vasas-2010-consistent for the
    compositional regime: real selection, but no open-ended novelty.
  evidence:
    from_test: heritable-variance-sustained
    observed: heritable variance ratio final/initial < 1 (FAIL vs 1.0); fixed scalar trait space
    units: dimensionless
  expected:
    cites:
    - vasas2010lack
  explanation: >-
    A fixed scalar trait with one optimum admits bounded selection that consumes its variance on convergence; genuine
    open-endedness needs a novelty-generating trait space this model does not include - so the honest reading is
    bounded, not open-ended.
- id: ogel-synthesis
  kind: computational
  status: novel
  statement: >-
    Synthesis across the arc: given an individual, evolvability works but is bounded; and og-self-maintaining-individual
    showed the individual does not form endogenously. So the binding bottleneck of the chemistry-to-life transition
    here is individuality, not evolvability - a clean close to the arc, with both §9 open transitions resolved as
    quantified-conditional rather than demonstrated.
  evidence:
    from_test: heritable-selection-above-both-nulls
    observed: evolvability present-but-bounded (og-evolvable-lineages) while endogenous individuality refuted (og-self-maintaining-individual)
    units: dimensionless
  explanation: >-
    This study isolates evolvability from individuality by granting the individual; evolvability clears its bar
    (bounded) while individuality (og-self-maintaining-individual) does not, locating the hard step at individuality.
visualizations:
- name: evolvable-lineages-response
  display: primary
  kind: plotly
  path: viz/og-evolvable-lineages/evolvable_lineages.html
  description: >-
