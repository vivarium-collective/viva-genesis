findings:
- id: s-vts-establishment-not-permanence
  statement: "An established endosymbiosis is evolutionarily STABLE (retention 0.78) only when transmission fidelity and the selective benefit together outrun conflict/partner-loss and segregational leakage; under high conflict it decays to 0.03 even though it established. Establishment (M3) does NOT guarantee permanence — retention also collapses under low transmission fidelity (0.19) or no net benefit (0.06)."
  status: confirms
  evidence:
    observed: 0.779
    from_test: study-vertical-transmission-stability-discriminates
    from_run: proto_endosymbiosis_transmission baseline (stable) vs high-conflict variant, seed 1
  inferential_scope: Reduced frequency replicator (symbiont-bearing vs free) balancing selection, segregational transmission loss, conflict/partner-loss, and re-acquisition. Captures the evolutionary-stability balance; not the molecular partition machinery or an explicit genome.
verdict: supported
confidence: provisional
verdict_rationale: "Discriminating campaign on proto_endosymbiosis_transmission: retention>=0.5 when inheritance+selection outrun loss, <<0.5 under high conflict. The established symbiosis is retained only in a bounded regime — a distinct stability axis beyond establishment."
evidence_tier: mechanistic_prediction
claim: An established symbiosis is evolutionarily retained (0.78) only where transmission fidelity and the selective benefit together outrun conflict/partner-loss and segregational leakage; it decays to near zero under high conflict, low fidelity, or no net benefit — establishment does not guarantee permanence.
