  thresholds:
    aggregation_competent_clears_cac: 1.0
    closing_soret_at_dT30: 0.10

runs:
  - name: concentrated-sweep
    status: completed
    timestamp: 1792600000.0
    composite: viva_genesis.composites.self_maintaining_concentrated.og_self_maintaining_concentrated
    note: 'Soret x dT sweep + matched control; see tests/test_self_maintaining_concentrated.py'
    outcomes:
