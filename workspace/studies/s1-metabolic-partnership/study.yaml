schema_version: 4
name: s1-metabolic-partnership
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S1 — Metabolic partnership: can an archaeal-bacterial pair gain fitness from exchange?'
phase: Calibrate
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: metabolic-coupling
tags: [symbiosis, fba, community, cross-feeding, bioenergetics]
concept: >-
  Syntrophy and mutualism made operational as exchange fluxes, partner-dependent growth, invasion
  fitness, and environmental contingencies. Curated candidate genomes -> gap-audited genome-scale
  models (GEMs) -> two-member community FBA / dynamic FBA, with separate positive and negative
  controls, under alternative redox and substrate regimes.
question: >-
  Can plausible archaeal-bacterial pairs gain fitness from metabolite exchange, and under which
  redox and substrate regimes? Does the predicted mutualism survive mass-balance and
  electron-donor/acceptor feasibility audits and alternative reconstructions?
hypothesis: >-
  Under at least one field-consistent redox/substrate regime, a reconstructed archaeal-host /
  bacterial-partner pair achieves partner-dependent growth (each grows better together than alone)
  on mass-balanced exchange fluxes, while a no-exchange / parasitic control does not.
claim: >-
  An archaeal-bacterial association can become mutually beneficial under restricted redox and
  substrate regimes — a connected cross-feeding community develops functional redundancy that an
  isolated (no-exchange) control does not, on mass-balanced exchange — but the benefit is not
  necessarily stable or obligate and disappears outside the feasible regime.
behavior_tests:
- name: community-redundancy-develops
  classification: primary
  description: >-
    The connected community develops functional redundancy — a majority of protometabolic
    capabilities held by >= 2 compartments (robust to a single-compartment loss). This only rises
    above the ~0.46 seeded floor when cross-feeding fills in capabilities, so the >0.5 threshold
    discriminates the connected community from the isolated (no-exchange) control: the partner
    dependence IS the gap between the two arms.
  measure: {kind: derived_scalar, path: settled_metacommunity_robustness}
  pass_if:
    op: '>'
    value: 0.5
    provenance:
      kind: calibration
      note: >-
        Calibrated at p_diacid=1e-8, p_monoacid=1e-7, k_wash=0.01, 250 steps (og-07 nominal): the
        connected arm (coupling=shared) settles to 0.536 (PASS) while the isolated control
        (coupling=private, the `isolated-control` variant) settles to 0.464 (FAIL) — a
        partner-dependent advantage of connected/isolated = 1.15. A majority of capabilities are
        redundantly covered only with cross-feeding.
  cites: [imachi-nature-2020, santana-molina-nee-2025]
- name: exchange-mass-balanced
  classification: primary
  description: Exchanged metabolites close an elemental carbon mass balance (no free lunch).
  measure: {kind: derived_scalar, path: exchange_mass_balance_residual}
  pass_if:
    op: '<'
    value: '1e-6'
    provenance: {kind: theory, note: Exchange fluxes must conserve carbon; worst-case C residual stays ~0 (observed 5.6e-11).}
acceptance_criteria:
- behavior: community-redundancy-develops
findings:
- id: s1-connected-beats-isolated-calibrated
  statement: >-
    Calibrated (p_diacid=1e-8, p_monoacid=1e-7, k_wash=0.01, 250 steps): the connected cross-feeding
    community settles to metacommunity_robustness 0.536 (> 0.5, PASS) while the isolated control
    (coupling=private) settles to 0.464 (< 0.5, FAIL) — a partner-dependent advantage of 1.15
    (connected/isolated). Carbon mass balance holds (worst-case residual 5.6e-11). Establishes a
    mechanistically plausible route (connected community) and a well-characterized failure route
    (isolated control) at first fidelity. Computed via a direct in-process composite run; the
    tracked workbench run awaits the evaluator reaching the genesis venv.
  cites: [imachi-nature-2020]
literature_anchors:
- expectation: Syntrophic archaeal-bacterial growth is observed in Prometheoarchaeum syntrophicum.
  model_observable: settled_metacommunity_robustness
  source: Imachi et al. 2020, Nature
  cites: [imachi-nature-2020]
  status_in_workspace: proposed
parent_studies: []
# FIRST-FIDELITY MODEL (built + calibrated): reuses the og-07 metabolite-exchange community — a
# tested two-lineage (fixer + reducer) cross-feeding community with a C/N/P element ledger.
baseline:
- name: baseline
  composite: viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community
  params:
    lineages: fixer:4,reducer:4        # the two-member (two-lineage) cross-feeding community
    coupling: shared                   # the CONNECTED arm
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-8                    # calibrated (og-07 nominal)
    p_monoacid: 1.0e-7
    k_wash: 0.01
  note: >-
    First-fidelity arm. settled_metacommunity_robustness (community functional redundancy) is the
    partner-dependence gate; C_residual_max gives carbon mass balance. The next-fidelity arm — two
    gap-audited archaeal/alphaproteobacterial GEMs under community FBA — is blocked on COBRApy (not
    installed) + genome reconstruction (GTDB/NCBI data not yet ingested).
variants:
- name: isolated-control
  base: baseline
  over: {coupling: private}            # the ISOLATED counterfactual: no cross-feeding — must FAIL the >0.5 gate (settles 0.464)
observables: [community/metacommunity_robustness, ledger/C_residual_max]
data_inputs:
- {name: GTDB genomes, use: candidate Asgard + alphaproteobacterial genomes, url: 'https://gtdb.ecogenomic.org/downloads'}
- {name: NCBI Assembly/RefSeq, use: CDS + protein annotations for organism selection, url: 'https://www.ncbi.nlm.nih.gov/datasets/'}
- {name: KEGG/MetaCyc/BiGG, use: reaction stoichiometry + pathway mappings for reconstruction, url: 'https://bigg.ucsd.edu/'}
- {name: Comparative central metabolism (Zenodo), use: curated proteomes/orthogroups/trees, url: 'https://doi.org/10.5281/zenodo.10991068'}
