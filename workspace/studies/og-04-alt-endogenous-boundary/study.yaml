title: The Endogenous Boundary
question: >-
  Can a protocell boundary form from the campaign's own reduced-carbon chemistry - an
  amphiphile synthesized from acetate + formate that clears the critical aggregation
  concentration - rather than from an injected amphiphile pool, and is its formation caused by
  that synthesis?
hypothesis: When acetate + formate condense to an amphiphile that clears the critical
  aggregation concentration under vesicle-favourable (alkaline, saline) conditions,
  a viable boundary forms and a new individual appears in the agents map by an _add
  structural rewrite; with amphiphile synthesis ablated no individual forms, so boundary
  formation is caused by the endogenous chemistry.
objective: Drive AmphiphileSynthesisProcess from a dissolved acetate+formate pool
  into the boundary face (single_chain | mixed | thioester_aminothiol); gate that
  a BoundaryFormationStep _add produces agents 0 -> >=1 in the favorable arm and 0
  in the synthesis-ablated control, with the RewriteLedger confirming the rewrite
  conserves matter.
proposed_mechanisms:
- 'H+: the boundary is built from the campaign''s own carbon chemistry, not an added
  amphiphile'
- structural-rewrite individuation (_add on the agents map) rather than a continuous
  field
proposed_models_methods:
- AmphiphileSynthesisProcess (acetate + formate -> fatty-acid amphiphile)
- boundary face (Jordan-2019 mixed-amphiphile vesicle; thioester/aminothiol alternative)
- BoundaryFormationStep (_add structural rewrite) + RewriteLedgerProcess (conservation)
contract:
  face:
    inputs:
      k_synth:
        _type: float
        _units: 1/(molar*second)
        _min: 0.0
      acetate0:
        _type: float
        _units: molar
        _min: 0.0
      formate0:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      n_agents:
        _type: float
        _units: dimensionless
        _min: 0.0
      boundary_formed:
        _type: float
        _units: dimensionless
      rewrite_ok:
        _type: float
        _units: dimensionless
  conditions:
  - name: rewrite_mass_balance
    expr: rewrite_residual_max == 0 (the _add moves matter localized -> individual,
      conserved)
behavior_tests:
- name: boundary-forms-from-chemistry
  classification: primary
  description: A new individual appears in the agents map (0 -> >=1) when amphiphile
    is synthesised from acetate+formate and clears cac; with synthesis ablated (k_synth
    -> 0) the amphiphile stays below cac and NO individual forms.
  measure:
    kind: derived
    path: boundary_forms_from_chemistry
    detail: favorable forms individuals (n_agents>=1) AND synthesis-ablated forms
      none; from artifacts/endogenous_boundary_report.json
  artifact: workspace/studies/og-04-alt-endogenous-boundary/artifacts/endogenous_boundary_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: boundary caused by the endogenous chemistry — forms in the favorable arm,
      not in the synthesis-ablated control
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: rewrite-conserves-matter
  classification: primary
  description: Every _add boundary-formation rewrite conserves matter — the parcel
    withdrawn from the localized pool exactly equals the new individual's internal
    amounts (rewrite_ok).
  measure:
    kind: derived
    path: endogenous_rewrite_conservation_ok
    detail: min over steps of the RewriteLedger conservation flag; from artifacts/endogenous_boundary_report.json
  artifact: workspace/studies/og-04-alt-endogenous-boundary/artifacts/endogenous_boundary_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: rewrite_residual_max == 0 at every structural rewrite
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
literature_anchors:
- key: jordan2019promotion
  relevance: C10-C15 single-chain amphiphiles + co-surfactant form vesicles pH ~6.5
    to >12 at seawater salinity — alkaline hydrothermal conditions favour protocell
    assembly.
baseline:
- name: Endogenous amphiphiles by explicit chain extension
  composite: viva_genesis.composites.og_17_amphiphile_chain_extension.og_17_amphiphile_chain_extension
  params:
    acetate_feed: 0.05
    k_extend: 0.4
    cac_molar: 0.005
  canonical: true
  planned: true   # REBUILD chemistry: explicit chain-extension repointed; awaiting the balanced run
disposition: >-
  REBUILD chemistry. The landed study assumes acetate + formate condense to a single generic amphiphile
  with no defensible kinetics (k_synth is an inferred rate with no direct prebiotic measurement, as the
  current claim concedes). Replace that one assumed step with explicit molecular chemistry: carbon-chain
  extension, headgroup formation, degradation/hydrolysis, and assembly across MULTIPLE amphiphile
  species — not a lumped condensation to one product. og-31's membrane engine now exists (viva-openmm),
  so assembly is modeled against a real composition-dependent closure rather than a bare threshold.
claim: >-
  Vent-fed chemistry, through explicit chain-extension, headgroup and degradation reactions across
  multiple amphiphile species, either reaches an experimentally-grounded aggregation-competent
  composition on its own — assembling via the real og-31 / viva-openmm membrane closure — or it does
  not, in which case boundary formation is not supported by defensible endogenous kinetics. The single
  assumed acetate+formate→amphiphile condensation is retired in favour of named reactions with tracked
  rates and losses.
decision_test: >-
  Vent-fed chemistry must reach experimentally-grounded aggregation-competent compositions (measured
  critical aggregation + phase stability) using only amphiphiles produced by the explicit reactions,
  with no exogenous amphiphile feed and all degradation/hydrolysis losses tracked. Falling short is an
  accepted negative result naming the missing chemistry, not tuned to pass (evidence standard #2 no
  untracked amphiphile feed, #6 independent experimental validation, #8).
