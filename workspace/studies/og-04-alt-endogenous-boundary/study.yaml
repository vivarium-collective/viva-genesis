    acetate0: 0.05
    formate0: 0.05
    pH: 9.0
    ionic_strength: 0.35
  canonical: true
claim: A protocell boundary forms from the campaign's own reduced-carbon chemistry
  (endogenous amphiphile), producing an individual by a matter-conserving _add structural
  rewrite; ablating synthesis removes the individual.
findings:
- id: endogenous-boundary-forms
  kind: computational
  status: confirms
  statement: The boundary forms from acetate+formate-derived amphiphile; with synthesis
