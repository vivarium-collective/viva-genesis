  store_path: delta_adhesion
controls:
- name: selection-off-drift-null
  kind: negative
  arms:
  - clonal-drift
  - mixed-drift
  rationale: 'Same founding and reseeding, selection off: any adhesion change is drift/reseeding. The response must vanish here.'
- name: mixed-adversarial-arm
  kind: adversarial
  arms:
  - mixed-sel
  - mixed-drift
  rationale: 'Non-clonal groups dilute the heritable trait; tests whether clonality matters. See limitations: this works by trait dilution, not active within-group conflict.'
alternative_hypotheses:
- name: reseeding-artifact
  statement: The adhesion change is an artifact of the reseeding procedure, not selection.
  excluded_by: selection-off drift null (clonal-drift)
- name: clonality-irrelevant
  statement: Clonal structure is irrelevant to the response.
  excluded_by: clonal vs mixed comparison of response and heritability
- name: seed-luck
  statement: The response is specific to the seeds used to characterize it.
  excluded_by: held-out potts seeds 4-6 graded separately
limitations:
- 'Ruling R-S06-DILUTION: in the mixed arm the within_group Price term is ~0 because adhesion carries NO intrinsic within-group growth advantage under uniform growth; cheaters do not out-compete founders inside a patch. The mixed control therefore collapses heritability by TRAIT DILUTION (heritability toward ~0.5) and weakened among-group selection, NOT by active within-group conflict.'
- 'Short horizon: 6 generations, one CPM backend (viva-cpm), 2D, 3 seeds per split.'
- Only provided mechanisms are modelled; no adhesion-linked fitness cost, so the study does not test conflict-mediated loss of individuality.
falsifiability:
- Clonal selection response not exceeding the drift null on held-out seeds 4-6 overturns the claim.
- A drift-arm response comparable to the selection arm indicates a reseeding artifact.
- Heritability or response equal in clonal and mixed arms would show clonality is irrelevant.
discovery_implications:
- If supported, clonal group structure plus selection suffices for a heritable group-level response; whether non-clonal groups can sustain it depends on conflict mechanics not modelled here.
followup_study_proposals:
- title: Adhesion-linked fitness cost (active within-group conflict)
  rationale: Add a growth cost to adhesion so cheaters out-compete founders within a patch; then the within_group Price term becomes nonzero and the mixed arm tests conflict suppression, not only trait dilution (ruling R-S06-DILUTION).
findings:
- id: s06-adhesion-response-observation
  statement: Per-arm seed-mean adhesion response and heritability are reported by analysis/grade_individuality.py (numbers pending grading).
  tier: observation
  status: pending
  kind: computational
  evidence_basis: predicted
  from_test: selection-drives-individuality
  inferential_scope: 6 generations, 6 potts seeds per arm, one CPM backend.
- id: s06-price-partition-mechanism
  statement: 'Mechanism: Price partition of adhesion change into among-group and within-group terms; heritability is parent-offspring regression of group adhesion.'
  tier: mechanism
  mechanism_origin: engineered
  status: pending
  kind: computational
  evidence_basis: predicted
  from_test: selection-drives-individuality
  inferential_scope: Engineered generational loop; not validated against data.
- id: s06-individuality-interpretation
  statement: Interpretation pending graded result; mixed-arm collapse (if any) is trait dilution rather than active conflict (R-S06-DILUTION).
  tier: interpretation
  mechanism_origin: engineered
  status: pending
  kind: computational
  evidence_basis: predicted
  from_test: selection-drives-individuality
  inferential_scope: Seeds 4-6 held out; short horizon.
