schema_version: 4
name: s06-individuality
investigation: multicellularity
created: '2026-11-12'
title: Evolutionary individuality
phase: Evaluate
status: investigating
design_status: drafted
simulation_status: ran
topic: multicellularity
tags:
- multicellularity
concept: emergence of multicellularity
question: Does generational group selection on a heritable adhesion trait produce a response that requires clonal group structure (evolutionary individuality)? (Q5)
hypothesis: Group-level selection on adhesion yields a heritable multi-generation response in clonal groups that vanishes without selection (drift null) and is weakened when groups are mixed (non-clonal).
claim: 'Pending grading: selection-on clonal arm shows a positive adhesion response exceeding the selection-off drift null on held-out potts seeds 4-6.'
behavior_tests:
- name: selection-drives-individuality
  classification: primary
  description: 'Out-of-sample (seeds 4-6): seed-mean adhesion response (mean_adhesion last - first emitted generation) of clonal+selection exceeds clonal drift null and is > 0. Secondary: heritability(clonal) > heritability(mixed) and mixed-sel response < clonal-sel response. Seeds 1-3 are characterization only.'
