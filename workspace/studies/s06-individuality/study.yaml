findings:
- id: s06-adhesion-response-observation
  statement: 'Seed-mean mean-adhesion response over 6 generations (held-out seeds 4-6 | training seeds 1-3): clonal+selection +0.224 | +0.324; clonal drift null +0.101 | -0.008; mixed+selection +0.138 | +0.096; mixed drift +0.101 | -0.008. Group toughness: clonal-sel ~0.93, clonal-drift ~0.82. All 24 runs completed; numbers from analysis/grade_individuality.py.'
  tier: observation
  status: completed
  kind: computational
  evidence_basis: predicted
  from_test: between-group-heritable-fitness-stable
  inferential_scope: 6 generations, 6 potts seeds per arm, one CPM backend (viva-cpm), 2D.
- id: s06-price-partition-mechanism
  statement: 'Mechanism: group fitness = largest-cluster toughness (reuses S04 fracture); the Price partition splits the group-adhesion change into among-group (Cov(w,z)) and within-group (E[w*dz]) terms. among_group is positive for selection arms and ~0 for drift; within_group is ~0 in EVERY arm because adhesion carries no intrinsic within-group growth advantage under uniform growth. Heritability (parent-offspring regression of group adhesion) is 1.0 clonal / 0.5 mixed, fixed by the clonal/mixed encoding (structural, not emergent).'
  tier: mechanism
  mechanism_origin: engineered
  status: completed
  kind: computational
  evidence_basis: predicted
  from_test: between-group-heritable-fitness-stable
  inferential_scope: Engineered generational loop; Price terms computed, not validated against data.
- id: s06-individuality-interpretation
  statement: 'Clonal group-level selection evolves a heritable adhesion increase (individuality emerges) that the drift null does not; clonality is required (mixed response attenuated, heritability halved). QUALIFIED — the clean selection-over-drift margin is on training seeds (+0.33); on held-out seeds the drift null drifts up ~+0.10 (boundary reflection of the [0,0.6] init), leaving a modest +0.12 margin. The mixed (non-clonal) control collapses heritability by trait DILUTION, not active within-group conflict (R-S06-DILUTION): with adhesion as the only trait, cheaters have no within-group fitness advantage.'
  tier: interpretation
  mechanism_origin: emergent
  status: completed
  kind: computational
  evidence_basis: predicted
  from_test: between-group-heritable-fitness-stable
  inferential_scope: Seeds 4-6 held out; 6-generation horizon; 2D; one CPM backend; a-priori-fixed parameters.
