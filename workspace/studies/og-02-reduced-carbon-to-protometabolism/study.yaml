schema_version: 4
name: og-02-reduced-carbon-to-protometabolism
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: ran
design_status: approved
confidence: Investigating
title: Reduced carbon to protometabolism (Campaign II)
question: Under continuous feed and washout, do reaction subnetworks become self-reinforcing — persistent cycles, flux amplification, product reuse, autocatalytic motifs — without imposed product accumulation?
hypothesis: A curated graph (formate/acetate/pyruvate/glyoxylate + rTCA fragments) seeded with Muchowska/Moran edges sustains nonzero throughput and at least one autocatalytic motif within a feasible resource budget.
objective: Insert an experimentally-motivated reaction graph and test whether metabolism-like subnetworks emerge under flow.
proposed_mechanisms:
- 'E: protometabolic network formation'
- 'D: surface chemistry'
proposed_models_methods:
- SBML + libRoadRunner/Tellurium or COPASI
- SciPy solve_ivp
- element-balance + thermodynamic-consistency checks before kinetic fitting
- GillesPy2 for low-copy stochastic regimes
contract:
  face:
    inputs:
      formate:
        _type: float
        _units: molar
        _min: 0.0
      acetate:
        _type: float
        _units: molar
        _min: 0.0
      pyruvate:
        _type: float
        _units: molar
        _min: 0.0
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pH:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 14.0
    outputs:
      net_carbon_flux:
        _type: float
        _units: mole/second
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built for this study must declare a ProcessContract matching this face (audited via the workbench §Contract panel).
behavior_tests:
# Machine-gradeable derived readouts (viva_genesis/evaluators.py) over the real
# libRoadRunner rTCA-fragment CSTR run — emergent observables, not assumptions.
- name: sustained-carbon-throughput
  classification: primary
  description: Nonzero steady net carbon throughput under continuous feed + washout.
  measure: {kind: derived, path: settled_net_carbon_flux, detail: steady net carbon fixation rate}
  pass_if: {op: '>', value: 1.0e-6, detail: net throughput > 0 (no imposed accumulation)}
  units: mole/second
  requires_simulation: 'yes'
- name: autocatalytic-gain-present
  classification: primary
  description: At least one reinforcing (autocatalytic) motif emerges (gain >= 1).
  measure: {kind: derived, path: peak_autocatalytic_gain, detail: peak OAA self-amplification ratio}
  pass_if: {op: '>=', value: 1.0, detail: '>= 1 reinforcing/autocatalytic motif'}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [muchowska2017metals, muchowska2019synthesis]
- name: network-closure-vs-oneoff
  classification: supporting
  description: Products connect into ONE reaction network, not disconnected one-offs.
  measure: {kind: derived, path: network_connected_final, detail: networkx connectivity of the species-reaction graph}
  pass_if: {op: '>=', value: 1.0, detail: connected network (not one-offs)}
  units: dimensionless
  requires_simulation: 'yes'
literature_anchors:
- expectation: Fe2+ promotes 9/11 TCA intermediates + 5 universal precursors from pyruvate/glyoxylate
  model_observable: edge yields + network reachability
  source: Muchowska 2019
  status_in_workspace: Not yet measurable — module processes not built
  cites:
  - muchowska2019synthesis
implemented_methods:
- 'Module E — REAL libRoadRunner/Tellurium: a curated SBML rTCA-fragment network (pyruvate carboxylation + a lumped autocatalytic reductive-TCA turn OAA+2CO2 -> 2OAA+acetate + reductive branch to malate/succinate) run as a continuous-feed / washout CSTR, advanced each tick by the genuine roadrunner ODE integrator.'
- 'Emergent observables (not assumptions): net carbon throughput under feed+washout; the autocatalytic gain k_rtca.[CO2]/k_wash (>1 => a reinforcing motif is active, OAA amplifies ~60x then CO2-limits); networkx connectivity of the species-reaction graph (a single connected network). A no-CO2 control collapses flux + gain to 0.'
