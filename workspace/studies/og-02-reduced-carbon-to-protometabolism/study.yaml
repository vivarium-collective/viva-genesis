schema_version: 4
name: og-02-reduced-carbon-to-protometabolism
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Reduced carbon to protometabolism (Campaign II)
question: Under continuous feed and washout, do reaction subnetworks become self-reinforcing — persistent
  cycles, flux amplification, product reuse, autocatalytic motifs — without imposed product accumulation?
hypothesis: A curated graph (formate/acetate/pyruvate/glyoxylate + rTCA fragments) seeded with Muchowska/Moran
  edges sustains nonzero throughput and at least one autocatalytic motif within a feasible resource budget.
objective: Insert an experimentally-motivated reaction graph and test whether metabolism-like subnetworks
  emerge under flow.
proposed_mechanisms:
- 'E: protometabolic network formation'
- 'D: surface chemistry'
proposed_models_methods:
- SBML + libRoadRunner/Tellurium or COPASI
- SciPy solve_ivp
- element-balance + thermodynamic-consistency checks before kinetic fitting
- GillesPy2 for low-copy stochastic regimes
contract:
  face:
    inputs:
      formate:
        _type: float
        _units: molar
        _min: 0.0
      acetate:
        _type: float
        _units: molar
        _min: 0.0
      pyruvate:
        _type: float
        _units: molar
        _min: 0.0
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pH:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 14.0
    outputs:
      net_carbon_flux:
        _type: float
        _units: mole/second
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built
    for this study must declare a ProcessContract matching this face (audited via the workbench §Contract
    panel).
behavior_tests:
- name: sustained-carbon-throughput
  classification: primary
  description: Net throughput under feed+washout without imposed accumulation.
  measure:
    kind: observable
    detail: net throughput under continuous feed + washout
  pass_if:
    op: threshold
    detail: '> 0 with no imposed product accumulation'
  requires_simulation: 'yes'
- name: autocatalytic-gain-present
  classification: primary
  description: At least one reinforcing motif emerges.
  measure:
    kind: observable
    detail: cycle flux + autocatalytic gain
  pass_if:
    op: threshold
    detail: '>= 1 reinforcing/autocatalytic motif'
  requires_simulation: 'yes'
  cites:
  - muchowska2017metals
  - muchowska2019synthesis
- name: network-closure-vs-oneoff
  classification: supporting
  description: Products connect into a network, not disconnected one-offs.
  measure:
    kind: observable
    detail: graph connectivity of products
  pass_if:
    op: threshold
    detail: connected network, not one-offs
  requires_simulation: 'yes'
literature_anchors:
- expectation: Fe2+ promotes 9/11 TCA intermediates + 5 universal precursors from pyruvate/glyoxylate
  model_observable: edge yields + network reachability
  source: Muchowska 2019
  status_in_workspace: Not yet measurable — module processes not built
  cites:
  - muchowska2019synthesis
baseline:
- name: Reduced carbon to protometabolism (Campaign II)
  composite: viva_genesis.composites.og_02_reduced_carbon_to_protometabolism
  params: {}
  planned: true
parent_studies:
- study: og-01-geology-to-reduced-carbon
  condition: tests-passed
key_assumptions:
- Rate laws/mineral dependencies carry provenance; autocatalysis is an emergent observable, not an assumption.
parent_relations:
- study: og-01-geology-to-reduced-carbon
  relation: leads-to
expert_questions:
- Start the reaction graph from acetyl-CoA-pathway fragments, rTCA fragments, or both in parallel?
