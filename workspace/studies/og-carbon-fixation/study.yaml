findings:
- id: og01cal-every-point-attributed
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation__1792066785__b9f82a
  kind: computational
  status: confirms
  statement: >-
    Every one of the 375 grid points carries a limitation label in both runnable classes (coverage 1.00;
    0 failed runs). Butler-Volmer: catalytic 226, electrical 149, transport 0, thermodynamic 0. Empirical:
    transport 147, catalytic 117, electrical 108, thermodynamic 3.
  evidence:
    from_test: failure-mode-labelled
    observed: label coverage 1.00 (empirical), 1.00 (butler_volmer); 0/750 failed points
    units: dimensionless
  explanation: >-
    The Butler-Volmer class partitions the fresh-fluid emf into product back-pressure (thermodynamic),
    ohmic drop (electrical), activation overpotential (catalytic) and concentration overpotential (transport)
    — four fractions that sum to one while current flows — and takes the largest (a cathode sending most
    electrons to H2 is catalytic / selectivity-limited). The empirical class publishes the headroom of
    each of its multiplicative gates (1 - feasible, 1 - drive(pmf), 1 - catalyst x Ni gain, 1 - availability).
    Artifact: artifacts/electrochemistry_mechanism_map.json.
- id: og01cal-classes-disagree-in-the-favorable-region
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation__1792066785__b9f82a
  kind: computational
  status: novel
  statement: >-
    The pre-registered failure-mode-attributed gate fails: on the 78 points both classes call favorable
    the labels agree on 37 (0.47); overall 168/375 (0.45). The confusion is systematic, not noise — every
    Butler-Volmer favorable point is catalytic (93/93), while the empirical class calls 47 of its favorable
    points electrical and 28 transport. Agreement is high only where the physics is unambiguous: 0.81
    at 1e-9 S/m (both: electrical) and 0.67-0.68 at H2 >= 1.4e-4 M; it collapses to 0.01 at 1 uM H2, where
    the empirical Michaelis constant (1e-4 M) declares transport limitation that the cell never reaches
    (the limiting current stays above the activation-limited current at these exchange currents).
  evidence:
    from_test: failure-mode-attributed
    observed: >-
      label agreement 0.474 on 78 favorable-both points (gate >= 0.8); 0.448 overall; favorability structure
      agreement 0.65
    units: dimensionless
  explanation: >-
    The empirical rate law's drive(pmf) = pmf / (pmf + 0.08 V) lumps the delivered gradient (electrical)
    and the electrode kinetics (catalytic) into one saturating term, so its "electrical" headroom in the
    favorable region is what the Butler-Volmer class resolves as activation overpotential. Paired class
    differences on identical points: loss_transport d = 1.77, loss_thermodynamic d = 0.68 (discriminating);
    loss_electrical, loss_catalytic and gradient_efficiency |d| < 0.5 (not discriminating). decision_discipline
    flags the attribution as structure-sensitive.
  expected:
    cites:
    - commchem2026energeticconstraints
    - altair2025electrochemical
- id: og01cal-butler-volmer-cell-is-activation-limited
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation__1792066785__b9f82a
  kind: computational
  status: novel
  statement: >-
    Under explicit electrochemistry the alkaline-vent cell is catalytically (activation) limited everywhere
    the wall conducts: at the nominal point (pH 9.5 | 6.0, 5 mM H2, 2 mM CO2, 100 C, 1e-3 S/m, Ni3Fe)
    the anode + cathode activation overpotentials take 0.996 of the 0.49 V fresh-fluid emf, the ohmic
    drop 0.002 and transport 0.001, at j = 1.06e-3 A/m^2 with faradaic efficiency 0.92 to carbon. Throughput
    rises only ~40x across the whole (pH x H2) plane (74 mV per pH unit, (RT/2F) ln10 per decade of H2)
    because the current scales with the exchange current, not the driving force. The electrical regime
    appears below ~1e-6 S/m (ohmic drop > activation), where the circuit-derived gradient efficiency is
    0.01-0.42.
  evidence:
    from_test: current-in-altair-window
    observed: >-
      nominal losses: catalytic 0.996, electrical 0.002, transport 0.001, thermodynamic 0.0; j = 1.06e-3
      A/m^2; FE 0.92; gradient_efficiency 0.01 / 0.42 / 0.98 / 1.00 at 1e-9 / 1e-7 / 1e-5 / 1e-3 S/m
    units: dimensionless
  explanation: >-
    Exchange currents calibrated to the Altair-2025 current window (j0_co2 1e-5, j0_h2 5e-5, j0_her 2.5e-6
    A/m^2 at Ni3Fe, 100 C) are small, so the Butler-Volmer branches need ~0.2-0.3 V each to carry 1e-3
    A/m^2; the mineral + ionic path drops microvolts unless the wall is an insulator. This is a prediction
    under the calibration, not a measurement: the per-condition Altair currents are not yet attached.
  expected:
    cites:
    - altair2025carbon
    - commchem2026currentproducing
- id: og01cal-current-window-reproduced
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation__1792066785__b9f82a
  kind: computational
  status: confirms
  statement: >-
    The Butler-Volmer class's settled current density lies inside the Altair-2025 window (1e-5 .. 1e-2
    A/m^2, i.e. ~10 nA .. 10 uA on the cm^2-scale interface) at the canonical operating point and on 79.7%
    of the grid (range 1.4e-7 .. 3.0e-3 A/m^2; the points below the window are the insulating walls).
    Selectivity to carbon products stays 0.76-1.00.
  evidence:
    from_test: current-in-altair-window
    observed: canonical j = 1.06e-3 A/m^2; grid fraction in window 0.797; FE 0.76-1.00
    units: ampere/meter**2
  explanation: >-
    Reproduction-tier check against the calibration window (vg-data electrochemical_interface.observations.cell_current_density);
    the window is the dossier summary, not a per-condition fit.
  expected:
    cites:
    - altair2025carbon
- id: og01cal-charge-ledger-exact
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation__1792066785__b9f82a
  kind: computational
  status: confirms
  statement: >-
    Numerical verification: the ChargeLedgerProcess closes on all 750 mechanism-map runs and on the 120-tick
    canonical run — Kirchhoff residual |anode - (carbon + H2 evolution)| / anode <= 1.7e-13 (0.0 for the
    empirical class), faradaic efficiency never above 1 (max 1 + 1e-13), circuit residual <= 8.5e-9. The
    ledger caught a real bookkeeping gap during the build (on insulating walls the trace ocean-side H2
    oxidising at the cathode co-supplies electrons), which is now counted explicitly.
  evidence:
    from_test: charge-ledger-closes
    observed: charge residual <= 1.7e-13; FE max 1.0000000000001; iv residual <= 8.5e-9; 0/750 failed
    units: dimensionless
