program: consolidated
title: 'Carbon Fixation: Does H2 Reduce CO2 at the Vent?'
concept: >-
  Whether H2-driven CO2 reduction over Fe/Ni/S catalysts produces reduced organic carbon that reproduces
  lab benchmarks at the vent — studied at several fidelities (hydrothermal carbon-fixation yields, explicit
  electrochemical-interface limitation attribution) as arms.
gate_reason: >-
  Gate A (carbon). Consolidates the carbon-fixation line into one concept with fidelity-labelled
  arms: hydrothermal carbon fixation (og-01, canonical) and the explicit electrochemical-interface limitation
  attribution (og-01-cal-electrochemistry). Headline (og-01, canonical): H2-driven CO2 reduction reproduces
  the Preiner-2020 yield hierarchy (formate ~200 mM >> acetate ~100 uM >> pyruvate ~10 uM), sustains net
  organic-carbon flux in a bounded pH/H2 region, and every control collapses — SUPPORTED. HONEST GUARDRAIL
  (refuted arm, kept explicit, does NOT flip the headline): the mechanistic ATTRIBUTION of which limitation
  stops fixation is STRUCTURE-SENSITIVE — the two electrochemistry model classes agree on the dominant-limitation
  label on only 47% of the favorable region (< the pre-registered 80% gate), so og-01-cal-electrochemistry
  is REFUTED on that secondary agreement question (gate failed) and og-01-cal-dx will diagnose it. The
  refutation is on the secondary attribution question, not the core carbon-fixation claim; og-01-cal's
  sub-findings still hold (current in the Altair-2025 window; charge ledger closes; activation-limited
  where the wall conducts). Per the canonical rule, the refuted arm's behavior_tests are retained as supporting
  (they test the secondary question), so the PASS gate rests on og-01's primaries.
claim: >-
  H2-driven CO2 reduction fixes carbon at the vent. Over Fe/Ni/S catalysts the model reproduces the Preiner-2020
  yield hierarchy (formate ~200 mM >> acetate ~100 uM >> pyruvate ~10 uM) and sustains net organic-carbon
  flux in a bounded pH-gradient x dissolved-H2 region; formate collapses to <1 mM in every no-gradient
  / no-H2 / no-catalyst control, and carbon fixation spends the proton gradient (~2 H+/carbon, chemiosmotic
  backpressure) (og-01, canonical, supported). Under explicit electrochemistry the vent cell is activation
  (catalyst) limited where the wall conducts and its current sits in the Altair-2025 window, but the two
  model classes agree on the dominant-limitation label on only 47% of the favorable region (below the
  pre-registered 80% gate), so the limitation attribution is structure-sensitive and og-01-cal-electrochemistry
  is refuted on that agreement question (og-01-cal, refuted; og-01-cal-dx planned to diagnose). Consolidated
  headline: supported — carbon fixation works and reproduces lab benchmarks; the mechanistic attribution
  of its rate-limiting step is not yet model-class-robust. Every matched null and arm verdict kept, including
  the refutation.
question: >-
  Does H2-driven CO2 reduction over Fe/Ni/S catalysts fix carbon and reproduce lab yield benchmarks at
  the vent — and can the model classes agree on which limitation stops it?
hypothesis: >-
  H2-driven CO2 reduction reproduces the Preiner yield hierarchy and sustains net carbon flux in a bounded
  pH/H2 region (the core claim); but the attribution of the dominant limitation is not claimed where the
  model classes disagree below the pre-registered agreement gate.
experiment: >-
  Consolidate the carbon-fixation studies into one concept with explicit fidelity-labelled arms (hydrothermal
  yields, explicit electrochemical attribution), preserving each arm's matched null, verdict (including
  the og-01-cal refutation), findings and run provenance; report the consolidated headline bounded by
  the canonical arm (og-01, supported) without letting the secondary-question refutation flip it.
result: >-
  H2-driven CO2 reduction fixes carbon and reproduces the Preiner-2020 yield hierarchy, sustaining net
  organic-carbon flux in a bounded pH/H2 region with controls collapsing (SUPPORTED); but the mechanistic
  attribution of which limitation stops fixation is structure-sensitive — the two electrochemistry classes
  agree only 47% (< 80% gate), so that secondary attribution question is refuted (og-01-cal) and tracked
  for diagnosis (og-01-cal-dx).
