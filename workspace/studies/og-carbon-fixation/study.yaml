    Real eQuilibrator ΔG' is logged every step and makes feasibility explicit (fixation stops where ΔG'
    ≥ 0 — genuine product inhibition).
  evidence:
    from_test: free-energy-directionality-logged
- id: og01-chemiosmotic-backpressure
  kind: computational
  status: novel
  statement: >-
    Carbon fixation SPENDS the proton gradient — a conserved proton budget (≈2 H⁺ per carbon) draws the
    loaded pmf down ~40% below the open-circuit 427 mV under load, then relaxes as products saturate.
    The gradient does work and is consumed, not merely correlated with reduction.
  evidence:
    from_test: chemiosmotic-backpressure-loads-gradient
    observed: pmf open-circuit 427 mV sags to ~250 mV (charge 0.60) at peak fixation, recovers to 427
      mV
    units: dimensionless
  expected:
    cites:
    - lane2010chemiosmotic
    - lane2012origin
    - sojo2014bioenergetic
    - herschy2014originreactor
    - buckel2013energy
  explanation: >-
    A ProtonBudgetProcess integrates reservoir = supply − protons_per_carbon·carbon_flux − leak·reservoir;
    fixation reads the loaded pmf = pmf_open·(reservoir/capacity), closing the respiratory-control feedback.
- id: og01-fixation-landscape
  kind: computational
  status: novel
  statement: >-
    A parameter sweep over the (vent pH × dissolved H₂) plane maps the carbon-fixation landscape, not
    a single run. In the open-flow reactor, sustained reduced-carbon throughput scales with both the pH
    gradient and H₂ (6.4 → 24 ×10⁻³ mol-C/s; steady pool 7–28 mM); the Tutolo-2026 gradient collapse roughly
    halves it on the same axes, and the no-gradient / no-catalyst / no-H₂ controls zero it. The favorable
    region is broadly productive — the sharp dependence is on a SUSTAINED gradient, not on sitting at
    one pH/H₂ point.
  evidence:
    from_test: net-carbon-flux-nonzero-region
    observed: favorable 6.4–24 ×10⁻³ mol-C/s vs Tutolo 2.2–15; controls 0
    units: mole/second
  expected:
    cites:
    - preiner2020hydrogen
    - tutolo2026rethinking
  explanation: >-
    14×14 sweep of the real open-flow composite (pH 7–11 × H₂ 0.1–20 mM, exponential washout) reduced
    to sustained throughput per point; rendered as the carbon-fixation phase map (Decision view). Runner
    sims/compute_phase_grid.py.
