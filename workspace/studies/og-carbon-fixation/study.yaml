behavior_tests:
- name: failure-mode-labelled
  classification: supporting
  description: >-
    Every mechanism-map point carries a limitation label (thermodynamic / electrical / catalytic / transport)
    in every runnable class.
  measure:
    kind: derived
    path: failure_mode_label_coverage
    detail: min over classes of the fraction of points with a finite label
  artifact: >-
    workspace/studies/og-carbon-fixation/artifacts/og-01-cal-electrochemistry/electrochemistry_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: label coverage 1.0 in every class
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: failure-mode-attributed
  classification: supporting
  description: >-
    Electrochemistry exit criterion: the model classes agree on the limitation label on at least 80% of
    the region they both call favorable (throughput >= 10% of each class's own maximum). Below that the
    attribution is structure-sensitive.
  measure:
    kind: derived
    path: failure_mode_agreement_favorable
    detail: fraction of favorable-both points with identical labels
  artifact: >-
    workspace/studies/og-carbon-fixation/artifacts/og-01-cal-electrochemistry/electrochemistry_report.json
  pass_if:
    op: '>='
    value: 0.8
    detail: cross-class label agreement >= 0.8 in the favorable region
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: mechanism-map-ledger-closes
  classification: supporting
  description: The charge ledger closed on every mechanism-map run of every class.
  measure:
    kind: derived
    path: mechanism_map_ledger_all_ok
    detail: 1 when charge_ledger_ok on every point
  artifact: >-
    workspace/studies/og-carbon-fixation/artifacts/og-01-cal-electrochemistry/electrochemistry_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: ledger ok on all points
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: charge-ledger-closes
  classification: supporting
  description: >-
    Kirchhoff residual |anode - (carbon + H2 evolution)| / anode at machine precision every tick of the
    canonical run.
  measure:
    kind: derived
    path: charge_ledger_residual_max
    detail: worst-case charge residual
  pass_if:
    op: <=
    value: 1.0e-09
    detail: charge residual within tolerance
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: faradaic-efficiency-bounded
  classification: supporting
  description: >-
    Electrons delivered to carbon never exceed the electrons supplied (faradaic efficiency <= 1).
  measure:
    kind: derived
    path: faradaic_efficiency_max
    detail: worst-case faradaic efficiency over the run
  pass_if:
    op: <=
    value: 1.000001
    detail: FE <= 1 (1e-6 rounding allowance)
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: current-voltage-residual
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    The galvanic-cell circuit equation E_c(j) - E_a(j) - j R = 0 is solved to tolerance every tick.
  measure:
    kind: derived
    path: iv_residual_max
    detail: worst-case |residual| / emf_fresh
  pass_if:
    op: <=
    value: 1.0e-06
    detail: circuit residual below 1e-6
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
- name: current-in-altair-window
