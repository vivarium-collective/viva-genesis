  measure: joint_feasibility_region
  pass_if:
    op: '>='
    value: 0.5
visualizations:
- name: coupling-overlap
  address: local:CouplingOverlapViz
  config:
    title: A narrow joint-feasible regime — selection and enclosure must align
  rendered: workspace/studies/study-contact-to-enclosure-coupling/viz/coupling-overlap.html
findings:
- id: s-coupling-joint-regime-exists
  statement: 'A self-reinforcing contact+enclosure regime EXISTS: joint_feasibility_region=0.91
    when exchange selects contact AND contact''s adhesion overcomes the bending barrier
    AND the seal persists. It collapses to 0.07 when contact is not selected (benefit<cost),
    and (directly measured) toward zero when enclosure destabilises (0.14) or the
    bending barrier blocks sealing (0.21). So selection-for-contact and stable enclosure
    CO-SUCCEED only when all three conditions align — the coupled eukaryogenesis transition
    is feasible along the syntrophy->enclosure path, but narrowly.'
  status: confirms
  evidence:
    observed: 0.906
    from_test: study-contact-to-enclosure-coupling-discriminates
    from_run: proto_endosymbiosis_coupled baseline (aligned) vs decoupled-control
      variant, seed 1
  inferential_scope: Reduced four-compartment coupled model (lc<->hc_un<->hc_se, hc_st
    stalled trap) with contact providing enclosure's adhesion and enclosure locking
    in the exchange benefit. Establishes that a jointly-feasible regime EXISTS and
    is contingent on all three sub-mechanisms; does not resolve the spatial membrane
    PDE or full energy accounting (M4).
