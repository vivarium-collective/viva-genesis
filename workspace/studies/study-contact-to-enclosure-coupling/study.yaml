name: study-contact-to-enclosure-coupling
title: 'Contact-to-enclosure coupling: do the same conditions that select proximity also permit enclosure?'
investigation: eukaryogenesis
question: Do the same conditions that select proximity also permit enclosure?
claim: Selection-for-contact and stable enclosure co-succeed (joint feasibility 0.91) only when exchange benefit, sealing, and persistence all align — contact supplies the adhesion enclosure needs and enclosure locks in the exchange benefit that keeps contact selected; the reinforcing regime is real but narrow (0.07 when decoupled).
hypothesis: The selected-contact regime and the feasible-enclosure regime overlap (continuous bridge exists).
concept: endosymbiosis transition bridge
topic: eukaryogenesis
