schema_version: 4
name: og-05-environmental-to-internal-bioenergetics
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: Owning Its Energy
question: Can selection move from externally imposed gradients toward internally maintained
  electrochemical states (catalytic ion transport then pumping)?
hypothesis: When membrane permeability, Na+/H+ coupling and catalyst efficiency vary
  under selection, systems with increasing internal gradient generation win on throughput
  + persistence — but only if membranes stay sufficiently leaky (Sojo constraint).
objective: Allow catalytic ion transport and active pumping; test whether selection
  favors internalized gradient generation.
proposed_mechanisms:
- 'H: bioenergetic internalization'
proposed_models_methods:
- evolutionary control loop over membrane parameters
- reward = throughput + persistence
- Sojo leaky-membrane model as baseline
contract:
  face:
    inputs:
      electric_potential:
        _type: float
        _units: volt
      catalyst_efficiency:
        _type: float
        _units: dimensionless
        _min: 0.0
    outputs:
      lineage_fitness:
        _type: float
        _units: dimensionless
      free_energy_flux:
        _type: float
        _units: watt
      internalization:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      survivors:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      mean_permeability:
        _type: float
        _units: meter/second
        _min: 0.0
  conditions:
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates;
    the composite built for this study must declare a ProcessContract matching this
    face (audited via the workbench §Contract panel).
behavior_tests:
- name: selection-internalizes-gradient-generation
  classification: primary
  description: As the external gradient declines, selection drives the population
    to internalize gradient generation (active-pump fraction rises past 0.6).
  measure:
    kind: derived
    path: final_internalization
    detail: active-pump fraction of the surviving population at the collapsed gradient
  pass_if:
    op: '>='
    value: 0.6
    detail: the population internalizes (pump fraction >= 0.6) as the external gradient
      falls
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  - lane2012origin
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: reduced-gradient-dependence
  classification: primary
  description: An internalizing (efficient-pump) lineage persists as the external
    gradient is lowered (survivors stay high).
  measure:
    kind: derived
    path: final_survivors
    detail: surviving strategy mass at the collapsed external gradient
  pass_if:
    op: '>='
    value: 0.5
    detail: internalizing lineage persists (survivors >= 0.5) at the collapsed gradient
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: sojo-constraint-weak-pump-collapses
  classification: primary
  description: 'Discriminating (Sojo 2014): a weak pump cannot internalize, so when
    the external gradient collapses the lineage goes extinct — only sufficiently efficient
    pumps survive the transition.'
  measure:
    kind: cross_run
    detail: efficient-pump survivors vs weak-pump control
  pass_if:
    op: controls_absent
    detail: the weak-pump control collapses (survivors ~0) where the efficient pump
      persists
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  - lane2012origin
  gate_class: acceptance_criterion
- name: energy-cost-accounted
  gate_class: regression_pin
  classification: supporting
  description: Membrane-maintenance energy is outweighed by benefit in the surviving
    population (net-positive free-energy flux).
  measure:
    kind: derived
    path: final_internalization
    detail: internalized population has net-positive flux
  pass_if:
    op: '>'
    value: 0.0
    detail: a net-positive-flux internalized region exists
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - lane2010chemiosmotic
  band_basis: first_principles
literature_anchors:
- expectation: LUCA-like cells can use proton gradients only if membranes remain sufficiently
    leaky
  model_observable: permeability vs viability
  source: Sojo 2014 / Lane 2012
  status_in_workspace: 'Met by the real replicator selection loop — the survival Decision
    map over (pump efficiency × gradient floor) is bounded by the Sojo cost line (η
    ≈ 0.30): efficient pumps internalize and persist (~94% of the grid survives) while
    weak pumps collapse at the gradient transition.'
  cites:
  - sojo2014bioenergetic
  - lane2012origin
baseline:
- name: Environmental to internal bioenergetics
  composite: viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization
  params:
    catalyst_efficiency: 1.0
    v_start: 0.4
    decline_rate: 0.01
claim: Survival off a collapsing gradient is a bounded REGION of (pump catalyst efficiency
  × gradient floor), mapped by a real replicator sweep — a lineage persists either
  by riding a floor that never falls too far OR by internalizing gradient generation,
  but internalizing only pays above the Sojo cost line (η ≈ 0.30). At the operating
  point an efficient pump internalizes (pump fraction 0→0.95) and survives while a
  weak pump collapses — the Sojo-2014 leaky-membrane constraint on bioenergetic internalization.
findings:
- id: og05-internalization-under-selection
  kind: computational
  status: confirms
  statement: As the external geochemical gradient declines over the run, replicator
    selection drives the population from externally-driven (pump fraction ~0) to internalized
    gradient generation (pump fraction ~0.95) while persisting — the bioenergetic
    internalization is an evolutionary outcome, not a scripted upgrade.
  evidence:
    from_test: selection-internalizes-gradient-generation
    observed: internalization 0.00 -> 0.95; survivors 1.0 at the collapsed gradient
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: BioenergeticSelectionProcess replicator dynamics over a (permeability
    × pump) strategy grid with a Sojo leaky-membrane fitness; the declining gradient
    flips the winning strategy from leaky-external to tight-pump.
- id: og05-sojo-constraint
  kind: computational
  status: novel
  statement: A weak pump cannot internalize — when the external gradient collapses,
    the weak-pump lineage goes extinct (survivors → 0) while the efficient-pump lineage
    persists. Internalization is only viable with a sufficiently efficient pump (the
    Sojo leaky-membrane constraint).
  evidence:
    from_test: sojo-constraint-weak-pump-collapses
    observed: efficient survivors 1.0 vs weak-pump survivors 0.0 at collapsed gradient
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: Below a pump-efficiency threshold the internal-pump flux cannot beat
    its cost against the lost external coupling, so no strategy clears the survival
    floor.
- id: og05-survival-phase-map
  seeded_study: og-05b-collapse-rate-sweep
  kind: computational
  status: novel
  statement: 'Survival off the collapsing gradient is a bounded REGION, not two representative
    runs: the native (pump catalyst efficiency × gradient floor) Decision map survives
    at 185/196 points (~94%), with the low-floor / low-efficiency corner going extinct.
    The Sojo cost line (η ≈ 0.30 — where internal pumping clears its maintenance cost
    plus the survival floor) marks the internalize-or-die boundary, and internalization
    (pump fraction > 0.5) fills the efficient interior where the lineage truly OWNS
    its energy rather than riding the residual external gradient.'
  evidence:
    observed: 185/196 (94%) survive over (catalyst_efficiency 0.05–1.3 × gradient_floor
      0.005–0.35); Sojo cost line η≈0.30; internalization 0.009–0.949 across the grid;
      operating point (η=1.0, floor=0.02) deep inside
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: The bioenergetic_survival_map sweeps the real replicator loop under
    the declining gradient and reduces each point to the surviving fraction + the
    survives PASS mask; the Sojo efficiency floor is read from the selection process
    config ((survival_threshold + c_pump + c_base)/k_int). Rendered as the survival
    landscape + internalization map (Decision view).
  next_action: Sweep decline_rate / alternative collapse scenarios to test how the
    survival region deforms with the speed of gradient loss (og-05b).
- id: og05-energy-provenance
  kind: computational
  status: novel
  statement: 'Accounting the free energy by SOURCE (not just the net flux) shows the
    useful disequilibrium shifting from the external geochemical gradient to internally
    maintained power as the environment declines — the external share of the useful
    free energy peaks near ~82% early in the run, then collapses to ~1% as the gradient
    falls while the population persists. The organism comes to "own" its energy: the
    geochemical gradient becomes a resource it taps, not the scaffold that organizes
    it.'
  evidence:
    observed: external share of useful free energy peaks ~82% then falls to ~1% as
      external pmf 0.40 → 0.02 V; survivors 1.0, internalization → 0.95
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: The selection process emits the population-mean provenance breakdown
    (external tap k_ext·pmf·P vs internal pump k_int·pump·eff·(1−P) vs maintenance
    cost); rendered as the stacked energy-provenance trajectory + the gradient-dependence
    curve (Mechanism view).
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reproduces the Sojo-2014 constraint — internalization is viable only with
      a sufficiently efficient pump; a weak pump collapses at the transition.
  explanatory_gain:
    result: POSITIVE
    basis: The evolutionary control loop explains both the internalization transition
      and its Sojo-bounded failure mode from the leaky-membrane fitness.
limitations:
- Coarse-grained deterministic replicator dynamics with calibrated couplings; not
  a wrapped ALife/MD engine.
- The survival map fixes a single gradient-decline scenario (v_start 0.40, decline_rate
  0.01); only efficiency × floor are swept, so the sensitivity to the speed/shape
  of the collapse is not yet mapped.
discovery_implications:
  resolved_uncertainties:
  - Selection can internalize gradient generation as the external gradient falls,
    bounded by the Sojo leaky-membrane constraint.
  - The pump-efficiency threshold is now mapped — the Sojo cost line (η ≈ 0.30) bounds
    a ~94% survival region of (efficiency × floor).
  remaining_uncertainties:
  - How the survival region deforms with the speed/shape of the gradient collapse
    (decline_rate is held fixed in the current map).
  followup_study_proposals:
  - study: og-05b
    rationale: Sweep decline_rate / alternative collapse scenarios to test how the
      survival region and the Sojo boundary shift with the speed of gradient loss.
