schema_version: 4
name: og-05-environmental-to-internal-bioenergetics
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: running
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Investigating
title: Environmental to internal bioenergetics (Campaign V)
question: Can selection move from externally imposed gradients toward internally maintained electrochemical states (catalytic ion transport then pumping)?
hypothesis: When membrane permeability, Na+/H+ coupling and catalyst efficiency vary under selection, systems with increasing internal gradient generation win on throughput + persistence — but only if membranes stay sufficiently leaky (Sojo constraint).
objective: Allow catalytic ion transport and active pumping; test whether selection favors internalized gradient generation.
proposed_mechanisms:
- 'H: bioenergetic internalization'
proposed_models_methods:
- evolutionary control loop over membrane parameters
- reward = throughput + persistence
- Sojo leaky-membrane model as baseline
contract:
  face:
    inputs:
      electric_potential:
        _type: float
        _units: volt
      catalyst_efficiency:
        _type: float
        _units: dimensionless
        _min: 0.0
    outputs:
      lineage_fitness:
        _type: float
        _units: dimensionless
      free_energy_flux:
        _type: float
        _units: watt
      internalization:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      survivors:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      mean_permeability:
        _type: float
        _units: meter/second
        _min: 0.0
  conditions:
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built for this study must declare a ProcessContract matching this face (audited via the workbench §Contract panel).
behavior_tests:
- name: selection-internalizes-gradient-generation
  classification: primary
  description: As the external gradient declines, selection drives the population to internalize gradient generation (active-pump fraction rises past 0.6).
  measure: {kind: derived, path: final_internalization, detail: active-pump fraction of the surviving population at the collapsed gradient}
  pass_if: {op: '>=', value: 0.6, detail: the population internalizes (pump fraction >= 0.6) as the external gradient falls}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [sojo2014bioenergetic, lane2012origin]
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: reduced-gradient-dependence
  classification: primary
  description: An internalizing (efficient-pump) lineage persists as the external gradient is lowered (survivors stay high).
  measure: {kind: derived, path: final_survivors, detail: surviving strategy mass at the collapsed external gradient}
  pass_if: {op: '>=', value: 0.5, detail: internalizing lineage persists (survivors >= 0.5) at the collapsed gradient}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [sojo2014bioenergetic]
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: sojo-constraint-weak-pump-collapses
  classification: primary
  description: 'Discriminating (Sojo 2014): a weak pump cannot internalize, so when the external gradient collapses the lineage goes extinct — only sufficiently efficient pumps survive the transition.'
  measure: {kind: cross_run, detail: efficient-pump survivors vs weak-pump control}
  pass_if: {op: controls_absent, detail: the weak-pump control collapses (survivors ~0) where the efficient pump persists}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [sojo2014bioenergetic, lane2012origin]
  gate_class: acceptance_criterion
- name: energy-cost-accounted
  classification: supporting
  description: Membrane-maintenance energy is outweighed by benefit in the surviving population (net-positive free-energy flux).
  measure: {kind: derived, path: final_internalization, detail: internalized population has net-positive flux}
  pass_if: {op: '>', value: 0.0, detail: a net-positive-flux internalized region exists}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [lane2010chemiosmotic]
  band_basis: first_principles
literature_anchors:
- expectation: LUCA-like cells can use proton gradients only if membranes remain sufficiently leaky
  model_observable: permeability vs viability
  source: Sojo 2014 / Lane 2012
  status_in_workspace: Not yet measurable — module processes not built
  cites:
  - sojo2014bioenergetic
  - lane2012origin
baseline:
- name: Environmental to internal bioenergetics (Campaign V)
  composite: viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization
  params: {catalyst_efficiency: 1.0, v_start: 0.40, decline_rate: 0.01}
claim: Under a declining external gradient, selection drives an efficient-pump population to internalize gradient generation (pump fraction 0→0.95) and persist, while a weak-pump lineage collapses — the Sojo-2014 leaky-membrane constraint on bioenergetic internalization.
result: Efficient pump internalizes (final 0.95) and survives (survivors 1.0); the weak-pump control collapses (survivors 0) as the gradient falls.
findings:
- id: og05-internalization-under-selection
  kind: computational
  status: confirms
  statement: As the external geochemical gradient declines over the run, replicator selection drives the population from externally-driven (pump fraction ~0) to internalized gradient generation (pump fraction ~0.95) while persisting — the bioenergetic internalization is an evolutionary outcome, not a scripted upgrade.
  evidence:
    from_test: selection-internalizes-gradient-generation
    observed: 'internalization 0.00 -> 0.95; survivors 1.0 at the collapsed gradient'
    units: dimensionless
  expected:
    cites: [sojo2014bioenergetic, lane2012origin]
  explanation: BioenergeticSelectionProcess replicator dynamics over a (permeability × pump) strategy grid with a Sojo leaky-membrane fitness; the declining gradient flips the winning strategy from leaky-external to tight-pump.
- id: og05-sojo-constraint
  kind: computational
  status: novel
  statement: A weak pump cannot internalize — when the external gradient collapses, the weak-pump lineage goes extinct (survivors → 0) while the efficient-pump lineage persists. Internalization is only viable with a sufficiently efficient pump (the Sojo leaky-membrane constraint).
  evidence:
    from_test: sojo-constraint-weak-pump-collapses
    observed: 'efficient survivors 1.0 vs weak-pump survivors 0.0 at collapsed gradient'
  expected:
    cites: [sojo2014bioenergetic, lane2012origin]
  explanation: Below a pump-efficiency threshold the internal-pump flux cannot beat its cost against the lost external coupling, so no strategy clears the survival floor.
  next_action: Sweep catalyst_efficiency to bound the pump-efficiency threshold for viable internalization.
  next_action_type: calibrate
report:
  title: Campaign V — environmental to internal bioenergetics
  verdict: PASS — selection internalizes gradient generation; the Sojo constraint bounds it
  confidence: high
  main_insight: Under a declining external gradient, selection favors internalized gradient generation — but only where the pump is efficient enough (the Sojo leaky-membrane constraint); a weak pump goes extinct at the transition.
  conclusion: >-
    The evolutionary control loop shows the final pre-LUCA transition: lineages
    move from externally imposed to internally maintained electrochemical states
    under selection, bounded by the Sojo requirement. Closes the pre-genetic
    milestone of the campaign.
  caveat: Coarse-grained deterministic replicator dynamics (the proposed primary method), not a wrapped ALife/MD engine. The fitness is a Sojo-grounded reduced model with calibrated couplings.
  key_metrics:
  - {label: Final internalization, value: 0.95, status: pass}
  - {label: Efficient survivors, value: 1.0, status: pass}
  - {label: Weak-pump survivors, value: 0.0, status: pass}
  - {label: Internalization rise, value: 0.00→0.95, status: pass}
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reproduces the Sojo-2014 constraint — internalization is viable only with a sufficiently efficient pump; a weak pump collapses at the transition.
  explanatory_gain:
    result: POSITIVE
    basis: The evolutionary control loop explains both the internalization transition and its Sojo-bounded failure mode from the leaky-membrane fitness.
limitations:
- Coarse-grained deterministic replicator dynamics with calibrated couplings; not a wrapped ALife/MD engine.
- Single declining-gradient scenario; the pump-efficiency threshold is shown by two arms, not a full sweep.
discovery_implications:
  resolved_uncertainties:
  - Selection can internalize gradient generation as the external gradient falls, bounded by the Sojo leaky-membrane constraint.
  remaining_uncertainties:
  - The precise pump-efficiency threshold separating viable internalization from extinction.
  followup_study_proposals:
  - {study: og-05b, rationale: Sweep catalyst_efficiency and decline_rate to map the viable-internalization boundary.}
