- {name: survivors, store_path: pop.survivors, units: dimensionless, description: Surviving strategy mass (persistence), status: available}
- {name: lineage_fitness, store_path: pop.lineage_fitness, units: dimensionless, description: Population mean free-energy flux (fitness), status: available}
- {name: free_energy_flux, store_path: pop.free_energy_flux, units: watt, description: Population mean free-energy flux, status: available}
- {name: mean_permeability, store_path: pop.mean_permeability, units: meter/second, description: Population mean membrane permeability, status: available}
- {name: electric_potential, store_path: env.electric_potential, units: volt, description: Declining external geochemical gradient, status: available}
