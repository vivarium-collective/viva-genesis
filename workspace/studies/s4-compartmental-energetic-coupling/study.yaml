schema_version: 4
name: s4-compartmental-energetic-coupling
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S4 — Compartmental energetic coupling: does internalization pay for itself?'
phase: Calibrate
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: bioenergetics
tags:
- symbiosis
- energetics
- atp
- compartment
- proton-gradient
concept: Endosymbiotic dependence made operational as net energetic benefit under a declining external
  gradient. A replicator population (Sojo leaky-membrane fitness) either INTERNALIZES gradient generation
  (efficient pump → tight membrane) and persists, or — with a weak pump — collapses as the external geochemical
  gradient drops. External association vs internalized coupling compared.
question: Does internalization increase net fitness given ATP production, transport losses, upkeep, and
  host-symbiont conflict — and in which parameter regimes is internalization actually harmful?
hypothesis: 'Internalization is net-positive only in a restricted regime: where the pump is efficient
  enough to internalize gradient generation before the external gradient collapses. Outside that regime
  (a weak pump) the population cannot pay the Sojo membrane cost and collapses.'
claim: 'An enclosed partner may develop organelle-like function only under restricted physiological conditions:
  internalization yields a net energetic benefit (the population internalizes gradient generation and
  persists) solely where the pump is efficient; there exist regimes (a weak pump) where internalization
  cannot pay the membrane cost and the population collapses.'
behavior_tests:
- name: internalization-net-energy-positive
  classification: primary
  description: With an efficient pump the population internalizes gradient generation and SURVIVES the
    declining external gradient (net-positive). The survival threshold discriminates the favorable regime
    from the weak-pump control, which collapses.
  measure:
    kind: derived_scalar
    path: settled_internalization_survivors
  pass_if:
    op: '>'
    value: 0.5
    provenance:
      kind: calibration
      note: 'Calibrated (catalyst_efficiency=1.0, v_start=0.40, decline_rate=0.01, gradient_floor=0.02,
        60 steps): survivors settle to 1.00 (PASS; internalization 0.95, autonomy 0.99, lineage fitness
        0.68). The weak-pump control (catalyst_efficiency=0.3, the `weak-pump-control` variant) collapses
        to survivors 0.00 (FAIL; fitness 0.059) — the harmful regime.'
  cites:
  - santana-molina-nee-2025
acceptance_criteria:
- behavior: internalization-net-energy-positive
findings:
- id: s4-internalization-pays-only-with-efficient-pump
  statement: 'Calibrated (60 steps, declining external gradient): with an efficient pump (catalyst_efficiency=1.0)
    the population internalizes gradient generation and survives (survivors 1.00, autonomy 0.99, fitness
    0.68) — internalization is net-positive. The weak-pump control (catalyst_efficiency=0.3) collapses
    (survivors 0.00, fitness 0.059) — a well-characterized harmful regime where internalization cannot
    pay the Sojo membrane cost. An enclosed partner develops organelle-like function only under restricted
    physiological conditions. Direct in-process run.'
  evidence:
    from_test: internalization-net-energy-positive
    measure: settled_internalization_survivors
    observed: 0.99999
    conditions: {pump: efficient}
    fidelity: reproduction
  provenance:
    kind: run
    run_date: '2026-10-28'
    note: 'In-process run of viva_genesis.composites.bioenergetic_internalization (an energetic
      population/reproduction loop under a declining external gradient, 60 steps). Baseline /
      primary condition — efficient pump (catalyst_efficiency=1.0): settled survivors 0.99999
      (internalization 0.95, lineage fitness 0.677). Weak-pump control (catalyst_efficiency=0.3):
      survivors 0.0 (internalization 0.54, fitness 0.059). The conditional claim holds —
      internalization is net-positive only with an efficient pump. Model fidelity is appropriate to
      the energetic-survival question; the whole-cell metabolic-network arm is the next rung.'
  cites:
  - santana-molina-nee-2025
- id: s4-weak-pump-collapses
  statement: 'The weak-pump control (catalyst_efficiency=0.3) collapses: settled survivors 0.0
    (internalization 0.54, lineage fitness 0.059). Internalization cannot pay the Sojo membrane cost
    when the pump is inefficient — the harmful regime that bounds the conditional benefit.'
  evidence:
    from_test: internalization-net-energy-positive
    measure: settled_internalization_survivors
    observed: 0.0
    conditions: {pump: weak}
    fidelity: reproduction
  provenance:
    kind: run
    run_date: '2026-10-28'
    note: 'In-process run of bioenergetic_internalization, weak-pump control (catalyst_efficiency=0.3),
      60 steps: settled survivors 0.0.'
  cites:
  - santana-molina-nee-2025
literature_anchors:
- expectation: Central carbon metabolism has chimeric host+partner enzyme ancestry.
  model_observable: settled_internalization_survivors
  source: Santana-Molina et al. 2025, Nature Ecology & Evolution
  cites:
  - santana-molina-nee-2025
  status_in_workspace: proposed
