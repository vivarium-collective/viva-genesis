findings:
- id: s-bidir-reciprocity-required
  statement: "Obligate bidirectional (two-metabolite, Liebig-limited) syntrophy is\
    \ proximity-dependent much like the one-way case when production is BALANCED (54x\
    \ contact-vs-distal advantage, cf. M6's 49x), but adds a new constraint: the mutual\
    \ benefit is capped at the SCARCER reciprocal flux, so asymmetric production (B=0.2\
    \ vs A=1.0) yields only 0.30 vs 1.52 \u2014 20% of balanced \u2014 even at contact.\
    \ So the syntrophy/hydrogen hypotheses require metabolic RECIPROCITY, not just\
    \ proximity; an imbalanced pair is starved regardless of contact."
  status: confirms
  evidence:
    observed: 1.516
    from_test: study-bidirectional-syntrophy-discriminates
    from_run: proto_endosymbiosis_multimetab balanced (A=B=1.0) vs asymmetric (B=0.2)
      at contact, seed 1
  inferential_scope: Reduced 1-D screened two-field diffusion at steady state with
    Liebig (minimum) coupling; captures the stoichiometric + bidirectional structure,
    not genome-scale metabolic stoichiometry or 3-D geometry.
verdict: supported
confidence: provisional
verdict_rationale: 'Bidirectional-syntrophy campaign: mutualistic_exchange_benefit
  1.52 balanced vs 0.30 asymmetric. Obligate mutualism adds a reciprocity/balance
  requirement beyond the proximity of M1-M6.'
