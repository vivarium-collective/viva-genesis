schema_version: 4
name: og-energy-alt-internalization-threshold
investigation: origins-of-life-vent
created: '2026-10-15'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: 'The Internalization Threshold: When Does Owning an Energy Store Pay, Per Coupling
  Class?'
question: Model Upgrade plan, Phase 6. og-energy showed a pre-ATP carrier can capture
  geochemical free energy into a transferable store, and og-05 showed selection can
  shift a POPULATION toward pumped (internal) bioenergetics as the external gradient
  declines — but both left the energy budget outside the individual. If the coupling
  mechanism is put INSIDE a protocell as a model class on one energy_coupling face
  — the passive external tap, a pumped H+/Na+ gradient store that leaks with the membrane,
  the thioester / acyl-phosphate and polyphosphate carriers, a reduced-metal store
  charged by Fe(II) disproportionation — and each individual's power budget is audited
  by a free-energy ledger, at what coupling activity does the internal store's benefit
  exceed its leak plus the machinery's maintenance, per class, and how does that threshold
  move with the membrane's leak and the external gradient?
hypothesis: 'Internalization pays only where the store can be charged above the load''s
  free energy faster than it leaks: the thioester-class carrier (bond 35 kJ/mol, leaking
  by hydrolysis) pays from a low activity at the nominal membrane; the ion-gradient
  store drains through the Na+ leak at fatty-acid permeabilities and pays only in
  tight membranes; the polyphosphate store (bond 20 kJ/mol) cannot clear a 30 kJ/mol
  load unless nearly fully charged; the Fe-redox store sits near the load potential
  and is marginal. The threshold is thermodynamic (the store potential must clear
  the load), not a fitted rate, so the classes separate on their leak law and bond
  energy — a structure-sensitive answer the sweep reports as such.'
objective: Build the energy_coupling face (passive_gradient | h_na_gradient_leaky_membrane
  | thioester_acyl_phosphate | polyphosphate | fe_redox) with the per-individual autonomy
  readout internal / (internal + external) power, the vg-data package energy_currencies
  (drives, H+/Na+ permeabilities, carrier bonds and decay, per-cell turnover and maintenance),
  the FreeEnergyLedgerProcess (free_energy_in >= work + dissipated with the store,
  exact every tick) and the protocell_energetics composite; sweep passive -> active
  coupling across the classes, the membrane leak and the gradient state, and find
  where internalization pays.
claim: 'Owning an energy store pays only where the store can be charged above the
  load''s free energy faster than it leaks, and WHICH chemistry can do that at a given
  membrane is the structural answer: a thioester-class carrier internalizes from a
  tenth of the drive at fatty-acid-like leak, a Fe-redox store only at near-full activity,
  a pumped H+/Na+ gradient only once the membrane is a hundred times tighter (the
  Sojo constraint, per individual), and a polyphosphate store not at all against a
  30 kJ/mol step. The free-energy ledger (free_energy_in >= work + dissipated with
  the store) closes to rounding on every one of the 990 runs, so none of these thresholds
  is a bookkeeping artefact — they are the leak law and the bond energy against the
  load, in a coarse-grained model.'
findings:
- id: ogenergyalt-thioester-pays-from-low-activity
  kind: computational
  status: novel
  statement: 'At the nominal membrane and gradient the thioester / acyl-phosphate
    store beats the passive baseline from coupling activity 0.10: its potential bond
    + RT ln(q/(1-q)) crosses the 30 kJ/mol load at q = 0.12 (29.6 kJ/mol) and work
    begins to flow; net power rises from the passive 1.95e-17 W to a maximum 2.17e-17
    W at activity 0.8 (+2.1e-18 W, autonomy 0.24) and falls again at 1.0 as the machinery
    cost outgrows the pool-limited store. The class pays on 54 % of the whole grid
    and up to P_H 3.2e-6 m/s.'
  evidence:
    from_test: thioester-threshold-activity
    observed: a* = 0.10; autonomy 0.027 at a*, 0.262 at a = 1; best +2.1e-18 W at
      0.8; ceiling 3.2e-6 m/s
    units: dimensionless
  explanation: 'Charging at a x 1e-21 mol/s against hydrolysis 1e-4/s + carrier permeation
    1e-4 x P_H x A/V (6e-4/s at 1e-6 m/s) sets q(a); the draw gate opens once mu(q)
    >= 30 kJ/mol, i.e. q >= 0.13 for a 35 kJ/mol bond. Artifact: artifacts/internalization_threshold_report.json
    (per_class.thioester_acyl_phosphate.nominal).'
  expected:
    cites:
    - buckel2013energy
    - lane2010chemiosmotic
- id: ogenergyalt-ion-gradient-needs-tight-membrane
  kind: computational
  status: confirms
  statement: 'The pumped H+/Na+ gradient store never pays at fatty-acid-like leak:
    at P_H 1e-6 m/s its potential reaches only 6.5 kJ/mol at full activity (q = 0.11;
    the Na+ leak at 1e-3 x P_H x A/V = 6e-3/s outruns the pump), so it draws no work
    and costs 5e-18 W of maintenance (net 1.45e-17 vs passive 1.95e-17 W). At P_H
    1e-8 m/s it pays from activity 0.5 with autonomy 0.97 — the Sojo-2014 tradeoff
    inside one individual: the same leak that feeds the external tap drains the ion
    store, so owning a gradient needs a membrane tight to Na+.'
  evidence:
    from_test: ion-gradient-pays-fraction
    observed: pays on 4 % of the grid; ceiling P_H 1e-8 m/s; potential 6.5 kJ/mol
      at nominal, autonomy 0.97 at 1e-8
    units: dimensionless
  explanation: The ion store's leak is the only leak law tied to the membrane permeability
    (ratio x P_H); the chemical carriers leak by hydrolysis independent of the membrane
    and by a 10-100x smaller permeation, so only the ion class has a permeability
    ceiling two decades below the others.
  expected:
    cites:
    - sojo2014bioenergetic
- id: ogenergyalt-polyphosphate-cannot-clear-the-load
  kind: computational
  status: novel
  statement: 'A polyphosphate store (20 kJ/mol per bond, 100x slower hydrolysis than
    the thioester) never beats the passive baseline on the grid: clearing a 30 kJ/mol
    load needs RT ln(q/(1-q)) >= 10 kJ/mol, i.e. q > 0.98, and the drive turnover
    against carrier permeation charges it only to q = 0.69 (22 kJ/mol) at full activity.
    Kinetic stability does not substitute for bond energy once the load is fixed.'
  evidence:
    from_test: polyphosphate-pays-fraction
    observed: pays on 0 % of the grid; potential 22.1 kJ/mol at q = 0.69 (a = 1, nominal);
      autonomy 0 everywhere at nominal
    units: dimensionless
  explanation: The phosphorylation-potential logic of Buckel & Thauer made per-individual;
    the class would pay against a lower load (expert question).
  expected:
    cites:
    - buckel2013energy
    - natcomm2025phosphateactivation
- id: ogenergyalt-fe-redox-marginal
  kind: computational
  status: novel
  statement: 'The reduced-metal store charged by the Fe(II)-disproportionation drive
    sits at the load: its potential is pinned at 29.3-29.9 kJ/mol (q 0.62-0.67) once
    the draw gate half-opens, so it pays only from activity 0.8 (+1.8e-19 W, autonomy
    0.17 at a*, 0.21 at full activity) and on 18 % of the grid, with a ceiling at
    the nominal P_H 1e-6 m/s.'
  evidence:
    from_test: fe-redox-pays-fraction
    observed: a* = 0.80; autonomy 0.17 at a*; best +1.8e-19 W at 1.0; pays on 18 %
      of the grid
    units: dimensionless
  explanation: With a 28 kJ/mol effective transfer the store must be two-thirds charged
    to clear the load; the result depends directly on the hypothetical bond and drive
    numbers the package flags.
  expected:
    cites:
    - natcomm2025fedisproportionation
- id: ogenergyalt-collapsed-gradient-autonomy
  kind: computational
  status: confirms
  statement: 'With the external gradient collapsed to the og-05 floor (0.02 V) the
    passive baseline keeps 1.7e-18 W; the thioester (3.7e-18 W, autonomy 0.79) and
    Fe-redox (1.9e-18 W, autonomy 0.74) individuals keep a larger positive budget
    drawn mostly from their store, while the ion-gradient and polyphosphate individuals
    go negative (-3.3e-18 W). The per-individual autonomy published by og-05''s selection
    loop from the same power terms is 0.99 at its collapsed gradient (its population-mean
    pump fraction: 0.95).'
  evidence:
    from_test: internalization-pays
    observed: 'collapsed gradient, a = 1, P_H 1e-6: thioester net 3.7e-18 W / autonomy
      0.79; fe_redox 1.9e-18 / 0.74; h_na and polyphosphate -3.3e-18 / 0'
    units: watt
  explanation: Autonomy = internal / (internal + external) is the same readout for
    one individual here and for og-05's population; the switch of og-05's gates to
    it is recorded as a decision.
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2010chemiosmotic
- id: ogenergyalt-ledger-and-provenance
  kind: computational
  status: confirms
  statement: 'Numerical verification: on all 990 runs the cumulative identity in +
    E0 - work - dissipated = E(t) holds to 1.3e-14 relative, the second-law margin
    never goes below rounding (-1e-26 J against ~1e-13 J of intake), the per-tick
    dissipation is never negative and the capture efficiency never exceeds 0.30 (the
    passive tap''s conversion; the internal classes capture less of their gross intake).
    The vg-data package energy_currencies carries 0 measured, 1 calibrated, 8 inferred,
    3 extrapolated and 12 hypothetical parameters with no unsourced non-hypothetical
    entry.'
  evidence:
    from_test: threshold-map-ledger-all-ok
    observed: residual max 1.3e-14; margin min -1e-26 J; dissipation min 0; efficiency
      max 0.30; audit 0/1/8/3/12
    units: dimensionless
  explanation: The store's free energy is an exact function of its charge (ideal mixing
    relative to the resting charge; capacitor for the ion gradient), so every tick's
    flows are differences of that function and the ledger closes by construction —
    the inequality is then a real check on the sign of each flow.
  expected:
    cites:
    - buckel2013energy
conclusion: Internalization pays for the thioester store from activity 0.10 and for
  the Fe-redox store from 0.80 at the nominal membrane; the pumped H+/Na+ gradient
  pays only below P_H 1e-8 m/s and polyphosphate never against a 30 kJ/mol load; the
  free-energy ledger closes exactly on all 990 runs; the threshold is structure-sensitive
  (agreement 0.46).
conclusion_verdicts:
  biological_validation:
    result: PARTIAL
    basis: Reproduces the Sojo-2014 structure (an ion-gradient store needs a tight-to-Na+
      membrane) and the Buckel-Thauer phosphorylation-potential logic (a store must
      clear the load) inside one individual; no per-cell measurement constrains the
      absolute thresholds.
  explanatory_gain:
    result: POSITIVE
    basis: Explains WHICH coupling chemistry can internalize at a given membrane leak
      and WHY (leak law x bond energy against the load), with the free-energy ledger
      closing on every point.
limitations:
- Every per-cell number (drive turnover, maintenance, pool, draw rate, load) is hypothetical;
  the package's priors were not propagated (nominal grid only).
- The store is an ideal-mixing (chemical) or capacitor (ionic) potential with first-order
  relaxation toward equilibrium; no explicit carrier chemistry or ion electrodiffusion.
- The passive tap delivers work at the gradient's potential ungated by the load; the
  internal store's work is gated by the load (a stated asymmetry that favours the
  passive baseline).
- The Fe(II)-disproportionation drive is a placeholder window (reference pending expert
  acceptance); the Na+/H+ permeability ratio's magnitude is swept, only its order
  is inferred.
- One individual at a time; the og-05 population loop reads the same per-individual
  autonomy but is not re-run here.
discovery_implications:
  resolved_uncertainties:
  - At fatty-acid-like leak a chemical carrier (thioester class) internalizes from
    a tenth of the drive; an ion-gradient store needs a membrane ~100x tighter to
    Na+ (the Sojo constraint holds per individual).
  - A polyphosphate store cannot clear a 30 kJ/mol step at any activity on this grid;
    kinetic stability does not replace bond energy.
  - The per-individual autonomy and the population-mean internalization of og-05 read
    the same field and agree in direction (0.99 vs 0.95 at the collapsed gradient).
  remaining_uncertainties:
  - How the thresholds move under the energy_currencies priors (Sobol / LHS over the
    18 free parameters).
  - Whether og-05's selection loop, re-run on the per-individual autonomy with these
    classes inside each strategy, still internalizes at the Sojo cost line.
  - Whether the ion-gradient class pays once the og-04 mixed-amphiphile membrane (divalent-tightened)
    supplies P_H directly.
  followup_study_proposals:
  - study: og-energy-alt-internalization-threshold-b
    rationale: Propagate the energy_currencies priors (LHS over the 18 free parameters)
      through the five classes and report the posterior pays-fraction and the threshold
      distribution per class.
  - study: og-05-alt-per-individual-selection
    rationale: Put the energy_coupling classes inside each og-05 strategy so selection
      acts on the per-individual autonomy and net power rather than the lumped Sojo
      fitness.
decisions_needed:
- question: Replace og-05's population-mean internalization readout (mean active-pump
    fraction) with the per-individual autonomy internal / (internal + external) power
    that the Phase-6 face defines — i.e. re-point og-05's gates (reduced-gradient-dependence,
    final_internalization) at autonomy?
  context: 'Both readouts are now published by BioenergeticSelectionProcess from the
    same per-strategy power terms (internalization 0.95 vs autonomy 0.99 at og-05''s
    collapsed gradient). The per-individual autonomy is the quantity the energy_coupling
    face, og-08''s off-gradient persistence and the Phase-9 autonomy lattice share;
    switching og-05''s gates to it re-grades a passing study on a different (though
    monotone-related) observable. Default here: added, not switched. Expert decision.'
