proposed_mechanisms:
- 'H: bioenergetic internalization — inside the individual, as competing coupling
  classes'
- 'energetics: pre-ATP currencies (thioester / acyl phosphate / polyphosphate / reduced
  metal) and the Sojo leaky-membrane ion gradient'
proposed_models_methods:
- energy_coupling face with five structurally different store laws (none / ionic capacitor
  / chemical ideal-mixing) behind one per-individual power budget
- thermodynamic store gates (drive must clear the store potential to charge; the store
  potential must clear the load to deliver work)
- free-energy ledger (free_energy_in >= work + dissipated with the store) as a contract
  invariant
- sweep over class x coupling activity x membrane permeability x gradient state; pays
  = net power above the passive baseline
implemented_methods:
- 'viva_genesis.bioenergetics.energy_coupling: PassiveGradientCouplingProcess, IonGradientCouplingProcess,
  ThioesterCouplingProcess, PolyphosphateCouplingProcess, FeRedoxCouplingProcess —
  one engine (external tap through the leak; charging gated by the drive vs store
  potential with an exact cap; draw gated by the store potential vs the load; first-order
  leak toward the resting charge), class-specific store free energy / potential /
  leak law.'
- 'viva_genesis.ledger.FreeEnergyLedgerProcess: cumulative in + E0 - work - dissipated
  = E(t) (residual), margin >= 0, per-tick dissipation >= 0, capture efficiency <=
  1.'
- viva_genesis.composites.protocell_energetics (model_energy_coupling axis; og-energy
  GeochemicalDriveProcess for both drives; og-05 EnvironmentalDeclineProcess for the
  collapsing-gradient scenario); viva_genesis.uq.energetics_threshold (sweep, attribution,
  TransitionReport); viva_genesis.viz_energetics.
- viva_genesis.bioenergetics.selection.BioenergeticSelectionProcess now also publishes
  the per-individual autonomy beside internalization.
contract:
  face:
    inputs:
      electric_potential:
        _type: float
        _units: volt
        _min: 0.0
      drive_free_energy:
        _type: float
        _units: kilojoule/mole
        _min: 0.0
      permeability:
        _type: float
        _units: meter/second
        _min: 0.0
      membrane_area:
        _type: float
        _units: meter**2
        _min: 0.0
      compartment_volume:
        _type: float
        _units: liter
        _min: 0.0
    outputs:
      free_energy_in:
        _type: float
        _units: watt
        _min: 0.0
      external_power:
        _type: float
        _units: watt
        _min: 0.0
      internal_power:
        _type: float
        _units: watt
        _min: 0.0
      maintenance_power:
        _type: float
        _units: watt
        _min: 0.0
      work:
        _type: float
        _units: watt
        _min: 0.0
      dissipated:
        _type: float
        _units: watt
        _min: 0.0
      energy_stored:
        _type: float
        _units: joule
        _min: 0.0
      autonomy:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
  conditions:
  - kind: invariant
    name: free_energy_ledger
    expr: in_cum + E0 - work_cum - diss_cum == E(t) to rounding; E(t) >= 0 (free_energy_in
      >= work + dissipated)
  - kind: invariant
    name: dissipation_nonnegative
    expr: dissipated >= 0 every tick
  - kind: invariant
    name: capture_bound
    expr: work_cum / in_cum <= 1
  - kind: invariant
    name: load_gate
    expr: internal work flows only once mu(q) >= load_free_energy
  note: The energy_coupling face (viva_genesis/models.py) is honoured by all five
    classes (assert_face); every port is a canonical vg_* field (schemas.PORT_TO_CANONICAL);
    the FreeEnergyLedgerProcess witnesses the invariants on every run.
behavior_tests:
- name: free-energy-ledger-closes
  classification: primary
  description: The FreeEnergyLedgerProcess closes on the canonical run — exact cumulative
    residual, non-negative second-law margin, dissipation never negative, capture
    efficiency <= 1.
  measure:
    kind: derived
    path: free_energy_ledger_ok_final
    detail: free_energy_ledger_ok on the final tick
  pass_if:
    op: '>='
    value: 1.0
    detail: every ledger witness within tolerance
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: free-energy-residual-exact
  classification: diagnostic
  description: '|in_cum + E0 - work_cum - diss_cum - E(t)| / in_cum stays at rounding
    over the run.'
  measure:
    kind: derived
    path: free_energy_residual_max
    detail: worst-case relative ledger residual
  pass_if:
    op: <=
    value: 1.0e-09
    detail: free-energy accounting exact by construction
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
- name: second-law-margin-nonnegative
  classification: diagnostic
  description: 'free_energy_in >= work + dissipated (cumulatively, with the store):
    the margin in + E0 - work - dissipated never goes negative.'
  measure:
    kind: derived
    path: second_law_margin_min
    detail: minimum margin over the run (joule)
  pass_if:
    op: '>='
    value: -1.0e-24
    detail: non-negative to rounding (per-cell energies are ~1e-16 J)
  units: joule
  requires_simulation: 'yes'
  band_basis: first_principles
- name: individual-is-partly-autonomous
