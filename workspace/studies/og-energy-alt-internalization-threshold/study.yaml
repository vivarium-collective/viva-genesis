key_assumptions:
- One individual (radius 0.5 um) between the external ion gradient (tapped through
  its H+ leak, F P_H A dc pmf, captured at 0.3) and a chemical drive delivered by
  substrate turnover (1e-21 mol/s at full activity) that needs no leak.
- 'Store potentials: chemical carriers mu(q) = bond + RT ln(q/(1-q)) (ideal mixing,
  relative to the resting charge); ion gradient mu(q) = n F pmf_max q (capacitor,
  n = 3 ions per transfer, pmf_max 0.2 V).'
- Charging needs the drive to clear mu(q) (capped exactly); work needs mu(q) to clear
  the 30 kJ/mol load; leaks relax toward the resting charge at hydrolysis / oxidation
  rates plus carrier permeation (ratio x P_H x A/V).
- Maintenance = 1e-19 W base + 5e-18 W x activity; the passive baseline pays only
  the base.
- pays = settled net power above the passive baseline at the same membrane and gradient
  by > 1e-21 W.
expert_questions:
- Is a 30 kJ/mol load the right endergonic step for the first internal store, or should
  the load spectrum (synthesis / transport / maintenance) be resolved?
- Accept natcomm2025fedisproportionation as the drive anchor for the fe_redox class
  (and transcribe its free-energy numbers)?
- Switch og-05's gates to the per-individual autonomy (see decisions_needed)?
