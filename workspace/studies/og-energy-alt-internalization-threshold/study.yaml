literature_anchors:
- expectation: Early membranes were far more permeable to H+ than Na+, so a Na+ gradient
    is the better internal store and tapping the natural gradient needs leak while
    owning one needs a tight membrane
  model_observable: the ion-gradient class's store potential and pays region against
    permeability
  source: Sojo, Pomiankowski & Lane 2014
  status_in_workspace: Reproduced structurally — the ion store pays only below a permeability
    ceiling; the chemical carriers do not share the ceiling.
  cites:
  - sojo2014bioenergetic
- expectation: A transferable currency does work only when its phosphorylation-like
    potential (bond + RT ln q/(1-q)) clears the endergonic step; low-bond carriers
    must be held near full charge
  model_observable: store potential vs load per class; polyphosphate's charge fraction
    at the gate
  source: Buckel & Thauer 2013
  status_in_workspace: Implemented as the draw gate; polyphosphate's 20 kJ/mol bond
    needs q > 0.98 for a 30 kJ/mol load.
  cites:
  - buckel2013energy
