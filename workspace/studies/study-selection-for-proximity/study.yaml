schema_version: '0.4'
name: study-selection-for-proximity
title: Does exchange increase the fitness of contact-seeking phenotypes?
investigation: eukaryogenesis
question: Does exchange increase the fitness of contact-seeking phenotypes?
claim: null
hypothesis: Exchange creates positive selection for contact (adhesion-seeking phenotypes
  invade and persist).
concept: endosymbiosis transition bridge
topic: eukaryogenesis
status: planned
design_status: designed
simulation_status: not_started
evaluation_status: not_started
gate_status: not_started
created: '2026-11-01T02:16:30Z'
parent_studies:
- study: s1-metabolic-partnership
  relation: builds-on
- study: s2-ecology-to-proximity
  relation: builds-on
required_mechanisms:
- Agent-level growth, division, death, adhesion cost, and heritable contact propensity.
- Competition between contact-seeking and non-contact-seeking phenotypes.
- Spatial gradients and diffusivity sweeps with common randomized seeds.
- no_exchange
- no_adhesion
- no_enclosure
- low_vs_high_diffusion
- efficient_vs_inefficient_energy_coupling
- faithful_vs_failed_vertical_transmission
baseline:
- name: baseline
  composite: viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community
  params:
    lineages: fixer:4,reducer:4
    coupling: shared
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
    placement: mixed
    k_diffusion: 0.001
  note: 'First-fidelity CONNECTED arm: reuses the S2 metabolite-exchange community
    (proven params). Measures PREREQUISITE observables (exchange flux, robustness)
    only — the discriminating selection_coefficient requires the coupled proto_endosymbiosis_hybrid
    composite (next-fidelity arm, P2).'
variants:
- name: no-exchange-control
  composite: viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community
  params:
    lineages: fixer:4,reducer:4
    coupling: private
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
    placement: mixed
    k_diffusion: 0.001
  note: 'Matched no_exchange control (coupling=private): the nonnegotiable_controls
    baseline.'
- name: coupled-selection
  composite: viva_genesis.composites.proto_endosymbiosis_hybrid.proto_endosymbiosis_hybrid
  params:
    exchange: 'on'
    benefit_coeff: 1.2
    cost_coeff: 0.3
    init_freq_high: 0.6
    n_initial: 100.0
  note: 'Next-fidelity arm: the proto_endosymbiosis_hybrid coupled model under exchange,
    favorable regime (benefit>cost, above the invasion threshold).'
- name: coupled-no-exchange
  composite: viva_genesis.composites.proto_endosymbiosis_hybrid.proto_endosymbiosis_hybrid
  params:
    exchange: 'off'
    benefit_coeff: 1.2
    cost_coeff: 0.3
    init_freq_high: 0.6
    n_initial: 100.0
  note: Matched no-exchange control on the coupled model — isolates whether exchange
    is NECESSARY for positive selection.
observables:
- selection_coefficient_for_adhesion
- contact_duration_distribution
- exchange_flux_and_growth_rate
- fitness_gain_relative_to_no_exchange
behavior_tests:
- name: study-selection-for-proximity-discriminates
  classification: primary
  description: Syntrophy-first is preferred only where contact phenotypes invade and
    persist with POSITIVE selection under exchange, but not in no-exchange controls.
  measure: selection_coefficient_for_adhesion
  pass_if:
    op: '>'
    value: 0.0
- name: study-selection-for-proximity-contact-duration-distribution
  classification: secondary
  description: 'Preregistered measurement: contact_duration_distribution (bands to
    be sharpened before run).'
  measure: contact_duration_distribution
- name: study-selection-for-proximity-exchange-flux-and-growth-rate
  classification: secondary
  description: 'Preregistered measurement: exchange_flux_and_growth_rate (bands to
    be sharpened before run).'
  measure: exchange_flux_and_growth_rate
- name: study-selection-for-proximity-fitness-gain-relative-to-no-exchange
  classification: secondary
  description: 'Preregistered measurement: fitness_gain_relative_to_no_exchange (bands
    to be sharpened before run).'
  measure: fitness_gain_relative_to_no_exchange
visualizations:
- name: selection-invasion
  address: local:SelectionInvasionViz
  config:
    title: Exchange selects for contact — the adhesive phenotype invades to fixation
  rendered: workspace/studies/study-selection-for-proximity/viz/selection-invasion.html
findings:
- id: s-sel-exchange-selects-contact
  statement: Under metabolic exchange, a heritable contact/adhesion propensity is
    POSITIVELY selected (selection coefficient +0.63, contact fixes) above a frequency-dependent
    invasion threshold; the matched no-exchange control shows NEGATIVE selection (-0.36,
    contact eliminated). Exchange is necessary for selection-for-contact. Supports
    H1-syntrophy-first in the favorable regime; rejects H4-no-integration there.
  status: confirms
  evidence:
    observed: 0.6264
    from_test: study-selection-for-proximity-discriminates
    from_run: proto_endosymbiosis_hybrid coupled-selection (exchange on) vs coupled-no-exchange
      control, seed 1
  inferential_scope: Reduced coupled model (replicator on contact propensity; frequency-dependent
    exchange benefit vs energetic adhesion cost). Establishes that exchange CAN select
    for contact given benefit>cost and partner availability; does NOT model spatial
    exchange PDE or membrane mechanics (M2+). The selection is regime-dependent —
    a frequency threshold exists (full phase map = M4).
