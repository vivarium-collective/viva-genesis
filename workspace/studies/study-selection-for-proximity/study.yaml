    coupling: shared
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
    placement: mixed
    k_diffusion: 0.001
  note: "First-fidelity CONNECTED arm: reuses the S2 metabolite-exchange community\
    \ (proven params). Measures PREREQUISITE observables (exchange flux, robustness)\
    \ only \u2014 the discriminating selection_coefficient requires the coupled proto_endosymbiosis_hybrid\
    \ composite (next-fidelity arm, P2)."
