    coupling: private
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
    placement: mixed
    k_diffusion: 0.001
  note: 'Matched no_exchange control (coupling=private): the nonnegotiable_controls baseline.'
- name: coupled-selection
  composite: viva_genesis.composites.proto_endosymbiosis_hybrid.proto_endosymbiosis_hybrid
  params:
    exchange: 'on'
    benefit_coeff: 1.2
    cost_coeff: 0.3
    init_freq_high: 0.6
    n_initial: 100.0
  note: 'Next-fidelity arm: the proto_endosymbiosis_hybrid coupled model under exchange, favorable regime (benefit>cost, above the invasion threshold).'
- name: coupled-no-exchange
  composite: viva_genesis.composites.proto_endosymbiosis_hybrid.proto_endosymbiosis_hybrid
  params:
    exchange: 'off'
    benefit_coeff: 1.2
    cost_coeff: 0.3
    init_freq_high: 0.6
    n_initial: 100.0
  note: "Matched no-exchange control on the coupled model — isolates whether exchange is NECESSARY for positive selection."
