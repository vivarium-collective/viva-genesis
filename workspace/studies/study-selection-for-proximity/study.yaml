schema_version: '0.4'
name: study-selection-for-proximity
title: 'Selection for proximity: does exchange increase the fitness of contact-seeking phenotypes?'
investigation: eukaryogenesis
question: Does exchange increase the fitness of contact-seeking phenotypes?
claim: Metabolic exchange positively selects a heritable contact/adhesion propensity (selection coefficient +0.63) once the adhesion cost is paid, above a frequency-dependent invasion threshold; the matched no-exchange control selects AGAINST contact (-0.36), so exchange is necessary and contact is not favoured for its own sake.
hypothesis: Exchange creates positive selection for contact (adhesion-seeking phenotypes invade and persist).
concept: endosymbiosis transition bridge
topic: eukaryogenesis
status: complete
design_status: designed
simulation_status: ran
evaluation_status: evaluated
gate_status: not_started
created: '2026-11-01T02:16:30Z'
parent_studies:
- study: s1-metabolic-partnership
  relation: builds-on
- study: s2-ecology-to-proximity
  relation: builds-on
required_mechanisms:
- Agent-level growth, division, death, adhesion cost, and heritable contact propensity.
- Competition between contact-seeking and non-contact-seeking phenotypes.
- Spatial gradients and diffusivity sweeps with common randomized seeds.
- no_exchange
- no_adhesion
- no_enclosure
- low_vs_high_diffusion
- efficient_vs_inefficient_energy_coupling
- faithful_vs_failed_vertical_transmission
baseline:
- name: baseline
  composite: viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community
  params:
    lineages: fixer:4,reducer:4
    coupling: shared
    model_proto_ecology: reaction_universe
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
    placement: mixed
    k_diffusion: 0.001
  note: "First-fidelity CONNECTED arm: reuses the S2 metabolite-exchange community (proven params). Measures PREREQUISITE observables (exchange flux, robustness) only — the discriminating selection_coefficient requires the coupled proto_endosymbiosis_hybrid composite (next-fidelity arm, P2)."
variants:
