findings:
- id: s-sel-exchange-selects-contact
  statement: Under metabolic exchange, a heritable contact/adhesion propensity is POSITIVELY selected (selection coefficient +0.63, contact fixes) above a frequency-dependent invasion threshold; the matched no-exchange control shows NEGATIVE selection (-0.36, contact eliminated). Exchange is necessary for selection-for-contact. Supports H1-syntrophy-first in the favorable regime; rejects H4-no-integration there.
  status: confirms
  evidence:
    observed: 0.6264
    from_test: study-selection-for-proximity-discriminates
    from_run: proto_endosymbiosis_hybrid coupled-selection (exchange on) vs coupled-no-exchange control, seed 1
  inferential_scope: "Reduced coupled model (replicator on contact propensity; frequency-dependent exchange benefit vs energetic adhesion cost). Establishes that exchange CAN select for contact given benefit>cost and partner availability; does NOT model spatial exchange PDE or membrane mechanics (M2+). The selection is regime-dependent — a frequency threshold exists (full phase map = M4)."
