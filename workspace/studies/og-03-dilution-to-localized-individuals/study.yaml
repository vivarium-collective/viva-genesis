schema_version: 4
name: og-03-dilution-to-localized-individuals
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: The First Individual
question: Where in pore geometry (openness × length) does a real thermophoretic + convective trap concentrate a dilute vent feed across the localization threshold — the point at which a bounded, concentrated "individual" forms rather than washing through?
hypothesis: Thermophoresis + convection + adsorption in evolving pores raise local concentration enough that synthesis outruns hydrolysis/leakage in a bounded geometry region; elsewhere washout dominates.
objective: Add pore geometry, adsorption, convection and thermophoresis; find where retention + concentration cross persistence thresholds.
proposed_mechanisms:
- 'F: transport/concentration/retention'
- 'B: evolving pores'
proposed_models_methods:
- FiPy finite-volume with Soret term
- OpenPNM/PoreSpy pore geometry
- reproduce Baaske enrichment
- Damkohler/Peclet/Soret scaling
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      flow_velocity:
        _type: float
        _units: meter/second
        _min: 0.0
      porosity:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
    outputs:
      enrichment_factor:
        _type: float
        _units: dimensionless
        _min: 1.0
      residence_time:
        _type: float
        _units: second
        _min: 0.0
  conditions:
  - kind: invariant
    name: spatial_flux_conservation
    expr: divergence(flux) == source_minus_sink
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built for this study must declare a ProcessContract matching this face (audited via the workbench §Contract panel).
claim: >-
  Localization is real and robust: a real FiPy thermophoretic + convective trap concentrates a dilute
  vent feed into a bounded REGION of pore geometry, mapped natively over (porosity × pore length) —
  long, tight pores localize strongly (a persistent local "individual" emerges) while open / short
  pores wash the feed through (enrichment ~1). The EXTENT of enrichment the favourable trap reaches
  (reduced-model estimate ~1e6–1e7-fold at accumulation Péclet ≈ 18) is a solver-sensitive
  extrapolation above Pe ≈ 13, not a precise resolved result — the defensible claim is that
  localization occurs, not the exact fold-magnitude (Baaske 2007).
result: >-
  The native pore-localization Decision map (porosity 0.05–0.95 × pore length 5e-4–8e-3 m) localizes at
  25/144 points (~17%), enrichment rising with pore length; the favourable trap clears the
  localization frontier at accumulation Péclet 18.4 (reduced-model fold-estimate ~1e6–1e7, magnitude
  solver-sensitive above Pe ≈ 13), while open-pore / 10×-shorter-pore controls collapse to ~1-6×.
confidence_level: high
findings:
- id: og03-baaske-enrichment
  kind: computational
  status: confirms
  statement: A favorable serpentinite pore (5 mm × 0.1 mm, ΔT 30 K, convective flow) clears the Baaske-2007 extreme-accumulation regime at accumulation Péclet 18.4 from the real thermophoretic + convective transport, with FVM flux conserved to machine epsilon. The corresponding fold-enrichment (reduced-model exp(Pe) ≈ 1e6–1e7, nominally ~9.6×10⁷) is an extrapolation whose magnitude is solver-sensitive above Pe ≈ 13 — the graded quantity is the Péclet, not the precise fold.
  evidence:
    from_test: thermophoretic-enrichment-reproduces-baaske
    observed: 'favorable Pe_acc 18.4 (reduced-model fold-estimate ~1e6–1e7); FVM residual ~2e-14'
    units: dimensionless
  expected:
    cites: [baaske2007extreme, mast2010thermal]
  explanation: ThermophoreticTrapProcess solves the steady accumulation column; the Péclet is the resolved readout, while the fold-enrichment = exp(beta·L) is a reduced-model extrapolation. A FiPy↔FEniCS head-to-head cross-check finds the two solvers diverge by up to ~5.6 decades at Pe ≳ 13, so the extreme fold-magnitude is not treated as a precise resolved result.
- id: og03-individual-threshold
  kind: computational
  status: novel
  statement: >-
    The native pore-localization phase map (porosity × pore length) resolves localization as a bounded
    region, not a single favourable/open pair: the real trap localizes above the frontier (Péclet ≈ 18,
    reduced-model fold ≥ 1e6) at 25/144 grid points (~17%), enrichment rising with pore length, while an
    open pore (porosity→1) and a 10× shorter pore wash the feed through (no localization). The map is
    native to og-03's own trap readouts — it no longer borrows og-02's feed/washout axes. Localization
    (an individual forms vs washes through) is robust; the precise fold-magnitude in the high-Péclet
    interior is solver-sensitive (see limitations).
  evidence:
    from_test: open-pore-control-does-not-concentrate
    observed: '25/144 (17%) localized over (porosity 0.05–0.95 × pore length 5e-4–8e-3 m); open-pore does not concentrate (~1×), 10× shorter pore ~6× — both far below the frontier'
    units: dimensionless
  expected:
    cites: [baaske2007extreme]
  explanation: Enrichment rises with pore length and vanishes with confinement/openness — the dilution/localization boundary the campaign sought, read from the real FiPy accumulation solve and rendered as the pore-localization map (Decision view). The frontier LOCATION is robust; the fold-values deep in the high-Péclet interior are a reduced-model extrapolation.
report:
  title: Dilution to localized individuals
  verdict: PASS — localization is real and bounded; controls map the washout boundary (enrichment magnitude solver-sensitive)
  confidence: high
  main_insight: Localization is a bounded region of pore geometry — the native (porosity × pore length) phase map localizes at ~17% of the grid (Péclet ≈ 18), enrichment rising with pore length, and collapses to no-concentration when the pore is open or short. A persistent local "individual" emerges at a geometric threshold the map draws explicitly; the EXTREME fold-magnitude (reduced-model ~1e6–1e7) in the deep interior is solver-sensitive above Pe ≈ 13 and is not asserted as a precise result.
  conclusion: >-
    The real FiPy thermal trap localizes a dilute feed into a bounded region of pore geometry and, in
    its own native (porosity × pore length) Decision map, draws the geometry threshold separating
    concentrated individuals from washed-out bulk. Feeds og-04 (mineral compartments) a concentrated
    starting pocket. Localization holds; the precise enrichment magnitude is caveated as a
    reduced-model extrapolation.
  caveat: Enrichment is the accumulation-column result exp(Pe_acc) with a single geometry calibration to the Baaske magnitude; the FiPy solve provides the profile + conservation witness, but a FiPy↔FEniCS head-to-head cross-check finds the two solvers diverge by up to ~5.6 decades at Pe ≳ 13 — so the extreme fold-enrichment at the trap's Péclet ≈ 18 is a reduced-model extrapolation, not a resolved finite-element result. The robust, defensible finding is that localization occurs (a persistent individual forms vs washes through), not the exact fold-magnitude. The Mechanism view shows a reduced, enrichment-capped live coupling in which the concentrated pore feed crosses og-02's ignition threshold while the well-mixed ocean stays dead — an illustration of why localization matters, not a graded acceptance criterion; quantitative in-pore network persistence is left to the downstream enclosed-network studies (og-04/og-05).
  key_metrics:
  - {label: Localized grid fraction, value: 25/144 (~17%), status: pass}
  - {label: Accumulation Péclet, value: 18.4, status: pass}
  - {label: Favourable enrichment, value: ~1e6–1e7 (reduced-model; solver-sensitive >Pe≈13), status: pass}
  - {label: Open-pore control, value: no concentration (~1×), status: pass}
  - {label: FVM residual, value: ~2e-14, status: pass}
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reaches the Baaske-2007 extreme-accumulation regime (accumulation Péclet 18.4) with controls not concentrating — localization is real; the precise fold-magnitude is a solver-sensitive reduced-model extrapolation, not asserted as a hard benchmark.
  explanatory_gain:
    result: POSITIVE
    basis: Real transport (thermophoresis + convection) explains the geometry threshold for localization; it explains that strong concentration occurs, while the exact fold in the high-Péclet interior remains solver-sensitive.
limitations:
- Enrichment uses the accumulation-column reduced model (exp(Pe_acc)) with one geometry calibration to Baaske; the full 2-D convection-roll enrichment is not solved.
- Enrichment MAGNITUDE is solver-sensitive above Pe ≈ 13 — a FiPy↔FEniCS (dolfinx) head-to-head cross-check of the same spatial-transport face finds the two solvers diverge by up to ~5.6 decades in that regime, where the trap's Péclet ≈ 18 sits. So the ~1e6–1e7-fold figures are reduced-model extrapolations a resolved FEM solver does not confirm; the robust result is that localization occurs, not the exact fold. Per the resolved campaign decision, og-03's enrichment gates are now graded at the resolvable Péclet (the primary gate enrichment-resolved-within-convergence, log10_enrichment > 0 within Pe_acc ≲ 13); the ≥10⁶-fold / ~10⁸ figures are REPORTED as the closed-cell/reduced-model values, not gated as a pass.
- The Mechanism-view trap→network coupling is a reduced, enrichment-capped (60×) illustration, not a graded result; the quantitative in-pore network persistence is carried by the downstream enclosed-network studies.
- og-03 concentrates a SINGLE tracer. The Phase-4 co-localization map (viva_genesis/colocalization_map.py) sweeps the eight-solute MIXTURE over (Péclet × Soret) with the FEM-calibrated surrogate and finds the mixture FRACTIONATES rather than co-localizing in one thermophoretic pore — the fractionation is SORET-DRIVEN — low-S_T solutes (e.g. ammonium) lag the strongly-thermophoretic species, so the co-localization index drops to ~0.18 in the strong-Soret regime (rising toward ~1 where the Soret contrast is weak). A candidate incompatibility. Adsorption is kinetically negligible over the pore transit at prebiotic rates (FEM effective mobile fraction 0.93–1.0 even at k_ads=0.1), so it is NOT the cause. After the surrogate↔FEM reconciliation (kinetic-adsorption fix + contact-time calibration) the surrogate now agrees with the dolfinx reference within ~2–19% (was ~35–90% off) — e.g. coloc_index 0.176 (surrogate) vs 0.171 (FEM) at Pe=1/×8 — so verdict AND degree agree, with only a small residual model-structure difference. And in the resolved FLOW-THROUGH pore enrichment is strongest at low Péclet and washes out as flow rises (1/(1+Pe/pe0)), so og-03's extreme convection-enhanced fold belongs to the closed-cell (recirculating) regime, distinct from the resolved flow-through result.
discovery_implications:
  resolved_uncertainties:
  - A geometric threshold exists — the native (porosity × pore length) map localizes at ~17% of the grid (favourable pores concentrate strongly, open/short pores wash through). Localization is robust to solver choice.
  - The Decision map is native to og-03's own trap readouts (enrichment / Péclet), no longer borrowed from og-02.
  remaining_uncertainties:
  - The precise fold-enrichment in the high-Péclet interior (reduced-model ~1e6–1e7) — a resolved FEM solver (FiPy↔FEniCS) diverges by up to ~5.6 decades above Pe ≈ 13, so the exact magnitude is not pinned.
  - Whether a concentrated autocatalytic network, once enclosed, persists better in the pocket than in the well-mixed bulk — pursued downstream (og-04/og-05 enclose the network).
  - Whether any pore regime co-localizes the FULL prebiotic mixture rather than one tracer — the Phase-4 map finds the mixture fractionates in the strong-Soret regime (co-localization index ~0.18; surrogate 0.176 vs FEM 0.171, agreeing within ~2–19%) because low-S_T species like ammonium lag the strong thermophoretic ones, so the species a protocell needs together may not concentrate in the same place; a candidate incompatibility to map across (Péclet × Soret) and across the Soret uncertainty brackets.
  followup_study_proposals:
  - {study: og-03b, rationale: Quantify how retention time at the localization frontier sets network persistence inside the trapped pocket (optional refinement; not blocking the localization result).}
