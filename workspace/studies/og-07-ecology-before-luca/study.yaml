title: Ecology Before LUCA
question: In connected pore networks with cross-feeding, parasitism, cooperation and
  horizontal exchange, what emergent capabilities arise — compared to ancestral reconstructions,
  without assuming LUCA is primitive?
hypothesis: Heterogeneous populations develop metabolic diversity, cross-feeding and
  robustness single compartments do not; the emergent capability set overlaps the
  anaerobic H2/CO2/FeS LUCA reconstruction as a boundary.
objective: Run heterogeneous populations over a connected pore network; compare emergent
  capability redundancy (robustness) to the isolated counterfactual, and the collective
  repertoire to the LUCA reconstruction as a constraint.
proposed_mechanisms:
- 'ecology: populations + evolution'
- LUCA boundary condition
proposed_models_methods:
- Vivarium multi-agent composites over shared spatial fields
- COBRApy for late-stage genome-scale benchmarks
- evolutionary algorithms
