schema_version: 4
name: og-07-ecology-before-luca
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Ecology before LUCA (Campaign VII)
question: In connected pore networks with cross-feeding, parasitism, cooperation and horizontal exchange,
  what emergent capabilities arise — compared to ancestral reconstructions, without assuming LUCA is primitive?
hypothesis: Heterogeneous populations develop metabolic diversity, cross-feeding and robustness single
  compartments do not; the emergent capability set overlaps the anaerobic H2/CO2/FeS LUCA reconstruction
  as a boundary.
objective: Run heterogeneous populations over shared spatial fields; compare emergent capabilities to
  LUCA reconstructions as a constraint.
proposed_mechanisms:
- 'ecology: populations + evolution'
- LUCA boundary condition
proposed_models_methods:
- Vivarium multi-agent composites over shared spatial fields
- COBRApy for late-stage genome-scale benchmarks
- evolutionary algorithms
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      flow_velocity:
        _type: float
        _units: meter/second
        _min: 0.0
    outputs:
      lineage_fitness:
        _type: float
        _units: dimensionless
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  - kind: invariant
    name: spatial_flux_conservation
    expr: divergence(flux) == source_minus_sink
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built
    for this study must declare a ProcessContract matching this face (audited via the workbench §Contract
    panel).
behavior_tests:
- name: cross-feeding-robustness
  classification: primary
  description: Populations beat single compartments on diversity + robustness.
  measure:
    kind: observable
    detail: diversity + robustness vs single-compartment
  pass_if:
    op: threshold
    detail: higher in connected populations
  requires_simulation: 'yes'
- name: luca-capability-overlap
  classification: supporting
  description: Emergent capabilities overlap the LUCA reconstruction (as a constraint).
  measure:
    kind: observable
    detail: capability set vs LUCA reconstruction
  pass_if:
    op: threshold
    detail: overlap reported as a boundary, not a target
  requires_simulation: 'yes'
  cites:
  - weiss2016physiology
  - moody2024nature
literature_anchors:
- expectation: 'LUCA: anaerobic, H2-dependent, CO2-fixing, FeS-rich (355 protein families)'
  model_observable: emergent capability overlap
  source: Weiss 2016 / Moody 2024
  status_in_workspace: Not yet measurable — module processes not built
  cites:
  - weiss2016physiology
  - moody2024nature
baseline:
- name: Ecology before LUCA (Campaign VII)
  composite: viva_genesis.composites.og_07_ecology_before_luca
  params: {}
  planned: true
parent_studies:
- study: og-06-chemistry-to-heredity
  condition: tests-passed
key_assumptions:
- Use LUCA as a constraint on capabilities eventually acquired, not evidence the first replicators were
  LUCA-like.
parent_relations:
