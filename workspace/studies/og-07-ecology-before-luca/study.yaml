conclusion: A coarse-grained, deterministic cross-feeding metacommunity shows that
  heterogeneous, connected pore compartments develop capability redundancy (robustness)
  a single compartment cannot — strictly, on every seed, above the isolated counterfactual
  run on the identical assignment. Robustness emerges in a bounded (diversity x exchange)
  region, so the result is a phase boundary rather than a trivial monotone gain. The
  overlap with the LUCA reconstruction is treated as a boundary condition on capabilities
  eventually acquired, never a fitting target — so the study does not assume LUCA
  was primitive. Opens the ecological era of the campaign ahead of og-08 (escape from
  the vent).
