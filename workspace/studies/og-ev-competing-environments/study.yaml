schema_version: 4
name: og-ev-competing-environments
investigation: origins-of-life-vent
created: '2026-10-25'
execution_status: completed
study_type: mechanism
title: 'Competing Environments: Are the Discriminating Gates Vent-Specific or Split?'
program: 'Phase-3 discovery cycle (crank next-action: branch on og-vent-specificity, unaddressed criterion). og-vent-specificity refuted a FEATURE-ABLATED generic null (desired result), but left its own acceptance criterion open: specificity against POSITIVE, realistic COMPETING environments was planned, not run. This study runs that test on the compartmentation gate using the grounded salinity-dependent Soret model from og-self-maintaining-concentrated, and reasons the chemistry gates from geochemistry.'
verdict: qualified
confidence: medium
evidence_tier: model
primary_limitation: Only the COMPARTMENTATION gate is quantitatively modelled across environments (the real ThermophoreticTrapProcess law driven by the grounded S_T(I)); the four chemistry gates (sustained H2, Fe/Ni/S catalysis, alkaline pH gradient, carbon flux) are compared by GEOCHEMICAL reasoning + literature, not a fresh multi-environment simulation. The compartmentation closure boundary rides on the same SDS-class S_T magnitude anchor as og-self-maintaining-concentrated (no measured decanoate S_T(I)); robust is the monotone low-salinity direction, not the exact I<=0.005 threshold.
key_assumptions:
- Environments are compared at MATCHED favorable trap geometry (dT 45 K, 5 mm pore, the vent's own best case) so the gate outcome reflects ionic strength alone.
- 'Ionic strengths are literature-grounded per setting: marine vent / black smoker I~0.5-0.7 M, terrestrial hot spring ~0.08 M, freshwater geothermal pond ~0.02 M, low-salinity condensate/meltwater ~0.001-0.005 M.'
- 'The chemistry gates are treated as geochemically determined: serpentinization uniquely sustains the Lost-City H2 flux + Fe/Ni/S interface that freshwater/terrestrial settings lack.'
claim: 'The five discriminating gates are NOT uniformly vent-specific. On the compartmentation (thermophoretic enrichment) gate, driven by the grounded S_T(I), the marine alkaline vent (I~0.6 M) is the WORST performer (aggregation_competent_concentrated ~2e-7, 6-7 orders below CAC) and the gate is monotone in LOW salinity, closing only at freshwater I<=~0.005 M - the OPPOSITE of vent-specific. Meanwhile the chemistry gates (sustained H2, Fe/Ni/S, alkaline pH gradient) are genuinely vent-specific serpentinization geochemistry that freshwater/terrestrial settings do not supply. So competing environments SPLIT the gate set: no single realistic environment passes all five at grounded parameters. og-vent-specificity is re-cast from environment-specific to FEATURE-specific - it discriminates the vent''s features against an ablated null, but a positive competing-environment test shows chemistry favors the vent while compartmentation favors freshwater.'
question: Do the campaign's five discriminating gates detect the serpentinizing alkaline vent specifically, or do competing realistic origin environments (freshwater geothermal, terrestrial hot spring, black smoker) split them?
hypothesis: Because the grounded amphiphile Soret rises with Debye length (1/I), the compartmentation gate is anti-correlated with salinity and will favor freshwater over the marine vent, splitting it from the serpentinization chemistry gates that favor the vent.
experiment: Hold trap geometry + gradient at the vent's favorable case (dT 45 K, 5 mm) and vary ONLY ionic strength across competing environments; drive the real ThermophoreticTrapProcess enrichment law with S_T(I) = soret_of_ionic_strength(I) (both the Piazza-Guarino lambda_D^2 and Duhr-Braun lambda_D laws); score aggregation_competent_concentrated against CAC. Compare the chemistry gates by geochemistry.
primary_output: Per-environment compartmentation-gate outcome (ac_concentrated vs CAC) under both Soret laws, the salinity ordering, and the split against the chemistry gates.
proposed_controls:
- 'Matched-geometry (same dT, pore, base_ac): the environment''s ionic strength is the only mover - isolates salinity from gradient.'
arms:
- id: competing_environments_canonical
  composite: viva_genesis.composites.self_maintaining_concentrated.og_self_maintaining_concentrated
  fidelity: real
  claim: At matched favorable geometry the compartmentation gate is monotone in low salinity; the marine vent is the worst performer, freshwater the best.
conditions:
  baseline:
    name: Compartmentation gate across environments (real thermophoretic trap law driven by grounded S_T(I); marine-vent condition shown as canonical point)
    composite: viva_genesis.composites.self_maintaining_concentrated.og_self_maintaining_concentrated
    canonical: true
    planned: false
    params:
      feed_CO2: 0.002
      delta_T: 45.0
      soret_coeff: 0.0033
  model_settings: []
behavior_tests:
- name: marine-vent-fails-compartmentation
  classification: supporting
  measure:
    kind: derived
    path: ac_concentrated_vent
  pass_if:
    op: <
    value: 1.0
    detail: at its own salinity (I~0.6 M) the marine vent cannot self-concentrate above CAC - the vent is NOT favored on this gate
- name: compartmentation-gate-favors-freshwater
  classification: primary
  measure:
    kind: derived
    path: ac_concentrated_freshwater
  pass_if:
    op: '>='
    value: 1.0
    detail: at freshwater I<=0.005 M the same trap clears CAC (ac ~8e11 PG / 2.6e6 DB) - the gate is anti-vent, favoring low salinity
- name: gate-ordering-monotone-in-low-salinity
  classification: primary
  measure:
    kind: derived
    path: vent_rank_among_environments
  pass_if:
    op: '>='
    value: 1.0
    detail: the marine vent ranks LAST (worst) of the environments on the compartmentation gate - specificity on this gate favors freshwater, not the vent
findings:
- id: ogce-compartmentation-anti-vent
  kind: computational
  evidence_basis: measured
  statement: 'Matched-geometry competing-environments test (dT 45 K, 5 mm, base_ac 9.46e-8), varying only ionic strength, driving the real ThermophoreticTrapProcess law with the grounded S_T(I): the marine alkaline vent (I~0.6 M) gives aggregation_competent_concentrated 2.4e-7 (Piazza-Guarino) / 2.6e-6 (Duhr-Braun) - 6-7 orders below CAC and the WORST of all environments. The gate is monotone in low salinity (hot spring I~0.08 -> 2.4e-6; freshwater pond I~0.02 -> 7.7e-3/0.66; low-salinity I~0.005 -> 7.7e11/2.6e6 PASS; meltwater I~0.001 -> 3.3e12 PASS). The compartmentation gate is therefore ANTI-vent: it favors freshwater, closing only at I<=~0.005 M.'
- id: ogce-chemistry-gates-vent-specific
  kind: literature
  evidence_basis: predicted
  statement: 'The four chemistry gates remain vent-specific by geochemistry: serpentinization of ultramafic rock uniquely sustains the Lost-City dissolved-H2 flux and the Fe/Ni/S catalytic interface (og-vent-environment, supported) that drive carbon flux, formate yield and protometabolic throughput; freshwater geothermal and terrestrial hot-spring settings lack a sustained serpentinization H2 source, and black smokers are acidic with no alkaline pH gradient. So the chemistry gates favor the vent - the opposite environment to the compartmentation gate.'
- id: ogce-gates-split-specificity-qualified
  kind: computational
  evidence_basis: measured
  statement: 'Net: competing realistic environments SPLIT the five discriminating gates - the vent wins the chemistry gates, freshwater wins the compartmentation gate, and no single environment passes all five at grounded parameters. This QUALIFIES og-vent-specificity: it demonstrated feature-specificity (an all-feature-ablated null fails every gate), but a positive competing-environment test shows the gates are not environment-specific. The origin may require a transitional/coupled setting - vent serpentinization chemistry feeding a low-salinity compartmentation stage (a vent-freshwater mixing zone, a freshening excursion, or the heated gas-bubble interface mechanism from og-self-maintaining-concentrated) - rather than one environment satisfying all gates at once.'
