schema_version: 4
name: og-ev-competing-environments
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: exploratory
proposed: true
title: Competing origin environments — cross-cutting falsification (P2)
program: evidence-expansion
honest_caveat: >-
  A cross-cutting FALSIFICATION study with NO assumed favored setting: it asks whether the
  alkaline vent actually outperforms alternative origin environments under matched constraints.
  "The vent does not win" is a fully acceptable, publishable result.
question: >-
  Under matched chemical constraints and matched evidence quality, does the alkaline
  hydrothermal vent OUTPERFORM alternative origin environments (e.g. surface pools / wet-dry
  cycling, acidic springs, other hydrothermal settings) - or is its advantage assumed rather
  than earned?
hypothesis: >-
  No setting is assumed favored. The vent's advantage, if any, is specific to particular
  gates (persistence/concentration) and may be matched or beaten by other settings on others
  (e.g. wet-dry cycling for condensation); the honest output is a scenario-likelihood /
  failure-regime comparison, not a foregone vent win.
objective: >-
  Run the campaign's gates against alternative origin-environment scenarios under matched
  chemical input constraints and matched evidence quality, and compare scenario likelihoods,
  sensitivities and failure regimes with no favored prior.
primary_output: >-
  Scenario likelihood / sensitivity across environments and a failure-regime comparison -
  where each environment wins, ties or fails, per gate.
refines: "cross-cutting across Gate A1 and the whole spine (recorded as a decision, not a single-gate study)"
baseline:
- name: Alkaline hydrothermal vent (the campaign's setting)
  planned: true
  params: {environment: alkaline_vent}
- name: Alternative environments (surface pools / wet-dry cycling, acidic springs, other hydrothermal), matched chemical constraints + evidence quality
  planned: true
  params: {environment: alternatives, matched_constraints: true}
proposed_acceptance_criteria:
- Environments are compared under matched chemical input constraints and matched evidence quality, with NO assumed favored setting.
- Scenario likelihoods / sensitivities and per-gate failure regimes are reported for each environment.
- A "the vent does not outperform" outcome on any gate is reported as a genuine falsification, not tuned toward the vent.
literature_anchors: [sutherland2017opinion, mulkidjanian2012origin, martin2008hydrothermal, tutolo2026rethinking]
visualizations: []
