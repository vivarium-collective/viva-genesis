schema_version: 4
name: og-07-alt-real-metabolite-exchange
investigation: origins-of-life-vent
created: '2026-10-15'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: 'Biochemical Ecology: A Community Function That No Lineage Can Perform, Carried
  by Real Metabolite Flux'
question: Model Upgrade plan, Phase 8. og-07 showed that connected compartments develop
  capability redundancy, but its compartments were capability VECTORS and its cross-feeding
  a symbolic transfer. If every protocell instead carries the Phase-3 rule-generated
  reaction universe (libRoadRunner, eQuilibrator dG') masked to its own catalyst repertoire
  — a carboxylating lineage that can fix CO2 but not hydrogenate, a hydrogenating
  lineage that cannot carboxylate — and the only coupling between them is matter crossing
  their membranes into a shared pore field shaped by the Phase-4 enrichment, does
  the community realise a metabolic function that no lineage performs alone, is that
  function sustained by the flux of a real intermediate rather than by a capability
  being copied, and does it appear before any cell is complete?
hypothesis: 'The reductive C4 branch (oxaloacetate -> malate -> succinate) is split
  across the two incomplete lineages: the fixer carboxylates pyruvate to oxaloacetate
  but cannot reduce it, the reducer can reduce it but never makes it; in a shared
  pore the dicarboxylate crosses from one to the other and malate appears in the reducer
  lineage although neither monoculture ever holds it; cutting the sharing (each agent
  exchanging only with its own copy of the background) removes it; the function depends
  on the membrane permeability of the exchanged diacid and on the pore residence time,
  and it emerges while every cell is still incomplete.'
objective: Build the proto_ecology face (ProtocellNetworkProcess and the matched-null
  class — the Phase-3 universe inside each agent, masked to a lineage repertoire),
  the SpatialCouplingStep onto the Phase-4 field with the exchange rules of a BigraphicalReactiveSystem
  (uptake, secretion, pore diffusion, feed / washout; every firing counted), the EcologyReducerStep
  that recomputes og-07's gate readouts from the agents, the EcologyElementLedgerProcess
  (C / N / P over agents + field) and the vg-data package cnp_resources; run the community,
  its two monocultures, the private (no-sharing) counterfactual, the complete-cell
  (generalist) arm, the segregated placement and the rewired-null arms at the canonical
  point, and the four arms over (diacid permeability x pore residence); grade the
  pre-registered gates.
claim: With real chemistry inside every protocell, a community of two incomplete lineages
  performs a metabolic function — the reductive C4 branch from oxaloacetate to malate
  — that neither lineage performs alone and that a complete cell performs at 20x the
  level, sustained by a dicarboxylate crossing between the lineages through a shared
  pore and not by any capability changing hands; the function precedes cell completeness
  — as a mean-field expectation at copy numbers (4e-3 molecules per femtolitre cell)
  that make a stochastic treatment the next step. It exists only above a diacid permeability
  of ~3e-9 m/s, one to two decades above the measured passage of charged solutes through
  fatty-acid vesicles, so the leakiness of the boundary — not the chemistry — is what
  decides whether ecology before LUCA could run on exchanged intermediates.
findings:
- id: og07alt-community-function-precedes-cell-completeness
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: novel
  statement: 'The community of a carboxylating and a hydrogenating lineage holds malate
    (c4_diacid_hydroxy) at 6.4e-9 M in its reducer agents although the fixer monoculture,
    the reducer monoculture and the private (no-sharing) arm hold 0 M and neither
    monoculture ever produces it; the generalist (complete-cell) arm holds 1.36e-7
    M, so the community reaches 4.7 % of a complete cell (3.9e-3 vs 0.08 molecules
    per 1-fL agent: a mean-field occupancy). The best agent in the community holds
    14 of the 15 product classes in the union (max completeness 0.933, mean 0.867),
    so the function is present while no cell is complete.'
  evidence:
    from_test: community-function-precedes-cell-completeness
    observed: 1 community-only class (c4_diacid_hydroxy); levels community 6.4e-9
      / mono 0 / private 0 / generalist 1.4e-7 M; max completeness 0.933
    units: molar
  explanation: 'The fixer''s carboxylate_alpha rule makes oxaloacetate from pyruvate
    + CO2 (gross 5e-6 M/s) but the fixer has no reduction rule; the reducer''s reduce_carbonyl
    rule turns oxaloacetate + H2 into malate but the reducer has no carboxylation
    rule. Both lineages are the same universe with 413 reversible reactions, eQuilibrator
    dG'' and detailed balance; only the 0/1 rule mask differs. Artifact: artifacts/community_function_map.json
    (gate.levels, gate.max_cell_completeness).'
  expected:
    cites:
    - wolos2020synthetic
    - weiss2016physiology
- id: og07alt-sustained-by-real-flux
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: novel
  statement: 'The community-only function vanishes when nothing is shared (private
    arm: each agent exchanges only with its own copy of the background; malate 0 M)
    and its precursor oxaloacetate — a species the reducer cannot make in monoculture
    — crosses between the lineages at 1.8e-27 mol per tick (1.1e-3 molecules per tick
    over the 8 agents), while formate (1.7e-24) and lactate (3.6e-25 mol/tick) carry
    the largest cross-lineage fluxes. The exchange rules fired 468,331 times on the
    canonical run (secretion 135,316, uptake 115,466, pore diffusion 93,009, feed
    / washout 124,540); no rule moves a capability.'
  evidence:
    from_test: community-function-flux-sustained
    observed: vanish without exchange 1/1; precursor oxaloacetate 1.1e-3 molecules/tick;
      firings 468,331
    units: mole/tick
  explanation: 'The SpatialCouplingStep''s BigraphicalReactiveSystem moves only matter,
    as the exact two-compartment relaxation of each species through a size- and charge-dependent
    permeability (same float out of one place, into the other); the cross-lineage
    flux is the moles a species was secreted by one lineage and taken up by another
    in the same tick. Artifact: artifacts/community_function_map.json (gate.precursors,
    gate.vanish_without_exchange, ledger.firings_by_rule_nominal_community).'
  expected:
    cites:
    - jordan2019promotion
    - sojo2014bioenergetic
- id: og07alt-emergence-needs-a-leaky-boundary
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: novel
  statement: Over (diacid permeability x pore residence) the community-only function
    appears from 3e-9 m/s at 20 s and 100 s residence (malate 1.1e-9 / 1.5e-9 M at
    the boundary, 2.0e-8 M at 1e-7 m/s and 100 s) and only at 1e-7 m/s at 500 s residence,
    where the shared feed is depleted; below 3e-9 m/s the dicarboxylate decarboxylates
    back to pyruvate inside the fixer before it can cross. The measured permeability
    of charged solutes through fatty-acid vesicles (~1e-11-1e-10 m/s) lies 1-2 decades
    below the boundary.
  evidence:
    from_test: emergence-boundary-resolved
    observed: emergence at p_diacid = 3e-9 m/s (residence 20, 100 s), 1e-7 m/s (500
      s); 21 points x 4 arms
    units: meter/second
  explanation: 'The membrane rate constant k = P A / V competes with oxaloacetate''s
    thermal beta-decarboxylation (0.02/s) and with the pore washout; the Decision
    map is the region where k wins. The diacid permeability is hypothetical in vg-data
    cnp_resources (the weakest number) and is swept, not asserted; the measured anchor
    is proposed in the investigation''s proposed_inputs (pending). Artifact: artifacts/community_function_map.json
    (decision_map).'
  expected:
    cites:
    - jordan2019promotion
    - mast2010thermal
- id: og07alt-og07-readouts-from-real-agents
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: confirms
  statement: 'og-07''s gate readouts recomputed from the agents map (capabilities
    = product classes held by >= 2 agents): metacommunity robustness 0.54 in the shared
    community vs 0.46 in the private arm, 0.25 / 0.32 in the monocultures and 0.68
    for complete cells; capability diversity 0.46 vs 0.29 (private); LUCA-core overlap
    0.8 for every arm with a fixer (H2 oxidation, CO2 fixation, FeS-type catalysis
    and acetate are realised; ion pumping is unreachable in a C/H/O network), 0.6
    for the reducer alone. The within-run isolated counterfactual (functions an agent
    PRODUCES) equals the held robustness, so og-07''s "acquired capability" has no
    counterpart in real chemistry: what an agent acquires by flux is a precursor,
    and the function it then performs is its own.'
  evidence:
    from_test: connected-beats-isolated
    observed: robustness shared 0.536 - private 0.464 = 0.07; LUCA overlap 0.8 (ceiling
      0.8)
    units: dimensionless
  explanation: 'The EcologyReducerStep keeps og-07''s names (metacommunity_robustness,
    isolated_robustness, robustness_gain, capability_diversity, luca_capability_overlap,
    mean_capability) and reads them off real pools and real fluxes; the connected-vs-isolated
    comparison therefore moves from a within-process counterfactual to the private
    arm. Artifact: artifacts/community_function_map.json (og07).'
  expected:
    cites:
    - weiss2016physiology
    - moody2024nature
- id: og07alt-null-and-segregation-controls
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: novel
  statement: 'The Phase-3 matched null (degree-preserving, (C,O)-matched rewiring)
    inside every agent with the same rule masks yields 0 (seed 0) and 1 (seed 1: c1_methanol,
    2.5e-8 M, absent in its own private arm) community-only classes, so a rule partition
    can split a pathway across lineages in rewired chemistry too; what the real universe
    adds is that the split function is the reductive C4 branch of carbon fixation.
    Segregating the lineages into separate pore blocks keeps the function (1 community-only
    class) because pore diffusion (k_diffusion 0.1/s, hypothetical) carries the intermediate
    between cells.'
  evidence:
    from_test: null-community-only-count
    observed: null community-only classes 0 / 1 over two rewiring seeds; segregated
      placement 1
    units: dimensionless
  explanation: 'Reported, not gated: the gate is existence of a flux-sustained community
    function in the real universe; the null count bounds how much of that is the partition
    rather than the chemistry. Artifact: artifacts/community_function_map.json (null,
    segregated).'
  expected:
    cites:
    - maslov2002specificity
    - blokhuis2020universal
- id: og07alt-element-ledger-and-provenance
  provenance:
    run_ids:
    - viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community__1792076282__f47040
  kind: computational
  status: novel
  statement: 'The cross-system element ledger — C, N and P summed over every agent''s
    interior and every field cell against the pore inflow, washout and the carbon
    degraded to tar — closes on all 98 runs: C residual <= 6.5e-9 (the agents'' CVODE
    tolerance), N <= 1.1e-15 and P <= 1.4e-15 (round-off: no rule transforms them).
    The vg-data package cnp_resources carries 23 parameters: 0 measured, 2 calibrated
    (the Phase-1 carbon feed), 7 inferred, 7 extrapolated, 7 hypothetical (the diacid
    permeability, the C:N:P demand, the pore cells and diffusion), none unsourced.'
  evidence:
    from_test: map-ledgers-close
    observed: C residual max 6.5e-9, N 1.1e-15, P 1.4e-15 on 98 runs; audit 0/2/7/7/7,
      unsourced []
    units: dimensionless
  explanation: The honesty indicator; the headline permeability boundary rests on
    the one hypothetical class and the measured anchor is pending.
  expected:
    cites:
    - kelley2005serpentinite
    - pasek2017schreibersite
    - dorr2003prebiotic
conclusion: One product class — malate, the reductive C4 branch — is held by the community
  of a carboxylating and a hydrogenating lineage and by neither alone; it vanishes
  without sharing, its oxaloacetate precursor crosses between the lineages, no cell
  is complete, and the function needs a diacid permeability of at least 3e-9 m/s;
  the element ledger closes on every run.
conclusion_verdicts:
  biological_validation:
    result: PARTIAL
    basis: Real rule-generated chemistry with eQuilibrator thermodynamics inside every
      agent and conserving exchange, but every permeability is extrapolated or hypothetical
      and the measured charged-solute range sits below the boundary where the function
      appears.
  explanatory_gain:
    result: POSITIVE
    basis: Replaces og-07's symbolic capability transfer with a named intermediate
      and a named membrane constraint, locates the division of labour on a (permeability
      x residence) map, and shows the function at copy numbers that set the agenda
      for a stochastic Phase 8b.
limitations:
- Mean-field chemistry at ~4e-3 molecules per 1-fL agent (4 per 1-pL pore compartment)
  and ~1e-3 precursor molecules per tick between lineages; the C4 branch is sub-molecular
  even in a complete cell at vent feed (0.08 per fL); a Gillespie treatment (as Phase
  7) is the next step and may change the result.
- Permeabilities are size / charge classes (extrapolated from fatty-acid vesicle literature,
  the diacid value hypothetical); the measured charged-solute range is 1-2 decades
  below the emergence boundary.
- Agents are fixed in volume and position (no growth, division or motion — the recorded
  decision); the pore is 4 well-mixed cells with a hypothetical inter-cell exchange
  rate and the Phase-4 enrichment applied as a static profile.
- The C/H/O universe (C <= 4, linear skeletons) has no N or P rules; ammonium and
  phosphate are taken up and conserved but not used, so the C:N:P demand is a readout,
  not a gate.
- One lineage partition (carboxylation vs hydrogenation rules) and one feed; the condenser
  repertoire is inert at vent feed (no formaldehyde) and was not run.
- The rewired null yields a community-only class in one of two seeds; the discrimination
  is in which function, not in whether a partition can split a pathway.
discovery_implications:
  resolved_uncertainties:
  - A metabolic function can be a property of a community of incomplete protocells
    before any cell holds the whole pathway, with the coupling being nothing but molecules
    crossing membranes.
  - The exchanged intermediate and the membrane permeability it needs are named (oxaloacetate;
    ~3e-9 m/s for a dicarboxylate), turning og-07's robustness into a testable membrane
    constraint.
  remaining_uncertainties:
  - Whether the function survives exact low-copy-number stochastics (4e-3 molecules
    per femtolitre cell; 4 per picolitre compartment).
  - The real permeability of dicarboxylates through the Phase-5 boundaries, and whether
    a leakier or neutral intermediate route exists.
  - What a motion model and growth / division do to the division of labour.
  followup_study_proposals:
  - study: og-07-alt-real-metabolite-exchange-b
    rationale: Run the community with an exact SSA per agent (Phase-7 machinery) and
      with the Phase-5 boundary classes supplying the permeabilities; add the N/P-bearing
      rule set so the C:N:P demand can be gated.
  - study: og-08-alt-robust-innovation-set
    rationale: Carry the community (shared pore
    ? exchanged intermediates) into the Phase-9 ablation ensemble as one of the structures
      the minimum innovation set is intersected over.
    : null
decisions_needed:
- question: 'Agent motion model: deferred. Agents are pointed at fixed cells of the
    Phase-4 field; which motion model (none / advected / Brownian between cells /
    thermophoretic) should Phase 8b adopt?'
  context: Mixed and segregated placements give the same community-only function because
    pore diffusion between cells carries the intermediate; a motion model would make
    that mixing a property of the agents.
- question: 'Dicarboxylate permeability: the function needs ~3e-9 m/s at 100 s residence
    while the measured charged-solute passage through fatty-acid vesicles is ~1e-11-1e-10
    m/s. Leakier boundary, longer residence, or a neutral intermediate?'
  context: p_diacid is the one hypothetical permeability class in cnp_resources and
    the Decision axis; the measured anchor (Mansy 2008) is in proposed_inputs, pending.
