proposed_mechanisms:
- 'L: ecology as real metabolite exchange between incomplete protocells'
- division of labour across catalyst repertoires (carboxylation vs hydrogenation)
proposed_models_methods:
- The Phase-3 reaction universe (libRoadRunner) inside every agent, masked to a lineage
  rule repertoire
- A bigraphical reactive system of matter-exchange rules with firing counts
- og-07's gate readouts recomputed from the agents map
- A C / N / P element ledger across agents and field
implemented_methods:
- 'viva_genesis.ecology.proto_ecology: ProtocellNetworkProcess / ProtocellNullNetworkProcess
  (proto_ecology face), SpatialCouplingStep, EcologyReducerStep, REPERTOIRES, the
  product-class vocabulary; viva_genesis.ecology.reactive_system: BigraphicalReactiveSystem
  with UptakeRule, SecretionRule, PoreDiffusionRule, PoreExchangeRule.'
- viva_genesis.ledger.EcologyElementLedgerProcess; composites/metabolite_exchange_community
  with model_proto_ecology and model_localization as class axes; viz_ecology (Decision
  map + exchange map).
- vg-data cnp_resources (23 parameters, full provenance); sims/compute_community_function_map.py
  (98 composite runs -> artifacts/community_function_map.json).
contract:
  face:
    inputs:
      internal:
        _type: map[vg_concentration]
        _units: molar
    outputs:
      internal:
        _type: map[vg_concentration]
        _units: molar
      functions_produced:
        _type: tree
      rule_flux:
        _type: tree
      net_carbon_flux:
        _type: float
        _units: mole/second
      dissipation:
        _type: float
        _units: watt
        _min: 0.0
      element_residual:
        _type: float
        _units: dimensionless
        _min: 0.0
  conditions:
  - kind: invariant
    name: cross_system_element_balance
    expr: total_X(t) = total_X(0) + in_X - out_X - degraded_X for X in C, N, P (C
      at integrator tolerance 1e-4; N, P at 1e-9)
  - kind: invariant
    name: exchange_conserves
    expr: every exchange-rule firing moves the same moles out of one place and into
      the other
  - kind: invariant
    name: element_balance_exact
    expr: max |E S| == 0 over every agent's reactions
  - kind: invariant
    name: energy_directionality
    expr: dissipation >= 0 in every agent every tick
  - kind: invariant
    name: no_capability_transfer
    expr: no rule writes a repertoire; functions_produced follows from each agent's
      own mask
  note: The proto_ecology face (viva_genesis/models.py) is honoured by both classes
    (assert_face); og-07's CrossFeedingMetacommunityProcess is a real non-conformer
    (no pool, symbolic outputs); ports are canonical vg_* fields (schemas.PORT_TO_CANONICAL).
