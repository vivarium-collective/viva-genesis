- expectation: 'LUCA: anaerobic, H2-dependent, CO2-fixing, FeS-rich — embedded in
    an ecosystem'
  model_observable: community.luca_capability_overlap
  source: Weiss 2016 / Moody 2024
  status_in_workspace: 0.8 for every arm with a carboxylating lineage (ceiling 0.8
    — ion pumping is not in a C/H/O network); reported as a boundary.
  cites:
  - weiss2016physiology
  - moody2024nature
- expectation: Fatty-acid vesicles pass small uncharged solutes readily and charged
    solutes slowly
  model_observable: cnp_resources permeability classes (p_small_neutral, p_monoacid,
    p_diacid)
  source: Jordan 2019 (vesicle system); measured charged-solute passage proposed (Mansy
    2008, pending)
  status_in_workspace: The emergence boundary (3e-9 m/s) sits 1-2 decades above the
    measured charged-solute range; the diacid value is hypothetical and swept.
  cites:
  - jordan2019promotion
- expectation: Long tight pores retain solutes (residence set by the thermophoretic
    trap)
  model_observable: SpatialCouplingStep.k_wash (the residence axis)
  source: Baaske 2007 / Mast 2010
  status_in_workspace: The function needs 20-100 s residence at 3e-9 m/s; at 500 s
    the feed depletes and it needs 1e-7 m/s.
  cites:
  - baaske2007extreme
  - mast2010thermal
baseline:
- name: Metabolite-exchange community — fixer + reducer lineages at the canonical
    point
  composite: viva_genesis.composites.metabolite_exchange_community.metabolite_exchange_community
  params:
    lineages: fixer:4,reducer:4
    p_diacid: 1.0e-08
    p_monoacid: 1.0e-07
    k_wash: 0.01
  canonical: true
parent_relations:
- study: og-07-ecology-before-luca
  relation: alternative-to
- study: og-02-alt-reaction-universe
  relation: leads-to
key_assumptions:
- Eight 1-fL protocells (4 fixers, 4 reducers) at fixed positions on a 4-cell pore
  of 10x their volume; feed CO2 1.4 mM, H2 10.8 mM, pyruvate 0.1 mM (the Phase-1 posterior
  point), ammonium 50 uM, phosphate 10 uM; the Phase-4 surrogate enrichment profile
  along the pore.
- A lineage is a subset of the twelve reaction rules; the thermal decarboxylations
  belong to all; fixer = CO2 reduction + carboxylations, reducer = hydrogenations;
  the universe (C <= 4, 413 reactions, eQuilibrator dG', detailed balance) is otherwise
  identical in every agent.
- Exchange is linear permeation by size / charge class (gas 1e-5, small neutral 1e-7,
  large neutral 3e-8, monoacid 1e-7, diacid 1e-8, ion 1e-10 m/s at the canonical point),
  applied as the exact two-compartment relaxation per tick; pore diffusion 0.1/s between
  cells; residence 100 s.
- Functions are product classes (chain length x carboxylation x oxidation state);
  held above 1 nM, produced above 1e-12 M/s gross internal production.
expert_questions:
- Which motion model should agents on the field adopt (none / advected / Brownian
  / thermophoretic)?
- Is a dicarboxylate permeability of 3e-9 m/s defensible for any Phase-5 boundary,
  or should the exchanged intermediate be neutral?
- Should the next lineage partition follow catalyst chemistry (as here) or the Phase-3
  motif structure?
