  relation: builds-on
- study: og-reproduction
  relation: builds-on
split_note: >-
  Split from the former consolidated og-heredity: the EVOLVABILITY half. Canonical arm og-34 (selectable-fitness
  Gate D) with its runs/findings/viz moved here; adopts plan_id 34 so the numeric handoff/builds_on refs from
  studies 35/36/37 (and the receive from 33) resolve here. The chemical-INHERITANCE half stays in og-heredity
  (supported). Every arm verdict, matched null and finding preserved.
