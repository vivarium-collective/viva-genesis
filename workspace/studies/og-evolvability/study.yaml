schema_version: 4
name: og-evolvability
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
verdict: qualified
primary_limitation: "Selective chemical heredity is demonstrated only over the modeled 8-seed x 40-generation regime, with heredity carried by inherited network composition (Option B, compositional/GARD-style); the vasas-2010 evolvability caveat is tested, not waved away."
key_assumptions:
- "Heredity is compositional (inherited network composition), not a sequence template"
- "Selection is scored vs a matched no-inheritance control at equal feeds"
- "Evolvability is assessed over 8 seeds x 40 generations"
evidence_tier: mechanistic_prediction
program: consolidated
title: 'Evolvability and Selection: Is an Inherited Difference Selectable?'
concept: >-
  Evolvability: whether a daughter-inherited chemical difference produces a REPRODUCIBLE, SELECTABLE fitness difference
  and the population shifts under selection rather than drifts — the Vasas-2010 evolvability null. Builds on the
  heritable difference transmitted by og-heredity (6A); this is the Gate-D selectable-fitness result.
gate_reason: >-
  Evolvability half of the former og-heredity (split from the inheritance half, og-heredity). Canonical arm og-34
  (sharpened Gate D): a daughter-inherited chemical difference produces a reproducible, selectable fitness difference
  (parent-offspring correlation +0.949 vs a no-inheritance control; population shift +0.551 vs drift) against
  a matched no-inheritance null. Qualified. Carries plan_id 34 and the numeric handoff/builds_on edges to studies
  35/36/37.
claim: >-
  A daughter-inherited chemical difference produces a reproducible, selectable fitness difference and the population
  shifts under selection rather than drifting: parent-offspring fitness correlation +0.949 vs a no-inheritance
  control, population shift +0.551 vs drift -0.004, against a matched no-inheritance null (og-34, canonical).
  Qualified — evolvability demonstrated on the modeled trait space; open-ended chemical novelty beyond that space
  is not.
question: >-
  Does a daughter-inherited chemical difference produce a reproducible, selectable fitness difference, and does
  the population shift under selection rather than drift?
hypothesis: >-
  An inherited compositional difference maps to a fitness difference that selection can act on, so the protocell
  lineage is evolvable, not merely heritable.
experiment: >-
  Run the sharpened Gate-D composite (og-34): measure parent-offspring fitness correlation and the population
  shift under selection against a matched no-inheritance null (daughters reset to a common composition), preserving
  the og-34 run provenance and findings.
result: >-
  Parent-offspring fitness correlation +0.949 vs a no-inheritance control and a population shift +0.551 vs drift
  -0.004 (perm p ~ 1e-4): the inherited difference is selectable and the population evolves. Qualified: shown
  on the modeled trait space; open-ended novelty is not.
builds_on:
- 6
- 33
plan_id: 34
handoff:
  emits:
  - to: 35
    provides:
    - heritable protocell population
    - selectable composition variation
    - fitness-composition map
  - to: 36
    provides:
    - heritable protocell population
    - selectable composition variation
    - fitness-composition map
  - to: 37
    provides:
    - heritable protocell population
    - selectable composition variation
    - fitness-composition map
  receives:
  - from: 6
    requires:
    - heritable chemical difference
  - from: 33
    requires:
    - dividing protocell population
    - daughter compartments
    - division events (area-doubling budding)
    - inherited content partition
arms:
- id: 34_chemical_heredity_and_selection
  source_study: og-34-chemical-heredity-and-selection
  concept_role: >-
    Sharpened Gate D: a daughter-inherited chemical difference produces a REPRODUCIBLE, SELECTABLE fitness difference
    — parent-offspring correlation +0.949 vs a no-inheritance control; the population shifts under selection.
  fidelity: mechanistic_prediction
  verdict: qualified
  gate_status: passed
  matched_null: matched-null-no-inheritance
  composite: >-
    viva_genesis.composites.og_34_chemical_heredity_and_selection.og_34_chemical_heredity_and_selection
  run_ids: []
  finding_ids:
  - og34-heritable-fitness-or-none
  - og34-population-shifts-under-selection
  - og34-inheritance-scope
  canonical: true
behavior_tests:
- name: receives-33-handoff-bundle
  classification: secondary
  description: >-
    Study 34 consumes study 33's dividing protocell (area-doubling budding division + inherited content partition)
    as the population substrate selection runs on.
  measure:
    kind: observable
    detail: population built on the study-33 dividing protocell with an inherited composition trait
  pass_if:
    op: threshold
    detail: population runs on the study-33 division substrate
  requires_simulation: 'yes'
- name: inherited-difference-reproducible-fitness
  classification: primary
  description: >-
    An inherited network-composition difference produces a reproducible parent-offspring fitness correlation above
    the no-inheritance control (daughters reset to a common composition), permutation-significant.
  measure:
    kind: observable
    detail: parent-offspring fitness correlation
    inheritance vs no-inheritance null: null
    permutation p: null
  pass_if:
    op: threshold
    detail: correlation above the null (perm p < 0.05)
  requires_simulation: 'yes'
- name: population-shifts-under-selection
  classification: primary
  description: >-
    A population under the vent feed shifts composition measurably under selection (toward higher retention) rather
    than drifting, versus the no-inheritance control - the vasas-2010 caveat tested.
  measure:
    kind: observable
    detail: population composition shift over generations
    inheritance vs null: null
    permutation p: null
  pass_if:
    op: threshold
    detail: the population shifts above the null (perm p < 0.05)
  requires_simulation: 'yes'
- name: matched-null-no-inheritance
  classification: primary
  description: >-
    The no-inheritance control (daughters reset to a common composition) is fed the same external fluxes, so any
    heritable difference is a margin over the control, not an artifact of more input.
  measure:
    kind: observable
    detail: null shows neither parent-offspring correlation nor directional shift
  pass_if:
    op: threshold
    detail: null correlation ~ 0 and null drift ~ 0
  requires_simulation: 'yes'
- name: handoff-34-to-35-36-37-complete
  classification: secondary
  description: >-
    The study emits the 34->{35,36,37} bundle - a heritable population with selectable composition variation and
    the fitness-composition map - for the Gate E extensions.
  measure:
    kind: observable
    detail: heritable population + fitness-composition map available
  pass_if:
    op: threshold
    detail: heritable-population handoff available
  requires_simulation: 'yes'
findings:
- id: og34-heritable-fitness-or-none
  evidence_basis: predicted
  evidence_basis_note: "The selectable-heredity signal over 8 seeds x 40 generations is the evolutionary model's outcome vs the vasas-2010 null."
  kind: computational
  status: confirms
  statement: >-
    There IS selectable chemical heredity (not the vasas-2010 null). Across 8 seeds x 40 generations at equal
    feeds, an inherited network-composition difference yields a reproducible parent-offspring fitness correlation
    (mean +0.949) far above the matched no-inheritance control (-0.018; permutation p=0.0001). Fitness is grounded
    in the real study-32/33 coupling (composition -> membrane retention -> standing pool -> division rate), so
    the correlation reflects a genuine mechanistic fitness consequence. Guardrail: selection acts on the inherited
    composition of the sustained A1 carbon-fixing network, not autocatalysis.
  evidence:
    from_test: inherited-difference-reproducible-fitness
  expected:
    cites:
    - segre2000compositional
    - vasas2010lack
- id: og34-population-shifts-under-selection
  kind: computational
  status: confirms
  statement: >-
    The inheriting population shifts composition measurably under selection (mean shift +0.551 toward higher-retention
    / longer-chain composition) while the matched no-inheritance control drifts (-0.004; permutation p=0.0002).
    Selection acts because both heritable variation and a reproducible fitness difference are present - the vasas-2010
    evolvability caveat was tested (declared heritable variance sigma=0.03, not tuned) and the population shifts
    rather than drifts.
  evidence:
    from_test: population-shifts-under-selection
  expected:
    cites:
    - eigen1971selforganization
    - blokhuis2020universal
- id: og34-inheritance-scope
  kind: methodological
  status: confirms
  statement: >-
    Heredity is carried by inherited NETWORK COMPOSITION (Option B, compositional / GARD-style), with the vasas-2010
    evolvability caveat TESTED, not assumed - compositional inheritance carried enough selectable variance here
    for selection to act. Template copying (Option A, og-34a) is the higher-fidelity follow-on that would re-test
    selectable heredity under a copying mechanism, especially where compositional inheritance might prove too
    low-variance in other regimes.
  evidence:
    from_test: inherited-difference-reproducible-fitness
runs:
- id: gate-d-heredity-selection
  composite: >-
    viva_genesis.composites.og_34_chemical_heredity_and_selection.og_34_chemical_heredity_and_selection
  description: >-
    Inheritance vs no-inheritance null across 8 seeds x 40 generations at equal feeds; parent-offspring fitness
    correlation + population composition shift with permutation-test significance. Artifact artifacts/gate_d_heredity.json.
  outcomes:
    inherited-difference-reproducible-fitness:
      result: PASS
      detail: parent-offspring fitness correlation +0.949 vs null -0.018 (permutation p=0.0001)
    population-shifts-under-selection:
      result: PASS
      detail: >-
        population composition shift +0.551 vs null drift -0.004 (permutation p=0.0002); vasas-2010 caveat tested
        (sigma=0.03, not tuned)
    matched-null-no-inheritance:
      result: PASS
      detail: no-inheritance null shows correlation ~0 and drift ~0 at equal feeds
visualizations:
