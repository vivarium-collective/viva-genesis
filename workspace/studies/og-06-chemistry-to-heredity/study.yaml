schema_version: 4
name: og-06-chemistry-to-heredity
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: The First Heredity
question: Does inherited state improve persistence/throughput — comparing RNA-like, peptide-assisted, compositional and hybrid heredity — rather than template replication in isolation? (Do NOT presume RNA.)
hypothesis: At least one heredity module raises lineage persistence + information retention above its non-heritable control under a feasible resource budget; the winner is not assumed a priori.
objective: Introduce competing heredity modules and test whether inherited state improves persistence under feasible budgets.
proposed_mechanisms:
- 'J: polymers, information and heredity (as competing modules)'
proposed_models_methods:
- GillesPy2/StochPy SSA
- rule-based chemistry (BioNetGen/NFsim) for sequence combinatorics
- separate catalyst discovery from inheritance
- explicit fidelity/cost/competition
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
    outputs:
      polymer_length:
        _type: integer
        _units: dimensionless
        _min: 1
      lineage_fitness:
        _type: float
        _units: dimensionless
      information_retention:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      functional_templates:
        _type: float
        _units: dimensionless
        _min: 0.0
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: reproducibility
    expr: solver and db and seed and scenario recorded
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built for this study must declare a ProcessContract matching this face (audited via the workbench §Contract panel).
behavior_tests:
- name: inheritance-beats-noninheritance
  classification: primary
  description: The RNA-like heredity module retains functional information and outscores the non-heritable control (whose function degrades away).
  measure: {kind: derived, path: final_lineage_fitness, detail: RNA-like lineage fitness at steady state}
  pass_if: {op: '>', value: 0.1, detail: inheriting lineage fitness net-positive (and beats the non-heritable control)}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [huber1998peptides]
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: information-retained-above-error-threshold
  classification: primary
  description: The RNA-like module sits above the Eigen error threshold — functional information is retained (C/(C+E) high), not lost to the error catastrophe.
  measure: {kind: derived, path: final_information_retention, detail: C/(C+E) retention at steady state}
  pass_if: {op: '>=', value: 0.4, detail: functional information retained (above the error threshold)}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [huber1998peptides, muchowska2019synthesis]
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: heredity-modules-compared
  classification: primary
  description: 'Two viable heredity modules compared head-to-head: RNA-like (long, high-fidelity) outscores the cheaper, lower-fidelity peptide module — an evidence-based ranking, not assumed.'
  measure: {kind: cross_run, detail: RNA-like vs peptide lineage fitness}
  pass_if: {op: arms_reported, detail: both modules viable; RNA-like ranks above peptide}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [huber1998peptides]
  gate_class: acceptance_criterion
- name: error-catastrophe-below-threshold
  classification: diagnostic
  description: 'Discriminating (Eigen): below the error threshold (low fidelity × long sequence) functional information is lost — retention collapses and inheritance fails.'
  measure: {kind: cross_run, detail: RNA-like vs low-fidelity module}
  pass_if: {op: controls_absent, detail: the low-fidelity module collapses (retention ~0, fitness negative): null}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [huber1998peptides]
- name: replication-feasible-budget
  classification: supporting
  description: Inheritance pays within a feasible replication budget — net-positive fitness after the replication cost, not idealized.
  measure: {kind: derived, path: final_lineage_fitness, detail: net fitness after replication cost}
  pass_if: {op: '>', value: 0.0, detail: net-positive within the replication budget}
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
- name: heredity-lineage-compositional-persists
  classification: primary
  description: 'Do NOT presume RNA. In the agent-based lineage model, compositional (GARD) heredity retains functional information across generations — length-independent — above the non-heritable control, so heredity need not be a long high-fidelity template.'
  measure: {kind: cross_run, detail: compositional vs non-heritable functional persistence in the agent-based lineage}
  pass_if: {op: arms_reported, detail: compositional persistence above threshold and above the non-heritable control (realized heritability separates them)}
  units: dimensionless
  requires_simulation: 'yes'
  cites: [sutherland2017opinion]
  gate_class: acceptance_criterion
literature_anchors:
- expectation: Mineral/CO-driven peptide formation at 100 C, pH 7-10
  model_observable: peptide formation rate/conditions
  source: Huber & Wachtershauser 1998
  status_in_workspace: Represented as the peptide heredity arm in the agent-based lineage comparison (graded fitness 0.24, below RNA-like 0.38 and the compositional/hybrid arms); a reduced coupling, not a first-principles peptide-formation-rate reproduction
  cites:
  - huber1998peptides
baseline:
- name: Chemistry to heredity
  composite: viva_genesis.composites.heredity_module_comparison.heredity_module_comparison
  params: {module: rna-like, temperature: 353.15}
claim: An inherited chemical state improves lineage fitness above its replication cost when it clears the Eigen error threshold — but heredity need NOT presume a long high-fidelity RNA template. An agent-based lineage shows template heredity suffers the length catastrophe (Q=fidelity^length collapses with length) while compositional (GARD) and template-focused hybrid heredity persist length-independently (functional persistence ~0.88, seed-robust across the 5 graded seeds — 0.878±0.005, and 8/8 in a wider sweep) above the non-heritable control, which loses the parent↔offspring correlation and collapses. (A mean-field quasispecies arm still ranks a long high-fidelity template above a cheaper peptide module above non-inheritance when all clear the threshold.)
result: RNA-like fitness 0.38 (retention 0.62) > peptide 0.24 > non-heritable ~0; the low-fidelity module collapses (retention 0, fitness −0.10).
findings:
- id: og06-inheritance-pays
  kind: computational
  status: confirms
  statement: A high-fidelity heredity module (RNA-like, 30-mer, per-site fidelity 0.99 → whole-sequence Q=0.74) retains functional information (C/(C+E)=0.62) and achieves net-positive lineage fitness (0.38) after its replication cost, outscoring the non-heritable control whose function degrades away.
  evidence:
    from_test: inheritance-beats-noninheritance
    observed: 'RNA-like fitness 0.38 (retention 0.62) vs non-heritable ~0'
    units: dimensionless
  expected:
    cites: [eigen1971selforganization, huber1998peptides, muchowska2019synthesis]
  explanation: Real libRoadRunner quasispecies ODE; above the Eigen error threshold correct templates outreplicate the mutational error tail (Eigen 1971).
- id: og06-error-threshold-and-ranking
  kind: computational
  status: novel
  statement: Heredity modules rank by an evidence-based head-to-head — RNA-like (0.38) beats the cheaper, lower-fidelity peptide module (0.24), and both beat non-inheritance — while a module below the error threshold (per-site 0.90 × 30-mer, Q=0.04) suffers the error catastrophe (retention 0, fitness −0.10).
  evidence:
    from_test: heredity-modules-compared
    observed: 'RNA-like 0.38 > peptide 0.24; low-fidelity retention 0, fitness -0.10'
  expected:
    cites: [eigen1971selforganization, huber1998peptides]
  explanation: Whole-sequence fidelity Q = per_site_fidelity^length sets the threshold; longer high-fidelity polymers retain more information but cost more to replicate.
- id: og06-lineage-compositional-escapes-length-catastrophe
  kind: computational
  status: novel
  statement: An agent-based LINEAGE model (individuals inherit a chemical phenotype at fission into a real tree) reproduces the Eigen error threshold (the imposed Q=fidelity^length relation) as a functional-persistence boundary in (per-site fidelity × length) space — AND shows that heredity need not presume a long high-fidelity template — compositional (GARD) and template-focused hybrid heredity persist at functional-persistence ~0.88 (seed-robust — 0.878±0.005 across the 5 graded seeds, 8/8 in a wider sweep) INDEPENDENT of length, where a long low-fidelity template collapses; the non-heritable control loses the parent↔offspring correlation (realized heritability ~0.04–0.11 vs 0.92–0.99 for the heritable modules) and crashes to ~5 individuals.
  evidence:
    from_test: heredity-lineage-compositional-persists
    observed: 'compositional persistence 0.878±0.005 across 5 graded seeds (heritability 0.92), hybrid ~0.88 (0.92) — length-independent; template needs Q=fidelity^length above threshold; non-heritable heritability ~0.04–0.11, collapses every seed'
    units: dimensionless
  expected:
    cites: [eigen1971selforganization, segre2000compositional, sutherland2017opinion]
  explanation: Coarse-grained agent-based reproduction with explicit fidelity/cost/competition. Template inheritance ratchets (Eigen 1971, no back-mutation) so a long low-fidelity template loses information; compositional inheritance drifts by multinomial fission of an autocatalytic composition (GARD, Segré 2000) — length-independent, so it escapes the length catastrophe. The realized heritability (offspring↔parent φ slope) separates true inheritance from the non-heritable control.
report:
  title: Chemistry to heredity
  verdict: PASS — inheritance pays above the Eigen error threshold, and heredity need not presume RNA — compositional/hybrid heredity persists length-independently
  confidence: high
  main_insight: Heredity need not presume a long high-fidelity RNA template. An agent-based lineage reproduces the Eigen error threshold (imposed Q=fidelity^length) at the individual level — a long low-fidelity template suffers the length catastrophe — while compositional (GARD) and template-focused hybrid heredity persist length-independently (functional persistence ~0.88, seed-robust) above the non-heritable control. A mean-field quasispecies arm separately ranks a long high-fidelity (RNA-like) template above a cheaper peptide module above non-inheritance once all clear the threshold.
  conclusion: >-
    Two real engines agree. A libRoadRunner quasispecies ODE shows inheritance is
    favored above the Eigen error threshold and ranks modules head-to-head; an
    agent-based lineage (individuals dividing into a phenotype tree) reproduces that
    threshold AND shows that compositional/hybrid heredity escapes the length
    catastrophe — so the heredity transition does not require a long high-fidelity RNA
    template. Opens the genetic era of the campaign (og-07 ecology, og-08 escape).
  caveat: The functional "benefit" and replication "cost" are reduced couplings; both engines are real — the quasispecies is the Eigen ODE (libRoadRunner) and the lineage is an explicit agent-based reproduction with per-module fidelity/cost/competition.
  key_metrics:
  - {label: RNA-like fitness, value: 0.38, status: pass}
  - {label: RNA-like retention, value: 0.62, status: pass}
  - {label: Peptide fitness, value: 0.24, status: pass}
  - {label: Low-fidelity (catastrophe), value: 0 / −0.10, status: pass}
  - {label: Compositional persistence (seed-robust), value: 0.88, status: pass}
  - {label: Compositional heritability, value: 0.92, status: pass}
  - {label: Non-heritable control heritability, value: ~0.05 (graded), status: pass}
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reproduces the Eigen error threshold (inheritance pays above it, collapses below it) at both mean-field and individual-lineage level, ranks viable modules head-to-head, and shows non-template (compositional/hybrid) heredity persisting length-independently.
  explanatory_gain:
    result: POSITIVE
    basis: Two independent engines — a quasispecies ODE and an agent-based lineage — both reproduce the consequences of the fidelity × length error threshold (the imposed Q=fidelity^length relation) — collapse above the length catastrophe, escape for non-template modes — and the lineage additionally shows compositional/hybrid heredity escaping the length catastrophe (heredity need not presume RNA).
limitations:
- The functional benefit and replication cost are reduced couplings; the quasispecies ODE and the agent-based lineage are the real engines.
- The mean-field arm compares two modules (RNA-like, peptide); the agent-based lineage compares four (template, compositional, hybrid, non-heritable). A fuller chemical module library is deferred.
discovery_implications:
  resolved_uncertainties:
  - Inheritance improves fitness above the Eigen error threshold and can be ranked across modules by an evidence-based head-to-head.
  - Heredity need not presume a long high-fidelity RNA template — compositional (GARD) and hybrid heredity persist length-independently above the non-heritable control.
  remaining_uncertainties:
  - Whether an inherited catalyst actually raises the og-02 network's metabolic throughput in-lineage.
  followup_study_proposals:
  - {study: og-06b, rationale: Couple the winning heredity module to the og-02 rTCA network; measure inherited-catalyst throughput gain.}
