title: 'Enclosure mechanics: can selected contact transition to stable enclosure under physical constraints?'
investigation: eukaryogenesis
question: Can selected contact transition to stable enclosure under physical constraints?
claim: Stable, persistent enclosure is the majority outcome only where adhesion overcomes the membrane bending/neck-closure barrier and survives perturbation; under conflict the membrane seals but unwraps — enclosure stability is a mechanical threshold, not a given once contact exists.
hypothesis: Physically constrained remodelling reaches stable enclosure in a majority of the feasible regime.
