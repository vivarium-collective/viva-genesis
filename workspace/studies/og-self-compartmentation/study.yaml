behavior_tests:
- name: vesicles-form-in-window
  classification: primary
  description: >-
    Mixed single-chain amphiphiles form viable vesicles in the alkaline / seawater-salt window (the broadened
    Jordan-2019 stability map).
  measure:
    kind: derived
    path: settled_viable_compartments
    detail: viable vesicle count in the favorable arm
  pass_if:
    op: '>'
    value: 0.0
    detail: vesicles form (>0) in the mixed-amphiphile window
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
  gate_class: acceptance_criterion
- name: retention-without-isolation
  classification: primary
  description: >-
    Compartments retain internal chemistry AND keep external-gradient access — individuality without isolation
    (retention × access > 0).
  measure:
    kind: derived
    path: settled_individuality_access
    detail: retention × access
  pass_if:
    op: '>='
    value: 0.3
    detail: both retention and access nonzero (a non-empty individuality-vs-access region)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
  - sutherland2017opinion
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: mixed-amphiphile-advantage-over-single
  classification: primary
  description: >-
    Discriminating (Jordan 2019): at seawater salt the mixed amphiphiles form vesicles where a single
    fatty acid fails — the mixed-amphiphile tolerance advantage.
  measure:
    kind: cross_run
    detail: favorable (mixed) viable vs single-fatty-acid control
  pass_if:
    op: controls_absent
    detail: mixed forms vesicles; single fatty acid does not at the same salt
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
  gate_class: acceptance_criterion
- name: membrane-transition-robust
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    Discriminating: extreme salt / acidic pH destroy the membranes — a bounded survival region exists,
    not an always-on membrane.
  measure:
    kind: cross_run
    detail: favorable vs extreme-salt and acidic controls
  pass_if:
    op: arms_reported
    detail: extreme-salt and acidic controls abolish vesicles (survival region is bounded)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
- name: boundary-forms-from-chemistry
  classification: primary
  description: >-
    A new individual appears in the agents map (0 -> >=1) when amphiphile is synthesised from acetate+formate
    and clears cac; with synthesis ablated (k_synth -> 0) the amphiphile stays below cac and NO individual
    forms.
  measure:
    kind: derived
    path: boundary_forms_from_chemistry
    detail: >-
      favorable forms individuals (n_agents>=1) AND synthesis-ablated forms none; from artifacts/endogenous_boundary_report.json
  artifact: >-
    workspace/studies/og-self-compartmentation/artifacts/og-04-alt-endogenous-boundary/endogenous_boundary_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: >-
      boundary caused by the endogenous chemistry — forms in the favorable arm, not in the synthesis-ablated
      control
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - jordan2019promotion
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: rewrite-conserves-matter
  classification: primary
  description: >-
    Every _add boundary-formation rewrite conserves matter — the parcel withdrawn from the localized pool
    exactly equals the new individual's internal amounts (rewrite_ok).
  measure:
    kind: derived
    path: endogenous_rewrite_conservation_ok
    detail: >-
      min over steps of the RewriteLedger conservation flag; from artifacts/endogenous_boundary_report.json
  artifact: >-
    workspace/studies/og-self-compartmentation/artifacts/og-04-alt-endogenous-boundary/endogenous_boundary_report.json
  pass_if:
    op: '>='
    value: 1.0
    detail: rewrite_residual_max == 0 at every structural rewrite
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: receives-30-handoff-bundle
  classification: secondary
  description: >-
    Study 31 receives the full 30→31 bundle — spatially local precursor concentrations, T, pH, residence
    time and competing sinks — as typed inputs, verified complete before the amphiphile chemistry.
  measure:
    kind: observable
    detail: completeness + typing of the 30→31 bundle checked against 30's emitted bundle
  pass_if:
    op: threshold
    detail: bundle received complete and typed
  requires_simulation: 'yes'
- name: no-untracked-amphiphile-feed
  classification: secondary
  description: >-
    Every amphiphile in the model is produced from the study-30 product pool via explicit chain-extension/headgroup
    chemistry; no exogenous amphiphile is fed, and hydrolysis/dilution losses are tracked.
  measure:
    kind: observable
    detail: >-
      amphiphile mass ledger — fraction traceable to the study-30 pool (target 1.0); exogenous feed (target
      0)
  pass_if:
    op: threshold
    detail: no untracked amphiphile feed; losses tracked
  requires_simulation: 'yes'
- name: reaches-measured-assembly-window
  classification: secondary
  description: >-
    The modeled chain-length/headgroup distribution either reaches the experimentally measured critical
    aggregation concentration and a stable phase window, or it falls short; the finding reports which,
    with the distributions, concentrations and losses. (The "makes a membrane" half — demonstrated by
    og-31's Martini-MD cohesion composite; secondary to this PR's benefit test.)
  measure:
    kind: observable
    detail: >-
      endogenous amphiphile concentration + chain-length/headgroup distribution vs. measured CAC + phase
      window
  pass_if:
    op: threshold
    detail: concentration reaches the measured assembly window (else a reported shortfall)
  requires_simulation: 'yes'
- name: handoff-31-to-32-complete
  classification: secondary
  description: >-
    The study emits the 31→32 transfer bundle — structure-resolved amphiphile pools with composition-dependent
    assembly and permeability — as the typed input study 32 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 31→32 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 31→32 handoff validator)
  requires_simulation: 'yes'
- name: membrane-benefit-persistence
  classification: primary
  description: >-
    On the Gate-B pore-concentrated network, an endogenous membrane (reduced retention/access coupling,
    Jordan-2019 vent-calibrated) raises the standing metabolite pool (total organic carbon) above a matched
    no-endogenous-membrane ablation at equal external feed — the membrane pays for itself on persistence
    (the Gate C benefit criterion, retention branch).
  measure:
    kind: observable
    detail: total_organic_carbon(membrane) vs total_organic_carbon(ablation), equal feed
  pass_if:
    op: threshold
    detail: membrane TOC exceeds the ablation TOC (else no persistence benefit)
  requires_simulation: 'yes'
- name: membrane-benefit-access-window
  classification: primary
  description: >-
    The persistence benefit is located as a window in membrane access — it holds for access down to ~0.45
    and inverts below (a too-tight membrane starves the feed; the retained pool drops below the open system).
    The vent-calibrated access sits inside the window.
  measure:
    kind: observable
    detail: membrane TOC vs ablation across an access sweep; locate the inversion boundary
  pass_if:
    op: threshold
    detail: >-
      a bounded access window where membrane TOC exceeds ablation, with a located failure boundary
  requires_simulation: 'yes'
- name: membrane-benefit-throughput
  classification: secondary
  description: >-
    Net carbon-fixation flux (throughput) under the membrane vs the ablation — expected to be flat/lower
    (feed-limited), not improved. Reported to make the persistence-vs-throughput split explicit.
  measure:
    kind: observable
    detail: net_carbon_flux(membrane) vs net_carbon_flux(ablation)
  pass_if:
    op: threshold
    detail: reported either way (the physically-expected null is not a gate failure)
  requires_simulation: 'yes'
- name: permeability-md-informed
  classification: primary
  description: >-
    Membrane permeability is informed by short molecular dynamics of the amphiphile composition (real
    Martini CG-MD bilayer thickness) rather than a free parameter - the longer-chain bilayer is thicker,
    mapping to lower permeability and higher retention.
  measure:
    kind: observable
    detail: MD thickness (long 2.870 nm vs short 2.325 nm) -> permeability -> retention
  pass_if:
    op: threshold
    detail: permeability/retention derived from MD thickness
    moving with composition: null
  requires_simulation: 'yes'
- name: self-maintenance-membrane-integrity
  classification: primary
  description: >-
    Net amphiphile production matches or exceeds degradation at input fluxes held equal to the ablation
    - the metabolism rebuilds its own membrane at least as fast as it degrades (integrity half).
  measure:
    kind: observable
    detail: net membrane_integrity = eta_amph*productive_flux - k_deg*M_req
  pass_if:
    op: threshold
    detail: net production >= degradation
  requires_simulation: 'yes'
- name: beats-ablation-flux-or-persistence
  classification: primary
  description: >-
    The compartmented system exceeds the matched no-endogenous-membrane ablation on productive flux OR
    persistence (standing metabolite pool) at input fluxes held equal - the benefit half of self-maintenance.
  measure:
    kind: observable
    detail: productive_flux + standing pool
    membrane vs ablation: null
    equal feed: null
  pass_if:
    op: threshold
    detail: membrane beats the ablation on flux or persistence
  requires_simulation: 'yes'
- name: matched-null-equal-feeds
  classification: primary
  description: >-
    The no-endogenous-membrane ablation (permeability open, retention 0) is fed exactly the same external
    fluxes, so any Gate C benefit is a margin over the control, not more input.
  measure:
    kind: observable
    detail: external feed ledger - membrane vs ablation feeds held equal
  pass_if:
    op: threshold
    detail: input fluxes equal across arms
  requires_simulation: 'yes'
- name: self-maintenance-windowed
  classification: secondary
  description: >-
    The self-maintenance result is windowed, not a single favorable point - integrity holds only up to
    a located degradation-rate boundary, and the persistence benefit tracks the MD composition.
  measure:
    kind: observable
    detail: k_deg boundary sweep + composition (short/long) sweep
  pass_if:
    op: threshold
    detail: a real upper k_deg boundary is bracketed
  requires_simulation: 'yes'
- name: protonated-vesicle-stable
  classification: primary
  description: >-
    Protonated fatty-acid vesicles retain a closed bilayer shell (populated inner leaflet + coherent head
    shell) across the C10-C16 chain-length window, over independent MD seeds.
  measure:
    kind: observable
    detail: mean inner_leaflet_fraction + head_radial_cv across seeds
    per chain: null
  pass_if:
    op: threshold
    detail: >-
      inner_leaflet_fraction mean >= 0.20 AND head_radial_cv mean <= 0.35 for all protonated chains
  requires_simulation: 'yes'
- name: charged-null-destabilises
  classification: primary
  description: >-
    The matched charged-only null (same chain, fully-ionised SQ5n heads) destabilises toward a micelle
    at the short-chain corner - the control that should FAIL the bilayer criterion.
  measure:
    kind: observable
    detail: charged-null head_radial_cv + inner_leaflet
    vs the protonated arm at the same chain: null
  pass_if:
    op: threshold
    detail: at least the shortest charged chain micellises (cv mean > 0.35 or inner leaflet lost)
  requires_simulation: 'yes'
- name: real-fatty-acid-not-standin
  classification: primary
  description: >-
    The amphiphile is the real single-chain fatty acid (viva-openmm Martini 3 fatty-acid defs + vesicle
    builder), replacing og-32's DLPC/DPPC phospholipid planar-bilayer stand-in.
  measure:
    kind: observable
    detail: vesicle built from martini_v3.0.0_fatty_acids_v1.itp FAnn/FAnnM
    run in martini_openmm: null
  pass_if:
    op: threshold
    detail: real fatty-acid vesicle builds + integrates (finite energy) under the membrane barostat
  requires_simulation: 'yes'
- name: multi-seed-robust
  classification: secondary
  description: >-
    Each arm's verdict is taken on the mean of >= 3 independent MD replicates with the spread reported,
    not a single trajectory - so a near-threshold arm is not a coin-flip.
  measure:
    kind: observable
    detail: per-arm n_seeds
    n_stable_seeds: null
    and the std of each metric: null
  pass_if:
    op: threshold
    detail: at least 3 seeds per arm with reported mean +/- std
  requires_simulation: 'yes'
findings:
- id: og04-mixed-amphiphile-window
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.mixed_amphiphile_protocell.mixed_amphiphile_protocell__1791944482__977ceb
  kind: computational
  status: confirms
  statement: >-
    Mixed single-chain amphiphiles form viable vesicles at alkaline vent pH and seawater ionic strength,
    where a single fatty acid does not — reproducing the Jordan-2019 broadening of the pH / salt / divalent
    stability window.
  evidence:
    from_test: vesicles-form-in-window
    observed: mixed viable ~8000; single-fatty-acid viable 0 at 0.35 M salt
    units: dimensionless
  expected:
    cites:
    - jordan2019promotion
  explanation: >-
    ProtocellAssemblyProcess broadens the pH window + salt/divalent tolerance with the co-surfactant fraction
    (coarse-grained, Jordan-calibrated).
- id: og04-individuality-without-isolation
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.mixed_amphiphile_protocell.mixed_amphiphile_protocell__1791944482__977ceb
  kind: computational
  status: novel
  statement: >-
    The viable compartments retain internal chemistry (retention 0.91) while staying permeable to the
    external gradient (access 1.0) — a non-empty individuality-without-isolation region (product ≈ 0.90),
    the key requirement for a protocell that does not cut itself off from geochemical energy.
  evidence:
    from_test: retention-without-isolation
    observed: retention 0.91 × access 1.0 ≈ 0.90
  expected:
    cites:
    - jordan2019promotion
    - sutherland2017opinion
  explanation: >-
    Selective permeability — low effective permeability to large/charged internal metabolites, higher
    to small external resources.
- id: og04-retention-access-plane
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.mixed_amphiphile_protocell.mixed_amphiphile_protocell__1791944482__977ceb
  kind: computational
  status: novel
  statement: >-
    Sweeping permeability (via temperature) traces the compartment through three regimes on the retention-access
    plane — too closed (retains but starves; low T), a viable window (individuality + access, peak ret×acc
    ≈ 0.92 at ~310 K), and too open (leaks; high T) before the membrane destabilizes entirely. Orthogonally,
    the viable salt ceiling rises with co-surfactant fraction: the feasibility map marks a viable region
    (individuality > 0.1) at 63/256 points (~25%) — vesicles survive at seawater salt (0.35 M) and beyond
    only with enough co-surfactant — the Jordan mixed-amphiphile advantage as a bounded 2-D region, not
    a single point.
  evidence:
    from_test: mixed-amphiphile-advantage-over-single
    observed: >-
      retention 0.97→0 and access rising to 1.00 then falling to 0 across 285–360 K; feasibility viable
      (individ>0.1) at 63/256 points, viable salt ceiling rising with mix_fraction
    units: dimensionless
  expected:
    cites:
    - jordan2019promotion
    - sutherland2017opinion
  explanation: >-
    Temperature sweep → retention-access arc; (mix × ionic strength) sweep → salt-tolerance feasibility
    map; rendered as the retention-access Decision view.
- id: og04-mix-fraction-gotcha
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.mixed_amphiphile_protocell.mixed_amphiphile_protocell__1791944482__977ceb
  kind: methodological
  status: novel
  statement: >-
    The parameter sweep exposed that an exact mix_fraction=0.0 is swallowed by process-bigraph's is_empty(Float,
    0.0) and refilled with the default (0.4), which would silently turn the single-fatty-acid control
    into a mixed-amphiphile run. The composite now clamps 0.0 to a negligible 1e-6 and reads mix_fraction
    via a state input, so the control is honored. (The study runner had already dodged it with 0.001.)
  explanation: >-
    A sweep axis starting at exactly 0.0 revealed the gotcha; the fix hardens the composite for any caller
    passing 0.0.
- id: endogenous-boundary-forms
  provenance:
    run_ids:
    - viva_genesis.composites.endogenous_boundary.endogenous_boundary__1792350382__6fe7d7
  kind: computational
  status: confirms
  statement: >-
    The boundary forms from acetate+formate-derived amphiphile; with synthesis ablated it does not — boundary
    formation is caused by the endogenous chemistry.
  evidence:
    from_test: boundary-forms-from-chemistry
  cites:
  - jordan2019promotion
- id: og31-membrane-pays-on-persistence
  kind: computational
  status: confirms
  statement: >-
    Under the reduced-coupling model, at the Jordan-2019 vent-calibrated retention 0.905 / access 0.997,
    an endogenous membrane raises the standing metabolite pool (TOC) to about 2.9x the no-membrane ablation
    on the Gate-B pore-concentrated carbon-fixing network - the membrane pays for itself on persistence.
    Guardrail: this network is the sustained A1 carbon-fixing metabolism, not autocatalytic (A2 is refuted),
    so this is "a persisting network makes a membrane that pays for itself," not autocatalysis.
  evidence:
    from_test: membrane-benefit-persistence
  expected:
    cites:
    - jordan2019promotion
- id: og31-throughput-not-improved
  kind: computational
  status: contradicts
  statement: >-
    Net carbon-fixation flux under the membrane is about 0.6x the ablation - lower, not higher. Throughput
    is feed-limited, so reduced washout grows the standing pool, not the fixation rate; the benefit is
    on persistence, not throughput, and is reported as such. (The physically-expected result, not a shortfall:
    compartmentalization buys retention/concentration, not faster chemistry.)
  evidence:
    from_test: membrane-benefit-throughput
- id: og31-persistence-benefit-windowed
  kind: computational
  status: partial
  statement: >-
    The persistence benefit is windowed - it holds for membrane access down to about 0.45 and inverts
    below ~0.45, where a too-tight membrane starves the feed and the retained pool drops below the open
    system. The failure boundary is located and the vent-calibrated access (0.997) sits inside the window
    (mirrors Gate B's windowed discipline).
  evidence:
    from_test: membrane-benefit-access-window
- id: og31-reduced-coupling-scope
  kind: methodological
  status: novel
  statement: >-
    This is a reduced-coupling membrane model (retention/access), explicitly NOT the MD-resolved permeability
    PMF. It is the "benefits from it" half of Gate C and complements og-31's Martini-MD cohesion (the
    "makes a membrane" half). The structurally-resolved coupling (amphiphile composition to permeability
    to retention) and thus full Gate C requires study 32 (First Self-Maintaining Protocell) plus the viva-md-membrane
    coupling (to-build).
  evidence:
    from_test: membrane-benefit-persistence
- id: og31-connectivity-brittle-highTOC
  kind: methodological
  status: novel
  statement: >-
    As in Gate B, the network_connected proxy is brittle at high standing pool - membrane connectivity
    reads 0 at high TOC accumulation. This is flagged and does not change the persistence result, which
    is based on the standing metabolite pool (TOC), not connectivity.
  evidence:
    from_test: membrane-benefit-access-window
- id: og32-self-maintains-or-net-cost
  kind: computational
  status: confirms
  statement: >-
    At equal feeds vs the no-endogenous-membrane ablation, the compartment self-maintains in the measurable
    form (verdict qualified). (i) Integrity: net amphiphile production 3.48e-5 >= degradation 1.0e-7 (eta_amph
    0.10, k_deg 1e-4/s, M_req 1e-3 M) - maintained. (ii) Benefit: the membrane beats the ablation on persistence
    (standing organic carbon 1.77e-2 vs 8.96e-3, 1.98x) but not on throughput (net carbon flux 0.79x,
    feed-limited) - so the benefit is retention, not faster chemistry, exactly as og-31 found under the
    reduced coupling. Self-maintaining = integrity and benefit = true; qualified because the benefit is
    persistence-only and the coupling is MD-informed, not PMF-resolved. Guardrail: the metabolism is the
    sustained A1 carbon-fixing network, not autocatalytic.
  evidence:
    from_test: self-maintenance-membrane-integrity
  expected:
    cites:
    - natchem2023osmoticgrowth
    - hanczyc2003experimental
- id: og32-md-informed-permeability
  kind: computational
  status: confirms
  statement: >-
    Membrane permeability is informed by real short Martini 3 CG-MD of the amphiphile composition, not
    a free parameter: the long di-C16 bilayer (thickness 2.870 nm) is thicker than the short di-C12 one
    (2.325 nm), and a published solubility-diffusion structure->permeability relation (a labelled proposed_input)
    maps that to lower permeability (0.256 vs 1.0 rel.) and higher retention (0.661 vs 0.333); retention
    lowers effective washout and raises the standing pool, so composition informs permeability informs
    retention. This is an MD-informed structural proxy, NOT a PMF-resolved permeability (Option A, study
    og-32a). It tightens the composition->permeability->retention chain that og-31 approximated with a
    reduced-coupling proxy.
  evidence:
    from_test: permeability-md-informed
- id: og32-gate-c-advance-over-og31
  kind: methodological
  status: confirms
  statement: >-
    Study 32 takes full Gate C on an MD-informed first cut (Option B): composition-informed permeability->retention
    with the measurable self-maintenance criterion (integrity + persistence benefit over the matched ablation),
    verdict qualified - advancing og-31's partial, reduced-coupling result by deriving retention from
    a real MD observable rather than a free knob. The matched-null is the no-endogenous-membrane ablation
    at equal feeds; self-maintenance is the measurable criterion, not strict autopoietic closure. The
    result is windowed (integrity holds up to k_deg <= ~0.01/s; the persistence benefit tracks the MD
    composition). The PMF-resolved permeability (Option A, og-32a) is the gold-standard budgeted follow-up
    that would re-test the verdict under a structurally-resolved permeability.
  evidence:
    from_test: beats-ablation-flux-or-persistence
- id: og32b-protonated-vesicles-stable-across-window
  kind: computational
  status: confirms
  statement: >-
    Real single-chain fatty-acid vesicles (viva-openmm Martini 3, ~1054 lipids, 3 independent MD seeds/arm)
    hold a closed bilayer across the entire protonated C10-C16 chain window: every chain keeps a populated
    inner leaflet (inner_leaflet_fraction 0.39-0.41, well above the 0.20 bilayer threshold) and a coherent,
    non-dispersed head shell (head_radial_cv 0.227-0.247, well below the 0.35 micelle threshold), with
    all 3/3 seeds stable at each chain and tight spread (std <= 0.01). So the protocell boundary forms
    and holds for the real amphiphile across the chain-length axis on this short-MD stability trend.
  evidence:
    from_test: protonated-vesicle-stable
  expected:
    cites:
    - janke2014oleic
    - pedersen2025lipidome
- id: og32b-charged-null-micellises-short-corner
  kind: computational
  status: confirms
  statement: >-
    The matched null - the SAME fatty acid with fully-ionised charged-only (SQ5n) heads - micellises at
    the short-chain corner: C10 charged disperses in all 3/3 seeds (head_radial_cv 0.433 +/- 0.009, above
    the 0.35 threshold), the control that should fail. The charge effect is chain-length-gated within
    this short window: C14 charged still holds a coherent shell (cv 0.296 +/- 0.009, 3/3 stable), i.e.
    charge-driven micellisation of the longer chains is slower than ~0.8 ns CPU-MD resolves. So the destabilising
    corner is short chain + fully charged, exactly where fatty-acid physics (highest curvature + strongest
    headgroup repulsion) predicts the vesicle-forming threshold is crossed; the converged charge/chain
    boundary is the GPU gold-standard follow-up.
  evidence:
    from_test: charged-null-destabilises
- id: og32b-real-amphiphile-replaces-standin
  kind: methodological
  status: confirms
  statement: >-
    This study replaces og-32's DLPC/DPPC phospholipid planar-bilayer stand-in with the real protocell
    amphiphile: a closed bilayer vesicle of single-chain fatty acids built + integrated in martini_openmm
    (Martini 3 fatty-acid defs FAnn/FAnnM + vesicle builder + semi-isotropic membrane barostat, finite
    energy). The Gate-C boundary is now the actual amphiphile, judged by a bilayer-vs-micelle discriminator
    (inner-leaflet / lumen retention) over >= 3 seeds. Verdict qualified: a short-MD stability trend,
    not a converged micellisation equilibrium or a permeability PMF - those are the GPU gold-standard
    follow-ups (og-32c self-assembly, og-32a PMF). The SP2/SQ5n head is a tracked Martini-3 building-block
    proposed_input; the C1 tails are authoritative.
  evidence:
    from_test: real-fatty-acid-not-standin
