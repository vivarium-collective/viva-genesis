title: 'Self-Compartmentation: From Boundary to Self-Maintaining Protocell'
concept: >-
  How a vent-born chemical system acquires a self-made boundary and becomes a self-maintaining protocell
  — one concept (Gate C), studied at several fidelities as arms: amphiphile boundary assembly (og-04),
  an endogenous boundary from the system's own chemistry (og-04-alt), the membrane-benefit test against
  a matched null (og-31), the integrated first self-maintaining protocell (og-32, canonical), and real
  fatty-acid vesicle Martini MD replacing the phospholipid stand-in (og-32b), with the membrane-MD sub-program
  (mem-m1/2/3/5) and the composition-overlap discriminator (og-ev) as planned arms.
gate_reason: >-
  Gate C (self-compartmentation / self-maintaining protocell). Consolidates the campaign's boundary-to-protocell
  line into one concept with fidelity-labelled arms, each judged against its own matched null with input
  fluxes held equal: boundary assembly (og-04, supported), the endogenous boundary (og-04-alt, supported),
  the Gate-C membrane benefit (og-31, qualified — pays on persistence, not throughput), the integrated
  first self-maintaining protocell (og-32, canonical, qualified), and the live fatty-acid vesicle MD that
  replaces og-32's phospholipid stand-in (og-32b, qualified). The headline is bounded by the most-caveated
  arm — qualified: a self-maintaining protocell with a self-made boundary whose membrane pays on persistence
  (not throughput), within windows, on a short-MD stability trend. Each arm keeps its own verdict and matched
  null (see arms). The membrane-MD sub-program (mem-m1/m2/m3/m5) and the chemistry-to-membrane composition-overlap
  discriminator (og-ev) are carried as planned arms; the gold-standard PMF permeability (og-32a) is tracked
  as a GPU-gated follow-up.
claim: >-
  A vent-born system acquires a self-made boundary and self-maintains as a protocell, the membrane buying
  persistence rather than raw throughput. Mixed fatty-acid/alcohol amphiphiles assemble into protocell
  boundaries in a vent window, giving individuality (retention) without full isolation and beating single-amphiphile
  controls (og-04, supported); a boundary also forms endogenously from the system's own carbon chemistry
  with a closed matter ledger (og-04-alt, supported); protometabolism-produced encapsulation pays against
  a matched equal-feed null on persistence and an access window but not on throughput, and the benefit
  is windowed (og-31, qualified); the integrated compartment self-maintains its membrane integrity and
  beats a matched ablation with MD-informed permeability (og-32, canonical, qualified); and real fatty-acid
  Martini-3 vesicles are stable across C10-C16 while a fully-charged null micellises at the short+charged
  corner, replacing og-32's phospholipid stand-in with a real amphiphile (og-32b, qualified — a short-MD
  fixed-charge stability trend, with the titratable/PMF gold standard tracked as og-32a). Headline verdict
  qualified. Every matched null and arm verdict is preserved.
question: >-
  How does a vent-born chemical system acquire a self-made boundary and become a self-maintaining protocell
  — do amphiphiles assemble a retaining-but-not-isolating boundary, does encapsulation pay against a matched
  equal-feed null, does the integrated compartment self-maintain and beat a matched ablation, and are
  real fatty-acid vesicles stable — each against its own matched null with input fluxes held equal?
hypothesis: >-
  Mixed amphiphiles assemble protocell boundaries in a bounded vent window (retention without isolation);
  encapsulation pays on persistence/robustness rather than throughput; the integrated compartment self-maintains
  and beats a matched ablation; and real fatty-acid vesicles are stable where protonated and micellise
  where fully charged. Where an arm does not beat its matched null, or stability is only a short-MD trend,
  that is reported honestly rather than tuned to a pass.
experiment: >-
  Assemble amphiphile and endogenous boundaries and measure the retention/access window (og-04, og-04-alt);
  test the membrane benefit against a matched equal-feed null on persistence/access/throughput (og-31);
  run the integrated self-maintaining protocell with MD-informed permeability against a matched ablation
  (og-32); and run real fatty-acid vesicle Martini-3 MD (multi-seed) with a fully-charged matched null
  (og-32b) — reporting each arm's verdict and matched null, and labelling the fixed-charge / short-MD
  / coarse-grained limits, with the membrane-MD sub-program and the PMF gold standard tracked as planned/GPU-gated
  follow-ups.
