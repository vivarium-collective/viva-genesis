schema_version: 4
name: s3-protrusions-to-enclosure
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S3 — Protrusions to enclosure: can protrusion mechanics reach stable wrapping?'
phase: Calibrate
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: membrane-mechanics
tags:
- symbiosis
- membrane
- protrusion
- enclosure
- cryo-et
concept: Compartmentalization made operational as the topology and energy of enclosing membranes. A host
  protrusion of finite membrane area extends at an observed rate and attempts to wrap a bacterial partner;
  enclosure succeeds, per partner radius, only when the available area covers the partner AND adhesion
  clears the Helfrich bending cost. Classical engulfment, inside-out wrapping, and a no-enclosure control
  are compared over a partner-radius ensemble.
question: Can observed archaeal protrusion mechanics plausibly transition from contact to stable wrapping
  / engulfment, within membrane area, bending-cost, and timescale budgets? Morphology alone cannot demonstrate
  engulfment.
hypothesis: Under cryo-ET-constrained bending moduli and adhesion, at least one topology (classical engulfment
  or inside-out wrapping) reaches a stable enclosed state over a realistic partner-size range with conserved
  membrane area, while a no-enclosure or weak-adhesion control does not.
claim: 'Physical enclosure is a separate hurdle from metabolic benefit (S1/S2): observed protrusion mechanics
  can, under favorable area and adhesion budgets, reach stable wrapping over a majority of the partner-size
  range — but a beneficial symbiosis need not imply ingestive ability, and enclosure fails without wrapping
  (no-enclosure) or when adhesion cannot pay the bending cost.'
behavior_tests:
- name: enclosure-geometrically-feasible
  classification: primary
  description: At least one topology reaches stable enclosure for a majority of the partner-size ensemble
    (enclosure probability > 0.5). The threshold discriminates the wrapping topologies from the no-enclosure
    and weak-adhesion controls.
  measure:
    kind: derived_scalar
    path: settled_enclosure_probability
  pass_if:
    op: '>'
    value: 0.5
    provenance:
      kind: calibration
      note: 'Calibrated (classical engulfment, protrusion_area=4 um^2, adhesion=600 kT, kappa=20 kT, 30
        steps): enclosure_probability settles to 0.61 (PASS; inside-out wrapping reaches 0.98). Two failure
        routes read 0.0: the no-enclosure control and the weak-adhesion control (adhesion below the 8*pi*kappa
        bending cost).'
  cites:
  - rodrigues-oliveira-nature-2023
  - radler-nature-2026
- name: membrane-area-conserved
  classification: primary
  description: Membrane area is conserved through the deformation (no area created from nothing).
  measure:
    kind: derived_scalar
    path: max_membrane_area_residual
  pass_if:
    op: <
    value: 1e-4
    provenance:
      kind: theory
      note: Area conservation under bending (residual ~0 by construction).
acceptance_criteria:
- behavior: enclosure-geometrically-feasible
findings:
- id: s3-enclosure-feasible-with-favorable-budget
  statement: 'Calibrated (30 steps, partner-radius ensemble 0.2-0.8 um): classical engulfment reaches
    a stable enclosure probability of 0.61 and inside-out wrapping 0.98, both with conserved membrane
    area (residual 0) — physical enclosure is geometrically feasible under favorable area/adhesion budgets.
    Two well-characterized failure routes read 0.0: a no-enclosure control (contact without wrapping)
    and a weak-adhesion control (adhesion 300 kT below the ~502 kT Helfrich bending cost). Enclosure is
    a separate hurdle from metabolic benefit; morphology alone does not demonstrate engulfment. Direct
    in-process run of a newly built composite.'
  evidence:
    from_test: enclosure-geometrically-feasible
    measure: settled_enclosure_probability
    observed: 1.0
  provenance:
    kind: run
    run_date: '2026-10-28'
    note: 'Spatial Cellular Potts run (viva_genesis.composites.protrusion_enclosure_cpm — the
      real Rust cpm_core engine, Glazier-Graner-Hogeweg differential adhesion on a 90x90
      lattice with actual boundaries; J_hs=6 < J_sM-J_hM=12, so engulfment is favored):
      10-seed ensemble gives enclosure probability 1.00 (10/10 enclosed, enclosure_fraction
      1.0, 0 medium-contact faces — the symbiont boundary is entirely wrapped by the host).
      The coarse-grained analytical companion (viva_genesis.composites.protrusion_enclosure,
      area + Helfrich bending budget) independently reaches 0.61 (classical engulfment) and
      0.98 (inside-out); the no_enclosure and weak-adhesion controls read 0.0.'
  cites:
  - rodrigues-oliveira-nature-2023
literature_anchors:
- expectation: Cryo-ET constrains Asgard membrane morphology and actin-based structure.
  model_observable: settled_enclosure_probability
  source: Rodrigues-Oliveira et al. 2023, Nature
  cites:
  - rodrigues-oliveira-nature-2023
  status_in_workspace: proposed
parent_studies:
- study: s2-ecology-to-proximity
  relation: builds-on
- study: s1-metabolic-partnership
  relation: tests
baseline:
- name: baseline
  composite: viva_genesis.composites.protrusion_enclosure.protrusion_enclosure
  params:
    topology: classical_engulfment
    protrusion_area_um2: 4.0
    adhesion_energy_kT: 600.0
    bending_modulus_kT: 20.0
  note: New first-fidelity model built for S3 (no existing composite fit). enclosure_probability over
    a partner-radius ensemble is the feasibility gate; membrane area is conserved by construction. The
    full deformable-membrane PDE with explicit protrusion dynamics is the next-fidelity arm.
- name: cpm-spatial
  composite: viva_genesis.composites.protrusion_enclosure_cpm.protrusion_enclosure_cpm
  params:
    j_hs: 6.0
    j_sM: 16.0
    j_hM: 4.0
  note: Spatial companion (campaign composite B) — the real Rust Cellular Potts engine with actual
    boundaries. Enclosure is an emergent, measured outcome (host coverage of the symbiont boundary),
    not an area/bending threshold; the wrapping transition tracks j_hs = j_sM - j_hM. Measured j_hs=6
    (strong adhesion) -> enclosure_fraction 1.000; j_hs=18 (weak) -> 0.176.
- name: membrane-wrapping
  composite: viva_genesis.composites.protrusion_enclosure_membrane.protrusion_enclosure_membrane
  params:
    topology: classical_engulfment
    bending_modulus_kT: 20.0
    adhesion_per_um2_kT: 250.0
    tension_per_um2_kT: 200.0
    protrusion_force_pN: 10.0
    max_membrane_area_um2: 4.0
  note: 'Higher-fidelity continuum-energetics arm — the membrane-wrapping transition
    (Deserno/Lipowsky) with an active protrusion force, the mechanism the question is about
    (not passive differential adhesion). Classical external engulfment reaches enclosure only
    in a narrow size window (0.41-0.56 um), for a minority of partners (probability 0.27), and
    the active protrusion is load-bearing (raises it from 0.17; 36% of enclosures need the
    force); inside-out invagination (Baum & Baum) is far more feasible (0.83). The coarse
    area+bending budget (0.61) and the 2D passive-adhesion CPM (1.00) arms overstated classical
    engulfment. Next fidelity rung: a triangulated-mesh run (pbg-mem3dg).'
variants:
- name: inside-out
  base: baseline
  over:
    topology: inside_out
- name: no-enclosure-control
  base: baseline
  over:
    topology: no_enclosure
- name: weak-adhesion-control
  base: baseline
  over:
    adhesion_energy_kT: 300.0
- name: cpm-weak-adhesion
  base: cpm-spatial
  over:
    j_hs: 18.0
visualizations:
- name: enclosure-feasibility
  address: local:S3EnclosureViz
  config:
    title: S3 — enclosure is geometrically feasible (by topology)
  rendered: workspace/studies/s3-protrusions-to-enclosure/viz/enclosure-feasibility.html
- name: endosymbiosis-phase-diagram
  title: Endosymbiosis phase diagram — enclosure (G3) plane (CPM)
  rendered: workspace/studies/s3-protrusions-to-enclosure/viz/endosymbiosis-phase-diagram.html
observables:
- enc/enclosure_probability
- enc/membrane_area_conservation_residual
- enc/enclosure_fraction
- enc/enclosed
data_inputs:
- name: Asgard live-cell microscopy
  use: protrusion morphology + timescales
  url: https://www.ebi.ac.uk/biostudies/bioimages/studies/S-BIAD3928
