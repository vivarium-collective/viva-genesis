    o2_source: 0.02
    seed: 1
    n_steps: 40
  note: Spatial O2-gradient germ/soma differentiation on the viva-cpm world (oxygen fate rule, calibration env A). n_steps=40 pins the transient window (the runner ignores the composite default).
