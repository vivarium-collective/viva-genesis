schema_version: 4
name: s05-differentiation
investigation: multicellularity
created: '2026-11-01'
title: Cell-state differentiation
phase: Simulate
status: investigating
design_status: drafted
simulation_status: ran
evaluation_status: not_evaluated
gate_status: not_started
topic: multicellularity
tags:
- multicellularity
concept: emergence of multicellularity
question: Can environmental gradients create stable cell-state differentiation without a dedicated developmental program? (Q4, Q3)
hypothesis: Metabolite exchange plus inducible cell fate yields specialization that improves out-of-sample group performance beyond a no-fate and random-fate null (C5).
claim: Gradient-induced specialization (O2-keyed germ/soma fate, fixed a-priori stemness threshold) improves net viable growth in a held-out O2 environment (B, o2_source 0.025) over a no-fate, a clamped-undifferentiated and a random-fate null (C5). UNPROVEN until graded on the seed-mean.
behavior_tests:
- name: specialization-improves-group-performance
  classification: primary
  description: 'Net viable biomass growth (viable_biomass last - first update) of the O2-keyed differentiation arm beats the no-fate, random-fate and clamped-undifferentiated nulls on held-out env B (seed-mean over 3 seeds). Decision criterion: specialization_out_of_sample_gain > 0. Env A (o2_source 0.02) is characterization only. The stemness threshold is fixed a priori, not tuned on A.'
acceptance_criteria: []
literature_anchors:
- source: Kirk 2005, BioEssays
  cites:
  - kirk2005twelve
  status_in_workspace: proposed
- source: Grosberg & Strathmann 2007, Annu Rev Ecol Evol Syst
  cites:
  - grosberg2007evolution
  status_in_workspace: proposed
parent_studies:
- study: s04-morphomechanics
  relation: builds-on
