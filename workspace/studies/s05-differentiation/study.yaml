  gate_evaluator:
    result: blocked
    blocked_by:
    - specialization-improves-group-performance
    evaluated_by: code
    diverges_from_authored: false
tests:
  data_source: all_runs
readouts:
- name: viable_biomass
  store_path: viable_biomass
- name: fate_counts
  store_path: fate_counts
limitations:
- Transient, quasi-static 40-update window on a single CPM backend (viva-cpm), 2D; not a steady state.
- The fate rule / stemness threshold is FIXED a priori and not tuned to data; this is a generalization-across-regimes test (env A -> held-out env B), not a data-fit cross-validation. Only two O2 regimes are graded.
- 'Benefit over the no-fate/clamped nulls is modest; it vanishes when O2 is plentiful (o2_source 0.03: no hypoxia, no differentiation, oxygen == none) and degrades/noisy when O2 is very scarce (0.015: over-differentiation, ~20/25 soma). These off-grid regimes were probed informally, not in the graded runs.'
- Performance metric (net viable biomass growth under O2 limitation) is a builder/owner-sanctioned choice (ruling S05-B).
evidence_tier: mechanistic_prediction
findings:
- id: s05-oxygen-differentiation-out-of-sample
  statement: 'In a Rust CPM world with an O2 gradient, O2-keyed germ/soma differentiation beats all three nulls on the held-out environment B (o2_source 0.025): seed-mean net viable growth 285.0 (oxygen) vs 270.0 (no-fate), 270.0 (clamped-undifferentiated) and 159.7 (random-fate); out-of-sample gain +15.0. The benefit over the no-fate/clamped nulls is modest (~5%; ~20% on calibration env A: 195.7 vs 163.3); over random fate it is decisive (random soma wastes growth).'
  status: confirms
  kind: computational
  evidence_basis: predicted
  from_test: specialization-improves-group-performance
  inferential_scope: Transient ~40-update quasi-static readout of one CPM backend (viva-cpm), 2D, 3 seeds per arm. The stemness threshold is fixed a priori (not tuned to data), so this tests generalization across two O2 regimes, not a data-fit cross-validation. The benefit vanishes when O2 is plentiful (o2_source 0.03, no hypoxia, oxygen == none) and degrades/noisy when O2 is very scarce (0.015, over-differentiation, ~20/25 soma); those regimes were probed informally, not in the graded runs. Metric choice (net viable growth) is owner-sanctioned ruling S05-B.
