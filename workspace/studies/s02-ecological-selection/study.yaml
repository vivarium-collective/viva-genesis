question: Can size-dependent predation and settling reward group formation without
  added physiology? (Q1)
hypothesis: Under size-dependent predation/settling, simple adhesive collectives gain
  a fitness advantage over unicells even with metabolic exchange controlled (H1).
claim: Under size-dependent predation/settling, groups gain a FITNESS ADVANTAGE over
  unicells (adv=+0.
behavior_tests:
- name: group-fitness-advantage-under-selection
  classification: primary
  description: 'Add size-dependent predation, settling and no-selection controls;
    compare group vs unicell fitness with physiology held fixed. Decision criterion:
    ecological benefit explains group emergence without added physiology.'
  pass_if:
    op: '>'
    value: 0.0
acceptance_criteria: []
findings:
- id: s02-ecological-selection-first-cycle
  statement: Under size-dependent predation/settling, groups gain a FITNESS ADVANTAGE
    over unicells (adv=+0.15); with adhesion alone (no ecology) the advantage vanishes
    (adv=-0.00). Ecological selection — NOT adhesion per se — confers the group-level
    fitness advantage (supports H1 for the advantage).
  status: confirms
  evidence:
    observed: 0.1508
    from_test: group-fitness-advantage-under-selection
    from_run: viva_genesis.composites.cell_collective.cell_collective__1793567204__5c2568
  inferential_scope: 'Reduced mean-field cell-collective model (cell_collective):
    unicell/group split under adhesion + size-dependent predation/settling + oxygen-limited
    growth. First-fidelity; not an explicit spatial agent/mechanics simulation and
    not a historical estimate.'
  kind: computational
