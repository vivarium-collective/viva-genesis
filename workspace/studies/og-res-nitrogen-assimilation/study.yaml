title: The Nitrogen Bottleneck
question: Carbon fixation is not the only requirement for a protocell. Can an FeS-mediated
  vent reduce the early ocean's oxidised / inert nitrogen (NO3-/NO2-/N2) to ammonium
  fast enough to keep pace with carbon fixation, and which conditions (FeS activity,
  nitrate supply, temperature) decide whether nitrogen becomes limiting first?
hypothesis: On an Fe/Ni/S catalyst with an H2 reductant, nitrate is reduced through
  nitrite to ammonium and drawn into amino-acid precursors by reductive amination;
  reduced N keeps pace with reduced carbon (C:N supply ratio near Redfield) only inside
  a bounded region of (nitrate supply x FeS activity), and outside it — low feed or
  passivated mineral — the C:N ratio blows up and nitrogen, not carbon or energy,
  becomes the first limiting resource.
objective: Add nitrogen as its own module (FeS-mediated NO3-/NO2- -> NH4+ with minor
  N2 fixation and carbon-demanded reductive amination), track the C:N supply ratio,
  and map the region where reduced-N production keeps pace with the carbon-fixation
  demand.
findings:
- id: ogn-ammonium-produced
  kind: computational
  status: confirms
  statement: FeS-mediated reduction of nitrate through nitrite sustains a standing
    ammonium pool (~1.0 mM) with an H2 reductant at ~80 C, the first reduced nitrogen
    the chemistry needs.
  evidence:
    from_test: ammonium-production-sustained
    observed: settled NH4+ ~1.0 mM; peak production ~4.2e-5 mol/s
  expected:
    cites:
    - dorr2003prebiotic
    - huber1997activated
  explanation: A real ReducedNitrogenProductionProcess reduces NO3- -> NO2- -> NH4+
    gated by H2 availability, an FeS temperature window and catalyst activity.
- id: ogn-keeps-pace
  kind: computational
  status: novel
  statement: At the favourable operating point reduced-N production keeps pace with
    the carbon-fixation demand — the C:N supply ratio settles at ~5.0, within the
    viable (near-Redfield) band.
  evidence:
    from_test: nitrogen-keeps-pace-with-carbon
    observed: settled C:N supply ratio ~5.0 (viable band 1-8)
    units: dimensionless
  expected:
    cites:
    - varma2018native
  explanation: The C:N supply ratio = carbon demand / reduced-N production; reductive
    amination draws ammonium into amino-acid precursors at a rate set by the carbon
    demand.
- id: ogn-ablation
  kind: computational
  status: confirms
  statement: Ammonium is present only with BOTH an active FeS catalyst and an H2 reductant
    — it collapses to <1 µM when either is removed (each is necessary, not merely
    correlated).
  evidence:
    from_test: feature-ablation-no-ammonium
    observed: favourable NH4+ ~1.0 mM; no-FeS and no-H2 controls <1 µM
  expected:
    cites:
    - dorr2003prebiotic
- id: ogn-nitrogen-limiting
  kind: computational
  status: novel
  statement: A parameter sweep over (nitrate supply x FeS activity) maps where reduced
    N keeps pace with carbon versus where nitrogen becomes limiting FIRST. Reduced
    N keeps pace only where the nitrate feed is sufficient AND the mineral is active;
    starving the feed drives the settled C:N supply ratio from ~5 to ~47 (nitrogen
    limiting), so the decision is a bounded region, not a representative run.
  evidence:
    from_test: nitrogen-supply-sets-cn
    observed: favourable C:N ~5.0 (keeps pace) vs scarce-nitrate C:N ~47 (limiting);
      keeps-pace boundary at C:N = 8
    units: dimensionless
  expected:
    cites:
    - dorr2003prebiotic
  explanation: 16x16 sweep of the real open-flow reduced-nitrogen reactor (nitrate
    supply 2e-6-1e-4 M/s x FeS activity 0.05-1.0) reduced to the settled C:N supply
    ratio + a keeps-pace mask, rendered as the nitrogen phase map (Decision view).
    Runner sims/compute_nitrogen_grid.py.
- id: ogn-mass-accounting
  kind: methodological
  status: confirms
  statement: Nitrogen mass is conserved by construction — every internal reaction
    conserves N atoms, so the per-step accounting residual stays at ~1e-20 M (the
    matter-accounting invariant).
  evidence:
    from_test: nitrogen-mass-conserved
    observed: max |n_mass_residual| ~1e-20 M over the run
    units: molar
conclusion: Reduced-nitrogen production reproduces an FeS-mediated ammonium source
  and maps the region where it keeps pace with carbon fixation; nitrogen becomes limiting
  first where the nitrate feed is scarce or the mineral is passivated. Supplies reduced
  N (ammonium + amino-acid precursors) to the downstream protometabolism and heredity
  stages.
conclusion_verdicts:
  biological_validation:
    result: PASS
    basis: Reproduces an FeS-mediated reduced-nitrogen source with the controls behaving
      correctly (no FeS or no H2 => no ammonium).
  explanatory_gain:
    result: POSITIVE
    basis: The C:N supply ratio explains WHEN nitrogen rather than carbon or energy
      becomes the first limiting resource, as a bounded region in (nitrate supply
      x FeS activity).
limitations:
- FeS nitrate-reduction and N2-fixation kinetics are lab-motivated, not first-principles
  surface kinetics; Doerr-2003 N2 fixation is deliberately a minor source.
- The phase map sweeps (nitrate supply x FeS activity) in the open-flow regime; temperature,
  H2 and the carbon demand are held fixed (facets, not yet swept).
- The keeps-pace C:N band is a Redfield-like biomass target; the true early-cell C:N
  requirement is uncertain.
discovery_implications:
  resolved_uncertainties:
  - A viable reduced-N source exists on FeS; ammonium strictly requires both the mineral
    catalyst and the H2 reductant.
  - The (nitrate supply x FeS activity) region where reduced N keeps pace with carbon
    is now mapped (16x16 sweep, open-flow sustained C:N), not inferred from a single
    run.
  remaining_uncertainties:
  - Whether reduced N or reduced carbon is the tighter constraint under joint (coupled)
    limitation — here the carbon demand is an exogenous parameter, not the live og-01/og-02
    carbon flux.
  - The continuous temperature / H2 dependence of the keeps-pace boundary (held fixed
    in this sweep).
  followup_study_proposals:
  - study: og-res-b
    rationale: Couple the reduced-nitrogen reactor's c_demand to the live og-01/og-02
      net carbon flux and co-limit
    to test whether N or C binds first under joint limitation.: null
