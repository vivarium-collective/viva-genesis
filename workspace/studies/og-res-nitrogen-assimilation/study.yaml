key_assumptions:
- Reduced nitrogen (NH4+) is a hard co-requirement with reduced carbon; the early
  ocean's accessible N is oxidised (NO3-/NO2-) or inert (N2).
- The useful decision observable is the C:N SUPPLY ratio (production vs demand), not
  any single pool.
expert_questions:
- 'RESOLVED: nitrogen is built as its OWN module (not folded into carbon fixation),
  with the C:N supply ratio as the decision observable and FeS activity / nitrate
  supply as the controlling axes.'
- 'OPEN: couple c_demand to the live og-01/og-02 carbon flux for a joint C+N co-limitation
  study (followup og-res-b).'
