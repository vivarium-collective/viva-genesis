proposed_mechanisms:
- 'I: FeS-mediated nitrate/nitrite reduction to ammonium'
- 'I: minor abiotic N2 fixation on fresh FeS'
- 'I: carbon-demanded reductive amination toward amino-acid precursors'
proposed_models_methods:
- FeS-catalysed dissimilatory nitrate reduction kinetics (H2-gated, temperature-windowed)
- Redfield-like C:N supply-ratio accounting
- Open-flow (feed + washout) sustained-throughput reactor
contract:
  face:
    inputs:
      NO3:
        _type: float
        _units: molar
        _min: 0.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      fes_activity:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      c_demand:
        _type: float
        _units: mole/second
        _min: 0.0
    outputs:
      NH4:
        _type: float
        _units: molar
        _min: 0.0
      amino_precursor:
        _type: float
        _units: molar
        _min: 0.0
      nh4_production_rate:
        _type: float
        _units: mole/second
        _min: 0.0
      cn_supply_ratio:
        _type: float
        _units: dimensionless
        _min: 0.0
      total_n:
        _type: float
        _units: molar
        _min: 0.0
  conditions:
  - kind: invariant
    name: nitrogen_mass_balance
    expr: abs(delta_total_N - (feed - washout)) < tol
  - kind: invariant
    name: reductant_necessity
    expr: nh4_production == 0 when (fes_activity == 0 or H2 == 0)
  - kind: invariant
    name: non_negative_pools
    expr: NO3 >= 0 and NO2 >= 0 and NH4 >= 0
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates;
    the reduced_nitrogen_reactor composite declares a ProcessContract matching this
    face (audited via the workbench Contract panel).
behavior_tests:
- name: ammonium-production-sustained
  classification: primary
  description: FeS-mediated reduction sustains a standing ammonium pool with FeS +
    H2.
  measure:
    kind: derived
    path: settled_nh4_uM
    detail: settled ammonium pool
    uM: null
  pass_if:
    op: '>'
    value: 100.0
    detail: settled NH4+ > 100 uM (a sustained reduced-N pool)
  units: uM
  requires_simulation: 'yes'
  cites:
  - dorr2003prebiotic
  - huber1997activated
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: reduced-nitrogen-source-exists
  classification: primary
  description: A nonzero reduced-nitrogen (ammonium) production rate exists (favourable
    arm).
  measure:
    kind: derived
    path: peak_nh4_production_rate
    detail: peak ammonium production rate
  pass_if:
    op: '>'
    value: 1.0e-06
    detail: peak NH4+ production > 0 (viable reduced-N source)
  units: mole/second
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: nitrogen-keeps-pace-with-carbon
  classification: primary
  description: The settled C:N supply ratio sits in the viable (near-Redfield) band
    — reduced N keeps pace with carbon.
  measure:
    kind: derived
    path: cn_supply_ratio_settled
    detail: settled C:N supply ratio
  pass_if:
    op: range
    low: 1.0
    high: 8.0
    detail: C:N in the viable keeps-pace band (near Redfield)
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - varma2018native
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: nitrogen-mass-conserved
  classification: diagnostic
  description: The reduced-nitrogen reactor conserves nitrogen mass (feed - washout
    accounting).
  measure:
    kind: derived
    path: max_abs_n_mass_residual
    detail: max |per-step N-mass residual|
  pass_if:
    op: <=
    value: 1.0e-09
    detail: max |nitrogen-mass residual| at machine precision
  units: molar
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: feature-ablation-no-ammonium
  classification: primary
  description: Ammonium is present with FeS + H2 and ABSENT in each control (no FeS
    / no H2). Cross-run — graded by sims/run.py, which runs the two controls and checks
    ammonium collapses to <1 uM in each (each feature is necessary, not correlated).
  measure:
    kind: cross_run
    detail: favourable ammonium vs no-FeS / no-H2
  pass_if:
    op: controls_absent
    detail: ammonium present with FeS+H2
    <1 uM in every control: null
  units: uM
  requires_simulation: 'yes'
  cites:
  - dorr2003prebiotic
  gate_class: acceptance_criterion
- name: nitrogen-supply-sets-cn
  classification: diagnostic
  description: 'DISCRIMINATING: does the nitrate supply decide whether reduced N keeps
    pace? Cross-run — sims/run.py compares the favourable arm (C:N keeps pace, <=8)
    with a scarce-nitrate arm (C:N > 8, nitrogen limiting) and reports the keeps-pace
    boundary.'
  measure:
    kind: cross_run
    detail: favourable C:N vs scarce-nitrate C:N
  pass_if:
    op: arms_reported
    detail: report both arms; flag where nitrogen becomes limiting first
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - dorr2003prebiotic
  gate_class: acceptance_criterion
literature_anchors:
- expectation: Ammonia forms from dinitrogen on iron-sulfide surfaces (low yield,
    fresh-surface dependent) at ~70-80 C
  model_observable: ammonium production on FeS vs controls
  source: Doerr 2003
  status_in_workspace: Met qualitatively — the FeS-mediated route produces ammonium
    only with an active mineral and an H2 reductant; N2 fixation is modelled as a
    deliberately minor source alongside the dominant nitrate-reduction route.
  cites:
  - dorr2003prebiotic
- expectation: Native-metal / mineral catalysis drives reductive prebiotic chemistry
    toward amino-acid precursors
  model_observable: reduced-N draw into amino-acid precursors
  source: Varma 2018 / Huber 1997
  status_in_workspace: Met — reductive amination draws ammonium into an amino-acid-precursor
    pool at a rate set by the carbon-fixation demand (the C:N coupling).
  cites:
  - varma2018native
  - huber1997activated
implemented_methods:
- 'Module I (kinetics) — REAL ReducedNitrogenProductionProcess: FeS-catalysed NO3-
  -> NO2- -> NH4+ gated by H2 availability, an FeS temperature window and catalyst
  activity, with a minor abiotic N2-fixation source (Doerr-2003) and carbon-demanded
  reductive amination toward amino-acid precursors. Open-flow nitrate feed + ammonium
  washout give a condition-dependent sustained steady state.'
- C:N supply-ratio accounting — carbon demand / reduced-N production is the decision
  observable; nitrogen mass is conserved by construction (per-step residual ~1e-20
  M).
- Decision surface — 16x16 sweep over (nitrate supply x FeS activity) reduced to the
  settled C:N supply ratio + keeps-pace mask, persisted to artifacts/ and rendered
  as the nitrogen phase map.
