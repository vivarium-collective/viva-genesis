verdict: supported
primary_limitation: "Network persistence is driven, not autocatalytic self-amplification - the apparent curated-motif autocatalysis is invalidated (element-unbalanced), and the inferred-tier atlas reactions remain planned under explicit assumptions."
key_assumptions:
- "Persistence is net carbon throughput of a connected network under vent-realistic feed + washout"
- "The reaction set is the provenance-gated prebiotic-reaction-atlas Resource (balanced, confidence-tiered)"
- "Autocatalysis is graded by a common detector against 24 matched nulls"
evidence_tier: mechanistic_prediction
program: consolidated
title: 'Network Persistence: Does the Carbon-Fixing Network Sustain Itself?'
concept: >-
  Whether a balanced prebiotic carbon-fixing network, fed the calibrated vent state and subject to washout,
  sustains net carbon throughput as a connected system — studied at several fidelities (curated minimal
  network, rule-generated open universe, provenance-gated atlas) as arms.
gate_reason: >-
  Gate A1 (does the carbon-fixing network persist). Consolidates the network-persistence line
  into one concept with fidelity-labelled arms: a curated minimal network (og-02, canonical),
  a rule-generated open universe under real thermodynamics (og-02-alt), and the provenance-gated reaction
  atlas that supplies both (og-28) — each judged against its own matched null with input fluxes held equal
  and the ledger closing. Headline (og-02, canonical): the network SUSTAINS net carbon throughput (~9e-4
  mol/s) and forms one connected network under feed + washout — persistence is real, SUPPORTED. Guardrail
  (kept explicit): persistence is DRIVEN, not autocatalytic emergence — og-02's apparent gain 29.5 is
  an element-unbalanced artifact (its lumped turn creates 4 C/cycle), and og-02-alt confirms NO autocatalytic
  motif emerges from the rules at the vent feed (every C-C route uphill); the one motif (formose) ignites
  only with an exogenous formaldehyde feed the vent does not produce (p=0.04 vs 24 matched nulls). Endogenous
  autocatalysis (A2) is refuted at vent feed and tracked as the separate og-autocatalysis line.
claim: >-
  Across fidelities the prebiotic carbon-fixing network persists — it sustains net carbon throughput as
  a connected system under vent-realistic feed + washout (og-02, canonical, supported) — but its persistence
  is driven, not autocatalytic self-amplification. Graded by a common detector, og-02's curated rTCA motif
  is imposed and element-unbalanced (the apparent gain an artifact); the rule-generated open universe
  (121 species, 413 balanced reactions) sustains a 14-species persistent network with NO autocatalytic
  motif at the vent feed, because every C-C-forming route is uphill, and the single motif that emerges
  (formose) requires an exogenous formaldehyde feed the vent chemistry does not make (og-02-alt, supported,
  p=0.04 vs 24 matched nulls). A versioned, provenance-tracked reaction atlas with a zero-leakage write
  gate supplies the balanced, confidence-tiered reactions both arms draw on (og-28, supported). Consolidated
  headline: supported — the network persists; endogenous autocatalysis is refuted at vent feed and tracked
  as the og-autocatalysis line. Every matched null and arm verdict kept.
question: >-
  Under continuous vent-realistic feed and washout, does the prebiotic carbon-fixing network persist and
  sustain net carbon throughput as a connected system — and does it do so by endogenous autocatalytic
  amplification or merely by sustained driven flux — each arm tested against a matched null with a closing
  ledger?
hypothesis: >-
  A balanced carbon-fixing network sustains net throughput and connectivity under vent feed + washout
  (persistence is real), but its persistence is driven rather than autocatalytic: under real thermodynamics
  no self-amplifying motif emerges at the vent feed without an exogenous C1 feed, so apparent gains in
  element-lumped curations are artifacts. No autocatalytic emergence is claimed where the ledger does
  not close or the motif is imposed.
experiment: >-
  Consolidate the network-persistence studies into one concept with explicit fidelity-labelled arms (curated
  minimal network, rule-generated open universe, provenance-gated atlas), each preserving its matched
  null, verdict, findings and run provenance; report the consolidated verdict (supported: the network
  persists) with the explicit guardrail that endogenous autocatalysis is not claimed here.
result: >-
  The prebiotic carbon-fixing network persists — it sustains net carbon throughput (~9e-4 mol/s) as one
  connected network under vent-realistic feed + washout (SUPPORTED); persistence is driven, not autocatalytic
  — no self-amplifying motif emerges under real thermodynamics at the vent feed (apparent gains are element-unbalanced
  artifacts), so endogenous autocatalysis is refuted at vent feed and tracked as the og-autocatalysis
  line.
