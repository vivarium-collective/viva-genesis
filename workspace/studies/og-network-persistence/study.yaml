  kind: computational
  status: novel
  statement: >-
    The vg-data package reaction_universe carries 0 measured, 2 calibrated (the vent posterior feeds),
    4 inferred, 7 extrapolated and 8 hypothetical parameters: every rate constant is an order-of-magnitude
    tick-scale number with a loguniform prior, swept rather than fitted. 50 of 121 skeletons resolve to
    a formula-verified KEGG compound and carry the live eQuilibrator component-contribution dG' (reaction
    dG' reproduced to 1e-6 kJ/mol); the other 71 carry a group-additivity estimate fitted to those (leave-one-out
    RMSE 7.2 kJ/mol).
