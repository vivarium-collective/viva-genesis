- id: og02alt-no-motif-at-phase1-feed
  provenance:
    run_ids:
    - viva_genesis.composites.open_chemical_network.open_chemical_network__1792068379__c38055
  kind: computational
  status: novel
  statement: >-
    At the vent posterior feed the rule-generated universe (121 species, 413 reversible reactions, C <=
    4) sustains 14 persistent species and a net CO2 fixation of 2.2e-5 mol/s but contains NO persistent
    autocatalytic motif (0 flux-carrying simple cycles with gain > 1); all 24 matched nulls also contain
    0. The rTCA reductive branch pyruvate -> OAA -> malate -> succinate appears from the rules at 5e-8
    / 9e-8 / 8e-9 M — three orders below og-02's curated 2 mM OAA — because pyruvate carboxylation at
    1.4 mM CO2 sits at its equilibrium (dG'0 = -1.1 kJ/mol -> [OAA]/[pyruvate] = K [CO2] = 2e-3) rather
    than being driven irreversibly.
  evidence:
    from_test: no-motif-at-phase1-feed
    observed: universe 0 motifs, 14 persistent species, malate 8.8e-8 M; nulls 0/24; p = 1.0
    units: dimensionless
  explanation: >-
    Every C-C bond-forming route is uphill at vent concentrations: reductive carboxylation of formate
    / acetate (+7.7 / +30.6 kJ/mol standard, +50 kJ/mol at the actual mM / 10 mM activities) and the aldehyde
    route (formate + H2 -> formaldehyde, +28 kJ/mol; [CH2O]eq = 3e-10 M). The universe is dissipative
    (0.88 W/L) but its flux is C1 reduction and pyruvate decay. Artifact: artifacts/motif_enrichment.json
    (arm phase1_feed).
  expected:
    cites:
    - wolos2020synthetic
    - preiner2020hydrogen
    - muchowska2019synthesis
- id: og02alt-formose-motif-emerges-and-is-enriched
  evidence_basis: predicted
  evidence_basis_note: "The single autocatalytic motif emerges from the reaction rules and beats 24 matched nulls (p=0.040); the vent posterior feeds are calibrated inputs, tracked in the reaction_universe provenance audit."
  provenance:
    run_ids:
    - viva_genesis.composites.open_chemical_network.open_chemical_network__1792068379__c38055
  kind: computational
  status: novel
  statement: >-
    With 10 mM formaldehyde added to the same feed, exactly one persistent autocatalytic motif emerges
    from the rules and is recovered post hoc: glycolaldehyde + CH2O -> glyceraldehyde -> dihydroxyacetone
    (+ CH2O) -> erythrulose -> erythrose -> 2 glycolaldehyde — the formose cycle (stoichiometric gain
    2, dynamic gain 3.1 > 1, core of 5 species, 49 persistent species). 0 of 24 degree-preserving, (C,O)-matched
    null networks contain any motif: empirical p = 0.040 (1/25). The 6x6 ignition map (0.1-30 mM CH2O
    x 0.001-0.2/s washout; 3 nulls per cell, all 0) shows the motif only at formaldehyde >= 9.6 mM with
    washout >= 0.024/s, or 30 mM with washout >= 0.008/s (dynamic gain up to 18): at longer residence
    times the H2 reduction of formaldehyde and glycolaldehyde (k_reduce [H2] = 0.1/s) outruns the aldol
    propagation, and the gain falls below 1 again at 0.2/s where washout wins.
  evidence:
    from_test: motifs-emerge-not-imposed
    observed: universe 1 motif (gain 2, dynamic 3.1); nulls 0/24; p = 0.040; curated 1 motif (imposed)
    units: dimensionless
  explanation: >-
    No rule names a cycle; the detector enumerates flux-carrying simple cycles with stoichiometric gain
    > 1 (Blokhuis 2020 type-I cores) from the doubling edges, identically for every class. The formose
    cycle closes through the retro-aldol of erythrose (the only doubling edge the chemistry provides at
    C <= 4). Artifact: artifacts/motif_enrichment.json (arm formose_feed, ignition_map).
  expected:
    cites:
    - breslow1959mechanism
    - blokhuis2020universal
    - wolos2020synthetic
- id: og02alt-curated-motif-is-imposed-and-unbalanced
  provenance:
    run_ids:
    - viva_genesis.composites.open_chemical_network.open_chemical_network__1792068379__c38055
  kind: computational
  status: contradicts
  statement: >-
    Graded by the same detector, og-02's curated rTCA class shows one motif — the self-loop OAA + 2 CO2
    -> 2 OAA + acetate — with dynamic gain 2.99, exactly its declared k_rtca [CO2] / k_wash, so the og-02
    "autocatalytic gain" was a property written into the network, not an emergent one. The element ledger
    over its SBML finds the lumped turn creates 4 C, 8 H and 3 O per turn (6 C in, 10 C out), so og-02's
    net carbon throughput (6e-4 mol/s) counts carbon that was never fed. The curated class remains the
    fastest and richest in product, and the least conserving, of the three.
  evidence:
    from_test: curated-rtca-fails-element-ledger
    observed: element residual C 4 / H 8 / O 3 (max 8); detector gain 2.99 = declared 2.99
    units: atoms
  explanation: >-
    og-02's finding og02-autocatalysis already said the motif was a curated lumped reaction; this study
    makes the consequence quantitative and machine-witnessed. The curated result keeps its PASS in og-02
    (its gates do not include conservation) but is reclassed here as the imposed class.
  expected:
    cites:
    - muchowska2019synthesis
    - muchowska2017metals
- id: og02alt-ledger-and-verification
  provenance:
    run_ids:
    - viva_genesis.composites.open_chemical_network.open_chemical_network__1792068379__c38055
  kind: computational
  status: confirms
  statement: >-
    Numerical verification: the universe is element-balanced by construction (max|E S| = 0 over 413 reactions,
    exact), the integrated carbon balance closes to 2.8e-6 (CVODE rtol 1e-6), dissipation -sum v dG is
    non-negative on every tick (0.88 W/L at the vent feed, 16 W/L in the formose arm), the MCA summation
    theorem holds to 3.3e-3 on the six dominant fluxes (1.3e-4 on the curated model), the Jacobian stiffness
    ratio is 9.4e2 (universe) / 4.8e3 (null), and tightening the tolerances to rtol 1e-9 changes no species
    by more than 7e-6 relative (loosening to 1e-3 changes the worst by 2.8e-3). The (C,O)-matched nulls
    fail the element ledger on hydrogen (residual 8-12) by construction.
  evidence:
    from_test: network-ledger-closes
    observed: >-
      element 0; carbon 2.8e-6; dissipation_min >= 0; FCC summation 3.3e-3; tol sensitivity 7.0e-6
    units: dimensionless
  explanation: >-
    Kinetics use the exergonic-direction class rate (k_down = k0, k_up = k0 exp(-|dG'0|/RT)), so detailed
    balance holds exactly and no rate exceeds a catalyst's turnover; the dissipation witness is therefore
    a real second-law check, not an identity. Artifacts: artifacts/reaction_universe_verification.json;
    the canonical run's ledger/* readouts.
  expected:
    cites:
    - kacser1973control
    - somogyi2015libroadrunner
    - noor2013consistent
