  measure:
    kind: derived
    path: motif_enrichment_p
    detail: empirical p of the universe motif count vs 24 nulls, arm formose_feed
  artifact: >-
    workspace/studies/og-network-persistence/artifacts/og-02-alt-reaction-universe/motif_enrichment.json
  params:
