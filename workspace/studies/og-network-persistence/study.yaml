behavior_tests:
- name: inferred-tier-has-thermo-and-rate-basis
  classification: primary
  artifact: >-
    workspace/datasets/prebiotic-reaction-atlas/atlas_coverage_report.json
  description: >-
    The inferred tier extends connectivity from C1–C3 to functional products only where eQuilibrator ΔG
    feasibility holds and a justified rate form/range is attached, each flagged is_range with its thermodynamic
    model recorded — no inferred reaction is promoted without that explicit basis.
  measure:
    kind: observable
    detail: >-
      fraction of inferred-tier reactions carrying a ΔG feasibility flag + justified rate form/range
  pass_if:
    op: threshold
    detail: every inferred reaction has an explicit thermo + rate basis
  requires_simulation: 'no'
- name: atlas-write-gate-zero-leakage
  classification: primary
  artifact: >-
    workspace/datasets/prebiotic-reaction-atlas/atlas_coverage_report.json
  description: >-
    No record with mass_balanced=false, charge_balanced=false, or a missing source_key enters atlas.vN.jsonl
    — the deterministic validator rejects it at write time.
  measure:
    kind: observable
    detail: count of unbalanced / unsourced records admitted to atlas.vN.jsonl (target 0)
  pass_if:
    op: threshold
    detail: zero balance/provenance violations in the accepted atlas
  requires_simulation: 'no'
- name: handoff-28-to-29-complete
  classification: secondary
  description: >-
    The atlas emits the 28→29 transfer bundle — canonical species, balanced stoichiometry, rate forms,
    parameter bounds and confidence tags — as the typed reaction set study 29 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 28→29 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 28→29 handoff validator)
  requires_simulation: 'no'
- name: network-ledger-closes
  classification: primary
  description: >-
    The NetworkLedgerProcess closes on the canonical run — exact element residual 0, integrated carbon
    balance at integrator tolerance, dissipation never negative.
  measure:
    kind: derived
    path: network_ledger_ok_final
    detail: ledger_ok on the final tick
  pass_if:
    op: '>='
    value: 1.0
    detail: every ledger witness within tolerance
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: element-residual-exact
  gate_class: regression_pin
  classification: diagnostic
  description: max|E S| over the generated universe's 413 internal reactions is exactly zero.
  measure:
    kind: derived
    path: max_element_residual
    detail: worst-case stoichiometric element residual
  pass_if:
    op: <=
    value: 1.0e-12
    detail: element balance exact by construction
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
- name: free-energy-directionality
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    The dissipation -sum v dG is non-negative on every tick (second law; a real check because k_r / k_f
    = exp(dG/RT) exactly).
  measure:
    kind: derived
    path: free_energy_directionality_final
    detail: 1 while dissipation has never been below -1e-12 W
  pass_if:
    op: '>='
    value: 1.0
    detail: directionality witness holds through the run
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
- name: persistent-network-at-phase1-feed
  classification: primary
  description: >-
    The universe fed the vent posterior sustains a multi-species network (not a one-off product) — at
    least 10 organic species above 1e-9 M.
  measure:
    kind: derived
    path: final_n_persistent_species
    detail: organic species above conc_floor on the final tick
  pass_if:
    op: '>='
    value: 10.0
    detail: '>= 10 persistent species'
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: rtca-branch-emerges-from-rules
  gate_class: regression_pin
  classification: supporting
  description: >-
    og-02's curated reductive branch (pyruvate -> OAA -> malate) appears from the rules alone — settled
    malate above 1e-9 M — at the thermodynamically allowed level.
  measure:
    kind: derived
    path: settled_malate_M
    detail: settled malate (last quartile)
  pass_if:
    op: '>'
    value: 1.0e-09
