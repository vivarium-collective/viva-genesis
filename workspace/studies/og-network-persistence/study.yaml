- id: og02-ignition-landscape
  kind: computational
  status: novel
  statement: >-
    A sweep over (feed CO₂ × washout rate) maps where the network IGNITES, not just that it does at one
    point. The autocatalytic hub (OAA) persists in a sharply bounded region — enough geological CO₂ in,
    slow enough washout (gain > 1) — and collapses to zero across a clean diagonal boundary when the feed
    is starved or the reactor flushed too fast. The favorable operating point sits well inside the ignition
    region; the gain=1 contour is the autocatalytic threshold.
  evidence:
    from_test: autocatalytic-gain-present
    observed: OAA hub 0 → 24 mM across the (feed × washout) plane; ignition bounded by gain=1
    units: molar
  expected:
    cites:
    - muchowska2019synthesis
    - muchowska2017metals
  explanation: >-
    16×16 sweep of the real libRoadRunner composite reduced to the settled OAA pool, net throughput and
    gain; rendered as the ignition phase map (Decision view). Runner sims/compute_gain_grid.py. Per-reaction
    fluxes are now read live from the engine (getReactionRates) so the network view is flux-weighted.
