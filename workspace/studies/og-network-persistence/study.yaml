  also folds here: its inbound numeric refs (og-29 handoff from:28 + builds_on 28 in og-29/og-31/og-rtca)
  are repointed 28->2 when those studies fold into og-autocatalysis-a2 (#4) and og-self-compartmentation
  (#3). Planned challenge arms og-ev-kinetic-uq and og-ev-timevarying-forcing stay tracked. Endogenous
