  requires_simulation: 'yes'
  cites:
  - kacser1973control
  band_basis: first_principles
- name: integrator-tolerance-insensitive
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    Tightening / loosening the CVODE tolerances around libRoadRunner's defaults changes no species by
    more than 1% (stiffness check).
  measure:
    kind: derived
    path: tolerance_sensitivity_max
    detail: worst relative species deviation across tolerance settings
  artifact: >-
    workspace/studies/og-network-persistence/artifacts/og-02-alt-reaction-universe/reaction_universe_verification.json
  pass_if:
    op: <=
    value: 0.01
    detail: <= 1% relative deviation
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - somogyi2015libroadrunner
  band_basis: first_principles
- name: sustained-carbon-throughput
