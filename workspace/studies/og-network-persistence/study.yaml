- id: og02-autocatalysis
  kind: computational
  status: novel
  statement: >-
    INVALIDATED (element-unbalanced curated motif): an apparent autocatalytic gain peaks at 29.5 (graded;
    settling as CO₂ limits) via a curated, element-lumped reductive-TCA turn whose lumped step is NOT
    mass-balanced (it creates 4 C/cycle), so the gain is an artifact; a no-CO₂ control collapses it to 0 —
    the gain is feed-driven and the motif is an imposed, element-unbalanced lumped stoichiometry, NOT genuine
    endogenous self-amplification. The campaign's dedicated
    discriminator (og-29, Gate A2) tests self-amplification against a degree-preserving matched null with
    a seed-independence test and refutes it; this finding therefore records an apparent, feed-driven gain,
    superseded on the self-amplification question by og-29.
  evidence:
    from_test: autocatalytic-gain-present
    observed: peak autocatalytic gain 29.5; no-CO2 control gain 0
  expected:
    cites:
    - muchowska2017metals
    - muchowska2019synthesis
  explanation: >-
    The reductive-TCA turn OAA+2CO2->2OAA+acetate doubles its own entry molecule per turn; the autocatalytic
    stoichiometry is a curated lumped reaction, so what is EMERGENT is that it sustains ignition under
    continuous feed + washout (a no-CO2 control collapses gain to 0), not the motif itself.
