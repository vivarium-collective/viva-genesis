schema_version: 4
name: og-network-rescue
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
verdict: supported
primary_limitation: "The pore's ignition benefit is a bounded window, not a broad swath; network_connected is a brittle proxy near threshold (reads 0 at high feed while the network stays carbon-fixing)."
key_assumptions:
- "The only difference between pore and control is spatial concentration, at identical vent-posterior feeds"
- "Ignition is read as net carbon flux, with the brittle connectivity proxy cross-checked"
- "The concentrating pore uses the og-03 thermophoretic enrichment"
evidence_tier: mechanistic_prediction
program: consolidated
title: 'Network Rescue: Does Pore Concentration Ignite the Reaction Network?'
concept: >-
  Reaction-network rescue: whether the spatial enrichment of og-spatial-concentration (4A) IGNITES the carbon-fixing
  reaction network in a pore where a matched well-mixed, nonconcentrating control stays dark — transport enrichment
  turned into network function. This is Gate B (spatial organization).
gate_reason: >-
  Network-rescue half of the former og-spatial-concentration (split from the enrichment half). Canonical arm og-30
  (Gate B): at identical vent-posterior feeds a concentrating pore ignites the full network (net carbon flux +4.5e-4,
  17 persistent species) while a matched well-mixed control stays dead; confirmed on the six-carbon network. Supported.
  Carries plan_id 30 and the numeric handoff/builds_on refs to study 30. Holds Gate B's criterion_finding og30-pore-ignites-vs-control.
claim: >-
  At identical vent-posterior feeds held equal, a concentrating mineral pore ignites the carbon-fixing network
  (net carbon flux +4.5e-4, 17 persistent species; confirmed on the six-carbon network) while a matched well-mixed,
  nonconcentrating control stays dead — spatial concentration is the only difference, so the pore causes the productive
  flux (og-30, canonical). Supported.
question: >-
  Does pore concentration ignite the carbon-fixing reaction network where a matched well-mixed, nonconcentrating
  control does not?
hypothesis: >-
  The enrichment a pore provides crosses the ignition threshold for the reaction network, so localization — not
  extra feed — is what makes the network productive.
experiment: >-
  Run the integrated pore composite at vent-posterior feeds vs a matched well-mixed nonconcentrating control (og-30),
  measuring net carbon flux and connectivity, and confirm on the six-carbon network.
result: >-
  The concentrating pore ignites the network (flux +4.5e-4, 17 persistent species) while the matched well-mixed
  control stays dead; confirmed on the six-carbon network, within a bounded porosity window. Localization makes
  the network productive.
builds_on:
- 3
- 29
plan_id: 30
handoff:
  emits:
  - to: 32
    provides:
    - precursor concentrations
    - T
    - pH
    - residence time
    - competing sinks
  receives:
  - from: 29
    requires:
    - active reactions
    - molecular species
    - concentrations
    - competing degradation routes
  - from: 3
    requires:
    - enriched precursor concentrations
    - enrichment fold
    - residence time
arms:
- id: 30_spatially_integrated_protometabolism
  source_study: og-30-spatially-integrated-protometabolism
  concept_role: >-
    Canonical: at identical vent-posterior feeds (CO2/H2 = 1e-3) a concentrating mineral pore IGNITES the full
    network (net carbon flux +4.5e-4, 17 persistent species) while a matched well-mixed, non-concentrating control
    stays dark; the C6 network og-29 found needs ~20x well-mixed feed ignites directly in the pore at base feed.
    Also resolves Gate A1 feed-plausibility. Benefit is a BOUNDED porosity window; network_connected is a brittle
    proxy near threshold.
  fidelity: mechanistic_prediction
  verdict: supported
  gate_status: passed
  matched_null: productive-flux-beats-wellmixed-and-nonconcentrating
  composite: >-
    viva_genesis.composites.og_30_spatially_integrated_protometabolism.og_30_spatially_integrated_protometabolism
  run_ids: []
  finding_ids:
  - og30-pore-ignites-vs-control
  - og30-c6-confirmation
  - og30-enrichment-bridges-ignition-gap
  - og30-connectivity-metric-brittle
  - og30-resolves-a1-feed-plausibility
  canonical: true
behavior_tests:
- name: receives-29-handoff-bundle
  classification: secondary
  description: >-
    Study 30 receives the full 29→30 bundle — active reactions, molecular species, actual concentrations and competing
    degradation routes — as typed inputs, verified complete before the spatial run.
  measure:
    kind: observable
    detail: completeness + typing of the 29→30 bundle checked against 29's emitted bundle
  pass_if:
    op: threshold
    detail: bundle received complete and typed
  requires_simulation: 'yes'
- name: colocalization-residence-measured
  classification: primary
  description: >-
    Reactive transport with thermophoresis and adsorption produces measurable co-localization of intermediates
    and increased residence time in the pore, reported as time- and space-resolved fields, not a terminal snapshot.
  measure:
    kind: observable
    detail: co-localization + residence time as time/space-resolved fields
  pass_if:
    op: threshold
    detail: measurable co-localization and residence increase reported
  requires_simulation: 'yes'
- name: productive-flux-beats-wellmixed-and-nonconcentrating
  classification: primary
  description: >-
    Productive network flux (and persistence) in the pore EXCEEDS both a matched well-mixed control and a matched
    nonconcentrating control with chemical input fluxes held equal; flux not separable from the controls is reported
    as "pores do not help," not tuned away. This is the Gate B arm.
  measure:
    kind: observable
    detail: pore productive flux + persistence vs. matched well-mixed and nonconcentrating controls
  pass_if:
    op: threshold
    detail: pore flux exceeds BOTH matched controls (else reported as no benefit)
  requires_simulation: 'yes'
- name: spatial-flux-conservation-and-cross-solver
  classification: secondary
  description: >-
    Mass and charge close across the spatial reactive-transport solve (divergence of flux equals source minus
    sink) with no untracked feed; the cross-solver comparison agrees to tolerance.
  measure:
    kind: observable
    detail: flux-divergence residual vs. source−sink; cross-solver agreement
  pass_if:
    op: threshold
    detail: conservation within tolerance; cross-solver agreement to tolerance
  requires_simulation: 'yes'
findings:
- id: og30-pore-ignites-vs-control
  kind: computational
  status: confirms
  statement: >-
    At identical vent-posterior feeds (CO2/H2 = 1e-3), the concentrating pore ignites the network (net carbon
    flux +4.5e-4; connected; 17 persistent species) while the matched well-mixed nonconcentrating control does
    not (flux ~0; not connected) - spatial concentration is the only difference, so the pore causes the productive
    flux.
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
- id: og30-c6-confirmation
  kind: computational
  status: confirms
  statement: >-
    The C6 network - the one og-29 found ignites only at ~20x well-mixed feed - ignites directly in the demo pore
    at the vent-posterior base feed (porosity 0.88, pore-local 0.023 M), net carbon flux +4.49e-4, connected,
    22 persistent species, while the matched well-mixed C6 control stays dead (flux +1.5e-9, not connected). C6
    shows the same bounded-window behavior as C4 - a tight pore (porosity 0.70, pore-local 2.63 M) gives higher
    flux (+0.072) but the connectivity metric still degrades (network_connected = 0), so there is no flux-washout
    upper bound; the bound above is physically-implausible feeds plus connectivity-metric degradation, not flux
    loss.
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
- id: og30-enrichment-bridges-ignition-gap
  kind: computational
  status: partial
  statement: >-
    A porosity sweep shows the pore's benefit is a bounded window, not a broad swath. Net carbon flux rises monotonically
    with confinement (no flux washout in the C4 network, even at extreme feeds), but the connectivity-defined
    ignition (og-29's network_connected metric) occupies a bounded, somewhat brittle porosity band (~0.80-0.90;
    pore-local ~0.01-0.2 M) - below it enrichment is sub-threshold, and above it the pore-local feeds become physically
    implausible (porosity 0.70 implies 2.6 M, 0.60 implies 36 M) while the connectivity metric itself degrades,
    flipping 1/0/1 across adjacent porosities at similar high flux. So ignition is met in a specific pore-geometry
    window, not robustly across geometry.
  evidence:
    from_test: colocalization-residence-measured
  expected:
    cites:
    - baaske2007extreme
    - mast2010thermal
- id: og30-connectivity-metric-brittle
  kind: methodological
  status: novel
  statement: >-
    network_connected (og-29's ignition metric) is a BRITTLE proxy near threshold - at high feed the network stays
    carbon-fixing (flux high and monotone in enrichment) but loses broad connectivity (connected flips to 0),
    the same signal og-29 recorded as "washout" at x50 well-mixed, now seen to be connectivity-breadth loss rather
    than flux loss, consistent across C4/C6 and well-mixed/pore. This is a methodological caveat on the ignition
    metric only; it does NOT touch og-29's formose refutation, which rests on the thermodynamic mechanism and
    the coefficient-free seed-independence discriminator, not on connectivity.
  evidence:
    from_test: colocalization-residence-measured
- id: og30-resolves-a1-feed-plausibility
  kind: methodological
  status: confirms
  statement: >-
    og-30 both meets Gate B's own criterion (pore flux far exceeds the matched control) and resolves Gate A's
    open A1 feed-plausibility question: the ~20x well-mixed ignition gap is bridged by pore enrichment within
    the physical pore window, so a carbon-fixing network persists at vent-realistic feeds inside a pore (demonstrated
    on C4 and confirmed directly on C6).
  evidence:
    from_test: productive-flux-beats-wellmixed-and-nonconcentrating
runs:
- id: gate-b-concentration-rescues-ignition
  composite: >-
    viva_genesis.composites.og_30_spatially_integrated_protometabolism.og_30_spatially_integrated_protometabolism
  params:
    base_CO2: 0.001
    base_H2: 0.001
    porosity: 0.88
    k_wash: 0.05
    max_carbons: 4
    c6_confirm: true
  artifact: artifacts/gate_b_spatial.json
  outcomes:
    productive-flux-beats-wellmixed-and-nonconcentrating:
      result: PASS
      measured_value: 0.00045
      detail: >-
        At the vent-posterior base feed (CO2/H2 1e-3, held equal) the concentrating pore (porosity 0.88, enrichment
        ~23x, pore-local ~0.023 M) ignites the network (net_carbon_flux +4.5e-4, connected, 17 persistent species)
        while the matched well-mixed nonconcentrating control does not (flux ~0, not connected). Confirmed on
        C6 (ignites in the demo pore; control dead).
    colocalization-residence-measured:
      result: PASS
      detail: >-
        The thermophoretic trap's co-localization (enrichment) is resolved across an empirical porosity sweep:
        connected-ignition occupies a bounded band (~0.80-0.90, pore-local ~0.01-0.2 M) - sub-threshold enrichment
        below, physically-implausible feeds + connectivity-metric degradation above. Net carbon flux is monotone
        in enrichment (no flux washout); a bounded window, not robust-across-geometry.
    a1-feed-plausibility-resolved-in-pore:
      result: PASS
      detail: >-
        The ~20x well-mixed ignition gap (og-29) is bridged at a modest physical pore (porosity 0.88), so A1's
        persistence firms up: a carbon-fixing network persists at vent-realistic feeds in a pore, within the bounded
        geometry window.
