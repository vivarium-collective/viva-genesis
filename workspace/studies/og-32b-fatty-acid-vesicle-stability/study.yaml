schema_version: 4
name: og-32b-fatty-acid-vesicle-stability
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
verdict: qualified
evidence_tier: mechanistic_prediction
title: Fatty-Acid Vesicle Stability
gate_reason: >-
  Gate C needs the protocell BOUNDARY to be the real amphiphile, not a stand-in. og-32 took full
  Gate C on an MD-informed first cut whose MD was DLPC/DPPC phospholipid planar bilayers standing in
  for the amphiphile chain-length axis (explicitly NOT fatty acids). This study replaces that stand-in
  with the real thing: single-chain saturated FATTY ACIDS self-assembled into a closed bilayer VESICLE
  (viva-openmm Martini 3 fatty-acid defs + vesicle builder + semi-isotropic membrane barostat), and asks
  the boundary question directly - does a fatty-acid vesicle stay a closed bilayer, over what chain-length
  window, and does the matched null (fully-ionised charged-only heads) fail by micellising?
claim: >-
  Real single-chain fatty-acid vesicles hold a closed bilayer shell across the C10-C16 chain-length axis
  on a short-MD stability trend, while the matched fully-charged null destabilises toward a micelle at the
  short-chain corner - a real-amphiphile boundary, replacing og-32's phospholipid stand-in (verdict
  qualified; the converged chain-length/charge window is the GPU gold-standard follow-up).
question: >-
  Do real single-chain fatty-acid amphiphiles self-assemble into and hold a STABLE closed bilayer vesicle
  (the protocell boundary) under vent conditions, across what chain-length window (C10-C16), and does the
  matched null - the same amphiphile with fully-ionised, charged-only heads - fail by micellising, as
  fatty-acid vesicle physics predicts?
hypothesis: >-
  Protonated / mixed-protonation fatty-acid heads form stable closed bilayer vesicles across the C10-C16
  chain-length axis; fully-charged heads (and the shortest chains, highest curvature + strongest headgroup
  repulsion) destabilise toward micelles. The stabilising trend should strengthen with chain length.
objective: >-
  Build real Martini 3 fatty-acid vesicles (C10/C12/C14/C16, protonated + charged-only null) with the
  viva-openmm fatty-acid defs + vesicle builder, run short membrane-barostat CG-MD, and measure bilayer-shell
  retention (inner-leaflet / water-lumen presence vs single-surface collapse) across independent seeds to
  locate the stability window and the destabilising corner.
builds_on: [32]
proposed_mechanisms:
- >-
  Fatty-acid vesicle stability is set by headgroup protonation plus chain length - protonated (neutral,
  H-bonding) heads pack into a bilayer; fully-ionised heads repel and favour high-curvature micelles; shorter
  chains raise curvature and lower the bilayer-forming threshold.
proposed_models_methods:
- Real Martini 3 coarse-grained MD of a built fatty-acid vesicle (viva-openmm OpenMMMartiniProcess +
  build_vesicle + MonteCarloMembraneBarostat), measuring end-state bilayer-shell retention across seeds.
model_approach:
  summary: >-
    REAL fatty-acid vesicle MD (viva-openmm), replacing og-32's DLPC/DPPC phospholipid planar-bilayer
    stand-in. A closed bilayer vesicle of single-chain saturated fatty acids (C10/C12/C14/C16) is built
    (Fibonacci-distributed on two concentric leaflets, solvated), energy-minimised, equilibrated, and run
    under a semi-isotropic membrane barostat; the end-state head-bead radial distribution gives the
    bilayer-vs-micelle verdict.
  fidelity: >-
    Real bridge to OpenMM + martini_openmm (Martini 3). The fatty-acid head bead pair (SP2 neutral / SQ5n
    carboxylate, size-matched small) is a documented Martini-3 building-block proposed_input (tracked
    CONFIRM); the C1 saturated tails are authoritative (verbatim from the Martini 3 DPPC/DPPS tails).
contract:
  face:
    inputs:
      chain_length: {_type: integer, _units: carbons, _min: 10}
      protonation_state: {_type: string, _units: dimensionless}
    outputs:
      shell_integrity: {_type: float, _units: dimensionless, _min: 0.0}
      inner_leaflet_fraction: {_type: float, _units: dimensionless, _min: 0.0}
      head_radial_cv: {_type: float, _units: dimensionless, _min: 0.0}
      vesicle_verdict: {_type: string, _units: dimensionless}
  conditions:
  - kind: invariant
    name: matched_null_same_amphiphile
    expr: the null is the SAME fatty acid with fully-ionised (charged-only SQ5n) heads - identical chain, only the protonation differs, so a stability difference is attributable to headgroup charge/chain, not composition
  - kind: invariant
    name: real_fatty_acid_not_phospholipid_standin
    expr: the amphiphile is the real single-chain fatty acid (viva-openmm Martini 3 defs), not og-32's DLPC/DPPC phospholipid stand-in
  - kind: invariant
    name: bilayer_vs_micelle_by_inner_leaflet
    expr: stability is judged by retention of a populated INNER leaflet + water lumen (a closed bilayer), not by outer-shell coherence alone (a micelle also has a coherent outer surface)
  - kind: invariant
    name: multi_seed_verdict
    expr: each arm's verdict is taken on the MEAN of >= 3 independent MD replicates with the spread reported, not a single trajectory
  note: >-
    SHORT bounded CG-MD -> a structural STABILITY TREND, not a converged (micro-to-millisecond)
    micellisation equilibrium or a PMF. The converged chain-length/charge/pH window and the permeability
    PMF are the GPU gold-standard follow-ups (S2 self-assembly, S3/og-32a PMF). pH is fixed-charge: an arm
    is protonated OR charged, it does not titrate.
behavior_tests:
- name: protonated-vesicle-stable
  classification: primary
  description: Protonated fatty-acid vesicles retain a closed bilayer shell (populated inner leaflet +
    coherent head shell) across the C10-C16 chain-length window, over independent MD seeds.
  measure: {kind: observable, detail: mean inner_leaflet_fraction + head_radial_cv across seeds, per chain}
  pass_if: {op: threshold, detail: inner_leaflet_fraction mean >= 0.20 AND head_radial_cv mean <= 0.35 for all protonated chains}
  requires_simulation: 'yes'
- name: charged-null-destabilises
  classification: primary
  description: The matched charged-only null (same chain, fully-ionised SQ5n heads) destabilises toward a
    micelle at the short-chain corner - the control that should FAIL the bilayer criterion.
  measure: {kind: observable, detail: charged-null head_radial_cv + inner_leaflet, vs the protonated arm at the same chain}
  pass_if: {op: threshold, detail: at least the shortest charged chain micellises (cv mean > 0.35 or inner leaflet lost)}
  requires_simulation: 'yes'
- name: real-fatty-acid-not-standin
  classification: primary
  description: The amphiphile is the real single-chain fatty acid (viva-openmm Martini 3 fatty-acid defs +
    vesicle builder), replacing og-32's DLPC/DPPC phospholipid planar-bilayer stand-in.
  measure: {kind: observable, detail: vesicle built from martini_v3.0.0_fatty_acids_v1.itp FAnn/FAnnM, run in martini_openmm}
  pass_if: {op: threshold, detail: real fatty-acid vesicle builds + integrates (finite energy) under the membrane barostat}
  requires_simulation: 'yes'
- name: multi-seed-robust
  classification: secondary
  description: Each arm's verdict is taken on the mean of >= 3 independent MD replicates with the spread
    reported, not a single trajectory - so a near-threshold arm is not a coin-flip.
  measure: {kind: observable, detail: per-arm n_seeds, n_stable_seeds, and the std of each metric}
  pass_if: {op: threshold, detail: at least 3 seeds per arm with reported mean +/- std}
  requires_simulation: 'yes'
decision_test: >-
  Real single-chain fatty-acid vesicles must (i) hold a closed bilayer shell - a populated inner leaflet
  and a coherent, non-dispersed head shell - across the protonated C10-C16 chain window over >= 3 independent
  MD seeds, while (ii) the matched fully-charged null destabilises toward a micelle at least at the
  short-chain corner. A protonated arm that micellises, or a charged null that is indistinguishable from
  protonated everywhere, is a reported negative (not tuned). The verdict is explicitly a SHORT-MD stability
  trend; the converged window is the GPU gold-standard follow-up.
findings:
- id: og32b-protonated-vesicles-stable-across-window
  kind: computational
  status: confirms
  statement: >-
    Real single-chain fatty-acid vesicles (viva-openmm Martini 3, ~1054 lipids, 3 independent MD seeds/arm)
    hold a closed bilayer across the entire protonated C10-C16 chain window: every chain keeps a populated
    inner leaflet (inner_leaflet_fraction 0.39-0.41, well above the 0.20 bilayer threshold) and a coherent,
    non-dispersed head shell (head_radial_cv 0.227-0.247, well below the 0.35 micelle threshold), with all
    3/3 seeds stable at each chain and tight spread (std <= 0.01). So the protocell boundary forms and holds
    for the real amphiphile across the chain-length axis on this short-MD stability trend.
  evidence: {from_test: protonated-vesicle-stable}
  expected: {cites: [janke2014oleic, pedersen2025lipidome]}
- id: og32b-charged-null-micellises-short-corner
  kind: computational
  status: confirms
  statement: >-
    The matched null - the SAME fatty acid with fully-ionised charged-only (SQ5n) heads - micellises at the
    short-chain corner: C10 charged disperses in all 3/3 seeds (head_radial_cv 0.433 +/- 0.009, above the
    0.35 threshold), the control that should fail. The charge effect is chain-length-gated within this short
    window: C14 charged still holds a coherent shell (cv 0.296 +/- 0.009, 3/3 stable), i.e. charge-driven
    micellisation of the LONGER chains is slower than ~0.8 ns CPU-MD resolves. So the destabilising corner is
    short chain + fully charged, exactly where fatty-acid physics (highest curvature + strongest headgroup
    repulsion) predicts the vesicle-forming threshold is crossed; the converged charge/chain boundary is the
    GPU gold-standard follow-up.
  evidence: {from_test: charged-null-destabilises}
- id: og32b-real-amphiphile-replaces-standin
  kind: methodological
  status: confirms
  statement: >-
    This study replaces og-32's DLPC/DPPC phospholipid planar-bilayer STAND-IN with the real protocell
    amphiphile: a closed bilayer VESICLE of single-chain fatty acids built + integrated in martini_openmm
    (Martini 3 fatty-acid defs FAnn/FAnnM + vesicle builder + semi-isotropic membrane barostat, finite
    energy). The Gate-C boundary is now the actual amphiphile, judged by a bilayer-vs-micelle discriminator
    (inner-leaflet / lumen retention) over >= 3 seeds. Verdict qualified: a SHORT-MD stability TREND, not a
    converged micellisation equilibrium or a permeability PMF - those are the GPU gold-standard follow-ups
    (og-32c self-assembly, og-32a PMF). The SP2/SQ5n head is a tracked Martini-3 building-block proposed_input;
    the C1 tails are authoritative.
  evidence: {from_test: real-fatty-acid-not-standin}
limitations:
- >-
  SHORT bounded CG-MD (per arm: a built ~1000-lipid vesicle, ~1500 waters, minimise + brief equil ramp +
  ~0.8 ns production under a semi-isotropic membrane barostat, CPU). This is a STRUCTURAL STABILITY TREND
  over a short window, NOT a converged micellisation equilibrium (which is micro-to-millisecond) nor a
  permeability PMF. The robust signal is the DIFFERENCE between arms (protonated vs charged-null, short vs
  long), not an absolute stability lifetime. The converged chain-length/charge window is the GPU
  gold-standard follow-up (S2 self-assembly, S3/og-32a PMF), flagged in discovery_implications, not hidden.
- >-
  The fatty-acid head bead pair - SP2 (neutral COOH) and SQ5n (carboxylate COO-), size-matched small (both
  54 amu) - is a documented Martini-3 building-block proposed_input (tracked CONFIRM against the Martini 3
  lipidome fatty-acid head mapping / Souza 2021), NOT a verbatim published-lipidome entry. The C1 saturated
  tails are authoritative (verbatim from the Martini 3 DPPC/DPPS tails). See the viva-openmm fatty-acid
  .itp header.
- >-
  pH is FIXED-CHARGE, not dynamic: the protonated arm stands for local pH well below the carboxylate pKa
  (~4.8), the charged-null for pH well above it. The intermediate mixed-protonation regime (near pKa, where
  fatty-acid vesicles are classically most stable via H-bonded dimers) is NOT resolved here - it needs a
  titratable-Martini (Grunewald 2020) or explicit mixed-ratio follow-up. So the "chain-length window" is a
  fixed-protonation first cut, not a pH-resolved phase boundary.
- >-
  A single vesicle radius / area-per-lipid per arm (one built curvature), one temperature, no ion screening
  beyond the Martini reaction field. Curvature, ionic strength, and temperature dependence of the window are
  not mapped here.
discovery_implications:
  resolved_uncertainties:
  - 'Boundary amphiphile fidelity: og-32 used DLPC/DPPC phospholipid planar bilayers as a STAND-IN for the
    amphiphile chain-length axis (explicitly not fatty acids). This study resolves that to the REAL
    single-chain fatty-acid vesicle (viva-openmm Martini 3 defs + vesicle builder + membrane barostat), so
    the Gate-C boundary is now the actual protocell amphiphile.'
  remaining_uncertainties:
  - Whether a converged (micro-to-millisecond, multi-seed, GPU) simulation sharpens the short-MD trend into a
    hard chain-length cutoff and resolves the charge-driven micellisation of the longer chains (not seen to
    destabilise within the short CPU window).
  - The pH-resolved stability phase boundary (mixed protonation near the carboxylate pKa), which fixed-charge
    Martini cannot address.
  followup_study_proposals:
  - id: og-32c-fatty-acid-self-assembly
    title: Fatty-acid vesicle SELF-ASSEMBLY from dispersed amphiphiles (GPU gold-standard)
    motivation: >-
      This study starts from a BUILT vesicle and tests whether it HOLDS. The stronger test is whether
      dispersed fatty acids SELF-ASSEMBLE into a bilayer vesicle unprompted over microseconds - a
      multi-microsecond, multi-seed GPU run (our Macs have no NVIDIA GPU; venue-gated).
    compute_budget_note: Multi-microsecond, GPU; venue-gated (no local GPU) - scheduled when GPU budget allows.
    status: proposed
  - id: og-32a-pmf-resolved-permeability
    title: Full PMF-resolved membrane permeability (gold-standard viva-md-membrane)
    motivation: >-
      The permeability PMF for the real fatty-acid bilayer (not the og-32 structure->permeability proxy),
      closing the composition -> permeability -> retention chain under a first-principles potential of mean
      force. Shared with og-32's tracked og-32a follow-up.
    compute_budget_note: Multi-day, heavy-GPU per composition; venue-gated.
    status: proposed
