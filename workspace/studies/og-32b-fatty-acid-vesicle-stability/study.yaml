baseline:
# MD-evidence study: the CANONICAL run is the viva-openmm fatty-acid vesicle MD
# (sims/run_fatty_acid_vesicle_stability.py), NOT an og_32 composite tick - see
# model_approach + runs[].description. The composite ref is og-32's Gate-C protocell
# that this real-amphiphile MD provides the membrane evidence for; params are limited
# to genuine declared composite params (no annotations stashed here).
- name: Gate-C protocell boundary informed by the real fatty-acid vesicle MD
  composite: viva_genesis.composites.og_32_first_self_maintaining_protocell.og_32_first_self_maintaining_protocell
  params: {membrane: true, composition: long_di-C16}
  planned: false
runs:
- id: fatty-acid-vesicle-stability-sweep
  composite: viva_genesis.composites.og_32_first_self_maintaining_protocell.og_32_first_self_maintaining_protocell
  description: >-
    Real fatty-acid vesicle MD (viva-openmm) across C10/C12/C14/C16 protonated + charged-only null, 3
    independent seeds/arm, ~1054 lipids + ~1500 waters, membrane barostat, ~0.8 ns/seed. Canonical runner
    sims/run_fatty_acid_vesicle_stability.py; artifact artifacts/vesicle_stability.json. (MD-evidence study;
    the composite ref is og-32's Gate-C protocell that this real-amphiphile MD feeds - see model_approach.)
  outcomes:
    protonated-vesicle-stable: {result: PASS, detail: 'all protonated C10-C16 stable 3/3 seeds: inner-leaflet 0.39-0.41 (>=0.20), head_radial_cv 0.227-0.247 (<=0.35), std <= 0.01'}
    charged-null-destabilises: {result: PASS, detail: 'C10 charged-only micellises 0/3 (cv 0.433 +/- 0.009 > 0.35); C14 charged still holds (cv 0.296), so the destabilising corner is short + charged'}
    real-fatty-acid-not-standin: {result: PASS, detail: 'real single-chain fatty-acid vesicle (FAnn/FAnnM, 1054 lipids) builds + integrates finite energy under the membrane barostat - replaces og-32 DLPC/DPPC stand-in'}
    multi-seed-robust: {result: PASS, detail: '3 independent MD seeds/arm, mean +/- std reported; all per-arm verdicts unanimous (3/3 or 0/3) with tight spread'}
artifacts:
- path: workspace/studies/og-32b-fatty-acid-vesicle-stability/artifacts/vesicle_stability.json
  description: Multi-seed fatty-acid vesicle stability sweep (C10-C16 protonated + charged-only null); per-arm bilayer-shell retention with seed spread + verdict.
parent_studies:
- {study: og-32-first-self-maintaining-protocell, condition: tests-passed}
key_assumptions:
- The matched null is the SAME fatty acid with fully-ionised charged-only heads (only protonation differs), so a stability difference is attributable to headgroup charge / chain length, not composition.
- Stability is judged by retention of a populated inner leaflet + water lumen (a closed bilayer), not outer-shell coherence alone (a micelle also has a coherent outer surface).
- The amphiphile is the real single-chain fatty acid (viva-openmm Martini 3 defs), replacing og-32's DLPC/DPPC phospholipid stand-in.
- The result is a SHORT-MD stability trend across >= 3 seeds, not a converged micellisation equilibrium; the converged window is the GPU gold-standard follow-up.
- pH is fixed-charge (protonated OR charged per arm), not dynamic titration.
expert_questions:
- Should og-32b be promoted from an MD-evidence study to a registered composite (an OpenMMMartiniProcess-backed vesicle composite), or does it stay the real-MD evidence study feeding og-32's Gate-C boundary (as og-32's md_bilayer_observables artifact did, now replaced by the real fatty-acid vesicle)?
- Confirm the fatty-acid head bead pair (SP2 / SQ5n, size-matched small) against the Martini 3 lipidome fatty-acid head mapping or Souza 2021, to lift it from proposed_input to authoritative.
