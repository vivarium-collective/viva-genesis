schema_version: 4
name: og-00b-ph-endmember-sweep
investigation: origins-of-life-vent
parent_relations:
- study: og-00-vent-reactor-baseline
  relation: leads-to
pipeline_gate:
  prerequisites:
  - study: og-00-vent-reactor-baseline
    condition: tests-passed
title: Bounding the pH endmember — pyroxene fraction and seawater-mixing dilution
status: planned
design_status: drafted
simulation_status: not_run
study_type: exploratory
proposed: true
seeded_from:
  study: og-00-vent-reactor-baseline
  finding: og00-habitability-window
question: >-
  og-00 reports a habitability window at a single olivine-dominated vent composition. How far does
  that window move when the host-rock pyroxene fraction (ol/px ratio) and the seawater-mixing
  dilution are varied — i.e. where is the realistic pH endmember, and does the habitable region
  survive at the acidic/dilute edge the 2026 reassessment emphasises?
objective: >-
  Sweep pyroxene_fraction (ol/px ratio) x seawater-mixing dilution on the serpentinizing vent-reactor
  composite, map the steady-state pH and the habitability indicator across the grid, and report the
  pH endmember bounds and how the habitable region deforms toward the acidic/dilute corner.
baseline:
- name: Vent reactor at the olivine endmember (og-00 canonical)
  composite: viva_genesis.composites.vent_reactor.serpentinizing_vent_reactor
  params: {}
proposed_acceptance_criteria:
- The pH endmember is bounded (max-ol to max-px, full to dilute) with a monotone, mechanistically
  explicable trend rather than a numerical artifact.
- The habitability indicator is reported at every grid point, and whether it remains non-empty at the
  acidic/dilute corner is stated explicitly (either outcome is informative).
