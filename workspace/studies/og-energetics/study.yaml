behavior_tests:
- name: currency-maintained
  classification: primary
  description: >-
    The carrier stays charged under continuous endergonic load — a transferable currency is MAINTAINED
    above threshold, not merely charged transiently.
  measure:
    kind: derived
    path: energy_final_charge_fraction
    detail: charged fraction of the carrier pool at the end of the run
    under load: null
  pass_if:
    op: '>='
    value: 0.25
    detail: the currency is maintained (charged fraction >= 0.25) against discharge + hydrolysis
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - buckel2013energy
  - lane2010chemiosmotic
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: captures-free-energy
  classification: primary
  description: >-
    A substantial fraction of the input geochemical free energy is captured as transferable usable work
    (stored-work fraction), not just dissipated.
  measure:
    kind: derived
    path: energy_stored_work_fraction
    detail: (delivered work + currently stored)/input free energy at the end of the run
  pass_if:
    op: '>='
    value: 0.3
    detail: capture into transferable currency exceeds 30% of the tapped geochemical free energy
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - buckel2013energy
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: ablation-no-coupling-or-drive-collapses
  classification: primary
  description: >-
    Feature ablation: with no coupling (coupling_efficiency -> 0) or no drive (drive ΔG below the carrier
    bond), the currency never charges — capturing free energy requires BOTH the coupling chemistry and
    a drive that clears the bond.
  measure:
    kind: cross_run
    detail: no-coupling and no-drive controls vs the favourable arm
  pass_if:
    op: controls_absent
    detail: >-
      both ablations collapse (charged fraction ~0) where the favourable arm maintains the currency
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - buckel2013energy
  - lane2010chemiosmotic
  gate_class: acceptance_criterion
- name: free-energy-conserved
  gate_class: regression_pin
  classification: supporting
  description: >-
    Free-energy accounting is a contract invariant — input = useful work + stored + dissipated, held to
    machine precision every tick.
  measure:
    kind: derived
    path: energy_ledger_residual
    detail: worst-case |input - (work + stored + dissipated)| over the run
  pass_if:
    op: <=
    value: 1.0e-09
    detail: the ledger residual stays at machine precision (free-energy accounting invariant)
  units: kilojoule/liter
  requires_simulation: 'yes'
  cites:
  - buckel2013energy
  band_basis: first_principles
- name: selection-internalizes-gradient-generation
  classification: primary
  description: >-
    As the external gradient declines, selection drives the population to internalize gradient generation
    (active-pump fraction rises past 0.6).
  measure:
    kind: derived
    path: final_internalization
    detail: active-pump fraction of the surviving population at the collapsed gradient
  pass_if:
    op: '>='
    value: 0.6
    detail: the population internalizes (pump fraction >= 0.6) as the external gradient falls
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  - lane2012origin
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: reduced-gradient-dependence
  classification: primary
  description: >-
    An internalizing (efficient-pump) lineage persists as the external gradient is lowered (survivors
    stay high).
  measure:
    kind: derived
    path: final_survivors
    detail: surviving strategy mass at the collapsed external gradient
  pass_if:
    op: '>='
    value: 0.5
    detail: internalizing lineage persists (survivors >= 0.5) at the collapsed gradient
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: sojo-constraint-weak-pump-collapses
  classification: primary
  description: >-
    Discriminating (Sojo 2014): a weak pump cannot internalize, so when the external gradient collapses
    the lineage goes extinct — only sufficiently efficient pumps survive the transition.
  measure:
    kind: cross_run
    detail: efficient-pump survivors vs weak-pump control
  pass_if:
    op: controls_absent
    detail: the weak-pump control collapses (survivors ~0) where the efficient pump persists
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - sojo2014bioenergetic
  - lane2012origin
  gate_class: acceptance_criterion
- name: energy-cost-accounted
  gate_class: regression_pin
  classification: supporting
  description: >-
    Membrane-maintenance energy is outweighed by benefit in the surviving population (net-positive free-energy
    flux).
  measure:
    kind: derived
    path: final_internalization
    detail: internalized population has net-positive flux
  pass_if:
    op: '>'
    value: 0.0
    detail: a net-positive-flux internalized region exists
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - lane2010chemiosmotic
  band_basis: first_principles
- name: free-energy-ledger-closes
  classification: primary
  description: >-
    The FreeEnergyLedgerProcess closes on the canonical run — exact cumulative residual, non-negative
    second-law margin, dissipation never negative, capture efficiency <= 1.
