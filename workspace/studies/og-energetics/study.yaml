title: 'Proto-Energetics: Capture, Internalization, and Carrier Coupling'
concept: >-
  Bioenergetics of the protocell: whether a primitive system captures geochemical free energy, internalizes
  it under selection, and couples a chemical carrier — one concept, studied at several fidelities as arms.
gate_reason: >-
  Gate E (optional extension), energy. Consolidates the campaign's proto-energetics line into one concept
  with explicit arms at different fidelities (the og-00..08 scaffold arc and the og-27..37 sharpened arc
  as arms of the same question): can a primitive chemical system capture geochemical free
  energy, internalize it under selection, and couple a specified carrier to do endergonic work — each
  arm judged against its own matched null with input fluxes held equal, the ledger closing with no hidden
  inflow. Headline is bounded by the sharpest arm (og-35): the carrier pays on DIP-PERSISTENCE, not total
  throughput — so the consolidated verdict is QUALIFIED, with each arm keeping its own verdict and matched
  null (see arms). Guardrail: the metabolism is the sustained A1 carbon-fixing network, not autocatalytic
  (A2 refuted).
claim: >-
  Across fidelities, a protocell's energetics buy robustness/persistence, not raw throughput. A primitive
  carrier captures geochemical free energy into a transferable store with a closing ledger (proto-energetics
  arm, supported); a compartment internalizes electrochemical work under selection and pays for it within
  a Sojo-bounded survival region (internalization arm, supported); which coupling chemistry pays is structure-sensitive
  and membrane-leak-dependent (5-class alt arm, supported, classes agree ~46%); and a specified thioester
  carrier does useful work through a gradient dip where gradient-only starves but does NOT improve total
  useful work (sharpened Gate-E arm, og-35, qualified). The consolidated headline is bounded by that sharpest
  arm: qualified, dip-persistence not throughput. Every matched null and every arm verdict is preserved.
question: >-
  Can a primitive chemical system capture geochemical free energy, internalize it under selection, and
  couple a specified carrier to perform endergonic work — and does any of it improve total throughput,
  or only persistence/robustness — each tested against a matched null with a closing ledger?
hypothesis: >-
  Energetic mechanisms (capture, internalization, carrier coupling) raise persistence/robustness — doing
  useful work through gradient dips and surviving gradient loss — but do not net more total useful work,
  because stores time-shift and leak and activation is gated at the carrier bond. No net benefit is claimed
  where an arm's ledger does not close without a hidden inflow.
experiment: >-
  Consolidate the proto-energetics studies into one concept with explicit fidelity-labelled arms, each
  preserving its matched null, verdict, findings and run provenance; report the consolidated verdict bounded
  by the sharpest arm (og-35, qualified) without over-claiming past it.
result: >-
  Across fidelities the protocell's energetics buy robustness/persistence, not raw throughput: a carrier
  captures free energy into a transferable store (ledger closing), internalization pays under a Sojo
  constraint, which coupling chemistry pays is structure-sensitive, and the carrier does useful work through
  a gradient dip but does NOT net more total work — QUALIFIED, bounded by the og-35 arm.
