findings:
- id: ogenergy-currency-maintained
  provenance:
    run_ids:
    - viva_genesis.composites.proto_energetics.proto_energetics__1792351385__122918
  kind: computational
  status: confirms
  statement: >-
    An exergonic geochemical drive coupled to a pre-ATP thioester-class carrier builds and MAINTAINS a
    transferable energy currency under continuous endergonic load — the charged pool fills from empty
    and settles at ~39% of capacity, a spendable store held against discharge and hydrolysis. This is
    energetic bookkeeping (a carrier charged and spent), not a favourable reaction direction.
  evidence:
    from_test: currency-maintained
    observed: charged fraction 0.00 -> 0.39 and held under load
    units: dimensionless
  expected:
    cites:
    - buckel2013energy
    - lane2010chemiosmotic
  explanation: >-
    ProtoEnergyCurrencyProcess charges the carrier at the coupling efficiency when the drive ΔG clears
    the carrier bond, discharges it to endergonic work under load, and bleeds it by first-order hydrolysis;
    the steady charge is the balance of charging against the two drains.
- id: ogenergy-stored-work-fraction
  provenance:
    run_ids:
    - viva_genesis.composites.proto_energetics.proto_energetics__1792351385__122918
  kind: computational
  status: novel
  statement: >-
    Accounting the free energy by DESTINATION (a conserved ledger: input = useful work + stored + dissipated)
    shows ~47% of the tapped geochemical free energy is captured as transferable usable work at the favourable
    operating point, the remaining ~53% dissipated (uncoupled drive, discharge inefficiency, hydrolysis).
    Capture is not assumed — it is measured, bounded, and falls off smoothly as the coupling efficiency
    or the drive margin over the carrier bond declines.
  evidence:
    from_test: captures-free-energy
    observed: stored-work fraction 0.47 of input free energy; ledger residual ~1e-16 kJ/L
    units: dimensionless
  expected:
    cites:
    - buckel2013energy
  explanation: >-
    The currency process emits the full ledger (input / work / stored / dissipated); the stored-work fraction
    is (work + stored)/input. Charging draws bond/efficiency of input per charged mole (the uncoupled
    remainder dissipated), so the captured fraction is bounded above by the coupling efficiency and reduced
    further by discharge loss and hydrolysis — rendered as the energy-provenance panel (Mechanism) and
    the capture landscape (Decision).
- id: ogenergy-coupling-and-drive-both-required
  provenance:
    run_ids:
    - viva_genesis.composites.proto_energetics.proto_energetics__1792351385__122918
  kind: computational
  status: novel
  statement: >-
    The currency collapses under either ablation — no coupling (efficiency -> 0) OR a drive ΔG below the
    carrier's high-energy bond — so capturing environmental free energy into a transferable store requires
    BOTH a coupling chemistry and a drive strong enough to clear the bond. The drive axis has a real thermodynamic
    gate, not merely a rate dependence; the Decision phase map is the bounded region where both conditions
    hold.
  evidence:
    from_test: ablation-no-coupling-or-drive-collapses
    observed: favourable charged fraction 0.39 vs no-coupling 0.00 / no-drive 0.00
  expected:
    cites:
    - buckel2013energy
    - lane2010chemiosmotic
  explanation: >-
    A carrier can only be charged when the drive ΔG exceeds the bond energy (a weak drive cannot charge
    a high-energy carrier) and the coupling actually transfers it; below either threshold no store builds,
    so the viable region is bounded on both axes.
- id: og05-internalization-under-selection
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization__1791944483__bef477
  kind: computational
  status: confirms
  statement: >-
    As the external geochemical gradient declines over the run, replicator selection drives the population
    from externally-driven (pump fraction ~0) to internalized gradient generation (pump fraction ~0.95)
    while persisting — the bioenergetic internalization is an evolutionary outcome, not a scripted upgrade.
  evidence:
    from_test: selection-internalizes-gradient-generation
    observed: internalization 0.00 -> 0.95; survivors 1.0 at the collapsed gradient
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: >-
    BioenergeticSelectionProcess replicator dynamics over a (permeability × pump) strategy grid with a
    Sojo leaky-membrane fitness; the declining gradient flips the winning strategy from leaky-external
    to tight-pump.
- id: og05-sojo-constraint
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization__1791944483__bef477
  kind: computational
  status: novel
  statement: >-
    A weak pump cannot internalize — when the external gradient collapses, the weak-pump lineage goes
    extinct (survivors → 0) while the efficient-pump lineage persists. Internalization is only viable
    with a sufficiently efficient pump (the Sojo leaky-membrane constraint).
  evidence:
    from_test: sojo-constraint-weak-pump-collapses
    observed: efficient survivors 1.0 vs weak-pump survivors 0.0 at collapsed gradient
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: >-
    Below a pump-efficiency threshold the internal-pump flux cannot beat its cost against the lost external
    coupling, so no strategy clears the survival floor.
- id: og05-survival-phase-map
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization__1791944483__bef477
  seeded_study: og-05b-collapse-rate-sweep
  kind: computational
  status: novel
  statement: >-
    Survival off the collapsing gradient is a bounded REGION, not two representative runs: the native
    (pump catalyst efficiency × gradient floor) Decision map survives at 185/196 points (~94%), with the
    low-floor / low-efficiency corner going extinct. The Sojo cost line (η ≈ 0.30 — where internal pumping
    clears its maintenance cost plus the survival floor) marks the internalize-or-die boundary, and internalization
    (pump fraction > 0.5) fills the efficient interior where the lineage OWNS its energy rather than riding
    the residual external gradient.
  evidence:
    from_test: selection-internalizes-gradient-generation
    observed: >-
      185/196 (94%) survive over (catalyst_efficiency 0.05–1.3 × gradient_floor 0.005–0.35); Sojo cost
      line η≈0.30; internalization 0.009–0.949 across the grid; operating point (η=1.0, floor=0.02) deep
      inside
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: >-
    The bioenergetic_survival_map sweeps the real replicator loop under the declining gradient and reduces
    each point to the surviving fraction + the survives PASS mask; the Sojo efficiency floor is read from
    the selection process config ((survival_threshold + c_pump + c_base)/k_int). Rendered as the survival
    landscape + internalization map (Decision view).
  next_action: >-
    Sweep decline_rate / alternative collapse scenarios to test how the survival region deforms with the
    speed of gradient loss (og-05b).
  next_action_type: calibrate
- id: og05-energy-provenance
  provenance:
    run_ids:
    - >-
      viva_genesis.composites.bioenergetic_internalization.bioenergetic_internalization__1791944483__bef477
  kind: computational
  status: novel
  statement: >-
    Accounting the free energy by SOURCE (not just the net flux) shows the useful disequilibrium shifting
    from the external geochemical gradient to internally maintained power as the environment declines
    — the external share of the useful free energy peaks near ~82% early in the run, then collapses to
    ~1% as the gradient falls while the population persists. The organism comes to "own" its energy: the
    geochemical gradient becomes a resource it taps, not the scaffold that organizes it.
  evidence:
    from_test: reduced-gradient-dependence
    observed: >-
      external share of useful free energy peaks ~82% then falls to ~1% as external pmf 0.40 → 0.02 V;
      survivors 1.0, internalization → 0.95
    units: dimensionless
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2012origin
  explanation: >-
    The selection process emits the population-mean provenance breakdown (external tap k_ext·pmf·P vs
    internal pump k_int·pump·eff·(1−P) vs maintenance cost); rendered as the stacked energy-provenance
    trajectory + the gradient-dependence curve (Mechanism view).
- id: ogenergyalt-thioester-pays-from-low-activity
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: novel
  statement: >-
    At the nominal membrane and gradient the thioester / acyl-phosphate store beats the passive baseline
    from coupling activity 0.10: its potential bond + RT ln(q/(1-q)) crosses the 30 kJ/mol load at q =
    0.12 (29.6 kJ/mol) and work begins to flow; net power rises from the passive 1.95e-17 W to a maximum
    2.17e-17 W at activity 0.8 (+2.1e-18 W, autonomy 0.24) and falls again at 1.0 as the machinery cost
    outgrows the pool-limited store. The class pays on 54 % of the whole grid and up to P_H 3.2e-6 m/s.
  evidence:
    from_test: thioester-threshold-activity
    observed: >-
      a* = 0.10; autonomy 0.027 at a*, 0.262 at a = 1; best +2.1e-18 W at 0.8; ceiling 3.2e-6 m/s
    units: dimensionless
  explanation: >-
    Charging at a x 1e-21 mol/s against hydrolysis 1e-4/s + carrier permeation 1e-4 x P_H x A/V (6e-4/s
    at 1e-6 m/s) sets q(a); the draw gate opens once mu(q) >= 30 kJ/mol, i.e. q >= 0.13 for a 35 kJ/mol
    bond. Artifact: artifacts/internalization_threshold_report.json (per_class.thioester_acyl_phosphate.nominal).
  expected:
    cites:
    - buckel2013energy
    - lane2010chemiosmotic
- id: ogenergyalt-ion-gradient-needs-tight-membrane
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: confirms
  statement: >-
    The pumped H+/Na+ gradient store never pays at fatty-acid-like leak: at P_H 1e-6 m/s its potential
    reaches only 6.5 kJ/mol at full activity (q = 0.11; the Na+ leak at 1e-3 x P_H x A/V = 6e-3/s outruns
    the pump), so it draws no work and costs 5e-18 W of maintenance (net 1.45e-17 vs passive 1.95e-17
    W). At P_H 1e-8 m/s it pays from activity 0.5 with autonomy 0.97 — the Sojo-2014 tradeoff inside one
    individual: the same leak that feeds the external tap drains the ion store, so owning a gradient needs
    a membrane tight to Na+.
  evidence:
    from_test: ion-gradient-pays-fraction
    observed: >-
      pays on 4 % of the grid; ceiling P_H 1e-8 m/s; potential 6.5 kJ/mol at nominal, autonomy 0.97 at
      1e-8
    units: dimensionless
  explanation: >-
    The ion store's leak is the only leak law tied to the membrane permeability (ratio x P_H); the chemical
    carriers leak by hydrolysis independent of the membrane and by a 10-100x smaller permeation, so only
    the ion class has a permeability ceiling two decades below the others.
  expected:
    cites:
    - sojo2014bioenergetic
- id: ogenergyalt-polyphosphate-cannot-clear-the-load
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: novel
  statement: >-
    A polyphosphate store (20 kJ/mol per bond, 100x slower hydrolysis than the thioester) never beats
    the passive baseline on the grid: clearing a 30 kJ/mol load needs RT ln(q/(1-q)) >= 10 kJ/mol, i.e.
    q > 0.98, and the drive turnover against carrier permeation charges it only to q = 0.69 (22 kJ/mol)
    at full activity. Kinetic stability does not substitute for bond energy once the load is fixed.
  evidence:
    from_test: polyphosphate-pays-fraction
    observed: >-
      pays on 0 % of the grid; potential 22.1 kJ/mol at q = 0.69 (a = 1, nominal); autonomy 0 everywhere
      at nominal
    units: dimensionless
  explanation: >-
    The phosphorylation-potential logic of Buckel & Thauer made per-individual; the class would pay against
    a lower load (expert question).
  expected:
    cites:
    - buckel2013energy
    - natcomm2025phosphateactivation
- id: ogenergyalt-fe-redox-marginal
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: novel
  statement: >-
    The reduced-metal store charged by the Fe(II)-disproportionation drive sits at the load: its potential
    is pinned at 29.3-29.9 kJ/mol (q 0.62-0.67) once the draw gate half-opens, so it pays only from activity
    0.8 (+1.8e-19 W, autonomy 0.17 at a*, 0.21 at full activity) and on 18 % of the grid, with a ceiling
    at the nominal P_H 1e-6 m/s.
  evidence:
    from_test: fe-redox-pays-fraction
    observed: a* = 0.80; autonomy 0.17 at a*; best +1.8e-19 W at 1.0; pays on 18 % of the grid
    units: dimensionless
  explanation: >-
    With a 28 kJ/mol effective transfer the store must be two-thirds charged to clear the load; the result
    depends directly on the hypothetical bond and drive numbers the package flags.
  expected:
    cites:
    - natcomm2025fedisproportionation
- id: ogenergyalt-collapsed-gradient-autonomy
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: confirms
  statement: >-
    With the external gradient collapsed to the og-05 floor (0.02 V) the passive baseline keeps 1.7e-18
    W; the thioester (3.7e-18 W, autonomy 0.79) and Fe-redox (1.9e-18 W, autonomy 0.74) individuals keep
    a larger positive budget drawn mostly from their store, while the ion-gradient and polyphosphate individuals
    go negative (-3.3e-18 W). The per-individual autonomy published by og-05's selection loop from the
    same power terms is 0.99 at its collapsed gradient (its population-mean pump fraction: 0.95).
  evidence:
    from_test: internalization-pays
    observed: >-
      collapsed gradient, a = 1, P_H 1e-6: thioester net 3.7e-18 W / autonomy 0.79; fe_redox 1.9e-18 /
      0.74; h_na and polyphosphate -3.3e-18 / 0
    units: watt
  explanation: >-
    Autonomy = internal / (internal + external) is the same readout for one individual here and for og-05's
    population; the switch of og-05's gates to it is recorded as a decision.
  expected:
    cites:
    - sojo2014bioenergetic
    - lane2010chemiosmotic
- id: ogenergyalt-ledger-and-provenance
  provenance:
    run_ids:
    - viva_genesis.composites.protocell_energetics.protocell_energetics__1792071305__11504a
  kind: computational
  status: confirms
  statement: >-
    Numerical verification: on all 990 runs the cumulative identity in + E0 - work - dissipated = E(t)
    holds to 1.3e-14 relative, the second-law margin never goes below rounding (-1e-26 J against ~1e-13
    J of intake), the per-tick dissipation is never negative and the capture efficiency never exceeds
    0.30 (the passive tap's conversion; the internal classes capture less of their gross intake). The
    vg-data package energy_currencies carries 0 measured, 1 calibrated, 8 inferred, 3 extrapolated and
    12 hypothetical parameters with no unsourced non-hypothetical entry.
  evidence:
    from_test: threshold-map-ledger-all-ok
    observed: >-
      residual max 1.3e-14; margin min -1e-26 J; dissipation min 0; efficiency max 0.30; audit 0/1/8/3/12
    units: dimensionless
  explanation: >-
    The store's free energy is an exact function of its charge (ideal mixing relative to the resting charge;
    capacitor for the ion gradient), so every tick's flows are differences of that function and the ledger
    closes by construction — the inequality is then a real check on the sign of each flow.
  expected:
    cites:
    - buckel2013energy
- id: og35-carrier-pays-or-costs
  kind: computational
  status: confirms
  statement: >-
    The thioester carrier pays on DIP-PERSISTENCE, not total throughput. Under a declining geochemical
    drive with the free-energy ledger closing (max |budget_residual| ~9e-19, no hidden inflow), the carrier
    does useful work through the dip (0.030) where the matched gradient-only control starves (0.006);
    but total useful work is NOT improved (carrier 0.256 vs gradient-only 0.282) - the carrier time-shifts
    banked energy into the dip and loses some to hydrolysis, and gates activation at the bond so it does
    not capture the above-bond surplus (true even at zero hydrolysis). So the carrier buys gradient-dip
    resilience, not raw throughput - the same persistence-not-throughput motif as Gate B (pore) and Gate
    C (membrane). Verdict qualified. Guardrail: the carrier funds endergonic work for the sustained A1
    carbon-fixing network, not autocatalysis.
  evidence:
    from_test: carrier-pays-on-dip-persistence
  expected:
    cites:
    - huber1997activated
    - buckel2013energy
    - natcomm2025phosphateactivation
- id: og35-energy-ledger-closes
  kind: computational
  status: confirms
  statement: >-
    The full free-energy ledger (activation / use / hydrolysis / stored) closes to machine precision in
    both arms (max |budget_residual| ~9e-19), so the dip-persistence benefit is real accounting, not an
    unbalanced source - there is no hidden energy inflow. A ledger that only closed with a hidden inflow
    would be a reported failure, not a pass.
  evidence:
    from_test: energy-ledger-closes
  expected:
    cites:
    - sojo2014bioenergetic
- id: og35-carrier-scope
  kind: methodological
  status: confirms
  statement: >-
    Carrier chemistry is one specified thioester cycle (Option B, tied to the og-12 rebuild); the total-work
    cost/benefit is a k_hydrolyze window - here the carrier does not beat gradient-only on total at any
    tested leak rate (including zero), so the benefit is strictly dip-persistence. The alternative carrier
    (acyl-phosphate) and a microkinetic enzyme-free resolution are the gold-standard follow-on (og-35a)
    that would re-test the energy benefit under resolved, multi-carrier chemistry rather than one lumped
    cycle.
  evidence:
    from_test: carrier-pays-on-dip-persistence
