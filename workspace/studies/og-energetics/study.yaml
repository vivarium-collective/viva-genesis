    path: free_energy_ledger_ok_final
    detail: free_energy_ledger_ok on the final tick
  pass_if:
    op: '>='
    value: 1.0
    detail: every ledger witness within tolerance
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: free-energy-residual-exact
  gate_class: regression_pin
  classification: diagnostic
  description: '|in_cum + E0 - work_cum - diss_cum - E(t)| / in_cum stays at rounding over the run.'
  measure:
    kind: derived
    path: free_energy_residual_max
    detail: worst-case relative ledger residual
  pass_if:
    op: <=
    value: 1.0e-09
    detail: free-energy accounting exact by construction
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: machine_precision
- name: second-law-margin-nonnegative
  gate_class: regression_pin
  classification: diagnostic
  description: >-
    free_energy_in >= work + dissipated (cumulatively, with the store): the margin in + E0 - work - dissipated
