behavior_tests:
- name: sustained-reactive-flux-over-timescales
  classification: primary
  artifact: >-
    workspace/studies/og-vent-interface/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a maintained pH/redox
    gradient at or above the levels used by published vent-reactor and H2-dependent-metabolism work; the full
    time series and the onset of decay are reported, not a single terminal value.
  measure:
    kind: observable
    detail: >-
      time- and space-resolved H2 + inorganic-carbon flux and pH/redox gradient over transport timescales
  pass_if:
    op: threshold
    detail: delivery at or above the downstream-required level over the transport timescale
  requires_simulation: 'yes'
- name: mineral-evolution-supply-decay
  classification: primary
  artifact: >-
    workspace/studies/og-vent-interface/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Precipitation and surface passivation reduce reactive surface and throttle catalytic supply on the mineral-evolution
    timescale; the crossover time at which delivery drops below the downstream-required threshold is quantified.
  measure:
    kind: observable
    detail: >-
      catalytic supply / reactive surface vs. the slower mineral-evolution timescale; crossover time below threshold
  pass_if:
    op: threshold
    detail: crossover time quantified (depleting-supply behaviour characterised)
  requires_simulation: 'yes'
- name: electrochemical-driving-force-verified
  classification: secondary
  description: >-
    The cross-interface electrical driving force is non-trivial and of the sign/scale needed to drive CO2 reduction,
    verified independently by a FEniCSx Nernst–Planck solve against the FiPy transport result.
  measure:
    kind: observable
    detail: interface potential from FiPy transport vs. independent FEniCSx Nernst–Planck solve
  pass_if:
    op: threshold
    detail: non-trivial driving force, cross-solver agreement to tolerance
  requires_simulation: 'yes'
- name: coupled-conservation
  classification: secondary
  artifact: >-
    workspace/studies/og-vent-interface/artifacts/og-27-coupled-geochemical-reaction-interface/interface_report.json
  description: >-
    Mass, charge and energy close across the coupled PHREEQC+FiPy+Reaktoro solve to tolerance with no untracked
    feeds.
  measure:
    kind: observable
    detail: C/H/O/charge/energy residuals across the coupled solve
  pass_if:
    op: threshold
    detail: residuals within tolerance; no untracked feed
  requires_simulation: 'yes'
- name: handoff-27-to-29-complete
  classification: secondary
  description: >-
    The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic activities, catalyst
    (mineral-surface) state and time-dependent feeds — as the typed boundary condition study 29 consumes.
  measure:
    kind: observable
    detail: presence + typing of every field in the 27→29 transfer bundle
  pass_if:
    op: threshold
    detail: bundle complete and typed (satisfies 27→29 handoff validator)
  requires_simulation: 'yes'
- name: dic-crossover-sweep
  classification: primary
  description: >-
    A dense fluid_dic sweep across the PHREEQC SI=0 crossover characterizes the supply-vs-throttle two-regime
    behavior and whether any operating point sustains flux AND exercises throttling with the pore open (the calibration
    that resolves needs_calibration).
  measure:
    kind: observable
    detail: H2 flux / precipitation / accessibility / porosity vs fluid_dic across SI=0
    ledger closure: null
  pass_if:
    op: threshold
    detail: >-
      the crossover is characterized with the ledger closing at every point (window_exists resolved either way)
  requires_simulation: 'yes'
findings:
- id: og27-dic-crossover-bounded-window
  evidence_basis: predicted
  evidence_basis_note: "The sharp two-regime DIC cliff is a real-PHREEQC model finding."
  kind: computational
  status: novel
  statement: >-
    The interface's supply↔throttle behavior is a sharp two-regime cliff, not a gradual depletion: across a dense
    fluid_dic sweep (2–20 mM) real PHREEQC carbonate saturation crosses SI=0 at ~3.2 mM, and the interface either
    SUPPLIES (undersaturated, SI<0: H2 flux 2.75e-4 → 3.55e-5 from 2.0 → 3.0 mM, no precipitation, pore open at
    porosity 0.96–0.97) OR THROTTLES-AND-CHOKES (supersaturated, SI≥+0.7: precipitation 0.23–0.29 and catalytic-accessibility
    drop ~0.12, but H2 flux crashes four orders to ~1e-8 and porosity collapses to 0) — never both. No fluid_dic
    sustains flux AND exercises throttling with the pore open (window_exists=False), so the self-limiting carbonate
    chemistry forces the vent operating point into the undersaturated regime. The free-energy/mass/charge ledger
    closes at every sweep point.
  evidence:
    from_test: dic-crossover-sweep
  expected:
    cites: []
    uncitable: true
- id: og27-sustained-reactive-flux
  kind: computational
  status: planned
  statement: >-
    Over transport timescales the interface delivers H2 and inorganic-carbon fluxes and a maintained pH/redox
    gradient at or above the levels used by published vent-reactor and H2-dependent-metabolism work; the study
    reports the full time series and the onset of decay, not a single terminal value.
  evidence:
    from_test: sustained-reactive-flux-over-timescales
  expected:
    cites:
    - herschy2014originreactor
    - preiner2020hydrogen
- id: og27-mineral-evolution-throttles-supply
  kind: computational
  status: planned
  statement: >-
    Precipitation and surface passivation reduce reactive surface and throttle catalytic supply on the mineral-evolution
    timescale — the interface is depleting, and the study quantifies the crossover time at which delivery drops
    below the downstream-required threshold.
  evidence:
    from_test: mineral-evolution-supply-decay
  expected:
    cites:
    - varma2018native
    - naturecomms2024ironsulfide
- id: og27-electrochemical-driving-force
  kind: computational
  status: planned
  statement: >-
    The cross-interface electrical driving force is non-trivial and of the sign/scale needed to drive CO2 reduction,
    verified independently by a FEniCSx Nernst–Planck solve against the FiPy transport result.
  evidence:
    from_test: electrochemical-driving-force-verified
- id: og27-coupled-conservation-ledger
  kind: computational
  status: planned
  statement: >-
    Mass, charge and energy close across the coupled PHREEQC+FiPy+Reaktoro solve to tolerance with no untracked
    feeds.
  evidence:
    from_test: coupled-conservation
- id: og27-handoff-bundle-to-29
  kind: methodological
  status: planned
  statement: >-
    The study emits the full 27→29 transfer bundle — H2 + inorganic-carbon flux, pH, T, ionic activities, catalyst
    (mineral-surface) state and time-dependent feeds — as the typed boundary condition study 29 consumes.
  evidence:
    from_test: handoff-27-to-29-complete
