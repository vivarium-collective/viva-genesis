investigation: origins-of-life-vent
created: '2026-10-18'
gate_status: passed
verdict: qualified
primary_limitation: "Reduced-carbon chemistry is delivered only within a narrow two-regime DIC window - under full redox equilibrium DIC is drawn down before free H2 appears; the DIC-cliff is the one realized finding, the rest of the interface budget still planned."
key_assumptions:
- "The interface is solved under full redox equilibrium (real PHREEQC)"
- "The usable regime is a sharp two-regime DIC crossover (2-20 mM)"
- "The study emits the 27->29 transfer bundle as a typed boundary condition"
evidence_tier: mechanistic_prediction
program: consolidated
title: 'The Mineral Interface: Does It Sustain Flux Within a DIC Window?'
concept: >-
  The evolving mineral-water interface: whether a coupled geochemical interface sustains its H2 / inorganic-carbon
  flux and a maintained pH/redox gradient as the minerals evolve — and where it throttles. Builds on the calibrated
  vent states of og-vent-environment (1A).
gate_reason: >-
  Evolving-interface half of the former og-vent-environment (split from the calibrated-states half). Canonical
  arm og-27. HONEST STATUS: qualified on the one REALIZED result, the bounded two-regime DIC window (og27-dic-crossover-bounded-window;
  the dic-crossover-sweep primary passes, window_exists=False). Its other five og-27 findings (sustained reactive
  flux, mineral-evolution supply decay, electrochemical driving force, coupled conservation ledger, handoff-to-29)
  remain status:planned — not yet realized. Carries plan_id 27 and the numeric refs to study 27.
claim: >-
  The evolving mineral interface delivers reduced-carbon chemistry only within a bounded two-regime DIC window
  — under full redox equilibrium, DIC is drawn down before free H2 appears, so the usable window is narrow (og27-dic-crossover-bounded-window;
  dic-crossover-sweep passes). Qualified: this DIC-cliff is the realized result; sustained-flux, mineral-evolution
  supply decay and the coupled ledger over timescales are scaffolded (planned), not yet run.
question: >-
  Does the evolving mineral-water interface sustain its H2 / inorganic-carbon flux and pH/redox gradient as minerals
  evolve, and where does the DIC window bound it?
hypothesis: >-
  The coupled interface maintains a usable reduced-carbon feed only inside a bounded DIC window, with a sharp
  two-regime crossover where free H2 and dissolved inorganic carbon trade off.
experiment: >-
  Sweep the coupled geochemical reaction interface (og-27) across the DIC crossover to bound the window (realized);
  the sustained-flux / mineral-evolution / coupled-ledger tests over timescales are specified but PLANNED, not
  yet run.
result: >-
  A bounded two-regime DIC window: under full redox equilibrium DIC is reduced before free H2 appears, so the
  usable reduced-carbon window is narrow (dic-crossover-sweep passes, window_exists=False). Qualified on this
  realized DIC-cliff; the remaining og-27 flux / mineral-evolution / ledger findings are planned.
plan_id: 27
