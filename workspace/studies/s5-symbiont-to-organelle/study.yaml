schema_version: 4
name: s5-symbiont-to-organelle
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S5 — From symbiont to organelle: when does integration become heritable?'
phase: Design
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: inheritance-evolution
tags: [symbiosis, inheritance, population-genetics, gene-loss, individuality]
concept: >-
  Inheritance and evolutionary individuality made operational as fidelity of symbiont partitioning,
  vertical transmission, and host-symbiont fitness alignment. An evolutionary/population model coupled
  to multi-generation agent-based host/symbiont division, gene-function exchange, and stochastic
  partitioning.
question: >-
  Which routes to gene loss, transfer, and protein import lead to stable inheritance and irreversible
  dependence? Distinguish mere within-host survival from vertical transmission over many generations,
  gene-function rescue, and sustained fitness alignment.
hypothesis: >-
  Stable heritable integration requires high-fidelity vertical transmission AND host-symbiont fitness
  alignment together; gene loss becomes irreversible (partner-removal lethal) only after transmission
  fidelity crosses a threshold. Within-host survival alone does not produce a new evolutionary unit.
claim: >-
  Integration becomes heritable and coordinated — a new evolutionary individual emerges — only when
  vertical-transmission fidelity and host-symbiont fitness alignment both cross threshold, after which
  gene loss is irreversible and the partner becomes obligate; configurations with survival but low
  transmission fidelity do NOT cross into heritable individuality.
behavior_tests:
- name: heritable-integration-stable
  classification: primary
  description: Vertical-transmission fidelity stays high across many generations (stable inheritance).
  measure: {kind: derived_scalar, path: vertical_transmission_fidelity}
  pass_if:
    op: '>'
    value: 0.95
    provenance:
      kind: hypothesis
      note: >-
        Fraction of daughter hosts retaining a viable symbiont over >=50 generations; >0.95 = stable
        vertical inheritance. Threshold pre-registered; refine against population-genetics theory.
  cites: [vosseberg-nature-2024]
- name: dependence-irreversible-after-gene-loss
  classification: primary
  description: After modeled gene loss, partner removal becomes lethal (obligate dependence).
  measure: {kind: derived_scalar, path: partner_removal_lethality}
  pass_if: {op: '>', value: 0.9, provenance: {kind: hypothesis, note: Rescue/removal experiment post gene-loss.}}
acceptance_criteria:
- behavior: heritable-integration-stable
literature_anchors:
- expectation: FECA-LECA transition frames where a new eukaryotic individual emerges.
  model_observable: vertical_transmission_fidelity
  source: Vosseberg et al. 2024, Nature
  cites: [vosseberg-nature-2024]
  status_in_workspace: proposed
parent_studies:
- {study: s4-compartmental-energetic-coupling, relation: builds-on}
# MODEL TO BUILD (the gap): a coupled population-genetics + agent-based inheritance composite does not exist.
baseline:
- name: baseline
  composite: viva_genesis.composites.symbiosis.symbiont_inheritance_abm
  params: {generations: 50, partition_noise: TBD, gene_loss_rate: TBD, selection_strength: TBD}
  note: >-
    Composite NOT yet built. Requires: a multi-generation agent-based host/symbiont division process
    with stochastic partitioning, a gene-loss / rescue process, and a population-genetics selection
    layer; a within-host-survival-only control.
observables: [vertical_transmission_fidelity, partner_removal_lethality]
data_inputs:
- {name: EukProt v3, use: extant eukaryotic proteomes for ancestral comparison, url: 'https://doi.org/10.6084/m9.figshare.12417881.v3'}
