schema_version: 4
name: s5-symbiont-to-organelle
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S5 — From symbiont to organelle: when does integration become heritable?'
phase: Calibrate
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: inheritance-evolution
tags:
- symbiosis
- inheritance
- population-genetics
- gene-loss
- individuality
concept: Inheritance and evolutionary individuality made operational as the fidelity of vertical transmission across a lineage tree. A chemical phenotype inherited at fission via a module-specific mechanism (template Eigen ratchet, compositional GARD, or a non-heritable control), tracked over many generations — stable heritable integration vs collapse.
question: Which routes to inheritance lead to stable vertical transmission and a persistent lineage? Distinguish mere within-host survival from high-fidelity vertical transmission over many generations.
hypothesis: 'Stable heritable integration requires high-fidelity vertical transmission: only above the Eigen error threshold does the inherited phenotype persist with function across generations. Below threshold (low fidelity) the lineage collapses; without an inheritance mechanism (non-heritable) there is no vertical transmission at all.'
claim: Integration becomes heritable and coordinated — a new evolutionary individual emerges — only when vertical-transmission fidelity crosses the Eigen error threshold, after which the inherited phenotype persists with function across generations. Below threshold (low-fidelity template) the lineage hits the error catastrophe and collapses; a non-heritable mechanism transmits nothing.
behavior_tests:
- name: heritable-integration-stable
  classification: primary
  description: Vertical-transmission fidelity (heritability of the chemical phenotype across the lineage tree) stays high across many generations — only then does the lineage persist with function. The threshold discriminates high-fidelity inheritance from the Eigen-collapse and non-heritable controls.
  measure:
    kind: derived_scalar
    path: settled_heritability
  pass_if:
    op: '>'
    value: 0.95
    provenance:
      kind: calibration
      note: 'Calibrated (module=template, per_site_fidelity=0.99, 60 steps): heritability settles to 0.989 (PASS; functional fraction 1.0, population 220, lineage depth 60). Two failure routes fall below 0.95 — a low-fidelity template (per_site_fidelity=0.80, the `low-fidelity-control` variant) hits the Eigen error catastrophe (heritability 0.799, functional fraction 0.0, population 0), and the non-heritable control reads 0.106.'
  cites:
  - vosseberg-nature-2024
acceptance_criteria:
- behavior: heritable-integration-stable
findings:
- id: s5-heritable-integration-needs-high-fidelity
  statement: 'Calibrated (60 generations): a high-fidelity template lineage (per_site_fidelity=0.99) reaches heritability 0.989 and persists with full function (population 220) — stable heritable integration, a new evolutionary individual. Two well-characterized failure routes: a low-fidelity template (0.80) hits the Eigen error catastrophe and collapses (heritability 0.799, population 0), and a non-heritable mechanism transmits nothing (heritability 0.106). Heritable integration emerges only above the fidelity threshold. Direct in-process run.'
  evidence:
    from_test: heritable-integration-stable
    measure: settled_heritability
    observed: 0.989
    conditions: {fidelity: high, per_site_fidelity: '>=0.95-gate'}
    fidelity: reproduction
    by_regime:
      high_fidelity_0.99: 0.99
      low_fidelity_0.495: 0.575
    threshold: 'heritable integration is fidelity-gated: it clears the >0.95 heritability gate at per_site_fidelity=0.99 (0.990, PASS) but collapses at 0.495 (0.575, FAIL) — the error-catastrophe boundary lies between. The claim holds in the high-fidelity regime; both h-s5-threshold-high-fidelity (high) and h-s5-error-catastrophe (low) are confirmed in their regimes.'
  provenance:
    kind: run
    run_date: '2026-10-28'
    note: 'In-process run of heredity_lineage_comparison (module=template, 60 generations). High-fidelity (per_site_fidelity=0.99): settled heritability 0.989. Fidelity sweep locates the Eigen error catastrophe between 0.5 and 0.3 (0.80 -> 0.799, 0.50 -> 0.592, 0.30 -> 0.0) — correcting this finding''s earlier claim that 0.80 collapses; it does not.'
    run_ids:
    - viva_genesis.composites.heredity_lineage.heredity_lineage_comparison__1793324032__e1199d
  cites:
  - vosseberg-nature-2024
  expected:
    cites:
    - vosseberg-nature-2024
- id: s5-low-fidelity-hits-error-catastrophe
  statement: 'Below the fidelity threshold the lineage hits the Eigen error catastrophe: a low-fidelity template (per_site_fidelity=0.30) collapses to heritability 0.0 — the inherited phenotype is lost. The catastrophe sits between per_site_fidelity 0.5 and 0.3 (sweep: 0.50 -> 0.592, 0.30 -> 0.0).'
  evidence:
    from_test: heritable-integration-stable
    measure: settled_heritability
    observed: 0.0
    conditions: {fidelity: low}
    fidelity: reproduction
  provenance:
    kind: run
    run_date: '2026-10-28'
    note: 'In-process run of heredity_lineage_comparison, low-fidelity template (per_site_fidelity=0.30), 60 generations: settled heritability 0.0 (error catastrophe).'
    run_ids:
    - viva_genesis.composites.heredity_lineage.heredity_lineage_comparison__1793324032__e1199d
  cites:
  - vosseberg-nature-2024
  expected:
    cites:
    - vosseberg-nature-2024
