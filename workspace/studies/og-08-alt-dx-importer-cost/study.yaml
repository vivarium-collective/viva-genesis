schema_version: 4
name: og-08-alt-dx-importer-cost
title: Why is the importer a net cost, and which subset conditions permit persistence?
status: planned
design_status: drafted
simulation_status: not_run
study_type: diagnostic
proposed: true
seeded_from:
  study: og-08-alt-robust-innovation-set
question: >-
  og-08-alt's gate failed: the {pump, importer, heredity} set is not jointly sufficient — no subset
  persists into a 1% ocean, only {pump, heredity} into a 10% one (2 of 24 structures), and the importer
  is a net cost under a leaky membrane. Why is the importer a net cost — is the leak flux dominating its
  uptake across the sampled structures, and what membrane-tightness / structure conditions would flip it
  to a net benefit? Under {pump, heredity}, what distinguishes the 2 persisting structures from the 22
  that fail?
objective: >-
  Decompose the importer's per-structure energy/mass ledger (uptake vs leak) across the innovation
  lattice; sweep membrane permeability to locate any tightness at which the importer becomes net
  beneficial; characterise what the 2 persisting {pump, heredity} structures share that the other 22
  lack.
baseline:
- name: Integrated autonomy world (og-08-alt canonical structure)
  composite: viva_genesis.composites.integrated_autonomy.integrated_autonomy_world
  params: {}
proposed_acceptance_criteria:
- The importer's net cost is explained by a quantified uptake-vs-leak balance, with the membrane
  tightness (if any) at which it flips to net benefit reported, or shown not to exist in range.
- The feature separating the 2 persisting {pump, heredity} structures from the 22 failing ones is
  identified, or the persistence is shown to be structure-incidental with the supporting evidence.
