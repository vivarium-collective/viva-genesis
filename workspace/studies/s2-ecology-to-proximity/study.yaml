schema_version: 4
name: s2-ecology-to-proximity
investigation: eukaryogenesis
created: '2026-10-27'
title: 'S2 — Ecology to proximity: when does cross-feeding select for persistent contact?'
phase: Design
status: planned
design_status: drafted
simulation_status: not_run
evaluation_status: not_evaluated
gate_status: not_started
topic: spatial-ecology
tags: [symbiosis, reaction-diffusion, agents, proximity, selection]
concept: >-
  Physical association made operational as encounter rate, adhesion lifetime, diffusion length, and
  spatial crowding. Two metabolic agents (the S1 pair) embedded in a reaction-diffusion environment;
  vary diffusion, flow, adhesion, crowding, and partner density.
question: >-
  When do cross-feeding benefits select for persistent proximity rather than independent
  coexistence? Does the predicted selection for proximity disappear under high diffusion / well-mixed
  conditions?
hypothesis: >-
  Below a critical diffusion length the cross-feeding fitness advantage is distance-dependent and
  selects for sustained contact; under well-mixed (high-diffusion) conditions the proximity
  advantage collapses, so selection for contact is a spatial-structure effect, not a given.
claim: >-
  Selection may favor sustained contact: in spatially structured (finite-diffusion) environments the
  S1 cross-feeding advantage is distance-dependent and favors persistent proximity, creating a
  precondition for intimate symbiosis — but the advantage vanishes under high diffusion / well-mixed
  conditions, so proximity selection is contingent on spatial structure.
behavior_tests:
- name: proximity-selected-under-finite-diffusion
  classification: primary
  description: Fitness advantage increases as inter-partner separation decreases (finite diffusion).
  measure: {kind: derived_scalar, path: proximity_fitness_advantage}
  pass_if:
    op: '>'
    value: 0.1
    provenance:
      kind: hypothesis
      note: >-
        Slope of fitness vs -separation (normalized); >0.1 = a measurable distance-dependent
        advantage. Calibrate against S2 parameter priors from Radler-2026 protrusion length scales.
  cites: [radler-nature-2026]
- name: advantage-vanishes-well-mixed
  classification: primary
  description: The proximity advantage collapses under high diffusion (well-mixed control).
  measure: {kind: derived_scalar, path: proximity_fitness_advantage}
  pass_if: {op: approx, value: 0.0, tol: 0.03, provenance: {kind: control, note: High-diffusion well-mixed null.}}
acceptance_criteria:
- behavior: proximity-selected-under-finite-diffusion
literature_anchors:
- expectation: Asgard protrusions set the length/time scales of transient contact.
  model_observable: proximity_fitness_advantage
  source: Radler et al. 2026, Nature
  cites: [radler-nature-2026]
  status_in_workspace: proposed
parent_studies:
- {study: s1-metabolic-partnership, relation: builds-on}
# MODEL TO BUILD (the gap): a reaction-diffusion two-agent cross-feeding composite does not exist.
baseline:
- name: baseline
  composite: viva_genesis.composites.symbiosis.reaction_diffusion_cross_feeding
  params: {diffusion_length_um: TBD, adhesion_lifetime_s: TBD, partner_density: TBD, flow: 0.0}
  note: >-
    Composite NOT yet built. Requires: a reaction-diffusion PDE environment (FiPy-class), two
    metabolic agents reusing the calibrated S1 exchange process, and a spatial fitness readout.
observables: [proximity_fitness_advantage]
data_inputs:
- {name: Asgard live-cell microscopy (figshare/BioImage), use: protrusion length/time priors, url: 'https://doi.org/10.6084/m9.figshare.30676367'}
