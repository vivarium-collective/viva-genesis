schema_version: 4
name: mem-m5-functional-membrane-window
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: integrative
proposed: true
title: Functional membrane window (membrane-MD M5)
program: membrane-md
design_ref: workspace/references/membrane-md-studies-m1-m5-designs.md
honest_caveat: >-
  MD tests candidate prebiotic compositions; it does NOT by itself demonstrate endogenous
  membrane formation. The feasibility map scores measured compositions against a modeled
  internal network; it is a bound on which compositions could work, not a built protocell.
question: >-
  Which measured compositions sustain a modeled internal reaction network - where do assembly,
  stability, selective permeability and growth-requirement constraints jointly hold?
hypothesis: >-
  The feasible region is an intersection, likely narrow: the most stable composition is not
  the most functional, so the compositions that sustain the internal network are a bounded
  compromise - and the region may be empty (a meaningful mechanistic boundary).
experiment: >-
  Insert the M2-M4 measured properties into a coupled compartment-reaction model (reusing
  og-32's coupling and the A1 network), scan compositions, and rank them on joint feasibility.
primary_output: >-
  A ranked, uncertainty-aware membrane feasibility map - compositions scored on substrate
  access, product retention, network persistence and growth requirement, with the
  joint-feasible region (or its emptiness) identified.
first_cut_forthcoming: >-
  Reuses og-32's compartment-reaction coupling with the M2-M4 property library inserted; ties
  to og-37's budget-feasibility / independence framing. No hard parent dependency on the
  unscaffolded M-studies (consumes their property outputs when they exist).
extends: mem-m1 (assembly), mem-m2 (permeability), mem-m3 (stability), mem-m4 (growth) - all property outputs feed M5
baseline:
- name: Equal-feed unbounded (no-membrane) baseline
  planned: true
  params: {membrane: false}
- name: Prescribed-parameter baseline (membrane properties fixed, not measured)
  planned: true
  params: {membrane_properties: prescribed}
- name: Alternative compositions compared
  planned: true
  params: {composition: alternatives}
proposed_acceptance_criteria:
- The M2-M4 measured properties are inserted into the coupled compartment-reaction model at equal input fluxes.
- Compositions are ranked on substrate access / product retention / network persistence / growth requirement with uncertainty.
- Either a non-empty joint-feasible region is identified, or its emptiness is reported as a mechanistic boundary - not tuned to pass.
literature_anchors: [souza2021martini3, sojo2014bioenergetic, jordan2019promotion]
visualizations: []
