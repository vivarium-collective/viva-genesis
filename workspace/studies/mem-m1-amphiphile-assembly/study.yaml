schema_version: 4
name: mem-m1-amphiphile-assembly
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Design
status: planned
execution_status: proposed
design_status: drafted
simulation_status: not_run
evaluation_status: not_started
gate_status: not_started
study_type: exploratory
proposed: true
title: Amphiphile assembly & composition (membrane-MD M1)
program: membrane-md
design_ref: workspace/references/membrane-md-studies-m1-m5-designs.md
honest_caveat: >-
  MD tests candidate prebiotic compositions; it does NOT by itself demonstrate endogenous
  membrane formation. Whether the campaign's chemistry produces these compositions is the
  separate chemistry->composition question (see data_contract).
question: >-
  Which amphiphile structures and mixtures - fatty acids C8-C14, fatty alcohols,
  monoacylglycerols, and their mixtures - form micelles, bilayers or vesicles under
  vent-relevant conditions?
hypothesis: >-
  Assembly state is set by chain length, headgroup, mixture composition and the carboxylate
  protonation fraction; a feasible bilayer/vesicle window exists for long-enough chains and
  favorable mixtures, bounded below by the critical aggregation concentration and above by
  insolubility.
objective: >-
  Self-assemble a defined set of prebiotically-plausible compositions in coarse-grained MD and
  classify the assembly state, with unbiased self-assembly rather than a preassembled start.
primary_output: >-
  Per-composition assembly state (micelle / bilayer / vesicle / none), bilayer thickness, area
  per molecule, acyl-chain order parameter, and vesicle survival over the run.
first_cut_forthcoming: >-
  A lightweight fatty-acid vesicle-stability MD and a spontaneous self-assembly MD (planned,
  not yet scaffolded or named). Provisional seeds only - the explicit S->M first-cut links are
  hardened when the Martini vesicle thread is scaffolded. (No hard parent dependency recorded.)
data_contract: >-
  Consumes the chemistry->composition seam: AmphiphileChainExtensionProcess
  (viva_genesis/membranes/amphiphile_chain_extension.py) emits mean_chain_length,
  amphiphile_total, long_chain_fraction, aggregation_competent, degradation_loss - the input
  composition the MD side assembles.
baseline:
- name: Pure single-composition amphiphile (per chain length / headgroup)
  planned: true
  params: {composition: pure}
- name: Mixed-composition amphiphile (fatty acid + alcohol + monoacylglycerol)
  planned: true
  params: {composition: mixed}
- name: Preassembled-bilayer control (matched counts/conc/ionic; tests that assembly is spontaneous, not imposed)
  planned: true
  params: {start: preassembled}
proposed_acceptance_criteria:
- Assembly state is classified per composition across multiple seeds at matched counts / concentration / ionic strength.
- Spontaneous self-assembly is distinguished from a preassembled start (the assembly is not imposed).
- The accessible bilayer/vesicle window (which chains/mixtures assemble vs fail) is reported, including the negative bound, not tuned to pass.
literature_anchors: [souza2021martini3, marrink2003vesicle, janke2014oleic, jordan2019promotion]
visualizations: []
