      workspace/studies/og-vent-specificity/artifacts/og-adv-generic-nonequilibrium/vent_specificity_grid.json
    caption: >-
      Carbon-fixation gate margins depend jointly on H2 availability and catalyst activity;
      generic-control conditions fail the prespecified threshold in the evaluated range (the full range,
      including failures, is shown). Inferential limit: an all-negative generic control that removes H2,
      catalyst and pore geometry simultaneously is NOT evidence of vent specificity — it cannot attribute
      the failure to any one ingredient. Vent-specificity stays a bounded, hedged claim until a factorial
      ablation (H2 × Fe/Ni/S × pore-gradient, with effect sizes and interactions) is run.
