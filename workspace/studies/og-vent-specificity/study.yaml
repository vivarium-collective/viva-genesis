behavior_tests:
- name: gates-reject-generic
  gate_class: acceptance_criterion
  classification: primary
  description: >-
    Every vent-specific gate (og-01/02/03) rejects the feature-ablated control — it passes by being rejected.
  measure:
    kind: observable
    detail: run og-01/02/03 gates on the generic control; each measured value below its threshold
  pass_if:
    op: controls_absent
    detail: >-
      all five gates reject generic (net flux / formate / throughput / Péclet / enrichment below threshold)
  requires_simulation: 'yes'
  cites:
  - sutherland2017opinion
- name: vent-specificity-demonstrated
  gate_class: acceptance_criterion
  classification: primary
  description: The vent passes the same five gates the control fails — pass-where-control-fails.
  measure:
    kind: observable
    detail: vent vs generic on identical gates
  pass_if:
    op: arms_reported
    detail: vent passes 5/5 where the control fails 5/5
  requires_simulation: 'yes'
  cites:
  - sutherland2017opinion
findings:
- id: ogadv-gates-reject-generic
  kind: methodological
  status: confirms
  statement: >-
    Every vent-specific gate rejects the generic control. Running the real og-01/02/03 composites with
    no sustained H2, no Fe/Ni/S catalyst and no pore concentration, all five discriminating gates fall
    below threshold — net C-flux 4e-13 vs 1e-6 mol/s; formate ~0 vs 50 mM; protometabolic throughput 3e-13
    vs 1e-6 mol/s; accumulation Péclet 0.26 vs 18; enrichment 1.3 (generic) vs the vent clearing the ≥10⁶-fold
    gate (a reduced-model magnitude, solver-sensitive above Pe ≈ 13; see og-03) — the tightest by 1.8
    decades. The vent passes all five.
  evidence:
    from_test: gates-reject-generic
    observed: >-
      min rejection margin 1.84 decades (tightest gate: og-03 accumulation Péclet, generic 0.26 < 18);
      all 5 gates reject generic, vent passes all 5
    units: decades
  expected:
    cites:
    - sutherland2017opinion
  explanation: >-
    The vent features are PARAMETERS on the same real composites, so the control is a parameterization
    of the vent models, not a hand-tuned mock. No dissolved H2 → no CO2 reduction; no Fe/Ni/S interface
    → no abiotic carbon fixation; an open pore → no thermophoretic concentration.
- id: ogadv-vent-specificity
  provenance:
    run_ids:
    - viva_genesis.composites.carbon_fixation.hydrothermal_carbon_fixation__1791923061__6216cd
  kind: methodological
  status: novel
  statement: >-
    The gates are vent-specific detectors, not generic nonequilibrium detectors — the vent passes where
    the control fails on each of the five gates. A PASS therefore certifies the vent mechanism (sustained
    H2 + Fe/Ni/S catalysis + pore concentration), falsifying the "the gates just measure any driven chemistry"
    objection.
  evidence:
    from_test: vent-specificity-demonstrated
    observed: vent passes 5/5 gates; generic control fails 5/5 — pass-where-control-fails on every gate
    units: dimensionless
  explanation: >-
    Falsification exposure for the whole investigation — the headline claims would be hollow if a feature-ablated
    control cleared the same bars. It does not.
- id: ogadv-catalyst-control-integrity
  provenance:
    run_ids:
    - viva_genesis.composites.carbon_fixation.hydrothermal_carbon_fixation__1791923061__6216cd
  kind: methodological
  status: novel
  statement: >-
    Building the control exposed a latent control-integrity bug — catalyst_active=0 was silently swallowed
    by process-bigraph's is_empty(Float, 0.0) and refilled with the default, so the no-catalyst control
    (here and in og-01's cross-run gate) secretly ran with full catalyst. Clamping to 1e-6 honors the
    control; og-01's gates still pass (9/9 + both cross-run) with the now-truthful control.
  evidence:
    observed: >-
      no-catalyst formate dropped from ~0.014 mM (catalyst silently on) to ~2e-8 mM (honored); og-01 still
      PASS
    units: dimensionless
  explanation: >-
    Same gotcha as og-04's mix_fraction=0; a control parameter set to exactly 0.0 must be clamped to a
    negligible floor so the ablation is real.
