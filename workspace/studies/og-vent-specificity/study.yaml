title: 'Vent Specificity: Are the Gates Vent-Specific or Generic?'
concept: >-
  Specificity of the origin scenario: whether the campaign's discriminating gates detect the serpentinizing
  alkaline vent specifically, or would pass for any generic non-equilibrium drive — tested as a common
  CROSS-STUDY ABLATION MATRIX (the real og-01/02/03 composites run with each vent feature ablated: no
  sustained H2, no Fe/Ni/S interface, no pore concentration), plus a PLANNED competing-environments
  falsification. A null control: a REFUTED generic null is the desired, positive result. Important bound:
  the ablation matrix shows the gates reject a feature-stripped generic drive, but GENUINE vent specificity
  requires positive, realistic ALTERNATIVE-ENVIRONMENT models — which are planned, not yet run — so
  specificity is demonstrated against ablation, not yet against competing origin environments.
gate_reason: >-
  Null control (vent specificity). Consolidates the adversarial control (og-adv, canonical) and the planned
  competing-environments falsification (og-ev-competing-environments). Headline (og-adv, canonical): running
  the real og-01/02/03 composites with the vent's characteristic features ablated — no sustained H2, no
  Fe/Ni/S catalytic interface, no pore concentration — makes them fail all five discriminating gates (carbon
  flux, formate yield, protometabolic throughput, thermophoretic Peclet, enrichment), while the vent passes
  each. The campaign's gates are therefore vent-specific detectors, not generic non-equilibrium detectors:
  the generic-nonequilibrium null hypothesis is REFUTED (correctly rejected by every gate). This refutation
  is the desired result of an adversarial control — it certifies the gates discriminate the vent rather
  than any drive, and gate_status=passed because the control works as designed. Building it also exposed
  and fixed a latent control-integrity bug (catalyst_active=0 silently swallowed by process-bigraph is_empty).
  og-ev-competing-environments (planned) extends the falsification to competing origin environments.
claim: >-
  The campaign's discriminating gates are specific to the serpentinizing alkaline vent, not to generic
  non-equilibrium. Run with the vent's characteristic features ablated (no sustained H2, no Fe/Ni/S catalyst,
  no pore concentration), the same real og-01/02/03 composites fail all five gates (carbon flux, formate
  yield, protometabolic throughput, thermophoretic Peclet, enrichment) while the vent passes each — the
  generic-nonequilibrium null is refuted by every gate (og-adv, canonical; verdict=refuted = null correctly
  rejected, gate_status=passed = the control discriminates). A planned competing-environments study extends
  the falsification. Consolidated: the gates detect this vent, not any drive — specificity demonstrated
  via a refuted-by-design null. Every matched null and arm verdict kept.
question: >-
  Do the campaign's discriminating gates detect the serpentinizing alkaline vent specifically, or would
  any generic non-equilibrium drive pass them?
hypothesis: >-
  The gates are vent-specific — ablating the vent's characteristic features (sustained H2, Fe/Ni/S catalyst,
  pore concentration) makes the real composites fail them, so a generic non-equilibrium drive does not
  reproduce the vent chemistry.
experiment: >-
  Consolidate the vent-specificity control(s) into one concept with the adversarial ablation control (og-adv,
  canonical) and the planned competing-environments falsification as arms, preserving the refuted-by-design
  null verdict; report that the gates discriminate the vent (generic null refuted).
result: >-
  The campaign's gates are vent-specific — ablating the vent's features makes the real composites fail
  all five gates while the vent passes, so the generic-nonequilibrium null is refuted (correctly rejected)
  and specificity is demonstrated. A latent catalyst_active=0 control-integrity bug was found and fixed
  building the control.
