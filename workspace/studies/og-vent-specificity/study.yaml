consolidation_note: >-
  Consolidates og-adv-generic-nonequilibrium (canonical, the adversarial null control) and the planned
  og-ev-competing-environments into one concept. og-adv is an adversarial null control: its verdict=refuted
  means the GENERIC-nonequilibrium null hypothesis is correctly rejected (gate_status=passed = the gates
  discriminate the vent), which is the DESIRED result — specificity demonstrated, not a failure. Each
  fold-in is an explicit arm; artifacts + viz moved under artifacts|viz/<source-slug>/. No plan_id (the
  control carries no numbered plan slot and nothing references it numerically). Folding og-ev-competing-environments
  as a planned arm clears one planned-stub dashboard WARN.
