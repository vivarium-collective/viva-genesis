name: og-00-vent-reactor-baseline
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Evaluate
status: ran
design_status: approved
confidence: Accepted
gate_status: passed
title: Vent reactor baseline (Campaign 0)
question: Can a Lost City–like, serpentinization-fed vent–ocean interface reproduce observed fluid mixing, heat transport, mineral precipitation and H2/alkalinity delivery under field-constrained conditions — with no origin-of-life claim?
hypothesis: A 1D/2D porous-wall reactor with prescribed boundary fluxes reproduces published Lost City ranges (T, pH, H2, DIC) and qualitative precipitation trends while conserving mass and charge.
objective: Build a reduced vent–ocean reactor and validate it against Lost City field ranges to establish a geochemical/spatial testbed.
claim: >-
  A real PHREEQC + FiPy serpentinization reactor settles into the Lost City window
  (T 59 °C, pH 9.46) with sustained H2 and exact mass/charge/spatial-flux conservation.
result: >-
  All five acceptance criteria pass — outlet T 59.2 °C and pH 9.46 (both in-window),
  sustained H2 flux 2.2e-4 mol/s, and charge + flux conserved to machine epsilon.
findings:
- id: og00-temperature-ph-in-window
  kind: computational
  status: confirms
  statement: Outlet settles at 59.2 °C and pH 9.46 — both inside the Lost City field window (40–91 °C, 9.0–10.8).
  evidence:
    from_test: vent-temperature-in-lostcity-range
    observed: 'T=59.2 °C, pH=9.46'
    units: °C / pH
  expected:
    cites: [kelley2001offaxis, ludwig2006formation]
  explanation: Real PHREEQC peridotite serpentinization (Ca-OH endmember) + FiPy transport; pH is a genuine speciation result, not tuned.
  next_action: Sweep pyroxene_fraction + seawater-mixing dilution (og-00b).
  next_action_type: calibrate
- id: og00-h2-sustained
  kind: computational
  status: confirms
  statement: Serpentinization delivers a sustained H2 reducing-power flux (min 2.2e-4 mol/s over the back half of the run).
  evidence:
    from_test: h2-flux-sustained
    observed: 2.2e-4 mol/s
    units: mole/second
  expected:
    cites: [schwander2023serpentinization]
- id: og00-conservation
  kind: computational
  status: confirms
  statement: PHREEQC charge balance and FiPy FVM spatial-flux divergence are conserved to machine epsilon (<1e-6 and ~5e-16).
  evidence:
    from_test: charge-conserved
    observed: '|charge|=0, |flux residual|=5e-16'
- id: og00-peridotite-endmember
  kind: methodological
  status: novel
  statement: The Lost City pH endmember required reacting PERIDOTITE (olivine+pyroxene), not dunite — Ca released once Mg is consumed buffers the fluid to pH ~9.5.
  explanation: Olivine-only buffers at ~7.8 (brucite); adding diopside gives the Ca-OH endmember that reproduces field pH.
  next_action: Test sensitivity to the olivine/pyroxene ratio.
  next_action_type: ablate
report:
  title: Campaign 0 — vent reactor baseline
  verdict: PASS — reproduces the Lost City T/pH window with real geochemistry
  confidence: high
  main_insight: Real PHREEQC speciation + FiPy transport reproduce the field window and reveal that the high pH requires a peridotite (Ca-OH) endmember.
  conclusion: >-
    The coupled real model satisfies every acceptance criterion and the contract
    invariants; it is a validated geochemical/spatial testbed for the downstream
    carbon-fixation campaigns. No origin-of-life claim is made at this stage.
  caveat: The heat-partition fraction is calibrated to the observed vent temperature; all chemistry is emergent.
  key_metrics:
  - {label: Outlet T, value: 59.2 °C, status: pass}
  - {label: Outlet pH, value: '9.46', status: pass}
  - {label: H2 flux, value: 2.2e-4 mol/s, status: pass}
  - {label: Charge imbalance, value: '0', status: pass}
conclusion: >-
  The real PHREEQC + FiPy vent reactor reproduces the Lost City field window and
  conserves mass/charge/flux, establishing the geochemical testbed og-01 builds on.
conclusion_verdicts:
  biological_validation:
    result: PENDING
    basis: No origin-of-life claim at this stage — this is a geochemical/spatial testbed only.
  explanatory_gain:
    result: POSITIVE
    basis: Real speciation reproduces the field T/pH window AND reveals the peridotite Ca-OH endmember requirement — a mechanistic gain over the tuned box.
limitations:
- Heat-partition fraction calibrated to the observed vent temperature (chemistry otherwise emergent).
- Single well-mixed interface; full 2-D chimney geometry deferred.
discovery_implications:
  resolved_uncertainties:
  - The Lost City high-pH endmember is the peridotite Ca-OH buffer (not the olivine brucite buffer).
  remaining_uncertainties:
  - Sensitivity to the olivine/pyroxene ratio and to seawater-mixing dilution of the endmember.
  followup_study_proposals:
  - {study: og-00b, rationale: Sweep pyroxene_fraction and mixing dilution to bound the pH endmember.}
readouts:
- {name: temperature, store_path: vent.temperature, units: kelvin, description: Outlet interface temperature, status: available}
- {name: pH, store_path: vent.pH, units: dimensionless, description: Outlet pH, status: available}
- {name: H2_flux, store_path: rates.H2_flux, units: mole/second, description: Serpentinization H2 source flux, status: available}
- {name: charge_imbalance, store_path: diagnostics.charge_imbalance, units: eq/kgw, description: PHREEQC charge imbalance, status: available}
- {name: flux_divergence_residual, store_path: diagnostics.flux_divergence_residual, units: dimensionless, description: FiPy FVM conservation residual, status: available}
proposed_mechanisms:
- 'A: serpentinization as boundary flux'
- 'B: flow/mixing/precipitation, evolving porosity'
proposed_models_methods:
- PHREEQC or Reaktoro (speciation + mineral kinetics)
- FiPy finite-volume advection–diffusion–reaction
- prescribed vent source term
implemented_methods:
- 'Module A — REAL PHREEQC: genuine USGS IPhreeqc (via phreeqpython + vendored llnl.dat) reacting PERIDOTITE — olivine (forsterite+fayalite) + diopside pyroxene — with the serpentinite assemblage (chrysotile + brucite + magnetite + tremolite + diopside) each step. Dissolved H2, pH, pe, alkalinity and charge balance are emergent speciation outputs. The pyroxene-sourced Ca, once Mg is consumed into serpentine/brucite, gives the real Lost City Ca-OH-rich high-pH (~9.2-9.5) endmember — not a tuned value.'
- 'Module B — REAL FiPy: genuine finite-volume 1-D advection–diffusion–reaction column (TransientTerm == DiffusionTerm − PowerLawConvectionTerm, scipy direct-LU solve, zero-gradient advective outflow BC) transporting the serpentinization source across the vent–ocean interface.'
- 'Partial-equilibrium coupling: a flow/temperature kinetic driver sets the olivine reaction extent feeding the equilibrium speciation (standard reactive-transport practice). The only field-calibrated knob is the heat-partition fraction (tuned to the observed 40–91 C vent temperature); all chemistry is emergent.'
- 'Conservation: PHREEQC conserves elements + charge by construction; FiPy''s FVM conserves flux to the linear-solver tolerance (~machine epsilon) — directly satisfying the mass_balance / charge_neutrality / spatial_flux_conservation contract invariants.'
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pressure:
        _type: float
        _units: pascal
        _min: 100000.0
        _max: 50000000.0
      flow_velocity:
        _type: float
        _units: meter/second
        _min: 0.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
      DIC:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      H2_flux:
        _type: float
        _units: mole/second
        _min: 0.0
      alkalinity_flux:
        _type: float
        _units: mole/second
      heat_flux:
        _type: float
        _units: watt
      porosity:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: spatial_flux_conservation
    expr: divergence(flux) == source_minus_sink
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built for this study must declare a ProcessContract matching this face (audited via the workbench §Contract panel).
behavior_tests:
# Machine-gradeable readouts: measure.kind=derived + measure.path names a
# workspace derived-scalar (viva_genesis/evaluators.py) computed from the run's
# persisted parquet store; pass_if is a closed op the study_evaluator grades to
# PASS/FAIL automatically on run completion (Tests tab goes green, no agent).
- name: vent-temperature-in-lostcity-range
  classification: primary
  description: Settled outlet temperature sits in the Lost City envelope (40-91 C).
  measure:
    kind: derived
    path: settled_temperature_c
    detail: last-quartile mean outlet temperature, degrees C
  pass_if:
    op: range
    low: 40.0
    high: 91.0
    detail: settled T in [40, 91] C
  units: degC
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - ludwig2006formation
  gate_class: acceptance_criterion
- name: h2-flux-sustained
  classification: primary
  description: Real PHREEQC serpentinization delivers a sustained, non-collapsing H2 source.
  measure:
    kind: derived
    path: min_sustained_H2_flux
    detail: minimum H2 source flux over the back half of the run
  pass_if:
    op: '>'
    value: 1.0e-9
    detail: min sustained H2 flux > 0
  units: mole/second
  requires_simulation: 'yes'
  cites:
  - schwander2023serpentinization
  gate_class: acceptance_criterion
- name: charge-conserved
  classification: primary
  description: PHREEQC balances charge every step (charge_neutrality invariant).
  measure:
    kind: derived
    path: max_abs_charge_imbalance
    detail: worst-case |charge imbalance| over the run (eq/kgw)
  pass_if:
    op: <=
    value: 1.0e-6
    detail: '|charge imbalance| < 1e-6 throughout'
  units: eq/kgw
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: spatial-flux-conserved
  classification: primary
  description: FiPy finite-volume transport conserves flux (spatial_flux_conservation invariant).
  measure:
    kind: derived
    path: max_flux_divergence_residual
    detail: worst-case normalized FVM flux-divergence residual over the run
  pass_if:
    op: <=
    value: 1.0e-3
    detail: max |flux divergence residual| < 1e-3 (direct LU solve ~ machine eps)
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: first_principles
- name: vent-pH-in-lostcity-range
  classification: primary
  description: >-
    Settled outlet pH sits in the Lost City envelope (9.0-10.8). Met by reacting
    PERIDOTITE (olivine + diopside pyroxene), not dunite: once Mg is consumed into
    serpentine/brucite, the Ca released from pyroxene gives the real Ca-OH-rich,
    high-pH endmember (tremolite/diopside-buffered), reproducing field pH ~9.2-9.5
    at vent temperature — a genuine PHREEQC speciation result, not a tuned value.
  measure:
    kind: derived
    path: settled_pH
    detail: last-quartile mean outlet pH
  pass_if:
    op: range
    low: 9.0
    high: 10.8
    detail: settled pH in [9.0, 10.8]
  units: dimensionless
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - ludwig2006formation
  gate_class: acceptance_criterion
literature_anchors:
- expectation: Lost City ~40-91 C, pH ~9-10.8, >=30 ky activity
  model_observable: outlet T,pH; run duration
  source: Kelley 2001 / Fruh-Green 2003 / Ludwig 2006
  status_in_workspace: >-
    Met by the real coupled model: settled T ~59 C and pH ~9.5 are both in the
    Lost City window, H2 reducing power is sustained, and mass/charge/flux
    conservation hold. pH was closed by reacting peridotite (olivine + pyroxene)
    so the Ca-OH endmember buffers the fluid to field pH — a real PHREEQC result.
  cites:
  - kelley2001offaxis
  - fruhgreen2003thirtythousand
  - ludwig2006formation
baseline:
- name: Vent reactor baseline (Campaign 0)
  composite: viva_genesis.composites.vent_reactor.serpentinizing_vent_reactor
  params: {}
key_assumptions:
- Hadean ocean chemistry parameterized separately — never reuse modern seawater as the ancient prior.
- 'Partial equilibrium: a prescribed olivine dissolution rate (flow/T-driven) feeds PHREEQC equilibrium speciation each step — fast aqueous/mineral equilibrium vs a rate-limited rock reaction, standard for reactive-transport.'
- 'The heat-partition fraction (fraction of serpentinization enthalpy retained in the fluid parcel) is CALIBRATED to the observed 40-91 C vent temperature; the chemistry (H2, pH, pe, charge) is emergent from PHREEQC, not tuned.'
expert_questions:
- Reproduce Lost City (modern analog) and parameterize Hadean ocean separately, or attempt a Hadean-only baseline first?
- 'pH endmember (RESOLVED): reacting peridotite (olivine + diopside pyroxene) with the serpentinite+tremolite assemblage drives the Mg-depleted Ca-OH fluid to field pH ~9.2-9.5 at vent T. Open follow-up: sensitivity to pyroxene_fraction (ol/px ratio) and to seawater-mixing dilution of the endmember.'
