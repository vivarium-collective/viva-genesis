schema_version: 4
name: og-00-vent-reactor-baseline
investigation: origins-of-life-vent
created: '2026-10-11'
phase: Design
status: planned
design_status: drafted
confidence: Planned
title: Vent reactor baseline (Campaign 0)
question: Can a Lost City–like, serpentinization-fed vent–ocean interface reproduce observed fluid mixing,
  heat transport, mineral precipitation and H2/alkalinity delivery under field-constrained conditions
  — with no origin-of-life claim?
hypothesis: A 1D/2D porous-wall reactor with prescribed boundary fluxes reproduces published Lost City
  ranges (T, pH, H2, DIC) and qualitative precipitation trends while conserving mass and charge.
objective: Build a reduced vent–ocean reactor and validate it against Lost City field ranges to establish
  a geochemical/spatial testbed.
proposed_mechanisms:
- 'A: serpentinization as boundary flux'
- 'B: flow/mixing/precipitation, evolving porosity'
proposed_models_methods:
- PHREEQC or Reaktoro (speciation + mineral kinetics)
- FiPy finite-volume advection–diffusion–reaction
- prescribed vent source term
contract:
  face:
    inputs:
      temperature:
        _type: float
        _units: kelvin
        _min: 273.0
        _max: 673.0
      pressure:
        _type: float
        _units: pascal
        _min: 100000.0
        _max: 50000000.0
      flow_velocity:
        _type: float
        _units: meter/second
        _min: 0.0
      H2:
        _type: float
        _units: molar
        _min: 0.0
      DIC:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      H2_flux:
        _type: float
        _units: mole/second
        _min: 0.0
      alkalinity_flux:
        _type: float
        _units: mole/second
      heat_flux:
        _type: float
        _units: watt
      porosity:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
  conditions:
  - kind: invariant
    name: mass_balance
    expr: abs(residual_C)+abs(residual_H)+abs(residual_O) < tol
  - kind: invariant
    name: charge_neutrality
    expr: abs(net_charge) < tol
  - kind: invariant
    name: spatial_flux_conservation
    expr: divergence(flux) == source_minus_sink
  - kind: invariant
    name: energy_directionality
    expr: free_energy_flux_logged == true
  note: bigraph-schema typed ports (_type/_units/bounds) + conservation predicates; the composite built
    for this study must declare a ProcessContract matching this face (audited via the workbench §Contract
    panel).
behavior_tests:
- name: vent-T-pH-in-lostcity-range
  classification: primary
  description: Outlet fluid sits in the Lost City envelope.
  measure:
    kind: observable
    detail: outlet T and pH
  pass_if:
    op: threshold
    detail: T in [40,91] C and pH in [9.0,10.8]
  requires_simulation: 'yes'
  cites:
  - kelley2001offaxis
  - ludwig2006formation
- name: h2-alkalinity-sustained
  classification: primary
  description: Serpentinization delivers steady reducing power.
  measure:
    kind: observable
    detail: steady H2 + alkalinity flux
  pass_if:
    op: threshold
    detail: flux > 0 and stable over residence time
  requires_simulation: 'yes'
  cites:
  - schwander2023serpentinization
- name: mass-charge-conserved
  classification: diagnostic
  description: Conservation holds; a perturbed flux must break it (negative control).
  measure:
    kind: observable
    detail: element residuals for C,H,O,Fe,S and net charge
  pass_if:
    op: threshold
    detail: '|residual| < tolerance; perturbation breaks it'
  requires_simulation: 'yes'
literature_anchors:
- expectation: Lost City ~40-91 C, pH ~9-10.8, >=30 ky activity
  model_observable: outlet T,pH; run duration
  source: Kelley 2001 / Fruh-Green 2003 / Ludwig 2006
  status_in_workspace: Not yet measurable — module processes not built
  cites:
  - kelley2001offaxis
  - fruhgreen2003thirtythousand
  - ludwig2006formation
baseline:
- name: Vent reactor baseline (Campaign 0)
  composite: viva_genesis.composites.og_00_vent_reactor_baseline
  params: {}
  planned: true
parent_studies: []
key_assumptions:
- Hadean ocean chemistry parameterized separately — never reuse modern seawater as the ancient prior.
expert_questions:
- Reproduce Lost City (modern analog) and parameterize Hadean ocean separately, or attempt a Hadean-only
  baseline first?
kind: baseline
