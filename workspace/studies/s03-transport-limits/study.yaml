    and metabolic regimes. Decision criterion: predict size/viability changes across
    experimental regimes.'
acceptance_criteria: []
findings:
- id: s03-transport-limits-first-cycle
  statement: 'Oxygen/transport BOUNDS the advantage to an optimal intermediate size:
    small groups (size=3.7) keep a positive advantage (adv=+0.12) while large groups
    (size=17.0) lose it (adv=-0.21). Size/viability tracks the transport regime (supports
    C3; the advantage is not monotonic in size).'
  status: confirms
  evidence:
    observed: 16.9999
    from_test: size-viability-tracks-transport
    from_run: viva_genesis.composites.cell_collective.cell_collective__1793567204__cfeb77
  inferential_scope: 'Reduced mean-field cell-collective model (cell_collective):
    unicell/group split under adhesion + size-dependent predation/settling + oxygen-limited
    growth. First-fidelity; not an explicit spatial agent/mechanics simulation and
    not a historical estimate.'
