key_assumptions:
- 32 individuals of 1 fL at carrying capacity, 16 heritable molecules per founder
  (cap 48), bulk mass 20 doubling to divide; bulk and heritable growth both scale
  with (1 + sigma phi), sigma = 3; dilution uniform at capacity.
- 'One common genotype-to-function landscape: a sigmoid in the match fraction (half
  0.8, width 0.04), so the master and its near neighbours are functional and the tail
  is not.'
- 'Matched budgets: every class draws integer molecules from the same chemostat-fed
  pools (1e-4 M set-points, relaxation 0.5 per tick) and integer quanta (30 kJ/mol)
  from the same store (8e-16 J per tick, capped).'
- Information = parent-offspring MI of the phenotype at a 0.05 resolution, Miller-Madow
  corrected, net of a 20-permutation null; converged when the prefix ladder agrees
  within 0.05 bit / 15 % and the bootstrap SE <= 0.05 bit.
- 'Attachment: precursor ratio, energy ratio and Q / (1/sigma) all >= 1, latched;
  before attachment daughters re-form heritable material de novo at the class''s price.'
expert_questions:
- Which attachment thresholds (copies per individual, energy margin) are defensible,
  and should the fidelity floor be Eigen's 1/sigma or 1/(1+sigma)?
- Is there any measured defect-replication fidelity for mineral surface patterns,
  or should the mineral class be reported as a bound only?
- Should the information readout be sequence-level (template identity) rather than
  phenotype-level, and should per-seed convergence be a reported fraction rather than
  a strict all-seeds rule?
