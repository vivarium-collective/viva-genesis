- expectation: A template of length L with per-site fidelity q keeps its information
    only above the error threshold q^L > 1/sigma
  model_observable: fidelity_transition.per_class.rna_like (attaches from, settled
    function)
  source: Eigen 1971
  status_in_workspace: Reproduced at the agent level with exact SSA — rna_like attaches
    and keeps function from q = 0.967 at L = 30, sigma = 3 (floor 0.964).
  cites:
