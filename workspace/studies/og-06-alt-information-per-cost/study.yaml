schema_version: 4
name: og-06-alt-information-per-cost
investigation: origins-of-life-vent
created: '2026-10-15'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
confidence: Accepted
gate_status: passed
title: 'Competing Heredity: Which Inheritance Mechanism Transmits the Most Bits Per
  Joule, and When Is It Attached?'
question: Model Upgrade plan, Phase 7. og-06 compared inheritance mechanisms as modes
  of one mean-field process and concluded that heredity need not presume a long high-fidelity
  RNA template. If the six candidate mechanisms (compositional assemblies, autocatalytic-network
  attractors, templated peptides, RNA-like templates, a template-focused hybrid and
  mineral-surface defect patterns) are instead separate model classes on one heredity
  face, each simulated EXACTLY at low copy number (tens of molecules per protocell)
  under the same precursor pools and the same energy store, and attached to a lineage
  only when those budgets and the Eigen error threshold allow it — how many bits does
  each class actually transmit from parent to offspring, at what cost in joules and
  precursor molecules, and where does templated heredity take over?
hypothesis: Every attached class transmits parent-offspring information its unattached
  control (daughters re-formed de novo from the same budget) does not; the template
  classes carry the most bits per offspring but pay the most per bit and are attached
  only at the highest budgets and fidelities; the attractor classes (compositional,
  network) are cheap, attach at low budgets and carry few bits; a cheap, high-fidelity
  mineral pattern would dominate both axes if its copy error were as low as hypothesised;
  the transition to templated heredity is the point at which the Eigen floor admits
  the template.
objective: Build the heredity face (six classes carved out of og-06's LineageReplicatorProcess,
  each an exact Gillespie lineage drawing integer precursors and quanta from matched
  budgets), the HeredityAttachmentStep (precursor budget, energy budget, Eigen floor
  Q >= 1/sigma), the InformationLedgerProcess (heritable bits per joule and per precursor
  from a parent-offspring mutual-information estimator with a convergence check; exact
  energy-store audit) and the vg-data package inheritance_budgets; run the frontier
  (six classes x attached / control x 6 seeds), the attachment map (six classes x
  six matched budget scales) and the fidelity transition (four template-type classes
  x six fidelities) and grade the pre-registered gates.
claim: 'Priced under matched budgets at low copy number, heredity splits by currency:
  the RNA-like template transmits the most certified bits per offspring but needs
  30x the precursor and energy budget of the attractor classes and ribozyme-level
  fidelity (q >= 0.967) to be attached at all, while the cheap classes transmit a
  third of its bits at 10-1000x the bits per joule. og-06''s "heredity need not presume
  RNA" is therefore a class-substitution result about efficiency, not capacity; the
  only class that would dominate both axes — mineral-surface patterns — does so on
  a defect-copy error nobody has measured.'
findings:
- id: og06alt-ancestry-predicts-phenotype-per-class
  kind: computational
  status: novel
  statement: With heredity attached, parent and offspring phenotypes share information
    in every class — rna_like 1.46 +/- 0.10 bit, mineral_state 2.24 +/- 0.14, network
    0.53 +/- 0.06, hybrid 0.49 +/- 0.03, compositional 0.47 +/- 0.03, peptide 0.14
    +/- 0.22 (6 seeds; MI net of the permutation null, phenotype resolution 0.05)
    with realised heritability 0.45-1.0 — while every unattached control, whose daughters
    re-form their heritable material de novo from the same pool at the same price,
    transmits 0.00 bit with heritability < 0.01. Four classes (rna_like, network,
    compositional, hybrid) pass the strict pre-registered rule (MI converged on every
    seed, >= 0.1 bit, >= 0.05 bit above control); peptide fails because at q_p = 0.7
    its whole-copy fidelity 0.06 sits below the Eigen floor 1/sigma = 0.33 and its
    function is lost before the estimator can converge; mineral_state fails convergence
    on one seed (bootstrap SE 0.15 bit) because its function decays as layer-copy
    errors accumulate at the nominal budget.
  evidence:
    from_test: ancestry-predicts-phenotype
    observed: 4/6 classes pass; controls 0.00 bit in every class; rna_like 1.46 bit,
      h2 0.93
    units: bit
  explanation: 'The information is measured on the phenotype (the function the heritable
    state confers), binned at a 5 % resolution so variation selection cannot see is
    not counted, bias-corrected (Miller-Madow) and reported net of a 20-permutation
    null; the convergence check is a time-ordered prefix ladder plus a bootstrap SE.
    Artifact: artifacts/information_frontier.json (classes.*.attached / .control).'
  expected:
    cites:
    - eigen1971selforganization
    - miller1955note
    - kraskov2004estimating
- id: og06alt-information-per-cost-frontier
  kind: computational
  status: novel
  statement: 'Bits per joule span 3.8 decades across the six classes: mineral_state
    5.4e19 (0 quanta, 0.1 quanta-equivalent per growth unit), network 1.3e18 (1 amino
    acid + 1 quantum per molecule), compositional 4.3e17 (1 amphiphile, 0 quanta),
    rna_like 4.9e16 (30 nucleotides + 30 quanta per copy), hybrid 2.5e16, peptide
    9.0e15. Per offspring, rna_like spends 3.0e-17 J and 150 precursor molecules for
    1.46 bit; network 4.2e-19 J and 4 molecules for 0.53 bit. Among classes whose
    estimate converged on every seed the Pareto front of (bits up, energy down) is
    {network, rna_like}; mineral_state (2.24 bit at 4.1e-20 J) would dominate both
    axes if certified.'
  evidence:
    from_test: information-per-cost-frontier-resolved
    observed: span 3.8 decades in bits/J; Pareto {network, rna_like}; cheapest and
      richest = mineral_state (uncertified)
    units: bit/joule
  explanation: 'Costs are integer molecule and quantum counts drawn from the shared
    budgets by every copy event and converted with the package''s 30 kJ/mol quantum
    and precursor energy equivalents (hypothetical); the InformationLedgerProcess
    integrates them against births and audits the store exactly (residual <= 3.1e-14
    on 252 runs). Artifact: artifacts/information_frontier.json (frontier, ledger).'
  expected:
    cites:
    - buckel2013energy
    - szathmary2006origin
- id: og06alt-need-not-presume-rna-splits-by-currency
  kind: computational
  status: confirms
  statement: 'og-06''s "heredity need not presume RNA" survives as a class-substitution
    result, but only in one currency: among certified classes the best non-RNA class
    (network) carries 0.36x the RNA-like bits per offspring and 26x its bits per joule;
    compositional carries 0.32x and 9x. Templated heredity takes over from the organic
    attractor classes exactly where the Eigen floor admits it — rna_like at q >= 0.967
    (Q = q^30 = 0.37 > 1/sigma = 0.33) carries 1.45 bit against their 0.5; at q <=
    0.95 it is not attached and transmits nothing. The template never overtakes the
    mineral class within the swept range.'
  evidence:
    from_test: heredity-need-not-presume-rna
    observed: nonrna bits/J fraction 26 (network); nonrna bits fraction 0.36; rna_like
      overtakes organic classes from q = 0.967
    units: dimensionless
  explanation: 'og-06 graded persistence of function; this study grades transmitted
    bits against their price, so the two halves of og-06''s claim separate: the template
    is the richest organic carrier, the attractors are the cheapest. Artifact: artifacts/information_frontier.json
    (gates.nonrna_bits_fraction, gates.nonrna_bits_per_joule_fraction, fidelity_transition).'
  expected:
    cites:
    - segre2000compositional
    - vasas2010lack
    - johnston2001rna
- id: og06alt-attachment-is-conditional
  kind: computational
  status: novel
  statement: 'With the HeredityAttachmentStep deciding, compositional, network and
    mineral heredity attach from 3 % of the nominal matched budget (every feed and
    the power scaled together), hybrid from 30 %, rna_like only at the full budget
    (precursor ratio 0.74 even then, latched at the first full tick) and peptide at
    none (fidelity ratio 0.17): mean attached-fraction span low-to-high budget 1.0
    over the five attachable classes. The step''s budget thresholds (10 copies per
    individual, energy margin 1) are hypothetical and swept; its fidelity floor is
    Eigen''s Q >= 1/sigma. Two budget-driven reversals appear in the map: the mineral
    class''s function collapses as the budget rises (more layers grown per generation
    means more copy errors: 0.93 at 3 % to 0.15 at 100 %) and the network class''s
    information vanishes at 3x (every core saturates its niche, so there is no variation
    to transmit).'
  evidence:
    from_test: attachment-is-conditional
    observed: attachment span 1.0; attach-from budgets 0.03 / 0.03 / 0.03 / 0.3 /
      1.0 / never
    units: dimensionless
  explanation: 'FMP 2.5 attachment as a lineage-level flag: before it, daughters re-form
    heritable material de novo and pay for it; after it, copies are partitioned at
    fission. Artifact: artifacts/information_frontier.json (attachment_map).'
  expected:
    cites:
    - eigen1971selforganization
    - cairnssmith1982genetic
- id: og06alt-eigen-threshold-at-the-agent-level
  kind: computational
  status: confirms
  statement: 'The fidelity transition reproduces the error threshold at the agent
    level with exact stochastic dynamics: rna_like keeps function only from q = 0.967
    (settled mean function 0.22; 0.55 at q = 0.99) and is refused and non-functional
    at q <= 0.95; peptide needs q_p >= 0.90 over 8 sites; the 8-site hybrid template
    attaches from q = 0.90; the mineral pattern from p_m <= 0.005 per bit per layer
    (function 0.10 there, 0.71 at 0.001). The attachment step''s analytic floor and
    the simulated loss of function agree at every swept point.'
  evidence:
    from_test: templated-takeover-fidelity
    observed: rna_like attaches from q = 0.967; peptide from 0.90; hybrid from 0.90;
      mineral from p_m = 0.005
    units: dimensionless
  explanation: 'Each template''s own copy rate rises with its function (the master
    sequence copies sigma-fold faster), daughters inherit a random half of the parent''s
    molecules, and bulk growth carries the cell-level selection; the common sigmoid
    landscape makes a 1-2-error neighbour functional and the tail not. Artifact: artifacts/information_frontier.json
    (fidelity_transition).'
  expected:
    cites:
    - eigen1971selforganization
    - rajamani2010effect
- id: og06alt-provenance-audit
  kind: computational
  status: novel
  statement: 'The vg-data package inheritance_budgets carries 39 parameters: 1 measured
    (the R18 polymerase ribozyme''s 96.7 % per-site fidelity), 6 inferred, 8 extrapolated
    and 24 hypothetical, none unsourced; the mineral class''s defect-copy error —
    the number that makes it dominate the frontier — is hypothetical with no measured
    anchor, and the attachment thresholds are hypothetical and swept.'
  evidence:
    observed: audit counts measured 1 / calibrated 0 / inferred 6 / extrapolated 8
      / hypothetical 24; unsourced []
    units: dimensionless
  explanation: The honesty indicator; the frontier's headline ordering rests on the
    hypothetical precursor energy equivalents and the mineral copy error, which is
    why it is reported as a frontier under stated costs, not a ranking.
  expected:
    cites:
    - johnston2001rna
conclusion: Four of six heredity classes transmit converged parent-offspring information
  their controls do not; the frontier spans 3.8 decades in bits per joule; the RNA-like
  template is the richest certified carrier per offspring and the attractor classes
  the cheapest per joule; templated heredity attaches only at the full budget and
  q >= 0.967; the energy ledger closes on every run.
conclusion_verdicts:
  biological_validation:
    result: PARTIAL
    basis: Reproduces the Eigen error threshold at the agent level with exact stochastic
      dynamics and the measured ribozyme fidelity as the template's anchor; every
      other cost is hypothetical, so the frontier is a statement under declared costs.
  explanatory_gain:
    result: POSITIVE
    basis: Separates og-06's claim into a capacity half (RNA wins) and an efficiency
      half (attractors win), locates the templated transition at the Eigen floor and
      the full budget, and names the one number (mineral copy error) on which the
      frontier's ordering turns.
limitations:
- Information is parent-offspring mutual information on the phenotype at a 5 % resolution
  (<= 8 bins), bounded by the phenotype's entropy; sequence-level information is not
  measured, so capacity and realised bits are reported side by side.
- The strict per-class rule requires MI convergence on every seed; mineral_state converges
  on 5/6 and is reported as uncertified, not as failing to inherit.
- Costs rest on hypothetical precursor energy equivalents (3 / 1 / 2 / 0.1 quanta)
  and a 30 kJ/mol quantum; the mineral class's defect-copy error (0.005 per bit per
  layer) has no measured anchor.
- Attachment thresholds (10 copies, energy margin 1) are hypothetical; the map sweeps
  the budget, not the thresholds themselves, pending expert input.
- The lineage is 32 individuals at carrying capacity with uniform dilution; selection
  acts through growth only; the attachment flag is lineage-level, not a per-agent
  bigraph rewrite.
- Priors were not propagated (nominal point plus the budget and fidelity axes); peptide's
  estimate never converges at its nominal fidelity.
discovery_implications:
  resolved_uncertainties:
  - Every heredity class, attached, transmits information its de-novo control does
    not; the measurement is estimator-certified for four of six.
  - Templated heredity's attachment boundary coincides with the Eigen floor and the
    full budget; attractor heredity attaches at 3 % of it.
  remaining_uncertainties:
  - Where the expert places the attachment thresholds, and whether any measured defect-replication
    fidelity exists for mineral patterns.
  - How the frontier moves under the package priors (LHS over the 11 free parameters)
    and with sequence-level information.
  - Whether the classes, attached as a bigraph rewrite to Phase-5 agents, keep the
    same ordering under Phase-6 energy coupling.
  followup_study_proposals:
  - study: og-06-alt-information-per-cost-b
    rationale: Propagate the inheritance_budgets priors and add a sequence-level (template
      identity) information readout beside the phenotype MI; re-grade the Pareto front
      with per-seed convergence as a reported fraction rather than a strict all-seeds
      rule.
  - study: og-08-alt-robust-innovation-set
    rationale: Carry the attached heredity class into the Phase-9 autonomy ensemble
      as one of the inheritance structures the minimum innovation set is intersected
      over.
decisions_needed:
- question: 'Heredity attachment thresholds: which precursor budget (copies per individual),
    energy margin and fidelity floor are defensible for attaching heredity to a lineage?
    The build uses hypothetical values (10 copies, margin 1.0) plus the Eigen floor
    Q >= 1/sigma and sweeps the budget x fidelity space instead of asserting a point.'
  context: The attachment map shows the attractor classes attaching from 3 % of the
    nominal budget and the template only at 100 %; the thresholds move those boundaries.
    Expert input also decides whether the mineral class's defect-copy error (0.005,
    hypothetical) has any measured anchor — it is the number on which the frontier's
    ordering turns.
