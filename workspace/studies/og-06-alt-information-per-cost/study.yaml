proposed_mechanisms:
- 'J: heredity as six competing model classes under matched budgets, attached conditionally'
- Eigen error threshold as the attachment fidelity floor
proposed_models_methods:
- Exact Gillespie (direct method) lineages at low copy number, one per heredity class
- Conditional heredity attachment (FMP 2.5) on precursor / energy budgets and the
  Eigen floor
- Binned parent-offspring mutual information with Miller-Madow correction, permutation
  null and a prefix-ladder + bootstrap convergence check
- Information ledger (bits per joule / per precursor) with an exact energy-store audit
implemented_methods:
- 'viva_genesis.heredity.competing: CompetingLineage (exact SSA over 32 individuals
  with integer pools / quanta), six HeredityKinetics (rna_like, peptide, compositional,
  network, mineral_state, hybrid), six Process wrappers on the heredity face, BudgetFeedProcess,
  HeredityAttachmentStep.'
- 'viva_genesis.heredity.information: mutual_information_bits, permutation_null_bits,
  heritable_bits, mi_with_convergence, pareto_front; viva_genesis.ledger.InformationLedgerProcess;
  composites/competing_heredity with model_heredity as a class axis; viz_heredity
  (frontier + attachment map).'
- vg-data inheritance_budgets (39 parameters, full provenance); sims/compute_information_frontier.py
  (252 composite runs -> artifacts/information_frontier.json).
contract:
  face:
    inputs:
      attached:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      stored_work:
        _type: float
        _units: joule
        _min: 0.0
      nucleotide_precursor:
        _type: float
        _units: molar
        _min: 0.0
      amino_precursor:
        _type: float
        _units: molar
        _min: 0.0
      amphiphile:
        _type: float
        _units: molar
        _min: 0.0
      mineral_precursor:
        _type: float
        _units: molar
        _min: 0.0
    outputs:
      information_content:
        _type: float
        _units: bit
        _min: 0.0
      heritability:
        _type: float
        _units: dimensionless
      fidelity:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
      replication_energy:
        _type: float
        _units: joule
        _min: 0.0
      mi_converged:
        _type: float
        _units: dimensionless
        _min: 0.0
        _max: 1.0
  conditions:
  - kind: invariant
    name: energy_store_audit
    expr: ledger.energy_residual <= 1e-9
  - kind: invariant
    name: integer_budgets
    expr: pool molecules + consumed == initial + fed, exactly (integer counts)
  - kind: invariant
    name: certified_bits_need_convergence
    expr: ledger.heritable_bits == 0 unless info.mi_converged == 1
  - kind: invariant
    name: control_is_unattached
    expr: attachment = off reforms heritable material de novo from the same budget
      at the same price
  note: The heredity face (viva_genesis/models.py) is honoured by all six classes
    (assert_face); og-06's LineageReplicatorProcess is a real non-conformer (no budgets,
    no attachment); ports are canonical vg_* fields (schemas.PORT_TO_CANONICAL).
behavior_tests:
- name: information-ledger-closes
  classification: primary
  description: The InformationLedgerProcess's exact energy-store audit holds on the
    canonical run — |stored_work - (W0 + in - used)| / in within 1e-9 on every tick.
  measure:
    kind: derived
    path: energy_store_residual_max
    detail: worst-case energy-store residual over the run
  pass_if:
    op: <=
    value: 1.0e-09
    detail: energy audit at float round-off
  units: dimensionless
  requires_simulation: 'yes'
  gate_class: acceptance_criterion
  band_basis: machine_precision
- name: mi-estimator-converged
  gate_class: acceptance_criterion
  classification: primary
  description: The parent-offspring MI estimator converged on the canonical run (prefix
    ladder within 0.05 bit / 15 % and bootstrap SE <= 0.05 bit).
  measure:
    kind: derived
    path: mi_converged_final
    detail: info.mi_converged on the final tick
  pass_if:
    op: '>='
    value: 1.0
    detail: converged
  units: dimensionless
  requires_simulation: 'yes'
  band_basis: first_principles
  cites:
  - kraskov2004estimating
  - miller1955note
- name: information-ledger-certifies
  gate_class: regression_pin
  classification: diagnostic
  description: The ledger's own verdict on the final tick (energy residual within
    tolerance AND the convergence flag it read).
  measure:
    kind: derived
    path: information_ledger_ok_final
    detail: ledger.information_ledger_ok on the final tick
  pass_if:
    op: '>='
    value: 1.0
    detail: certified
  units: dimensionless
  requires_simulation: 'yes'
- name: heredity-attached-under-nominal-budget
