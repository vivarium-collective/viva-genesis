schema_version: 4
name: og-33-chemically-coupled-growth-and-division
investigation: origins-of-life-vent
created: '2026-10-18'
phase: Evaluate
status: ran
design_status: approved
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
verdict: qualified
evidence_tier: mechanistic_prediction
title: Chemically Coupled Growth and Division
gate_reason: >-
  Gate D (reproduction and heredity), first half: growth and division. Building on study 32's
  self-maintaining protocell, the test is whether the compartment grows and divides as a consequence of its
  own chemistry - membrane area increasing from metabolism-supplied amphiphiles until a physical shape
  instability splits it - rather than by an imposed division rule, and whether the daughters are viable
  (resume self-maintenance). Division is judged at a MEASURED critical-geometry threshold (area-doubling
  budding, grounded in the hanczyc / budin growth-division geometries), not a tuned event; the richer
  coarse-grained membrane mechanics (viva-md-membrane) is tracked as a budgeted follow-up (og-33a), not a
  buried caveat. The gate half is met only if, at input fluxes held equal to a matched null (growth decoupled
  from metabolism, or an imposed-division-rule control), growth and division follow from metabolic flux plus
  membrane physics and the daughters resume self-maintenance. Guardrail: the metabolism is the sustained A1
  carbon-fixing network, not autocatalytic (A2 refuted under vent conditions) - growth is paid for by carbon
  fixation, not chemical self-amplification. RESULT: growth and division are metabolism-driven (division rate
  scales with metabolic flux; the growth-decoupled null is flux-independent), division triggers at the
  measured area-doubling geometry (not imposed), and daughters are viable - verdict qualified (the
  measurable criterion is met on the Option-B measured-geometry first cut).
claim: >-
  The protocell grows from its own metabolic amphiphile production and divides at a physically-grounded,
  measured area-doubling geometry - yielding viable daughters that resume self-maintenance - rather than by
  an imposed rule. Division rate scales with metabolic flux (coupled) while a growth-decoupled null is
  flux-independent and an imposed-division null divides on a timer; the metabolism-coupled arm beats both
  matched nulls at equal feeds, and daughters are viable only because they resume the study-32
  self-maintenance criterion (integrity plus benefit over the no-membrane ablation). The verdict is qualified:
  the criterion is met on the measured-geometry first cut (Option B); full coarse-grained membrane mechanics
  (Option A, og-33a) is the budgeted follow-up. The metabolism is the sustained A1 carbon-fixing network (not
  autocatalytic), so growth is funded by carbon fixation, not self-amplification.
question: >-
  Can a self-maintaining protocell grow and divide as a consequence of its own chemistry - membrane area and
  content increasing from metabolism until a physical instability splits it - rather than by an imposed
  division rule, and are the daughters viable?
hypothesis: >-
  Metabolism-supplied amphiphiles grow the membrane; as area outpaces volume the compartment reaches a shape
  instability and divides at a measured critical-geometry threshold, partitioning contents; division rate
  scales with metabolic flux and the daughters re-enter self-maintenance. If division needs an imposed event,
  or the daughters cannot resume self-maintenance, no emergent growth/division is claimed.
experiment: >-
  Couple study-32's self-maintaining protocell to membrane growth from the metabolic amphiphile flux; grow
  membrane area until a measured area-doubling budding geometry triggers division; partition contents to
  daughters and test whether each daughter resumes the study-32 self-maintenance criterion - all against a
  matched null (growth decoupled from metabolism, or an imposed-division rule) at input fluxes held equal,
  reporting an imposed-rule outcome honestly if that is the result.
builds_on: [31, 32]
plan_id: 33
handoff:
  emits:
  - {to: 34, provides: [dividing protocell population, daughter compartments, division events, inherited content partition]}
  receives:
  - {from: 32, requires: [self-maintaining compartment, membrane-integrity dynamics, composition-informed permeability, standing metabolite pool]}
proposed_mechanisms:
- membrane growth from the metabolic amphiphile flux (area increasing with metabolic flux)
- division at a MEASURED critical-geometry threshold (area-doubling budding instability), no imposed event
- content partitioning to daughters, each tested for resumed self-maintenance (viability)
- division rate scaling with metabolic flux vs a growth-decoupled / imposed-rule control at equal feeds
proposed_models_methods:
- 'Membrane growth from the metabolic flux + division via a MEASURED area-doubling budding geometry  [Option B / first cut; grounded in hanczyc/budin growth-division geometries]'
- 'Coarse-grained membrane mechanics for division (viva-md-membrane)  [to-build; the richer follow-on, tracked as og-33a in discovery_implications - NOT over-committed here]'
- 'study-32 self-maintaining protocell (real A1 reaction universe + MD-informed membrane) coupled to the GrowthDivisionProcess  [in-workspace]'
- division-rate vs flux slope + daughter-viability across a feed sweep
- measured growth-division geometry / critical-radius benchmarks for independent validation (evidence standard #6)
model_approach:
  prose: >-
    Study 33 asks whether a protocell can reproduce without being told to. Membrane area grows from the
    amphiphiles the metabolism makes; as area outpaces the enclosed volume the vesicle reaches the budding
    instability and splits - and the split happens at a critical geometry taken from measured growth-division
    experiments (area roughly doubles before scission), not a threshold chosen to make division occur. The
    hard rules are the campaign's evidence standard: input fluxes are held equal to a matched null (growth
    decoupled from metabolism, or an imposed-division rule), so emergent growth/division is a margin over that
    control, not an artifact; and daughters count as viable only if they resume the study-32 self-maintenance
    criterion, not merely form. Division geometry is Option B (a measured area-doubling threshold), chosen as
    the first cut; full coarse-grained membrane mechanics (viva-md-membrane) is tracked as a budgeted
    follow-up (og-33a), so the to-build membrane tool is not over-committed to mechanics up front.
tools:
- {id: viva-fipy, build_status: exists, role: pore fields + compartment transport (via study 30/32)}
- {id: viva-kinetics, build_status: in-workspace, role: study-29 network kinetics inside the compartment}
- {id: viva-md-membrane, build_status: to-build, role: coarse-grained membrane mechanics for division (the richer Option-A follow-on og-33a; first cut uses a measured area-doubling geometry)}
contract:
  face:
    inputs:
      external_co2_supply: {_type: float, _units: molar/second, _min: 0.0}
      external_h2_supply: {_type: float, _units: molar/second, _min: 0.0}
    outputs:
      membrane_area: {_type: float, _units: nanometer**2, _min: 0.0}
      reduced_volume: {_type: float, _units: dimensionless, _min: 0.0}
      division_rate: {_type: float, _units: 1/second, _min: 0.0}
      daughter_viable: {_type: float, _units: dimensionless, _min: 0.0}
  conditions:
  - kind: invariant
    name: equal_input_fluxes_vs_null
    expr: external feed fluxes are held equal to the matched null (growth-decoupled or imposed-division control); emergent growth/division is the margin over it
  - kind: invariant
    name: no_imposed_division
    expr: division follows from the area-doubling budding instability at a measured critical-geometry threshold, with no imposed division event
  - kind: invariant
    name: division_geometry_measured
    expr: the critical-geometry threshold (area-doubling budding) is taken from measured growth-division geometries (hanczyc/budin), not tuned to force division
  - kind: invariant
    name: daughters_resume_self_maintenance
    expr: a daughter is viable only if it resumes the study-32 self-maintenance criterion (production >= degradation)
  - kind: invariant
    name: metabolism_is_A1_not_autocatalytic
    expr: the enclosed metabolism is the sustained A1 carbon-fixing network; growth is funded by carbon fixation, not autocatalytic self-amplification (A2 refuted)
  note: >-
    Consumes the 32->33 bundle; emits the 33->34 bundle. Division is Option B (a MEASURED area-doubling
    geometry); coarse-grained membrane mechanics (viva-md-membrane) is a tracked follow-up (og-33a), not a
    buried caveat.
behavior_tests:
- name: receives-32-handoff-bundle
  classification: secondary
  description: Study 33 consumes study 32's self-maintaining protocell (the real A1 reaction universe +
    MD-informed membrane) as the substrate the growth/division layer runs on.
  measure: {kind: observable, detail: og_33 composite wires the og_32 protocell + GrowthDivisionProcess}
  pass_if: {op: threshold, detail: composite builds + runs on the study-32 protocell}
  requires_simulation: 'yes'
- name: growth-from-metabolism
  classification: primary
  description: Membrane area grows from metabolism-supplied amphiphiles - division rate increases with
    metabolic flux - versus a growth-decoupled control (fixed external amphiphile supply) at equal feeds.
  measure: {kind: observable, detail: division_rate vs net carbon flux, coupled vs growth-decoupled null}
  pass_if: {op: threshold, detail: coupled division rate rises with flux (slope > 0) while decoupled is flat}
  requires_simulation: 'yes'
- name: division-at-measured-geometry
  classification: primary
  description: Division occurs at a measured area-doubling budding geometry with no imposed division event.
  measure: {kind: observable, detail: divisions trigger at the measured area-doubling threshold, not a timer}
  pass_if: {op: threshold, detail: division triggers at the measured geometry, no imposed event}
  requires_simulation: 'yes'
- name: daughters-viable
  classification: primary
  description: Daughters resume the study-32 self-maintenance criterion (production >= degradation) across the
    flux sweep - division yields viable daughters, not merely fragments.
  measure: {kind: observable, detail: daughter_viable across the coupled feed sweep}
  pass_if: {op: threshold, detail: daughters resume self-maintenance (viable)}
  requires_simulation: 'yes'
- name: beats-null-growth-decoupled-or-imposed
  classification: primary
  description: Emergent growth/division (metabolism + geometry) is compared against the matched null - growth
    decoupled from metabolism, or an imposed-division-rule control - at input fluxes held equal, so emergence
    is a margin over the control.
  measure: {kind: observable, detail: coupled division rate vs flux-independent decoupled/imposed nulls, equal feeds}
  pass_if: {op: threshold, detail: metabolism-coupled growth/division exceeds the matched null}
  requires_simulation: 'yes'
- name: handoff-33-to-34-complete
  classification: secondary
  description: The study emits the 33->34 bundle - a dividing protocell with division events and the inherited
    content partition - for study 34 (heredity & selection).
  measure: {kind: observable, detail: division events + daughter compartments available to study 34}
  pass_if: {op: threshold, detail: dividing-protocell handoff available}
  requires_simulation: 'yes'
decision_test: >-
  At input fluxes held equal to a matched null (growth decoupled from metabolism, or an imposed-division-rule
  control), growth and division must follow from metabolic flux plus membrane physics - division triggering at
  a MEASURED critical-geometry (area-doubling) threshold with no imposed event - AND the daughters must be
  viable (resume the study-32 self-maintenance criterion). Failing either (division only when imposed, or
  non-viable daughters) is a reported negative, not tuned (evidence standard #6, #8). Division geometry is a
  measured threshold, not a value chosen to force division.
findings:
- id: og33-grows-and-divides-or-imposed
  kind: computational
  status: confirms
  statement: >-
    At equal feeds vs the matched nulls, the protocell grows from its own metabolic amphiphile production and
    divides at a measured area-doubling budding geometry with no imposed event. Division RATE scales with
    metabolic flux in the coupled arm (0.0125 -> 0.0500 as net carbon flux 3.36e-4 -> 1.16e-3; slope > 0)
    while the growth-decoupled null is flux-INDEPENDENT (slope ~ 0) and the imposed-division null divides on a
    timer (rate ~0.044) regardless of geometry. So growth/division is metabolism-driven and beats both matched
    nulls - qualified (met on the measured-geometry first cut, Option B). Guardrail: growth is funded by the
    sustained A1 carbon-fixing network, not autocatalysis.
  evidence: {from_test: division-at-measured-geometry}
  expected: {cites: [hanczyc2003experimental, budin2012concentration]}
- id: og33-daughters-viable
  kind: computational
  status: confirms
  statement: >-
    Daughters resume the study-32 self-maintenance criterion (net amphiphile production >= degradation) across
    the flux sweep (daughter_viable = 1.0) - division is counted as reproduction because the daughters are
    viable (resume self-maintenance), not merely formed.
  evidence: {from_test: daughters-viable}
  expected: {cites: [zhu2012photochemically, natchem2023osmoticgrowth]}
- id: og33-division-geometry-measured
  kind: methodological
  status: confirms
  statement: >-
    Division is triggered at a MEASURED area-doubling budding geometry (division_ratio 2.0; a proposed_input
    grounded in the hanczyc/budin growth-division geometries), not a tuned event - the coupled and
    growth-decoupled arms both use the geometry, and only the imposed-division control divides on a timer.
    Full coarse-grained membrane mechanics (viva-md-membrane) is the gold-standard follow-on (og-33a) that
    would re-test division under resolved membrane physics rather than a measured geometric criterion.
  evidence: {from_test: division-at-measured-geometry}
limitations:
- >-
  Division mechanism = Option B, chosen as the first cut: a MEASURED area-doubling budding geometry
  (division_ratio 2.0) grounded in the hanczyc/budin growth-division geometries - a labelled proposed_input,
  NOT a value tuned to force division; only the measured area-doubling SHAPE is claimed. Option A (full
  coarse-grained membrane mechanics via viva-md-membrane, deriving the division instability from resolved
  membrane bending/tension) is a heavier, to-build closure tracked as a compute-budgeted follow-up (og-33a)
  in discovery_implications, not a hidden caveat.
- >-
  Growth dynamics use declared model rate constants (amphiphile-to-area coupling, membrane degradation, the
  flux-to-amphiphile fraction eta, and an EMA time constant that lets amphiphile supply track the SUSTAINED
  metabolic flux rather than the CSTR ignition transient). These set the TIMESCALE of a bounded run, not the
  decision - the decision rests on the qualitative signal (coupled division rate scales with flux; the
  growth-decoupled null is flux-independent; daughters viable), which is robust to the constants. Enclosed
  volume is modelled as lagging area (the physical driver of budding), not resolved; daughter viability is the
  measurable self-maintenance criterion, not strict autopoietic closure. The enclosed metabolism is the
  sustained A1 carbon-fixing network, not autocatalysis (A2 refuted under vent conditions). An imposed-rule or
  non-viable-daughter outcome would be an accepted negative, reported not tuned.
discovery_implications:
  resolved_uncertainties:
  - 'Division-mechanism scope, resolved by Eran (via coordinator): chosen = Option B - division at a MEASURED
    critical-geometry (area-doubling budding) threshold, grounded in the hanczyc/budin growth-division
    geometries. Tractable and falsifiable, and it keeps the to-build viva-md-membrane tool from being
    over-committed to mechanics up front. Deferred = Option A - full coarse-grained membrane mechanics
    (viva-md-membrane) deriving the division instability from resolved membrane physics; tracked as the
    follow-up below, not buried as a limitation. Separately, the OSMOTIC pressure-driven volume-threshold
    division route (OsmoticGrowthDivisionProcess) is the COMPLEMENTARY division mechanism in the workspace;
    study 33 tests the amphiphile-geometry route, not the osmotic one.'
  remaining_uncertainties:
  - Whether full coarse-grained membrane mechanics (Option A) would move the growth/division verdict versus
    the measured area-doubling threshold (Option B) - i.e. whether the measured geometric criterion is
    faithful enough to the real membrane shape instability at vent composition.
  followup_study_proposals:
  - id: og-33a-cg-membrane-mechanics-division
    title: Coarse-grained membrane-mechanics division (gold-standard viva-md-membrane)
    motivation: >-
      Study 33 takes growth/division on an Option-B first cut (a measured area-doubling geometry). Option A -
      coarse-grained membrane mechanics via viva-md-membrane deriving the division shape instability from
      resolved membrane physics - is the gold-standard test of whether the growth/division verdict holds under
      resolved mechanics rather than a measured geometric criterion.
    hypothesized_mechanism: >-
      Composition and area loading -> coarse-grained membrane bending/tension -> shape instability and
      scission, replacing the measured area-doubling threshold with a mechanics-resolved division event.
    compute_budget_note: Heavy coarse-grained MD per division geometry; compute-budget gated - scheduled when GPU budget allows.
    status: proposed
