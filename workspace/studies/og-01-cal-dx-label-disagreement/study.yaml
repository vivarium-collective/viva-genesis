schema_version: 4
name: og-01-cal-dx-label-disagreement
title: Why do the empirical and Butler-Volmer classes disagree on the limitation label?
status: planned
design_status: drafted
simulation_status: not_run
study_type: diagnostic
proposed: true
seeded_from:
  study: og-01-cal-electrochemistry
question: >-
  og-01-cal's gate failed because the empirical and Butler-Volmer classes agree on the dominant
  limitation label on only 47% of the region both call favorable. Is that disagreement a real
  structural difference (the empirical single Michaelis drive genuinely lumps electrical and catalytic
  limitation, and its substrate Michaelis constant introduces a transport limit the cell physics does
  not have), or an avoidable artifact of binning / threshold placement in the label assignment?
objective: >-
  Isolate the source of the cross-class disagreement: decompose the empirical Michaelis drive against
  the Butler-Volmer overpotential terms point by point; test whether re-binning or a shared label
  threshold changes agreement; attribute the residual disagreement to a named model-structure cause.
baseline:
- name: Electrochemical interface — both classes, og-01-cal canonical grid
  composite: viva_genesis.composites.electrochemical_interface.electrochemical_carbon_fixation
  params: {}
proposed_acceptance_criteria:
- The disagreement is attributed to a specific, named cause (structural lumping vs binning/threshold
  artifact), with the point-by-point evidence that distinguishes them.
- If structural, the mechanism by which the empirical drive mislabels is stated; if artifact, the
  corrected agreement under a defensible shared labelling is reported.
